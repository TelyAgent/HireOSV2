A.saveJobField = function(jobId, field, el){
  const j = state.jobs[jobId]; if(!j) return;
  const raw = el.value.trim(), old = String(j[field]==null?'':j[field]);
  const reject = msg=>{ el.value = el.dataset.orig; toast(msg, 'error'); };
  if(field==='headcount'){
    const n = Number(raw);
    if(!Number.isInteger(n) || n<1) return reject('Headcount must be a whole number of 1 or more.');
    j.headcount = n;
  } else {
    if(!raw) return reject((field==='level'?'Level':'Location')+' is required — it can’t be empty.');
    j[field] = raw;
  }
  const now = String(j[field]);
  el.value = now; el.dataset.orig = now;
  if(field==='level' || field==='location') el.style.width = Math.max(10, now.length+1)+'ch';
  reqRefreshUI(jobId);
  if(now===old) return;
  j.updatedAt = nowISO();
  (state.activity[jobId] = state.activity[jobId]||[]).unshift({at:nowISO(), actor:state.currentUserId, text:`Updated ${field}: ${old||'—'} → ${now}.`});
  toast('Saved', 'success');
};

function groupSections(blocks){

function renderDocBlock(jobId, audience, b, mode){
  if(blockLevel(b)==='confidential' && !jobAccess(jobId).sensitive){
    return `<div class="doc-block kind-${b.kind} lvl-confidential locked" data-block-id="${b.id}" data-job="${jobId}" data-level="confidential"><div class="blk-body"><div class="blk-locked"><span class="material-icons-o">lock</span>Confidential content is hidden — you don’t have access to sensitive information.</div></div>${levelTagHtml('confidential')}</div>`;
  }
  const suggestions = pendingSuggestionsFor(jobId, audience, b.id);
  let inner = '';
  const req = b.requirementRefs && b.requirementRefs[0] ? (REQUIREMENTS[jobId]||[]).find(r=>r.id===b.requirementRefs[0]) : null;

  function withMarks(text, forListItem){
    let html = esc(text);
    const activeSug = suggestions.find(s=> s.oldText && text.indexOf(s.oldText)>=0);
    if(activeSug){
      html = esc(text).replace(esc(activeSug.oldText), `<span class="del">${esc(activeSug.oldText)}</span><span class="ins">${esc(activeSug.newText)}</span><span class="mark-badge ${activeSug.author==='ai'?'ai':'human'}">${activeSug.author==='ai'?'AI':'Maya'}</span>`);
    }
    return html;
  }

  const editable = mode==='editing' && suggestions.length===0;
  const editAttrs = editable ? ` contenteditable="true" spellcheck="true" onblur="A.editDocBlock('${jobId}','${audience}','${b.id}',this.innerText)"` : '';
  if(b.kind==='h2') inner = `<h2 class="docH"${editAttrs}>${withMarks(b.text)}</h2>`;
  else if(b.kind==='h3') inner = `<h3 class="docH3"${editAttrs}>${withMarks(b.text)}</h3>`;
  else if(b.kind==='p') inner = `<p class="docP${b.role==='requirement'?'':' presentation-only'}"${editAttrs}>${withMarks(b.text)}</p>`;
  else if(b.kind==='ul') inner = `<ul class="docList"${editAttrs}>${b.text.map(t=>`<li>${withMarks(t)}</li>`).join('')}</ul>`;

  const lv = blockLevel(b);
  const structural = mode==='editing';
  const isHead = b.kind==='h2';
  const starterReq = !isHead && REQ_ITEMS.some(i=>i.starter===blockPlainText(b));
  const starter = starterReq || (!isHead && REQ_SUGGEST.some(i=>i.starter===blockPlainText(b)));
  return `<div class="doc-block kind-${b.kind}${isHead?' sec-head':''}${starter?' req-unfilled':''} lvl-${lv}" data-block-id="${b.id}" data-job="${jobId}" data-level="${lv}">

    <div class="blk-body">${inner}${starter?`<span class="req-pill${starterReq?'':' warn'}" contenteditable="false">${starterReq?'Required — replace this text':'Replace this text'}</span>`:''}${b.aiDraft?`<span class="req-pill ai" contenteditable="false" title="Drafted by Copilot from this job's data. Edit it, or click to keep as is."  onclick="A.keepAiDraft('${jobId}','${b.id}',this)"><span class="material-icons-o">auto_awesome</span>AI draft · Keep</span>`:''}</div>
    ${structural ? `<button type="button" class="blk-del" title="${isHead?'Delete section':'Delete block'}" onclick="A.${isHead?'deleteSection':'deleteBlock'}('${jobId}','${b.id}')"><span class="material-icons-o">delete_outline</span></button>` : ''}
    ${levelTagHtml(lv, structural ? {onclick:`A.openLevelMenu(event,'${jobId}','${b.id}')`} : {})}
    ${suggestions.some(s=>s.status==='stale')?`<span class="stale-flag"><span class="material-icons-o" style="font-size:11px;">restore</span>Needs refresh</span>`:''}
  </div>`;
}
/* drag the left edge of the side panel to resize it (width is remembered) */
(function(){
  let drag = null;
  document.addEventListener('pointerdown', e=>{
    const h = e.target.closest && e.target.closest('.jw-side-resize'); if(!h) return;
    const side = h.closest('.jw-side'); if(!side) return;
    e.preventDefault(); drag = {side, h}; h.classList.add('is-dragging');
    document.body.style.cursor = 'ew-resize'; document.body.style.userSelect = 'none';
  });
  document.addEventListener('pointermove', e=>{
    if(!drag) return;
    const right = drag.side.getBoundingClientRect().right;
    const w = Math.max(300, Math.min(Math.round(window.innerWidth*.6), Math.round(right - e.clientX)));
    drag.side.style.width = w+'px';
  });
  document.addEventListener('pointerup', ()=>{
    if(!drag) return;
    try{ localStorage.setItem('hireos-jw-side-width', parseInt(drag.side.style.width,10)); }catch(e){}
    drag.h.classList.remove('is-dragging'); drag = null;
    document.body.style.cursor = ''; document.body.style.userSelect = '';
  });
})();

/* ---------------- Selection handling & floating toolbar ---------------- */
function bindSelectionHandlers(jobId){
  const docEl = document.getElementById('jw-doc');
  if(!docEl) return;
  docEl.addEventListener('mouseup', ()=>{
    setTimeout(()=>{
      const sel = window.getSelection();
      const txt = sel && sel.toString().trim();
      const slot = document.getElementById('sel-toolbar-slot');
      if(slot) slot.innerHTML='';
      if(!txt || txt.length<2 || state.wsMode==='viewing') return;
      if(!sel.anchorNode || !docEl.contains(sel.anchorNode)) return;
      const range = sel.getRangeAt(0);
      const rect = range.getBoundingClientRect();
      const wrapRect = document.getElementById('doc-wrap').getBoundingClientRect();
      const blockEl = sel.anchorNode.parentElement ? sel.anchorNode.parentElement.closest('.doc-block') : null;
      const blockId = blockEl ? blockEl.getAttribute('data-block-id') : null;
      showSelToolbar(rect, wrapRect, txt, blockId, jobId);
    }, 5);
  });
}
function showSelToolbar(rect, wrapRect, text, blockId, jobId){
  const slot = document.getElementById('sel-toolbar-slot');
  if(!slot) return;
  const top = rect.top - wrapRect.top - 44 + document.getElementById('doc-wrap').scrollTop;
  const left = Math.max(0, rect.left - wrapRect.left);
  const blk = findBlock(jobId, state.wsAudience, blockId);
  if(blk && blockLevel(blk)==='confidential'){
    slot.innerHTML = `<div class="sel-toolbar" style="position:absolute;top:${Math.max(4,top)}px;left:${left}px;">

    </div>`;
    document.getElementById('doc-wrap').style.position='relative';
    state.__pendingSelText = text; state.__pendingSelBlock = blockId;
    return;
  }
  slot.innerHTML = `<div class="sel-toolbar" style="position:absolute;top:${Math.max(4,top)}px;left:${left}px;">
    <button onclick="A.askCopilotFromSelection('${blockId}')"><span class="material-icons-o">auto_awesome</span>Ask Copilot</button>

  </div>`;
  // reposition wrapper relative
  document.getElementById('doc-wrap').style.position='relative';
  state.__pendingSelText = text; state.__pendingSelBlock = blockId;
}

   A separate, parallel entry point to the selection-toolbar Copilot above.
   Does not replace or alter any of the existing suggestion/comment/changes
   mechanics — it is a new persistent chat+voice surface for (a) drafting a
   brand-new job from a spoken/typed description, and (b) generating content

function setupGeminiResize(overlay){
  const drawer = overlay.querySelector('.gemini-drawer-shell');
  const handle = overlay.querySelector('.gemini-resize-handle');
  if(!drawer || !handle) return;
  drawer.classList.toggle('gm-has-ws', geminiWsOpen());
  const MODES = {
    chat:{key:'hireos-gemini-width', prop:'--gemini-width', min:360, max:()=>Math.min(900,Math.round(window.innerWidth*.85))},
    ws:{key:'hireos-gemini-width-ws', prop:'--gemini-width-ws', min:760, max:()=>Math.round(window.innerWidth*.94)},
  };
  const cur = ()=>MODES[drawer.classList.contains('gm-has-ws')?'ws':'chat'];
  Object.values(MODES).forEach(m=>{ const sv = Number(localStorage.getItem(m.key)); if(sv) drawer.style.setProperty(m.prop, Math.max(m.min, Math.min(sv, m.max()))+'px'); });
  let dragging = false;
  const onMove = e => {
    if(!dragging) return;
    const m = cur();
    drawer.style.setProperty(m.prop, Math.max(m.min, Math.min(m.max(), window.innerWidth - e.clientX))+'px');
  };
  const onUp = () => {
    if(!dragging) return;
    dragging = false;
    handle.classList.remove('is-dragging');
    localStorage.setItem(cur().key, parseInt(getComputedStyle(drawer).width,10));
    document.body.style.cursor='';
    document.body.style.userSelect='';
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  };
  handle.addEventListener('pointerdown', e => {
    e.preventDefault();
    dragging = true;
    handle.classList.add('is-dragging');
    document.body.style.cursor='ew-resize';
    document.body.style.userSelect='none';
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp, {once:true});
  });
}

function geminiDetectMethod(text, allowNumeric){
  const t = String(text||'').trim().toLowerCase().replace(/[.!]+$/,'');
  if(allowNumeric && /^[123][.)]?$/.test(t)) return {'1':'upload','2':'link','3':'form'}[t[0]];
  if(t==='upload' || /upload (a |the )?(reference )?(template|jd)|upload template\s*\/\s*jd/.test(t)) return 'upload';
  if(/paste a jd link|jd link|paste (a )?link/.test(t)) return 'link';
  if(/traditional form|^(use |open |fill )?(the |a |in )?(job )?form$/.test(t)) return 'form';
  return null;
}
function geminiDetectLocation(text){
  const t = String(text||'').toLowerCase();
  if(/ho chi minh|hcmc|saigon|sài gòn/.test(t)) return {long:'Ho Chi Minh City, VN', short:'HCMC'};
  if(/hanoi|hà nội/.test(t)) return {long:'Hanoi, VN', short:'Hanoi'};
  if(/singapore/.test(t)) return {long:'Singapore', short:'Singapore'};
  return null;
}
function geminiParseAnswers(text){
  const t = String(text||'').trim();
  let parts = t.split(/\r?\n+/).map(x=>x.replace(/^\s*(?:[1-3][.)]|[-•*])\s*/,'').trim()).filter(Boolean);
  if(parts.length<3){ const m = t.split(/\s*\b[1-3][.)]\s+/).map(x=>x.trim()).filter(Boolean); if(m.length>=3) parts = m; }
  if(parts.length>=3) return {'Business problem':parts[0], 'Success goals':parts[1], 'Core hard skills':parts.slice(2).join('; ')};
  return {'Business problem':t, 'Success goals':'', 'Core hard skills':''};
}
function geminiTitleCase(s){ return String(s||'').replace(/[-_+]+/g,' ').replace(/\s+/g,' ').trim().replace(/\b([a-z])/g,c=>c.toUpperCase()); }
function geminiFileStem(name){ return geminiTitleCase(String(name||'').replace(/\.[a-z0-9]+$/i,'').replace(/\b(jd|template|copy|final|v\d+)\b/gi,'').replace(/\d{3,}/g,'')); }
function geminiSlugTitle(url){
  try{
    const u = new URL(url);
    const seg = u.pathname.split('/').filter(Boolean).reverse().find(x=>/[a-z]{3,}/i.test(x)&&!/^(jobs?|careers?|positions?|apply|view)$/i.test(x));
    return seg ? geminiTitleCase(seg.replace(/\.(html?|php|aspx?)$/i,'').replace(/\b\d{3,}\b/g,'')) : '';
  }catch(e){ return ''; }
}
function geminiExtractFromText(text){
  const lines = String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const out = {title:'', responsibilities:[], must:[], pref:[]};
  let sec = null;
  const head = l=>{
    const x = l.replace(/[:：]$/,'').toLowerCase();
    if(/^(responsibilit|what you.?ll do|duties|key tasks)/.test(x)) return 'resp';
    if(/^(requirements?|qualifications?|must.?have|what we.?re looking for|about you)/.test(x)) return 'must';
    if(/^(nice.?to.?have|preferred|bonus|good to have)/.test(x)) return 'pref';
    if(/^(about|overview|benefits|compensation|salary|perks|why join)/.test(x)) return 'other';
    return null;
  };
  lines.forEach((l,i)=>{
    const bullet = l.match(/^([-•*·]|\d+[.)])\s+(.*)$/);

function geminiGenerateCreateDraft(prompt){
  const p = prompt.toLowerCase();
  const KB = [
    { test:/growth/, title:'Growth Lead', department:'Growth',
      responsibilities:['Translate business goals into concrete growth execution plans','Build growth infrastructure (SEO, analytics, KOL/affiliate network) from zero','Partner with product/engineering to turn features into growth mechanisms'],
      must:['Track record building growth operations from 0 to 1','Comfortable setting up analytics, attribution and reporting from scratch'],
      pref:['Experience building a KOL/creator or affiliate network'] },
    { test:/backend|distributed|platform|engineer/, title:'Senior Backend Engineer', department:'Engineering',
      responsibilities:['Own core backend services and their reliability at scale','Design for distributed-systems tradeoffs (consistency, availability, latency)','Partner with product to scope and ship 0→1 initiatives'],
      must:['5+ years of backend engineering experience','Experience with distributed systems at meaningful scale'],
      pref:['Track record of owning a project from ambiguity to launch'] },
    { test:/financ|cpa|accounting/, title:'Finance Manager', department:'Finance',
      responsibilities:['Own monthly close and management reporting','Partner with department heads on budget and forecasting','Maintain audit-ready controls documentation'],
      must:['5+ years of finance management experience','Professional accounting qualification or equivalent'],
      pref:['Experience with multi-entity or cross-border finance'] },
    { test:/\bhr\b|recruit|people/, title:'HR Lead', department:'People',
      responsibilities:['Own full-cycle recruiting from JD to offer','Build HR infrastructure (onboarding, policy, compliance) from scratch','Partner directly with leadership on hiring decisions'],
      must:['Real 0-to-1 experience building a team or function from nothing','Strong written and spoken English'],
      pref:['Experience at a recruiting agency or executive search firm'] },
    { test:/design|ux|ui\b/, title:'Product Designer', department:'Design',
      responsibilities:['Lead end-to-end design for core product flows','Partner with PM and engineering on discovery and delivery','Maintain and extend the design system'],
      must:['5+ years of product design experience','Portfolio with shipped work at comparable scope'],
      pref:['Experience partnering closely with engineering'] },
  ];
  const match = KB.find(k=>k.test.test(p));
  const summary = `Drafted from: “${prompt}”.`;
  if(match) return Object.assign({summary}, match);
  const cleaned = prompt.replace(/^(we need|we're looking for|looking for|hiring)\s+(an?|the)?\s*/i,'').trim();
  const title = trunc(cleaned.charAt(0).toUpperCase()+cleaned.slice(1), 60).replace(/[.,;:!?…]+$/,'');
  return {
    title: title || 'New Role', department:'General', summary,
    responsibilities:['Own the scope described in your request end-to-end','Partner cross-functionally to turn this into a working process','Report progress and results on a regular cadence'],
    must:['Relevant prior experience matching this description','Strong communication skills'],
    pref:['Comfortable operating with ambiguity'],
  };
}
function geminiGenerateEditResponse(prompt, ctx){
  const p = prompt.toLowerCase();
  if(ctx.selText){
    if(/concise|shorter|short/.test(p)) return shortenText(ctx.selText);
    if(/friendl|casual|less corporate|warm/.test(p)) return friendlyRewrite(ctx.selText);
    if(/remote/.test(p)) return ctx.selText.replace(/\.?$/,'') + '. Open to remote candidates, with flexibility on working-hours overlap.';
    return 'Here’s a revised version based on “'+prompt+'”:\n\n' + friendlyRewrite(ctx.selText);
  }
  return 'Added a new section based on your request: “'+prompt+'”. Review it below and insert it wherever fits — it’s appended to the end of the document by default.';
}
function shortenText(t){
  const words = t.split(/\s+/);
  if(words.length<=8) return t;
  return words.slice(0, Math.max(6, Math.round(words.length*0.6))).join(' ').replace(/[,;:]+$/,'') + '.';
}
function friendlyRewrite(t){
  return t
    .replace(/\bMust have\b/i, 'You should have')
    .replace(/\bmust have\b/gi, 'should have')
    .replace(/\bis required\b/gi, 'would be great to have')
    .replace(/\bshall\b/gi, 'will') + ' (we care more about what you can do than a checklist match).';
}

function canonicalSuggestion(jobId, audience, blockId, selText, instruction){
  // Flagship demo: "Must have strong communication skills." -> specific, verifiable requirement (PRD/Brief §17.4)
  if(/strong communication skills/i.test(selText)){
    return {
      newText:'Can explain technical trade-offs clearly to non-technical stakeholders, supported by an example from a previous project.',
      explain:'I rewrote this as a requirement that can actually be verified in an interview or work sample, and kept it must-have. Whether it applies to this specific role is still yours to confirm.',
      reason:'Evidence expectation changes from unspecified to a concrete example; priority (must-have) is unchanged. This updates the linked requirement draft (req-102-comm) alongside the document text.',
      requirementRef:'req-102-comm',
    };
  }
  if(/b2b saas/i.test(selText)){
    return {
      newText:'2+ years building B2B SaaS platforms, with a named product and your specific contribution.',
      explain:'I made this easier to screen against a resume by asking for a named product and a specific contribution, while keeping it must-have as Maya requested.',
      reason:'Adds a verifiable evidence bar; does not change priority. Linked to req-102-b2b.',
      requirementRef:'req-102-b2b',
    };
  }
  if(/shorten/i.test(instruction||'')){
    const short = selText.split(' ').slice(0, Math.max(4, Math.ceil(selText.split(' ').length*0.6))).join(' ');
    return { newText: short + (short.endsWith('.')?'':'.'), explain:'Shortened while keeping the core requirement.', reason:'Wording simplified; no change to must-have/preferred or evaluation dimension.' };
  }
  if(/clarify/i.test(instruction||'')){
    return { newText: selText.replace(/\.$/,'') + ', with a specific example as evidence.', explain:'Added a concrete evidence expectation to reduce ambiguity.', reason:'Evidence standard clarified; priority unchanged.' };
  }
  return { newText: selText.replace(/\.$/,'') + ' (rewritten for clarity).', explain:'Here’s a clearer version of the selected text.', reason:'Wording clarified; no change to must-have/preferred or evaluation dimension.' };
}

function generateSuggestion(jobId, audience, blockId, selText, instruction){
  const c = canonicalSuggestion(jobId, audience, blockId, selText, instruction);
  const s = {
    id: uid('sug'), anchorBlock: blockId, status:'proposed', author:'ai', initiatedBy: state.currentUserId,
    createdAt: nowISO(), instruction: instruction||'Rewrite', oldText: selText, newText: c.newText, reason: c.reason, requirementRef: c.requirementRef||null,
  };
  getSuggestions(jobId, audience).push(s);
  return {s, explain:c.explain};
}

function closeFloatMenu(){ const m=document.getElementById('float-menu'); if(m) m.remove(); document.removeEventListener('mousedown', __floatOutside, true); }
function __floatOutside(e){ const m=document.getElementById('float-menu'); if(m && !m.contains(e.target)) closeFloatMenu(); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeFloatMenu(); });
function openFloatMenu(anchor, html, align){
  closeFloatMenu();
  const m = document.createElement('div'); m.id='float-menu'; m.className='float-menu'; m.innerHTML = html;
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  let left = align==='right' ? r.right-w : r.left;
  left = Math.max(8, Math.min(left, window.innerWidth-w-8));
  let top = r.bottom+6; if(top+h>window.innerHeight-8) top = Math.max(8, r.top-h-6);
  m.style.left = left+'px'; m.style.top = top+'px';
  setTimeout(()=>document.addEventListener('mousedown', __floatOutside, true), 0);
  applyLocale();
}

/* two-level drag & drop: sections move as a whole; blocks move within / between sections */
let __drag = null;
function clearDropMarks(){ document.querySelectorAll('.drop-before,.drop-after').forEach(n=>n.classList.remove('drop-before','drop-after')); }
function sectionIds(d, headId){
  const i = d.blocks.findIndex(b=>b.id===headId), ids = [headId];
  for(let k=i+1; k<d.blocks.length && d.blocks[k].kind!=='h2'; k++) ids.push(d.blocks[k].id);
  return ids;
}
function beginDrag(e, type, ids, el){
  __drag = {type, ids};
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ids[0]);
  if(el && e.dataTransfer.setDragImage) e.dataTransfer.setDragImage(el, 24, 16);
  setTimeout(()=>{ if(type==='section' && el) el.classList.add('dragging'); else ids.forEach(id=>{ const n = document.querySelector('.doc-block[data-block-id="'+id+'"]'); n && n.classList.add('dragging'); }); }, 0);
}
A.sectionDragStart = function(e, headId){
  const d = getDraft(state.wsCurrentJob, state.wsAudience);
  if(d.blocks.findIndex(b=>b.id===headId)<0) return;
  beginDrag(e, 'section', sectionIds(d, headId), e.target.closest('.doc-section'));
};
A.blockDragStart = function(e, blockId){ beginDrag(e, 'block', [blockId], e.target.closest('.doc-block')); };
A.dragEnd = function(){ __drag = null; clearDropMarks(); document.querySelectorAll('.dragging').forEach(n=>n.classList.remove('dragging')); };
function bindBlockDnD(jobId){
  const docEl = document.getElementById('jw-doc'); if(!docEl) return;
  const target = e=>{
    if(!__drag) return null;
    if(__drag.type==='section'){
      const el = e.target.closest('.doc-section'); if(!el || el.classList.contains('headless') || __drag.ids.indexOf(el.dataset.sectionId)>=0) return null;
      const r = el.getBoundingClientRect(); return {el, id:el.dataset.sectionId, after:(e.clientY-r.top)>r.height/2};
    }
    const el = e.target.closest('.doc-block'); if(!el || __drag.ids.indexOf(el.dataset.blockId)>=0) return null;
    const r = el.getBoundingClientRect();
    return {el, id:el.dataset.blockId, after: el.classList.contains('sec-head') ? true : (e.clientY-r.top)>r.height/2};
  };
  docEl.addEventListener('dragover', e=>{
    const t = target(e); clearDropMarks();
    if(!t) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    t.el.classList.add(t.after ? 'drop-after' : 'drop-before');
  });
  docEl.addEventListener('drop', e=>{
    const t = target(e); if(!t){ A.dragEnd(); return; }
    e.preventDefault();
    const d = getDraft(jobId, state.wsAudience);
    const moving = __drag.ids.map(id=>d.blocks.find(b=>b.id===id)).filter(Boolean);
    const rest = d.blocks.filter(b=>__drag.ids.indexOf(b.id)<0);
    let at;
    if(__drag.type==='section'){
      const tids = sectionIds(d, t.id);
      const anchor = t.after ? tids[tids.length-1] : tids[0];
      at = rest.findIndex(b=>b.id===anchor); if(at<0){ A.dragEnd(); return; }
      if(t.after) at++;
    } else {
      at = rest.findIndex(b=>b.id===t.id); if(at<0){ A.dragEnd(); return; }
      if(t.after) at++;
    }
    rest.splice(at, 0, ...moving);
    d.blocks = rest; d.saveState = 'dirty';
    A.dragEnd(); renderRoute();
  });
  if(state.__focusBlock){
    const id = state.__focusBlock; state.__focusBlock = null;
    const n = document.querySelector('.doc-block[data-block-id="'+id+'"] [contenteditable="true"]');
    if(n){ n.focus(); const rg = document.createRange(); rg.selectNodeContents(n); const sl = window.getSelection(); sl.removeAllRanges(); sl.addRange(rg); n.scrollIntoView({block:'center'}); }
  }
}

A.decideApproval = function(jobId, action){
  const appr = state.approvals[jobId];
  const stepIdx = appr.steps.findIndex(s=>s.status==='active');
  const step = appr.steps[stepIdx];
  const doDecide = (reason)=>{
    if(action==='approve'){
      step.status='approved'; step.decidedAt=nowISO();
      const next = appr.steps[stepIdx+1];
      if(next){ next.status='active'; }
      else { appr.status='approved'; state.jobs[jobId].approvalStatus='approved'; }
    } else if(action==='request_changes'){
      step.status='changes_requested'; step.decidedAt=nowISO(); appr.status='changes_requested'; state.jobs[jobId].approvalStatus='changes_requested'; step.reason=reason;
    } else {
      step.status='rejected'; step.decidedAt=nowISO(); appr.status='rejected'; state.jobs[jobId].approvalStatus='rejected'; step.reason=reason;
    }
    (state.activity[jobId]=state.activity[jobId]||[]).unshift({at:nowISO(), actor:state.currentUserId, text:(action==='approve'?'Approved':action==='request_changes'?'Requested changes on':'Rejected')+' step '+step.order+' ('+step.role+').'});
    renderRoute(); toast(action==='approve'?'Approved':action==='request_changes'?'Changes requested':'Rejected');
  };
  if(action==='approve'){ confirmDialog('Approve '+step.role+' step', 'This approves the exact candidate version above (revision '+appr.candidateRevision+'). Approving does not activate or publish it automatically.', 'Approve', ()=>doDecide()); }
  else {
    openModal(`<div class="modal-header"><h3 class="modal-title">${action==='reject'?'Reject':'Request changes'}</h3><button class="close-x" onclick="closeModal()"><span class="material-icons-o">close</span></button></div>

    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn ${action==='reject'?'btn-danger-solid':'btn-primary'}" onclick="closeModal();doDecideWrapper()">Confirm</button></div>`);
    window.doDecideWrapper = ()=>{ doDecide(document.getElementById('decision-reason')?document.getElementById('decision-reason').value:''); };
  }
};

A.confirmPublish = function(jobId){
  const j = state.jobs[jobId], d = getDraft(jobId,'internal');
  const vs = jdVersionsOf(jobId), prev = vs[vs.length-1] || null;
  if(prev && diffBlocks(prev.blocks, d.blocks).count===0){ toast('No changes since v'+prev.versionNo+'.', 'error'); return; }
  const note = ((document.getElementById('pub-note')||{}).value||'').trim();
  const channels = [];
  if((document.getElementById('ch-careers')||{}).checked) channels.push('Careers site');
  if((document.getElementById('ch-linkedin')||{}).checked) channels.push('LinkedIn Jobs');
  if(!channels.length){ toast('Choose at least one channel.', 'error'); return; }
  closeModal();
  j.publicationStatus = 'publishing'; renderRoute();
  setTimeout(()=>{
    if(d.saveState==='dirty'){ d.revision = (d.revision||1)+1; d.saveState = 'saved'; }
    const ver = makeJdVersion(jobId, d.blocks, {note, channels});
    (state.jdVersions[jobId] = state.jdVersions[jobId]||[]).push(ver);
    const ref = `${ensureJdCode(j)} v${ver.versionNo}`;
    channels.forEach(ch=>{
      const pubs = (state.publications[jobId] = state.publications[jobId]||[]);
      const live = pubs.find(x=>x.channel===ch && x.status==='published');
      if(live){ live.versionRef = ref; live.publishedAt = ver.publishedAt; }
      else pubs.push({id:uid('pub'), channel:ch, status:'published', publishedAt:ver.publishedAt, versionRef:ref, url:'https://careers.sendinglabs.com/jobs/'+ensureJdCode(j).toLowerCase()});
    });
    j.publicationStatus = 'published';
    (state.activity[jobId] = state.activity[jobId]||[]).unshift({at:ver.publishedAt, actor:state.currentUserId, text:`Published ${ver.id} to ${channels.join(' and ')}${note?' — '+note.replace(/[.!]+$/,''):''}.`});
    toast(`Published ${ver.id}`, 'success'); renderRoute();
  }, 700);
};

function diffSummaryHtml(diff, total){
  if(!diff) return `<div class="ver-chips"><span class="ver-chip add">${total} blocks</span><span class="tiny">in the first published version</span></div>`;
  const chips = [[diff.added.length,'added','add'],[diff.edited.length,'edited','edit'],[diff.removed.length,'removed','del'],[diff.level.length,'visibility changed','lvl']].filter(c=>c[0]);
  return `<div class="ver-chips">${chips.map(c=>`<span class="ver-chip ${c[2]}">${c[0]} ${c[1]}</span>`).join('')}${diff.reordered?'<span class="ver-chip lvl">reordered</span>':''}${!chips.length&&!diff.reordered?'<span class="tiny">No changes</span>':''}</div>`;
}

A.openVersionDiff = function(jobId, newNo, oldNo){
  closeModal();
  const vs = jdVersionsOf(jobId), nv = vs.find(x=>x.versionNo===newNo), ov = vs.find(x=>x.versionNo===oldNo); if(!nv||!ov) return;

  const list = (title, cls, items)=>items.length ? `<div class="ver-diff-group"><div class="eyebrow" style="margin-bottom:6px;">${title}</div>${items.join('')}</div>` : '';
  openDrawer(`<div class="drawer-header"><div><div class="eyebrow">${esc(nv.id.split('@')[0])}</div><h3 style="margin:2px 0 0;font-size:var(--fs-lg);">Compare v${oldNo} → v${newNo}</h3></div><button class="close-x" onclick="closeModal()"><span class="material-icons-o">close</span></button></div>

    ${diffSummaryHtml(diff, nv.blocks.length)}

    ${list('Removed','del',diff.removed.map(x=>`<div class="ver-diff del"><span class="material-icons-o">remove</span><div>${esc(blockText(x.block))}${sec(x.section)} ${levelTagHtml(blockLevel(x.block))}</div></div>`))}
    ${list('Edited','edit',diff.edited.map(x=>`<div class="ver-diff edit"><span class="material-icons-o">edit</span><div><span class="ver-old">${esc(x.before)}</span><br>${esc(x.after)}${sec(x.section)}</div></div>`))}
    ${list('Visibility changed','lvl',diff.level.map(x=>`<div class="ver-diff lvl"><span class="material-icons-o">visibility</span><div>${esc(x.text)}${sec(x.section)}<div class="tiny">${BLOCK_LEVELS[x.from].label} → ${BLOCK_LEVELS[x.to].label}</div></div></div>`))}

    ${!diff.count?'<div class="tiny">No differences.</div>':''}
    </div>
  </div>
  <div class="drawer-footer"><button class="btn btn-primary" onclick="closeModal()">Close</button></div>`, {wide:true});
};
A.restoreJdVersion = function(jobId, no){
  closeModal();
  const v = jdVersionsOf(jobId).find(x=>x.versionNo===no); if(!v) return;

/* =====================================================================
   AI MODELS (Settings → AI Models)
   ===================================================================== */
function pageAIModels(params, q){
  const tab = q.tab || 'catalog';
  const tabs = [
    {key:'catalog', label:'Model catalog'},
    {key:'policies', label:'Task policies'},
    {key:'compare', label:'Compare & evaluate'},
    {key:'usage', label:'Usage & cost'},
    {key:'activity', label:'Activity & versions'},
  ];
  let body = '';
  if(tab==='catalog') body = renderModelCatalog();
  else if(tab==='policies') body = renderTaskPolicies();
  else if(tab==='compare') body = renderCompareEvaluate();
  else if(tab==='usage') body = renderUsageCost();
  else body = renderModelActivity();

  document.getElementById('main-content').outerHTML = '<div class="main-inner flush" id="main-content"><div class="settings-shell">'+
    `<div class="settings-nav">${SETTINGS_NAV.map(g=>`<div class="settings-nav-group"><div class="snlabel">${g.group}</div>${g.items.map(it=>`<div class="settings-nav-item${it.key==='ai-models'?' active':''}" onclick="A.go('#/settings/${it.key}')">${it.label}</div>`).join('')}</div>`).join('')}</div>`+
    `<div class="settings-content" style="max-width:1040px;">
      <h2 class="section-title">AI Models<span class="scope-tag">Model admin • quality lead</span></h2>
      <div class="underline-tabs">${tabs.map(t=>`<div class="u-tab${tab===t.key?' active':''}" onclick="A.go('#/settings/ai-models?tab=${t.key}')">${t.label}</div>`).join('')}</div>
      ${body}
    </div>`+
    '</div></div>';
}
function renderModelCatalog(){
  return `<button class="btn btn-secondary btn-sm" style="margin-bottom:14px;" onclick="toast('Model connection reference added (demo)','success')"><span class="material-icons-o">add</span>Add model connection</button>
  ${MODELS.map(m=>`<div class="model-card">
    <div class="mc-top">
      <div><div style="font-weight:600;">${esc(m.name)}</div><div class="tiny">${esc(m.provider)} • region: ${esc(m.region)}</div></div>
      <span class="badge ${m.status==='enabled'?'badge-success':'badge-neutral'}">${m.status==='enabled'?'Enabled':'Disabled'}</span>
    </div>
    <div class="flex gap-6 flex-wrap" style="margin-bottom:6px;">${m.capabilities.map(c=>`<span class="tag">${c}</span>`).join('')}</div>
    ${m.disabledReason?`<div class="warning-inline" style="margin-bottom:8px;"><span class="material-icons-o">block</span>${esc(m.disabledReason)}</div>`:''}
    <div class="model-metric-grid">
      <div class="model-metric"><div class="mm-val">${m.priceKnown?m.priceIn:'Unknown'}</div><div class="mm-lbl">Price in</div></div>
      <div class="model-metric"><div class="mm-val">${m.priceKnown?m.priceOut:'Unknown'}</div><div class="mm-lbl">Price out</div></div>
      <div class="model-metric"><div class="mm-val">${m.p50}</div><div class="mm-lbl">P50 latency</div></div>
      <div class="model-metric"><div class="mm-val">${m.p95}</div><div class="mm-lbl">P95 latency</div></div>
      <div class="model-metric"><div class="mm-val">${m.accuracy}</div><div class="mm-lbl">Accuracy (sample)</div></div>
    </div>
    <div class="flex gap-8" style="margin-top:10px;">
      <button class="btn btn-text btn-sm" onclick="toast('Test call succeeded (demo)','success')">Test</button>
      ${!m.priceKnown?`<button class="btn btn-text btn-sm" onclick="toast('This provider does not support automatic price sync — use manual update.')">Price sync: Unsupported</button>`:`<button class="btn btn-text btn-sm" onclick="toast('Price sync scheduled nightly — last run succeeded','success')">Price sync: Scheduled</button>`}
    </div>
  </div>`).join('')}`;
}
function renderTaskPolicies(){
  return `<div class="card"><table class="data-table"><thead><tr><th>Task type</th><th>Primary model</th><th>Fallback</th><th>Preference</th><th>Notes</th><th></th></tr></thead>
  <tbody>${Object.keys(TASK_POLICIES).map(k=>{
    const p = TASK_POLICIES[k];
    return `<tr><td class="mono">${k}</td><td>${MODELS.find(m=>m.id===p.primary).name}</td><td>${p.fallback?MODELS.find(m=>m.id===p.fallback).name:'—'}</td><td>${p.preference}</td><td class="tiny">${esc(p.notes)}</td>
      <td class="text-right"><button class="btn btn-text btn-sm" onclick="toast('Policy edit flow not built in this prototype')">Edit</button></td></tr>`;
  }).join('')}</tbody></table></div>
  <div class="info-inline" style="margin-top:12px;"><span class="material-icons-o">info</span>Policies inherit Platform → Workspace → JD → Task hard limits; a lower level may only tighten, never relax them.</div>`;
}
function renderCompareEvaluate(){
  return `<div class="card"><table class="data-table"><thead><tr><th>Task type</th><th>Model</th><th>Sample</th><th>Accuracy</th><th>Cost/doc</th><th>P50</th><th>P95</th><th>Failure rate</th><th>Reviewer</th></tr></thead>
  <tbody>${MODEL_EVALS.map(e=>`<tr><td class="mono">${e.taskType}</td><td>${MODELS.find(m=>m.id===e.model).name}</td><td>${e.sampleSize}</td><td>${e.accuracy}</td><td>${e.cost}</td><td>${e.p50}</td><td>${e.p95}</td><td>${e.failureRate}</td><td>${personChip(e.reviewer)}</td></tr>`).join('')}</tbody></table></div>
  <div class="section-block" style="margin-top:18px;">
    <div class="section-title" style="font-size:var(--fs-sm);">Controlled rollout</div>
    <div class="card card-pad"><div class="flex justify-between items-center"><div><div style="font-weight:500;">Claude — Balanced v2 candidate</div><div class="tiny">Sample 15% • Budget cap $50 • Stop threshold: accuracy drop &gt;3pts</div></div><button class="btn btn-secondary btn-sm" onclick="toast('Rollout completed at 100% — no regression detected','success')">View status</button></div></div>
  </div>
  <div class="section-block">
    <div class="section-title" style="font-size:var(--fs-sm);">Quality regression</div>
    <div class="card card-pad"><div class="flex justify-between items-center"><div><div style="font-weight:500;">jd_generate weekly regression</div><div class="tiny">Dataset v3 • Threshold: accuracy ≥ 90% • On failure: alert + block auto-publish</div></div><button class="btn btn-text btn-sm" onclick="toast('Last run passed — 94% accuracy','success')">View last run</button></div></div>
  </div>`;
}
function renderUsageCost(){
  return `<div class="card"><table class="data-table"><thead><tr><th>Task type</th><th>Estimated</th><th>Reserved</th><th>Actual</th><th>Pending reconciliation</th><th>Period</th></tr></thead>
  <tbody>${USAGE_ROWS.map(r=>`<tr><td class="mono">${r.taskType}</td><td>${r.estimated}</td><td>${r.reserved}</td><td>${r.actual}</td><td>${r.pending}</td><td class="tiny">${r.period}</td></tr>`).join('')}</tbody></table></div>
  <div class="tiny" style="margin-top:10px;">AI cost budget is tracked separately from hiring headcount budget.</div>`;
}
function renderModelActivity(){
  return `<div class="card card-pad">${MODEL_ACTIVITY.map(a=>`<div class="timeline-item"><div class="ti-icon"><span class="material-icons-o">history</span></div><div class="ti-body"><div class="ti-title">${esc(a.text)}</div><div class="ti-meta">${fmtDateTime(a.at)}</div></div></div>`).join('')}</div>
  <button class="btn btn-secondary btn-sm" style="margin-top:12px;" onclick="toast('Rolled back to previous approved policy version','success')">Rollback to previous version</button>`;
}
