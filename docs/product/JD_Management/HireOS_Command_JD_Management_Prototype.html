<!doctype html>
<html lang="en">
<head>
<title>JD Management</title>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Material+Symbols+Rounded&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   HireOS Command — JD Management — Design System
   Shared token set with Resume Screening / Interview / Assessment.
   Google Workspace-inspired, light/dark/deep themes, 3 text sizes
   =================================================================== */

:root{
  --font: "Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Brand accent — Teal is the default direction (HireOS Command UI Guidelines §4.5) */
  --accent-50:#f0fdfa; --accent-100:#ccfbf1; --accent-300:#5eead4;
  --accent-500:#0d9488; --accent-600:#0f766e; --accent-700:#115e59;

  --bg:#eef2f6; --surface:#ffffff; --surface-alt:#f1f5f9;
  --border:#e5e7eb; --border-strong:#d1d5db;
  --text:#111827; --text-secondary:#4b5563; --text-tertiary:#9ca3af;
  --text-on-accent:#ffffff;

  --success-bg:#d1fae5; --success-text:#059669; --success-border:#a7f3d0; --success-ink:#ffffff;
  --warning-bg:#fef3c7; --warning-text:#b45309; --warning-border:#fde68a;
  --danger-bg:#fee2e2; --danger-text:#dc2626; --danger-border:#fecaca; --danger-ink:#ffffff;
  --info-bg:var(--accent-50); --info-text:var(--accent-700); --info-border:var(--accent-100);
  --neutral-bg:var(--surface-alt); --neutral-text:var(--text-secondary); --neutral-border:var(--border);
  --ai-bg:#f3e8ff; --ai-text:#7c3aed; --ai-border:#e9d5ff;

  --shadow-1: 0 1px 2px 0 rgba(17,24,39,.08), 0 1px 3px 1px rgba(17,24,39,.06);
  --shadow-2: 0 1px 3px 0 rgba(17,24,39,.10), 0 4px 8px 3px rgba(17,24,39,.08);
  --shadow-3: 0 4px 8px 3px rgba(17,24,39,.12), 0 1px 3px rgba(17,24,39,.12);

  --radius-sm:9px; --radius-md:14px; --radius-lg:18px; --radius-xl:20px;

  --fs-body:16px; --fs-sm:13px; --fs-xs:11px; --fs-lg:18px; --fs-xl:22px; --fs-h1:26px;
  --scale:1;
}

[data-text="small"]{ --fs-body:14px; --fs-sm:12px; --fs-xs:10px; --fs-lg:16px; --fs-xl:19px; --fs-h1:22px; }
[data-text="large"]{ --fs-body:18px; --fs-sm:15px; --fs-xs:13px; --fs-lg:21px; --fs-xl:25px; --fs-h1:30px; }

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="deep"]){
    --bg:#0f172a; --surface:#1e293b; --surface-alt:#334155;
    --border:#334155; --border-strong:#475569;
    --text:#f8fafc; --text-secondary:#d6deea; --text-tertiary:#aab8ca;
    --accent-50:rgba(45,212,191,.12); --accent-100:rgba(45,212,191,.20);
    --success-bg:rgba(16,185,129,.18); --success-text:#6ee7b7; --success-border:rgba(16,185,129,.35); --success-ink:#052e1f;
    --warning-bg:rgba(245,158,11,.18); --warning-text:#fcd34d; --warning-border:rgba(245,158,11,.35);
    --danger-bg:rgba(244,63,94,.18); --danger-text:#fda4af; --danger-border:rgba(244,63,94,.35); --danger-ink:#4c0519;
    --info-bg:var(--accent-50); --info-text:var(--accent-300); --info-border:var(--accent-100);
    --neutral-bg:var(--surface-alt); --neutral-text:var(--text-secondary); --neutral-border:var(--border);
    --ai-bg:rgba(167,139,250,.18); --ai-text:#c4b5fd; --ai-border:rgba(167,139,250,.35);
    --shadow-1: 0 1px 2px 0 rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.4);
    --shadow-2: 0 1px 3px 0 rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.4);
  }
}
[data-theme="dark"]{
  --bg:#0f172a; --surface:#1e293b; --surface-alt:#334155;
  --border:#334155; --border-strong:#475569;
  --text:#f8fafc; --text-secondary:#d6deea; --text-tertiary:#aab8ca;
  --accent-50:rgba(45,212,191,.12); --accent-100:rgba(45,212,191,.20);
  --success-bg:rgba(16,185,129,.18); --success-text:#6ee7b7; --success-border:rgba(16,185,129,.35); --success-ink:#052e1f;
  --warning-bg:rgba(245,158,11,.18); --warning-text:#fcd34d; --warning-border:rgba(245,158,11,.35);
  --danger-bg:rgba(244,63,94,.18); --danger-text:#fda4af; --danger-border:rgba(244,63,94,.35); --danger-ink:#4c0519;
  --info-bg:var(--accent-50); --info-text:var(--accent-300); --info-border:var(--accent-100);
  --neutral-bg:var(--surface-alt); --neutral-text:var(--text-secondary); --neutral-border:var(--border);
  --ai-bg:rgba(167,139,250,.18); --ai-text:#c4b5fd; --ai-border:rgba(167,139,250,.35);
  --shadow-1: 0 1px 2px 0 rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.4);
  --shadow-2: 0 1px 3px 0 rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.4);
}

[data-theme="deep"]{
  --bg:#0a0f1f; --surface:#16213a; --surface-alt:#1f2d4d;
  --border:#334155; --border-strong:#475569;
  --text:#f8fafc; --text-secondary:#d6deea; --text-tertiary:#aab8ca;
  --accent-50:rgba(45,212,191,.12); --accent-100:rgba(45,212,191,.20);
  --success-bg:rgba(16,185,129,.18); --success-text:#6ee7b7; --success-border:rgba(16,185,129,.35); --success-ink:#052e1f;
  --warning-bg:rgba(245,158,11,.18); --warning-text:#fcd34d; --warning-border:rgba(245,158,11,.35);
  --danger-bg:rgba(244,63,94,.18); --danger-text:#fda4af; --danger-border:rgba(244,63,94,.35); --danger-ink:#4c0519;
  --info-bg:var(--accent-50); --info-text:var(--accent-300); --info-border:var(--accent-100);
  --neutral-bg:var(--surface-alt); --neutral-text:var(--text-secondary); --neutral-border:var(--border);
  --ai-bg:rgba(167,139,250,.18); --ai-text:#c4b5fd; --ai-border:rgba(167,139,250,.35);
  --shadow-1: 0 1px 2px 0 rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.4);
  --shadow-2: 0 1px 3px 0 rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.4);
}

/* Accent themes — Teal (default), Blue, Violet (HireOS Command UI Guidelines §4.5) */
[data-accent="teal"]{ --accent-50:#f0fdfa; --accent-100:#ccfbf1; --accent-300:#5eead4; --accent-500:#0d9488; --accent-600:#0f766e; --accent-700:#115e59; }
[data-accent="blue"]{ --accent-50:#eff6ff; --accent-100:#dbeafe; --accent-300:#93c5fd; --accent-500:#2563eb; --accent-600:#1d4ed8; --accent-700:#1e40af; }
[data-accent="violet"]{ --accent-50:#f5f3ff; --accent-100:#ede9fe; --accent-300:#c4b5fd; --accent-500:#7c3aed; --accent-600:#6d28d9; --accent-700:#5b21b6; }
[data-theme="dark"][data-accent="teal"],[data-theme="deep"][data-accent="teal"]{ --accent-50:rgba(45,212,191,.12); --accent-100:rgba(45,212,191,.20); --accent-300:#5eead4; --accent-500:#5eead4; --accent-600:#2dd4bf; --accent-700:#99f6e4; --text-on-accent:#062a2a; }
[data-theme="dark"][data-accent="blue"],[data-theme="deep"][data-accent="blue"]{ --accent-50:rgba(96,165,250,.12); --accent-100:rgba(96,165,250,.20); --accent-300:#93c5fd; --accent-500:#93c5fd; --accent-600:#60a5fa; --accent-700:#bfdbfe; --text-on-accent:#0b1c33; }
[data-theme="dark"][data-accent="violet"],[data-theme="deep"][data-accent="violet"]{ --accent-50:rgba(167,139,250,.12); --accent-100:rgba(167,139,250,.20); --accent-300:#c4b5fd; --accent-500:#c4b5fd; --accent-600:#a78bfa; --accent-700:#ddd6fe; --text-on-accent:#1e1b33; }

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--text);
  font-size:var(--fs-body); line-height:1.5; -webkit-font-smoothing:antialiased;
}
a{ color:var(--accent-600); text-decoration:none; }
a:hover{ text-decoration:underline; }
button{ font-family:inherit; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

.material-icons-o{ font-family:'Material Symbols Rounded'; font-weight:normal; font-style:normal; font-size:18px; line-height:1; letter-spacing:normal; text-transform:none; display:inline-block; white-space:nowrap; word-wrap:normal; direction:ltr; -webkit-font-smoothing:antialiased; overflow:hidden; }

/* ---------- App shell ---------- */
#app{ display:flex; flex-direction:column; height:100vh; min-width:960px; }

.topbar{
  height:56px; flex:0 0 auto; display:flex; align-items:center; gap:14px;
  padding:0 16px; background:var(--surface); border-bottom:1px solid var(--border);
  position:relative; z-index:40;
}
.brand{ display:flex; align-items:center; gap:10px; font-size:var(--fs-lg); font-weight:500; color:var(--text); min-width:230px; cursor:pointer; }
.brand .logo{ width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,var(--accent-500),var(--accent-700)); display:flex; align-items:center; justify-content:center; color:var(--text-on-accent); font-weight:700; font-size:15px; flex:0 0 auto; }
.brand small{ display:block; font-size:var(--fs-xs); color:var(--text-tertiary); font-weight:400; }

.topbar-search{ flex:1; max-width:560px; display:flex; align-items:center; gap:8px; background:var(--surface-alt); border:1px solid transparent; border-radius:10px; padding:8px 16px; color:var(--text-secondary); font-size:var(--fs-sm); }
.topbar-search input{ border:0; background:transparent; outline:none; flex:1; color:var(--text); font-size:var(--fs-sm); font-family:inherit; }
.topbar-search:focus-within{ background:var(--surface); border-color:var(--accent-300); box-shadow:var(--shadow-1); }

.topbar-actions{ display:flex; align-items:center; gap:8px; margin-left:auto; }
.lang-toggle{ height:26px; min-width:55px; padding:0 9px; border:1px solid var(--border); border-radius:14px; background:var(--surface); color:var(--accent-700); font:600 11px/1 inherit; letter-spacing:.1px; cursor:pointer; white-space:nowrap; }
.lang-toggle:hover{ background:var(--surface-alt); color:var(--accent-800,var(--accent-700)); }

.icon-btn{ width:36px; height:36px; border-radius:50%; border:none; background:transparent; color:var(--text-secondary); display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; overflow:hidden; font-size:0; flex:0 0 auto; }
.icon-btn .material-icons-o{ font-size:20px; }
.line-edit-icon{ width:16px; height:16px; display:block; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.icon-btn:hover{ background:var(--surface-alt); }
.icon-btn .dot{ position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--danger-text); border:2px solid var(--surface); }

.role-pill{ display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:20px; padding:5px 12px 5px 6px; cursor:pointer; background:var(--surface); font-size:var(--fs-sm); color:var(--text); }
.role-pill:hover{ background:var(--surface-alt); }
.avatar{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:#fff; flex:0 0 auto; }
.role-pill .demo-tag{ font-size:var(--fs-xs); background:var(--warning-bg); color:var(--warning-text); border:1px solid var(--warning-border); padding:1px 6px; border-radius:8px; font-weight:600; letter-spacing:.02em; }

.shell{ flex:1; display:flex; min-height:0; }

.sidenav{ width:220px; flex:0 0 auto; background:var(--surface); border-right:1px solid var(--border); padding:12px 8px; overflow-x:hidden; overflow-y:auto; display:flex; flex-direction:column; transition:width .18s ease; }
.sidenav.collapsed{ width:52px; }
.sidenav-section{ margin-bottom:18px; }
.sidenav-section.sidenav-shared-bottom{ margin-top:auto; }
.sidenav.collapsed .sidenav-section{ margin-bottom:10px; }
.sidenav-label{ font-family:var(--font-mono); font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.06em; color:var(--text-tertiary); padding:6px 12px; font-weight:600; }
.sidenav.collapsed .sidenav-label{ display:none; }
.nav-item{ display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:8px; color:var(--text); font-size:var(--fs-sm); cursor:pointer; position:relative; margin-bottom:2px; }
.nav-item:hover{ background:var(--surface-alt); text-decoration:none; }
.nav-item.active{ background:var(--accent-100); color:var(--accent-700); font-weight:600; }
.nav-item .material-icons-o{ font-size:19px; color:inherit; opacity:.85; flex:0 0 auto; }
.nav-item .badge-count{ margin-left:auto; background:var(--neutral-bg); color:var(--neutral-text); font-size:var(--fs-xs); padding:1px 7px; border-radius:10px; font-weight:600; }
.nav-item.active .badge-count{ background:var(--accent-600); color:var(--text-on-accent); }
.sidenav.collapsed .nav-item{ justify-content:center; padding:9px; }
.sidenav.collapsed .nav-item .nav-label{ display:none; }
.sidenav.collapsed .nav-item .badge-count{ position:absolute; top:2px; right:2px; min-width:8px; width:8px; height:8px; padding:0; border-radius:50%; font-size:0; }
.sidenav-toggle{ display:flex; align-items:center; gap:12px; width:100%; margin-top:0; padding:9px 12px; border:0; border-top:1px solid var(--border); border-radius:0; background:none; color:var(--text-secondary); font-size:var(--fs-sm); font-family:inherit; cursor:pointer; }
.sidenav-toggle:hover{ background:var(--surface-alt); }
.sidenav-toggle .material-icons-o{ font-size:19px; flex:0 0 auto; }
.sidenav.collapsed .sidenav-toggle{ justify-content:center; padding:9px; }
.sidenav.collapsed .sidenav-toggle .toggle-label{ display:none; }

.main{ flex:1; overflow-y:auto; position:relative; background:var(--bg); }
.main-inner{ max-width:1320px; margin:0 auto; padding:26px 32px 60px; }
.main-inner.wide{ max-width:none; }
.main-inner.flush{ max-width:none; padding:0; height:100%; }

/* ---------- Typography helpers ---------- */
.page-title{ font-size:var(--fs-h1); font-weight:400; margin:0 0 4px; color:var(--text); text-wrap:balance; }
.page-subtitle{ font-size:var(--fs-sm); color:var(--text-secondary); margin:0 0 20px; }
.section-title{ font-size:var(--fs-lg); font-weight:500; margin:0 0 12px; color:var(--text); text-wrap:balance; }
.eyebrow{ font-family:var(--font-mono); font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.07em; color:var(--text-tertiary); font-weight:600; }
.muted{ color:var(--text-secondary); }
.tiny{ font-size:var(--fs-xs); color:var(--text-tertiary); }
.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

.breadcrumbs{ display:flex; align-items:center; gap:6px; font-size:var(--fs-sm); color:var(--text-secondary); margin-bottom:10px; flex-wrap:wrap; }
.breadcrumbs a{ color:var(--text-secondary); }
.breadcrumbs .sep{ color:var(--text-tertiary); }
.breadcrumbs .current{ color:var(--text); font-weight:500; }
.jw-back-btn{ width:28px; height:28px; margin-right:2px; border:1px solid var(--border); border-radius:7px; background:var(--surface); color:var(--text-secondary); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
.jw-back-btn:hover{ background:var(--surface-alt); color:var(--text); }
.jw-back-btn .material-icons-o{ font-size:17px; }

.page-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
.page-header .actions{ display:flex; gap:8px; flex-wrap:wrap; }

/* ---------- Buttons ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; font-size:var(--fs-sm); font-weight:500; padding:0 18px; height:34px; border-radius:10px; border:1px solid transparent; cursor:pointer; white-space:nowrap; line-height:1.2; transition:background .12s; }
.btn .material-icons-o{ font-size:18px; }
.btn-primary{ background:var(--accent-500); border-color:var(--accent-500); color:var(--text-on-accent); font-weight:700; }
.btn-primary:hover{ background:var(--accent-600); border-color:var(--accent-600); }
.btn-primary:disabled{ background:var(--neutral-bg); border-color:var(--neutral-bg); color:var(--text-tertiary); cursor:not-allowed; }
.btn-secondary{ background:var(--surface); color:var(--text-secondary); border-color:var(--border); height:32px; border-radius:9px; }
.btn-secondary:hover{ background:var(--surface-alt); }
.btn-text{ background:transparent; color:var(--text-secondary); padding:0 10px; height:32px; border-radius:9px; }
.btn-text:hover{ background:var(--surface-alt); }
.btn-danger{ background:transparent; color:var(--danger-text); border-color:var(--danger-border); height:32px; border-radius:9px; }
.btn-danger:hover{ background:var(--danger-bg); }
.btn-danger-solid{ background:var(--danger-text); border-color:var(--danger-text); color:var(--danger-ink); font-weight:700; }
.btn-danger-solid:hover{ opacity:.9; }
.btn-sm{ padding:0 12px; height:30px; font-size:var(--fs-xs); border-radius:9px; }
.btn-icon{ width:32px; height:32px; padding:0; border-radius:9px; background:transparent; border:1px solid var(--border); color:var(--text-secondary); }
.btn-icon:hover{ background:var(--surface-alt); }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }

/* ---------- Cards / surfaces ---------- */
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); overflow-x:auto; }
.card-pad{ padding:16px 18px; }
.card-hover:hover{ box-shadow:var(--shadow-1); }
.stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:20px; }
.stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 16px; cursor:pointer; }
.stat-card:hover{ border-color:var(--accent-300); box-shadow:var(--shadow-1); }
.stat-card .num{ font-size:26px; font-weight:600; color:var(--text); font-variant-numeric:tabular-nums; }
.stat-card .num.zero{ color:var(--text-tertiary); }
.stat-card .lbl{ font-size:var(--fs-xs); color:var(--text-secondary); margin-top:2px; }
.stat-card.unavailable .num{ font-size:var(--fs-sm); color:var(--danger-text); }

.section-block{ margin-bottom:28px; }
.collapse-toggle{ display:flex; align-items:center; gap:6px; background:none; border:none; color:var(--accent-600); font-size:var(--fs-sm); font-weight:500; cursor:pointer; padding:6px 0; }

/* ---------- Tables / lists ---------- */
table.data-table{ width:100%; border-collapse:collapse; font-size:var(--fs-sm); font-variant-numeric:tabular-nums; }
.data-table th{ text-align:left; font-family:var(--font-mono); font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.04em; color:var(--text-tertiary); font-weight:600; padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap; }
.data-table td{ padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
.data-table tr:last-child td{ border-bottom:none; }
.data-table tr.clickable:hover{ background:var(--surface-alt); cursor:pointer; }
.data-table tr.selected{ background:var(--accent-50); }

.list-row{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--border); }
.list-row:last-child{ border-bottom:none; }
.list-row:hover{ background:var(--surface-alt); }

/* ---------- Badges / chips ---------- */
.badge{ display:inline-flex; align-items:center; gap:4px; height:22px; font-size:11px; font-weight:600; padding:0 8px; border-radius:6px; border:1px solid; white-space:nowrap; }
.badge-success{ background:var(--success-bg); color:var(--success-text); border-color:var(--success-border); }
.badge-warning{ background:var(--warning-bg); color:var(--warning-text); border-color:var(--warning-border); }
.badge-danger{ background:var(--danger-bg); color:var(--danger-text); border-color:var(--danger-border); }
.badge-info{ background:var(--info-bg); color:var(--info-text); border-color:var(--info-border); }
.badge-neutral{ background:var(--neutral-bg); color:var(--neutral-text); border-color:var(--neutral-border); }
.badge-ai{ background:var(--ai-bg); color:var(--ai-text); border-color:var(--ai-border); }
.badge-outline{ background:transparent; color:var(--text-secondary); border-color:var(--border-strong); }
.badge .material-icons-o{ font-size:13px; }
.dot-indicator{ width:7px; height:7px; border-radius:50%; display:inline-block; }

.tag{ display:inline-flex; align-items:center; gap:4px; font-size:var(--fs-xs); padding:4px 11px; border-radius:9px; background:var(--surface-alt); color:var(--text-secondary); border:1px solid var(--border); }

.pill-tabs{ display:flex; gap:4px; background:var(--surface-alt); border-radius:20px; padding:3px; width:fit-content; }
.pill-tab{ padding:6px 16px; border-radius:16px; font-size:var(--fs-sm); font-weight:500; color:var(--text-secondary); cursor:pointer; border:none; background:transparent; }

function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+', '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function fmtRelative(iso){
  if(!iso) return '—';
  const diff = Date.now()-new Date(iso).getTime();
  const mins = Math.round(diff/60000);
  if(mins<1) return 'just now';
  if(mins<60) return mins+'m ago';
  const hrs = Math.round(mins/60);
  if(hrs<24) return hrs+'h ago';
  const days = Math.round(hrs/24);
  if(days<30) return days+'d ago';
  return fmtDate(iso);
}
function money(range){

}

function applyLocale(){
  if(state.language!=='zh') return;
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    const raw = node.nodeValue;
    const trimmed = raw.trim();
    if(!trimmed) return;
    let translated = ZH_TEXT[trimmed];
    if(!translated){
      translated = trimmed.replace(/^(All Jobs|My Jobs|Open|Drafts|Paused|Closed)\s+(\(\d+\))$/, (_,label,count)=>`${ZH_TEXT[label]} ${count}`)
        .replace(/^(Comments|Changes)\s+\((\d+)\)$/, (_,label,count)=>`${label==='Comments'?'评论':'变更'} (${count})`)
        .replace(/^(\d+) jobs?$/, '$1 个职位')
        .replace(/^Updated draft — (\d+) changes? highlighted$/, '草稿已更新 — $1 处改动已高亮');
    }
    if(translated && translated!==trimmed) node.nodeValue = raw.replace(trimmed, translated);
  });
  document.querySelectorAll('[title],[aria-label]').forEach(el=>['title','aria-label'].forEach(attr=>{
    const value = el.getAttribute(attr);
    if(value && ZH_TEXT[value]) el.setAttribute(attr, ZH_TEXT[value]);
  }));
}

function personChip(id, size){
  if(!id) return '<span class="tiny">Unassigned</span>';
  const p = PEOPLE[id]; if(!p) return '<span class="tiny">Unknown</span>';
  const cls = size==='sm' ? 'avatar-sm' : 'avatar-sm';
  return `<span class="flex items-center gap-6"><span class="${cls}" style="background:${p.color}">${p.initials}</span><span>${esc(p.name)}</span></span>`;
}
function personAvatar(id, size){
  const p = PEOPLE[id]; if(!p) return '';
  const cls = size==='md'?'avatar-md':'avatar-sm';
  return `<span class="${cls}" style="background:${p.color}" title="${esc(p.name)}">${p.initials}</span>`;
}

  if(actionLabel){
    const btn = document.createElement('button');
    btn.className='toast-action'; btn.textContent=actionLabel;
    btn.onclick = ()=>{ actionFn&&actionFn(); el.remove(); };
    el.appendChild(btn);
  }
  stack.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3800);
}
let __modalStack = [];
function openModal(html, opts){
  opts = opts||{};
  const root = document.getElementById('overlay-root');
  const overlay = document.createElement('div');
  overlay.className='overlay'; overlay.tabIndex=-1;
  overlay.innerHTML = `<div class="modal-wrap${opts.wide?' wide':''}${opts.xwide?' xwide':''}">${html}</div>`;
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) closeModal(); });
  root.appendChild(overlay);
  document.addEventListener('keydown', escHandler);
  __modalStack.push(overlay);
  setTimeout(()=>{ const f=overlay.querySelector('[autofocus]')||overlay.querySelector('button,input,textarea,select'); f&&f.focus(); },10);
  return overlay;
}
function closeModal(){
  const overlay = __modalStack.pop();
  if(overlay) overlay.remove();
  if(!__modalStack.length) document.removeEventListener('keydown', escHandler);
}
function escHandler(e){ if(e.key==='Escape'){ closeModal(); } }
function openDrawer(html, opts){
  opts = opts||{};
  const root = document.getElementById('overlay-root');
  const overlay = document.createElement('div');
  overlay.className='overlay'+(opts.overlayClass?' '+opts.overlayClass:'');
  overlay.innerHTML = `<div class="drawer${opts.wide?' wide':''}${opts.drawerClass?' '+opts.drawerClass:''}">${html}</div>`;
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) closeModal(); });
  root.appendChild(overlay);
  document.addEventListener('keydown', escHandler);
  __modalStack.push(overlay);
  if(opts.drawerClass==='gemini-drawer-shell') setupGeminiResize(overlay);
  return overlay;
}

const ROUTES = [];
function route(pattern, handler){
  const keys = [];
  const re = new RegExp('^'+pattern.replace(/:[^/]+/g, m=>{ keys.push(m.slice(1)); return '([^/]+)'; })+'(?:\\?.*)?$');
  ROUTES.push({re, keys, handler});
}
function currentQuery(){
  const q = location.hash.split('?')[1] || '';
  const params = {};
  q.split('&').forEach(p=>{ if(!p) return; const [k,v]=p.split('='); params[decodeURIComponent(k)]=decodeURIComponent(v||''); });
  return params;
}
function go(hash){ location.hash = hash; }
window.addEventListener('hashchange', renderRoute);
function renderRoute(){
  let hash = location.hash.replace(/^#/,'') || '/home';
  const path = hash.split('?')[0];
  for(const r of ROUTES){
    const m = path.match(r.re) || hash.match(r.re);
    if(m){
      const params = {};
      r.keys.forEach((k,i)=>params[k]=m[i+1]);
      try{ r.handler(params, currentQuery()); }
      catch(e){ console.error(e); document.getElementById('main-content').innerHTML = errorState('Something went wrong', e.message); }
      renderSidenav(); renderTopbar(); applyLocale();
      window.scrollTo(0,0);
      document.getElementById('main-root').scrollTop = 0;
      return;
    }
  }
  document.getElementById('main-content').innerHTML = emptyState('search_off','Page not found','This route does not exist in the prototype.', [{label:'Go to Home', onclick:"A.go('#/home')"}]);
}
function setMain(html, wide){
  document.getElementById('main-content').innerHTML = html;
  document.getElementById('main-content').className = 'main-inner'+(wide?' '+wide:'');
}

      return sep + (isLast||!c.href ? `<span class="${isLast?'current':''}">${esc(c.label)}</span>` : `<a href="${c.href}">${esc(c.label)}</a>`);

function statusBadge(kind, raw){
  const MAP = {
    hiring_status:{ draft:['Draft','neutral'], open:['Open','success'], paused:['Paused','warning'], closed:['Closed','neutral'], archived:['Archived','neutral'] },
    approval_status:{ not_submitted:['Not submitted','neutral'], pending:['Pending','warning'], changes_requested:['Changes requested','warning'], rejected:['Rejected','danger'], approved:['Approved','success'], cancelled:['Cancelled','neutral'], superseded:['Superseded','neutral'] },
    activation_status:{ not_requested:['Not requested','neutral'], pending:['Activation pending','warning'], succeeded:['Active','success'], failed:['Activation failed','danger'], outcome_unknown:['Checking activation status','warning'] },
    publication_status:{ not_published:['Not published','neutral'], queued:['Queued','info'], publishing:['Publishing','info'], published:['Published','success'], failed:['Failed','danger'], outcome_unknown:['Delivery status unknown','warning'], withdrawal_pending:['Withdrawal pending','warning'], withdrawn:['Withdrawn','neutral'] },
    task_status:{ open:['Open','info'], in_progress:['In progress','info'], waiting:['Waiting','warning'], completed:['Completed','success'], cancelled:['Cancelled','neutral'] },
    priority:{ low:['Low','neutral'], normal:['Normal','neutral'], high:['High','warning'], urgent:['Urgent','danger'] },
    connection_status:{ not_connected:['Not connected','neutral'], connected:['Connected','success'], paused:['Paused','warning'], disconnected:['Disconnected','neutral'], authorization_required:['Authorization required','danger'] },
    file_consumption:{ unassigned:['Unassigned','warning'], pending:['Pending','neutral'], accepted:['Accepted','success'], needs_review:['Needs review','warning'], rejected:['Rejected','danger'], failed:['Failed','danger'] },
  };
  const entry = (MAP[kind]||{})[raw];
  if(!entry) return `<span class="badge badge-neutral">${esc(raw||'Unknown')}</span>`;
  return `<span class="badge badge-${entry[1]}">${esc(entry[0])}</span>`;
}

function jobsForSavedView(view){

  switch(view){
    case 'My Jobs': return all.filter(j=>j.owner===u||j.hiringManager===u||j.recruiter===u);

    case 'Drafts': return all.filter(j=>j.hiringStatus==='draft');
    case 'Paused': return all.filter(j=>j.hiringStatus==='paused');

/* ---- Per-job access: the creator is Owner; participants are Admin or Member ----
   Owner  : full control, manages permissions
   Admin  : edit, publish, view sensitive information
   Member : edit and save drafts; cannot publish, cannot view sensitive information
   Others : view only, no sensitive information */
const ACCESS_ROLES = {
  owner:  {label:'Owner',  edit:true,  publish:true,  sensitive:true},
  admin:  {label:'Admin',  edit:true,  publish:true,  sensitive:true},
  member: {label:'Member', edit:true,  publish:false, sensitive:false},
  none:   {label:'Viewer', edit:false, publish:false, sensitive:false},
};
function legacyPermissions(j){
  const out = [];
  [j.hiringManager, j.recruiter].forEach(u=>{ if(u && u!==j.owner && PEOPLE[u] && !out.some(x=>x.userId===u)) out.push({userId:u, role:'admin'}); });
  return out;
}
function jobAccess(jobId, userId){
  const j = state.jobs[jobId]; userId = userId || state.currentUserId;
  let role = 'none';
  if(j){
    if(j.owner===userId) role = 'owner';
    else { const e = (Array.isArray(j.permissions) ? j.permissions : legacyPermissions(j)).find(p=>p.userId===userId); if(e) role = e.role==='admin' ? 'admin' : 'member'; }
  }
  return Object.assign({role}, ACCESS_ROLES[role]);
}
const __jobPermissionDrafts = {};
function jobPermissionDraft(jobId){
  const j = state.jobs[jobId];
  if(!j) return [];
  if(!__jobPermissionDrafts[jobId]){
    __jobPermissionDrafts[jobId] = (Array.isArray(j.permissions) ? j.permissions : legacyPermissions(j))
      .filter(p=>p && p.userId && p.userId!==j.owner && PEOPLE[p.userId])
      .map(p=>({userId:p.userId, role:p.role==='admin'?'admin':'member'}));
  }
  return __jobPermissionDrafts[jobId];
}
function renderJobPermissionSettings(jobId){
  const j = state.jobs[jobId];
  if(!j) return '';
  const entries = jobPermissionDraft(jobId);
  const owner = PEOPLE[j.owner] || currentUser();
  const canManage = j.owner===state.currentUserId;
  const available = Object.values(PEOPLE).filter(p=>p.id!==j.owner && !entries.some(x=>x.userId===p.id));
  const dis = canManage ? '' : ' disabled';
  return `<section class="permission-section">
    <div class="permission-heading">Permissions</div>
    <div class="permission-helper">Manage access for this job only. The creator is always the Owner.${canManage?'':' Only the Owner can change permissions.'}</div>
    <div class="permission-owner"><span class="avatar-sm" style="background:${owner.color}">${owner.initials}</span><div class="permission-person"><div class="permission-person-name">${esc(owner.name)} <span class="badge badge-info">Owner</span></div><div class="permission-person-note">Full control — edit, publish and sensitive access</div></div></div>
    <div class="field" style="margin:12px 0 8px;"><label>Participants</label><select${dis} onchange="A.addJobParticipant('${jobId}',this.value);this.value=''"><option value="">Select a participant</option>${available.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
    <div id="job-permission-rows">${entries.map(entry=>{ const p=PEOPLE[entry.userId]; const isAdmin=entry.role==='admin'; return `<div class="permission-member"><span class="avatar-sm" style="background:${p.color}">${p.initials}</span><div class="permission-person"><div class="permission-person-name">${esc(p.name)}</div><div class="permission-person-note">${isAdmin?'Can edit, publish and view sensitive information':'Can edit and save drafts; cannot publish or view sensitive information'}</div></div><select class="permission-role"${dis} aria-label="Permission role for ${esc(p.name)}" onchange="A.setJobParticipantRole('${jobId}','${p.id}',this.value)"><option value="admin"${isAdmin?' selected':''}>Admin</option><option value="member"${!isAdmin?' selected':''}>Member</option></select>${canManage?`<button class="permission-remove" type="button" title="Remove participant" aria-label="Remove participant" onclick="A.removeJobParticipant('${jobId}','${p.id}')"><span class="material-icons-o">close</span></button>`:''}</div>`; }).join('') || '<div class="permission-helper" style="margin:0;">No participants yet — only the Owner can access this job.</div>'}</div>
  </section>`;
}
A.addJobParticipant = function(jobId, userId){
  if(!userId || state.jobs[jobId].owner!==state.currentUserId) return;
  const entries=jobPermissionDraft(jobId);
  if(!entries.some(x=>x.userId===userId)) entries.push({userId,role:'member'});
  A.refreshJobPermissions(jobId);
};
A.setJobParticipantRole = function(jobId, userId, role){
  if(state.jobs[jobId].owner!==state.currentUserId) return;
  const entry=jobPermissionDraft(jobId).find(x=>x.userId===userId);
  if(entry) entry.role=role==='admin'?'admin':'member';
  A.refreshJobPermissions(jobId);
};
A.removeJobParticipant = function(jobId, userId){
  if(state.jobs[jobId].owner!==state.currentUserId) return;
  __jobPermissionDrafts[jobId]=jobPermissionDraft(jobId).filter(x=>x.userId!==userId);
  A.refreshJobPermissions(jobId);
};
A.refreshJobPermissions = function(jobId){
  const section=document.querySelector('.permission-section');
  if(section) section.outerHTML=renderJobPermissionSettings(jobId);
  applyLocale();
};

A.saveJobLibraryEditor = function(jobId){
  const j = state.jobs[jobId];
  if(!j) return;
  const title = document.getElementById('job-edit-title').value.trim();
  const department = document.getElementById('job-edit-department').value.trim();
  const location = document.getElementById('job-edit-location').value.trim();
  const headcount = Number(document.getElementById('job-edit-headcount').value);
  const hiringStatus = document.getElementById('job-edit-hiring-status').value;

  if(!title || !department || !location || !Number.isInteger(headcount) || headcount < 1){ toast('Complete all required job details.', 'error'); return; }
  Object.assign(j, {title, department, location, headcount, hiringStatus, recruiter, updatedAt:nowISO()});
  if(j.owner===state.currentUserId) j.permissions = jobPermissionDraft(jobId).map(p=>({userId:p.userId, role:p.role==='admin'?'admin':'member'}));
  delete __jobPermissionDrafts[jobId];
  closeModal();
  pageJobLibrary({}, currentQuery());

function nextActionFor(j){
  if(j.hiringStatus==='draft' && !j.activeRoleVersionRef) return 'Complete requirements';
  if(j.approvalStatus==='pending') return 'Awaiting approval';
  if(j.activationStatus==='pending') return 'Activation pending';
  if(j.hiringStatus==='paused') return 'Withdrawal in progress';
  if(j.hiringStatus==='open') return 'Hiring in progress';
  return 'No action needed';
}
A.dropOnBoard = function(ev, newStatus){
  ev.preventDefault();

    toast('Cannot open — no confirmed requirements yet. Complete and approve requirements first.', 'error');
    pageJobLibrary({}, currentQuery());
    return;
  }
  j.hiringStatus = newStatus; j.updatedAt = nowISO();
  toast('Moved '+j.title+' to '+newStatus);
  pageJobLibrary({}, currentQuery());
};

function docKey(jobId, audience){ return jobId+':'+audience; }
function getDraft(jobId, audience){
  const key = docKey(jobId,audience);
  if(!state.drafts[key]) state.drafts[key] = buildDefaultDraft(jobId, audience);
  return state.drafts[key];
}
function buildDefaultDraft(jobId){
  const j = state.jobs[jobId];
  const rv = j.activeRoleVersionRef ? ROLE_VERSIONS[j.activeRoleVersionRef] : null;
  const reqs = state.requirements[jobId] || [];
  const must = reqs.filter(r=>r.priority==='must_have').map(r=>r.statement);
  const pref = reqs.filter(r=>r.priority==='preferred').map(r=>r.statement);
  const hm = PEOPLE[j.hiringManager];
  const blocks = [];
  let n = 1; const bid = ()=>'d'+jobId.slice(-3)+'-'+(n++);
  blocks.push(mkBlock(bid(),'h2', j.title, {level:'public'}));
  blocks.push(mkBlock(bid(),'p', rv ? rv.roleSummary : (j.hiringStatus==='draft' ? 'This job has no confirmed requirements yet. Start a conversation with Copilot, or upload source material, to draft this document.' : 'No role summary on file.'), {level: rv ? 'public' : 'internal'}));
  blocks.push(mkBlock(bid(),'p', 'Team: '+(j.team||j.department)+(hm?' · Hiring manager: '+hm.name:''), {level:'internal'}));
  if(rv && rv.responsibilities && rv.responsibilities.length){
    blocks.push(mkBlock(bid(),'h2', 'Responsibilities', {level:'public'}));
    blocks.push(...listBlocks(bid, rv.responsibilities, {level:'public'}));
  }
  if(must.length){
    blocks.push(mkBlock(bid(),'h2', 'Requirements', {level:'public'}));
    blocks.push(...listBlocks(bid, must, {level:'public'}));
  }
  if(pref.length){
    blocks.push(mkBlock(bid(),'h2', 'Preferred', {level:'internal'}));
    blocks.push(...listBlocks(bid, pref, {level:'internal'}));
  }
  blocks.push(mkBlock(bid(),'h2', 'Compensation', {level:'public'}));
  const pay = money(rv ? rv.publicCompensation : null);
  blocks.push(mkBlock(bid(),'p', pay==='Not specified' ? 'Compensation is discussed during the interview process.' : pay+', plus benefits.', {level:'public'}));
  blocks.push(mkBlock(bid(),'p', 'Internal ceiling is restricted — see Requirements → Compensation.', {level:'confidential'}));
  return { id:'doc-'+jobId+'-internal', jobId, audience:'internal', language:'en', revision:1, saveState:'saved', blocks };
}

/* ---- Content classification: every block carries a visibility level ---- */
const BLOCK_LEVELS = {
  public:{label:'Public', icon:'public', hint:'Shown on external postings'},
  internal:{label:'Internal', icon:'groups', hint:'Visible to people with access to this job'},
  confidential:{label:'Confidential', icon:'lock', hint:'Restricted — never shown externally, AI is disabled'},
};
function blockLevel(b){
  if(b && BLOCK_LEVELS[b.level]) return b.level;
  const t = b ? (Array.isArray(b.text) ? b.text.join(' ') : String(b.text||'')) : '';
  return /ceiling|budget|backfill|restricted|confidential/i.test(t) ? 'confidential' : 'internal';
}
function levelTagHtml(level, opts){
  const L = BLOCK_LEVELS[level];
  opts = opts||{};
  return opts.onclick
    ? `<button type="button" class="lvl-tag lvl-${level}" title="Change visibility" onclick="${opts.onclick}"><span class="material-icons-o">${L.icon}</span>${L.label}<span class="material-icons-o lvl-caret">expand_more</span></button>`
    : `<span class="lvl-tag lvl-${level} static"${opts.title?` title="${esc(opts.title)}"`:''}><span class="material-icons-o">${L.icon}</span>${L.label}${opts.count!=null?`<b>${opts.count}</b>`:''}</span>`;
}
function getSuggestions(jobId, audience){ return state.suggestions[docKey(jobId,audience)] || (state.suggestions[docKey(jobId,audience)]=[]); }
function pendingSuggestionsFor(jobId, audience, blockId){

}

/* =====================================================================
   JD VERSION CONTROL
   - every JD has one unique, human-readable ID (JD-<year>-<number>)
   - every Publish writes an immutable snapshot -> v1, v2, v3 …
   - snapshots are diffed against the previous version so changes can be traced
   ===================================================================== */
function blockText(b){ return Array.isArray(b.text) ? b.text.join('\n') : String(b.text||''); }
function sectionMap(blocks){ const m = {}; let cur = ''; blocks.forEach(b=>{ if(b.kind==='h2') cur = blockText(b); m[b.id] = cur; }); return m; }
function ensureJdCode(j){
  if(j.jdCode) return j.jdCode;
  const used = new Set(Object.values(state.jobs).map(x=>x.jdCode).filter(Boolean));
  const year = (j.createdAt ? new Date(j.createdAt) : new Date()).getFullYear();
  const demo = /^job-demo-(\d+)$/.exec(j.id);
  let code = demo ? `JD-${year}-${demo[1].padStart(4,'0')}` : '';
  while(!code || used.has(code)){ state.jdSeq = (state.jdSeq||1000) + 1; code = `JD-${year}-${String(state.jdSeq).padStart(4,'0')}`; }
  j.jdCode = code; return code;
}
function jdVersionsOf(jobId){
  if(!state.__jdSeeded){ state.jdVersions = seedJdVersions(); state.__jdSeeded = true; }
  return state.jdVersions[jobId] || [];
}
function diffBlocks(prev, next){
  const pm = new Map(prev.map(b=>[b.id,b])), nm = new Map(next.map(b=>[b.id,b]));
  const ps = sectionMap(prev), ns = sectionMap(next);
  const out = {added:[], removed:[], edited:[], level:[], reordered:false, count:0};
  next.forEach(b=>{
    const o = pm.get(b.id);
    if(!o){ out.added.push({block:b, section:ns[b.id]}); return; }
    if(blockText(o)!==blockText(b)) out.edited.push({id:b.id, section:ns[b.id], kind:b.kind, before:blockText(o), after:blockText(b)});
    if(blockLevel(o)!==blockLevel(b)) out.level.push({id:b.id, section:ns[b.id], text:blockText(b), from:blockLevel(o), to:blockLevel(b)});
  });
  prev.forEach(b=>{ if(!nm.has(b.id)) out.removed.push({block:b, section:ps[b.id]}); });
  out.reordered = prev.filter(b=>nm.has(b.id)).map(b=>b.id).join(',') !== next.filter(b=>pm.has(b.id)).map(b=>b.id).join(',');
  out.count = out.added.length + out.removed.length + out.edited.length + out.level.length + (out.reordered?1:0);
  return out;
}
function makeJdVersion(jobId, blocks, o){
  const j = state.jobs[jobId], vs = jdVersionsOf(jobId), prev = vs[vs.length-1] || null;
  const n = prev ? prev.versionNo+1 : 1;
  const snap = JSON.parse(JSON.stringify(blocks));
  const diff = prev ? diffBlocks(prev.blocks, snap) : null;
  return { id:`${ensureJdCode(j)}@v${n}`, versionNo:n, jobId, title:j.title, publishedAt:o.at||nowISO(), publishedBy:o.by||state.currentUserId,
    note:o.note||'', channels:o.channels||[], blocks:snap, diff };
}
function seedJdVersions(){
  const doc = DOCUMENTS['job-demo-102:internal'];
  const pick = (excl, over)=>doc.blocks.filter(b=>excl.indexOf(b.id)<0).map(b=>JSON.parse(JSON.stringify(Object.assign({}, b, (over&&over[b.id])||{}))));
  const v1b = pick(['b6d','b6e','b8b','b12b','b10c','b2i'], {b9p:{text:'USD 50,000–68,000/year gross, plus benefits.'}});
  const v2b = pick(['b6e','b10c']);
  const mk = (n,blocks,by,at,note,channels,prevBlocks)=>({ id:`JD-2026-0102@v${n}`, versionNo:n, jobId:'job-demo-102', title:'Senior Backend Engineer', publishedAt:at, publishedBy:by, note, channels, blocks, diff: prevBlocks ? diffBlocks(prevBlocks, blocks) : null });
  return { 'job-demo-102':[
    mk(1,v1b,'linh',daysAgo(45),'Initial publication.',['Careers site'],null),
    mk(2,v2b,'linh',daysAgo(19),'Raised the compensation range; added the communication must-have and the 90-day success criteria.',['Careers site','LinkedIn Jobs'],v1b),
  ]};
}
function jdHasUnpublishedChanges(jobId){
  const vs = jdVersionsOf(jobId); if(!vs.length) return true;
  return diffBlocks(vs[vs.length-1].blocks, getDraft(jobId,'internal').blocks).count > 0;
}
/* Default section order for the JD document: title → Responsibilities → Requirements → Preferred → Compensation → Success */
const SECTION_ORDER = [
  [1, /responsib|what you.?ll do/i], [2, /requirement|qualification|must/i], [3, /preferred|nice.?to.?have/i],
  [4, /compensation|salary|benefit|pay\b/i], [5, /success|outcome|deliverable|first (30|90)/i],
];
function sectionRank(text){
  const t = String(text||'');
  if(/business|problem|about the role|summary|overview/i.test(t)) return 0.5;
  const hit = SECTION_ORDER.find(([,re])=>re.test(t));
  return hit ? hit[0] : 99;
}
/* insert a new section (head block first) at its default position instead of at the end */
function insertSectionOrdered(d, blocks){
  const rank = sectionRank(blocks[0].text);
  let at = d.blocks.length;
  for(let i=0;i<d.blocks.length;i++){
    const b = d.blocks[i];
    if(b.kind!=='h2' || i===0) continue;
    if(sectionRank(blockPlainText(b)) > rank){ at = i; break; }
  }
  d.blocks.splice(at, 0, ...blocks);
}
/* ---- Required content (basis: JD completeness standard v0.1, "Required" items) ---- */
const REQ_GROUPS = [
  {key:'fields',  label:'Job fields'},
  {key:'content', label:'Document content'},
  {key:'publish', label:'Publishing'},
];
let __reqHeads = {};
const REQ_PLACEHOLDER_RE = /^(new paragraph|new item|add content here\.?|no role summary on file\.?|this job has no confirmed requirements yet.*)$/i;
const REQ_ITEMS = [
  {id:'A1', group:'fields',  label:'Job title',        hint:'Name the role.', field:'title'},
  {id:'A4', group:'fields',  label:'Level',            hint:'e.g. Senior, Staff, Manager.', field:'level'},
  {id:'A7', group:'fields',  label:'Location',         hint:'City / country or Remote.', field:'location'},
  {id:'A8', group:'fields',  label:'Headcount',        hint:'Number of openings (1 or more).', field:'headcount'},
  {id:'B1', group:'content', label:'Role summary',     hint:'2–3 sentences: what the person will own and why it matters.', heading:'About the role', level:'public',  match:/summary|overview|about the role/i, lead:true},
  {id:'C1', group:'content', label:'Core responsibilities', hint:'3–6 bullets describing the work.', heading:'Responsibilities', level:'public', match:/responsib|what you.?ll do/i, list:true},
  {id:'D1', group:'content', label:'Requirements', hint:'3–8 clear requirements, including at least 2 specific skills or tools.', heading:'Requirements', level:'public', match:/must|requirement|qualification/i, list:true},
  {id:'I1', group:'publish', label:'Every block has a visibility level', kind:'data', check:ctx=>({ok:ctx.blocks.every(b=>BLOCK_LEVELS[b.level]), note:'Some blocks have no level.'})},
  {id:'I2', group:'publish', label:'Unique JD ID', kind:'data', check:ctx=>({ok:!!ctx.j.jdCode||!!ensureJdCode(ctx.j), note:'No ID.'})},
  {id:'I7', group:'publish', label:'Language version', kind:'data', check:ctx=>({ok:!!ctx.draft.language, note:'No language set.'})},
];
/* ---- Improvement suggestions: optional sections that are still empty (shown after Analyze) ---- */
const REQ_SUGGEST = [
  {id:'S-B2', label:'Business problem',  hint:'Explain why this role is needed now.', heading:'Business problem', level:'internal', match:/business|problem|context|why (we|this)/i, starter:'Describe the business problem this hire solves.'},
  {id:'S-D7', label:'Preferred',         hint:'Nice-to-have skills (up to 5).', heading:'Preferred', level:'public', match:/preferred|nice.?to.?have/i, list:true, starter:'Add a nice-to-have.'},
  {id:'S-C2', label:'Expected outcomes', hint:'What the person should achieve.', heading:'Expected outcomes', level:'internal', match:/outcome|deliverable|expected results?/i, list:true, starter:'Add an expected outcome.'},
  {id:'S-C3', label:'Success criteria',  hint:'What success looks like at 30 / 90 days.', heading:'Success in the first 90 days', level:'internal', match:/success|first (30|90)/i, list:true, starter:'Add a 30 / 90-day success criterion.'},
];
function reqSuggestions(jobId){
  const d = getDraft(jobId,'internal'), secs = groupSections(d.blocks);
  return REQ_SUGGEST.filter(it=>{
    const sec = reqFindSection(secs, it, d).sec;
    return !(sec && sec.blocks.some(b=>b.kind!=='h2' && reqIsFilled(blockPlainText(b))));
  });
}
A.analyze = function(jobId){
  const btn = document.querySelector('.js-analyze');
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="material-icons-o req-spin">autorenew</span>Analyzing…'; }
  setTimeout(()=>{
    (state.analysis = state.analysis||{})[jobId] = {at: Date.now()};
    const ev = reqEval(jobId), n = ev.missing + ev.weakCount, m = reqSuggestions(jobId).length;
    state.wsSideTab = 'check';
    reqKeepScroll(()=>renderRoute());
    toast(n||m ? `Analysis complete — ${n} required issue${n===1?'':'s'}, ${m} suggestion${m===1?'':'s'}.` : 'Analysis complete — no issues found.', n ? 'error' : 'success');
  }, 900);
};
function reqIsFilled(t){ t = String(t||'').replace(/ /g,' ').trim(); return t.length>=3 && !REQ_PLACEHOLDER_RE.test(t) && !REQ_ITEMS.some(i=>i.starter===t) && !REQ_SUGGEST.some(i=>i.starter===t); }
REQ_ITEMS.forEach(i=>{ if(i.heading) i.starter = ({B1:'Summarise the role in 2–3 sentences.',C1:'Add a core responsibility.',D1:'Add a requirement.'})[i.id]; });
function reqFindSection(secs, item, draft){
  const cand = secs.filter((s,i)=> !(i===0 && s.head && s.head===draft.blocks[0]));
  const byHead = cand.find(s=>s.head && item.match.test(blockPlainText(s.head)));
  return byHead ? {sec:byHead, byHead:true} : {sec: item.lead ? secs[0] : null, byHead:false};
}
/* ---- "Needs revision" (Weak): the item is filled but hits a common defect from the completeness standard ---- */
const REQ_VAGUE = /(strong|good|excellent|great)\s+(communication|interpersonal|leadership)|team player|fast learner|quick learner|hard.?working|self.?motivated|passionate|detail.?oriented|go.?getter/i;
function reqYears(text){ const m = [...String(text||'').matchAll(/(\d+)\s*\+?\s*(?:years?|yrs)/gi)].map(x=>Number(x[1])); return m.length ? Math.max(...m) : 0; }
const REQ_WEAK = {
  A1: ctx=>{ const t = String(ctx.j.title||'').trim();
    if(/\b(rockstar|ninja|guru|wizard)\b/i.test(t)) return 'Avoid marketing words such as “Rockstar” or “Ninja” in the job title.';
    if(/[A-Z]{2,}-?\d{2,}|#\d+/.test(t)) return 'Remove internal codes from the job title.';
    if(/^(senior|junior|lead|staff|principal|head|chief)$/i.test(t)) return 'Add the function to the title, e.g. “Senior Backend Engineer”.';
    if(t.length>60) return 'Keep the job title under 60 characters.'; return ''; },
  A4: ctx=>{ const lvl = String(ctx.j.level||''), y = reqYears(ctx.mustText);
    if(/junior|intern|entry/i.test(lvl) && y>=5) return `Level “${lvl}” conflicts with the ${y}+ years of experience required.`;
    if(/director|head|vp|principal/i.test(lvl) && y && y<=2) return `Level “${lvl}” looks high for only ${y} years of experience required.`; return ''; },
  A7: ctx=>/^remote$/i.test(String(ctx.j.location||'').trim()) ? 'Remote roles should name the accepted regions or time zones.' : '',
  B1: ctx=>{ const t = (ctx.items.B1||[]).join(' '), n = t.split(/[.!?。]+(?:\s|$)/).filter(x=>x.trim().length>2).length;
    if(n<2) return 'Use 2–4 sentences: what the role does, for whom, and why it matters.';
    if(n>5) return 'Shorten to 2–4 sentences.'; return ''; },
  C1: ctx=>{ const b = ctx.items.C1||[];
    if(b.length<3) return 'Add at least 3 responsibilities.';
    if(b.some(x=>/^(responsible for|in charge of)/i.test(x))) return 'Start each responsibility with an action verb, not “Responsible for…”.';
    if(b.length>8) return 'Keep to 8 responsibilities or fewer.'; return ''; },
  D1: ctx=>{ const b = ctx.items.D1||[], v = b.map(x=>x.match(REQ_VAGUE)).find(Boolean);
    if(b.length<3) return 'Add at least 3 requirements.';
    if(v) return `“${v[0]}” can’t be verified — describe the observable behavior instead.`;
    if(b.some(x=>/microsoft office|ms office|computer skills|office software/i.test(x))) return 'Name specific skills or tools instead of generic ones.';
    if(b.length>8) return 'Keep to 8 requirements or fewer.'; return ''; },
};
function reqEval(jobId){
  const j = state.jobs[jobId], draft = getDraft(jobId,'internal');
  const secs = groupSections(draft.blocks);
  const rv = j.activeRoleVersionRef ? ROLE_VERSIONS[j.activeRoleVersionRef] : null;
  const reqs = state.requirements[jobId] || [];
  const filledOf = s=>s.blocks.filter(b=>b.kind!=='h2' && reqIsFilled(blockPlainText(b)));
  const docText = draft.blocks.map(b=>blockPlainText(b)).join(' \n ').toLowerCase();
  const mustSec = secs.find(s=>s.head && /must|requirement|qualification/i.test(blockPlainText(s.head)));
  const ctx = {j, jobId, draft, blocks:draft.blocks, rv, reqs, docText, mustReqs:reqs.filter(r=>r.priority==='must_have'),
               mustText: mustSec ? filledOf(mustSec).map(b=>blockPlainText(b)).join(' ') : '', items:{}};
  const heads = {};   // headBlockId -> [item ids satisfied by that section]
  const out = REQ_ITEMS.map((item,idx)=>{
    let ok = false, note = '', where = null;   // where: {sec: section object | null}
    if(item.field){
      const v = item.field==='title' ? j.title : j[item.field];
      ok = item.field==='headcount' ? Number(v)>=1 : !!String(v==null?'':v).trim();
      note = 'Required — not filled in.';
    } else if(item.heading){
      const f = reqFindSection(secs, item, draft), sec = f.sec;
      const has = sec ? filledOf(sec).filter(b=>!/^team:/i.test(blockPlainText(b))) : [];
      ok = item.lead ? has.some(b=>blockPlainText(b).length>=20) : has.length>0;
      if(!ok && item.alt && item.alt(ctx)) ok = true;
      ctx.items[item.id] = has.map(b=>blockPlainText(b));
      where = {sec: sec||null};
      if(ok && f.byHead) (heads[sec.head.id] = heads[sec.head.id]||[]).push(item.id);
      note = sec ? 'This section is empty.' : 'Section missing.';
    } else {
      const r = item.check(ctx); ok = r.ok; note = r.note;
    }
    const weak = ok && REQ_WEAK[item.id] ? REQ_WEAK[item.id](ctx) : '';
    return {item, ok, note, where, weak};
  });
  return {rows: out, heads, secs, missing: out.filter(r=>!r.ok).length, weakCount: out.filter(r=>r.ok&&r.weak).length, total: out.length};
}

/* ---- AI drafting for missing required content (mock Copilot; deterministic, grounded in the job's own data) ---- */
const AI_FILLABLE = ['B1','C1','D1'];
function aiDomain(title){
  const t = String(title||'').toLowerCase();
  if(/backend|back-end|platform|software|engineer|developer/.test(t)) return 'engineering';
  if(/finance|account|controller/.test(t)) return 'finance';
  if(/design/.test(t)) return 'design';
  if(/sales|account exec|business develop/.test(t)) return 'sales';
  if(/product/.test(t)) return 'product';
  if(/data|analyst|scien/.test(t)) return 'data';
  return 'general';
}
const AI_BANK = {
  engineering:{ resp:['Design, build and operate reliable backend services','Improve performance, scalability and observability of core systems','Partner with product and design to scope and ship new capabilities','Review code and mentor teammates on engineering best practices'], skills:['Backend language such as Go, Java, Python or Node.js','Relational databases and SQL','Designing and operating REST / event-driven APIs','Cloud infrastructure (AWS, GCP or Azure) and CI/CD'] },
  finance:{ resp:['Own the monthly close and management reporting','Partner with department heads on budgeting and forecasting','Maintain financial controls and documentation','Prepare variance analysis for leadership'], skills:['Financial reporting and consolidation','Budgeting and forecasting models','ERP systems and advanced Excel / SQL','Internal controls and audit readiness'] },
  design:{ resp:['Lead end-to-end design for key product experiences','Turn research insights into clear design decisions','Maintain and extend the design system','Collaborate with engineers through delivery'], skills:['Interaction and visual design','Prototyping tools such as Figma','User research and usability testing','Design systems and accessibility'] },
  sales:{ resp:['Own a pipeline from prospecting to close','Run discovery and tailor solutions to customer needs','Forecast accurately and keep CRM data current','Collaborate with marketing and customer success'], skills:['Consultative B2B selling','Pipeline management in a CRM','Negotiation and contract closing','Account planning'] },
  product:{ resp:['Define product strategy and roadmap for your area','Turn customer problems into clear specs','Align engineering, design and go-to-market on priorities','Track outcomes with product metrics'], skills:['Product discovery and prioritization','Writing clear product requirements','Product analytics and experimentation','Stakeholder management'] },
  data:{ resp:['Build and maintain trusted datasets and dashboards','Analyze business questions and present clear recommendations','Define metrics with business partners','Automate recurring reporting'], skills:['SQL and data modeling','Python or R for analysis','BI tools such as Looker, Tableau or Power BI','Statistics and experiment design'] },
  general:{ resp:['Own key deliverables for the team from planning to delivery','Collaborate with cross-functional partners','Improve processes and share learnings','Report progress and risks to stakeholders'], skills:['Role-specific functional expertise','Clear written and verbal communication','Planning and prioritization','Data-informed decision making'] },

function aiDraftLines(jobId, id){
  const j = state.jobs[jobId], rv = j.activeRoleVersionRef ? ROLE_VERSIONS[j.activeRoleVersionRef] : null;
  const reqs = state.requirements[jobId] || [], bank = AI_BANK[aiDomain(j.title)];

A.aiFillRequired = function(jobId, id, silent){
  const it = REQ_ITEMS.find(x=>x.id===id); if(!it || !AI_FILLABLE.includes(id)) return false;
  const d = getDraft(jobId,'internal'), before = d.blocks.slice(), lines = aiDraftLines(jobId, id);
  if(!lines.length) return false;
  const secs = groupSections(d.blocks), sec = reqFindSection(secs, it, d).sec;
  const mk = t=>{ const b = mkBlock(uid('nb'), it.list?'ul':'p', it.list?[t]:t, {level:it.level||'internal'}); b.aiDraft = true; return b; };
  const nbs = lines.map(mk);
  if(sec){
    sec.blocks.filter(b=>b.kind!=='h2' && !reqIsFilled(blockPlainText(b)) && !(it.lead && /^team:/i.test(blockPlainText(b)))).forEach(b=>{ d.blocks.splice(d.blocks.indexOf(b),1); });
    const last = sec.blocks.filter(b=>d.blocks.includes(b)).pop() || sec.head;
    const at = last ? d.blocks.indexOf(last)+1 : 0;
    d.blocks.splice(at, 0, ...nbs);
  } else {
    insertSectionOrdered(d, [mkBlock(uid('ns'),'h2',it.heading,{level:it.level||'internal'}), ...nbs]);
  }
  d.saveState = 'dirty';
  if(!silent){
    state.__aiUndo = before;
    reqKeepScroll(()=>renderRoute());
    toast('Copilot drafted “'+it.label+'” — review and edit.', 'success', 'Undo', ()=>{ d.blocks = before; reqKeepScroll(()=>renderRoute()); });
  }
  return true;
};

A.aiDraftBtn = function(btn, jobId, id){

  setTimeout(()=>A.aiFillRequired(jobId, id), 700);
};
A.aiFillAll = function(btn, jobId){
  const ev = reqEval(jobId);
  const todo = ev.rows.filter(r=>!r.ok && AI_FILLABLE.includes(r.item.id)).map(r=>r.item.id);
  const fix = ev.rows.filter(r=>r.ok && r.weak && AI_REVISABLE.includes(r.item.id)).map(r=>r.item.id);
  if(!todo.length && !fix.length) return;
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="material-icons-o req-spin">autorenew</span>Working…'; }
  setTimeout(()=>{
    const snap = aiSnapshot(jobId);
    todo.forEach(id=>A.aiFillRequired(jobId, id, true));
    fix.forEach(id=>A.aiReviseRequired(jobId, id, true));
    reqKeepScroll(()=>renderRoute());
    const n = todo.length + fix.length;
    toast('Copilot updated '+n+' item'+(n>1?'s':'')+' — review the changes.', 'success', 'Undo', ()=>{ aiRestore(jobId, snap); reqKeepScroll(()=>renderRoute()); });
  }, 800);
};
A.aiSuggestLevel = function(jobId){
  const j = state.jobs[jobId], t = String(j.title||'');
  const m = t.match(/\b(intern|junior|mid|senior|staff|principal|lead|manager|director|head|vp)\b/i);
  j.level = m ? m[1].charAt(0).toUpperCase()+m[1].slice(1).toLowerCase() : 'Mid';
  j.updatedAt = nowISO(); renderRoute();
  toast('Copilot suggested level “'+j.level+'” from the job title.', 'success');
};
A.keepAiDraft = function(jobId, blockId, el){
  const b = findBlock(jobId,'internal',blockId); if(!b) return;
  b.aiDraft = false;
  if(el && el.remove) el.remove(); else reqKeepScroll(()=>renderRoute());
};

/* ---- AI revision of "Needs revision" items ---- */
const AI_REVISABLE = ['A1','A4','A7','B1','C1','D1'];
function aiSnapshot(jobId){
  const j = state.jobs[jobId], d = getDraft(jobId,'internal');
  return { blocks: d.blocks.map(b=>Object.assign({}, b, {text: Array.isArray(b.text) ? b.text.slice() : b.text})), title:j.title, level:j.level, location:j.location };
}
function aiRestore(jobId, snap){
  const j = state.jobs[jobId], d = getDraft(jobId,'internal');
  d.blocks = snap.blocks; j.title = snap.title; j.level = snap.level; j.location = snap.location; d.saveState = 'dirty';
}
function aiVerifiable(stmt){
  const m = String(stmt).match(REQ_VAGUE); if(!m) return null;
  const t = m[0].toLowerCase();
  if(/communication|interpersonal/.test(t)) return 'Can write a clear technical design doc and explain trade-offs in a cross-team review';
  if(/leadership/.test(t)) return 'Has led a team or project from planning to delivery, with a concrete example';
  if(/team player/.test(t)) return 'Has delivered a project jointly with another team, with a concrete example';
  if(/learner/.test(t)) return 'Has picked up an unfamiliar tool or domain and shipped work with it, with a concrete example';
  return 'Can show a specific past example of '+t;
}
A.aiReviseRequired = function(jobId, id, silent){
  const j = state.jobs[jobId], d = getDraft(jobId,'internal'), bank = AI_BANK[aiDomain(j.title)];
  const row = reqEval(jobId).rows.find(r=>r.item.id===id); if(!row || !row.ok || !row.weak) return false;
  const snap = silent ? null : aiSnapshot(jobId);
  const secs = groupSections(d.blocks), it = row.item;
  const sec = it.heading ? reqFindSection(secs, it, d).sec : null;
  const body = sec ? sec.blocks.filter(b=>b.kind!=='h2' && reqIsFilled(blockPlainText(b)) && !/^team:/i.test(blockPlainText(b))) : [];
  const flag = b=>{ b.aiDraft = true; return b; };
  const setText = (b,t)=>{ b.text = Array.isArray(b.text) ? [t] : t; flag(b); };
  const addAfter = (anchor, texts)=>{ let at = d.blocks.indexOf(anchor)+1; texts.forEach(t=>{ d.blocks.splice(at++, 0, flag(mkBlock(uid('nb'), it.list?'ul':'p', it.list?[t]:t, {level:it.level||'internal'}))); }); };
  if(id==='A1'){
    let t = String(j.title||'').replace(/\b(rockstar|ninja|guru|wizard)\b/ig,'').replace(/[A-Z]{2,}-?\d{2,}|#\d+/g,'').replace(/\s{2,}/g,' ').trim();
    const fn = {engineering:'Engineer', finance:'Manager', design:'Designer', sales:'Account Executive', product:'Product Manager', data:'Analyst', general:'Specialist'}[aiDomain(j.title)];
    if(!t || /^(senior|junior|lead|staff|principal|head|chief)$/i.test(t) || t.split(/\s+/).length<2) t = (t?t+' ':'')+fn;
    if(t.length>60) t = t.slice(0,60).replace(/\s+\S*$/,'');
    j.title = t;
  } else if(id==='A4'){
    const ms = secs.find(s=>s.head && /must|requirement|qualification/i.test(blockPlainText(s.head)));
    const y = reqYears(ms ? ms.blocks.map(b=>blockPlainText(b)).join(' ') : '');
    j.level = /junior|intern|entry/i.test(j.level) ? (y>=8 ? 'Staff' : y>=5 ? 'Senior' : 'Mid') : (y<=2 ? 'Mid' : 'Senior');
  } else if(id==='A7'){
    j.location = 'Remote — Asia-Pacific time zones (UTC+5 to UTC+10)';
  } else if(id==='B1' && body.length){
    const sentences = body.map(b=>blockPlainText(b)).join(' ').split(/(?<=[.!?。])\s+/).filter(Boolean);
    if(sentences.length<2){ setText(body[body.length-1], blockPlainText(body[body.length-1]).replace(/\s*$/,'') + ' You will partner closely with cross-functional teams and see your work reach customers.'); }
    else { setText(body[0], sentences.slice(0,3).join(' ')); body.slice(1).forEach(b=>d.blocks.splice(d.blocks.indexOf(b),1)); }
  } else if(id==='C1' && body.length){
    body.forEach(b=>{ const t = blockPlainText(b); if(/^(responsible for|in charge of)/i.test(t)){ const rest = t.replace(/^(responsible for|in charge of)\s+/i,''); setText(b, 'Own '+rest.charAt(0).toLowerCase()+rest.slice(1)); } });
    if(body.length>8) body.slice(8).forEach(b=>d.blocks.splice(d.blocks.indexOf(b),1));
    const have = body.filter(b=>d.blocks.includes(b)).length;
    if(have<3){ const text = body.map(b=>blockPlainText(b).toLowerCase()).join(' '); const more = bank.resp.filter(x=>!text.includes(x.toLowerCase())).slice(0,3-have+1); addAfter(body[body.length-1], more); }
  } else if(id==='D1' && body.length){
    body.forEach(b=>{ const t = blockPlainText(b);
      const v = aiVerifiable(t); if(v) setText(b, v);
      else if(/microsoft office|ms office|computer skills|office software/i.test(t)) setText(b, bank.skills[0]);
    });
    if(body.length>8) body.slice(8).forEach(b=>d.blocks.splice(d.blocks.indexOf(b),1));
    const have = body.filter(b=>d.blocks.includes(b)).length;
    if(have<3){ const text = body.map(b=>blockPlainText(b).toLowerCase()).join(' '); const more = bank.skills.filter(x=>!text.includes(x.toLowerCase())).slice(0,3-have+1).map(x=>'Hands-on experience with '+x.charAt(0).toLowerCase()+x.slice(1)); addAfter(body[body.length-1], more); }
  } else return false;
  d.saveState = 'dirty'; j.updatedAt = nowISO();
  if(!silent){
    reqKeepScroll(()=>renderRoute());
    toast('Copilot revised “'+it.label+'” — review the change.', 'success', 'Undo', ()=>{ aiRestore(jobId, snap); reqKeepScroll(()=>renderRoute()); });
  }
  return true;
};
A.aiReviseBtn = function(btn, jobId, id){

function reqBarHtml(jobId, ev){
  ev = ev || reqEval(jobId);
  const total = ev.total, done = total - ev.missing - ev.weakCount, pct = Math.round(done/total*100);   // progress counts only items that pass
  const actionFor = r=>{
    const it = r.item;
    if(it.field) return `${it.field==='level'?`<button class="req-link req-link-ai" onclick="A.aiSuggestLevel('${jobId}')">AI suggest</button>`:''}<button class="req-link" onclick="A.focusReqField('${it.field}')">Fill in</button>`;
    if(it.heading) return `${AI_FILLABLE.includes(it.id)?`<button class="req-link req-link-ai" onclick="A.aiDraftBtn(this,'${jobId}','${it.id}')">AI draft</button>`:''}<button class="req-link" onclick="A.fillRequired('${jobId}','${it.id}')">Fill in</button>`;
    if(it.open==='req') return `<button class="req-link" onclick="A.openBlueprintDrawer('${jobId}')">Open requirements</button>`;
    if(it.open==='approval') return `<button class="req-link" onclick="go('#/jobs/${jobId}/approval')">Open approval</button>`;
    if(it.open==='publish') return `<button class="req-link" onclick="A.openPublishModal('${jobId}')">Choose channels</button>`;
    return '';
  };
  const grpLabel = k=>(REQ_GROUPS.find(g=>g.key===k)||{}).label||'';
  const bad = ev.rows.filter(r=>!r.ok), weak = ev.rows.filter(r=>r.ok&&r.weak), good = ev.rows.filter(r=>r.ok&&!r.weak);
  const an = (state.analysis||{})[jobId], sg = an ? reqSuggestions(jobId) : [];
  const kind = ev.missing ? 'bad' : ev.weakCount ? 'warn' : 'ok';
  const headline = ev.missing ? `${ev.missing} missing${ev.weakCount?` · ${ev.weakCount} to revise`:''}` : ev.weakCount ? `${ev.weakCount} to revise` : 'All required items complete';
  const fixable = bad.some(r=>AI_FILLABLE.includes(r.item.id)) || weak.some(r=>AI_REVISABLE.includes(r.item.id));
  const row = (icon, ico, label, note, acts)=>`<div class="ck-row"><span class="material-icons-o ck-ico ${ico}">${icon}</span><div class="ck-main"><div class="ck-top"><span class="ck-name">${esc(label)}</span><span class="ck-acts">${acts}</span></div><div class="ck-note">${esc(note)}</div></div></div>`;
  const section = (title, n, rows)=> n ? `<section class="ck-sec"><div class="ck-sec-h">${title}<span>${n}</span></div>${rows}</section>` : '';
  const aiLabel = bad.length && weak.length ? 'AI fix all' : bad.length ? 'AI draft all missing' : 'AI fix all issues';
  return `<div class="req-bar ck" id="req-bar">
    <div class="ck-summary ${kind}">
      <span class="material-icons-o ck-sum-ico">${kind==='bad'?'error':kind==='warn'?'warning':'check_circle'}</span>
      <div><div class="ck-head">${headline}</div><div class="ck-sub">${done} of ${total} required items passed</div></div>
    </div>
    <div class="ck-meter ${kind}"><i style="width:${pct}%"></i></div>
    ${fixable ? `<button type="button" class="ck-aiall" title="Copilot works from this job’s data. Review before publishing." onclick="A.aiFillAll(this,'${jobId}')"><span class="material-icons-o">auto_awesome</span>${aiLabel}</button>` : ''}
    ${section('To complete', bad.length, bad.map(r=>row('error','bad',r.item.label, grpLabel(r.item.group)+' · '+r.note, actionFor(r))).join(''))}
    ${section('To revise', weak.length, weak.map(r=>row('warning','warn',r.item.label, r.weak, (AI_REVISABLE.includes(r.item.id)?`<button class="req-link req-link-ai" onclick="A.aiReviseBtn(this,'${jobId}','${r.item.id}')">AI fix</button>`:'')+`<button class="req-link" onclick="A.gotoReq('${jobId}','${r.item.id}')">Go to</button>`)).join(''))}
    ${section('Suggestions', sg.length, sg.map(x=>row('lightbulb','tip',x.label, x.hint, `<button class="req-link" onclick="A.fillRequired('${jobId}','${x.id}')">Add</button>`)).join(''))}
    <details class="ck-done" ${state.reqDoneOpen===false?'':'open'} ontoggle="state.reqDoneOpen=this.open"><summary><span class="material-icons-o ck-caret">chevron_right</span>Completed<span>${good.length}</span></summary>
      <div class="ck-chips">${good.map(r=>`<span class="ck-chip"><span class="material-icons-o">check</span>${esc(r.item.label)}</span>`).join('')}</div></details>
    <div class="ck-foot"><span class="material-icons-o">auto_awesome</span>${an ? 'Analyzed at '+new Date(an.at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : 'Click Analyze for improvement suggestions.'}</div>
  </div>`;
}
function reqChipHtml(ev){
  const n = ev.missing + ev.weakCount, kind = ev.missing ? 'bad' : ev.weakCount ? 'warn' : 'ok';
  const tip = n ? `${ev.missing?ev.missing+' missing':''}${ev.missing&&ev.weakCount?' · ':''}${ev.weakCount?ev.weakCount+' to revise':''} — click to analyze` : 'All required items filled — click to analyze';
  return `<button type="button" class="btn btn-secondary btn-sm js-analyze" id="req-chip" title="${esc(tip)}" onclick="A.analyze('${state.__reqJob}')"><span class="material-icons-o">auto_awesome</span>Analyze<span class="an-badge ${kind}">${n ? n : '<span class="material-icons-o">check</span>'}</span></button>`;
}
function reqRefreshUI(jobId){
  const ev = reqEval(jobId);
  const bar = document.getElementById('req-bar'); if(bar) bar.outerHTML = reqBarHtml(jobId, ev);
  const chip = document.getElementById('req-chip'); if(chip) chip.outerHTML = reqChipHtml(ev);
  const tabEl = document.querySelector('#jw-side-tabs [data-tab="check"]');
  if(tabEl){ const n = ev.missing + ev.weakCount; tabEl.innerHTML = 'Analysis' + (n ? ` <span class="jw-side-cnt${ev.missing?' bad':' warn'}">${n}</span>` : ''); }
  publishBtnSync(jobId);
  document.querySelectorAll('.jw-field-input[data-field]').forEach(inp=>{
    const row = ev.rows.find(r=>r.item.field===inp.dataset.field);
    if(row){ const m = !row.ok, w = row.ok && !!row.weak; inp.classList.toggle('is-missing', m); const lab = inp.closest('.jw-field'); if(lab){ lab.classList.toggle('is-missing', m); lab.classList.toggle('is-weak', w); lab.title = w ? row.weak : ''; } }
  });
}
A.openReqBar = function(){ A.setSideTab('check'); };
A.gotoReq = function(jobId, id){
  const it = REQ_ITEMS.find(x=>x.id===id); if(!it) return;
  if(it.field) return A.focusReqField(it.field);
  const ev = reqEval(jobId), row = ev.rows.find(r=>r.item.id===id), head = row && row.where && row.where.sec && row.where.sec.head;
  const n = document.querySelector(head ? '.doc-block[data-block-id="'+head.id+'"]' : '#jw-doc .doc-block');
  if(n){ n.scrollIntoView({block:'start', behavior:'smooth'}); }
};
A.focusReqField = function(field){ const n = document.querySelector('.jw-field-input[data-field="'+field+'"]'); if(n){ n.scrollIntoView({block:'center'}); n.focus(); } };
A.fillRequired = function(jobId, id){
  const it = REQ_ITEMS.find(x=>x.id===id) || REQ_SUGGEST.find(x=>x.id===id); if(!it || !it.heading) return;
  const d = getDraft(jobId,'internal'), secs = groupSections(d.blocks);
  const sec = reqFindSection(secs, it, d).sec;
  let focusId;
  if(sec){
    const spare = sec.blocks.find(b=>b.kind!=='h2' && !reqIsFilled(blockPlainText(b)) && !(it.lead && /^team:/i.test(blockPlainText(b))));
    if(spare) focusId = spare.id;
    else {
      const nb = mkBlock(uid('nb'), it.list?'ul':'p', it.list?[it.starter]:it.starter, {level:it.level||'internal'});
      const last = sec.blocks[sec.blocks.length-1] || sec.head;
      const at = last ? d.blocks.indexOf(last)+1 : 0;
      d.blocks.splice(at, 0, nb); focusId = nb.id;
    }
  } else {
    const h = mkBlock(uid('ns'),'h2',it.heading,{level:it.level||'internal'});
    const nb = mkBlock(uid('nb'), it.list?'ul':'p', it.list?[it.starter]:it.starter, {level:it.level||'internal'});
    insertSectionOrdered(d, [h, nb]); focusId = nb.id;
  }
  d.saveState = 'dirty'; state.__focusBlock = focusId; renderRoute();
};

/* Level / Location / Headcount / Apply via: shown under the title and editable in place; required ones are flagged when empty */
function jobMetaFieldsHtml(j){
  const canEdit = jobAccess(j.id).edit, dAttr = canEdit ? '' : ' disabled';
  const w = v=>Math.max(10, String(v).length+1)+'ch';
  const icons = {level:'military_tech', location:'location_on', headcount:'group'};
  const miss = key=>{ const it=REQ_ITEMS.find(x=>x.field===key); return it && !(key==='headcount' ? Number(j.headcount)>=1 : String(j[key]==null?'':j[key]).trim()); };
  const star = '';
  const _ev = reqEval(j.id), wk = key=>{ const r=_ev.rows.find(x=>x.item.field===key); return r && r.ok && r.weak ? r.weak : ''; };
  const field = (key,label,value,extra)=>`<label class="jw-field${miss(key)?' is-missing':''}${wk(key)?' is-weak':''}" ${wk(key)?`title="${esc(wk(key))}"`:''}><span class="jw-field-label"><span class="material-icons-o">${icons[key]}</span>${label}${star}</span><input class="jw-field-input${extra||''}${miss(key)?' is-missing':''}" data-field="${key}" data-orig="${esc(value==null?'':value)}" value="${esc(value==null?'':value)}" placeholder="Required"${dAttr} ${key==='headcount'?'type="number" min="1" step="1" style="width:8ch"':`style="width:${w(value==null?'':value)}"`} onchange="A.saveJobField('${j.id}','${key}',this)" onkeydown="A.jobFieldKey(event,this)"></label>`;
  const shown = (j.metaShown||[]).map(k=>META_OPT.find(o=>o.key===k)).filter(Boolean);
  return `<div class="jw-meta">${field('location','Location',j.location)}${field('headcount','Headcount',j.headcount)}${field('level','Level',j.level)}${shown.map(o=>metaOptFieldHtml(j,o)).join('')}<span class="meta-break"></span>${canEdit?`<button type="button" class="meta-add" onclick="A.openAddFieldMenu(event,'${j.id}')"><span class="material-icons-o">add</span>Add field</button>`:''}</div>`;
}
/* Optional basic-info fields (completeness standard A2, A3, A5, A6, A9–A12, A14–A16): added on demand */

  {key:'department', label:'Department', icon:'apartment', type:'text'},
  {key:'team', label:'Team', icon:'groups', type:'text'},
  {key:'employmentType', label:'Employment type', icon:'badge', type:'select', opts:['Full-time','Part-time','Contract','Intern']},
  {key:'workplaceType', label:'Workplace type', icon:'home_work', type:'select', opts:['On-site','Hybrid','Remote']},
  {key:'hiringManager', label:'Hiring manager', icon:'person', type:'person'},
  {key:'recruiter', label:'Recruiter', icon:'person_search', type:'person'},
  {key:'reportsTo', label:'Reports to', icon:'account_tree', type:'text'},
  {key:'hiringReason', label:'Hiring reason', icon:'help', type:'select', opts:['New headcount','Business expansion','Replacement']},
  {key:'priority', label:'Priority', icon:'flag', type:'select', opts:['low','normal','high','urgent']},
  {key:'targetStart', label:'Target start date', icon:'event', type:'date'},
  {key:'deadline', label:'Application deadline', icon:'event_busy', type:'date'},
];
function metaOptFieldHtml(j, o){
  const v = j[o.key]==null ? '' : String(j[o.key]);
  const cap = x=>x.charAt(0).toUpperCase()+x.slice(1);
  let ctl;
  if(o.type==='select') ctl = `<select class="jw-field-input jw-field-select" data-field="${o.key}" onchange="A.saveMetaField('${j.id}','${o.key}',this)"><option value="" ${v?'':'selected'}>Not set</option>${o.opts.map(x=>`<option value="${esc(x)}" ${v===x?'selected':''}>${esc(cap(x))}</option>`).join('')}</select>`;
  else if(o.type==='person') ctl = `<select class="jw-field-input jw-field-select" data-field="${o.key}" onchange="A.saveMetaField('${j.id}','${o.key}',this)"><option value="" ${v?'':'selected'}>Not set</option>${Object.values(PEOPLE).map(p=>`<option value="${p.id}" ${v===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`;
  else ctl = `<input class="jw-field-input" data-field="${o.key}" ${o.type==='date'?'type="date"':`style="width:${Math.max(10,v.length+1)}ch" placeholder="Not set"`} data-orig="${esc(v)}" value="${esc(v)}" onchange="A.saveMetaField('${j.id}','${o.key}',this)" onkeydown="A.jobFieldKey(event,this)">`;
  return `<label class="jw-field jw-field-opt"><span class="jw-field-label"><span class="material-icons-o">${o.icon}</span>${o.label}</span>${ctl}<button type="button" class="meta-x" title="Remove from this view" onclick="event.preventDefault();A.removeMetaField('${j.id}','${o.key}')"><span class="material-icons-o">close</span></button></label>`;
}
A.openAddFieldMenu = function(ev, jobId){
  ev.stopPropagation();
  const j = state.jobs[jobId], used = new Set(j.metaShown||[]);
  const left = META_OPT.filter(o=>!used.has(o.key));
  openFloatMenu(ev.currentTarget, `<div class="fm-title">Add field</div>` + (left.length ? left.map(o=>`<button class="fm-item" onclick="A.addMetaField('${jobId}','${o.key}')"><span class="material-icons-o fm-ic">${o.icon}</span><span class="fm-text"><span class="fm-label">${o.label}</span></span></button>`).join('') : `<div class="fm-title" style="text-transform:none;letter-spacing:0;">All fields added</div>`));
};
A.addMetaField = function(jobId, key){
  closeFloatMenu();
  const j = state.jobs[jobId]; j.metaShown = j.metaShown||[]; if(!j.metaShown.includes(key)) j.metaShown.push(key);
  state.__focusMeta = key; renderRoute();
  const n = document.querySelector('.jw-field-input[data-field="'+key+'"]'); if(n){ n.focus(); }
};
A.removeMetaField = function(jobId, key){
  const j = state.jobs[jobId]; j.metaShown = (j.metaShown||[]).filter(k=>k!==key); renderRoute();
};
A.saveMetaField = function(jobId, key, el){
  const j = state.jobs[jobId], o = META_OPT.find(x=>x.key===key); if(!j||!o) return;
  const old = j[key]==null ? '' : String(j[key]), now = el.value.trim();
  if(now===old) return;
  j[key] = now; if(el.dataset) el.dataset.orig = now;
  if(el.tagName==='INPUT' && o.type==='text') el.style.width = Math.max(10, now.length+1)+'ch';
  j.updatedAt = nowISO();
  const show = v=> o.type==='person' ? ((PEOPLE[v]||{}).name||'—') : (v||'—');
  (state.activity[jobId] = state.activity[jobId]||[]).unshift({at:nowISO(), actor:state.currentUserId, text:`Updated ${o.label.toLowerCase()}: ${show(old)} → ${show(now)}.`});
  toast('Saved', 'success');
};
