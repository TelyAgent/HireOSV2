<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sending Labs Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  /* --- light (default) --- */
  --canvas:#F4F6FB;
  --surface:#FFFFFF;
  --surface-2:#F0F2F8;
  --surface-3:#E7EAF3;
  --text:#1B2033;
  --text-muted:#5B6178;
  --text-faint:#8890A6;
  --border:#E1E4EE;
  --border-strong:#C9CEDE;
  --focus-ring:rgba(59,99,224,.35);
  --success:#137A4E;
  --success-bg:#E6F5EC;
  --warning:#9A6300;
  --warning-bg:#FCF1DA;
  --error:#C23434;
  --error-bg:#FBE9E8;
  --info:#2565C7;
  --info-bg:#E8F0FD;
  --shadow-sm:0 1px 2px rgba(20,24,40,.06);
  --shadow-md:0 6px 20px -6px rgba(20,24,40,.18);
  --shadow-lg:0 20px 48px -12px rgba(20,24,40,.28);
  --brand-panel:#0B1830;
  --brand-panel-2:#0F2142;
  --brand-line:#1E3860;

  /* accent: blue (default) */
  --accent:#3B63E0;
  --accent-hover:#2F51C4;
  --accent-active:#28459E;
  --accent-soft:#E8EDFD;
  --accent-soft-strong:#D3DCFA;
  --accent-text-on:#FFFFFF;

  --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;

  --fs-body:16px;
  --fs-aux:14px;
  --fs-cap:12.5px;
  --fs-group:13px;
  --fs-h1:24px;
  --fs-h2:18px;
  --radius-sm:6px;
  --radius-md:8px;
  --radius-lg:12px;
}
:root[data-accent="teal"]{
  --accent:#0E8F82; --accent-hover:#0B7A6F; --accent-active:#08655C;
  --accent-soft:#E3F5F2; --accent-soft-strong:#C6ecE4; --focus-ring:rgba(14,143,130,.35);
}
:root[data-accent="violet"]{
  --accent:#7C5CD9; --accent-hover:#6A4AC2; --accent-active:#563BA3;
  --accent-soft:#EFE9FC; --accent-soft-strong:#DCCFF7; --focus-ring:rgba(124,92,217,.35);
}
:root[data-textsize="small"]{ --fs-body:14px; --fs-aux:12.5px; --fs-cap:11.5px; --fs-h1:20px; --fs-h2:16px; }
:root[data-textsize="large"]{ --fs-body:18px; --fs-aux:16px; --fs-cap:14px; --fs-h1:27px; --fs-h2:20px; }

/* --- dark --- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="deep"]){
    --canvas:#12141C; --surface:#1A1D28; --surface-2:#20232F; --surface-3:#282C3A;
    --text:#E9EAF2; --text-muted:#A3A8BC; --text-faint:#767C92;
    --border:#2C3040; --border-strong:#3B3F52;
    --success:#3FCE8F; --success-bg:#123326; --warning:#E8B646; --warning-bg:#3A2E10;
    --error:#F3746D; --error-bg:#3A1919; --info:#6FA6F2; --info-bg:#152A47;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px -8px rgba(0,0,0,.55); --shadow-lg:0 24px 56px -16px rgba(0,0,0,.65);
    --accent-soft:#20304F; --accent-soft-strong:#28405F;
  }
}
:root[data-theme="dark"]{
  --canvas:#12141C; --surface:#1A1D28; --surface-2:#20232F; --surface-3:#282C3A;
  --text:#E9EAF2; --text-muted:#A3A8BC; --text-faint:#767C92;
  --border:#2C3040; --border-strong:#3B3F52;
  --success:#3FCE8F; --success-bg:#123326; --warning:#E8B646; --warning-bg:#3A2E10;
  --error:#F3746D; --error-bg:#3A1919; --info:#6FA6F2; --info-bg:#152A47;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px -8px rgba(0,0,0,.55); --shadow-lg:0 24px 56px -16px rgba(0,0,0,.65);
  --accent-soft:#20304F; --accent-soft-strong:#28405F;
}
/* --- deep (deep navy / sea) --- */
:root[data-theme="deep"]{
  --canvas:#071427; --surface:#0C1F3B; --surface-2:#102A4A; --surface-3:#163556;
  --text:#E4EEFB; --text-muted:#8EA9C9; --text-faint:#6483A6;
  --border:#1B3A5C; --border-strong:#25507B;
  --success:#37C98E; --success-bg:#0C2A24; --warning:#E7B84C; --warning-bg:#332510;
  --error:#F0736D; --error-bg:#331616; --info:#5FA8F5; --info-bg:#0E2745;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 10px 26px -8px rgba(0,4,20,.6); --shadow-lg:0 26px 60px -16px rgba(0,4,20,.7);
  --accent-soft:#12335A; --accent-soft-strong:#17436F;
}

*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--canvas); color:var(--text);
  font-family:var(--font-ui); font-size:var(--fs-body); line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{ margin:0; font-weight:600; text-wrap:balance; }
p{margin:0;}
a{color:var(--accent);}
button{font-family:inherit;}
img{max-width:100%;display:block;}
::selection{background:var(--accent-soft-strong);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
.tabular{ font-variant-numeric:tabular-nums; }

/* ============================================================
   PRIMITIVES
   ============================================================ */
.btn{
  appearance:none; border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
  font-size:var(--fs-aux); font-weight:500; padding:0 14px; height:38px; border-radius:var(--radius-sm);
  cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  transition:background .12s,border-color .12s,box-shadow .12s;
}
.btn:hover{background:var(--surface-2);}
.btn:active{transform:translateY(0.5px);}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-text-on); }
.btn-primary:hover{ background:var(--accent-hover); border-color:var(--accent-hover); }
.btn-primary:active{ background:var(--accent-active); }
.btn-danger{ background:transparent; border-color:var(--error); color:var(--error); }
.btn-danger:hover{ background:var(--error-bg); }
.btn-ghost{ border-color:transparent; background:transparent; }
.btn-ghost:hover{ background:var(--surface-2); }
.btn-sm{ height:30px; padding:0 10px; font-size:var(--fs-cap); border-radius:6px; }
.btn-block{width:100%; justify-content:center;}
.btn-icon{width:34px;height:34px;padding:0;justify-content:center;}

.field{ display:flex; flex-direction:column; gap:6px; }
.field label{ font-size:var(--fs-cap); font-weight:600; color:var(--text-muted); }
.field .hint{ font-size:var(--fs-cap); color:var(--text-faint); }
.field .err{ font-size:var(--fs-cap); color:var(--error); display:flex; align-items:center; gap:5px;}
input[type=text],input[type=email],input[type=search],input[type=password],select,textarea{
  font:inherit; font-size:var(--fs-aux); color:var(--text); background:var(--surface);
  border:1px solid var(--border-strong); border-radius:var(--radius-sm); padding:0 12px; height:40px;
  min-width:0;
}
textarea{ padding:10px 12px; height:auto; resize:vertical; }
input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--focus-ring); }
input:disabled,select:disabled{ background:var(--surface-2); color:var(--text-faint); cursor:not-allowed; }
input.invalid{ border-color:var(--error); }
.select-wrap{position:relative;}
.select-wrap select{appearance:none; width:100%; padding-right:32px;}
.select-wrap::after{content:"";position:absolute;right:12px;top:50%;width:8px;height:8px;border-right:1.5px solid var(--text-faint);border-bottom:1.5px solid var(--text-faint);transform:translateY(-65%) rotate(45deg);pointer-events:none;}
.checkbox-row{display:flex;align-items:flex-start;gap:10px;font-size:var(--fs-aux);}
.checkbox-row input{width:16px;height:16px;margin-top:3px;accent-color:var(--accent);}

.badge{ display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-cap); font-weight:600; padding:3px 9px; border-radius:999px; line-height:1.4; white-space:nowrap;}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}
.badge-neutral{ background:var(--surface-3); color:var(--text-muted); }
.badge-success{ background:var(--success-bg); color:var(--success); }
.badge-warning{ background:var(--warning-bg); color:var(--warning); }
.badge-error{ background:var(--error-bg); color:var(--error); }
.badge-info{ background:var(--info-bg); color:var(--info); }
.badge-accent{ background:var(--accent-soft); color:var(--accent); }

.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); }
.chip{ display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:4px 10px 4px 4px; font-size:var(--fs-cap); font-weight:500;}
.avatar{ width:30px; height:30px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex:none; }
.avatar-lg{width:52px;height:52px;font-size:18px;}

/* tables */
.table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--surface); }
table{ width:100%; border-collapse:collapse; font-size:var(--fs-aux); min-width:640px; }
thead th{ position:sticky; top:0; background:var(--surface-2); text-align:left; font-size:var(--fs-cap); font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; padding:0 16px; height:38px; border-bottom:1px solid var(--border); white-space:nowrap; }
tbody td{ padding:12px 16px; border-bottom:1px solid var(--border); vertical-align:middle; }
tbody tr:last-child td{border-bottom:none;}
tbody tr.clickable{cursor:pointer;}
tbody tr.clickable:hover{background:var(--surface-2);}
.cell-primary{font-weight:600;}
.cell-sub{color:var(--text-faint); font-size:var(--fs-cap); margin-top:2px;}

/* tabs */
.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); }
.tab{ appearance:none; background:none; border:none; padding:11px 4px; margin-right:22px; font-size:var(--fs-aux); font-weight:500; color:var(--text-muted); cursor:pointer; position:relative; }
.tab:hover{color:var(--text);}
.tab.active{ color:var(--accent); font-weight:600; }
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px 2px 0 0;}

/* toast */
#toast-region{ position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:8px; z-index:900; max-width:380px;}
.toast{ background:var(--text); color:var(--canvas); border-radius:var(--radius-md); padding:11px 14px; font-size:var(--fs-aux); box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:10px; animation:toast-in .18s ease-out; }
:root[data-theme="dark"] .toast,:root[data-theme="deep"] .toast{background:var(--surface-3); color:var(--text); border:1px solid var(--border-strong);}
@media (prefers-color-scheme:dark){ :root:not([data-theme=light]) .toast{background:var(--surface-3); color:var(--text); border:1px solid var(--border-strong);} }
.toast.error{background:var(--error);color:#fff;}
.toast .toast-action{color:inherit; text-decoration:underline; font-weight:600; cursor:pointer; white-space:nowrap; background:none; border:none; font-size:inherit; padding:0;}
@keyframes toast-in{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

/* modal */
.modal-overlay{ position:fixed; inset:0; background:rgba(10,14,26,.5); display:flex; align-items:center; justify-content:center; z-index:950; padding:20px; }
.modal{ background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); width:100%; max-width:480px; max-height:88vh; overflow:auto; border:1px solid var(--border);}
.modal-wide{max-width:640px;}
.modal-head{padding:18px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:12px;}
.modal-head h3{font-size:var(--fs-h2);}
.modal-body{padding:20px 22px; display:flex; flex-direction:column; gap:14px;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}

/* drawer (member/mailbox detail slide-over on narrow contexts not needed; using page nav instead) */

/* empty / status states */
.empty-state{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:56px 20px; color:var(--text-muted); }
.empty-state .icon{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-faint);}
.status-line{display:flex;align-items:center;gap:8px;font-size:var(--fs-aux);color:var(--text-muted);}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:6px;}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{min-height:100vh;}
.appshell{ display:flex; flex-direction:column; min-height:100vh; }
.topbar{ position:sticky; top:0; z-index:40; height:56px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 20px; grid-column:1/-1; }
.topbar-left{display:flex;align-items:center;gap:14px;min-width:0;}
.backlink{display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:var(--fs-aux);text-decoration:none;cursor:pointer;background:none;border:none;font-family:inherit;}
.backlink:hover{color:var(--text);}
.brandmark{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.01em;}
.brandmark .sq{width:16px;height:16px;border-radius:4px;background:#3D9A50;position:relative;flex:none;}
.brandmark .sq::after{content:"";position:absolute;inset:3px;border-radius:2px;background:var(--surface);}
.org-switcher{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:default;font-size:var(--fs-cap);}
.org-switcher .org-dot{width:22px;height:22px;border-radius:6px;background:var(--brand-panel);display:flex;align-items:center;justify-content:center;}
.org-switcher .org-dot .sq{width:9px;height:9px;border-radius:2.5px;}
.topbar-right{display:flex;align-items:center;gap:10px;}

.shell-body{ display:flex; flex:1; min-height:0; width:100%; }
.sidenav{ width:236px; flex:none; border-right:1px solid var(--border); padding:18px 12px 24px; display:flex; flex-direction:column; gap:18px; position:sticky; top:56px; align-self:flex-start; height:calc(100vh - 56px); overflow-y:auto;}
.nav-search{position:relative;}
.nav-search input{width:100%; padding-left:34px; height:36px; background:var(--surface-2); border-color:transparent;}
.nav-search input:focus{background:var(--surface); }
.nav-search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-faint);}
.nav-group-label{ font-size:11px; font-weight:700; letter-spacing:.07em; color:var(--text-faint); text-transform:uppercase; padding:0 10px; margin-top:4px;}
.nav-list{display:flex;flex-direction:column;gap:1px;}
.nav-item{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; color:var(--text-muted); font-size:var(--fs-aux); font-weight:500; text-decoration:none; cursor:pointer; border:none; background:none; width:100%; text-align:left; font-family:inherit;}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
.nav-item svg{flex:none;opacity:.85;}
.nav-empty{padding:12px 10px;font-size:var(--fs-cap);color:var(--text-faint);}

.content{ flex:1; min-width:0; padding:28px 32px 80px; }
.content-inner{max-width:920px;}
.content-inner.wide{max-width:1180px;}
.page-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap;}
.page-header h1{font-size:var(--fs-h1);}
.page-sub{color:var(--text-muted); font-size:var(--fs-aux); margin-top:4px; max-width:64ch;}
.page-header-actions{display:flex;gap:10px;flex:none;}
.scope-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}

.section{ margin-bottom:26px; }
.section-head{margin-bottom:12px;}
.section-head h2{font-size:var(--fs-h2);}
.section-head .desc{color:var(--text-muted); font-size:var(--fs-aux); margin-top:3px; max-width:70ch;}
.divider{height:1px;background:var(--border);margin:24px 0;}

.option-cards{display:flex;gap:12px;flex-wrap:wrap;}
.option-card{ border:1.5px solid var(--border); border-radius:var(--radius-md); padding:12px 14px; cursor:pointer; min-width:120px; display:flex; flex-direction:column; gap:8px; background:var(--surface); }
.option-card:hover{border-color:var(--border-strong);}
.option-card.selected{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); background:var(--accent-soft); }
.option-card .swatch{ height:38px; border-radius:6px; }
.option-card .label{font-size:var(--fs-aux); font-weight:600; display:flex; align-items:center; justify-content:space-between;}
.option-card .check{width:16px;height:16px;border-radius:50%;background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center;font-size:10px;}
.option-card.selected .check{display:flex;}

.save-bar{ position:sticky; bottom:0; background:var(--surface); border-top:1px solid var(--border); padding:12px 0; margin-top:18px; display:flex; align-items:center; justify-content:space-between; gap:14px; z-index:20;}
.save-bar .status{display:flex;align-items:center;gap:8px;font-size:var(--fs-aux);color:var(--text-muted);}
.save-bar .status.saved{color:var(--success);}
.save-bar .status.error{color:var(--error);}
.save-bar-actions{display:flex;gap:10px;}

.list-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--border);}
.list-row:last-child{border-bottom:none;}
.list-row .lr-main{display:flex;align-items:center;gap:12px;min-width:0;}
.list-row .lr-title{font-weight:600;font-size:var(--fs-aux);}
.list-row .lr-sub{color:var(--text-faint);font-size:var(--fs-cap);margin-top:2px;}

.kv{display:grid; grid-template-columns:180px 1fr; gap:6px 16px; font-size:var(--fs-aux);}
.kv dt{color:var(--text-muted);}
.kv dd{margin:0;}

.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.filter-bar .search-input{position:relative; flex:1; min-width:180px; max-width:320px;}
.filter-bar .search-input input{width:100%;padding-left:32px;}
.filter-bar .search-input svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-faint);}
.filter-select select{height:36px;font-size:var(--fs-cap);}
.result-count{font-size:var(--fs-cap); color:var(--text-faint); margin-left:auto;}
.link-btn{background:none;border:none;color:var(--accent);font-weight:600;font-size:inherit;cursor:pointer;padding:0;font-family:inherit;}
.link-btn:hover{text-decoration:underline;}
.text-faint{color:var(--text-faint);}
.text-muted{color:var(--text-muted);}
.mono{font-family:var(--font-mono);}
.demo-tag{display:inline-flex;align-items:center;gap:4px;background:var(--warning-bg);color:var(--warning);font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;}

/* ============================================================
   AUTH / ONBOARDING SCREENS
   ============================================================ */
.auth-shell{ min-height:100vh; display:flex; }
.auth-brand{ width:44%; min-width:360px; background:linear-gradient(160deg,var(--brand-panel),var(--brand-panel-2)); position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; padding:44px; }
.auth-brand::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 15% 85%,rgba(61,154,80,.18),transparent 45%),radial-gradient(circle at 85% 10%,rgba(90,140,220,.15),transparent 45%);}
.auth-brand-logo{position:relative;z-index:1;}
.auth-brand-logo img{width:190px;}
.auth-brand-quote{position:relative;z-index:1;color:#CBD8ED;font-size:15px;line-height:1.65;max-width:380px;}
.auth-brand-quote b{color:#fff;}
.auth-brand-grid{position:absolute; inset:0; background-image:linear-gradient(var(--brand-line) 1px,transparent 1px),linear-gradient(90deg,var(--brand-line) 1px,transparent 1px); background-size:44px 44px; opacity:.35;}

.demo-panel h4{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint);}

/* ---- toast ---- */
function toast(msg, opts){
  opts = opts||{};
  const id = "t"+Math.random().toString(36).slice(2);
  const region = qs("#toast-region");
  const el = document.createElement("div");
  el.className = "toast"+(opts.error?" error":"");
  el.id = id;
  el.innerHTML = '<span style="flex:1">'+esc(msg)+'</span>'+(opts.actionLabel? '<button class="toast-action" data-action="'+esc(opts.action||"")+'">'+esc(opts.actionLabel)+'</button>' : '');
  region.appendChild(el);
  setTimeout(()=>{ el.style.transition="opacity .25s"; el.style.opacity="0"; setTimeout(()=>el.remove(), 260); }, opts.duration||3600);
}

/* ---- modal ---- */
let modalCloseFn = null;
function openModal(html, opts){
  opts = opts||{};
  closeModal();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modal-overlay";
  overlay.innerHTML = '<div class="modal'+(opts.wide?" modal-wide":"")+'" role="dialog" aria-modal="true">'+html+'</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener("mousedown", (e)=>{ if(e.target===overlay) closeModal(); });
  document.addEventListener("keydown", escHandler);
  modalCloseFn = ()=>{ overlay.remove(); document.removeEventListener("keydown", escHandler); };
  const first = overlay.querySelector("input,button,select,textarea");
  if(first) first.focus();
}
function escHandler(e){ if(e.key==="Escape") closeModal(); }
function closeModal(){ if(modalCloseFn){ modalCloseFn(); modalCloseFn=null; } }

function renderSaveBarHTML(key, opts){
  opts = opts||{};

function handleAction(action, el, evt){
  const ACTIONS = window.__ACTIONS__;
  if(ACTIONS && ACTIONS[action]){ ACTIONS[action](el, evt); return; }
  console.warn("No handler for action:", action);
}
window.__ACTIONS__ = {};
function on(name, fn){ window.__ACTIONS__[name] = fn; }

on("auth-continue", ()=>{
  const input = qs("#email-input");
  const email = (input.value||"").trim();
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    input.classList.add("invalid");
    let hint = qs("#email-input").parentElement.querySelector(".err");
    if(!hint){ hint = document.createElement("div"); hint.className="err"; hint.innerHTML = icon("close",12)+" Enter a valid email address."; input.parentElement.appendChild(hint); }
    input.focus();
    return;
  }
  STATE.verify.email = email;
  STATE.verify.code = "482913";
  STATE.verify.input = "";
  STATE.verify.attempts = 0;
  STATE.verify.locked = false;
  STATE.verify.sentAt = Date.now();
  STATE.verify.cooldownUntil = Date.now() + 60000;
  STATE.verify.lastError = null;
  persist();
  navigate("#/auth/verify");
});

/* ---- 2. Verify email ---- */
function renderAuthVerify(){
  const v = STATE.verify;
  const boxes = (v.input||"").padEnd(6," ").split("").map((c,i)=>
    '<input class="code-box" maxlength="1" inputmode="numeric" data-code-idx="'+i+'" value="'+(c.trim()?esc(c):"")+'"'+(i===0?' data-autofocus':'')+'/>'
  ).join("");
  let errorHtml = "";
  if(v.lastError==="wrong") errorHtml = '<div class="field err">'+icon("close",12)+" That code isn't valid. Try again. ("+(5-v.attempts)+" attempt"+((5-v.attempts)===1?"":"s")+" left)</div>";
  if(v.lastError==="expired") errorHtml = '<div class="field err">'+icon("close",12)+" This code has expired. Send a new code.</div>";
  if(v.locked) errorHtml = '<div class="field err">'+icon("close",12)+" Too many incorrect attempts. Request a new code to continue.</div>";
  const cooldownLeft = Math.max(0, Math.ceil((v.cooldownUntil-Date.now())/1000));
  return authWrap(
    '<h1>Enter your code</h1>'+
    '<div class="lead">We sent a 6-digit code to <b>'+esc(v.email||"your email")+'</b>.</div>'+
    '<div class="auth-form">'+
      '<div class="code-input-row" id="code-row">'+boxes+'</div>'+
      errorHtml+
      '<button class="btn btn-primary btn-block" data-action="verify-submit" '+(v.locked?"disabled":"")+'>Verify and continue</button>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;">'+
        '<button class="link-btn" data-action="nav" data-href="#/auth">Change email</button>'+
        (cooldownLeft>0
          ? '<span class="timer" id="resend-timer">Resend in '+cooldownLeft+'s</span>'
          : '<button class="link-btn" data-action="verify-resend">Resend code</button>')+
      '</div>'+
    '</div>'+
    authFoot('Demo code for this walkthrough: <b class="mono">482913</b>. Use Demo controls to jump straight to an expired or locked state.')
  );
}
function wireCodeBoxes(){
  const boxes = qsa("#code-row .code-box");
  boxes.forEach((b,i)=>{
    b.addEventListener("input", ()=>{
      b.value = b.value.replace(/[^0-9]/g,"").slice(0,1);
      const arr = boxes.map(x=>x.value||" ");
      STATE.verify.input = arr.join("").replace(/\s+$/,"");
      if(b.value && boxes[i+1]) boxes[i+1].focus();
    });
    b.addEventListener("keydown",(e)=>{
      if(e.key==="Backspace" && !b.value && boxes[i-1]) boxes[i-1].focus();
      if(e.key==="Enter") window.__ACTIONS__["verify-submit"]();
    });
    b.addEventListener("paste",(e)=>{
      e.preventDefault();
      const txt = (e.clipboardData.getData("text")||"").replace(/[^0-9]/g,"").slice(0,6);
      txt.split("").forEach((ch,idx)=>{ if(boxes[idx]) boxes[idx].value = ch; });
      STATE.verify.input = txt;
      const last = boxes[Math.min(txt.length,6)-1]; if(last) last.focus();
    });
  });
}
on("verify-resend", ()=>{
  const v = STATE.verify;
  if(Date.now() < v.cooldownUntil) return;
  v.code = "482913"; v.sentAt = Date.now(); v.attempts = 0; v.locked=false; v.lastError=null; v.input="";
  v.cooldownUntil = Date.now()+60000;
  persist(); render();
  toast("A new code was sent. Any earlier code is now invalid.");
});
on("verify-submit", ()=>{
  const v = STATE.verify;
  if(v.locked) return;
  if(Date.now() > v.sentAt + v.expiresInMs){ v.lastError="expired"; persist(); render(); return; }
  if((v.input||"").length!==6){ v.lastError="wrong"; persist(); render(); return; }
  if(v.input !== v.code){
    v.attempts++;
    if(v.attempts>=5){ v.locked = true; }
    v.lastError="wrong"; persist(); render(); return;
  }
  // success
  completeVerification(v.email);
});
function completeVerification(email){
  STATE.verify.lastError = null;
  const existing = STATE.people.find(p=>p.email.toLowerCase()===email.toLowerCase());
  if(existing){
    signIn(existing.id);
    toast("Signed in as "+personName(existing)+".");
    navigate("#/settings/appearance", true);
    return;
  }
  STATE.onboardingName = "";
  navigate("#/onboarding/profile", true);
}
function signIn(personId){
  STATE.session.signedIn = true;
  STATE.session.userId = personId;
  STATE.session.orgId = ORG.id;
  const p = findPerson(personId);
  if(p){ STATE.account.email = p.email; STATE.account.name = personName(p);
    STATE.demoRole = p.system_role || (p.role) || "employee"; }
  persist();
}

  return authWrap(

function renderInvite(id){

  const roleLabel = ROLE_LABELS[inv.role]||inv.role;
  let body = "";
  if(inv.status==="pending"){
    body = '<div class="lead">'+esc(inv.invitedBy)+' invited you to join <b>'+esc(ORG.display_name)+'</b> as <b>'+esc(roleLabel)+'</b>'+(inv.scope?' on '+esc(inv.scope):'')+'.</div>'+
      '<div class="card" style="padding:14px 16px;margin:6px 0 18px"><dl class="kv"><dt>Invited email</dt><dd>'+esc(inv.email)+'</dd><dt>Expires</dt><dd>'+esc(inv.expiresAt)+'</dd></dl></div>'+
      '<div class="auth-form">'+
        '<button class="btn btn-primary btn-block" data-action="invite-accept" data-id="'+inv.id+'">Accept invitation</button>'+
        '<button class="btn btn-block" data-action="invite-mismatch" data-id="'+inv.id+'">I’m signed in with a different email</button>'+
      '</div>';
  } else if(inv.status==="expired"){
    body = '<div class="lead">This invitation to join <b>'+esc(ORG.display_name)+'</b> has expired.</div>'+
      emptyState("Invitation no longer available","Ask "+esc(inv.invitedBy)+" to send a new one to "+esc(inv.email)+".")+
      '<div class="auth-form" style="margin-top:16px"><button class="btn btn-primary btn-block" data-action="invite-request-new" data-id="'+inv.id+'">Request a new invitation</button></div>';
  } else if(inv.status==="revoked"){
    body = '<div class="lead">This invitation was revoked by an admin.</div>'+
      emptyState("This invitation is no longer available","Contact an organization admin if you still need access.");
  } else if(inv.status==="accepted"){
    body = '<div class="lead">You’ve already joined <b>'+esc(ORG.display_name)+'</b> with this invitation.</div>'+
      '<div class="auth-form"><button class="btn btn-primary btn-block" data-action="nav" data-href="#/settings/appearance">Go to workspace</button></div>';

function renderSettingsRoute(parts){

  };
  const orgOnly = ["organization","access","defaults","ai-models","connections","data-policies","activity"];

      groups[g].map(r=>navItemHtml({key:r.key,label:r.label,route:"#/settings/"+r.key,icon:(NAV_PERSONAL.concat(NAV_ORG).find(n=>n.key===r.key)||{}).icon||"dot"}, "")).join("")+

  closeModal();

}
function renderAccess(){
  const f = STATE.ui.invFilter||"all";
  const invs = STATE.invitations.filter(i=> f==="all" || i.status===f);

    const actions = inv.status==="pending" ?
      '<button class="btn btn-sm" data-action="inv-resend" data-id="'+inv.id+'">Resend</button> <button class="btn btn-sm btn-danger" data-action="inv-revoke" data-id="'+inv.id+'">Revoke</button>'

  }).join("");
  const table = invs.length ? '<div class="table-wrap"><table><thead><tr><th>Email</th><th>Invited role</th><th>Scope</th><th>Invited by</th><th>Expires</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'

on("inv-resend", (el)=>{

  inv.status = "pending"; inv.sentAt = new Date().toISOString().slice(0,10); inv.expiresAt = new Date(Date.now()+7*86400000).toISOString().slice(0,10);

  openModal('<div class="modal-head"><h3>No eligible model</h3><button class="btn btn-icon btn-ghost" data-action="modal-close">'+icon("close",16)+'</button></div>'+
    '<div class="modal-body"><div class="status-line" style="color:var(--error)">'+icon("close",14)+' No eligible model for this task under current data, budget and quality constraints.</div>'+
    '<div class="hint">HireOS never relaxes a privacy or quality gate to force a result — the task fails clearly instead.</div></div>'+
    '<div class="modal-foot"><button class="btn btn-primary" data-action="modal-close">Close</button></div>');
});

function aiCompareTab(){
  const rows = STATE.aiModels.evaluations.map(e=>
    '<tr><td class="cell-primary">'+esc(e.task)+'</td><td>'+esc(e.language)+'</td><td>'+esc(e.dataset)+'</td>'+
    '<td>'+esc(e.quality)+'</td><td class="mono">'+esc(e.cost)+'</td><td class="mono">'+esc(e.p50)+' / '+esc(e.p95)+'</td>'+

    '<div class="hint" style="margin-top:10px">Selecting Chinese or Vietnamese here doesn’t mean the interface language has shipped, or that this model has passed evaluation for that task yet.</div>';

function aiUsageTab(){
  const tiles = STATE.aiModels.usage.map(u=>'<div class="stat-tile"><div class="lbl">'+esc(u.scope)+' · '+esc(u.period)+'</div>'+
    '<div class="val tabular">'+u.calls.toLocaleString()+'</div><div class="sub">calls</div>'+
    '<div class="kv" style="grid-template-columns:1fr 1fr;margin-top:10px;font-size:var(--fs-cap)"><dt>Estimated</dt><dd class="tabular">'+esc(u.estCost)+'</dd><dt>Actual</dt><dd class="tabular">'+esc(u.actualCost)+'</dd><dt>Pending reconciliation</dt><dd class="tabular">'+esc(u.pending)+'</dd></div></div>').join("");
  return '<div class="stat-grid">'+tiles+'</div>'+
    '<div class="hint" style="margin-top:14px">Every retry and fallback attempt is billed to the same logical task — pending reconciliation covers costs not yet confirmed by the provider, never a promise of zero duplicate billing.</div>';
}
function aiVersionsTab(){
  const rows = STATE.aiModels.versions.map(v=>'<tr><td class="cell-primary">'+esc(v.policy)+'</td><td class="mono">'+esc(v.version)+'</td>'+
    '<td>'+(v.state==="Active"?statusBadge("Active","success"):statusBadge("Superseded","neutral"))+'</td><td>'+esc(v.publishedBy)+'</td><td class="text-faint">'+esc(v.date)+'</td></tr>').join("");
  return '<div class="table-wrap"><table><thead><tr><th>Policy</th><th>Version</th><th>State</th><th>Published by</th><th>Date</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function aiAutomationSection(){
  const a = STATE.aiModels.automation;
  return '<div class="section-head"><h2>Automation</h2><div class="desc">Full scope stays available even in this settings-focused prototype — nothing here is trimmed as an “advanced” placeholder.</div></div>'+
  '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px">'+
    '<div class="card" style="padding:16px 18px"><div style="font-weight:700;margin-bottom:8px">Price sync</div>'+
      '<dl class="kv" style="grid-template-columns:110px 1fr;font-size:var(--fs-cap)"><dt>Support</dt><dd>'+statusBadge(a.priceSync.supported?"Supported":"Unsupported", a.priceSync.supported?"success":"neutral")+'</dd>'+
      '<dt>Schedule</dt><dd>'+esc(a.priceSync.schedule)+'</dd><dt>Last run</dt><dd class="tabular">'+esc(a.priceSync.lastRun)+' · '+esc(a.priceSync.status)+'</dd></dl>'+
      '<button class="btn btn-sm" style="margin-top:10px" data-action="ai-price-sync-retry">Retry now</button></div>'+
    '<div class="card" style="padding:16px 18px"><div style="font-weight:700;margin-bottom:8px">Quality regression</div>'+
      '<dl class="kv" style="grid-template-columns:110px 1fr;font-size:var(--fs-cap)"><dt>Task</dt><dd>'+esc(a.qualityRegression.task)+' · '+esc(a.qualityRegression.language)+'</dd>'+
      '<dt>Schedule</dt><dd>'+esc(a.qualityRegression.schedule)+'</dd><dt>Threshold</dt><dd>'+esc(a.qualityRegression.threshold)+'</dd>'+
      '<dt>Last result</dt><dd>'+esc(a.qualityRegression.lastResult)+' ('+esc(a.qualityRegression.date)+')</dd></dl></div>'+
    '<div class="card" style="padding:16px 18px"><div style="font-weight:700;margin-bottom:8px">Controlled rollout</div>'+
      '<dl class="kv" style="grid-template-columns:110px 1fr;font-size:var(--fs-cap)"><dt>Scope</dt><dd>'+esc(a.rollout.scope)+'</dd>'+
      '<dt>Traffic</dt><dd>'+a.rollout.pct+'%</dd><dt>Budget cap</dt><dd>'+esc(a.rollout.budgetCap)+'</dd><dt>Stop if</dt><dd>'+esc(a.rollout.stopCondition)+'</dd></dl>'+
      '<div class="progress" style="margin-top:8px"><span style="width:'+a.rollout.pct+'%"></span></div>'+
      '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-sm btn-danger" data-action="ai-rollout-stop">Stop rollout</button></div></div>'+
    '<div class="card" style="padding:16px 18px"><div style="font-weight:700;margin-bottom:8px">Alerts</div>'+
      '<dl class="kv" style="grid-template-columns:110px 1fr;font-size:var(--fs-cap)"><dt>Rule</dt><dd>'+esc(a.alerts.rule)+'</dd>'+
      '<dt>Recipients</dt><dd>'+esc(a.alerts.recipients)+'</dd><dt>Frequency</dt><dd>'+esc(a.alerts.frequency)+'</dd><dt>History</dt><dd>'+a.alerts.history+' alerts, last 30 days</dd></dl></div>'+
  '</div>';
}
on("ai-price-sync-retry", ()=>{ STATE.aiModels.automation.priceSync.lastRun = new Date().toISOString().slice(0,16).replace("T"," "); persist(); render(); toast("Price sync re-run — succeeded."); });
on("ai-rollout-stop", ()=>{ STATE.aiModels.automation.rollout.status="Stopped"; STATE.aiModels.automation.rollout.pct=0; persist(); render(); toast("Controlled rollout stopped. No further requests route to the candidate model."); });


/* ============================================================
   ORGANIZATION · CONNECTIONS & DELIVERY
   ============================================================ */
function connStatusBadge(s){
  return {Connected:statusBadge("Connected","success"), "Not connected":statusBadge("Not connected","neutral"),
    "Authorization required":statusBadge("Authorization required","warning"), Paused:statusBadge("Paused","neutral"),
    Failed:statusBadge("Failed","error"), Connecting:statusBadge("Connecting…","info")}[s] || statusBadge(s,"neutral");
}
function renderConnections(){
  STATE.ui.connTab = STATE.ui.connTab || "mailboxes";
  const tab = STATE.ui.connTab;
  const tabs = [{key:"mailboxes",label:"Mailboxes"},{key:"connections",label:"Connections"},{key:"delivery",label:"Delivery"}];
  const body =
    pageHeader("Connections & Delivery","Public mailboxes, read/send authorization and outbound identity — kept separate from anyone's personal login.")+
    tabsHtml(tabs, tab, "conn-tab")+
    '<div style="margin-top:20px">'+
    (tab==="mailboxes"?connMailboxesTab():tab==="connections"?connConnectionsTab():connDeliveryTab())+
    '</div>';
  return renderShell("connections", body, {wide:true});
}
on("conn-tab", (el)=>{ STATE.ui.connTab = el.getAttribute("data-tab"); persist(); render(); });

function connMailboxesTab(){
  const rows = STATE.mailboxes.map(m=>
    '<tr class="clickable" data-action="mailbox-open" data-id="'+m.id+'"><td class="cell-primary">'+esc(m.email)+(m.company_label?'<div class="cell-sub">'+esc(m.company_label)+'</div>':'')+'</td>'+
    '<td>'+m.purposes.map(p=>'<span class="badge badge-neutral" style="margin:1px 3px 1px 0">'+esc(p)+'</span>').join("")+'</td>'+
    '<td>'+esc(m.manager||"Not specified")+'</td>'+
    '<td>'+connStatusBadge(m.connection_status)+'</td>'+
    '<td>'+(m.sending_status==="Authorized"?statusBadge("Authorized","success"):statusBadge("Sending not authorized","neutral"))+'</td></tr>').join("");
  return '<div class="table-wrap"><table><thead><tr><th>Email</th><th>Purpose</th><th>Manager</th><th>Connection</th><th>Sending status</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="hint" style="margin-top:10px">hr@sding.me carries two purposes on one resource — it isn’t split into duplicate mailboxes. Registering an address never creates a personal login, and <span class="mono">admin@pallax.ai</span> never becomes a Super Admin on its own.</div>';
}
on("mailbox-open", (el)=>{
  const m = STATE.mailboxes.find(x=>x.id===el.getAttribute("data-id"));
  openModal('<div class="modal-head"><h3>'+esc(m.email)+'</h3><button class="btn btn-icon btn-ghost" data-action="modal-close">'+icon("close",16)+'</button></div>'+
    '<div class="modal-body">'+
    '<dl class="kv"><dt>Purposes</dt><dd>'+m.purposes.join(", ")+'</dd>'+
    '<dt>Company / project label</dt><dd>'+esc(m.company_label||"Not specified")+'</dd>'+
    '<dt>Manager</dt><dd>'+esc(m.manager||"Not specified")+'</dd>'+
    '<dt>Connection</dt><dd>'+connStatusBadge(m.connection_status)+'</dd>'+
    '<dt>Sending</dt><dd>'+(m.sending_status==="Authorized"?statusBadge("Authorized","success"):statusBadge("Not authorized","neutral"))+'</dd>'+
    (m.note?'<dt>Note</dt><dd>'+esc(m.note)+'</dd>':'')+'</dl>'+
    '</div><div class="modal-foot">'+
    (m.connection_status==="Not connected" ? '<button class="btn btn-primary" data-action="mailbox-connect" data-id="'+m.id+'">Connect</button>'
      : m.connection_status==="Authorization required" ? '<button class="btn btn-primary" data-action="mailbox-connect" data-id="'+m.id+'">Reauthorize</button>'
      : '<button class="btn btn-danger" data-action="mailbox-disconnect" data-id="'+m.id+'">Disconnect</button>')+
    '<button class="btn" data-action="modal-close">Close</button></div>');
});
on("mailbox-connect", (el)=>{
  const m = STATE.mailboxes.find(x=>x.id===el.getAttribute("data-id"));
  closeModal();
  toast("Opening provider authorization (simulated)…");
  setTimeout(()=>{
    m.connection_status="Connected"; m.sending_status="Authorized"; m.manager = m.manager || STATE.account.name;
    STATE.activity.unshift({id:"a"+Date.now(), ts:new Date().toISOString(), actor:STATE.account.name, type:"Connection", object:m.email, summary:"Connected and authorized for sending (demo)"});
    persist(); render();
    toast(m.email+" connected. This is a demo authorization — no real mailbox is linked.");
  }, 900);
});
on("mailbox-disconnect", (el)=>{
  const m = STATE.mailboxes.find(x=>x.id===el.getAttribute("data-id"));
  m.connection_status="Not connected"; m.sending_status="Sending not authorized";
  closeModal(); persist(); render(); toast(m.email+" disconnected. Prior activity history is kept.");
});

function connConnectionsTab(){
  const rows = STATE.connections.map(c=>
    '<tr><td class="cell-primary">'+esc(c.label)+'<div class="cell-sub">'+esc(c.kind)+' · '+esc(c.scope)+'</div></td>'+
    '<td>'+connStatusBadge(c.status)+(c.errorNote?'<div class="cell-sub" style="color:var(--warning)">'+esc(c.errorNote)+'</div>':'')+'</td>'+
    '<td class="tabular">'+(c.lastRun||"—")+'</td>'+
    '<td>'+connActionButtons(c)+'</td></tr>').join("");
  return '<div class="table-wrap"><table><thead><tr><th>Connection</th><th>Status</th><th>Last run</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function connActionButtons(c){
  const btns = [];
  if(c.status==="Authorization required") btns.push('<button class="btn btn-sm btn-primary" data-action="conn-reauth" data-id="'+c.id+'">Reauthorize</button>');
  if(c.status==="Connected"){ btns.push('<button class="btn btn-sm" data-action="conn-readnow" data-id="'+c.id+'">Read now</button>'); btns.push('<button class="btn btn-sm btn-ghost" data-action="conn-pause" data-id="'+c.id+'">Pause</button>'); }
  if(c.status==="Paused") btns.push('<button class="btn btn-sm" data-action="conn-resume" data-id="'+c.id+'">Resume</button>');
  if(c.status==="Not connected") btns.push('<button class="btn btn-sm btn-primary" data-action="conn-connect" data-id="'+c.id+'">Connect</button>');
  btns.push('<button class="btn btn-sm btn-ghost" data-action="conn-test" data-id="'+c.id+'">Test</button>');
  return btns.join(" ");
}
function connFind(id){ return STATE.connections.find(x=>x.id===id); }
on("conn-reauth", (el)=>{ const c=connFind(el.getAttribute("data-id")); c.status="Connected"; c.errorNote=null; c.lastRun=new Date().toISOString().slice(0,16).replace("T"," "); persist(); render(); toast(c.label+" reauthorized."); });
on("conn-readnow", (el)=>{
  const c=connFind(el.getAttribute("data-id"));
  toast("Reading now…");
  setTimeout(()=>{ c.lastRun=new Date().toISOString().slice(0,16).replace("T"," "); persist(); render(); toast("Read complete — matched=0. Empty scans still record success."); }, 700);
});
on("conn-pause", (el)=>{ const c=connFind(el.getAttribute("data-id")); c.status="Paused"; persist(); render(); toast(c.label+" paused. History is kept."); });
on("conn-resume", (el)=>{ const c=connFind(el.getAttribute("data-id")); c.status="Connected"; persist(); render(); toast(c.label+" resumed — checkpoint re-scan queued, already-successful items won’t be redone."); });
on("conn-connect", (el)=>{ const c=connFind(el.getAttribute("data-id")); c.status="Connected"; c.lastRun=new Date().toISOString().slice(0,16).replace("T"," "); persist(); render(); toast(c.label+" connected (demo)."); });
on("conn-test", ()=>{ toast("Connection test succeeded (simulated)."); });

function connDeliveryTab(){
  const authorized = STATE.mailboxes.filter(m=>m.sending_status==="Authorized");
  return '<div class="section"><div class="section-head"><h2>Sending identity</h2><div class="desc">From / Reply-to always come from an authorized resource for this project — never a hard-coded address.</div></div>'+
    '<div class="card" style="padding:16px 18px;display:flex;flex-direction:column;gap:12px">'+
    fieldSelect("delivery-from","From", authorized.length ? authorized.map(m=>({value:m.email,label:m.email})) : [{value:"",label:"No authorized mailbox available"}], authorized[0]?authorized[0].email:"")+
    (authorized.length===0 ? '<div class="field err">'+icon("close",12)+' No mailbox is authorized to send yet. <button class="link-btn" data-action="conn-tab-jump-mailboxes">Configure one</button></div>' : '')+
    '<div class="kv"><dt>Reply-to</dt><dd>Same as From, unless overridden per project</dd><dt>Recipient language</dt><dd>Detected from recipient, English fallback</dd><dt>Recipient time zone</dt><dd>Shown alongside sender’s time zone</dd></div>'+
    '<button class="btn btn-primary" style="align-self:flex-start" data-action="delivery-send-preview" '+(authorized.length===0?"disabled":"")+'>Preview & send test (demo)</button>'+
    '</div></div>'+
    '<div class="section"><div class="section-head"><h2>Recent deliveries</h2></div>'+
    '<div class="card" style="padding:6px 18px">'+
    '<div class="list-row"><div class="lr-main"><div><div class="lr-title">Interview invite — Backend Engineer</div><div class="lr-sub">To candidate · via '+(authorized[0]?esc(authorized[0].email):"—")+'</div></div></div>'+statusBadge("Delivered","success")+'</div>'+
    '<div class="list-row"><div class="lr-main"><div><div class="lr-title">Offer acknowledgement</div><div class="lr-sub">To hiring manager</div></div></div>'+statusBadge("Outcome unknown","warning")+'<button class="btn btn-sm" data-action="delivery-check-status" style="margin-left:8px">Check status</button></div>'+
    '</div></div>';
}
on("conn-tab-jump-mailboxes", ()=>{ STATE.ui.connTab="mailboxes"; persist(); render(); });
on("delivery-send-preview", ()=>{
  toast("Sending is simulated in this prototype — no real message is delivered.");
});
on("delivery-check-status", (el)=>{
  toast("Checking… delivery confirmed (simulated).");
});

  openModal('<div class="modal-head"><h3>About this prototype</h3><button class="btn btn-icon btn-ghost" data-action="modal-close">'+icon("close",16)+'</button></div>'+
    '<div class="modal-body">'+
    '<p>A click-through, high-fidelity prototype of HireOS Command’s <b>shared Settings, Organization, Account & Access</b> module for Sending Labs — built from the Settings PRD v2.4, Shared Capabilities PRD v1.1 and the Shared Settings Design Brief v1.1.</p>'+
    '<p class="hint">Real reference data: 9 people, 7 functional mailboxes and 2 confirmed recruiting responsibilities from the company reference and Mock Data v1.2. Everything else — connections, model runs, invitations, deliveries — is simulated locally in your browser; nothing is sent anywhere.</p>'+
    '<p class="hint">Scoped down from the full brief: business workspaces (Screening/Interview/JD), the candidate comparison framework (SHARED-12) and true multi-admin concurrency are out of scope here — this build focuses on Settings itself. Role switching in Demo controls simulates visibility only; a real build still needs server-side checks.</p>'+
    '</div><div class="modal-foot"><button class="btn btn-primary" data-action="modal-close">Got it</button></div>');
});

/* ============================================================
   INIT
   ============================================================ */
function boot(){
  loadState();
  applyThemeAttrs();
  if(!location.hash) location.hash = STATE.session.signedIn ? "#/settings/appearance" : "#/auth";
  render();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
</script>
