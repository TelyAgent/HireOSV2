<!doctype html>
<html><head><meta charset="utf-8"><title>HireOS Interview architecture</title>
<style>
  body{margin:0;background:#fff;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  svg text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
</style></head>
<body>
<svg id="diagram" xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
  </defs>
  <rect width="1600" height="1100" fill="#fff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">HireOS Interview — architecture and Zoom data flow</text>
  <text x="40" y="80" font-size="15" fill="#475569">All connections to Zoom and OpenAI are HTTPS/TLS. PostgreSQL and the internal services are reachable only inside the private Docker network.</text>

  <!-- Browser -->
  <rect x="40" y="120" width="330" height="430" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="152" font-size="18" font-weight="700" fill="#0f172a">Interviewer's browser</text>
  <rect x="62" y="172" width="286" height="96" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="80" y="200" font-size="15" font-weight="600" fill="#0f172a">HireOS web app</text>
  <text x="80" y="222" font-size="13" fill="#334155">React 19 SPA (static, from nginx)</text>
  <text x="80" y="242" font-size="13" fill="#334155">Schedule, live interview, review UI</text>
  <rect x="62" y="290" width="286" height="118" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="80" y="318" font-size="15" font-weight="600" fill="#0f172a">Embedded Zoom Meeting SDK</text>
  <text x="80" y="340" font-size="13" fill="#334155">Web SDK 6.2.0, same-origin iframe</text>
  <text x="80" y="360" font-size="13" fill="#334155">Joins with server-signed SDK JWT</text>
  <text x="80" y="380" font-size="13" fill="#334155">+ host ZAK (not stored)</text>
  <rect x="62" y="430" width="286" height="96" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="80" y="458" font-size="15" font-weight="600" fill="#0f172a">Candidate</text>
  <text x="80" y="480" font-size="13" fill="#334155">Joins the same Zoom meeting with the</text>
  <text x="80" y="500" font-size="13" fill="#334155">join link (any Zoom client)</text>

  <!-- Server -->
  <rect x="440" y="120" width="560" height="760" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="460" y="152" font-size="18" font-weight="700" fill="#0f172a">HireOS server — Google Cloud, Ubuntu, Docker Compose</text>
  <rect x="470" y="172" width="500" height="70" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="490" y="200" font-size="15" font-weight="600" fill="#0f172a">nginx (host) — TLS termination</text>
  <text x="490" y="222" font-size="13" fill="#334155">https://hireos.aipollo.me, Let's Encrypt certificate</text>
  <rect x="470" y="272" width="500" height="62" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="490" y="300" font-size="15" font-weight="600" fill="#0f172a">Gateway (nginx container)</text>
  <text x="490" y="320" font-size="13" fill="#334155">Routes /interview/ and /interview/api/ to the services below</text>
  <rect x="470" y="364" width="220" height="80" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="488" y="392" font-size="15" font-weight="600" fill="#0f172a">interview-frontend</text>
  <text x="488" y="414" font-size="13" fill="#334155">nginx, static SPA files</text>
  <rect x="710" y="364" width="260" height="250" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="728" y="392" font-size="15" font-weight="600" fill="#0f172a">interview-backend</text>
  <text x="728" y="414" font-size="13" fill="#334155">Node.js 24, NestJS 11</text>
  <text x="728" y="440" font-size="13" fill="#334155">• OAuth callback, token refresh</text>
  <text x="728" y="460" font-size="13" fill="#334155">• Meeting create / delete, ZAK</text>
  <text x="728" y="480" font-size="13" fill="#334155">• SDK signature (HS256 JWT)</text>
  <text x="728" y="500" font-size="13" fill="#334155">• Webhook receiver (HMAC check)</text>
  <text x="728" y="520" font-size="13" fill="#334155">• RTMS start + @zoom/rtms client</text>
  <text x="728" y="540" font-size="13" fill="#334155">• Transcript storage</text>
  <text x="728" y="560" font-size="13" fill="#334155">• AI summary / draft scores</text>
  <rect x="470" y="660" width="240" height="92" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="488" y="688" font-size="15" font-weight="600" fill="#0f172a">PostgreSQL 17</text>
  <text x="488" y="710" font-size="13" fill="#334155">Rounds, join URLs, transcript</text>
  <text x="488" y="730" font-size="13" fill="#334155">lines, AI outputs (private network)</text>
  <rect x="730" y="660" width="240" height="92" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="748" y="688" font-size="15" font-weight="600" fill="#0f172a">Encrypted token store</text>
  <text x="748" y="710" font-size="13" fill="#334155">Zoom OAuth tokens, user ID,</text>
  <text x="748" y="730" font-size="13" fill="#334155">name — AES-256-GCM, file 0600</text>
  <rect x="470" y="776" width="500" height="80" rx="8" fill="#fff" stroke="#64748b" stroke-dasharray="5 4"/>
  <text x="488" y="804" font-size="15" font-weight="600" fill="#0f172a">Secrets (env files on the server, not in images or git)</text>
  <text x="488" y="826" font-size="13" fill="#334155">Zoom client secret, webhook secret token, OpenAI key, DB credentials</text>

  <!-- Zoom -->
  <rect x="1070" y="120" width="490" height="610" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1090" y="152" font-size="18" font-weight="700" fill="#1e3a8a">Zoom platform</text>
  <rect x="1092" y="172" width="446" height="70" rx="8" fill="#fff" stroke="#2563eb"/>
  <text x="1110" y="200" font-size="15" font-weight="600" fill="#0f172a">Zoom OAuth (zoom.us/oauth)</text>
  <text x="1110" y="222" font-size="13" fill="#334155">User authorizes HireOS; code exchanged for tokens</text>
  <rect x="1092" y="262" width="446" height="90" rx="8" fill="#fff" stroke="#2563eb"/>
  <text x="1110" y="290" font-size="15" font-weight="600" fill="#0f172a">Zoom REST API (api.zoom.us)</text>
  <text x="1110" y="312" font-size="13" fill="#334155">users/me, users/me/zak, users/me/meetings,</text>
  <text x="1110" y="332" font-size="13" fill="#334155">meetings/{id}, live_meetings/{id}/rtms_app/status</text>
  <rect x="1092" y="372" width="446" height="80" rx="8" fill="#fff" stroke="#2563eb"/>
  <text x="1110" y="400" font-size="15" font-weight="600" fill="#0f172a">Zoom Webhooks (event notifications)</text>
  <text x="1110" y="422" font-size="13" fill="#334155">meeting.started / ended, meeting.rtms_started / stopped</text>
  <rect x="1092" y="472" width="446" height="80" rx="8" fill="#fff" stroke="#2563eb"/>
  <text x="1110" y="500" font-size="15" font-weight="600" fill="#0f172a">RTMS media servers</text>
  <text x="1110" y="522" font-size="13" fill="#334155">Live transcript over TLS WebSocket (no audio stored)</text>
  <rect x="1092" y="572" width="446" height="134" rx="8" fill="#fff" stroke="#2563eb"/>
  <text x="1110" y="600" font-size="15" font-weight="600" fill="#0f172a">Zoom meeting cloud + SDK CDN</text>
  <text x="1110" y="622" font-size="13" fill="#334155">Meeting audio/video between interviewer and</text>
  <text x="1110" y="642" font-size="13" fill="#334155">candidate; Web SDK loaded from source.zoom.us.</text>
  <text x="1110" y="662" font-size="13" fill="#334155">Media does not pass through HireOS servers.</text>

  <!-- OpenAI -->
  <rect x="1070" y="776" width="490" height="80" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="1090" y="804" font-size="15" font-weight="600" fill="#0f172a">OpenAI API (api.openai.com) — third party</text>
  <text x="1090" y="826" font-size="13" fill="#334155">Receives transcript text + rubric; returns summary / draft scores</text>

  <!-- arrows -->
  <g fill="none" stroke-width="1.6">
    <!-- 1 browser -> host nginx -->
    <path d="M348 220 H468" stroke="#475569" marker-end="url(#a)"/>
    <!-- nginx -> gateway -> services -->
    <path d="M720 242 V270" stroke="#475569" marker-end="url(#a)"/>
    <path d="M580 334 V362" stroke="#475569" marker-end="url(#a)"/>
    <path d="M840 334 V362" stroke="#475569" marker-end="url(#a)"/>
    <!-- backend -> db / token store -->
    <path d="M790 614 L600 658" stroke="#475569" marker-end="url(#a)"/>
    <path d="M850 614 V658" stroke="#475569" marker-end="url(#a)"/>
    <!-- 2 browser <-> zoom oauth (redirect) -->
    <path d="M335 172 V100 H1315 V170" stroke="#2563eb" stroke-dasharray="6 4" marker-end="url(#az)"/>
    <!-- 3 backend -> zoom REST -->
    <path d="M970 400 L1090 307" stroke="#2563eb" marker-end="url(#az)"/>
    <!-- oauth callback/token exchange backend <-> oauth -->
    <path d="M970 380 L1090 222" stroke="#2563eb" marker-end="url(#az)"/>
    <!-- 5 webhooks -> host nginx -->
    <path d="M1092 412 H1030 V207 H972" stroke="#2563eb" marker-end="url(#az)"/>
    <!-- 6 backend <-> RTMS -->
    <path d="M970 520 H1090" stroke="#2563eb" marker-start="url(#az)" marker-end="url(#az)"/>
    <!-- 4 SDK <-> meeting cloud -->
    <path d="M348 380 H400 V940 H1055 V640 H1090" stroke="#2563eb" marker-start="url(#az)" marker-end="url(#az)"/>
    <!-- candidate -> meeting cloud -->
    <path d="M205 526 V960 H1585 V640 H1540" stroke="#2563eb" stroke-dasharray="6 4" marker-end="url(#az)"/>
    <!-- 7 backend -> openai -->
    <path d="M970 590 H1020 V816 H1068" stroke="#b45309" marker-end="url(#ao)"/>
  </g>
  <!-- step badges -->
  <g font-size="13" font-weight="700" fill="#fff">
    <circle cx="408" cy="220" r="12" fill="#0f172a"/><text x="404" y="225">1</text>
    <circle cx="760" cy="100" r="12" fill="#2563eb"/><text x="756" y="105">2</text>
    <circle cx="1030" cy="340" r="12" fill="#2563eb"/><text x="1026" y="345">3</text>
    <circle cx="760" cy="940" r="12" fill="#2563eb"/><text x="756" y="945">4</text>
    <circle cx="1030" cy="260" r="12" fill="#2563eb"/><text x="1026" y="265">5</text>
    <circle cx="1030" cy="520" r="12" fill="#2563eb"/><text x="1026" y="525">6</text>
    <circle cx="1020" cy="700" r="12" fill="#b45309"/><text x="1016" y="705">7</text>
    <circle cx="720" cy="636" r="12" fill="#0f172a"/><text x="716" y="641">8</text>
  </g>

  <!-- legend / flow -->
  <text x="40" y="1000" font-size="14" font-weight="700" fill="#0f172a">Flow</text>
  <text x="40" y="1022" font-size="13" fill="#334155">1 Interviewer uses HireOS over HTTPS.  2 Interviewer authorizes HireOS on Zoom OAuth; Zoom redirects back to https://hireos.aipollo.me/hireos/interview/api/integrations/zoom/callback</text>
  <text x="40" y="1042" font-size="13" fill="#334155">and the backend exchanges the code for tokens.  3 Backend calls the Zoom REST API to create the meeting, get the host ZAK and start RTMS.  4 The embedded Meeting SDK joins the meeting directly with Zoom.</text>
  <text x="40" y="1062" font-size="13" fill="#334155">5 Zoom webhooks reach https://hireos.aipollo.me/hireos/interview/api/meetings/webhooks/zoom (HMAC-verified).  6 Backend receives the live transcript over RTMS.  7 Transcript text and the rubric</text>
  <text x="40" y="1082" font-size="13" fill="#334155">are sent to the OpenAI API to draft a summary and scores for human review.  8 Transcripts and join URLs are stored in PostgreSQL; OAuth tokens are stored encrypted (AES-256-GCM).</text>
</svg>
</body></html>
