function slotsFor(r){
  const list = (r.slots||[]).slice();
  candTimesOf(r).forEach(c=>{ if(!list.includes(c)) list.unshift(c); });
  if(!list.length){
    let k = r.date? dayKey(r.date) : TODAY_KEY, hours=['03:00','06:00','07:30'], i=0;

  }
  return list.filter(x=>new Date(x)>=now).sort();
}

function rsvpTo(pid,rid,val){
  const r=getRound(pid,rid), p=PROJECTS[pid]; if(!r) return;
  let next=null;
  if(val==='accepted'){
    r.rsvp='accepted'; r.acceptedAt=now.toISOString(); delete r.declineReason;
    if(!r.date){
      if(r.arranger==='iv'){ toast(`Accepted — next: agree a time with ${candName(p)}. Share your availability or ask for theirs.`,true); next='arrange'; }
      else toast(`Accepted — ${personName(schedulerOf(p))} will confirm a time with ${candName(p)}.`,true);
    } else toast(`Accepted — ${roundShort(r)} for ${candName(p)} is confirmed and on your calendar (simulated).`,true);
  } else {
    const f=STATE.drawer&&STATE.drawer.f; r.rsvp='declined'; r.sinceAt=now.toISOString(); r.declineReason=((f&&f.reason)||'Schedule conflict')+((f&&f.note)?' — '+f.note:'');
    toast(`Declined — ${personName(schedulerOf(p))} has been notified to find a replacement.`,true);
  }
  STATE.drawer=null; render();
  if(next) openRound(pid,rid,next);
}
function openRound(pid,rid,mode){
  STATE.drawer={type:'round',pid,rid,mode:mode||'view',f:{slots:[],reason:'Schedule conflict',note:'',assignee:null,rec:null,scores:{},am:'share'}};

}

}

const DL_VERB = {rsvp:'Respond by', arrange:'Arrange by', pick:'Pick by', feedback:'Due', upcoming:'Starts', coord_upc:'Starts', confirm:'Confirm by', rubric:'Confirm by', plan:'Plan by', draft:'Draft by', schedule:'Schedule by', slot:'Reply by', takeover:'Decide by', reassign:'Reassign by', resched:'Reschedule by', offer_fail:'Fix by', rsvp_wait:'Chase by', cand_wait:'Expires', iv_wait:'Check in by', feedback_chase:'Chase', waiting:'Follow up by'};

function addH(iso,h){ return new Date(new Date(iso).getTime()+h*36e5).toISOString(); }
function minIso(a,b){ return new Date(a)<=new Date(b)? a : b; }
function dlText(kind,iso){
  if(kind==='upcoming'||kind==='coord_upc') return whenLabel(iso);
  const verb=DL_VERB[kind]||'Due', h=hoursUntil(iso);
  if(h<0){ const hrs=-h; return hrs<24? `Overdue ${Math.max(1,Math.round(hrs))}h` : `Overdue ${Math.ceil(hrs/24)}d`; }
  const dd=dayDiff(iso);
  if(dd===0) return `${verb} today ${hhmm(iso)}`;
  if(dd===1) return `${verb} tomorrow ${hhmm(iso)}`;
  return `${verb} ${fmtKey(dayKey(iso),{weekday:'short',month:'short',day:'numeric'})}`;
}
function applyDeadline(t){
  const iso=t.dl; t.due=iso; t.when=dlText(t.kind,iso);
  const ev=(t.kind==='upcoming'||t.kind==='coord_upc'), h=hoursUntil(iso);
  if(ev){ t.whenTone = dayDiff(iso)===0? 'accent':''; t.urg = dayDiff(iso)===0? 1 : 3; }
  else if(h<0){ t.whenTone='danger'; t.urg=0; t.overdue=true; }
  else if(h<24){ t.whenTone='warn'; t.urg=Math.min(t.urg,1); t.soon=true; }
  else if(h<48){ t.whenTone='warn'; }
}
function pageDeadlines(){
  const canEdit=hasRole('hr');
  const rows=TASK_CATALOG.map(g=>`<div class="card" style="overflow-x:auto"><div class="card-pad" style="padding:14px 18px 6px"><div class="eyebrow">${g.grp}</div></div><table class="table"><thead><tr><th>Task</th><th>Deadline rule</th><th style="width:170px">Default</th></tr></thead><tbody>${g.rows.map(r=>`<tr><td><div style="font-weight:600;font-size:13px">${r.name}</div></td><td class="small muted">${r.rule}</td><td>${r.sla? (canEdit?`<div class="row g6"><input class="input" type="number" min="1" max="240" value="${SLA[r.sla]}" style="width:78px;padding:5px 8px" onchange="SLA['${r.sla}']=Math.max(1,+this.value||1);render()"><span class="xsmall faint">hours</span></div>`:`<span class="small">${SLA[r.sla]} hours</span>`) : '<span class="xsmall faint">Fixed by the event</span>'}</td></tr>`).join('')}</tbody></table></div>`).join('');
  return `<div class="stack g20" style="max-width:980px">
    <div><button class="btn btn-ghost btn-sm" onclick="nav('#/settings')">${icon('arrowL')}Account &amp; System Configuration</button><h1 class="page-title" style="margin-top:8px">Task deadlines</h1>
      <p class="muted small" style="margin-top:4px;max-width:700px">Every task in My tasks has a deadline, counted from the moment it lands on the person. The list is sorted by deadline; overdue items turn red and due-within-24h items turn amber.</p></div>
    ${canEdit?'':`<div class="banner banner-info">${icon('lock')}<div><strong>View only.</strong> HR or an Admin can change the default hours.</div></div>`}
    ${rows}
  </div>`;
}
function buildTasks(){
  const me_=STATE.role, T=[];
  const mk=(kind,p,r,o)=>{ const t=Object.assign({id:kind+'|'+p.id+'|'+(r?r.id:''),kind,pid:p.id,rid:r?r.id:null,urg:3,whenTone:'',meta:''},o); applyDeadline(t); T.push(t); };
  const NOWISO=now.toISOString(), trig=(v)=>(v && v!==true)? v : addH(NOWISO,-6);
  const short=iso=>fmtDate(iso,{month:'short',day:'numeric'});
  allRounds().forEach(({p,r})=>{
    const st=roundState(r), cand=candName(p), rs=roundShort(r), mine=r.interviewer===me_, coMine=r.interviewer!==me_&&inPanel(r,me_), ivArr=r.arranger==='iv';
    const sub=`${rs} · ${cand} · ${r.durationMin} min`;
    const arrName=personName(arrangerOf(p,r));
    /* ---- my interviews (every role: interviewer is the base role) ---- */
    if(asIV() && mine){
      if(st==='pending') mk('rsvp',p,r,{title:`Respond to interview invite \u2014 ${p.role}`,sub,dl:minIso(addH(trig(r.invitedAt),SLA.rsvp),addH(r.date,-24)),urg:2,meta:`Interview ${whenLabel(r.date)} \u00b7 invited by ${personName(schedulerOf(p))}`});
      if(st==='invited') mk('rsvp',p,r,{title:`Accept interview \u2014 ${p.role}`,sub,dl:addH(trig(r.invitedAt),SLA.rsvp),urg:2,meta:ivArr?`${personName(schedulerOf(p))} asks you to agree the time with ${cand}`:`Invited by ${personName(schedulerOf(p))}`});
      if(st==='arrange'){
        const n=candTimesOf(r).length;
        if(n) mk('pick',p,r,{title:`${cand} sent times \u2014 pick one \u2014 ${p.role}`,sub,dl:addH(trig(r.candRepliedAt),SLA.pick),urg:1,meta:`${n} time${n>1?'s':''} offered \u00b7 pick one and it is confirmed for both of you`});
        else mk('arrange',p,r,{title:`Arrange a time with ${cand} \u2014 ${p.role}`,sub,dl:addH(trig(r.acceptedAt),SLA.arrange),urg:2,meta:'No time yet \u00b7 share your availability or ask for theirs'});
      }
      if(st==='awaiting' && ivArr){
        const m=r.sched.mode;
        mk('cand_wait',p,r,{title:`Waiting for ${cand} to ${m==='ask'?'share their times':'pick a time'}`,sub:`${rs} \u00b7 ${p.role}`,dl:shIso(r.sched.expires,'18:00'),meta:m==='ask'?`You asked for their availability ${short(r.sched.sentAt)}`:`${(r.slots||[]).length} times shared ${short(r.sched.sentAt)}`});
      }
      if(st==='unscheduled' && r.takeoverRequested) mk('waiting',p,r,{title:`Waiting for ${personName(schedulerOf(p))} to let you arrange \u2014 ${p.role}`,sub,dl:addH(trig(r.takeoverRequested),SLA.takeover),meta:'You asked to agree the time with the candidate yourself'});
      if(st==='completed' && !hasFeedback(p,r)){
        const due=feedbackDueIso(r), od=new Date(due)<now;
        mk('feedback',p,r,{title:`Submit feedback \u2014 ${p.role}`,sub,dl:due,urg:2,meta:`Interviewed ${fmtKey(dayKey(r.date),{month:'short',day:'numeric'})} · ${r.meetingLabel.replace(' (simulated)','')}`});
      }
      if((st==='confirmed'||st==='resched') && new Date(r.date)>=now && hoursUntil(r.date)<=14*24){
        const today=dayDiff(r.date)===0;
        mk('upcoming',p,r,{title:`${cand} \u2014 ${p.role}`,sub:`${rs} \u00b7 ${r.durationMin} min \u00b7 ${r.meetingLabel.replace(' (simulated)','')}`,dl:r.date,urg:3,meta:st==='resched'?'Reschedule requested':'You are interviewing'});
      }
    }
    if(asIV() && coMine && st==='confirmed' && new Date(r.date)>=now && hoursUntil(r.date)<=14*24){
      const c=coOf(r);
      mk('upcoming',p,r,{title:`${cand} \u2014 ${p.role}`,sub:`${rs} \u00b7 ${r.durationMin} min \u00b7 ${r.meetingLabel.replace(' (simulated)','')}`,dl:r.date,urg:3,meta:c.role==='observe'?`You are observing with ${personName(r.interviewer)}`:`You are co-interviewing with ${personName(r.interviewer)}`});
    }
    /* ---- coordinating (HR / Hiring Manager / Admin) ---- */
    if(canCoord(p)){
      if(st==='unscheduled'){
        if(r.takeoverRequested) mk('takeover',p,r,{title:`${personName(r.interviewer)} asks to arrange the time \u2014 ${p.role}`,sub:`${rs} \u00b7 ${cand}`,dl:addH(trig(r.takeoverRequested),SLA.takeover),urg:1,meta:'Approve to hand scheduling to the interviewer'});
        else if(candTimesOf(r).length) mk('slot',p,r,{title:`Candidate proposed a time \u2014 ${p.role}`,sub:`${rs} \u00b7 ${cand}`,dl:addH(trig(r.candRepliedAt),SLA.slot),urg:2,meta:`Proposed ${whenLabel(candTimesOf(r)[0])} \u00b7 interviewer: ${personName(r.interviewer)}`});
        else mk('schedule',p,r,{title:`Schedule ${rs} \u2014 ${p.role}`,sub:`${rs} \u00b7 ${cand}`,dl:addH(trig(r.sinceAt),SLA.schedule),urg:2,meta:`No time set \u00b7 interviewer: ${personName(r.interviewer)}`});
      }
      if(st==='awaiting' && !ivArr){
        const prop=r.sched.mode==='propose';
        mk('cand_wait',p,r,{title:`Waiting for ${cand} to ${prop?'choose':'pick'} a time`,sub:`${rs} \u00b7 ${p.role} \u00b7 ${personName(r.interviewer)}`,dl:shIso(r.sched.expires,'18:00'),meta:prop?`${(r.slots||[]).length} options sent ${short(r.sched.sentAt)}`:`Booking link sent ${short(r.sched.sentAt)}`});
      }
      if(!mine && ivArr && (st==='arrange' || st==='awaiting')){
        const n=candTimesOf(r).length, m=r.sched&&r.sched.mode;
        mk('iv_wait',p,r,{title:`${personName(r.interviewer)} is arranging a time with ${cand}`,sub:`${rs} \u00b7 ${p.role}`,dl:n?addH(trig(r.candRepliedAt),SLA.pick):addH(trig(r.acceptedAt),SLA.iv_wait),meta:(n?'Candidate sent times':st==='awaiting'?(m==='ask'?'Asked candidate for times':'Availability shared'):'Not started')+' \u00b7 handed over, no action needed'});
      }
      if(st==='declined') mk('reassign',p,r,{title:`Interviewer declined — ${p.role}`,sub,dl:addH(trig(r.sinceAt),SLA.reassign),urg:0,meta:`${r.date?'Was '+whenLabel(r.date)+' \u00b7 ':''}${personName(r.interviewer)}: \u201c${r.declineReason||'no reason given'}\u201d`});
      if(st==='resched') mk('resched',p,r,{title:`Reschedule requested — ${p.role}`,sub,dl:addH(trig(r.sinceAt),SLA.resched),urg:1,meta:`Was ${whenLabel(r.date)} \u00b7 requested by ${personName(r.interviewer)}`});
      if((st==='pending'||st==='invited') && !mine) mk('rsvp_wait',p,r,{title:`Waiting for ${personName(r.interviewer)} to accept`,sub:`${rs} \u00b7 ${cand} \u00b7 ${p.role}`,dl:addH(trig(r.invitedAt),SLA.rsvp_wait),meta:(r.date?whenLabel(r.date)+' \u00b7 ':'Time to be arranged \u00b7 ')+(ivArr?'invite sent \u2014 they will agree the time with the candidate':'invite sent')});
      if(st==='completed' && !hasFeedback(p,r) && !mine && new Date(feedbackDueIso(r))<now){
        const n=Math.max(1,Math.ceil((now-new Date(feedbackDueIso(r)))/864e5));
        mk('feedback_chase',p,r,{title:`Feedback overdue — ${personName(r.interviewer)}`,sub:`${rs} · ${cand} · ${p.role}`,dl:feedbackDueIso(r),urg:1,meta:'Blocks the debrief'});
      }
      if(st==='confirmed' && !mine && !coMine && new Date(r.date)>=now && hoursUntil(r.date)<=14*24){
        const today=dayDiff(r.date)===0;
        mk('coord_upc',p,r,{title:`${rs} — ${cand}`,sub:`${p.role} \u00b7 ${r.durationMin} min \u00b7 ${personName(r.interviewer)}`,dl:r.date,urg:3,meta:`${coOf(r)?'Panel':'Interviewer'}: ${panelNames(r)}`});
      }
    }
  });
  Object.values(PROJECTS).forEach(p=>{
    const d=p.decision;
    const hmSide = asHM() && (isAdmin() || p.hm===me_);
    if(d && d.stage==='awaiting_confirmation' && (asHR() || hmSide)){
      const pendHR=d.hr && d.hr.status==='pending', pendHM=d.hm && d.hm.status==='pending';
      const sides=[]; if(asHR() && pendHR) sides.push('HR'); if(hmSide && pendHM) sides.push('Hiring Manager');
      const n=ageDays(d.draftedAt);
      if(sides.length){
        const others=[]; if(pendHR && !sides.includes('HR')) others.push('HR'); if(pendHM && !sides.includes('Hiring Manager')) others.push('Hiring Manager');
        mk('confirm',p,null,{title:`Confirm interview conclusion — ${p.role}`,sub:`${candName(p)} · as ${sides.join(' + ')}${others.length?' · '+others.join(' & ')+' still pending':' · the other side is already in'}`,dl:addH(d.draftedAt,SLA.confirm),urg:2,meta:`Opened ${n===0?'today':n+'d ago'} \u00b7 dual confirmation required`});
      } else if((pendHR||pendHM) && (hmSide || (asHR() && (isAdmin() || schedulerOf(p)===me_)))){
        const who=pendHR&&pendHM?'HR and Hiring Manager':pendHR?'HR':'Hiring Manager';
        mk('waiting',p,null,{title:`Waiting for ${who} to confirm — ${p.role}`,sub:`${candName(p)} · your confirmation is recorded`,dl:addH(d.draftedAt,SLA.confirm),meta:'Package can\u2019t publish yet'});
      }
    }
    if(p.rubricConfirmed===false && p.requirementIds.length){
      const age=ageDays(p.createdAt);
      if(hmSide) mk('rubric',p,null,{title:`Review & confirm rubric — ${p.role}`,sub:`AI draft with ${p.requirementIds.length} competencies · ${p.dept}`,dl:addH(p.createdAt,SLA.rubric),urg:2,meta:`Opened ${age===0?'today':age+'d ago'} \u00b7 requested by ${personName(p.coord)}`});
      else if(asHR() && (isAdmin() || schedulerOf(p)===me_)) mk('waiting',p,null,{title:`Waiting for ${personName(p.hm)} to confirm the rubric — ${p.role}`,sub:`AI draft with ${p.requirementIds.length} competencies`,dl:addH(p.createdAt,SLA.rubric),meta:'Rounds can\u2019t be planned yet'});
    }
    if(asHR() && canCoord(p) && p.status==='draft' && p.requirementIds.length===0)
      mk('draft',p,null,{title:`Draft requirements & rubric — ${p.role}`,sub:`JD uploaded · ${p.dept}`,dl:addH(p.createdAt,SLA.draft),meta:`Created ${fmtDate(p.createdAt,{month:'short',day:'numeric'})} \u00b7 AI can draft from the JD`});
    if(asHR() && (isAdmin() || p.coord===me_) && p.package && p.package.offer && p.package.offer.status==='failed')
      mk('offer_fail',p,null,{title:`Offer sync failed — ${p.role}`,sub:`${candName(p)} · package v${p.package.version} published`,dl:addH(p.package.offer.lastAttempt,SLA.offer_fail),urg:1,meta:`Failed ${fmtDate(p.package.offer.lastAttempt,{month:'short',day:'numeric'})} \u00b7 downstream unavailable`});
    if(canCoord(p) && p.rubricConfirmed && !(p.rounds||[]).length && p.status!=='draft')
      mk('plan',p,null,{title:`Plan interviews — ${p.role}`,sub:`${candName(p)} · rubric confirmed ${p.rubricConfirmedAt?fmtDate(p.rubricConfirmedAt,{month:'short',day:'numeric'}):''}`,dl:addH(p.rubricConfirmedAt||p.createdAt,SLA.plan),urg:2,meta:'No rounds yet \u00b7 3 quick steps: rounds, how to schedule, send'});
  });
  T.sort((a,b)=> a.urg-b.urg || (a.due?new Date(a.due).getTime():9e15)-(b.due?new Date(b.due).getTime():9e15));
  return T;
}


function conflictsFor(personKey,startIso,durMin,exclude){
  const s=new Date(startIso).getTime(), e=s+durMin*60000, out=[];
  allRounds().forEach(({p,r})=>{
    if(!inPanel(r,personKey) || !r.date || r.status==='completed' || r.rsvp==='declined') return;
    if(exclude && p.id===exclude.pid && r.id===exclude.rid) return;
    const rs=new Date(r.date).getTime(), re=rs+r.durationMin*60000;
    if(s<re && rs<e) out.push({p,r});
  });
  return out;
}

function autoKeys(id){ const q=REQ_LIB[id]; if(!q) return []; return (q.name||'').toLowerCase().split(/[^a-z]+/).filter(w=>w.length>=5&&!['skills','management','engineering','knowledge','awareness'].includes(w)).map(w=>w.slice(0,Math.max(5,w.length-2))); }
function mapComment(r,text){
  const t=' '+(text||'').trim()+' ';
  if(t.trim()==='') return [];
  const sents=t.split(/(?<=[.!?;\n])|(?<=。)|，|但是|但|,\s+but\s+|\s+but\s+|\s+however\s+/i).map(x=>x.trim()).filter(Boolean);
  const out=[];
  r.targetReqIds.forEach(id=>{
    const keys=REQ_KEYS[baseOf(id)]||REQ_KEYS_CORE[id]||autoKeys(id);
    const hit=sents.filter(x=>{ const l=' '+x.toLowerCase()+' '; return keys.some(k=>l.includes(k)); });

function layoutDay(evs){
  evs.sort((a,b)=>a.s-b.s);
  const out=[]; let cluster=[], clusterEnd=0;
  const flush=()=>{
    if(!cluster.length) return;
    const lanes=[];
    cluster.forEach(e=>{ let i=lanes.findIndex(end=>end<=e.s); if(i<0){ i=lanes.length; lanes.push(0); } lanes[i]=e.e; e.lane=i; });
    cluster.forEach(e=>{ e.lanes=lanes.length; out.push(e); });
    cluster=[];
  };
  evs.forEach(e=>{ if(cluster.length && e.s>=clusterEnd){ flush(); clusterEnd=0; } cluster.push(e); clusterEnd=Math.max(clusterEnd,e.e); });
  flush();
  return out;
}

const VOICE_EXAMPLES=[
  {k:'forklift',label:'Warehouse forklift operators',text:'Need 2 forklift operators for our warehouse in Dongguan. Night shift, 8 pm to 6 am, six days a week. Must hold a forklift licence and have at least 2 years experience. Pay is 8,000 RMB per month plus overtime. Candidate: Li Wei, phone 138 0013 8000. He called this morning, worked at a logistics firm before and can start next week.'},
  {k:'rider',label:'Delivery riders',text:'Looking for 5 delivery riders in Chengdu. Day shift, own e-bike is a plus. Needs a valid ID and knows the city well. Pay 7,000 RMB per month. Candidate: Zhang Min, phone 139 2210 4477, called about the ad.'},
  {k:'server',label:'Restaurant servers',text:'We need 3 restaurant servers in Shanghai, evening shift, friendly and punctual. 1 year experience preferred. 6,500 RMB per month plus tips. Candidate: Chen Yu, phone 137 5566 1290.'},
];
function parseDescribe(text){
  const t=(text||'').trim(); const o={role:null,headcount:null,location:null,shift:null,pay:null,must:[],exp:null,cname:null,cphone:null};
  if(!t) return o;
  const roles=[['forklift operator','Forklift Operator'],['delivery rider','Delivery Rider'],['rider','Delivery Rider'],['restaurant server','Restaurant Server'],['server','Restaurant Server'],['driver','Delivery Driver'],['welder','Welder'],['electrician','Electrician'],['cleaner','Cleaner'],['cashier','Cashier'],['warehouse','Warehouse Associate'],['security guard','Security Guard'],['cook','Cook'],['technician','Technician']];
  for(const [k,v] of roles){ if(t.toLowerCase().includes(k)){ o.role=v; break; } }
  const hc=t.match(/\b(?:need|needs|looking for|hiring)\s+(\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b/i); if(hc) o.headcount=hc[1];
  const loc=t.match(/\bin\s+([A-Z][A-Za-z]+(?:\s[A-Z][A-Za-z]+)?)/); if(loc) o.location=loc[1];
  const sh=t.match(/\b(night|day|evening|morning|rotating)\s+shift\b/i); if(sh) o.shift=sh[1][0].toUpperCase()+sh[1].slice(1).toLowerCase()+' shift';
  const pay=t.match(/((?:¥|RMB\s?|\$|S\$)\s?\d[\d,.]*(?:\s?(?:\/|per|a)\s?(?:month|mo|hour|hr|day))?|\d[\d,.]*\s?(?:RMB|yuan)(?:\s?(?:\/|per|a)\s?(?:month|hour|day))?)/i); if(pay) o.pay=pay[1].replace(/\s+/g,' ').trim();
  const lic=t.match(/\b((?:forklift|driving|driver'?s?)\s+licen[cs]e|licen[cs]e|certificate|certified|valid ID|permit)\b/i); if(lic) o.must.push(lic[1][0].toUpperCase()+lic[1].slice(1));
  const ex=t.match(/(\d+)\+?\s*(?:years?|yrs?)(?:\s+of)?\s+experience/i); if(ex) o.exp=ex[1]+'+ years experience';
  const cn=t.match(/(?:[Cc]andidate|[Cc]aller|[Aa]pplicant)\s*[:\-]\s*([A-Z][a-z]+(?:\s[A-Z][a-z]+)?)/); if(cn) o.cname=cn[1];
  const ph=t.match(/(\+?\d[\d\s\-]{7,}\d)/); if(ph) o.cphone=ph[1].trim();
  return o;
}
function jdFromParse(o){
  const r=o.role||'New role';
  return `${r}${o.location?' — '+o.location:''}. ${o.headcount?'Hiring '+o.headcount+'. ':''}${o.shift?o.shift+'. ':''}${o.must.length?'Required: '+o.must.join(', ')+'. ':''}${o.exp?o.exp+'. ':''}${o.pay?'Pay: '+o.pay+'.':''}`.trim();
}
function crParseCard(){
  const c=CR(), o=parseDescribe(c.text);
  const row=(label,val)=>`<div class="row-between"><span class="small muted">${label}</span>${val?`<span class="small" style="font-weight:600;text-align:right">${esc(val)}</span>`:`<span class="pill pill-unknown">${icon('gap')}Not mentioned</span>`}</div>`;

function crLive(){

function crMic(){

    ? `<span class="mic-wave"><i></i><i></i><i></i><i></i><i></i></span><div><div style="font-weight:700;font-size:13px">Listening… 0:${String(c.vsecs).padStart(2,'0')}</div><div class="xsmall muted">Tap to stop</div></div>`
    : c.voice==='done'
    ? `${icon('checkCircle')}<div><div style="font-weight:700;font-size:13px">Transcribed</div><div class="xsmall muted">Tap to record again</div></div>`
    : `${icon('mic')}<div><div style="font-weight:700;font-size:13px">Tap and speak</div><div class="xsmall muted">Chinese, English and more — or just type below</div></div>`;

}
let CR_TIMER=null;
function crVoiceStop(done){ clearInterval(CR_TIMER); CR_TIMER=null; const c=CR(); c.voice=done?'done':'idle'; crLive(); }
function crVoice(script){
  const c=CR();
  if(c.voice==='rec'){ crVoiceStop(true); return; }
  const full=(typeof script==='string'?script:VOICE_EXAMPLES[0].text); const words=full.split(' ');
  c.voice='rec'; c.vsecs=0; c.text=''; let i=0, ticks=0;
  crLive();
  clearInterval(CR_TIMER);
  CR_TIMER=setInterval(()=>{
    ticks++; i=Math.min(words.length,i+2); c.text=words.slice(0,i).join(' '); if(ticks%8===0) c.vsecs++;
    if(i>=words.length){ crVoiceStop(true); return; }
    crLive();
  },160);
}
function crVoiceInstant(script){ clearInterval(CR_TIMER); CR_TIMER=null; const c=CR(); c.text=(typeof script==='string'?script:VOICE_EXAMPLES[0].text); c.voice='done'; }

/* ======================================================================
   INTERVIEW DETAIL PAGE — one clear stage + status, four tabs (sub-views inside)
   ====================================================================== */
const PROJ_STAGES=[
  {id:'rubric',label:'Rubric',sub:'rubric'},{id:'plan',label:'Plan',sub:'plan'},{id:'schedule',label:'Schedule',sub:'schedule'},
  {id:'interview',label:'Interviews',sub:'review'},{id:'debrief',label:'Debrief',sub:'debrief'},{id:'decision',label:'Decision',sub:'decision'},{id:'package',label:'Package',sub:'package'}];
function projStage(p){
  const rs=p.rounds||[], closed=p.status==='not_proceeding', pub=p.status==='published';
  const done={
    rubric:!!(p.rubricConfirmed&&p.requirementIds.length),
    plan:rs.length>0,
    schedule:rs.length>0 && rs.every(r=>!ST_OPEN.includes(roundState(r))),
    interview:rs.length>0 && rs.every(r=>r.status==='completed' && hasFeedback(p,r)),
    debrief:!!p.debrief,
    decision:!!(p.decision&&p.decision.stage==='confirmed'),
    package:false
  };
  if(pub) PROJ_STAGES.forEach(s=>{ done[s.id]=true; });
  const skipped={};
  if(closed){ ['rubric','plan','schedule','interview','debrief','decision'].forEach(k=>{ if(!done[k]) skipped[k]=true; }); done.decision=true; skipped.package=true; }
  let cur=PROJ_STAGES.findIndex(s=>!done[s.id] && !skipped[s.id]);
  if(cur<0) cur=PROJ_STAGES.length;
  const st=PROJ_STAGES[cur]||null;
  const label= closed? 'Not proceeding' : pub? 'Complete' : p.status==='on_hold'? 'On hold' : st.label;
  const tone= closed? 'danger' : pub? 'success' : p.status==='on_hold'? 'unknown' : 'accent';
  return {i:cur,st,done,skipped,label,tone,note:stageNote(p,st?st.id:null)};
}
function stageNote(p,key){
  const rs=p.rounds||[], cand=candName(p), hm=personName(p.hm), hr=personName(schedulerOf(p)||'sarah'), d=p.decision;
  if(p.status==='not_proceeding') return 'Not proceeding'+(d&&d.rejectReason?' — '+d.rejectReason:'');
  if(p.status==='published') return 'Hiring evaluation package published.';
  if(p.status==='on_hold') return 'On hold'+(d&&d.holdReason?': '+d.holdReason:'')+(d&&d.holdReviewDate?' Review by '+fmtDate(d.holdReviewDate)+'.':'');
  switch(key){
    case 'rubric': return p.requirementIds.length? `Waiting for ${hm} (Hiring Manager) to confirm the requirements & rubric.` : `${hr} drafts the requirements & rubric from the job description.`;
    case 'plan': return `${hr} plans the interview rounds.`;
    case 'schedule': { const r=rs.find(x=>ST_OPEN.includes(roundState(x))); if(!r) return ''; const s=roundState(r), iv=personName(r.interviewer), rn=roundShort(r);
      return ({unscheduled:`${rn} needs a time — ${personName(arrangerOf(p,r))} is coordinating.`,invited:`${rn}: waiting for ${iv} to accept.`,arrange:`${rn}: ${iv} is agreeing a time with ${cand}.`,
        awaiting:`${rn}: waiting for ${cand} to ${(r.sched&&r.sched.mode==='ask')?'share their times':'pick a time'}.`,declined:`${rn}: ${iv} declined — a new interviewer is needed.`,resched:`${rn}: reschedule requested by ${iv}.`})[s]||''; }
    case 'interview': { const fb=rs.find(r=>r.status==='completed'&&!hasFeedback(p,r)); if(fb) return `Waiting for ${personName(fb.interviewer)}’s feedback on ${roundShort(fb)}.`;
      const nx=rs.filter(r=>r.date&&r.status!=='completed').sort((a,b)=>new Date(a.date)-new Date(b.date))[0]; return nx? `Next: ${roundShort(nx)} · ${whenLabel(nx.date)} with ${panelNames(nx)}.` : 'All scheduled rounds are done.'; }
    case 'debrief': return 'All feedback is in — the debrief is being prepared from the scorecards.';
    case 'decision': { if(d&&d.stage==='awaiting_confirmation'){ const w=[]; if(d.hr&&d.hr.status==='pending') w.push('HR'); if(d.hm&&d.hm.status==='pending') w.push('the Hiring Manager'); return w.length? `Waiting for ${w.join(' and ')} to confirm the conclusion.` : 'Both confirmed.'; } return 'Conclusion ready — HR and the Hiring Manager each confirm it.'; }
    case 'package': return 'Evaluation package is ready to publish.';
  }
  return '';
}
function projLock(p,t){
  const gateRubric=p.requirementIds.length===0, gateRounds=(p.rounds||[]).length===0;
  if(t!=='overview' && t!=='rubric' && gateRubric) return 'Confirm Requirements & Rubric first';
  if(['live','review','debrief','decision','package'].includes(t) && gateRounds && !gateRubric) return 'Plan and schedule a round first';
  if(t==='debrief' && !p.debrief) return 'No submitted scorecards yet';
  if(t==='decision' && !p.debrief) return 'Complete the debrief first';
  if(t==='package' && (!p.decision || p.decision.stage==='not_started')) return 'No decision recorded yet';
  return '';
}
function stageMini(p){
  const s=projStage(p);
  return `<div class="stgm" title="Stage ${Math.min(s.i+1,7)} of 7">${PROJ_STAGES.map((x,i)=>`<i class="${s.done[x.id]?'d':s.skipped[x.id]?'s':i===s.i?'c':''}"></i>`).join('')}</div>`;
}
function stageCell(p){
  const s=projStage(p);
  return `<div style="min-width:190px">${stageMini(p)}<div class="row g6" style="margin-top:5px"><span class="pill pill-${s.tone==='success'?'success':s.tone==='danger'?'danger':s.tone==='unknown'?'unknown':'accent'}" style="flex:none">${esc(s.label)}</span></div><div class="xsmall faint" style="margin-top:3px;line-height:1.35;max-width:260px">${esc(s.note)}</div></div>`;
}
function stageTracker(p){
  const s=projStage(p), n=PROJ_STAGES.length;
  const steps=PROJ_STAGES.map((x,i)=>{
    const d=s.done[x.id], c=i===s.i, sk=s.skipped[x.id], lock=projLock(p,x.sub);
    const cls=sk?'x':d?'d':c?'c':'';
    return `<button class="stg-step ${cls}" ${lock?`disabled title="${lock}"`:`onclick="nav('#/project/${p.id}/${x.sub}')" title="Open ${x.label}"`}><i>${sk?icon('x'):d?icon('check'):i+1}</i><span>${x.label}</span></button>`;
  }).join('');
  const head= s.i>=n? '' : `Stage ${s.i+1} of ${n} · `;
  return `<div class="card stg-card"><div class="stg">${steps}</div>
    <div class="stg-note"><span class="pill pill-${s.tone==='success'?'success':s.tone==='danger'?'danger':s.tone==='unknown'?'unknown':'accent'}" style="flex:none">${esc(head)}${esc(s.label)}</span><span class="small" style="line-height:1.45">${esc(s.note)}</span></div></div>`;
}
const PROJ_GROUPS=[
  {id:'overview',label:'Overview',subs:[['overview','Overview']]},
  {id:'interviews',label:'Interviews',subs:[['schedule','Schedule'],['plan','Plan & questions'],['brief','Brief'],['live','Live room']]},
  {id:'eval',label:'Evaluation',subs:[['rubric','Rubric'],['review','Scorecards'],['debrief','Debrief']]},

const PROJ_IV_HIDDEN=['rubric','plan','debrief','decision','package','wizard'];
function projGroupEntry(p,g){
  const subs=g.subs.map(x=>x[0]).filter(id=>!(isInterviewer()&&PROJ_IV_HIDDEN.includes(id)));
  let pref=subs;

  if(g.id==='eval') pref=(p.rounds||[]).some(r=>r.status==='completed')? ['review','debrief','rubric'] : ['rubric','review','debrief'];
  return pref.filter(id=>subs.includes(id)).find(id=>!projLock(p,id));
}

function pageProject(pid, sub, arg){

  const done=(p.rounds||[]).filter(r=>r.status==='completed').length, tot=(p.rounds||[]).length;

  let body='';

  else if(sub==='debrief') body = projDebrief(p);
  else if(sub==='decision') body = projDecision(p);
  else if(sub==='package') body = projPackage(p);
  else body = projOverview(p);

  const linked=p.candidate.linked;
  const header = `
    <div style="margin-bottom:14px">
      <button class="btn btn-ghost btn-sm" onclick="nav('#/interviews')">${icon('arrowL')}All interviews</button>
      ${isInterviewer()?`<div class="banner banner-info" style="margin-top:8px;max-width:760px">${icon('lock')}<div><strong>Interviewer view.</strong> You can see this candidate’s brief and the rounds assigned to you. Rubric editing, other evaluators’ scorecards, the debrief and the decision stay hidden so your assessment remains independent.</div></div>`:''}
      <div class="row g12 wrap" style="margin-top:8px;align-items:center">
        <h1 class="page-title">${esc(linked? p.candidate.name : p.role)}</h1>

      <div class="small muted" style="margin-top:4px">${linked? `<strong style="color:var(--text)">${esc(p.role)}</strong> · `:''}${esc(p.dept)} · ${esc(p.location)} · ${esc(p.level)}${linked&&p.candidate.headline? ` · ${esc(p.candidate.headline)}`:''}</div>
    </div>
    ${isInterviewer()? '' : stageTracker(p)}
    <div class="tabbar" style="margin-top:16px">${tabsHtml}</div>
    ${subnav}
  `;

  if(sub==='live') return {html: projLiveFull(p, arg || (p.rounds[0]&&p.rounds[0].id)), opts:{full:true}};

/* ---- REQUIREMENTS & RUBRIC ---- */
function rw(p,id){ const t=p.requirementIds.reduce((a,x)=>a+REQ_LIB[x].weight,0)||1; return REQ_LIB[id].weight/t; }
function confirmRubric(pid){
  const p=PROJECTS[pid]; p.rubricConfirmed=true; p.rubricConfirmedBy=PEOPLE[STATE.role].name; p.rubricConfirmedAt=now.toISOString();

function genDraft(pid){

/* ---------- round kinds + core scoring ---------- */
function rKind(r){ return (r&&r.kind)||'business'; }
const KIND_LBL={hr:'HR round · culture',business:'Business round',other:'Other round'};
function kindPill(r){ const k=rKind(r); return `<span class="pill ${k==='hr'?'pill-accent':'pill-neutral'}">${KIND_LBL[k]}</span>`; }
function coreBand(t){ return CORE_DOC.bands.find(b=>t>=b[0]); }
/* Sending Labs v1.1: total only when SL-C01–C08 are all assessed. Not assessed is never zero and never re-scaled. */
function coreScore(evals){
  let tot=0, n=0, maxA=0; const missing=[];
  CORE_IDS.forEach(id=>{ const e=(evals||[]).find(x=>x.reqId===id), w=REQ_LIB[id].weight*100;
    if(e && typeof e.score==='number'){ tot+=e.score/5*w; n++; maxA+=w; } else missing.push(id); });
  const complete=missing.length===0;
  return {complete,total:tot,assessed:n,maxAssessed:maxA,missing,band:complete?coreBand(tot):null};
}
function coreLine(cs){
  return cs.complete
    ? `<strong>${cs.total.toFixed(0)} / 100</strong> · <span class="pill ${cs.band[2]}">${cs.band[1]}</span> <span class="faint">${cs.band[3]}</span>`
    : `<strong>Incomplete</strong> · ${cs.assessed} of 8 assessed, ${cs.total.toFixed(0)} of ${cs.maxAssessed} points so far. <span class="faint">Not assessed is never counted as zero and the total is not re-scaled.</span>`;
}
/* ---------- culture flags across rounds (layer A–D, risk review) ---------- */
function cultureInfo(p){
  const out={hr:null,ai:null,biz:[],flags:[],concerns:[],hrPlanned:(p.rounds||[]).some(r=>rKind(r)==='hr'),any:false};
  (p.rounds||[]).forEach(r=>{
    const sc=p.scorecards&&p.scorecards[r.id]; if(!sc||!sc.human) return; const h=sc.human, k=rKind(r);
    if(k==='hr'){ out.any=true; out.hr={round:r,who:h.evaluator,cs:coreScore(h.evals)}; const e9=h.evals.find(x=>x.reqId==='slc09'); out.ai=e9&&typeof e9.score==='number'?e9.score:null; }
    if(h.biz){ out.any=true; out.biz.push({round:r,who:h.evaluator,biz:h.biz,comment:h.comment}); const cc=CORE_BIZ.filter(b=>h.biz[b.id]==='concern'); if(cc.length) out.concerns.push({round:r,who:h.evaluator,items:cc,comment:h.comment}); }
    if(h.redFlag) out.flags.push({round:r,who:h.evaluator,note:h.redFlag.note});
  });
  const hrBad=out.hr&&out.hr.cs.complete&&out.hr.cs.total>=75, hrLow=out.hr&&out.hr.cs.complete&&out.hr.cs.total<65;
  out.diverge=(hrBad&&out.concerns.length>0)||(hrLow&&out.biz.length>0&&out.biz.every(b=>!CORE_BIZ.some(x=>b.biz[x.id]==='concern')&&CORE_BIZ.some(x=>b.biz[x.id]==='strong')));
  out.review=out.flags.length>0||out.concerns.length>0||out.diverge;
  return out;
}
function cultureSummary(p){
  const c=cultureInfo(p); if(!c.any) return '';
  const bits=[];
  if(c.hr) bits.push(c.hr.cs.complete?`HR culture assessment ${c.hr.cs.total.toFixed(0)}/100 (${c.hr.cs.band[1].toLowerCase()})`:`HR culture assessment incomplete (${c.hr.cs.assessed} of 8 assessed)`);
  if(c.ai!==null) bits.push(`AI mindset ${c.ai}/5`);
  if(c.biz.length){ const n=c.biz.length; bits.push(`${n} business-round culture review${n>1?'s':''}${c.concerns.length?` with ${c.concerns.length} concern${c.concerns.length>1?'s':''}`:' with no concerns'}`); }
  if(c.flags.length) bits.push('a critical red flag was recorded');
  return ' Culture: '+bits.join('; ')+'.'+(c.review?' Needs a risk review before confirming.':'');
}
/* four assessment layers shown side by side — never averaged together */
function layersCard(p){

    : chip('A · HR culture & behaviour',`<div class="small muted">${c.hrPlanned?'HR round planned — not assessed yet.':'No HR culture round planned. Not assessed.'}</div>`);

  return `<div class="card card-pad stack g12"><div class="row-between wrap g8"><div class="eyebrow">Assessment layers · Sending Labs Core ${CORE_DOC.version}</div><a class="sublink" onclick="libOpenCore()">View standard</a></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px" class="cols-2">${A}${B}${C}${D}</div>
    ${risks.length?`<div class="banner banner-warning">${icon('alert')}<div><strong>Risk review suggested before confirming.</strong> This does not reject the candidate or block the decision.<ul style="margin:6px 0 0 18px;padding:0">${risks.map(x=>`<li style="margin:2px 0">${x}</li>`).join('')}</ul></div></div>`:''}
    <div class="xsmall faint" style="line-height:1.5">Layers stay separate: business-round reviews are not converted to the nine HR scores, and none of the layers is averaged with another.</div></div>`;

/* ---------- project rubric: source, edit, templates, import ---------- */
function hasScores(p){ return Object.keys(p.scorecards||{}).length>0; }
function tplById(id){ return TEMPLATES.find(t=>t.id===id); }
function baseOf(id){ const q=REQ_LIB[id]; return q&&q.baseId&&REQ_LIB[q.baseId]? q.baseId : id; }
function ownAll(p){
  const map={};
  p.requirementIds=p.requirementIds.map(id=>{ const b=REQ_LIB[id]; if(b.owner===p.id) return id;
    const bid=b.baseId||id, nid=bid+'@'+p.id; REQ_LIB[nid]=Object.assign({},b,{id:nid,baseId:b.baseId||id,owner:p.id}); map[id]=nid; return nid; });
  (p.rounds||[]).forEach(r=>{ r.targetReqIds=r.targetReqIds.map(i=>map[i]||i); (r.questions||[]).forEach(q=>{ q.reqIds=(q.reqIds||[]).map(i=>map[i]||i); }); });
}
function rbSourcePill(p){
  const s=p.rubricSource;
  if(!s) return p.rubricConfirmed? '' : `<span class="pill pill-neutral">${icon('sparkle')}AI draft from the JD</span>`;
  const l={library:'From library',import:'Imported',manual:'Written manually'}[s.type]||'Custom';
  return `<span class="pill pill-neutral">${icon(s.type==='library'?'folder':s.type==='import'?'upload':'edit')}${l}${s.name?': '+esc(s.name):''}</span>`;
}
function rbToggleEdit(pid){
  const p=PROJECTS[pid];
  if(STATE.rbEdit===pid){ STATE.rbEdit=null; render(); return; }
  if(hasScores(p)){ toast('Scores are already recorded for this project, so the rubric is locked.',false); return; }
  if(p.rubricConfirmed){ p.rubricConfirmed=false; p.rubricVersion=(p.rubricVersion||1)+1; toast(`Editing creates rubric version ${p.rubricVersion}. Confirm it again when you are done.`,true); }
  ownAll(p); STATE.rbEdit=pid; render();
}
function rbStartBlank(pid){ const p=PROJECTS[pid]; p.rubricConfirmed=false; p.rubricSource={type:'manual',name:''}; STATE.rbEdit=pid; render(); }
function rbSet(pid,id,field,val){
  const q=REQ_LIB[id]; if(!q||q.owner!==pid) return;
  if(field==='weight'){ q.weight=Math.max(0,+val||0)/100; rbTotal(pid); return; }
  if(field==='mustHave'){ q.mustHave=val==='1'; render(); return; }
  if(field==='requiredLevel'){ q.requiredLevel=+val; return; }
  q[field]=val;
}
function rbTotal(pid){ const p=PROJECTS[pid], el=document.getElementById('rb-total'); if(el) el.textContent=Math.round(p.requirementIds.reduce((a,x)=>a+REQ_LIB[x].weight,0)*100); }
function rbAdd(pid,v){
  if(!v) return; const p=PROJECTS[pid]; ownAll(p); let id;
  if(v==='custom'){ id='cx'+(Date.now()%100000)+'@'+pid; REQ_LIB[id]={id,name:'New competency',mustHave:false,weight:.15,requiredLevel:3,def:'Describe what good looks like for this role.',anchors:GEN_ANCHORS,owner:pid,custom:true}; }
  else { id=v+'@'+pid; if(p.requirementIds.includes(id)){ toast('Already in the rubric.',false); return; } REQ_LIB[id]=Object.assign({},REQ_LIB[v],{id,baseId:v,owner:pid}); }
  p.requirementIds.push(id); render();
}
function rbRemove(pid,id){
  const p=PROJECTS[pid]; p.requirementIds=p.requirementIds.filter(x=>x!==id);
  (p.rounds||[]).forEach(r=>{ r.targetReqIds=r.targetReqIds.filter(x=>x!==id); });
  render();
}
function applyTemplate(pid,tid){
  const p=PROJECTS[pid], t=tplById(tid); if(!p||!t) return;
  if(hasScores(p)){ toast('Scores are already recorded, so the rubric is locked.',false); return; }
  if((p.rounds||[]).length){ toast('Rounds are already planned. Apply a template before planning rounds.',false); return; }

function rbParse(text){
  const clean=s=>String(s||'').replace(/\*\*|__|`/g,'').replace(/<br\s*\/?>/gi,' ').trim();
  const out=[], seen=new Set();
  const push=(name,def,w,code)=>{ name=clean(name).replace(/^[-–—:：·\s]+|[-–—:：\s]+$/g,''); if(name.length<3||name.length>90) return;
    const key=code||name.toLowerCase(); const ex=out.find(o=>o.key===key);
    if(ex){ if(!ex.w&&w) ex.w=w; if(!ex.def&&def) ex.def=def; return; }
    out.push({key,code:code||'',name,def:clean(def),w:w||0,on:true,must:false}); };
  const lines=String(text||'').split(/\r?\n/);
  lines.forEach(raw=>{
    const line=raw.trim(); if(!line||!line.startsWith('|')) return;
    const cells=line.replace(/^\||\|$/g,'').split('|').map(clean);
    if(cells.every(c=>/^:?-{2,}:?$/.test(c)||c==='')) return;
    if(cells.some(c=>/^total$/i.test(c))) return;
    let code='',name='',idx=0;
    const m=cells[0].match(/^([A-Z]{1,5}-?[A-Z]*\d+[A-Za-z]?)\s*(?:[—–-]\s*(.+))?$/);
    if(m){ code=m[1]; if(m[2]){ name=m[2]; idx=1; } else { name=cells[1]||''; idx=2; } }
    else { if(/^[\d\s–\-.%]+$/.test(cells[0])||!cells[0]) return; name=cells[0]; idx=1; }
    if(!name) return;
    const rest=cells.slice(idx), wCell=rest.find(c=>/^\d{1,3}(\.\d+)?%?$/.test(c));
    const def=rest.find(c=>c!==wCell&&c.length>5&&!/^SL-|^[A-Z]{1,5}-?\d/.test(c))||'';
    push(name,def,wCell?parseFloat(wCell):0,code);
  });
  /* a structured document usually has IDs: keep only the dominant ID family and untick the others */
  const coded=out.filter(o=>o.code);
  if(coded.length>=3){
    const fam=o=>o.code.replace(/\d.*$/,''); const cnt={}; coded.forEach(o=>cnt[fam(o)]=(cnt[fam(o)]||0)+1);
    const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
    const kept=coded.map(o=>{ if(fam(o)!==top){ o.on=false; o.note='different ID family — probably another section'; } return o; });
    return kept;
  }
  if(out.length) return out;
  /* bullets / numbered / plain lines (a plain line is only a competency when nothing has a definition) */
  const plain=[];
  lines.forEach(raw=>{
    let line=raw.trim(); if(!line||/^#|^[-=*_]{3,}$/.test(line)) return;
    line=line.replace(/^(?:[-*•]|\d+[.)])\s+/,'');
    const m=line.match(/^(.{3,70}?)\s*(?:[:：]|\s[—–-]\s)\s*(.+)$/);
    if(m) push(m[1],m[2],0,''); else if(line.length<=70) plain.push(line);
  });
  if(!out.length) plain.forEach(l=>push(l,'',0,''));
  return out;
}

    ${sec('Rating scale & scoring','1–5 behavioural scale',tbl(['Rating','Level','Behavioural evidence'],[5,4,3,2,1].map(n=>[n,CORE_ANCHORS[n].split(' — ')[0],CORE_ANCHORS[n].split(' — ')[1]]))+`<div class="small" style="line-height:1.6">Competency score = (rating ÷ 5) × weight. Example: SL-C01 (20) rated 4 → 16. Every rating needs specific behavioural evidence. Without enough evidence use <strong>Not assessed</strong>; never default to 3. English ability is a role language requirement, scored separately.</div>`)}
    ${sec('Standard HR interview questions','pick by candidate, cover every dimension',tbl(['ID','Question','What to look for'],CORE_C.map(c=>[c[1],esc(c[6]),c[7]]))+`<div class="small muted" style="line-height:1.6">Probe with STAR and check four things: what did <em>you</em> do, how much guidance did you need, what was the measurable result, what would you do differently. Do not give a high score for “Yes, I am flexible” or “I learn fast”.</div>`)}
    ${sec('AI-native mindset (SL-C09)','mandatory in the HR round · 1–5 on its own',tbl(['Rating','Expected capability'],[5,4,3,2,1].map(n=>[n,AI_ANCHORS[n]]))+`<div class="small" style="line-height:1.6"><strong>Standard question:</strong> ${esc(REQ_LIB.slc09.question)}<br><strong>Scenario:</strong> ${esc(REQ_LIB.slc09.scenario)}<br><span class="muted">No AI tool experience? Use the scenario to judge willingness to learn and workflow thinking; do not reject only for lack of tool experience.</span></div>`)}
    ${sec('Business round · three-item review','one level each · no totals',tbl(['ID','Item','Background mapping','What to watch for'],CORE_BIZ.map(b=>[b.code,b.name,b.maps,b.look]))+tbl(['Level','When to use'],[['Strong','Clear behaviour in this assessment showing strong initiative, judgment or execution'],['Meets','Meets the basic expectation for the role; no concern observed'],['Concern','A specific behaviour or judgment problem was observed; state the evidence'],['Not observed','Not enough evidence in this assessment. Not a low score, not a negative']])+`<div class="small muted" style="line-height:1.6">Only record what was seen in this session. A full plan does not prove future follow-through; HR verifies that through past-behaviour questions. If AI was not part of the case, do not lower SL-B03.</div>`)}

/* ---- SCHEDULE ---- */
function projSchedule(p){
  if(!p.rubricConfirmed) return `<div class="empty">Plan interview rounds before scheduling.</div>`;
  const rounds = p.rounds.filter(r=>!(isInterviewer() && !inPanel(r,STATE.role)));
  const actionBtn = r=>{
    const st=roundState(r), id=`'${p.id}','${r.id}'`;
    if(mayCoord(p)){
      if(st==='awaiting') return `<button class="btn btn-secondary btn-sm" onclick="openRound(${id})">Manage</button>`;
      if(st==='unscheduled') return `<button class="btn btn-primary btn-sm" onclick="openRound(${id},'schedule')">Schedule\u2026</button>`;
      if(st==='resched') return `<button class="btn btn-primary btn-sm" onclick="openRound(${id},'schedule')">Propose new time</button>`;
      if(st==='declined') return `<button class="btn btn-primary btn-sm" onclick="openRound(${id},'reassign')">Reassign\u2026</button>`;
      if(st==='completed') return `<button class="btn btn-ghost btn-sm" onclick="openRound(${id})">Details</button>`;
      return `<button class="btn btn-secondary btn-sm" onclick="openRound(${id},'schedule')">Reschedule\u2026</button>`;
    }
    if(r.interviewer===STATE.role && st==='pending') return `<button class="btn btn-primary btn-sm" onclick="openRound(${id})">Respond</button>`;
    return `<button class="btn btn-ghost btn-sm" onclick="openRound(${id})">Details</button>`;
  };
  const needs = p.rounds.filter(r=>['unscheduled','declined','resched'].includes(roundState(r))).length;
  const waiting = p.rounds.filter(r=>['pending','awaiting'].includes(roundState(r))).length;
  return `<div class="stack g14">
    <div class="banner banner-info">${icon('globe')}<div>All times shown in UTC+8 (Asia/Shanghai). Participants may be in different time zones \u2014 invitations show each participant\u2019s local time.${(needs||waiting)?` <strong>${needs?needs+' round'+(needs>1?'s need':' needs')+' scheduling or a fix':''}${needs&&waiting?' \u00b7 ':''}${waiting?waiting+' awaiting a reply (interviewer or candidate)':''}.</strong>`:''}</div></div>
    <div class="card">
      <table class="table">
        <thead><tr><th>Round</th><th>Date &amp; time</th><th>Interviewer</th><th>Meeting</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${rounds.map(r=>`<tr>
            <td><div style="font-weight:600;font-size:13px">${r.name}</div><div class="xsmall faint">${r.durationMin} min</div></td>
            <td class="small mono">${r.date? fmtDateTime(r.date) : (r.candidateProposed? '<span class="faint">Candidate proposed</span><div class="xsmall">'+whenLabel(r.candidateProposed)+'</div>' : (roundState(r)==='awaiting'? '<span class="faint">Candidate to '+(r.sched.mode==='propose'?'choose':'book')+'</span>' : '\u2014'))}</td>
            <td><div class="row g8">${avatar(r.interviewer,22)}<span class="small">${PEOPLE[r.interviewer].name}</span>${coOf(r)?`<span class="xsmall faint" title="${esc(coRoleLabel(r.co))}: ${esc(personName(r.co.who))}">+ ${esc(personName(r.co.who).split(' ')[0])}</span>`:''}</div></td>
            <td><span class="pill pill-accent">${icon('video')}${r.meetingLabel}</span></td>
            <td>${roundStatePill(r)}${roundState(r)==='declined'&&r.declineReason?`<div class="xsmall faint" style="margin-top:3px">\u201c${esc(r.declineReason)}\u201d</div>`:''}</td>
            <td style="text-align:right">${actionBtn(r)}</td>
          </tr>`).join('') || `<tr><td colspan="6"><div class="empty" style="border:none">No rounds assigned to you on this project.</div></td></tr>`}
        </tbody>
      </table>
    </div>
    ${mayCoord(p)?`<button class="btn ${p.rounds.length?'btn-secondary':'btn-primary'}" style="align-self:flex-start" onclick="openWizard('${p.id}')">${icon('plus')}${p.rounds.length?'Add more rounds':'Set up interviews'}</button>`:''}
    ${mockBanner('Calendar and meeting-link generation shown here (Google Meet primary, Zoom supported as an alternative) are demonstration states \u2014 no real invitations are sent.')}
  </div>`;
}
function statusChipRound(s){
  const map={completed:'pill-success',scheduled:'pill-accent',planned:'pill-neutral',interrupted:'pill-warning',no_show:'pill-danger',cancelled:'pill-neutral'};
  return `<span class="pill ${map[s]||'pill-neutral'}">${s.replace('_',' ')}</span>`;
}

/* ---- BRIEF ---- */
function projBrief(p){
  if(!p.rounds.length) return `<div class="empty">No rounds planned yet.</div>`;
  const known = Object.values(p.evidence).filter(e=>e.strength==='strong');
  const contradicting = Object.values(p.evidence).filter(e=>e.strength==='weak' && e.type!=='self_reported');
  const unresolved = p.requirementIds.filter(id=>{
    const allScores = Object.values(p.scorecards).flatMap(sc=>sc.human.evals).filter(e=>e.reqId===id);
    return allScores.length===0;
  });
  return `<div class="stack g18">
    <div class="card card-pad stack g10">
      <div class="eyebrow">Background summary</div>
      <p class="small" style="line-height:1.6">${p.candidate.name} — ${p.candidate.headline}. ${p.candidate.source}. This brief reflects evidence available as of ${fmtDate(p.rounds[0].date)}; every claim below links back to its original source.</p>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="cols-2">
      <div class="card card-pad stack g10">
        <div class="row g8"><span class="pill pill-success">${icon('checkCircle')}Known / supported</span></div>
        ${known.map(e=>`<div class="small" style="cursor:pointer;line-height:1.5" onclick="openDrawer({type:'evidence',projectId:'${p.id}',evidenceId:'${e.id}'})">• ${e.statement} <span class="xsmall faint">(${e.source})</span></div>`).join('') || '<div class="faint small">None yet.</div>'}
      </div>
      <div class="card card-pad stack g10">
        <div class="row g8"><span class="pill pill-unknown">${icon('gap')}Unknown / needs verification</span></div>
        ${unresolved.length? unresolved.map(id=>`<div class="small">• ${REQ_LIB[id].name} — no evidence collected yet.</div>`).join('') : '<div class="faint small">No open gaps at last update.</div>'}
      </div>
    </div>
    <div class="card card-pad stack g10">
      <div class="row g8"><span class="pill pill-warning">${icon('alert')}Claims to verify / weak evidence</span></div>
      ${contradicting.length? contradicting.map(e=>`<div class="small" style="cursor:pointer;line-height:1.5" onclick="openDrawer({type:'evidence',projectId:'${p.id}',evidenceId:'${e.id}'})">• ${e.statement} <span class="xsmall faint">(${e.source})</span></div>`).join('') : '<div class="faint small">None flagged.</div>'}
    </div>
    <div class="card card-pad stack g10">
      <div class="eyebrow">Recommended focus by round</div>
      ${p.rounds.map(r=>`<div class="row-between"><span class="small"><strong>${r.name}</strong> — ${r.targetReqIds.map(id=>REQ_LIB[id].name).join(', ')}</span><a class="xsmall" style="color:var(--accent);font-weight:600;cursor:pointer" onclick="nav('#/project/${p.id}/plan')">View plan →</a></div>`).join('')}
    </div>
  </div>`;
}

        <div class="card card-pad stack g10">
          <div class="row-between"><div class="eyebrow">Current question</div><span class="xsmall faint">Targets: ${r.targetReqIds.map(id=>REQ_LIB[id].name).join(', ')}</span></div>
          <div style="font-weight:600;font-size:14.5px;line-height:1.5">${r.questions[0].text}</div>

            <button class="btn btn-secondary btn-sm">${icon('chevR')}Next question</button>
            <button class="btn btn-ghost btn-sm">Skip</button>
            <button class="btn btn-ghost btn-sm">${icon('plus')}Add follow-up</button>
          </div>
        </div>
      </div>
      <div class="card stack" style="min-height:0;overflow:hidden">
        ${liveSidePanel(p, r)}
      </div>
    </div>
    <div class="row-between">
      <span class="xsmall faint">${icon('checkCircle')} Autosaved · ${r.captureMode==='manual'?'Manual notes only — no recording for this session':'Recording &amp; transcript active (simulated)'}</span>
      <button class="btn btn-primary" onclick="toast('Session marked complete.',true);nav('#/project/${p.id}/review/${r.id}')">${icon('check')}Complete session &amp; go to Review</button>
    </div>
  </div>`;
}
function liveTab(t){ STATE.liveTab=t; render(); }
function liveSidePanel(p, r){
  const tab = STATE.liveTab || 'notes';
  const transcript = TRANSCRIPTS[r.id+'_'+p.id];
  const tabBtn=(id,label)=>`<button class="tabbtn ${tab===id?'active':''}" onclick="liveTab('${id}')">${label}</button>`;
  let body='';
  if(tab==='notes'){
    body = `${r.captureMode==='manual' ? `<div class="banner banner-warning" style="margin-bottom:2px">${icon('alert')}<div>${r.captureNote}</div></div>` : ''}
      <textarea class="textarea" style="min-height:160px" placeholder="Structured notes for this question…">${r.id==='r1' ? 'Strong region-failover example — owned end to end. Quantified P99 improvement. Confident on trade-offs.' : 'Clear postmortem story with closed follow-ups. Access-control answer stayed generic — flag for AI gap check.'}</textarea>`;
  } else if(tab==='transcript'){
    if(!transcript){
      body = `<div class="empty small">${r.captureMode==='manual' ? 'No transcript for this session — recording was declined, structured manual notes are the record of truth.' : 'Transcript not available for this session.'}</div>`;
    } else {
      body = `<div class="banner banner-mock" style="margin-bottom:2px">${icon('sparkle')}<div>Simulated live transcript — updates as the session runs.</div></div>` +
        transcript.map(line=>`<div class="row g10" style="align-items:flex-start">
          <span class="mono xsmall faint" style="width:52px;flex:none;margin-top:2px">${line.t}</span>
          <div><span style="font-weight:700;font-size:12.5px">${line.who}:</span> <span class="small">${line.text}</span></div>
        </div>`).join('');
    }
  } else if(tab==='ai'){
    body = `<div class="stack g8">
      <div class="eyebrow">${icon('sparkle')}Question suggestions</div>
      <div class="card card-pad small" style="cursor:pointer" onclick="toast('Simulated: suggested follow-up inserted into the plan.')">"You mentioned the connection pool — how did you arrive at the pool size you chose?"</div>
      <div class="card card-pad small" style="cursor:pointer" onclick="toast('Simulated: suggested follow-up inserted into the plan.')">"What would you do differently if you had to redo this today?"</div>
      <div class="eyebrow" style="margin-top:6px">${icon('gap')}Evidence gap flagged</div>
      <div class="card card-pad small" style="border-color:var(--warning)">${r.captureMode==='manual' ? 'No gap flagged yet for this session.' : 'The candidate gave a qualitative answer on connection-pool sizing without an order-of-magnitude estimate — consider a quick follow-up.'}</div>
    </div>`;
  }
  return `<div class="tabbar" style="padding:2px 4px 0">
      ${tabBtn('notes','Notes')}
      ${tabBtn('transcript','Transcript')}
      ${tabBtn('ai',icon('sparkle')+'AI suggestions')}
    </div>
    <div class="stack g10" style="padding:14px;overflow-y:auto;flex:1">${body}</div>`;
}
function videoTile(name,color){
  const initials = name.split(' ').map(w=>w[0]).slice(0,2).join('');
  return `<div style="background:${color};border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;color:#fff">
    <div style="width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px">${initials}</div>
    <div style="position:absolute;bottom:8px;left:10px;font-size:12px;font-weight:600;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:6px">${name}</div>
  </div>`;
}

/* ---- REVIEW ---- */
function projReview(p, roundId){
  const r = p.rounds.find(x=>x.id===roundId) || p.rounds[0];
  const sc = p.scorecards[r.id];
  if(isInterviewer() && (!inPanel(r,STATE.role) || (r.interviewer!==STATE.role && coOf(r).role==='co' && !r.coNotes && sc))) return `<div class="empty">${icon('lock')}<div style="margin-top:8px;font-weight:700">Hidden until you submit your own feedback</div><div class="small muted" style="margin-top:4px">This round belongs to another interviewer. You can only review rounds assigned to you.</div></div>`;
  if(!sc) return `<div class="empty">No scorecard yet for this round.${r.interviewer===STATE.role&&r.status==='completed'?`<div style="margin-top:10px"><button class="btn btn-primary btn-sm" onclick="openRound('${p.id}','${r.id}','feedback')">${icon('edit')}Submit your feedback</button></div>`:''}</div>`;
  const otherRounds = p.rounds.filter(x=>x.id!==r.id && !(isInterviewer() && !inPanel(x,STATE.role)));
  return `<div class="stack g18">
    <div class="row-between wrap g10">
      <div class="row g8">${otherRounds.length? otherRounds.map(o=>`<button class="btn btn-secondary btn-sm" onclick="nav('#/project/${p.id}/review/${o.id}')">View ${o.name.split('—')[0].trim()}</button>`).join(''):''}</div>
      <span class="xsmall faint">Round evaluator (human): ${sc.human.evaluator} · submitted ${fmtDate(sc.human.submittedAt)}</span>
    </div>
    ${coNotesCard(r)}
    <div class="card card-pad stack g8">
      <div class="row-between wrap g8"><div class="eyebrow">${esc(sc.human.evaluator)}\u2019s verdict</div><span class="pill pill-neutral">${{scored:'Scored by competency',voice:'Verdict + voice note',comment:'Verdict + comment',verdict:'Verdict only'}[sc.human.mode||'scored']}</span></div>
      <div style="font-weight:800;font-size:18px">${esc(sc.human.recommendation)}</div>
      ${sc.human.comment?`<p class="small" style="line-height:1.6;margin:0">${sc.human.viaVoice?icon('mic')+' ':''}${esc(sc.human.comment)}</p>`:`<p class="small muted" style="margin:0">No comment added.</p>`}
      ${(sc.human.mode&&sc.human.mode!=='scored')?`<div class="xsmall faint">No per-competency scores were given \u2014 those items show Unknown below, not zero. They never block a decision.</div>`:''}
    </div>
    ${cultureReviewCards(p,r,sc)}
    <div class="card card-pad stack g10">
      <div class="eyebrow">${icon('sparkle')}AI-drafted summary</div>
      <p class="small" style="line-height:1.6">AI recommendation: <strong>${sc.ai.recommendation}</strong>. Draft generated from ${r.captureMode==='manual'?'structured manual notes':'the session recording and transcript'}. Review each item below — the AI draft never overwrites a human score.</p>
      <span class="xsmall faint mono">agent_run: ${sc.ai.agentRun}</span>
    </div>
    <div class="stack g12">
      ${r.targetReqIds.map(id=>{
        const req = REQ_LIB[id];
        const aiE = sc.ai.evals.find(e=>e.reqId===id);
        const huE = sc.human.evals.find(e=>e.reqId===id);
        if(!aiE || !huE) return `<div class="card card-pad row-between"><div class="row g8">${req.core?`<span class="pill pill-neutral mono">${req.code}</span>`:`<span class="pill ${req.mustHave?'pill-danger':'pill-neutral'}">${req.mustHave?'Must-have':'Standard'}</span>`}<span style="font-weight:700;font-size:13.5px">${req.name}</span></div><span class="pill pill-unknown">${icon('gap')}Not scored in this round \u2014 Unknown</span></div>`;
        const agree = aiE.score===huE.score;
        return `<div class="card card-pad stack g10">
          <div class="row-between wrap g10">
            <div class="row g8">${req.core?`<span class="pill pill-neutral mono">${req.code}</span>`:`<span class="pill ${req.mustHave?'pill-danger':'pill-neutral'}">${req.mustHave?'Must-have':'Standard'}</span>`}<span style="font-weight:700;font-size:13.5px">${req.name}</span></div>
            ${!agree?'<span class="pill pill-warning">'+icon('alert')+'AI / human differ</span>':''}
          </div>
          <div class="row g20 wrap">
            <div class="stack g4" style="align-items:center">${scoreChip(aiE.score,0)? '' : ''}<div onclick="openDrawer({type:'score',projectId:'${p.id}',roundId:'${r.id}',reqId:'${id}',kind:'ai'})">${scoreChip(aiE.score)}</div><span class="xsmall faint">AI draft</span></div>
            <div class="stack g4" style="align-items:center"><div onclick="openDrawer({type:'score',projectId:'${p.id}',roundId:'${r.id}',reqId:'${id}',kind:'human'})">${scoreChip(huE.score)}</div><span class="xsmall faint">${sc.human.evaluator}</span></div>
            <div class="topbar-spacer"></div>
            <div class="stack g6" style="align-items:flex-end">${req.core?(typeof huE.score==='number'&&!req.standalone?`<span class="pill pill-neutral">${(huE.score/5*req.weight*100).toFixed(0)} / ${Math.round(req.weight*100)} pts</span>`:''):mustHavePill(huE.mustHaveResult)}${confidencePill(huE.confidence)}</div>
          </div>
          ${(()=>{ const mh=(sc.human.mapped||[]).find(x=>x.reqId===id); return (huE.score===null&&mh)?`<div class="stack g6"><div class="row g8"><span class="pill ${LEAN_LBL[mh.lean][1]}">${LEAN_LBL[mh.lean][0]} in comment</span><span class="xsmall faint">${icon('sparkle')} matched from the words, not a score</span></div>${mh.snippets.map(x=>`<p class="small" style="line-height:1.6;margin:0">\u201c${esc(x)}\u201d</p>`).join('')}</div>`:(huE.score===null&&sc.human.mode&&sc.human.mode!=='scored'?`<p class="small muted" style="line-height:1.6;margin:0">Not mentioned in the comment and not scored \u2014 Unknown.</p>`:`<p class="small muted" style="line-height:1.6">${huE.rationale}</p>`); })()}
        </div>`;
      }).join('')}
    </div>
    <div class="row-between card card-pad">
      <div><div class="eyebrow">Overall recommendation for this round</div><div style="font-weight:700;font-size:14px;margin-top:2px">${sc.human.recommendation}</div></div>
      <span class="pill pill-success">${icon('checkCircle')}Submitted</span>
    </div>
  </div>`;
}

/* ---- DEBRIEF ---- */
function projDebrief(p){
  if(!p.debrief) return `<div class="empty">No debrief yet.</div>`;
  const allEvals = {};
  p.requirementIds.forEach(id=>{
    const scores = Object.values(p.scorecards).map(sc=>({ai:sc.ai.evals.find(e=>e.reqId===id), human:sc.human.evals.find(e=>e.reqId===id), evaluator:sc.human.evaluator})).filter(x=>x.human);
    if(scores.length) allEvals[id]=scores;
  });
  const evaluatedCount = Object.keys(allEvals).length;
  const mustHaveIds = p.requirementIds.filter(id=>REQ_LIB[id].mustHave);
  const mustHaveMet = mustHaveIds.filter(id=>{
    const s = allEvals[id]; if(!s) return false;
    return s.every(x=>x.human.mustHaveResult==='meets');
  });
  const evaluatedWeight = Object.keys(allEvals).reduce((s,id)=>s+rw(p,id),0);
  const unknownIds = p.requirementIds.filter(id=>{
    const s = allEvals[id]; return !s || s.some(x=>x.human.score===null);
  });
  const complete = evaluatedCount===p.requirementIds.length && unknownIds.length===0;

  let weighted = null;
  if(complete){
    let sum=0; p.requirementIds.forEach(id=>{ const s=allEvals[id]; const avg=s.reduce((a,x)=>a+x.human.score,0)/s.length; sum += avg*rw(p,id); });
    weighted = sum;
  }

  return `<div class="stack g20">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px" class="cols-2">
      <statTile label="Evaluated" value="${evaluatedCount} / ${p.requirementIds.length}" sub="requirements"></statTile>
      <statTile label="Must-have coverage" value="${mustHaveMet.length} / ${mustHaveIds.length}" sub="meeting the bar"></statTile>
      <statTile label="Evaluated weight" value="${(evaluatedWeight*100).toFixed(0)}%" sub="of total rubric"></statTile>
      <statTile label="Overall score" value="${weighted!==null? weighted.toFixed(1) : '—'}" sub="${weighted!==null? 'complete evaluation':'partial — see below'}"></statTile>
    </div>
    ${!complete ? `<div class="banner banner-warning">${icon('alert')}<div><strong>Partial evaluation.</strong> A final weighted score only appears once every rubric item is scored. ${unknownIds.length} item(s) below are Unknown, not zero: ${unknownIds.map(id=>REQ_LIB[id].name).join(', ')}.</div></div>` : ''}

    <div class="stack g12">
      ${p.requirementIds.map(id=>{
        const req = REQ_LIB[id]; const s = allEvals[id];
        const score = s ? (s.every(x=>x.human.score!==null) ? Math.round(s.reduce((a,x)=>a+x.human.score,0)/s.length) : null) : null;
        const mh = s ? (s.every(x=>x.human.mustHaveResult==='meets')?'meets':(s.some(x=>x.human.mustHaveResult==='below')?'below':'unknown')) : 'unknown';
        return `<div class="card card-pad">
          <div class="row-between wrap g10">
            <div class="row g10">${scoreChip(score,30)}<div><div style="font-weight:700;font-size:13.5px">${req.name}</div><div class="xsmall faint">${req.mustHave?'Must-have · ':''}Required L${req.requiredLevel} · Weight ${(rw(p,req.id)*100).toFixed(0)}%</div></div></div>
            ${mustHavePill(mh)}
          </div>
        </div>`;
      }).join('')}
    </div>

    ${p.debrief.disagreements.length? `<div class="card card-pad stack g12">
      <div class="eyebrow">${icon('alert')}AI / human disagreements</div>
      ${p.debrief.disagreements.map(d=>`<div class="stack g6">
        <div class="small"><strong>${REQ_LIB[d.reqId].name}:</strong> ${d.note}</div>
        <div class="row g8"><span class="pill ${d.resolutionStatus==='resolved'?'pill-success':'pill-warning'}">${d.resolutionStatus}</span><span class="xsmall faint">${d.resolutionReason}</span></div>
      </div>`).join('')}
    </div>`:''}

    ${p.debrief.exceptions.length? p.debrief.exceptions.map(ex=>`<div class="card card-pad stack g12" style="border-color:var(--warning)">
      <div class="row-between wrap g10">
        <div class="row g8"><span class="pill pill-danger">${icon('alert')}Must-have not met — exception</span><span style="font-weight:700;font-size:13.5px">${REQ_LIB[ex.reqId].name}</span></div>
        <span class="pill pill-unknown">${icon('gap')}${ex.actualStatus}</span>
      </div>
      <p class="small" style="line-height:1.6"><strong>Why unmet:</strong> ${ex.reason}</p>
      <p class="small" style="line-height:1.6"><strong>Risk:</strong> ${ex.riskNote}</p>
      <p class="small" style="line-height:1.6"><strong>Mitigation:</strong> ${ex.mitigation}</p>
      <div class="row g20" style="margin-top:4px">
        <div class="row g8">${ex.hrApproved?`<span class="pill pill-success">${icon('check')}HR approved — ${ex.hrApprovedBy}</span>`:`<span class="pill pill-warning">${icon('clock')}Awaiting HR</span>`}</div>
        <div class="row g8">${ex.hmApproved?`<span class="pill pill-success">${icon('check')}Hiring Manager approved — ${ex.hmApprovedBy}</span>`:`<span class="pill pill-warning">${icon('clock')}Awaiting Hiring Manager</span>`}</div>
      </div>
      <div class="xsmall faint">Exceptions do not change the underlying score or fabricate missing evidence — they document why the team is proceeding anyway.</div>
    </div>`).join('') : ''}

    ${p.debrief.weaknesses.length? `<div class="card card-pad stack g10">
      <div class="eyebrow">Named weaknesses (non-blocking)</div>
      ${p.debrief.weaknesses.map(w=>`<div class="small" style="line-height:1.6">• <strong>${REQ_LIB[w.reqId].name}:</strong> ${w.note}</div>`).join('')}
    </div>`:''}

    <div class="row-between">
      <span class="xsmall faint">Reviewed by ${p.debrief.reviewedBy} on ${fmtDate(p.debrief.reviewedAt)}</span>
      <button class="btn btn-primary" onclick="nav('#/project/${p.id}/decision')">Go to Decision &amp; Next Steps ${icon('chevR')}</button>
    </div>
  </div>`.replace(/<statTile label="([^"]*)" value="([^"]*)" sub="([^"]*)"><\/statTile>/g,(m,l,v,s)=>`<div class="card card-pad stack g4"><div class="eyebrow">${l}</div><div class="mono" style="font-size:22px;font-weight:800">${v}</div><div class="xsmall faint">${s}</div></div>`);
}

/* ---- DECISION & NEXT STEPS ---- */
/* must-haves with neither a score nor a matching comment in any round */
function coverageGaps(p){
  const out=[];
  (p.requirementIds||[]).filter(id=>REQ_LIB[id]&&REQ_LIB[id].mustHave).forEach(id=>{
    let covered=false, rid=null;
    (p.rounds||[]).forEach(r=>{
      if(!r.targetReqIds.includes(id)) return;
      if(!rid) rid=r.id;
      const sc=p.scorecards[r.id]; if(!sc) return;
      const e=sc.human.evals.find(x=>x.reqId===id);
      if((e&&e.score!==null)||(sc.human.mapped||[]).some(x=>x.reqId===id)) covered=true;
    });
    if(!covered&&rid) out.push({id,rid});
  });
  return out;
}
function projDecision(p){
  if(isInterviewer()) return `<div class="empty">${icon('lock')}<div style="margin-top:8px">Decisions are visible to HR and the Hiring Manager.</div></div>`;
  if(!p.decision || p.decision.stage==='not_started') return `<div class="empty">No decision started yet.</div>`;
  const d = p.decision;
  const actions = [
    {id:'continue_next_round', label:'Continue to next round', icon:'chevR', desc:'Move forward to a subsequent round with new focus areas.'},
    {id:'hold', label:'Hold', icon:'pause', desc:'Pause the project with a reason, owner and review date.'},
    {id:'request_more_evidence', label:'Request more evidence', icon:'gap', desc:'Create a follow-up task to close a specific evidence gap.'},
    {id:'do_not_proceed', label:'Do not proceed', icon:'x', desc:'End the project with a documented reason.'},
    {id:'complete_evaluation', label:'Complete interview evaluation', icon:'checkCircle', desc:'Finalize the overall conclusion for HR and Hiring Manager confirmation.'},
  ];

  const stageBlock = `<div class="card card-pad stack g10">
    <div class="eyebrow">Recommended action</div>
    <div class="row g16 wrap">
      ${actions.map(a=>`<div class="chip" style="${d.recommendedAction===a.id?'background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700':''}">${icon(a.icon)}${a.label}</div>`).join('')}
    </div>
  </div>`;

  let resultBlock = '';
  if(d.stage==='awaiting_confirmation' || d.stage==='confirmed'){
    const sides = mySides(p).filter(sd=>d[sd].status==='pending');
    const canConfirm = d.stage==='awaiting_confirmation' && sides.length>0;
    const both = d.hr.status==='confirmed' && d.hm.status==='confirmed' && d.hr.by && d.hr.by===d.hm.by;
    const gaps=coverageGaps(p);
    const gapBanner=(gaps.length&&d.stage==='awaiting_confirmation')?`<div class="banner banner-info">${icon('info')}<div style="flex:1"><strong>Gentle heads-up:</strong> no score or comment covers ${gaps.map(g=>esc(REQ_LIB[g.id].name)).join(', ')}. You can still confirm on the overall verdict${p.rounds.length>1?'s':''}, or ask for one line first.<div class="row g8 wrap" style="margin-top:8px">${gaps.filter((g,i,a)=>a.findIndex(x=>x.rid===g.rid)===i).map(g=>{ const rr=p.rounds.find(x=>x.id===g.rid); const nm=personName(rr.interviewer); return `<button class="btn btn-secondary btn-sm" onclick="nudge('${p.id}','${rr.id}','${nm}')">${icon('mail')}Ask ${esc(nm.split(' ')[0])} for a quick line</button>`; }).join('')}</div></div></div>`:'';
    resultBlock = `${layersCard(p)}
    <div class="card card-pad stack g14">
      <div class="eyebrow">Draft conclusion</div>
      ${gapBanner}
      <p class="small" style="line-height:1.65">${d.summary}</p>
      <hr class="divider">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="cols-2">
        ${confirmCard('HR', schedulerOf(p), d.hr)}
        ${confirmCard('Hiring Manager', p.hm, d.hm)}
      </div>
      ${both?`<div class="xsmall faint">${icon('info')} Both sides were confirmed by ${esc(d.hr.by)} (Admin). Each confirmation is recorded separately with its own note and time.</div>`:''}
      ${d.stage==='confirmed' ? `<div class="banner banner-info">${icon('checkCircle')}<div><strong>Confirmed by both.</strong> Evaluation package is ready — <a style="color:var(--accent);font-weight:600;cursor:pointer" onclick="nav('#/project/${p.id}/package')">open it →</a></div></div>` : ''}
      ${canConfirm ? `<div class="stack g12" style="border-top:1px solid var(--border);padding-top:14px">
          ${sides.map(sd=>`<div class="stack g8"><div class="eyebrow">Your confirmation \u2014 ${PEOPLE[STATE.role].name} as ${sd==='hr'?'HR':'Hiring Manager'}</div>
            <textarea id="confirmNote_${sd}" class="textarea" style="min-height:56px" placeholder="Optional note\u2026"></textarea>
            <div class="row g10"><button class="btn btn-primary" onclick="confirmDecision('${p.id}','${sd}')">${icon('check')}Confirm as ${sd==='hr'?'HR':'Hiring Manager'}</button>${sd===sides[0]?`<button class="btn btn-secondary" onclick="toast('Marked as needing discussion \u2014 visible to both parties.')">${icon('alert')}Needs discussion</button>`:''}</div></div>`).join('<hr class="divider">')}
          ${sides.length>1?`<div class="xsmall faint">${icon('info')} You hold both roles, so you confirm twice \u2014 once per side. Each is recorded separately; the package needs both.</div>`:''}
        </div>` : (d.stage==='awaiting_confirmation' ? `<div class="banner banner-info">${icon('info')}<div>${mySides(p).length? 'Your confirmation is recorded.' : 'You are not a confirmer on this project.'} The package publishes once both HR and the Hiring Manager have confirmed.${multiRole()?'':' Switch role (top-right) to see the other side.'}</div></div>` : '')}
    </div>`;
  } else if(d.stage==='hold'){
    resultBlock = `<div class="card card-pad stack g10"><div class="eyebrow">${icon('pause')} On hold</div><p class="small" style="line-height:1.6">${d.holdReason}</p><div class="row g16 small"><span><strong>Owner:</strong> ${d.holdOwner}</span><span><strong>Review by:</strong> ${fmtDate(d.holdReviewDate)}</span></div></div>`;
  }

  return `<div class="stack g18">${stageBlock}${resultBlock}</div>`;
}
function mySides(p){
  const out=[]; if(asHR()) out.push('hr'); if(asHM() && (isAdmin() || p.hm===STATE.role)) out.push('hm'); return out;
}
function confirmCard(role, personKey, c){

const dsleep=ms=>new Promise(r=>setTimeout(r,ms));
async function dfind(fn,ms){ const t0=Date.now(); for(;;){ let el=null; try{ el=fn(); }catch(e){} if(el) return el; if(Date.now()-t0>(ms||700)) return null; await dsleep(40); } }

/* ---------- playback ---------- */
function demoRunFast(from,to){ for(let j=from;j<to;j++){ const s=DEMO.steps[j]; try{ s.run&&s.run(true); }catch(e){ console.error('demo step',j,e); } } }
function demoStart(intake,sched){
  DEMO.snap=demoSnapshot(); DEMO.sc={intake,sched}; DEMO.steps=demoBuild(intake,sched); DEMO.recap=DEMO.steps.recap; DEMO.chs=null; DEMO.noKeep=false; DEMO.endHead=null; DEMO.endTitle=null; DEMO.active=true; DEMO.playing=true; DEMO.speed=DEMO.speed||1;
  demoMount(); demoGoto(0,true);
}
async function demoGoto(k,live){
  k=Math.max(0,Math.min(DEMO.steps.length-1,k)); const tok=++DEMO.tok; DEMO.ended=false; DEMO.ready=false;
  demoRestore(DEMO.snap); demoRunFast(0,k); DEMO.spotFn=null;
  if(live){ await demoPlay(k,tok); }
  else { DEMO.i=k; demoRunFast(k,k+1); render(); demoShow(k,true); }
}
function demoShow(k,staticMode){
  const s=DEMO.steps[k]; DEMO.i=k; if(s.look) DEMO.spotFn=s.look; else DEMO.spotFn=null;
  const place=()=>{ demoCaption(s,k,{}); demoBar(); demoPlace(); };
  place(); setTimeout(place,160);
}
async function demoPlay(k,tok){
  const s=DEMO.steps[k]; DEMO.i=k; DEMO.ready=false; const sp=Math.max(0.5,DEMO.speed);
  DEMO.spotFn=null; DEMO.spotRect=null;
  demoCaption(s,k,{}); demoBar(); demoPlace();
  await dsleep(60); if(tok!==DEMO.tok) return;
  let t=null; if(s.tgt){ t=await dfind(s.tgt,700); if(tok!==DEMO.tok) return; }
  if(t){ t.scrollIntoView({block:'center',behavior:'smooth'}); await dsleep(260); if(tok!==DEMO.tok) return; DEMO.spotFn=()=>{ try{return s.tgt()}catch(e){return null} }; demoCursorTo(t); demoPlace(t); await dsleep(820/sp); if(tok!==DEMO.tok) return; demoRipple(); await dsleep(220/sp); if(tok!==DEMO.tok) return; }
  try{ if(s.live) await s.live(sp); else if(s.run) s.run(false); }catch(e){ console.error('demo step',k,e); }
  if(tok!==DEMO.tok) return;
  await dsleep(140); if(tok!==DEMO.tok) return;
  render(); await dsleep(120); if(tok!==DEMO.tok) return;
  let look=null; if(s.look){ look=await dfind(s.look,700); if(tok!==DEMO.tok) return; }
  DEMO.spotFn = look? s.look : null;
  if(look){ look.scrollIntoView({block:'center',behavior:'smooth'}); demoCursorTo(look); }
  await dsleep(200); if(tok!==DEMO.tok) return;
  demoCaption(s,k,{}); demoBar(); demoPlace(look);
  const dur=(s.dur||3200)/sp; const pi=document.getElementById('demo-progi'); if(pi){ pi.style.transition=`width ${dur}ms linear`; requestAnimationFrame(()=>{ pi.style.width='100%'; }); }
  await dsleep(dur); if(tok!==DEMO.tok) return;
  if(k>=DEMO.steps.length-1){ demoEnd(); return; }
  if(DEMO.playing) demoPlay(k+1,tok); else DEMO.ready=true;
}
function demoEnd(){
  DEMO.ended=true; DEMO.playing=false; DEMO.spotFn=null; demoBar();
  const cap=document.getElementById('demo-cap'); if(!cap) return; cap.className='demo-cap';
  cap.innerHTML=`<div class="demo-ch" style="margin-bottom:8px">${DEMO.endHead||'That’s the whole loop'}</div><div class="demo-title">${DEMO.endTitle||'From a first call to a signed-off package'}</div><div class="demo-say">${DEMO.recap||''}</div>
    <div class="row g8 wrap" style="margin-top:12px"><button class="btn btn-primary btn-sm" onclick="demoRestart()">${icon('refresh')}Replay</button>${DEMO.noKeep?'':`<button class="btn btn-secondary btn-sm" onclick="demoFree()">Keep exploring this project</button>`}<button class="btn btn-ghost btn-sm" onclick="demoExit()">Choose another scenario</button></div>`;
}
function demoToggle(){
  if(DEMO.ended){ demoRestart(); return; }
  DEMO.playing=!DEMO.playing; demoBar();
  if(DEMO.playing && DEMO.ready){ DEMO.ready=false; demoPlay(DEMO.i+1,DEMO.tok); }
}
function demoNext(){ if(DEMO.i>=DEMO.steps.length-1){ demoEnd(); return; } demoGoto(DEMO.i+1,true); }
function demoBack(){ const was=DEMO.playing; DEMO.playing=false; DEMO.tok++; demoGoto(Math.max(0,DEMO.i-1),false); DEMO.playing=false; demoBar(); }
function demoRestart(){ DEMO.playing=true; demoGoto(0,true); }
function demoExit(){
  DEMO.active=false; DEMO.tok++; demoUnmount(); demoRestore(DEMO.snap); STATE.route='#/demo'; location.hash='#/demo'; render();

function demoFree(){

function demoPlace(target){
  const cap=document.getElementById('demo-cap'); if(!cap) return;
  const W=innerWidth,H=innerHeight, cw=Math.min(520,W-40), ch=cap.offsetHeight||150;
  const spot=(target&&target.getBoundingClientRect)? target.getBoundingClientRect() : (DEMO.spotRect||null);
  const avoid=[...document.querySelectorAll('.drawer,.book-card,.modal-card,.cd-mail,.cd-phone')].map(e=>e.getBoundingClientRect());
  const cands=[{n:'bl',l:84,t:H-76-ch},{n:'br',l:W-cw-20,t:H-20-ch},{n:'tl',l:84,t:72},{n:'tr',l:W-cw-20,t:72}];
  const ov=(a,b)=>{ const w=Math.min(a.l+cw,b.right)-Math.max(a.l,b.left), h=Math.min(a.t+ch,b.bottom)-Math.max(a.t,b.top); return (w>0&&h>0)? w*h:0; };
  let best=null,bs=1e18; cands.forEach((c,i)=>{ let sc=i*50; if(spot) sc+=ov(c,spot)*3; avoid.forEach(r=>{ sc+=ov(c,r)*0.6; }); if(sc<bs){ bs=sc; best=c; } });
  cap.style.left=best.l+'px'; cap.style.top=best.t+'px'; cap.style.width=cw+'px';
}

      ${sc==='after'?`<div class="cd-bubble cd-new" style="margin-top:0">${booked?`You’re booked: <strong>${esc(candBookedLab(r))}</strong> with ${esc(iv)} (${esc(r.meetingLabel.replace(' (simulated)',''))}). Video link and calendar invite sent to your email.`:`Thanks, we passed <strong>${esc(candLab(r.candidateProposed))}</strong> to ${esc(iv)}. They will confirm or reply with other options.`}<div class="xsmall faint" style="text-align:right;margin-top:4px">09:04</div></div>`:''}</div>`;
  else screen=`<div class="cd-url"><button class="cd-closetab" title="Close page" onclick="STATE.cd.scene='after';render()">${icon('x')}</button><span>${icon('globe')}${link}</span></div><div class="cd-page">${candPage(c,r,p,false)}</div>`;
  return `<div class="cd-stage">${tag}<div class="cd-phone"><div class="cd-notch"></div><div class="cd-screen">${screen}</div></div></div>`;
}

    add(4,'Confirm booking',`One click and it is booked. ${ivN} is <strong>auto-confirmed</strong> — nobody has to chase anyone.`,{who:'candidate',tgt:$q('.cd-confirm'),run:()=>{ bookConfirm(); STATE.cd.scene='done'; render(); },look:$q('.cd-done'),dur:3600});
    add(4,'All set',`The page confirms the time and says he can close it. The same details arrive by ${chName} with the video link and a calendar invite.`,{who:'candidate',look:$q('.cd-done'),dur:3800});

  } else {

    add(4,'Suggest a time',`${cf} picks a day and a time that suit him.`,{who:'candidate',tgt:()=>[...document.querySelectorAll('button.mini-seg')].filter(b=>/sugDay=/.test(b.getAttribute('onclick')||''))[1],run:()=>{ const ds=[]; for(let i=1;i<=14;i++){ const k=addDays(TODAY_KEY,i); if(dowOf(k)<5) ds.push(k); } STATE.book.sugDay=ds[1]; STATE.book.sugTime='15:30'; render(); },dur:3200});
    add(4,'Send the suggestion','',{who:'candidate',tgt:$t('button',/Send suggestion/),run:()=>{ bookSuggest(); STATE.cd.scene='sent'; render(); },look:$q('.cd-done'),dur:3200});
    steps[steps.length-1].say=`${cf} sends it. The page tells him ${ivN} will confirm or reply, and that he can close it.`;
    closeTab();
