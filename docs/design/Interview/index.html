<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HireOS Interview Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#eef2fa;
  --bg-2:#e4eaf6;
  --surface:#ffffff;
  --surface-2:#f5f7fc;
  --surface-sunken:#eaeef8;
  --border:#dbe2f0;
  --border-strong:#c3ccdf;
  --text:#1c2130;
  --text-secondary:#5b6478;
  --text-faint:#8790a3;
  --accent:#0e7a88;
  --accent-hover:#0a6371;
  --accent-soft:#e1f2f4;
  --accent-soft-strong:#c7e8eb;
  --on-accent:#ffffff;
  --on-warning:#ffffff;
  --on-success:#ffffff;
  --on-danger:#ffffff;
  --on-neutral:#ffffff;
  --success:#1c8a5c;
  --success-soft:#e2f5ec;
  --warning:#a5650a;
  --warning-soft:#fbedd8;
  --danger:#c22e2a;
  --danger-soft:#fbe7e6;
  --unknown:#5b6478;
  --unknown-soft:#eaeef8;
  --purple:#6b4fbb;
  --purple-soft:#efe9fa;
  --shadow-sm:0 1px 2px rgba(28,33,48,.06), 0 1px 1px rgba(28,33,48,.04);
  --shadow-md:0 4px 14px rgba(28,33,48,.10), 0 1px 3px rgba(28,33,48,.06);
  --shadow-lg:0 16px 40px rgba(28,33,48,.18), 0 2px 8px rgba(28,33,48,.08);
  --focus:0 0 0 3px rgba(14,122,136,.35);
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --font-ui:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12141c;
    --bg-2:#181b26;
    --surface:#1b1f2b;
    --surface-2:#20242f;
    --surface-sunken:#0f1119;
    --border:#2c3141;
    --border-strong:#3a4054;
    --text:#e7eaf3;
    --text-secondary:#a3aabf;
    --text-faint:#767f96;
    --accent:#4dd8e8;
    --accent-hover:#7ce4ef;
    --accent-soft:#123539;
    --accent-soft-strong:#164753;
    --on-accent:#0a2226;
    --on-warning:#1c2130;
    --on-success:#1c2130;
    --on-danger:#1c2130;
    --on-neutral:#1c2130;
    --success:#54c690;
    --success-soft:#12301f;
    --warning:#e3a94b;
    --warning-soft:#3a2c11;
    --danger:#ea8a86;
    --danger-soft:#3a1817;
    --unknown:#a3aabf;
    --unknown-soft:#232838;
    --purple:#b39bf0;
    --purple-soft:#241c3d;
    --focus:0 0 0 3px rgba(77,216,232,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 4px 14px rgba(0,0,0,.45);
    --shadow-lg:0 20px 44px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#12141c;
  --bg-2:#181b26;
  --surface:#1b1f2b;
  --surface-2:#20242f;
  --surface-sunken:#0f1119;
  --border:#2c3141;
  --border-strong:#3a4054;
  --text:#e7eaf3;
  --text-secondary:#a3aabf;
  --text-faint:#767f96;
  --accent:#4dd8e8;
  --accent-hover:#7ce4ef;
  --accent-soft:#123539;
  --accent-soft-strong:#164753;
  --on-accent:#0a2226;
  --on-warning:#1c2130;
  --on-success:#1c2130;
  --on-danger:#1c2130;
  --on-neutral:#1c2130;
  --success:#54c690;
  --success-soft:#12301f;
  --warning:#e3a94b;
  --warning-soft:#3a2c11;
  --danger:#ea8a86;
  --danger-soft:#3a1817;
  --unknown:#a3aabf;
  --unknown-soft:#232838;
  --purple:#b39bf0;
  --purple-soft:#241c3d;
  --focus:0 0 0 3px rgba(77,216,232,.35);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.45);
  --shadow-lg:0 20px 44px rgba(0,0,0,.55);
}
/* ---- accent color overrides (layered on top of the theme tokens above) ---- */
:root[data-accent="violet"]{
  --accent:#5b45d1; --accent-hover:#4a37b8; --accent-soft:#efebfc; --accent-soft-strong:#ded6f8; --on-accent:#ffffff;
}
:root[data-accent="amber"]{
  --accent:#8a6a12; --accent-hover:#6f560e; --accent-soft:#faf1d9; --accent-soft-strong:#f3e3b0; --on-accent:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root[data-accent="violet"]:not([data-theme="light"]){
    --accent:#a99bf2; --accent-hover:#bfb3f6; --accent-soft:#241f42; --accent-soft-strong:#2f2856; --on-accent:#1a1330;
  }
  :root[data-accent="amber"]:not([data-theme="light"]){
    --accent:#dcb84f; --accent-hover:#e8c65a; --accent-soft:#3a2f10; --accent-soft-strong:#4a3d15; --on-accent:#241d08;
  }
}
:root[data-theme="dark"][data-accent="violet"]{
  --accent:#a99bf2; --accent-hover:#bfb3f6; --accent-soft:#241f42; --accent-soft-strong:#2f2856; --on-accent:#1a1330;
}
:root[data-theme="dark"][data-accent="amber"]{
  --accent:#dcb84f; --accent-hover:#e8c65a; --accent-soft:#3a2f10; --accent-soft-strong:#4a3d15; --on-accent:#241d08;
}
/* ---- text size ---- */
html[data-textsize="small"] body{zoom:.92;}
html[data-textsize="large"] body{zoom:1.13;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-ui);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em;}
p{margin:0;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--accent-soft-strong);}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.scroll-x{overflow-x:auto;}

/* ============ APP SHELL ============ */
#app{display:flex;min-height:100vh;}
.rail{
  width:64px;flex:none;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px;position:sticky;top:0;height:100vh;
}
.rail-logo{
  width:36px;height:36px;border-radius:10px;background:linear-gradient(155deg,var(--accent),#0a4d57);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;margin-bottom:14px;
  box-shadow:var(--shadow-sm);
}
.rail-btn{
  width:40px;height:40px;border-radius:10px;border:none;background:transparent;color:var(--text-secondary);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s;
}
.rail-btn svg{width:20px;height:20px;}
.rail-btn:hover{background:var(--surface-2);color:var(--text);}
.rail-btn.active{background:var(--accent-soft);color:var(--accent);}
.rail-spacer{flex:1;}
.rail-label{font-size:9px;color:var(--text-faint);margin-top:-2px;letter-spacing:.02em;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:60px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;
  background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;
}
.crumb{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;white-space:nowrap;}
.crumb .dim{color:var(--text-faint);font-weight:500;}
.crumb .sep{color:var(--text-faint);font-weight:400;}
.search-wrap{flex:1;max-width:480px;min-width:210px;position:relative;}
.search-wrap input{text-overflow:ellipsis}
.search-wrap input{
  width:100%;height:36px;border-radius:20px;border:1px solid var(--border);background:var(--surface-2);
  padding:0 14px 0 36px;font-size:13px;color:var(--text);
}
.search-wrap input::placeholder{color:var(--text-faint);}
.search-wrap input:focus{background:var(--surface);outline:none;box-shadow:var(--focus);border-color:var(--accent);}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-faint);}
.topbar-spacer{flex:1;}
.role-switch{
  display:flex;align-items:center;gap:8px;padding:5px 6px 5px 10px;border:1px solid var(--border);border-radius:24px;
  background:var(--surface-2);cursor:pointer;transition:border-color .15s;
}
.role-switch:hover{border-color:var(--border-strong);}
.avatar{
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;flex:none;
}
.role-meta{display:flex;flex-direction:column;line-height:1.2;}
.role-meta .rn{font-size:12.5px;font-weight:600;}
.role-meta .rt{font-size:10.5px;color:var(--text-faint);}
.swap-icon{width:15px;height:15px;color:var(--text-faint);margin-left:2px;}

.seg-group{display:flex;gap:8px;flex-wrap:wrap;}
.seg-btn{
  padding:8px 15px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
  font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,color .15s,border-color .15s;
}
.seg-btn:hover{background:var(--surface-2);}
.seg-btn.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
@keyframes overlayFade{from{background-color:rgba(15,17,25,0)}to{background-color:rgba(15,17,25,.42)}}
@keyframes modalPop{from{opacity:0;transform:scale(.96) translateY(4px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-overlay{position:fixed;inset:0;background-color:rgba(15,17,25,.42);z-index:120;display:flex;align-items:center;justify-content:center;animation:overlayFade .15s ease-out;}
.modal-card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:460px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:26px 28px;animation:modalPop .15s ease-out;}

.content{flex:1;padding:26px 32px 64px;max-width:1360px;width:100%;margin:0 auto;}
.content.wide{max-width:1520px;}
.content.full{max-width:none;padding:0;}

/* ============ TYPE ============ */
.page-title{font-size:22px;}
.section-title{font-size:15px;font-weight:700;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint);}
.muted{color:var(--text-secondary);}
.faint{color:var(--text-faint);}
.small{font-size:12.5px;}
.xsmall{font-size:11.5px;}

/* ============ BUTTONS ============ */
.btn{
  appearance:none;border:1px solid transparent;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,box-shadow .15s;
}
.btn svg{width:15px;height:15px;flex:none;}
.btn-primary{background:var(--accent);color:var(--on-accent);}
.btn-primary:hover{background:var(--accent-hover);}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--text);}
.btn-secondary:hover{background:var(--surface-2);}
.btn-ghost{background:transparent;color:var(--text-secondary);}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);}
.btn-danger{background:var(--surface);border-color:var(--danger);color:var(--danger);}
.btn-danger:hover{background:var(--danger-soft);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-block{width:100%;justify-content:center;}
.iconbtn{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
}
.iconbtn:hover{background:var(--surface-2);color:var(--text);}
.iconbtn svg{width:16px;height:16px;}

/* ============ CARDS / SURFACES ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);}
.card-pad{padding:20px;}
.stack{display:flex;flex-direction:column;}
.g8{gap:8px;} .g10{gap:10px;} .g12{gap:12px;} .g14{gap:14px;} .g16{gap:16px;} .g20{gap:20px;} .g24{gap:24px;} .g6{gap:6px;} .g4{gap:4px;}
.row{display:flex;align-items:center;}
.row-between{display:flex;align-items:center;justify-content:space-between;}
.wrap{flex-wrap:wrap;}
.divider{height:1px;background:var(--border);border:none;margin:0;}
.vdivider{width:1px;background:var(--border);align-self:stretch;}

/* ============ BADGES / PILLS ============ */
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:20px;font-size:11.5px;font-weight:600;
  white-space:nowrap;line-height:1.5;
}
.pill svg{width:12px;height:12px;flex:none;}
.pill-dot{width:6px;height:6px;border-radius:50%;flex:none;}
.pill-neutral{background:var(--surface-sunken);color:var(--text-secondary);}
.pill-accent{background:var(--accent-soft);color:var(--accent);}
.pill-success{background:var(--success-soft);color:var(--success);}
.pill-warning{background:var(--warning-soft);color:var(--warning);}
.pill-danger{background:var(--danger-soft);color:var(--danger);}
.pill-unknown{background:var(--unknown-soft);color:var(--unknown);border:1px dashed var(--border-strong);}
.pill-purple{background:var(--purple-soft);color:var(--purple);}
.chip{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:4px 9px;font-size:12px;color:var(--text-secondary);display:inline-flex;align-items:center;gap:6px;}

.tag-mock{
  background:repeating-linear-gradient(135deg,var(--purple-soft),var(--purple-soft) 6px,var(--surface) 6px,var(--surface) 12px);
  border:1px dashed var(--purple);color:var(--purple);font-weight:700;font-size:10.5px;padding:3px 8px;border-radius:6px;
  letter-spacing:.03em;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px;
}

/* score chip */
.score{
  width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
  font-family:var(--font-mono);flex:none;cursor:pointer;border:1px solid transparent;transition:transform .12s;
}
.score:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);}
.s1{background:var(--danger-soft);color:var(--danger);}
.s2{background:var(--warning-soft);color:var(--warning);}
.s3{background:var(--accent-soft);color:var(--accent);}
.s4{background:var(--success-soft);color:var(--success);}
.s5{background:var(--success);color:#fff;}
.sU{background:var(--unknown-soft);color:var(--unknown);border:1px dashed var(--border-strong);font-size:11px;}

/* ============ NAV TABS ============ */
.tabbar{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;padding:0 2px;}
.tabbtn{
  padding:11px 14px;font-size:13px;font-weight:600;color:var(--text-secondary);background:none;border:none;
  border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;
}
.tabbtn:hover{color:var(--text);}
.tabbtn.active{color:var(--accent);border-bottom-color:var(--accent);}
.tabbtn:disabled{color:var(--text-faint);cursor:not-allowed;}
.tabbtn .lock{width:11px;height:11px;}

/* ============ TABLE / LIST ============ */
.table{width:100%;border-collapse:collapse;}
.table th{
  text-align:left;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-faint);
  padding:0 14px 8px;border-bottom:1px solid var(--border);
}
.table td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
.table tr:last-child td{border-bottom:none;}
.table tr.clickable{cursor:pointer;transition:background .12s;}
.table tr.clickable:hover{background:var(--surface-2);}

/* ============ FORM ============ */
label.field-label{font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;display:block;}
.input,.textarea,.select{
  width:100%;border:1px solid var(--border-strong);border-radius:8px;padding:9px 11px;font-size:13px;color:var(--text);
  background:var(--surface);font-family:inherit;
}
.textarea{resize:vertical;min-height:80px;line-height:1.55;}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:var(--focus);}
.help{font-size:11.5px;color:var(--text-faint);margin-top:5px;}
.radio-card{
  border:1px solid var(--border);border-radius:10px;padding:13px 14px;cursor:pointer;display:flex;gap:11px;align-items:flex-start;
  background:var(--surface);transition:border-color .15s,background .15s;
}
.radio-card:hover{border-color:var(--border-strong);}
.radio-card.selected{border-color:var(--accent);background:var(--accent-soft);}
.radio-dot{width:17px;height:17px;border-radius:50%;border:2px solid var(--border-strong);flex:none;margin-top:1px;position:relative;}
.radio-card.selected .radio-dot{border-color:var(--accent);}
.radio-card.selected .radio-dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent);}

/* ============ HOME: tasks / calendar / role menu ============ */
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
.stat-card{display:flex;flex-direction:column;gap:10px;padding:12px 14px 10px;border-radius:var(--radius-md);cursor:pointer;transition:box-shadow .15s,transform .15s;}
.stat-card.on{box-shadow:0 0 0 2px var(--sc);}
.stat-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px dashed currentColor;border-top-color:rgba(127,127,127,.35);padding-top:7px;}
.stat-act{display:inline-flex;align-items:center;gap:2px;background:none;border:none;font:inherit;font-size:12px;font-weight:800;cursor:pointer;padding:3px 6px;margin-left:-6px;border-radius:6px;}
.stat-act:hover{background:rgba(127,127,127,.14);}
.stat-act:disabled{opacity:.4;cursor:default;background:none;}
.stat-act svg{width:13px;height:13px;}
.filter-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 14px;border-radius:var(--radius-md);background:var(--accent-soft);border:1px solid var(--accent);color:var(--text);font-size:13px;}
.filter-banner svg{width:14px;height:14px;vertical-align:-2px;color:var(--accent);}
.wiz-steps{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 2px;}
.wiz-step{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text-faint);}
.wiz-step.on{color:var(--text);font-weight:800;}
.wiz-step.done{color:var(--text-secondary);}
.wiz-dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border-strong);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none;background:var(--surface);}
.wiz-dot svg{width:13px;height:13px;}
.wiz-step.on .wiz-dot,.wiz-dot.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.wiz-step.done .wiz-dot{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.wiz-line{flex:0 0 36px;height:2px;background:var(--border);}
.wiz-foot{position:sticky;bottom:0;padding:12px 0;background:var(--bg);border-top:1px solid var(--border);}
.book-card{width:860px;max-width:94vw;padding:0;overflow:hidden;}
.book-ribbon{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--warning-soft);color:var(--warning);font-size:12px;font-weight:700;border-bottom:1px solid var(--border);}
.book-ribbon svg{width:14px;height:14px;}
.book-grid{display:grid;grid-template-columns:280px 1fr;min-height:380px;}
.book-left{padding:24px;border-right:1px solid var(--border);background:var(--surface-2);}
.book-right{padding:24px;display:flex;flex-direction:column;min-height:0;}
.book-days{max-height:min(36vh,320px);overflow-y:auto;padding-right:6px;}
.book-day{margin-bottom:12px;}
.book-dayh{font-size:12px;font-weight:800;color:var(--text-secondary);margin-bottom:6px;}
.book-card .small svg,.book-card .xsmall svg{width:14px;height:14px;}
@media (max-width:760px){.book-grid{grid-template-columns:1fr;}}
.stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.stat-badge{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;}
.tab-badge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 6px;margin-left:7px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;}
.chip-btn{cursor:pointer;font-family:inherit;transition:background .12s,border-color .12s;}
.chip-btn:hover{border-color:var(--border-strong);color:var(--text);}
.chip-btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700;}
.task-row{display:grid;grid-template-columns:38px minmax(0,1fr) 128px 180px auto;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.task-row:last-child{border-bottom:none;}
.task-row:hover{background:var(--surface-2);}
.task-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
.task-ico svg,.stat-badge svg,.nextup-ico svg{width:17px;height:17px;}
.cal-card .xsmall svg,.radio-card .xsmall svg{width:12px;height:12px;vertical-align:-2px;}
.task-title{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.task-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.task-meta{line-height:1.35;}
.when-danger{color:var(--danger);font-weight:700;}
.when-warn{color:var(--warning);font-weight:700;}
.when-accent{color:var(--accent);font-weight:700;}
.nextup{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius-md);background:var(--accent-soft);border:1px solid var(--accent);}
.nextup-ico{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none;}
.seg-compact{gap:0;flex-wrap:nowrap;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;background:var(--surface);}
.seg-compact .seg-btn{border:none;border-radius:0;padding:6px 12px;font-size:12px;}
.mini-seg{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.mini-seg:hover{background:var(--surface-2);}
.mini-seg.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.input{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;}
.input:focus{outline:none;box-shadow:var(--focus);border-color:var(--accent);}
.role-switch .swap-icon{display:inline-flex;}
.role-scrim{position:fixed;inset:0;z-index:125;}
.role-menu{position:absolute;right:0;top:calc(100% + 8px);width:320px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:130;}
.role-opt{display:flex;gap:11px;align-items:center;padding:10px;border-radius:9px;cursor:pointer;}
.role-opt:hover{background:var(--surface-2);}
.role-opt.active{background:var(--accent-soft);}
/* calendar */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start;}
.cal-card{overflow:hidden;}
.cal-head{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--border);background:var(--surface-2);}
.cal-head>div{padding:8px 6px;text-align:center;border-left:1px solid var(--border);}
.cal-head>div:first-child{border-left:none;}
.cal-daynum{width:30px;height:30px;margin:2px auto 0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;}
.cal-daynum.today{background:var(--accent);color:var(--on-accent);}
.cal-body{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));}
.cal-hours{position:relative;}
.cal-hour{position:absolute;right:8px;font-size:10.5px;color:var(--text-faint);transform:translateY(-7px);}
.cal-hour:first-child{transform:translateY(2px);}
.cal-col{position:relative;border-left:1px solid var(--border);background-image:linear-gradient(to bottom,var(--border) 1px,transparent 1px);background-size:100% 56px;}
.cal-col.today{background-color:color-mix(in srgb, var(--accent) 7%, var(--surface));}
.cal-now{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:4;}
.cal-now span{position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger);}
.cal-ev{position:absolute;border-radius:7px;padding:3px 6px;overflow:hidden;cursor:pointer;border:1px solid var(--accent);border-left-width:4px;font-size:11px;line-height:1.28;z-index:2;transition:box-shadow .12s;}
.cal-ev:hover{box-shadow:var(--shadow-md);z-index:5;}
.cal-ev.dim,.mon-ev.dim{opacity:.62;}
.cal-t{font-family:var(--font-mono);font-size:10.5px;color:var(--text-secondary);display:flex;gap:6px;align-items:center;white-space:nowrap;}
.cal-st{font-family:var(--font-ui);font-weight:700;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;}
.cal-n{font-weight:700;font-size:11.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-s{font-size:10.5px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-flag{display:inline-flex;color:var(--warning);margin-left:auto;}
.cal-flag svg{width:12px;height:12px;}
.cal-leg{width:22px;height:14px;border-radius:4px;border:1px solid transparent;border-left-width:4px;display:inline-block;}
.st-confirmed{background:var(--accent-soft);border-color:var(--accent);}
.st-pending,.st-resched{background:var(--warning-soft);border:1px dashed var(--warning);border-left:4px solid var(--warning);}
.st-pending .cal-st,.st-resched .cal-st{color:var(--warning);}
.st-declined{background:var(--danger-soft);border-color:var(--danger);}
.st-declined .cal-st{color:var(--danger);}
.st-completed{background:var(--surface-sunken);border-color:var(--border-strong);border-left-color:var(--success);}
.st-unscheduled{background:var(--surface-2);border-color:var(--border-strong);}
.mon-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));}
.mon-dow{padding:8px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);background:var(--surface-2);border-bottom:1px solid var(--border);}
.mon-cell{min-height:118px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;}
.mon-cell:nth-child(7n){border-right:none;}
.mon-cell.other{background:var(--surface-2);}
.mon-cell.other .mon-day{color:var(--text-faint);}
.mon-day{font-size:12px;font-weight:700;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.mon-day:hover{background:var(--surface-sunken);}
.mon-day.today{background:var(--accent);color:var(--on-accent);}
.mon-ev{font-size:11px;padding:2px 6px;border-radius:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left-width:3px;border-left-style:solid;border-top:none;border-right:none;border-bottom:none;}
.mon-ev:hover{box-shadow:var(--shadow-sm);}
.mon-ev.st-confirmed{border-left-color:var(--accent);}
.mon-ev.st-pending,.mon-ev.st-resched{border-left:3px dashed var(--warning);}
.mon-ev.st-declined{border-left-color:var(--danger);}
.mon-ev.st-completed{border-left-color:var(--success);color:var(--text-secondary);}
.feed-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 28px;}
.feed-ico{width:26px;height:26px;border-radius:7px;background:var(--surface-2);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;flex:none;}
.feed-ico svg{width:14px;height:14px;}
.table td .row span.small{white-space:nowrap;}
.side-item{display:flex;gap:9px;align-items:flex-start;cursor:pointer;padding:6px 8px;margin:0 -8px;border-radius:8px;}
.side-item:hover{background:var(--surface-2);}
.side-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;}
@media (max-width:1180px){.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr));}.cal-wrap{grid-template-columns:1fr;}.task-row{grid-template-columns:38px minmax(0,1fr) auto;}.task-row>.task-meta,.task-row>div:nth-child(3){display:none;}}

/* ============ MISC ============ */
.avatar-ring{border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border);}
.progress-track{height:6px;border-radius:4px;background:var(--surface-sunken);overflow:hidden;}
.progress-fill{height:100%;border-radius:4px;background:var(--accent);}
.banner{border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:12.5px;}
.banner svg{width:17px;height:17px;flex:none;margin-top:1px;}
.banner-info{background:var(--accent-soft);color:var(--accent-hover);}
.banner-warning{background:var(--warning-soft);color:var(--warning);}
.banner-mock{background:var(--purple-soft);color:var(--purple);}
.banner-danger{background:var(--danger-soft);color:var(--danger);}
.empty{
  border:1px dashed var(--border-strong);border-radius:12px;padding:30px 20px;text-align:center;color:var(--text-faint);
}
.kbd{font-family:var(--font-mono);font-size:11px;background:var(--surface-sunken);border:1px solid var(--border);border-radius:4px;padding:1px 5px;}

/* ============ OVERLAY / DRAWER ============ */
.overlay{position:fixed;inset:0;background:rgba(15,17,25,.42);z-index:90;display:flex;justify-content:flex-end;animation:fadeIn .15s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.drawer{
  width:min(480px,92vw);height:100%;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;
  animation:slideIn .18s cubic-bezier(.2,.7,.3,1);
}
@keyframes slideIn{from{transform:translateX(24px);opacity:.6}to{transform:translateX(0);opacity:1}}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.drawer-body{flex:1;overflow-y:auto;padding:18px 20px;}
.modal-wrap{position:fixed;inset:0;background:rgba(15,17,25,.42);z-index:95;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s;}
.modal{width:min(460px,100%);background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);padding:22px;}

/* toast */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:11px 18px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:200;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;display:flex;align-items:center;gap:8px;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
#toast svg{width:15px;height:15px;color:var(--success);}

@media(max-width:1180px){
  .content{padding:20px 18px 60px;}
  .cols-2{grid-template-columns:1fr !important;}
  .cols-3{grid-template-columns:1fr !important;}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}

.iv-grid{display:flex;flex-direction:column;gap:10px;max-height:min(42vh,360px);overflow:auto}
.iv-day{display:flex;flex-direction:column;gap:6px}
.iv-dayh{font-size:11.5px;font-weight:700;color:var(--text-secondary)}
.mini-seg:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}

.mic-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px dashed var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;font:inherit}

.mic-btn>span:first-child{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);align-items:center;justify-content:center;flex:none}

.mic-wave i:nth-child(2){animation-delay:.12s}.mic-wave i:nth-child(3){animation-delay:.24s}.mic-wave i:nth-child(4){animation-delay:.36s}.mic-wave i:nth-child(5){animation-delay:.48s}
/* v17 quick verdict */
.verdict-row{display:flex;gap:8px;flex-wrap:wrap}
.vbtn{flex:1 1 auto;min-width:92px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:10px;padding:11px 12px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .12s,border-color .12s}
.vbtn:hover{background:var(--surface-2)}
.vbtn.v-good:hover,.vbtn.v-good2:hover{border-color:var(--success)}.vbtn.v-bad:hover{border-color:var(--danger)}.vbtn.v-warn:hover{border-color:var(--warning)}

.vbtn.active.v-bad{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.vbtn.active.v-warn{background:var(--warning-soft);border-color:var(--warning);color:var(--warning)}
.vbtn.active.v-neutral{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.fb-more{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--text);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;font-family:inherit}
.fb-more svg{width:16px;height:16px}
/* v19 library */
.ico18 svg{width:18px;height:18px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.tpl-card{cursor:pointer;transition:border-color .12s,box-shadow .12s}
.tpl-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md,0 2px 10px rgba(0,0,0,.08))}
details>summary::-webkit-details-marker{display:none}
.chip-btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}

function fmtDate(iso,opts){const d=new Date(iso);return d.toLocaleDateString('en-US',Object.assign({timeZone:TZ},opts||{month:'short',day:'numeric',year:'numeric'}));}
function fmtDateTime(iso){const d=new Date(iso);return d.toLocaleString('en-US',{timeZone:TZ,month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' UTC+8';}
/* Deterministic UTC+8 day/time helpers (calendar + task list) */
const _shFmt = new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function shParts(iso){const o={};_shFmt.formatToParts(new Date(iso)).forEach(p=>{o[p.type]=p.value;});return {hh:+o.hour,mm:+o.minute,key:o.year+'-'+o.month+'-'+o.day};}
function dayKey(iso){return shParts(iso).key;}
function addDays(key,n){const d=new Date(key+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function dowOf(key){return (new Date(key+'T00:00:00Z').getUTCDay()+6)%7;} // Monday = 0
function weekStart(key){return addDays(key,-dowOf(key));}
function fmtKey(key,opts){return new Date(key+'T00:00:00Z').toLocaleDateString('en-US',Object.assign({timeZone:'UTC'},opts));}
function hhmm(iso){const p=shParts(iso);return String(p.hh).padStart(2,'0')+':'+String(p.mm).padStart(2,'0');}
function endIso(r,startIso){return new Date(new Date(startIso||r.date).getTime()+r.durationMin*60000).toISOString();}
const TODAY_KEY = dayKey(now.toISOString());
function dayDiff(iso){return Math.round((new Date(dayKey(iso)+'T00:00:00Z')-new Date(TODAY_KEY+'T00:00:00Z'))/864e5);}
function whenLabel(iso){const n=dayDiff(iso);const day=n===0?'Today':n===1?'Tomorrow':n===-1?'Yesterday':fmtKey(dayKey(iso),{weekday:'short',month:'short',day:'numeric'});return day+' · '+hhmm(iso);}
function hoursUntil(iso){return (new Date(iso)-now)/36e5;}
function ageDays(iso){return Math.floor((now-new Date(iso))/864e5);}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  const root = document.documentElement;
  if(STATE.theme==='light') root.setAttribute('data-theme','light');
  else if(STATE.theme==='dark') root.setAttribute('data-theme','dark');
  else root.removeAttribute('data-theme');
  root.setAttribute('data-accent', STATE.accent);
  root.setAttribute('data-textsize', STATE.textSize);
}
function setAppearance(group, value){
  STATE[group] = value;
  applyAppearance();
  try{ localStorage.setItem('hireos_'+group, value); }catch(e){}
  render();
}
function resetAppearance(){
  Object.assign(STATE, APPEARANCE_DEFAULTS);
  applyAppearance();
  try{ Object.keys(APPEARANCE_DEFAULTS).forEach(k=>localStorage.removeItem('hireos_'+k)); }catch(e){}
  toast('Appearance reset to defaults', true);
  render();
}
function openAppearance(){ STATE.appearanceOpen = true; render(); }
function closeAppearance(){ STATE.appearanceOpen = false; render(); }
(function initAppearance(){
  try{
    const t = localStorage.getItem('hireos_theme');
    if(t==='light' || t==='dark' || t==='system') STATE.theme = t;
    const a = localStorage.getItem('hireos_accent');
    if(a==='teal' || a==='violet' || a==='amber') STATE.accent = a;
    const s = localStorage.getItem('hireos_textSize');
    if(s==='small' || s==='medium' || s==='large') STATE.textSize = s;
  }catch(e){}
  applyAppearance();
})();

function toast(msg, ok){
  const t=document.getElementById('toast');
  t.innerHTML = (ok!==false? icon('checkCircle') : icon('info')) + '<span>'+msg+'</span>';
  t.classList.add('show');
  clearTimeout(STATE.toastTimer);
  STATE.toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

function nav(route){ STATE.route=route; STATE.drawer=null; location.hash=route; render(); window.scrollTo(0,0); }
function openDrawer(d){ STATE.drawer=d; render(); }
function closeDrawer(){ STATE.drawer=null; render(); }

function avatar(personKey, size){

function statusPill(status){
  const map = {
    awaiting_confirmation:{cls:'pill-warning',label:'Awaiting confirmation',icon:'clock'},
    draft:{cls:'pill-neutral',label:'Draft',icon:'edit'},
    published:{cls:'pill-accent',label:'Package published',icon:'pkg'},
    on_hold:{cls:'pill-unknown',label:'On hold',icon:'pause'},
    not_proceeding:{cls:'pill-danger',label:'Not proceeding',icon:'x'},
    in_progress:{cls:'pill-accent',label:'In progress',icon:'clock'},
    ready_to_publish:{cls:'pill-success',label:'Ready to publish',icon:'checkCircle'},
  };
  const m = map[status] || {cls:'pill-neutral',label:status,icon:'info'};
  return `<span class="pill ${m.cls}">${icon(m.icon)}${m.label}</span>`;
}

function scoreChip(score, size){
  size = size||34;
  if(score===null||score===undefined) return `<div class="score sU" style="width:${size}px;height:${size}px">?</div>`;
  return `<div class="score s${score}" style="width:${size}px;height:${size}px">${score}</div>`;
}

function mustHavePill(result){
  if(result==='meets') return `<span class="pill pill-success">${icon('check')}Meets bar</span>`;
  if(result==='below') return `<span class="pill pill-danger">${icon('alert')}Below bar</span>`;
  if(result==='unknown') return `<span class="pill pill-unknown">${icon('gap')}Unknown</span>`;
  return `<span class="pill pill-neutral">N/A</span>`;
}

function confidencePill(c){
  const map={high:'pill-success',medium:'pill-warning',low:'pill-neutral',unknown:'pill-unknown'};
  return `<span class="pill ${map[c]||'pill-neutral'}">${(c||'unknown')} confidence</span>`;
}

function strengthPill(s){
  const map={strong:'pill-success',medium:'pill-warning',weak:'pill-neutral',unverified:'pill-unknown'};
  const label={strong:'Strong evidence',medium:'Medium evidence',weak:'Weak evidence',unverified:'Unverified'};
  return `<span class="pill ${map[s]||'pill-neutral'}">${label[s]||s}</span>`;
}

function evTypeLabel(t){
  return {self_reported:'Self-reported', demonstrated:'Demonstrated', assessment_artifact:'Assessment artifact', externally_verified:'Externally verified', interviewer_observation:'Interviewer observation'}[t] || t;
}

      </div>
      <div class="drawer-body stack g18">
        <div class="row g8 wrap">
          ${strengthPill(ev.strength)}${confidencePill(ev.confidence)}

/* Score / rubric drawer */
function scoreDrawer(projectId, roundId, reqId, evaluatorKind){
  const p = PROJECTS[projectId]; const req = REQ_LIB[reqId];
  const sc = p.scorecards[roundId];
  const evalObj = evaluatorKind==='ai' ? sc.ai.evals.find(e=>e.reqId===reqId) : sc.human.evals.find(e=>e.reqId===reqId);
  const other = evaluatorKind==='ai' ? sc.human.evals.find(e=>e.reqId===reqId) : sc.ai.evals.find(e=>e.reqId===reqId);
  return `<div class="overlay" onclick="if(event.target===this)closeDrawer()">
    <div class="drawer" style="width:min(560px,94vw)">
      <div class="drawer-head">
        <div>
          <div class="eyebrow" style="margin-bottom:4px">${req.mustHave?'Must-have · ':''}Competency score</div>
          <div style="font-size:16px;font-weight:700">${req.name}</div>
        </div>
        <button class="iconbtn" onclick="closeDrawer()">${icon('x')}</button>
      </div>
      <div class="drawer-body stack g20">
        <div class="row g16">
          <div class="stack g4" style="align-items:center">
            ${scoreChip(evalObj.score,48)}
            <span class="xsmall faint">${evaluatorKind==='ai'?'AI draft':sc.human.evaluator}</span>
          </div>
          <div class="vdivider" style="height:44px"></div>
          <div class="stack g4" style="align-items:center">
            ${scoreChip(other.score,48)}
            <span class="xsmall faint">${evaluatorKind==='ai'? sc.human.evaluator : 'AI draft'}</span>
          </div>
          <div class="topbar-spacer"></div>
          <div class="stack g6" style="align-items:flex-end">
            ${mustHavePill(evalObj.mustHareResult||evalObj.mustHaveResult)}
            ${confidencePill(evalObj.confidence)}
          </div>
        </div>
        <div class="card card-pad stack g10">
          <div class="eyebrow">Required level &amp; rubric</div>
          <div class="row-between"><span class="small">Required for this role</span><span class="pill pill-accent">Level ${req.requiredLevel}</span></div>
          <hr class="divider">
          ${[1,2,3,4,5].map(l=>`<div class="row g10" style="align-items:flex-start;opacity:${l===req.requiredLevel?1:.62}">
            <div class="score s${l}" style="width:22px;height:22px;font-size:11px;flex:none">${l}</div>
            <div class="small" style="line-height:1.5">${req.anchors[l]}</div>
          </div>`).join('')}
        </div>
        <div class="stack g8">
          <div class="eyebrow">Scoring rationale — ${evaluatorKind==='ai'?'AI draft':sc.human.evaluator}</div>
          <div class="card card-pad small" style="line-height:1.6">${evalObj.rationale}</div>
          ${sc.human.overrideReasons && sc.human.overrideReasons[reqId] && evaluatorKind==='human' ? `<div class="banner banner-info">${icon('info')}<div><strong>Human override reason:</strong> ${sc.human.overrideReasons[reqId]}</div></div>`:''}
        </div>
        <div class="stack g8">
          <div class="eyebrow">Supporting &amp; contradicting evidence</div>
          <div class="stack g8">
            ${evalObj.evidenceIds.map(eid=>{const ev=p.evidence[eid];return `<div class="card card-pad" style="cursor:pointer" onclick="openDrawer({type:'evidence',projectId:'${projectId}',evidenceId:'${eid}'})">
              <div class="row-between g10"><span class="small" style="line-height:1.5">${ev.statement}</span>${strengthPill(ev.strength)}</div>
              <div class="row-between" style="margin-top:8px"><span class="xsmall faint">${ev.source}</span><span class="xsmall accent-link" style="color:var(--accent);font-weight:600">Open original answer ${icon('chevR')}</span></div>
            </div>`;}).join('') || `<div class="empty small">No evidence linked — evaluated as Unknown.</div>`}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function render(){
  try{ renderInner(); }catch(err){ showFatalError(err); }
}
function renderInner(){
  let route = STATE.route;
  let inner, opts={};
  if(route==='#/home' || route===''){ inner = pageHome(); opts={wide:true}; }
  else if(route.startsWith('#/interviews')){ inner = pageInterviews(); opts={wide:true}; }
  else if(route.startsWith('#/library')){ inner = pageLibrary(); opts={wide:true}; }
  else if(route.startsWith('#/create')){ inner = pageCreate(); }
  else if(route.startsWith('#/demo')){ inner = pageDemo(); }
  else if(route.startsWith('#/connections')){ inner = pageConnections(); }
  else if(route.startsWith('#/settings')){ inner = pageSettings(); }
  else if(route.startsWith('#/project/')){
    const parts = route.replace('#/project/','').split('/');
    const pid = parts[0]; const sub = parts[1]||'overview'; const arg = parts[2];
    const res = pageProject(pid, sub, arg);
    inner = res.html; opts = res.opts||{};
  } else { inner = pageHome(); opts={wide:true}; }

  document.getElementById('app').innerHTML = shell(inner, opts);

  // overlays
  if(STATE.drawer){
    const d = STATE.drawer;
    let html='';
    if(d.type==='evidence') html = evidenceDrawer(d.projectId, d.evidenceId);
    if(d.type==='score') html = scoreDrawer(d.projectId, d.roundId, d.reqId, d.kind);
    if(d.type==='exception') html = exceptionDrawer(d.projectId, d.reqId);
    if(d.type==='round') html = roundDrawer(d);
    document.getElementById('app').insertAdjacentHTML('beforeend', html);
  }
  if(STATE.cd){
    document.getElementById('app').insertAdjacentHTML('beforeend', candScene());
  }
  if(STATE.book && !STATE.cd){
    document.getElementById('app').insertAdjacentHTML('beforeend', bookingModal());
  }
  if(STATE.rbImp){
    document.getElementById('app').insertAdjacentHTML('beforeend', rbImportModal());
  }
  if(STATE.appearanceOpen){
    document.getElementById('app').insertAdjacentHTML('beforeend', appearanceModal());
  }
}
window.addEventListener('hashchange', ()=>{ if(typeof DEMO!=='undefined' && DEMO.active) return; STATE.route=location.hash||'#/home';render();});

const TONES = {
  accent:{fg:'var(--accent)', bg:'var(--accent-soft)', on:'var(--on-accent)'},
  warning:{fg:'var(--warning)', bg:'var(--warning-soft)', on:'var(--on-warning)'},
  success:{fg:'var(--success)', bg:'var(--success-soft)', on:'var(--on-success)'},
  danger:{fg:'var(--danger)', bg:'var(--danger-soft)', on:'var(--on-danger)'},
  neutral:{fg:'var(--text-secondary)', bg:'var(--surface-2)', on:'var(--on-neutral)'},
};
function personName(k){ return (PEOPLE[k]||{name:'Unassigned'}).name; }
function candName(p){ return p.candidate && p.candidate.linked ? p.candidate.name : 'Candidate not linked'; }
function roundShort(r){ return r.name.split('—')[0].trim(); }
/* ---------- panel: lead interviewer + optional co-interviewer / observer (rare) ---------- */
function coOf(r){ return (r&&r.co&&r.co.who&&PEOPLE[r.co.who])? r.co : null; }
function ivKeys(r){ const c=coOf(r); return c? [r.interviewer,c.who] : [r.interviewer]; }
function inPanel(r,k){ return ivKeys(r).indexOf(k)>=0; }
function coRoleLabel(c){ return c&&c.role==='observe'?'Observer':'Co-interviewer'; }
function panelNames(r){ const c=coOf(r); return personName(r.interviewer)+(c?' + '+personName(c.who):''); }
function conflictsForPanel(r,startIso,durMin,exclude){ const out=[]; ivKeys(r).forEach(k=>conflictsFor(k,startIso,durMin,exclude).forEach(x=>out.push(Object.assign({who:k},x)))); return out; }
function cfText(cf){ return (cf[0].who===STATE.role?'You already have':esc(personName(cf[0].who))+' already has')+' '+esc(candName(cf[0].p))+' — '+esc(roundShort(cf[0].r))+' at this time'; }
function coNotesCard(r){ if(!r.coNotes) return ''; return `<div class="card card-pad stack g8"><div class="eyebrow">${icon('users')} Notes from ${esc(personName(r.coNotes.who))} (${coRoleLabel(coOf(r)).toLowerCase()})</div><div class="small" style="line-height:1.55;white-space:pre-wrap">${esc(r.coNotes.text)}</div></div>`; }
function coPanelView(p,r,st,fbDone){
  const c=coOf(r), lead=personName(r.interviewer), obs=c.role==='observe', role=obs?'observing':'co-interviewing', sc=p.scorecards&&p.scorecards[r.id];
  const scCard=sc?`<div class="card card-pad stack g8"><div class="eyebrow">Scorecard</div>${kv('Evaluator',esc(sc.human.evaluator))}${kv('Recommendation',esc(sc.human.recommendation))}<button class="btn btn-secondary" onclick="nav('#/project/${p.id}/review/${r.id}')">${icon('eye')}Open review</button></div>`:'';
  if(st==='completed'){
    let out='';
    if(obs) out+=`<div class="banner banner-info">${icon('eye')}<div>You observed this round. No scorecard is needed from you — ${esc(lead)} submits it.</div></div>`;
    else if(r.coNotes) out+=`<div class="card card-pad stack g8"><div class="eyebrow">Your notes</div><div class="small" style="line-height:1.55;white-space:pre-wrap">${esc(r.coNotes.text)}</div><div class="xsmall faint">Shown next to ${esc(lead)}’s scorecard.</div></div>`;
    else out+=`<div class="card card-pad stack g8"><div class="eyebrow">Your notes (optional)</div><div class="xsmall muted" style="line-height:1.5">${esc(lead)} submits the scorecard for this round. Add anything you noticed — it is shown next to the scorecard and never replaces it.</div><textarea class="input" rows="3" placeholder="What did you notice?" oninput="STATE.drawer.f.note=this.value" style="width:100%;resize:vertical">${esc((STATE.drawer.f.note)||'')}</textarea><div class="row g8"><button class="btn btn-primary" onclick="saveCoNotes('${p.id}','${r.id}')">${icon('check')}Save notes</button></div></div>`;
    if(fbDone) out+=(obs||r.coNotes)? scCard : `<div class="banner banner-info">${icon('lock')}<div>${esc(lead)}’s scorecard is hidden until you add your notes.</div></div>`;
    else out+=`<div class="xsmall faint">${esc(lead)} is submitting the scorecard.</div>`;
    return out;
  }
  if(st==='confirmed'||st==='resched') return `<div class="banner banner-info">${icon('users')}<div>You’re ${role} with <strong>${esc(lead)}</strong>. ${obs?'Observers just sit in — no scorecard.':'You can add notes afterwards; '+esc(lead)+' submits the scorecard.'}</div></div>${(dayDiff(r.date)===0&&st==='confirmed')?`<div class="row g8"><button class="btn btn-primary" onclick="toast('Simulated: opening the Google Meet room and live workspace.',true)">${icon('video')}Join (simulated)</button></div>`:''}`;

  const heads = asHR()? '<th>Hiring Manager</th><th>Scheduler</th>' : '<th>Decision</th><th>Scheduler</th>';
  const feed=buildActivityFeed(9).map(ev=>`<div class="row g10" style="align-items:flex-start;cursor:pointer" onclick="nav('#/project/${ev.pid}/overview')"><span class="feed-ico">${icon(ev.icon)}</span><div style="min-width:0"><div class="small" style="line-height:1.4">${ev.text}</div><div class="xsmall faint">${ev.role} · ${fmtTimeAgo(ev.at)}</div></div></div>`).join('');
  const banner = chip.fn? `<div class="filter-banner"><span>${icon('filter')} Showing <strong>${list.length}</strong> of ${base.length} projects — <strong>${chip.label}</strong></span><button class="btn btn-ghost btn-sm" onclick="STATE.projFilter='all';render()">${icon('x')}Clear filter</button></div>` : '';
  return `<div class="stack g12">
    <div class="row-between wrap g12"><div class="row g8 wrap">${chipHtml}</div>${scopeSeg}</div>
    ${banner}
    <div class="card" style="overflow-x:auto"><table class="table">
      <thead><tr><th>Candidate &amp; role</th><th>Stage &amp; status</th><th>Next interview</th>${heads}<th>Rounds</th><th></th></tr></thead>
      <tbody>${rows||`<tr><td colspan="9"><div class="empty" style="border:none">${icon('checkCircle')}<div class="small" style="margin-top:6px">Nothing matches this view.</div></div></td></tr>`}</tbody>
    </table></div>
    ${opts.page?'':`<div class="card card-pad stack g12"><div class="eyebrow">Recent activity</div><div class="feed-grid">${feed}</div></div>`}
  </div>`;
}

/* ---------- ROUND DRAWER ---------- */
function sendInvites(pid,rid){
  const f=STATE.drawer.f, r=getRound(pid,rid), p=PROJECTS[pid]; if(!f.slots.length) return;
  clearCand(r); delete r.rescheduleRequested; delete r.declineReason;
  if(f.slots.length===1){
    r.date=f.slots[0]; r.status='scheduled'; r.rsvp='pending'; r.invitedAt=now.toISOString(); delete r.sched;
    toast(`Invites sent for ${whenLabel(r.date)} to ${panelNames(r)} and ${candName(p)} (simulated). Waiting for the lead interviewer to accept.`,true);
  } else {
    r.slots=f.slots.slice().sort(); r.sched={mode:'propose',sentAt:now.toISOString(),expires:addDays(TODAY_KEY,7)};
    toast(`${f.slots.length} options sent to ${candName(p)} (simulated). They pick one and it is confirmed automatically.`,true);
  }
  STATE.drawer=null; render();
}
function sendBookingLink(pid,rid){
  const r=getRound(pid,rid), p=PROJECTS[pid];
  r.sched={mode:'self',sentAt:now.toISOString(),windowDays:10,expires:addDays(TODAY_KEY,7),allowPropose:true};
  delete r.candidateProposed; delete r.slots;
  toast(`Booking link sent to ${candName(p)} (simulated). They only see times when ${coOf(r)?'both interviewers are':personName(r.interviewer)+' is'} free.`,true);
  STATE.drawer=null; render();
}
function switchToCoord(pid,rid){ const r=getRound(pid,rid); delete r.sched; delete r.slots; if(STATE.drawer){ STATE.drawer.mode='schedule'; } render(); }

function roundDrawer(d){
  const p=PROJECTS[d.pid], r=p&&(p.rounds||[]).find(x=>x.id===d.rid); if(!r) return '';
  const f=d.f, st=roundState(r), me_=STATE.role, iAm=r.interviewer===me_, iCo=!iAm&&inPanel(r,me_), fbDone=hasFeedback(p,r), may=mayCoord(p);
  let mode=d.mode||'view';
  if(mode==='view' && iAm && st==='arrange') mode = hasCandTimes(r)? 'pick' : 'arrange';
  if(mode==='arrange' && st==='arrange' && hasCandTimes(r)) mode='pick';
  if(mode==='view' && may){ if(st==='unscheduled'||st==='resched') mode='schedule'; else if(st==='declined') mode='reassign'; }
  const when = r.date? `${fmtKey(dayKey(r.date),{weekday:'long',month:'long',day:'numeric'})} · ${hhmm(r.date)}–${hhmm(endIso(r))}` : 'Not scheduled yet';
  const btn=(label,js,cls,ic)=>`<button class="btn ${cls||'btn-secondary'}" onclick="${js}">${ic?icon(ic):''}${label}</button>`;
  const dis=(html,cond)=>cond? html : html.replace('<button class="btn btn-primary"','<button class="btn btn-primary" disabled');
  let action='';

  if(mode==='schedule'){
    const multi = st==='unscheduled';
    const slots=slotsFor(r);
    const n=f.slots.length;
    action=`<div class="stack g12">
      ${r.takeoverRequested?`<div class="banner banner-info">${icon('users')}<div style="flex:1"><strong>${esc(personName(r.interviewer))} asks to arrange the time</strong> with ${esc(candName(p))} directly.</div><button class="btn btn-primary btn-sm" style="flex:none" onclick="takeoverDecide('${p.id}','${r.id}',true)">Approve</button><button class="btn btn-ghost btn-sm" style="flex:none" onclick="takeoverDecide('${p.id}','${r.id}',false)">Keep with me</button></div>`:''}
      ${multi?`<div class="card card-pad stack g8" style="background:var(--surface-2)"><div class="row g8"><span class="pill pill-accent">${icon('sparkle')}Fewest back-and-forths</span></div>
        <div style="font-weight:700;font-size:13.5px">Let ${esc(candName(p))} book it</div>
        <div class="xsmall muted" style="line-height:1.5">Send a booking link. The candidate sees only times when ${esc(personName(r.interviewer))} is free (from their connected calendar, simulated) and the slot confirms instantly.</div>
        ${btn('Send booking link','sendBookingLink(\''+p.id+'\',\''+r.id+'\')','btn-primary','mail')}</div>
        ${!iAm?`<div class="card card-pad stack g8" style="background:var(--surface-2)">
          <div style="font-weight:700;font-size:13.5px">Let ${esc(personName(r.interviewer).split(' ')[0])} arrange it</div>
          <div class="xsmall muted" style="line-height:1.5">Hand scheduling to the interviewer. Once they accept, they either share their free times or ask ${esc(candName(p))} for theirs — you stay informed and have nothing to chase.</div>
          ${btn('Hand over to '+personName(r.interviewer).split(' ')[0],'handOver(\''+p.id+'\',\''+r.id+'\')','btn-secondary','users')}</div>`:''}
        <div class="row g10"><hr class="divider" style="flex:1"><span class="xsmall faint">or coordinate it yourself</span><hr class="divider" style="flex:1"></div>`:''}
      <div class="eyebrow">${st==='unscheduled'?'Pick a time':'Propose a new time'}</div>
      <div class="xsmall muted">${multi?'Pick one time to fix it (the interviewer must accept), or up to 4 to let the candidate choose.':'Pick the new time. The interviewer and candidate get fresh invites.'} Conflicts are flagged.</div>
      ${slots.map(s=>{
        const cf=conflictsForPanel(r,s,r.durationMin,{pid:p.id,rid:r.id}), on=f.slots.includes(s);
        return `<div class="radio-card ${on?'selected':''}" onclick="toggleSlot('${s}',${multi})"><span class="radio-dot" ${multi?'style="border-radius:5px"':''}></span><div style="flex:1;min-width:0">
          <div class="row-between"><span style="font-weight:700;font-size:13px">${fmtKey(dayKey(s),{weekday:'short',month:'short',day:'numeric'})} · ${hhmm(s)}–${hhmm(endIso(r,s))}</span>${candTimesOf(r).includes(s)?`<span class="pill pill-accent">Candidate’s pick</span>`:''}</div>
          ${cf.length?`<div class="xsmall" style="color:var(--warning);margin-top:3px">${icon('alert')} ${cfText(cf)}</div>`:`<div class="xsmall faint" style="margin-top:3px">No conflicts for ${coOf(r)?'either interviewer':esc(personName(r.interviewer).split(' ')[0])}</div>`}
        </div></div>`;}).join('')}
      <div class="row g8">${dis(btn(n>1?`Propose ${n} times to candidate`:'Send invites','sendInvites(\''+p.id+'\',\''+r.id+'\')','btn-primary','mail'),n>0)}${(st==='unscheduled'||st==='resched')?'':btn('Cancel','setMode(\'view\')','btn-ghost')}</div>
      <div class="xsmall faint">Invites are simulated. A fixed time becomes Confirmed once the interviewer accepts; times the candidate picks from your options confirm automatically.</div></div>`;
  } else if(mode==='arrange'){
    const am=f.am||'share', cand=candName(p), n=f.slots.length, editing=st==='awaiting' && r.sched && r.sched.mode==='propose';
    const grid=ivGrid(r,{pid:p.id,rid:r.id});
    action=`<div class="stack g12">
      <div class="eyebrow">Agree a time with ${esc(cand)}</div>
      <div class="xsmall muted" style="line-height:1.5">You’re confirmed for this round. Choose how to land a time — no need to go through ${esc(personName(schedulerOf(p)))}.</div>
      <div class="seg-group seg-compact" style="align-self:flex-start"><button class="seg-btn ${am==='share'?'active':''}" onclick="setF('am','share')">Share my free times</button><button class="seg-btn ${am==='ask'?'active':''}" onclick="setF('am','ask')">Ask for their times</button></div>
      ${am==='share'?`<div class="stack g10">
        <div class="xsmall muted" style="line-height:1.5">Tick every slot you could do. ${esc(cand)} gets them as soon as you send, picks one, and it’s confirmed automatically. You can add or remove times later — their page updates by itself. Slots clashing with your other interviews${coOf(r)?` or ${esc(personName(coOf(r).who).split(' ')[0])}’s (${coRoleLabel(r.co).toLowerCase()})`:''} are greyed out.</div>
        <div class="row g8"><button class="btn btn-ghost btn-sm" onclick="ivSelectAll('${p.id}','${r.id}')">Select all free times</button><button class="btn btn-ghost btn-sm" onclick="ivClear()">Clear</button><span class="xsmall faint" style="margin-left:auto">${n} selected</span></div>
        <div class="iv-grid">${grid.map(g=>`<div class="iv-day"><div class="iv-dayh">${fmtKey(g.key,{weekday:'short',month:'short',day:'numeric'})}</div><div class="row g6 wrap">${g.times.map(t=>`<button class="mini-seg ${f.slots.includes(t.iso)?'active':''}" ${t.busy?'disabled title="You have another interview at this time"':''} onclick="toggleSlot('${t.iso}',true,40)">${hhmm(t.iso)}</button>`).join('')}</div></div>`).join('')}</div>
        <div class="row g8">${dis(btn(editing?`Update & resend (${n})`:`Share ${n} time${n!==1?'s':''} with ${esc(cand.split(' ')[0])}`,'ivShare(\''+p.id+'\',\''+r.id+'\')','btn-primary','mail'),n>0)}${st==='awaiting'?btn('Cancel','setMode(\'view\')','btn-ghost'):''}</div></div>`
      :`<div class="card card-pad stack g10" style="background:var(--surface-2)">
        <div style="font-weight:700;font-size:13.5px">Ask ${esc(cand)} when they’re free</div>
        <div class="xsmall muted" style="line-height:1.5">${esc(cand)} gets a short page to suggest up to 3 times. You then pick the one that works — you’ll see a task as soon as they reply.</div>
        <div class="row g8">${btn('Send request','ivAsk(\''+p.id+'\',\''+r.id+'\')','btn-primary','mail')}${st==='awaiting'?btn('Cancel','setMode(\'view\')','btn-ghost'):''}</div></div>`}
      <div class="xsmall faint">Emails and calendar checks are simulated. ${esc(personName(schedulerOf(p)))} stays informed but has nothing to do.</div></div>`;
  } else if(mode==='pick'){
    const times=candTimesOf(r).filter(x=>new Date(x)>=now), cand=candName(p), n=f.slots.length;
    action=`<div class="stack g12">
      <div class="eyebrow">${esc(cand)} suggested ${times.length} time${times.length!==1?'s':''}</div>
      <div class="xsmall muted">Pick the one that works. It’s confirmed for both of you straight away.</div>
      ${times.map(s=>{
        const cf=conflictsForPanel(r,s,r.durationMin,{pid:p.id,rid:r.id}), on=f.slots.includes(s);
        return `<div class="radio-card ${on?'selected':''}" onclick="toggleSlot('${s}',false)"><span class="radio-dot"></span><div style="flex:1;min-width:0">
          <div class="row-between"><span style="font-weight:700;font-size:13px">${fmtKey(dayKey(s),{weekday:'short',month:'short',day:'numeric'})} · ${hhmm(s)}–${hhmm(endIso(r,s))}</span><span class="pill pill-accent">Candidate’s pick</span></div>
          ${cf.length?`<div class="xsmall" style="color:var(--warning);margin-top:3px">${icon('alert')} ${cfText(cf)}</div>`:`<div class="xsmall faint" style="margin-top:3px">${coOf(r)?'No conflicts for either interviewer':'No conflicts in your calendar'}</div>`}
        </div></div>`;}).join('')}
      <div class="row g8">${dis(btn('Confirm this time','ivPick(\''+p.id+'\',\''+r.id+'\')','btn-primary','check'),n>0)}${btn('None of these work — share my times','ivNoneWork(\''+p.id+'\',\''+r.id+'\')','btn-ghost')}</div></div>`;
  } else if(mode==='reassign'){
    const pool=Object.keys(PEOPLE).filter(k=>k!==r.interviewer && !(coOf(r)&&r.co.who===k));
    action=`<div class="stack g10"><div class="eyebrow">Reassign interviewer</div>
      ${st==='declined'?`<div class="banner banner-danger">${icon('x')}<div><strong>${esc(personName(r.interviewer))} declined.</strong> “${esc(r.declineReason||'No reason given')}”</div></div>`:''}
      <div class="xsmall muted">Anyone at the company can interview — they only see their own interviews.</div>
      ${pool.map(k=>{
        const cf=r.date? conflictsFor(k,r.date,r.durationMin,{pid:p.id,rid:r.id}) : [];
        return `<div class="radio-card ${f.assignee===k?'selected':''}" onclick="setF('assignee','${k}')"><span class="radio-dot"></span><div class="row g10" style="flex:1;min-width:0">${avatar(k,28)}<div style="min-width:0"><div style="font-weight:700;font-size:13px">${personName(k)}</div><div class="xsmall faint">${esc(PEOPLE[k].roleFull)}</div></div><div style="margin-left:auto">${r.date?(cf.length?`<span class="pill pill-warning">${icon('alert')}Busy at that time</span>`:`<span class="pill pill-success">${icon('check')}Free</span>`):''}</div></div></div>`;}).join('')}
      <div class="row g8">${dis(btn('Reassign & re-invite','reassignTo(\''+p.id+'\',\''+r.id+'\')','btn-primary','users'),!!f.assignee)}${btn('Find a different time instead','setMode(\'schedule\')','btn-secondary','cal')}</div></div>`;
  } else if(mode==='addco'){
    const cur=coOf(r), pool=Object.keys(PEOPLE).filter(k=>k!==r.interviewer), role=f.coRole||'co';
    action=`<div class="stack g10"><div class="eyebrow">Second interviewer <span class="faint" style="font-weight:500;text-transform:none;letter-spacing:0">\u00b7 optional, rarely needed</span></div>
      <div class="xsmall muted" style="line-height:1.5">Most rounds have one interviewer. Add a second person only for a panel round, or when someone sits in. ${esc(personName(r.interviewer).split(' ')[0])} stays the lead and submits the scorecard. Open times are checked against both calendars.</div>
      <div class="seg-group seg-compact" style="align-self:flex-start"><button class="seg-btn ${role==='co'?'active':''}" onclick="setF('coRole','co')">Co-interviewer</button><button class="seg-btn ${role==='observe'?'active':''}" onclick="setF('coRole','observe')">Observer / shadow</button></div>
      <div class="xsmall faint">${role==='co'?'Takes part in the questions and can add notes next to the scorecard.':'Sits in and listens \u2014 no questions, no scorecard.'}</div>
      ${pool.map(k=>{
        const cf=r.date? conflictsFor(k,r.date,r.durationMin,{pid:p.id,rid:r.id}) : [];
        return `<div class="radio-card ${f.coWho===k?'selected':''}" onclick="setF('coWho','${k}')"><span class="radio-dot"></span><div class="row g10" style="flex:1;min-width:0">${avatar(k,28)}<div style="min-width:0"><div style="font-weight:700;font-size:13px">${personName(k)}</div><div class="xsmall faint">${esc(PEOPLE[k].roleFull)}</div></div><div style="margin-left:auto">${r.date?(cf.length?`<span class="pill pill-warning">${icon('alert')}Busy at that time</span>`:`<span class="pill pill-success">${icon('check')}Free</span>`):''}</div></div></div>`;}).join('')}
      <div class="row g8 wrap">${dis(btn(cur?'Save change':'Add & send invite','saveCo(\''+p.id+'\',\''+r.id+'\')','btn-primary','users'),!!f.coWho)}${cur?btn('Remove','removeCo(\''+p.id+'\',\''+r.id+'\')','btn-secondary'):''}${btn('Back','setMode(\'view\')','btn-ghost')}</div></div>`;
  } else if(mode==='decline'){
    const reasons=['Schedule conflict','Not the right person for this round','Out of office','Other'];
    action=`<div class="stack g10"><div class="eyebrow">Decline this interview</div>
      ${reasons.map(x=>`<div class="radio-card ${f.reason===x?'selected':''}" onclick="setF('reason','${x}')"><span class="radio-dot"></span><span style="font-size:13px;font-weight:600">${x}</span></div>`).join('')}
      <textarea class="input" rows="2" placeholder="Optional note for ${esc(personName(schedulerOf(p)))}…" oninput="STATE.drawer.f.note=this.value" style="width:100%;resize:vertical">${esc(f.note)}</textarea>
      <div class="row g8">${btn('Decline & notify '+personName(schedulerOf(p)).split(' ')[0],'rsvpTo(\''+p.id+'\',\''+r.id+'\',\'declined\')','btn-danger')}${btn('Back','setMode(\'view\')','btn-ghost')}</div></div>`;
  } else if(mode==='feedback'){
    action=fbForm(p,r,f);
  } else {
    if(iCo) action=coPanelView(p,r,st,fbDone);
    else if(iAm && st==='invited') action=`<div class="card card-pad stack g10"><div class="eyebrow">Your response</div><div class="small" style="line-height:1.55">${esc(personName(schedulerOf(p)))} asks you to interview ${esc(candName(p))}${r.arranger==='iv'?' and to agree the time with them directly':''}. No time is fixed yet. ${r.arranger==='iv'?'After you accept you can share your free times or ask them for theirs.':'Accepting lets '+esc(personName(schedulerOf(p)))+' confirm a time.'}</div><div class="row g8">${btn('Accept','rsvpTo(\''+p.id+'\',\''+r.id+'\',\'accepted\')','btn-primary','check')}${btn('Decline…','setMode(\'decline\')','btn-secondary')}</div></div>`;
    else if(iAm && st==='pending') action=`<div class="card card-pad stack g10"><div class="eyebrow">Your response</div><div class="small">${esc(personName(schedulerOf(p)))} invited you to run this round. Accepting adds it to your calendar and confirms the slot for the candidate.</div><div class="row g8">${btn('Accept','rsvpTo(\''+p.id+'\',\''+r.id+'\',\'accepted\')','btn-primary','check')}${btn('Decline…','setMode(\'decline\')','btn-secondary')}</div></div>`;
    else if(iAm && st==='completed' && !fbDone) action=`<div class="banner banner-warning">${icon('edit')}<div><strong>Your feedback is ${new Date(feedbackDueIso(r))<now?'overdue':'due'}.</strong> Due ${whenLabel(feedbackDueIso(r))}.</div></div><div class="row g8">${btn('Submit feedback','setMode(\'feedback\')','btn-primary','edit')}</div>`;
    else if(st==='completed' && fbDone){ const sc=p.scorecards[r.id]; const mayView=!restricted()||iAm; action=mayView?`<div class="card card-pad stack g8"><div class="eyebrow">Scorecard</div>${kv('Evaluator',esc(sc.human.evaluator))}${kv('Recommendation',esc(sc.human.recommendation))}${btn('Open review','nav(\'#/project/'+p.id+'/review/'+r.id+'\')','btn-secondary','eye')}</div>`:`<div class="banner banner-info">${icon('lock')}<div>Scorecards from other evaluators are hidden until you submit your own.</div></div>`; }
    else if(st==='completed' && !fbDone && !iAm) action=`<div class="banner banner-warning">${icon('clock')}<div>Waiting for ${esc(personName(r.interviewer))}’s feedback — due ${whenLabel(feedbackDueIso(r))}.</div></div>${may?btn('Nudge '+personName(r.interviewer).split(' ')[0],'nudge(\''+p.id+'\',\''+r.id+'\',\''+personName(r.interviewer)+'\')','btn-secondary','mail'):''}`;
    else if(st==='awaiting' && iAm && r.arranger==='iv'){
      const m=r.sched.mode, cand=candName(p);
      action=`<div class="card card-pad stack g10"><div class="eyebrow">${icon('mail')} Waiting for ${esc(cand)}</div>
        <div class="small" style="line-height:1.55">${m==='ask'?`You asked ${esc(cand)} for their availability. They suggest up to 3 times and you pick one.`:`${(r.slots||[]).length} of your times were sent. ${esc(cand)} picks one and it is confirmed automatically.`}</div>
        ${kv('Sent',fmtDate(r.sched.sentAt,{month:'short',day:'numeric'}))}${kv('Expires',fmtKey(r.sched.expires,{month:'short',day:'numeric'}))}
        <div class="row g8 wrap">${m==='propose'?btn('Edit my availability','editAvail(\''+p.id+'\',\''+r.id+'\')','btn-primary','edit'):btn('Share my times instead','setMode(\'arrange\')','btn-primary','cal')}${btn('Open candidate’s page (demo)','openBooking(\''+p.id+'\',\''+r.id+'\',false)','btn-secondary','eye')}${btn('Resend','resendLink(\''+p.id+'\',\''+r.id+'\')','btn-ghost','mail')}</div></div>`;
    }
    else if((st==='awaiting'||st==='arrange') && r.arranger==='iv' && !iAm){
      action=`<div class="card card-pad stack g10"><div class="eyebrow">${icon('users')} Handed over</div><div class="small" style="line-height:1.55">${esc(personName(r.interviewer))} accepted and is agreeing the time with ${esc(candName(p))} directly${st==='awaiting'?(r.sched.mode==='ask'?' — they asked the candidate for their times.':' — their free times were sent to the candidate.'):hasCandTimes(r)?' — the candidate replied and they are picking a time.':' — not started yet.'} You don’t need to do anything.</div>
        ${may?`<div class="row g8">${btn('Take scheduling back','takeBack(\''+p.id+'\',\''+r.id+'\')','btn-secondary','refresh')}${btn('Nudge','nudge(\''+p.id+'\',\''+r.id+'\',\''+personName(r.interviewer)+'\')','btn-ghost','mail')}</div>`:''}</div>`;
    }
    else if(st==='awaiting'){
      const prop=r.sched.mode==='propose';
      action=`<div class="card card-pad stack g10"><div class="eyebrow">${icon('mail')} Waiting for ${esc(candName(p))}</div>
        <div class="small" style="line-height:1.55">${prop?`${(r.slots||[]).length} options were sent. The candidate picks one and it confirms automatically.`:`A booking link was sent. ${esc(candName(p))} sees only times when ${coOf(r)?'both interviewers are':esc(personName(r.interviewer))+' is'} free and the slot confirms instantly.`}</div>
        ${kv('Sent',fmtDate(r.sched.sentAt,{month:'short',day:'numeric'}))}${kv('Expires',fmtKey(r.sched.expires,{month:'short',day:'numeric'}))}
        ${may?`<div class="row g8 wrap">${btn('Open candidate’s booking page (demo)','openBooking(\''+p.id+'\',\''+r.id+'\',false)','btn-primary','eye')}${btn('Resend','resendLink(\''+p.id+'\',\''+r.id+'\')','btn-secondary','mail')}${btn('I’ll pick the time instead','switchToCoord(\''+p.id+'\',\''+r.id+'\')','btn-ghost')}</div>`:''}</div>`;
    }

/* ---------- INTERVIEW SETUP WIZARD ---------- */
const WIZ_STEPS=['Rounds & interviewers','How to schedule','Review & send'];
function suggestedQuestion(reqId){ const _q=REQ_LIB[reqId]; if(_q&&_q.question) return _q.question; return `Tell me about a time you showed strong ${REQ_LIB[reqId].name.toLowerCase()}: what was the situation, what did you do, and what changed as a result?`; }
function wizInitFor(p){
  const reqs=p.requirementIds, mh=reqs.filter(id=>REQ_LIB[id].mustHave);
  const has=(p.rounds||[]).length>0, base=(p.rounds||[]).length;
  let k=0; const mkDraft=(n,ids,who)=>({key:'d'+(k++),name:`Round ${n} — ${ids.length? REQ_LIB[ids[0]].name.split(' & ')[0] : 'Interview'}`,durationMin:45,format:'video',targetReqIds:ids.slice(),interviewer:who,method:'default',kind:'business'});
  const drafts=[];
  if(!has){
    const first=(mh.length? mh : reqs).slice(0,3), second=reqs.filter(id=>!first.includes(id));
    drafts.push(mkDraft(1,first,p.hm)); if(second.length) drafts.push(mkDraft(2,second,'priya'));
  } else {
    const covered=new Set(p.rounds.flatMap(r=>r.targetReqIds)), left=reqs.filter(id=>!covered.has(id));
    drafts.push(mkDraft(base+1,left.length?left:reqs.slice(0,1),'priya'));
  }
  return {pid:p.id,step:1,planMode:has?'one':'all',rounds:drafts,nextKey:k,method:'self',windowDays:10,allowPropose:true,
    coordinator:(hasRole('hr')||hasRole('hm'))? STATE.role : schedulerOf(p),picks:{},msg:null};
}
function openWizard(pid,opts){ STATE.wiz=wizInitFor(PROJECTS[pid]); if(opts&&opts.hr) wizAddHr(); nav('#/project/'+pid+'/wizard'); }
function wizAddHr(){
  const w=STATE.wiz; if(w.rounds.some(d=>d.kind==='hr')) return;
  w.rounds.unshift({key:'d'+(w.nextKey++),name:'HR round \u2014 Startup culture',durationMin:45,format:'video',targetReqIds:CORE_ALL.slice(),interviewer:'sarah',method:'default',kind:'hr'});
  if(w.planMode==='one') w.planMode='all'; render();
}
function wizSetKind(i,k){ const w=STATE.wiz, d=w.rounds[i], was=d.kind; d.kind=k;
  if(k==='hr'){ d.targetReqIds=CORE_ALL.slice(); if(/^Round \d+/.test(d.name)) d.name='HR round \u2014 Startup culture'; }
  else if(was==='hr'){ d.targetReqIds=PROJECTS[w.pid].requirementIds.slice(0,3); if(/^HR round/.test(d.name)) d.name='Round \u2014 Interview'; }
  render(); }
function wizRounds(w){ return w.planMode==='one'? w.rounds.slice(0,1) : w.rounds; }
function wizMethodOf(w,d){ return d.method==='default'? w.method : d.method; }
function wizSet(i,field,val){ const d=STATE.wiz.rounds[i]; if(field==='durationMin') val=+val; d[field]=val; if(field==='interviewer' && d.co && d.co.who===val) delete d.co; if(field!=='name') render(); }
function wizSetCo(i,a,v){ const d=STATE.wiz.rounds[i];
  if(a==='add'){ d.co={who:Object.keys(PEOPLE).find(k=>k!==d.interviewer&&k!==STATE.wiz.coordinator),role:'co'}; }
  else if(a==='remove'){ delete d.co; }
  else if(d.co){ d.co[a]=v; }
  render(); }
function wizToggleReq(i,id){ const d=STATE.wiz.rounds[i]; d.targetReqIds = d.targetReqIds.includes(id)? d.targetReqIds.filter(x=>x!==id) : d.targetReqIds.concat([id]); render(); }
function wizAdd(){
  const w=STATE.wiz, p=PROJECTS[w.pid]; const n=(p.rounds||[]).length+w.rounds.length+1;
  w.rounds.push({key:'d'+(w.nextKey++),name:`Round ${n} — Interview`,durationMin:45,format:'video',targetReqIds:[],interviewer:'priya',method:'default',kind:'business'});
  if(w.planMode==='one') w.planMode='all';
  render();
}
function wizRemove(i){ const w=STATE.wiz; w.rounds.splice(i,1); render(); }
function wizMove(i,dir){ const a=STATE.wiz.rounds, j=i+dir; if(j<0||j>=a.length) return; const t=a[i]; a[i]=a[j]; a[j]=t; render(); }
function wizSetPlan(m){ STATE.wiz.planMode=m; render(); }
function wizSetMethod(m){ STATE.wiz.method=m; render(); }
function wizValid(step){
  const w=STATE.wiz, vis=wizRounds(w);
  if(step===1) return vis.length>0 && vis.every(d=>d.name.trim() && d.interviewer && d.targetReqIds.length>0);
  if(step===2) return !!w.coordinator;
  if(step===3) return vis.every(d=> wizMethodOf(w,d)!=='coord' || (w.picks[d.key]||[]).length>0);
  return true;
}
function wizNext(){ const w=STATE.wiz; if(!wizValid(w.step)) return; w.step=Math.min(3,w.step+1); window.scrollTo(0,0); render(); }
function wizBack(){ const w=STATE.wiz; w.step=Math.max(1,w.step-1); window.scrollTo(0,0); render(); }
function wizPick(key,iso){ const w=STATE.wiz; const a=w.picks[key]||[]; w.picks[key]= a.includes(iso)? a.filter(x=>x!==iso) : a.concat([iso]).slice(0,4); render(); }
function wizPreview(i){ const w=STATE.wiz, d=w.rounds[i]; openBooking(w.pid,null,true,{name:d.name,durationMin:d.durationMin,interviewer:d.interviewer,co:d.co,meetingLabel:d.format==='video'?'Google Meet':'On-site',sched:{windowDays:w.windowDays}}); }
function wizSuggest(d,w){
  const out=[]; let c=0;
  for(let i=1;i<=10 && out.length<6;i++){ const k=addDays(TODAY_KEY,i); if(dowOf(k)>=5) continue; const t=['10:00','14:00','15:30'][c++%3]; out.push(shIso(k,t)); }

function wizFinish(){

  let self=0, prop=0, fixed=0, ivn=0;
  vis.forEach(d=>{
    n++; const rm=wizMethodOf(w,d), picks=w.picks[d.key]||[];
    const r=mkRound({id:'r'+n,kind:d.kind||'business',name:d.name,type:`${d.format==='video'?'Video call':'On-site'} · ${d.durationMin} min`,status:'planned',rsvp:undefined,interviewer:d.interviewer,targetReqIds:d.targetReqIds.slice(),date:null,durationMin:d.durationMin,
      meeting:d.format==='video'?'google_meet':'onsite',meetingLabel:d.format==='video'?'Google Meet (simulated)':'On-site (office)',captureMode:d.format==='video'?'record_and_transcribe':'manual',recording:d.format==='video',
      questions:d.targetReqIds.map((id,i)=>mkQ('q'+n+'_'+i,suggestedQuestion(id),[id],(REQ_LIB[id].core?`Sending Labs core ${REQ_LIB[id].code} \u2014 ${CORE_DOC.version}`:`AI-suggested for ${REQ_LIB[id].name} \u2014 edit in the Interview Brief`),true))});
    if(d.co) r.co={who:d.co.who,role:d.co.role};
    if(rm==='self'){ r.sched={mode:'self',sentAt,windowDays:w.windowDays,expires,allowPropose:w.allowPropose}; r.invitedAt=sentAt; self++; }
    else if(rm==='iv'){ r.arranger='iv'; r.rsvp='pending'; r.invitedAt=sentAt; ivn++; }
    else if(picks.length===1){ r.date=picks[0]; r.status='scheduled'; r.rsvp='pending'; r.invitedAt=sentAt; fixed++; }
    else { r.slots=picks.slice().sort(); r.sched={mode:'propose',sentAt,expires}; r.invitedAt=sentAt; prop++; }
    p.rounds.push(r);

}
function wizardPage(p){

  const coordPeople=people.filter(k=>(PEOPLE[k].roles||[]).length);
  let body='';
  if(w.step===1){

    const covered=new Set(existing.flatMap(r=>r.targetReqIds).concat(vis.flatMap(d=>d.targetReqIds)));

    body=`<div class="stack g16">

function setRole(k){
  STATE.role=k; STATE.roleMenu=false; STATE.drawer=null; STATE.book=null; STATE.wiz=null; STATE.lens='all';
  STATE.taskFilter='all'; STATE.projFilter='all';
  applyRoleDefaults();
  if(STATE.route.startsWith('#/project/')){
    const parts=STATE.route.split('/'), sub=parts[3]||'overview';
    if(restricted() && ['rubric','plan','debrief','decision','package','wizard'].includes(sub)){ STATE.route='#/project/'+parts[2]+'/overview'; location.hash=STATE.route; }
  }
  if(!(typeof DEMO!=='undefined' && DEMO.active)) toast('Viewing as '+PEOPLE[k].name+' ('+roleLabel(k)+')', true);

function swapRole(){ toggleRoleMenu(); }

/* ---------- interviewer is the BASE role: every person (HR, HM, Admin included) is also an interviewer ---------- */
function asIV(){ return true; }
function hasCandTimes(r){ return !!((r.candidateTimes&&r.candidateTimes.length) || r.candidateProposed); }
function candTimesOf(r){ return (r.candidateTimes&&r.candidateTimes.length? r.candidateTimes : (r.candidateProposed?[r.candidateProposed]:[])).slice().sort(); }
function clearCand(r){ delete r.candidateProposed; delete r.candidateTimes; }
function arrangerOf(p,r){ return r.arranger==='iv' ? r.interviewer : schedulerOf(p); }

function roundState(r){
  if(r.status==='completed') return 'completed';
  if(r.status==='planned' || !r.date){
    if(r.rsvp==='declined') return 'declined';
    if(r.rsvp==='pending') return 'invited';                               // invited, time still to be arranged
    if(r.sched && r.sched.sentAt && !hasCandTimes(r)) return 'awaiting';   // waiting on the candidate
    if(r.arranger==='iv' && r.rsvp==='accepted') return 'arrange';        // interviewer accepted, now agrees a time with the candidate
    return 'unscheduled';
  }
  if(r.rsvp==='declined') return 'declined';
  if(r.rsvp==='pending') return 'pending';
  if(r.rescheduleRequested) return 'resched';
  return 'confirmed';
}
