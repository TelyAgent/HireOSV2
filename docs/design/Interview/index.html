    steps.recap=`None of ${ivN}’s times worked for ${cf}, so he suggested another from the candidate page, then closed it. ${ivN} got a “pick a time” task with a 24h deadline instead of a long email thread.`;
  }
  return steps;
}

const DEMO_CAND={system:'Amara Okafor',upload:'Elena Torres',folder:'Elena Torres',email:'Elena Torres',voice:'Li Wei'};

  } else if(intake==='upload'){

  } else if(intake==='folder'){

  /* ===== 3 · Plan ===== */

      steps[steps.length-1].say=`${cf} is asked for up to three suitable times.`;
      candBook(0,'ask');
      add(4,`${ivN} picks one`,`${ivN}’s list has <strong>Pick a time</strong> (24h deadline) with ${cf}’s options.`,{who:C.iv,run:()=>toHome(C.iv),look:$row('pick','r1'),dur:3400});
      add(4,'Open and confirm','',{who:C.iv,tgt:$rowBtn('pick','r1',/Pick a time/),run:()=>taskAct(taskId('pick','r1'),'arrange'),dur:1800});
      add(4,'Choose a time',`${ivN} taps the option that works best for him.`,{who:C.iv,tgt:$q('.radio-card[onclick^="toggleSlot"]'),run:()=>{ STATE.drawer.f.slots=[candTimesOf(R())[0]]; render(); },dur:2800});
      add(4,'Confirm this time',`Confirmed — the invite goes to ${cf} and lands on both calendars.`,{who:C.iv,tgt:$q('[onclick^="ivPick("]'),run:()=>ivPick(pid(),'r1'),dur:3400});
    }
    showUpcoming(`The confirmed interview now sits on ${ivN}’s list; the start time is its deadline.`);
  }

  /* ===== 5 · Interview & feedback ===== */
  add(5,'Interview day (simulated)',`Time passes. In the real product the call is recorded and transcribed (with consent) and AI drafts notes; here we jump to the moment it is over.`,{who:C.iv,run:()=>{ const r=R(); r.status='completed'; r.date='2026-09-08T00:00:00Z'; r.rsvp='accepted'; toHome(C.iv); },look:$row('feedback','r1'),dur:4200});
  steps[steps.length-1].say+=` ${ivN}’s list now has <strong>Submit feedback</strong>, due 48h after the interview.`;
  add(5,'Open the feedback form','',{who:C.iv,tgt:$rowBtn('feedback','r1',/Submit feedback/),run:()=>taskAct(taskId('feedback','r1'),'feedback'),dur:1800});
  add(5,'Give your verdict','One tap is enough: <strong>Hire</strong>, <strong>No hire</strong>, unsure or too early to tell. No per-competency scoring is required.',{who:C.iv,tgt:$t('.vbtn',/^Hire$/),run:()=>{ STATE.drawer.f.rec='Hire'; render(); },dur:3200});
  add(5,'Talk it through (optional)',voice?'Instead of typing, dictate it in your own words \u2014 any language, any structure. The note does not have to follow the rubric.':'Prefer talking to typing? Dictate it in your own words \u2014 no need to follow the rubric or the scoring anchors.',{who:C.iv,tgt:$q('.mic-btn[onclick^="fbDictate"]'),run:()=>{ const f=STATE.drawer.f; f.note=voice?'Holds the licence, clear on night-shift hours, arrived early. Quick, practical answers on safety checks. Would hire.':'Strong, concrete examples of owning a production system end to end. A bit light on distributed trade-offs, but I would hire.'; f.viaVoice=true; render(); },dur:4200});
  add(5,'Detailed scores stay optional','Competency scores are tucked away. Anything left unscored shows as <strong>Unknown</strong>, never zero, and never blocks the decision.',{who:C.iv,tgt:$q('.fb-more'),look:$q('.fb-more'),run:()=>{},dur:3000});
  add(5,'Submit feedback','',{who:C.iv,tgt:$q('[onclick^="submitFeedback("]'),run:()=>submitFeedback(pid(),'r1'),dur:3000});
  steps[steps.length-1].say='Submitted. Once every round has feedback, HireOS drafts the conclusion automatically.';

  /* ===== 6 · Decide ===== */
  add(6,'The conclusion is drafted',`${hmN} gets <strong>Confirm interview conclusion</strong> (72h deadline). The conclusion is drafted from the scorecards, and ${one?'both sides must still be confirmed — separately.':'<strong>both</strong> HR and the Hiring Manager must confirm.'}`,{who:C.hm,run:()=>toHome(C.hm),look:$row('confirm'),dur:4200});
  add(6,'Review & confirm','',{who:C.hm,tgt:$rowBtn('confirm',null,/Review & confirm/),run:()=>nav(`#/project/${pid()}/decision`),look:$q('.stack.g18 > .card:last-child'),dur:3600});
  steps[steps.length-1].say='The draft summary shows how many competencies meet the required level — and anything still Unknown stays visible.';
  if(one){
    add(6,'Confirm as HR','As an Admin he confirms twice — once for each side. Each confirmation is recorded separately with its own note and time.',{who:C.hm,tgt:$t('button',/Confirm as HR/),run:()=>confirmDecision(pid(),'hr'),dur:3400});
    add(6,'Confirm as Hiring Manager','',{who:C.hm,tgt:$t('button',/Confirm as Hiring Manager/),run:()=>confirmDecision(pid(),'hm'),dur:3000});
  } else {
    add(6,'Confirm as Hiring Manager',`${hmN} confirms the hiring-manager side.`,{who:C.hm,tgt:$t('button',/Confirm as Hiring Manager/),run:()=>confirmDecision(pid(),'hm'),dur:3200});
    add(6,'HR confirms too',`${hrN} opens the same conclusion and confirms the HR side. The package publishes only when both sides are in.`,{who:C.hr,run:()=>{ setRole(C.hr); nav(`#/project/${pid()}/decision`); },look:$q('.stack.g18 > .card:last-child'),dur:3600});
    add(6,'Confirm as HR','',{who:C.hr,tgt:$t('button',/Confirm as HR/),run:()=>confirmDecision(pid(),'hr'),dur:3000});
  }
  add(6,'The evaluation package is ready','Evidence, scores and both confirmations in one package. The Offer module receives a structured summary — budget and compensation stay in Offer.',{who:C.hr,run:()=>{ setRole(C.hr); nav(`#/project/${pid()}/package`); },look:$q('.card.card-pad.row-between'),dur:4200});
  add(6,'Publish to Offer review','',{who:C.hr,tgt:$t('button',/Publish package/),run:()=>publishPackage(pid()),dur:3400});
  steps[steps.length-1].say='Published to Offer review (simulated). The loop is closed.';
  steps.recap = voice
    ? 'A phone call became a draft JD, a practical rubric and a scheduled, scored interview — with no JD, no résumé and one person wearing every hat. Every task along the way had a deadline.'
    : `${cand} went from intake (${DEMO_INTAKES.find(x=>x.id===intake).label.toLowerCase()}) through rubric, scheduling (${DEMO_SCHEDS.find(x=>x.id===sched).label.toLowerCase()}), interview and dual sign-off. Every task along the way had a deadline.`;
  return steps;
}

   EXCEPTION DRAWER (link from Debrief)

/* ======================================================================
   INIT — defensive: never leave the page blank, always show something
   ====================================================================== */
function showFatalError(err){
  try{
    var msg = (err && (err.stack || err.message)) ? (err.stack || err.message) : String(err);
    document.getElementById('app').innerHTML =
      '<div style="max-width:720px;margin:60px auto;padding:24px;font-family:system-ui,sans-serif">'+
      '<h1 style="font-size:18px;margin:0 0 10px">HireOS prototype failed to render</h1>'+
      '<p style="color:#555;font-size:13px;margin:0 0 14px">This is a diagnostic screen so the failure is visible instead of a blank page. Copy the text below back to Claude.</p>'+
      '<pre style="white-space:pre-wrap;background:#f3f3f3;border:1px solid #ddd;border-radius:8px;padding:14px;font-size:12px;overflow:auto">'+
      msg.replace(/&/g,'&amp;').replace(/</g,'&lt;')+
      '</pre></div>';
  }catch(e2){ /* last resort: leave whatever is there */ }
}
window.addEventListener('error', function(e){ showFatalError(e.error || e.message); });
window.addEventListener('unhandledrejection', function(e){ showFatalError(e.reason); });
try{
  STATE.route = location.hash || '#/home';
  render();
}catch(err){ showFatalError(err); }
</script>
