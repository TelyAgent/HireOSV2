function folderScheduleLabel(c){ if(!c.autoRead) return cpL('Manual only','仅手动读取'); if(c.status==='paused') return cpL('Auto-read paused — resume monitoring to continue','自动读取已暂停，恢复监控后继续'); const f = FOLDER_FREQ.find(x=>x[0]===c.frequency)||FOLDER_FREQ[0]; return cpL('Auto-read: ','自动读取：')+cpL(f[1][0],f[1][1]).toLowerCase(); }
A.openAddFolder = function(){ A.openFolder(); };
/* One form for both adding and editing a folder (same layout as the mailbox form). */
A.openFolder = function(connId){
  const c = connId ? state.db.connections.find(x=>x.id===connId) : null, edit = !!c;
  const v = c || { name:'', account:'', scope:'', autoRead:true, frequency:'watch' };
  const sub = edit ? c.scope!==cpL('This folder only','仅当前文件夹') && c.scope!=='This folder only' : true;
  const defName = p=>String(p).split('/').filter(Boolean).slice(-2).join('/') || String(p);
  const shownName = edit && c.name!==defName(c.account) ? c.name : '';
  openModal(`<div class="modal-header"><h3 class="modal-title">${edit?cpL('Edit folder','编辑文件夹'):cpL('Add folder','添加文件夹')}</h3><button class="close-x" onclick="A.closeModal()"><span class="material-icons-o">close</span></button></div>
    <div class="modal-body">
      <p class="tiny muted" style="margin:0 0 12px;">${cpL('Resumes dropped into this folder are read automatically. A file that’s still being written waits until it’s stable. Demo only — no real folder is contacted.','放入该文件夹的简历会被自动读取，仍在写入的文件会等待稳定后再读。仅为演示，不会连接真实文件夹。')}</p>
      <input type="hidden" id="fd-id" value="${edit?esc(c.id):''}">
      <div class="field"><label>${cpL('Folder','文件夹')}</label>
        <div class="fd-field"><div id="fd-sel" class="fd-sel"></div><button type="button" class="btn btn-secondary" onclick="A.fdToggle()"><span class="material-icons-o" style="font-size:16px;">folder_open</span>${cpL('Choose folder','选择文件夹')}</button></div>
        <div id="fd-picker"></div></div>
      <div class="field"><label>${cpL('Display name (optional)','显示名称（可选）')}</label><input type="text" id="fd-name" placeholder="${esc(cpL('e.g. Shared Drive — Recruiting/Resumes','例如：共享盘 — 招聘/简历'))}" value="${esc(shownName)}" onkeydown="if(event.key==='Enter'){event.preventDefault();A.addFolder()}"></div>
      <div class="field"><div class="mb-auto"><div style="flex:1;min-width:0;"><div style="font-weight:500;font-size:var(--fs-sm);">${cpL('Include subfolders','包含子文件夹')}</div><div class="tiny muted">${cpL('Also read resumes inside folders nested in this one.','同时读取该文件夹里嵌套的子文件夹中的简历。')}</div></div>
        <label class="cp-switch" title="${cpL('Include subfolders','包含子文件夹')}"><input type="checkbox" id="fd-sub" ${sub?'checked':''}><span></span></label></div></div>
      <div class="field"><div class="mb-auto"><div style="flex:1;min-width:0;"><div style="font-weight:500;font-size:var(--fs-sm);">${cpL('Read automatically','自动读取')}</div><div class="tiny muted">${cpL('Check this folder for new resumes on a schedule.','按设定的频率自动检查该文件夹里的新简历。')}</div></div>
        <label class="cp-switch" title="${cpL('Read automatically','自动读取')}"><input type="checkbox" id="fd-auto" ${v.autoRead?'checked':''} onchange="document.getElementById('fd-freq-wrap').style.display=this.checked?'block':'none'"><span></span></label></div>
        <div id="fd-freq-wrap" style="display:${v.autoRead?'block':'none'};margin-top:10px;"><label>${cpL('Frequency','读取频率')}</label><select id="fd-freq">${FOLDER_FREQ.map(([val,l])=>`<option value="${val}" ${val===v.frequency?'selected':''}>${esc(cpL(l[0],l[1]))}</option>`).join('')}</select></div></div>
      <div id="fd-err" class="tiny" style="color:var(--danger-text);min-height:16px;"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="A.closeModal()">${T('Cancel')}</button><button class="btn btn-primary" onclick="A.addFolder()">${edit?cpL('Save','保存'):cpL('Add folder','添加文件夹')}</button></div>`);
  FD.sel = edit ? c.account : ''; FD.path = []; FD.open = false; fdRender();
};
A.addFolder = function(){
  const id = document.getElementById('fd-id').value, path = FD.sel, err = document.getElementById('fd-err');
  const fail = m=>{ err.textContent = m; };
  if(!path) return fail(cpL('Choose a folder first.','请先选择一个文件夹。'));
  if(state.db.connections.some(c=>c.kind==='folder' && c.id!==id && String(c.account).toLowerCase()===path.toLowerCase())) return fail(cpL('This folder is already connected.','该文件夹已经连接。'));
  const nm = (document.getElementById('fd-name').value||'').trim(), sub = document.getElementById('fd-sub').checked, auto = document.getElementById('fd-auto').checked, freq = document.getElementById('fd-freq').value;
  const defName = path.split('/').filter(Boolean).slice(-2).join('/') || path, scope = sub ? cpL('Includes subfolders','包含子文件夹') : cpL('This folder only','仅当前文件夹');
  if(id){
    const c = state.db.connections.find(x=>x.id===id); if(!c) return;
    c.account = path; c.name = nm || defName; c.scope = scope; c.autoRead = auto; c.frequency = freq;
    if(!auto) c.status = 'on_demand'; else if(c.status==='on_demand') c.status = 'watching';
    state.db.activity.unshift({ id:uid('act'), op:'Folder edited', actor:state.currentUser, target:c.name+' — '+path, status:'succeeded', at: nowISO() });
    closeModal(); toast(cpL('Folder updated','文件夹已更新'),'success'); renderRoute(); return;
  }
  const c = { id:uid('conn'), kind:'folder', name: nm || defName, account:path, status: auto?'watching':'on_demand', lastRead:nowISO(), scope, autoRead:auto, frequency:freq };
  state.db.connections.push(c);
  state.db.activity.unshift({ id:uid('act'), op:'Folder added', actor:state.currentUser, target:c.name+' — '+path, status:'succeeded', at: nowISO() });
  closeModal(); toast(cpL('Folder added','文件夹已添加')+': '+c.name,'success'); renderRoute();
};
A.removeFolder = function(connId){
  const c = state.db.connections.find(x=>x.id===connId); if(!c) return;
  confirmModal({ title:cpL('Remove this folder?','移除这个文件夹？'),
    body:`${esc(c.name)} (${esc(c.account)}) — ${cpL('It will no longer be watched. Materials already received are kept.','之后不再监控该文件夹，已收到的材料会保留。')}`,
    confirmLabel:cpL('Remove','移除'), danger:true,
    onConfirm:()=>{ state.db.connections = state.db.connections.filter(x=>x.id!==connId);

  renderRoute();

A.pauseConn = function(connId){
  const c = state.db.connections.find(x=>x.id===connId);
  c.status = c.status==='watching' ? 'paused' : 'watching';
  toast(c.status==='watching' ? T('Resumed monitoring') : T('Paused monitoring — previously received materials are kept'));
  renderRoute();

function renderUnifiedIntake(){
  const rows = [];
  Object.entries(RESUME_VERSIONS).forEach(([cid, versions])=>{
    versions.forEach(v=> rows.push({ at:v.uploadedAt, file:v.fileName, source:v.source, candidate:cid, status:v.parseStatus==='succeeded'?T('Available'):T(cap(v.parseStatus)) }));
  });
  state.importBatches.flatMap(b=>b.items).forEach(it=>{
    const source = it.demo ? ('Manual upload (sample batch '+it.id.split('-')[0]+')') : 'Manual upload';
    rows.push({ at: it.processedAt||nowISO(), file:it.file, source, candidate: it.matchCandidate||it.newCandidateId, status: it.status==='processing'?T('Checking…'):importStatusLabel(it) });
  });
  rows.sort((a,b)=> new Date(b.at)-new Date(a.at));
  return `<div class="section-block" style="margin-top:24px;">
    <div class="section-title">${T('Unified intake')} <span class="tiny" style="font-weight:400;">${T('— every channel, most recent first')}</span></div>
    <div class="card"><table class="data-table"><thead><tr><th>${T('Time')}</th><th>${T('File / item')}</th><th>${T('Source')}</th><th>${T('Candidate')}</th><th>${T('Status')}</th></tr></thead>
    <tbody>${rows.slice(0,14).map(r=>`<tr><td class="tiny">${fmtDateTime(r.at)}</td><td>${esc(r.file)}</td><td class="tiny">${esc(r.source)}</td><td>${r.candidate&&getCandidate(r.candidate)?`<a href="#/candidates/${r.candidate}">${esc(getCandidate(r.candidate).displayName)}</a>`:'<span class="muted">—</span>'}</td><td>${esc(r.status)}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
}
function importStatusLabel(it){
  if(it.kind==='exact_file') return T('Reused existing file');
  if(it.kind==='new_resume_version') return T('Pending duplicate review');
  if(it.kind==='possible_same_person') return T('Pending duplicate review');
  if(it.kind==='new_candidate') return T('Added to library');
  if(it.kind==='quarantined') return T('Quarantined');
  if(it.kind==='parse_failed') return T('Duplicate check incomplete');
  if(it.kind==='too_large') return T('File too large');
  if(it.kind==='unsupported_type') return T('Unsupported file type');
  return T('Processed');
}

/* ---------- Duplicate Review ---------- */
function renderDuplicateDetailPage(params){
  const dr = state.db.duplicateReviews[params.id];
  if(!dr) return emptyState({icon:'search_off', title:T('Duplicate review not found'), body:T('This item may have already been resolved.'), actions:`<a class="btn btn-primary" href="#/tasks">${T('Back to My Tasks')}</a>`});

  if(dr.status==='resolved'){
    return `${pageHeader(T('Duplicate review — resolved'), '', '', [{label:T('My Tasks'),href:'#/tasks'},{label:T('Duplicate review')}])}
    <div class="card card-pad">
      <div class="badge badge-success" style="margin-bottom:10px;">${T('Resolved:')} ${esc(T(dr.resolutionLabel||''))}</div>
      <p style="font-size:var(--fs-sm);">${esc(dr.resolutionNote||'')}</p>
      <p class="tiny">${T('Resolved by')} ${esc(getPerson(dr.resolvedBy).name)} · ${fmtDateTime(dr.resolvedAt)}</p>
    </div>`;
  }

  const kindCopy = {
    exact_file: { title:T('This file already exists'), desc:T('File content is byte-identical to a file already on record. It can be reused; this upload is still kept as a new source in history.') },
    possible_same_person: { title:T('Possible duplicate candidate'), desc:T('Name and some details match an existing candidate, but contact information differs. Identity is not merged automatically.') },
    new_resume_version: { title:T('A newer resume may be available'), desc:T('Contact details match an existing candidate and the content looks newer. Confirm before it becomes the current version.') },
    parse_failed: { title:T('Duplicate check incomplete'), desc:T('The file could not be parsed, so a text-similarity check could not run. This is shown as incomplete — not as “no duplicate found.”') },
  }[dr.kind] || { title:T('Review needed'), desc:'' };

  const existingCand = getCandidate(dr.existing.candidateId);

  return `
  ${pageHeader(T('Duplicate review'), kindCopy.desc, '', [{label:T('My Tasks'),href:'#/tasks'},{label:T('Duplicate review')}])}
  <div class="badge ${dr.kind==='exact_file'?'badge-neutral':'badge-warning'}" style="margin-bottom:16px;font-size:var(--fs-sm);padding:6px 14px;">${kindCopy.title}</div>
  <div class="two-col" style="grid-template-columns:1fr 1fr;">
    <div class="card card-pad">
      <div class="eyebrow" style="margin-bottom:10px;">${T('Uploaded now')}</div>
      <div style="font-weight:500;font-size:var(--fs-lg);margin-bottom:4px;">${esc(dr.uploaded.fileName)}</div>
      <table class="data-table" style="margin-top:10px;">
        <tbody>
          <tr><td class="tiny">${T('Name')}</td><td>${esc(dr.uploaded.name||'—')}</td></tr>
          <tr><td class="tiny">${T('Email')}</td><td>${esc(dr.uploaded.email||'—')}</td></tr>
          ${dr.uploaded.phone?`<tr><td class="tiny">${T('Phone')}</td><td>${esc(dr.uploaded.phone)}</td></tr>`:''}
          ${dr.uploaded.location?`<tr><td class="tiny">${T('Location')}</td><td>${esc(dr.uploaded.location)}</td></tr>`:''}
          <tr><td class="tiny">${T('Uploaded')}</td><td>${fmtDateTime(dr.uploaded.uploadedAt)}</td></tr>
          <tr><td class="tiny">${T('Source')}</td><td>${esc(dr.uploaded.source)} ${T('by')} ${esc(getPerson(dr.uploaded.uploadedBy).name)}</td></tr>
        </tbody>
      </table>
    </div>
    <div class="card card-pad">
      <div class="eyebrow" style="margin-bottom:10px;">${T('Existing record')}</div>
      <div style="font-weight:500;font-size:var(--fs-lg);margin-bottom:4px;"><a href="#/candidates/${existingCand.id}">${esc(existingCand.displayName)}</a></div>
      <table class="data-table" style="margin-top:10px;">
        <tbody>
          <tr><td class="tiny">${T('File')}</td><td>${esc(dr.existing.fileName)}</td></tr>
          <tr><td class="tiny">${T('Email')}</td><td>${esc(dr.existing.email||existingCand.contact.email)}</td></tr>
          ${(dr.existing.phone||existingCand.contact.phone)?`<tr><td class="tiny">${T('Phone')}</td><td>${esc(dr.existing.phone||existingCand.contact.phone)}</td></tr>`:''}
          <tr><td class="tiny">${T('Location')}</td><td>${esc(dr.existing.location||existingCand.contact.location.value)}</td></tr>
          <tr><td class="tiny">${T('Uploaded')}</td><td>${fmtDateTime(dr.existing.uploadedAt)}</td></tr>
          <tr><td class="tiny">${T('Source')}</td><td>${esc(dr.existing.source)}</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="card card-pad" style="margin-top:16px;">
    <div class="eyebrow" style="margin-bottom:8px;">${T('Detection basis')}</div>
    <ul style="margin:0;padding-left:18px;font-size:var(--fs-sm);">${(dr.basis||[]).map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
    ${dr.changeSummary?`<p style="font-size:var(--fs-sm);margin-top:10px;"><strong>${T('What changed:')}</strong> ${esc(dr.changeSummary)}</p>`:''}
  </div>
  <div class="page-header" style="margin-top:20px;">
    <div></div>
    <div class="actions">
      ${dr.kind==='parse_failed' ? `<button class="btn btn-secondary" onclick="A.retryDuplicateParse('${dr.id}')">${T('Retry parsing')}</button>` : ''}
      ${dr.kind==='exact_file' ? `<button class="btn btn-primary" onclick="A.resolveDuplicate('${dr.id}','reuse_file')">${T('Use existing file')}</button>` : ''}
      ${dr.kind==='new_resume_version' ? `<button class="btn btn-secondary" onclick="A.resolveDuplicate('${dr.id}','different_person')">${T('This is a different person')}</button>
        <button class="btn btn-secondary" onclick="A.resolveDuplicate('${dr.id}','defer')">${T('Defer')}</button>
        <button class="btn btn-primary" onclick="A.resolveDuplicate('${dr.id}','same_person_new_version')">${T('Save as new version')}</button>` : ''}
      ${dr.kind==='possible_same_person' ? `<button class="btn btn-secondary" onclick="A.resolveDuplicate('${dr.id}','defer')">${T('Request more info')}</button>
        <button class="btn btn-secondary" onclick="A.resolveDuplicate('${dr.id}','same_person_new_version')">${T('Same person — merge as new version')}</button>
        <button class="btn btn-primary" onclick="A.resolveDuplicate('${dr.id}','different_person')">${T('Different person — keep separate')}</button>` : ''}
    </div>
  </div>`;
}
A.retryDuplicateParse = function(id){
  toast(T('Retrying parse…'));
  setTimeout(()=> toast(T('Still unreadable — try a higher-quality scan or a text-based PDF.'), 'error'), 900);
};
A.resolveDuplicate = function(id, outcome){
  const dr = state.db.duplicateReviews[id];
  const labels = { reuse_file:'Reused existing file', different_person:'Kept as different person', same_person_new_version:'Saved as new version', defer:'Deferred' };
  dr.status = outcome==='defer' ? 'open' : 'resolved';
  dr.resolutionLabel = labels[outcome];
  dr.resolvedBy = state.currentUser; dr.resolvedAt = nowISO();

  if(outcome==='same_person_new_version'){
    const cid = dr.existing.candidateId;
    const versions = RESUME_VERSIONS[cid] || (RESUME_VERSIONS[cid]=[]);
    versions.forEach(v=>v.isLatest=false);
    versions.push({ id: uid('rv'), version: versions.length+1, fileName: dr.uploaded.fileName, uploadedAt: dr.uploaded.uploadedAt||nowISO(), source: dr.uploaded.source, parseStatus:'succeeded', isLatest:true, changeNote: dr.changeSummary });
    getApplicationsForCandidate(cid).forEach(app=>{ const ev = getEvaluation(app.id); if(ev) ev.freshness='stale'; });
    dr.resolutionNote = T('New resume version saved for {name}. Existing screening results are now marked stale until refreshed.').replace('{name}', getCandidate(cid).displayName);
    state.db.audit.unshift({ id:uid('aud'), at:nowISO(), actor:state.currentUser, action:'Saved new resume version', object:getCandidate(cid).displayName });
  } else if(outcome==='different_person'){
    dr.resolutionNote = T('Kept as a separate candidate. No records were merged.');
    state.db.audit.unshift({ id:uid('aud'), at:nowISO(), actor:state.currentUser, action:'Confirmed different person during duplicate review', object: dr.uploaded.name });
  } else if(outcome==='reuse_file'){
    dr.resolutionNote = T('File content reused from the existing record. This upload is kept in history as an additional source.');
  } else if(outcome==='defer'){
    dr.resolutionNote = T('Deferred — more information requested before resolving.');
    toast(T('Deferred — task remains open'), 'default');
    renderRoute();
    return;
  }
  // complete related task if any
  const relatedTask = state.db.tasks.find(t=> t.linkRoute===('#/duplicates/'+id));
  if(relatedTask){ relatedTask.status='completed'; relatedTask.completedAt=nowISO(); }
  toast(T('Duplicate review resolved'), 'success');
  renderRoute();
};

registerRoute('#/library', renderLibraryPage);
registerRoute('#/imports/new', renderImportPage);
registerRoute('#/duplicates/:id', renderDuplicateDetailPage);

</script>

        <td>${statusBadge}${job.status!=='open'?` <span class="badge badge-warning">${T('Role closed')}</span>`:''}</td>

        <td class="text-right"><a class="btn btn-sm btn-secondary" href="#/candidates/${c.id}/jobs">${T('Review', 'Review (action)')}</a></td>
      </tr>`;

  return `

    <button class="btn btn-secondary" onclick="A.runJobDiscovery('${c.id}')"><span class="material-icons-o">travel_explore</span>${T('Match again')}</button>

  `, [{label:T('Resume Library'),href:'#/library'},{label:c.displayName}])}

  <div class="two-col">
    <div class="col-list flex-col gap-16">
      <div class="card card-pad">
        <div class="flex items-center gap-12" style="margin-bottom:12px;">${candAvatar(c,'md')}<div><div style="font-weight:600;">${esc(c.displayName)}</div><div class="tiny">${T('Identity:')} ${T(cap(c.identityStatus))}</div></div></div>
        <table class="data-table">
          <tbody>
            <tr><td class="tiny">${T('Email')}</td><td>${esc(c.contact.email)}</td></tr>
            <tr><td class="tiny">${T('Phone')}</td><td>${esc(c.contact.phone||'—')}</td></tr>
            <tr><td class="tiny">${T('Location')}</td><td>${esc(c.contact.location.value)} ${c.contact.location.status==='unknown'?`<span class="badge badge-outline">${T('Unknown')}</span>`:''}</td></tr>
            <tr><td class="tiny">${T('Work authorization')}</td><td>${esc(c.workAuth.value)} ${c.workAuth.status==='unknown'?`<span class="badge badge-outline">${T('Unknown')}</span>`:''}</td></tr>
            <tr><td class="tiny">${T('Compensation expectation')}</td><td>${c.compensationExpectation ? fmtMoney(c.compensationExpectation) : `<span class="badge badge-outline">${T('Not provided')}</span>`}</td></tr>
          </tbody>
        </table>
        <div style="margin-top:10px;">${(c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join(' ')}</div>
      </div>
      ${c.missingFields && c.missingFields.length ? `<div class="card card-pad" style="border-color:var(--warning-border);background:var(--warning-bg);">
        <div class="flex items-center gap-8" style="color:var(--warning-text);font-weight:600;font-size:var(--fs-sm);"><span class="material-icons-o" style="font-size:18px;">info</span>${T('Missing information')}</div>
        <ul style="margin:8px 0 0;padding-left:18px;font-size:var(--fs-sm);">${c.missingFields.map(f=>`<li>${esc(f.replace(/_/g,' '))}</li>`).join('')}</ul>
        <p class="tiny" style="margin-top:6px;">${T('An empty field is not treated as a “no” — it stays unknown until confirmed.')}</p>
      </div>`:''}
      <div class="card card-pad">
        <div class="section-title">${T('Resume versions')}</div>
        ${versions.length ? versions.map(v=>`
          <div class="list-row" style="padding:8px 2px;">
            <span class="material-icons-o" style="font-size:18px;">description</span>
            <div style="flex:1;"><div style="font-size:var(--fs-sm);">${esc(v.fileName)} ${v.isLatest?'<span class=\"badge badge-success\">'+T('Latest')+'</span>':'<span class=\"badge badge-outline\">v'+v.version+'</span>'}</div>
            <div class="tiny">${esc(v.source)} · ${fmtDate(v.uploadedAt)}${v.changeNote?' · '+esc(v.changeNote):''}</div></div>
          </div>`).join('') : `<p class="tiny">${T('No resume file — structured entry only.')}</p>`}
      </div>
    </div>
    <div class="flex-col gap-16">
      <div class="card card-pad">
        <div class="section-title">${T('Job relationships')}</div>
        ${relationshipRows ? `<table class="data-table"><thead><tr><th>${T('Job')}</th><th>${T('Team')}</th><th>${T('Status')}</th><th>${T('When')}</th><th></th></tr></thead><tbody>${relationshipRows}</tbody></table>`
          : renderNoJobState(c, jd)}
      </div>
      <div class="card card-pad">
        <div class="section-title">${T('Employment history')}</div>
        ${(c.employment||[]).length ? c.employment.map(e=>`
          <div style="margin-bottom:14px;">
            <div style="font-weight:500;font-size:var(--fs-sm);">${esc(e.title)} ${e.company?'· '+esc(e.company):''}</div>
            <div class="tiny">${esc(e.start)} – ${esc(e.end)}</div>
            <ul style="margin:6px 0 0;padding-left:18px;font-size:var(--fs-sm);">${(e.achievements||[]).map(a=>`<li>${esc(a)}</li>`).join('')}</ul>
          </div>`).join('') : `<p class="tiny">${T('No employment history captured.')}</p>`}
        <div class="flex gap-8 flex-wrap" style="margin-top:8px;">
          <div><div class="tiny" style="margin-bottom:4px;">${T('Skills')}</div>${(c.skills||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join(' ')||`<span class="tiny muted">${T('None captured')}</span>`}</div>
        </div>
        ${(c.education||[]).length?`<div style="margin-top:10px;"><div class="tiny" style="margin-bottom:4px;">${T('Education')}</div>${c.education.map(e=>`<div style="font-size:var(--fs-sm);">${esc(e.statement)} <span class="tiny">(${esc(e.period||'')})</span></div>`).join('')}</div>`:''}
      </div>

}
function renderNoJobState(c, jd){
  if(jd.status==='running') return emptyState({icon:'travel_explore', title:T('Searching for matching roles…'), body:T('This usually takes a few seconds in the demo.')});
  if(jd.status==='no_open_jobs') return emptyState({icon:'work_off', title:T('No open roles right now'), body:T('There are currently no open, accessible jobs to match against.'), actions:`<button class="btn btn-primary" onclick="A.runJobDiscovery('${c.id}')">${T('Match again')}</button>`});
  if(jd.status==='failed') return emptyState({icon:'error_outline', title:T('Matching failed'), body:T('The last matching run didn’t complete. This is not the same as “no match” — retry when ready.'), actions:`<button class="btn btn-primary" onclick="A.runJobDiscovery('${c.id}')">${T('Retry')}</button>`});
  if(jd.status==='no_match') return emptyState({icon:'search_off', title:T('No matching roles right now'), body:`${esc(jd.reason||T('No open role in the current job set matches this profile yet.'))}<br><span class="tiny">${T('Current search scope:')} ${Object.values(state.db.jobs).filter(j=>j.status==='open').length} ${T('open roles')} · ${T('last checked')} ${relTime(jd.lastRunAt)}</span>`,
    actions:`<button class="btn btn-secondary" onclick="A.nav('#/jobs')">${T('Search roles')}</button><button class="btn btn-secondary" onclick="A.openCorrectProfile('${c.id}')">${T('Update profile')}</button><button class="btn btn-primary" onclick="A.runJobDiscovery('${c.id}')">${T('Match again')}</button>`});
  return emptyState({icon:'travel_explore', title:T('Not matched yet'), body:T('This candidate hasn’t been matched against open roles yet.'), actions:`<button class="btn btn-primary" onclick="A.runJobDiscovery('${c.id}')">${T('Run matching')}</button>`});
}

A.openCorrectProfile = function(cid){
  const c = getCandidate(cid);
  openModal(`
    <div class="modal-header"><h3 class="modal-title">${T('Correct profile')}</h3><button class="close-x" onclick="A.closeModal()"><span class="material-icons-o">close</span></button></div>
    <div class="modal-body">
      <p class="tiny" style="margin-bottom:12px;">${T('Corrections create a new profile snapshot and are logged with a reason. They don’t rewrite the original source material.')}</p>
      <div class="field"><label>${T('Location')}</label><input type="text" id="cp-loc" value="${esc(c.contact.location.value)}"></div>
      <div class="flex gap-16">
        <div class="field" style="flex:1;"><label>${T('Compensation expectation — min (USD/yr)')}</label><input type="text" id="cp-min" value="${c.compensationExpectation?c.compensationExpectation.min:''}" placeholder="e.g. 160000"></div>
        <div class="field" style="flex:1;"><label>${T('Compensation expectation — max (USD/yr)')}</label><input type="text" id="cp-max" value="${c.compensationExpectation?c.compensationExpectation.max:''}" placeholder="e.g. 190000"></div>
      </div>
      <div class="field"><label>${T('Reason for correction')}</label><input type="text" id="cp-reason" placeholder="e.g. Candidate confirmed by email"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="A.closeModal()">${T('Cancel')}</button><button class="btn btn-primary" onclick="A.saveCorrectProfile('${cid}')">${T('Save correction')}</button></div>`);
};
A.saveCorrectProfile = function(cid){
  const c = getCandidate(cid);
  const loc = document.getElementById('cp-loc').value.trim();
  const min = parseInt(document.getElementById('cp-min').value,10);
  const max = parseInt(document.getElementById('cp-max').value,10);
  const reason = document.getElementById('cp-reason').value.trim() || T('Manual correction');
  if(loc){ c.contact.location = { value: loc, status:'known' }; }
  if(!isNaN(min) && !isNaN(max)){
    c.compensationExpectation = { min, max, currency:'USD', period:'year', basis:'gross', status:'known' };
    c.missingFields = (c.missingFields||[]).filter(f=>f!=='compensation_expectation');
    getApplicationsForCandidate(cid).forEach(app=>{
      const cons = getConcerns(app.id).find(x=>x.type==='compensation');
      if(cons) cons.status='dismissed';
    });
  }
  getApplicationsForCandidate(cid).forEach(app=>{ const ev=getEvaluation(app.id); if(ev) ev.freshness='stale'; });
  state.db.audit.unshift({ id:uid('aud'), at:nowISO(), actor:state.currentUser, action:'Corrected profile ('+reason+')', object:c.displayName });
  closeModal(); toast(T('Profile corrected — affected screenings marked stale for refresh'), 'success');
  renderRoute();
};

/* ---------- Job Recommendations (pre-link) ---------- */
function renderJobRecommendationsPage(params){
  const c = getCandidate(params.id);
  if(!c) return emptyState({icon:'person_off', title:T('Candidate not found')});
  const recs = getRecsForCandidate(c.id);
  const jd = state.db.jobDiscovery[c.id] || {status:'not_started'};

  if(!recs.length){
    return `${pageHeader(T('Job recommendations'), esc(c.displayName), '', [{label:T('Resume Library'),href:'#/library'},{label:c.displayName,href:'#/candidates/'+c.id},{label:T('Job recommendations')}])}
    <div class="card">${renderNoJobState(c, jd)}</div>`;
  }

  const subtitle = state.lang==='zh'
    ? `为 <strong>${esc(c.displayName)}</strong> 提供的 AI 候选人 × 职位匹配建议。确认仅表示"纳入考虑范围"——不会自动推进流程或通知任何人。`
    : `AI-proposed candidate × job matches for <strong>${esc(c.displayName)}</strong>. Confirming only means “include in consideration” — it does not advance or notify anyone.`;
  return `
  ${pageHeader(T('Job recommendations'), subtitle, '', [{label:T('Resume Library'),href:'#/library'},{label:c.displayName,href:'#/candidates/'+c.id},{label:T('Job recommendations')}])}
  <div class="flex-col gap-16">
    ${recs.map(r=>renderRecommendationCard(c,r)).join('')}
  </div>`;
}
function renderRecommendationCard(c, r){
  const job = getJob(r.jobId);
  const app = state.db.applications.find(a=>a.candidateId===c.id && a.jobId===r.jobId);
  const roleClosed = job.status!=='open';
  let statusChip;
  if(r.status==='confirmed') statusChip = `<span class="badge badge-success">${T('Confirmed — linked to role')}</span>`;
  else if(r.status==='dismissed') statusChip = `<span class="badge badge-outline">${T('Dismissed')}</span>`;
  else if(r.status==='deferred') statusChip = `<span class="badge badge-neutral">${T('Deferred')}</span>`;
  else statusChip = `<span class="badge badge-info">${T('Pending confirmation')}</span>`;

  return `<div class="card card-pad">
    <div class="flex items-center justify-between flex-wrap gap-8">
      <div>
        <div style="font-weight:600;font-size:var(--fs-lg);">${esc(job.title)} <span class="tiny muted">${esc(job.team)} · ${esc(job.location)}</span></div>
        <div class="flex items-center gap-8" style="margin-top:4px;">${statusChip}${roleClosed?`<span class="badge badge-warning">${T('Role closed')}</span>`:''}${r.eligibility==='not_eligible'?`<span class="badge badge-danger">${T('Not eligible')}</span>`:''}<span class="tiny">${confidenceLabel(r)}${r.eligibility!=='not_eligible'&&r.confidence!=null?' · '+T('this role’s own scale, not comparable across jobs'):''}</span></div>
      </div>
      <div class="text-right"><div class="tiny">${T('Proposed')} ${relTime(r.createdAt)}</div></div>
    </div>
    <div class="divider"></div>
    <p style="font-size:var(--fs-sm);margin:0 0 8px;"><strong>${T('Why this match:')}</strong> ${esc(r.rationale)}</p>
    ${r.gaps && r.gaps.length ? `<div style="font-size:var(--fs-sm);"><strong>${T('Key gaps / unknowns:')}</strong><ul style="margin:4px 0 0;padding-left:18px;">${r.gaps.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div>` : ''}
    ${roleClosed && r.status==='proposed' ? `<div class="error-inline" style="margin-top:12px;"><span class="material-icons-o">block</span>${T('This role closed after the recommendation was generated. It can no longer be confirmed — dismiss it or check for a refreshed match.')}</div>`:''}
    <div class="page-header" style="margin-top:14px;margin-bottom:0;">
      <div></div>
      <div class="actions">
        ${r.status==='confirmed' ? `<a class="btn btn-primary" href="#/applications/${app?app.id:''}">${T('Open screening')}</a>` : ''}
        ${r.status==='proposed' ? `
          <button class="btn btn-secondary" onclick="A.chooseAnotherRole('${c.id}','${r.id}')">${T('Choose another role')}</button>
          <button class="btn btn-secondary" onclick="A.recommendationAction('${r.id}','defer')">${T('Defer')}</button>
          <button class="btn btn-secondary" onclick="A.recommendationAction('${r.id}','dismiss')">${T('Dismiss recommendation')}</button>
          <button class="btn btn-primary" ${roleClosed?'disabled':''} onclick="A.openConfirmLink('${c.id}','${r.id}')">${T('Confirm job link')}</button>` : ''}
        ${r.status==='deferred' ? `<button class="btn btn-secondary" onclick="A.recommendationAction('${r.id}','dismiss')">${T('Dismiss')}</button><button class="btn btn-primary" onclick="A.openConfirmLink('${c.id}','${r.id}')">${T('Confirm job link')}</button>`:''}
      </div>
    </div>
  </div>`;
}
A.recommendationAction = function(recId, action){
  const r = state.db.recommendations.find(x=>x.id===recId);
  if(action==='dismiss'){ r.status='dismissed'; toast(T('Recommendation dismissed — candidate stays in the library'), 'default'); }
  if(action==='defer'){ r.status='deferred'; toast(T('Deferred — task remains open'), 'default'); }
  const t = state.db.tasks.find(t=>t.candidateId===r.candidateId && t.jobId===r.jobId && t.type==='link_confirmation');
  if(t && action==='dismiss'){ t.status='completed'; t.completedAt=nowISO(); }
  renderRoute();
};
A.chooseAnotherRole = function(cid, recId){
  const openJobs = Object.values(state.db.jobs).filter(j=>j.status==='open' && !getRecsForCandidate(cid).some(r=>r.jobId===j.id && r.status!=='dismissed'));
  openModal(`
    <div class="modal-header"><h3 class="modal-title">${T('Choose another role')}</h3><button class="close-x" onclick="A.closeModal()"><span class="material-icons-o">close</span></button></div>
    <div class="modal-body">
      ${openJobs.length ? openJobs.map(j=>`<div class="radio-card" style="margin-bottom:8px;" onclick="A.addManualRecommendation('${cid}','${j.id}')"><div><div style="font-weight:500;">${esc(j.title)}</div><div class="tiny">${esc(j.team)} · ${esc(j.location)}</div></div></div>`).join('')
        : `<p class="tiny">${T('No other open roles available to propose right now.')}</p>`}
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="A.closeModal()">${T('Close')}</button></div>`);
};
A.addManualRecommendation = function(cid, jobId){
  const id = uid('rec');
  state.db.recommendations.push({ id, candidateId:cid, jobId, status:'proposed', createdAt: nowISO(), confidence:null, rationale:'Manually selected by '+getPerson(state.currentUser).name+'.', gaps:[], proposalSource:'manual' });
  closeModal(); toast(T('Added as a manual recommendation — pending confirmation'), 'success');
  navigate('#/candidates/'+cid+'/jobs');
};

A.openConfirmLink = function(cid, recId){
  const c = getCandidate(cid); const r = state.db.recommendations.find(x=>x.id===recId); const job = getJob(r.jobId);
  const existingApp = state.db.applications.find(a=>a.candidateId===cid && a.jobId===job.id);
  openModal(`
    <div class="modal-header"><h3 class="modal-title">${T('Confirm job link')}</h3><button class="close-x" onclick="A.closeModal()"><span class="material-icons-o">close</span></button></div>
    <div class="modal-body">
      <p class="tiny" style="margin-bottom:12px;">${T('This confirms {name} should be considered for {job}. It does not advance them, invite them to anything, or send a notification.').replace('{name}','<strong>'+esc(c.displayName)+'</strong>').replace('{job}','<strong>'+esc(job.title)+'</strong>')}</p>
      <table class="data-table">
        <tbody>
          <tr><td class="tiny">${T('Candidate')}</td><td>${esc(c.displayName)}</td></tr>
          <tr><td class="tiny">${T('Job')}</td><td>${esc(job.title)} — ${T('role criteria')} v${job.criteriaVersion} (${T('confirmed')})</td></tr>
          <tr><td class="tiny">${T('Already linked?')}</td><td>${existingApp? T('Yes — an existing Application will be reused, not duplicated.') : T('No — a new Application will be created.')}</td></tr>
          <tr><td class="tiny">${T('Confirmed by')}</td><td>${esc(getPerson(state.currentUser).name)}, ${fmtDateTime(nowISO())}</td></tr>
        </tbody>
      </table>
      <div class="field" style="margin-top:12px;"><label>${T('Reason (optional)')}</label><textarea id="link-reason" placeholder="${T('Why is this candidate a fit to screen for this role?')}"></textarea></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="A.closeModal()">${T('Cancel')}</button><button class="btn btn-primary" onclick="A.confirmJobLink('${cid}','${recId}')">${T('Confirm job link')}</button></div>`);
};
A.confirmJobLink = function(cid, recId){
  const r = state.db.recommendations.find(x=>x.id===recId);
  const job = getJob(r.jobId);
  const reason = (document.getElementById('link-reason')||{}).value || 'Confirmed via AI recommendation.';
  let app = state.db.applications.find(a=>a.candidateId===cid && a.jobId===job.id);
  if(!app){
    app = { id: uid('app'), candidateId:cid, jobId: job.id, cycleId:'cycle-1', status:'active', screeningStatus:'not_started', origin: r.proposalSource==='manual'?'sourced':'sourced', linkedAt: nowISO(), linkedBy: state.currentUser, linkReason: reason };
    state.db.applications.push(app);
    state.db.tasks.push({ id: uid('task'), type:'screening_review', title:`Review screening & choose next step: ${getCandidate(cid).displayName} — ${job.title}`,
      subjectLabel:'Linked — screening not yet started', module:'Screening', assignee: state.currentUser, priority:'normal', status:'open', createdAt: nowISO(),
      linkRoute:'#/applications/'+app.id, candidateId:cid, jobId: job.id });
    state.db.audit.unshift({ id:uid('aud'), at:nowISO(), actor:state.currentUser, action:'Confirmed job link', object:`${getCandidate(cid).displayName} → ${job.title}` });
  }
  r.status = 'confirmed'; r.applicationRef = app.id;
  const t = state.db.tasks.find(t=>t.candidateId===cid && t.jobId===job.id && t.type==='link_confirmation');
  if(t){ t.status='completed'; t.completedAt=nowISO(); }
  closeModal();
  toast(T('Linked to role — “Review screening & choose next step” added to My Tasks'), 'success');
  navigate('#/candidates/'+cid+'/jobs');
};

registerRoute('#/candidates/:id', renderCandidateProfilePage);
registerRoute('#/candidates/:id/jobs', renderJobRecommendationsPage);

</script>

<script>
/* ---- page_jobs.js ---- */
/* ===================================================================
   PAGES: Jobs list, Requirements & Rubric, Screening Workspace
   =================================================================== */

function jobCounts(jobId){
  const suggested = getRecsForJob(jobId).filter(r=>r.status==='proposed').length;
  const linked = getApplicationsForJob(jobId).length;
  return { suggested, linked };
}
/* Funnel per job (unit = people, not files):
   Resumes (library candidates in this job's direction, plus anyone already matched)
   -> Matched (AI-recommended and not dismissed, incl. already linked)
   -> Linked (confirmed by a person -> Application). Each stage is a subset of the previous one. */
function jobFunnel(jobId){
  const job = getJob(jobId);
  const recs = getRecsForJob(jobId);
  const linked = new Set(getApplicationsForJob(jobId).map(a=>a.candidateId));
  const matched = new Set([...linked, ...recs.filter(r=>r.status!=='dismissed').map(r=>r.candidateId)]);
  const pending = new Set(recs.filter(r=>r.status==='proposed').map(r=>r.candidateId).filter(id=>!linked.has(id)));
  const pool = new Set(matched);
  Object.values(state.db.candidates).forEach(c=>{ if(c.libraryStatus==='available' && candidateMatchesDirection(c, job)) pool.add(c.id); });
  const today = new Date(); today.setHours(0,0,0,0);
  const sources = {}; let newToday = 0;
  pool.forEach(id=>{
    const vs = RESUME_VERSIONS[id]||[];
    if(!vs.length) return;
    const latest = vs.find(v=>v.isLatest) || vs[vs.length-1];
    const src = String(latest.source||'Unknown').replace(/\s*\(.*\)$/,'');
    sources[src] = (sources[src]||0)+1;
    if(vs.some(v=>new Date(v.uploadedAt)>=today)) newToday++;
  });
  return { poolIds:[...pool], resumes:pool.size, matched:matched.size, linked:linked.size, pending:pending.size, today:newToday,
    sourceList:Object.entries(sources).sort((x,y)=>y[1]-x[1]) };
}
function sourceChipsHtml(list){
  if(!list.length) return '<span class="tiny muted">—</span>';
  return `<div class="source-chips">${list.map(([name,n])=>`<span class="source-chip" title="${esc(name)}">${esc(name.replace(/\s+(upload|watch|import)$/i,''))} <b>${n}</b></span>`).join('')}</div>`;
}
function jobStatusBadge(status){
  if(status==='open') return `<span class="badge badge-success">${T('Open', 'Open (job status)')}</span>`;
  if(status==='closed') return `<span class="badge badge-outline">${T('Closed')}</span>`;
  return `<span class="badge badge-warning">${T('Paused')}</span>`;
}

function screeningWorkspaceToolbar(activeView, leftHtml, jobId){
  const isList = activeView === 'list';
  return `<div class="screening-toolbar${leftHtml?' ws-head':''}">
    ${leftHtml || `<h1 class="screening-toolbar-title${isList?' jobs-list-title':''}">${isList?T('Jobs'):T('Screening workspace')}</h1>`}
    <div class="screening-toolbar-actions">
      ${isList?`<button class="btn btn-primary" onclick="A.openCreateJob()"><span class="material-icons-o">add</span>${T('New job')}</button>`:''}
    </div>
  </div>`;
}

function renderJobsListPage(){
  const jobs = Object.values(state.db.jobs);

/* ---------- Requirements & Rubric ---------- */
/* Compensation rows share the requirements table format (same columns), shown under the basic requirements. */
/* Sensitive / internal rows (compensation range, internal hiring note) are ordinary requirement rows:
   same priority / hard-constraint / scored-dimension controls, shown with tags. Missing rows are virtual until first edited. */
const SENS_NOTE_DEFAULT = 'Prioritize candidates with payments or checkout infrastructure experience.';
function critCompDim(j){ return ((j.dimensions||[]).find(d=>/compensation/i.test(d.name))||{}).id || ''; }
/* The three sensitive rows read from the shared condition model: compensation range <-> salary condition, internal note <-> internal custom condition. */
function sensRow(j, sens){
  const P = cpEnsureModel(j), compDim = critCompDim(j);
  if(sens==='comp'){ const it=P.basic.salary; return it.on ? { sens, priority:it.priority, dimension:it.dim||compDim, label:'Compensation range' } : { sens, priority:'preferred', dimension:compDim, label:'Compensation range', virtual:true }; }
  if(sens==='note'){ const c=P.custom.find(x=>x.sens==='note'); return c ? { sens, priority:c.priority, dimension:c.dim||'', label:c.text } : { sens, priority:'preferred', dimension:'', label:SENS_NOTE_DEFAULT, virtual:true }; }
}
let CRIT_SEL = null;
/* The row that was just added gets a "selected" look and keyboard focus until the user moves away. */
function critApplySel(){
  if(!CRIT_SEL) return; const key = CRIT_SEL; CRIT_SEL = null;
  const tr = document.querySelector('[data-crit="'+key+'"]'); if(!tr) return;
  tr.classList.add('crit-sel');
  try{ tr.scrollIntoView({ block:'center', behavior:'smooth' }); }catch(e){}
  const f = tr.querySelector('input[type="text"],input[type="number"],select'); if(f){ try{ f.focus({ preventScroll:true }); }catch(e){ f.focus(); } }
  tr.addEventListener('focusout', e=>{ if(!e.relatedTarget || !tr.contains(e.relatedTarget)) tr.classList.remove('crit-sel'); });
}
function critCompile(j){ cpCompile(j); j.criteriaTouched = true; renderRoute(); setTimeout(critApplySel,0); }
function critSync(j){
  if(!j.panel || j.panelSig!==cpSig(j)){ cpEnsureModel(j); cpCompile(j); }
  /* Demo jobs ship with the internal hiring note: make it a real condition (not just a placeholder row) so it is counted and checked like the others. */
  if(!j.sensInit){
    j.sensInit = true;
    const P = cpEnsureModel(j);
    if(j.compRange && !(j.sensHidden && j.sensHidden.note) && !P.custom.some(c=>c.sens==='note')){
      P.custom.push({ id:uid('cc'), text:SENS_NOTE_DEFAULT, sens:'note', priority:'preferred', evalType:'scored', cat:'context', dim:'', weight:1, evidence:'', on:true, origin:'user', reviewed:true, by:j.recruiter||'emma', at:j.confirmedAt||nowISO(), rule:cpParseCustom(SENS_NOTE_DEFAULT) });
      cpCompile(j);
    }
  }
}
function renderSensRow(j, r, editable){
  const sens = r.sens, tags = sens==='note' ? `<span class="badge badge-neutral">${cpL('Internal','内部')}</span>` : `<span class="badge badge-warning">${T('Sensitive')}</span>`;
  const c = j.compRange || { min:null, max:null, currency:'USD', period:'year', basis:'gross' };
  const sel = (field, opts, cur)=>`<select onchange="A.updateCompRange('${j.id}','${field}',this.value)">${opts.map(([v,l])=>`<option value="${v}" ${v===cur?'selected':''}>${l}</option>`).join('')}</select>`;
  const num = (field, v)=>`<input type="number" min="0" value="${v==null?'':v}" placeholder="${field}" style="width:96px;" onchange="A.updateCompRange('${j.id}','${field}',this.value)">`;
  let label, ctrl='', sub='';
  if(sens==='comp'){
    label = editable ? T('Compensation range') : `${T('Compensation range')}: ${j.compRange?fmtMoney(j.compRange):T('Not set')}`;
    ctrl = editable ? `${num('min',c.min)}<span>–</span>${num('max',c.max)}${sel('currency',[['USD','USD'],['SGD','SGD'],['CNY','CNY'],['VND','VND']],c.currency)}${sel('period',[['year',cpL('Per year','每年')],['month',cpL('Per month','每月')]],c.period)}${sel('basis',[['gross',cpL('Gross','税前')],['net',cpL('Net','税后')]],c.basis)}` : '';
  } else {
    /* the note reads like any other business requirement: just its text, with the tags */
    label = editable ? `<input type="text" class="crit-grow" value="${esc(TD(r.label))}" aria-label="${T('Internal hiring note')}" onchange="A.updateSens('${j.id}','note','label',this.value)">` : esc(TD(r.label));
    sub = T('Do not screen candidates based on gender or other protected characteristics.');
  }
  const cell = `<td><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">${sens==='note'&&editable?label:`<span${editable?' style="font-weight:500;"':''}>${label}</span>`}${tags}</div>${ctrl?`<div class="crit-ctrls">${ctrl}</div>`:''}${sub?`<div class="tiny muted" style="margin-top:4px;">${sub}</div>`:''}</td>`;
  const dimOptions = (j.dimensions||[]).map(d=>`<option value="${d.id}" ${d.id===r.dimension?'selected':''}>${esc(TD(d.name))}</option>`).join('');
  const dimName = ((j.dimensions||[]).find(d=>d.id===r.dimension)||{}).name;
  if(editable) return `<tr>${cell}
    <td><select onchange="A.updateSens('${j.id}','${sens}','priority',this.value)"><option value="must_have" ${r.priority==='must_have'?'selected':''}>${T('Must-have')}</option><option value="preferred" ${r.priority!=='must_have'?'selected':''}>${cpL('Preferred','优先项')}</option></select></td>
    <td><select onchange="A.updateSens('${j.id}','${sens}','dimension',this.value)">${r.dimension?'':'<option value="" selected>—</option>'}${dimOptions}</select></td>
    <td class="text-right"><button class="btn-icon" aria-label="${T('Delete')}" onclick="A.deleteSens('${j.id}','${sens}')"><span class="material-icons-o" style="font-size:16px;">delete</span></button></td></tr>`;
  return `<tr>${cell}<td>${r.priority==='must_have'?`<span class="badge badge-warning">${T('Must-have')}</span>`:`<span class="badge badge-outline">${cpL('Preferred','优先项')}</span>`}</td><td class="tiny">${esc(TD(dimName||'—'))}</td></tr>`;
}
const SENS_LABEL = { comp:['Compensation range','薪酬范围'], note:['Internal hiring note','内部招聘备注'] };
function sensHidden(j, s){ return !!(j.sensHidden && j.sensHidden[s]) && !(s==='comp' && j.compRange); }
function renderCompensationRows(j, editable, group){
  const list = group==='basic' ? ['comp'] : group==='job' ? ['note'] : [];
  const shown = list.filter(s=>!sensHidden(j,s)), hidden = list.filter(s=>sensHidden(j,s));
  const restore = editable && hidden.length ? `<tr><td colspan="4"><span class="tiny muted">${cpL('Add back','恢复')}:</span> ${hidden.map(s=>`<button type="button" class="cp-link" style="margin-left:8px;" onclick="A.restoreSens('${j.id}','${s}')">＋ ${cpL(SENS_LABEL[s][0],SENS_LABEL[s][1])}</button>`).join('')}</td></tr>` : '';
  return shown.map(s=>renderSensRow(j, sensRow(j,s), editable)).join('') + restore;
}
A.deleteSens = function(jobId, sens){
  const j = getJob(jobId);
  const doDelete = ()=>{
    const P = cpEnsureModel(j);
    if(sens==='comp'){ P.basic.salary.on = false; j.compRange = null; }
    else P.custom = P.custom.filter(x=>x.sens!=='note');
    j.sensHidden = Object.assign({}, j.sensHidden, { [sens]:true });
    critCompile(j);
  };
  if(sens==='note') { doDelete(); return; }
  confirmModal({ title: cpL('Delete compensation range?','删除薪酬范围？'),
    body: cpL('The value is cleared. You can add the row back and enter it again.','该数值会被清空，之后可以重新添加这一行再填写。'),
    confirmLabel: T('Delete'), danger:true, onConfirm: doDelete });
};
A.restoreSens = function(jobId, sens){
  const j = getJob(jobId); j.sensHidden = Object.assign({}, j.sensHidden, { [sens]:false });
  if(sens==='note') A.updateSens(jobId,'note','priority','preferred'); else renderRoute();
};
A.updateSens = function(jobId, sens, field, value){
  const j = getJob(jobId), P = cpEnsureModel(j);
  const apply = (it)=>{ if(field==='priority'){ it.priority=value; it.evalType=cpEv(value); } else if(field==='dimension') it.dim=value; };
  if(sens==='comp'){
    const it = P.basic.salary;
    if(!it.on){ it.on = true; it.sens = 'comp'; it.origin = 'user'; it.reviewed = true; const c=j.compRange; if(c && c.max!=null) Object.assign(it,{ max:c.max, currency:c.currency, period:c.period, basis:c.basis }); }
    apply(it);
  } else if(sens==='note'){
    let c = P.custom.find(x=>x.sens==='note');
    if(!c){ c = { id:uid('cc'), text:SENS_NOTE_DEFAULT, sens:'note', priority:'preferred', evalType:'scored', cat:'context', dim:'', weight:1, evidence:'', on:true, origin:'user', reviewed:true, by:state.currentUser, at:nowISO(), rule:cpParseCustom(SENS_NOTE_DEFAULT) }; P.custom.push(c); }
    if(field==='label'){ c.text = value; c.rule = cpParseCustom(value); } else apply(c);
  }
  critCompile(j);
};
A.updateCompRange = function(jobId, field, value){
  const j = getJob(jobId); const c = Object.assign({ min:null, max:null, currency:'USD', period:'year', basis:'gross' }, j.compRange||{});
  c[field] = (field==='min'||field==='max') ? (value===''?null:Number(value)) : value;
  j.compRange = (c.min==null && c.max==null) ? null : c; j.criteriaTouched = true; renderRoute();
};

      ${editable?(g==='basic'?critAddSelect(j):`<button class="btn btn-sm btn-secondary" onclick="A.addRequirement('${j.id}','${g}')"><span class="material-icons-o" style="font-size:14px;">add</span>${T('Add requirement')}</button>`):''}</div>
    ${renderRequirementsBlock(j, editable, g)}
  </div>${g==='job'?renderCustomModule(j, editable):''}`).join('')}

  <div class="card card-pad">
    <div class="flex items-center justify-between"><div class="section-title" style="margin:0;">${T('Scoring dimensions')}</div><span class="tiny ${weightOk?'muted':'error-inline'}" style="${weightOk?'':'display:inline-flex;padding:2px 8px;'}">${T('Weights total')} ${Math.round(weightSum*100)}%</span></div>
    ${renderDimensionsBlock(j, editable)}
    ${!countOk ? `<p class="tiny error-inline" style="margin-top:8px;">${T('A role needs between 3 and 8 scoring dimensions.')}</p>` : ''}
    <div class="divider"></div>
    ${renderScoringMethodologyNote()}

  </div>`;

/* Prototype: simulate dictation (no microphone, works in any browser). Set to false to use the browser's real speech recognition. */
const CRIT_VOICE_SIMULATED = true;
const CRIT_VOICE_SAMPLES = {
  zh:['有支付或结算系统的开发经验，熟悉高并发交易场景','做过跨境支付或对账系统，了解资金安全和风控','有搭建计费平台的经验，能独立负责核心链路'],
  en:['Has experience building payments or settlement systems and handling high-volume transactions','Has worked on cross-border payments or reconciliation, with a good grasp of fund safety and risk control','Has built a billing platform and can own the core transaction flow']
};
let critVoiceSampleIdx = 0;
function critVoiceSimulate(){
  const ta0 = document.getElementById('crit-new-text'); if(!ta0) return;
  const zh = state.lang==='zh', samples = CRIT_VOICE_SAMPLES[zh?'zh':'en'], text = samples[critVoiceSampleIdx++ % samples.length];
  const base = ta0.value, sep = base && !/\s$/.test(base) ? (zh?'':' ') : '';
  const units = zh ? text.match(/[\s\S]{1,2}/g) : text.split(/(?<=\s)/);   // 2 characters / one word at a time
  let i = 0, timer = null;
  const stop = ()=>{ clearTimeout(timer); CRIT_REC = null; critVoiceUI(); };
  CRIT_REC = { stop };
  critVoiceUI();
  const tick = ()=>{
    const ta = document.getElementById('crit-new-text');
    if(!ta || !CRIT_REC){ stop(); return; }
    i++; ta.value = base + sep + units.slice(0,i).join(''); CRIT_NEW.text = ta.value; ta.scrollTop = ta.scrollHeight;
    if(i>=units.length){ timer = setTimeout(stop, 500); return; }
    timer = setTimeout(tick, zh ? 110 : 160);
  };
  timer = setTimeout(tick, 900);   // "listening…" for a moment, then the words appear
}
A.critVoiceToggle = function(){
  if(CRIT_VOICE_SIMULATED){ if(CRIT_REC){ critVoiceStop(); return; } critVoiceSimulate(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast(cpL('Voice input isn’t supported in this browser — try Chrome or Edge, or type instead.','当前浏览器不支持语音输入，请使用 Chrome 或 Edge，或直接输入。'),'error'); return; }
  if(CRIT_REC){ critVoiceStop(); return; }
  const ta0 = document.getElementById('crit-new-text'); if(!ta0) return;
  const base = ta0.value; let finalText = '';
  const rec = new SR(); rec.lang = state.lang==='zh' ? 'zh-CN' : 'en-US'; rec.interimResults = true; rec.continuous = true;
  rec.onresult = e=>{
    let interim = '';
    for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; }
    const ta = document.getElementById('crit-new-text'); if(!ta) return;
    const sep = base && !/\s$/.test(base) ? ' ' : '';
    ta.value = base + sep + finalText + interim; CRIT_NEW.text = ta.value;
  };
  rec.onerror = e=>{
    const msg = e.error==='not-allowed' || e.error==='service-not-allowed' ? cpL('Microphone access was blocked. Allow it in the browser and try again.','麦克风权限被阻止，请在浏览器中允许后重试。')
      : e.error==='no-speech' ? cpL('No speech detected.','没有听到声音。') : cpL('Voice input stopped unexpectedly.','语音输入意外中断。');
    toast(msg,'error');
  };
  rec.onend = ()=>{ CRIT_REC = null; critVoiceUI(); };
  try{ rec.start(); CRIT_REC = rec; critVoiceUI(); }catch(e){ CRIT_REC = null; critVoiceUI(); }
};

function critSummary(key, it){

function critFind(P, reqId){
  for(const g of ['core','important','bonus']){ const i=P.skills[g].findIndex(s=>(s.rid||'req-'+s.id)===reqId); if(i>-1) return { type:'skill', g, i, it:P.skills[g][i] }; }
  const ci = P.custom.findIndex(c=>(c.rid||'req-'+c.id)===reqId); if(ci>-1) return { type:'custom', i:ci, it:P.custom[ci] };
  return null;
}
A.addRequirement = function(jobId, group){
  const j = getJob(jobId), P = cpEnsureModel(j);
  const item = cpSkill('core',{ free:true, name:'', label:'', cat:'skill', origin:'user', reviewed:true });
  P.skills.core.push(item); CRIT_SEL = 'req-'+item.id;
  critCompile(j);
};
A.removeRequirement = function(jobId, reqId){
  const j = getJob(jobId), P = cpEnsureModel(j), f = critFind(P,reqId);
  if(f){ if(f.type==='skill') P.skills[f.g].splice(f.i,1); else P.custom.splice(f.i,1); }
  else j.requirements = (j.requirements||[]).filter(r=>r.id!==reqId);
  critCompile(j);
};
A.updateRequirement = function(jobId, reqId, field, value){
  const j = getJob(jobId), P = cpEnsureModel(j), f = critFind(P,reqId);
  if(!f) return;
  const it = f.it;
  if(field==='label'){ if(f.type==='custom'){ it.text = value; it.rule = cpParseCustom(value); } else { it.label = value; if(it.free) it.name = value; } }
  else if(field==='priority'){
    it.priority = value; it.evalType = cpEv(value);
    if(f.type==='skill'){ const g = value==='preferred' ? 'bonus' : 'core'; if(g!==f.g){ P.skills[f.g].splice(f.i,1); P.skills[g].push(it); } }
  }
  else if(field==='dimension') it.dim = value;
  critCompile(j);
};
A.critBasic = function(jobId, key, prop, val, kind){
  const j = getJob(jobId), P = cpEnsureModel(j), it = P.basic[key];
  let v = val;
  if(kind==='num') v = val===''?'':Number(val); else if(kind==='bool') v = !!val; else if(kind==='csv') v = String(val).split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  if(key==='location' && prop==='country') it.regions = [];
  if(prop.indexOf('modes.')===0) it.modes[prop.slice(6)] = v;
  else if(prop==='region') it.regions = v.map(n=>({ name:n, radius:'0mi' }));
  else it[prop] = v;
  if(prop==='priority') it.evalType = cpEv(v);
  if(!['priority','dim','on'].includes(prop)) delete it.srcLabel;
  it.reviewed = true;
  critCompile(j);
};
A.critCity = function(jobId, op, val){
  const j = getJob(jobId), it = cpEnsureModel(j).basic.location;
  if(op==='add'){ if(!val) return; if(!it.regions.some(r=>r.name===val)) it.regions.push({ name:val, radius:'0mi' }); } else it.regions.splice(val,1);
  delete it.srcLabel; it.reviewed = true; critCompile(j);
};
A.critLang = function(jobId, op, i, prop, val){
  const j = getJob(jobId), it = cpEnsureModel(j).basic.language;
  if(op==='add') it.rows.push({ lang:'English', level:'Professional' }); else if(op==='del') it.rows.splice(i,1); else it.rows[i][prop] = val;
  delete it.srcLabel; it.reviewed = true; critCompile(j);
};
A.critAddBasic = function(jobId, key){
  if(!key) return;
  const j = getJob(jobId), it = cpEnsureModel(j).basic[key];
  it.on = true; it.origin = 'user'; it.reviewed = true; CRIT_SEL = 'basic-'+key;
  critCompile(j);
};
A.addDimension = function(jobId, name){
  const j = getJob(jobId);
  if(!name || DIMENSION_POOL.indexOf(name)===-1) return;
  if(j.dimensions.length>=8){ toast(T('A role can have at most 8 scoring dimensions'), 'error'); return; }
  if(j.dimensions.some(d=>d.name===name)){ toast(T('This dimension is already added'), 'error'); return; }

A.removeDimension = function(jobId, dimId){
  const j = getJob(jobId);
  if(j.dimensions.length<=3){ toast(T('A role needs at least 3 scoring dimensions'), 'error'); return; }

A.updateDimensionWeight = function(jobId, dimId, pctValue){
  const j = getJob(jobId);
  const d = j.dimensions.find(x=>x.id===dimId);
  if(!d) return;
  const v = parseFloat(pctValue);

  renderRoute();
};
A.updateDimensionRubric = function(jobId, dimId, text){
  const j = getJob(jobId);

A.distributeWeightsEvenly = function(jobId){
  const j = getJob(jobId);
  const n = j.dimensions.length;
  if(!n) return;
  const even = Math.floor((1/n)*1000)/1000;
  j.dimensions.forEach((d,i)=>{ d.weight = i===n-1 ? round2(1-even*(n-1)) : even; });
  j.criteriaTouched = true;
  toast(T('Weights distributed evenly'), 'default');

};

A.confirmCriteria = function(jobId){
  const j = getJob(jobId);
  const weightSum = (j.dimensions||[]).reduce((s,d)=>s+d.weight,0);
  if(Math.abs(weightSum-1)>0.001){ toast(T('Weights must total 100% before confirming'), 'error'); return; }
  if(j.dimensions.length<3 || j.dimensions.length>8){ toast(T('Choose between 3 and 8 scoring dimensions'), 'error'); return; }
  if((j.requirements||[]).some(r=>!r.label || !r.label.trim())){ toast(T('Every requirement needs a label before confirming'), 'error'); return; }
  const wasFirstConfirm = !j.criteriaVersion || j.criteriaVersion===0;
  const doConfirm = function(){
    confirmModal({ title:T('Confirm this requirements version'), body:T('Confirming locks these requirements and weights as the active scoring baseline for this job. Screening can only run against a confirmed version.'),
      confirmLabel:T('Confirm version'), onConfirm: ()=>{
        j.criteriaStatus='confirmed'; j.criteriaVersion=(j.criteriaVersion||0)+1; j.confirmedBy=state.currentUser; j.confirmedAt=nowISO(); j.panelSnapshot = j.panel ? JSON.parse(JSON.stringify(j.panel)) : null; if(!wasFirstConfirm) getApplicationsForJob(jobId).forEach(a=>{ const ev=getEvaluation(a.id); if(ev) ev.freshness='stale'; });
        toast(T('Requirements confirmed'), 'success'); renderRoute();
        if(wasFirstConfirm) setTimeout(()=>A.runJobAutoMatch(jobId), 400);
      }});
  };
  if(wasFirstConfirm && !j.criteriaTouched){
    confirmModal({ title:T('Scoring dimensions are still the default starting point'), body:T('These dimensions and weights have not been adjusted for this role yet — they’re the system’s neutral default, not a reviewed rubric. Confirm anyway?'),
      confirmLabel:T('Confirm anyway'), danger:true, onConfirm: doConfirm });
  } else {
    doConfirm();
  }
};
/* ---------- New-job → resume-library auto match (direction pre-filter + reuse of 5.2/5.3 engine) ---------- */
A.runJobAutoMatch = function(jobId){
  const job = getJob(jobId);
  if(!job) return;
  const libraryCandidates = Object.values(state.db.candidates).filter(c=>c.libraryStatus==='available');
  const directionPool = libraryCandidates.filter(c=>candidateMatchesDirection(c, job));
  let created = 0;
  directionPool.forEach(c=>{
    const existingRec = state.db.recommendations.find(r=>r.candidateId===c.id && r.jobId===jobId && r.status!=='dismissed');
    const existingApp = state.db.applications.find(a=>a.candidateId===c.id && a.jobId===jobId);
    if(existingRec || existingApp) return;

    const rng = seededRandom(c.id+'|'+jobId);
    const hasProfile = (c.employment && c.employment.length) || (c.skills && c.skills.length);
    const dims = (job.dimensions||[]).map(d=>{
      const evaluated = rng() < (hasProfile ? 0.85 : 0.4);
      return { id:d.id, name:d.name, weight:d.weight, status: evaluated?'evaluated':'unknown', score: evaluated ? Math.round(35+rng()*57) : null };
    });
    const agg = computeAggregate(dims); // reuses the same 5.3 engine as post-link screening (Patch 1)
    if(agg.coverage < 0.30) return; // Patch 2: below the display threshold — not worth surfacing

    const eligibility = quickEligibilityCheck(c, job);
    const rec = { id: uid('rec'), candidateId:c.id, jobId, status:'proposed', createdAt: nowISO(),
      confidence: eligibility==='not_eligible' ? null : agg.overall!=null ? round2(agg.overall/100) : null,
      eligibility, coverage: agg.coverage,
      rationale: T('Generated from available resume and profile content for this demo run.'),
      gaps: eligibility==='needs_verification' ? [T('Location not confirmed')] : [],
      proposalSource:'auto_direction_match' };
    state.db.recommendations.push(rec);
    state.db.tasks.push({ id: uid('task'), type:'link_confirmation', title:`${T('Confirm job link:')} ${c.displayName} → ${job.title}`,
      subjectLabel: T('AI recommendation, direction-matched'), module:'Resume Library',
      assignee: c.owner || state.currentUser, priority:'normal', status:'open', createdAt: nowISO(),
      linkRoute:'#/candidates/'+c.id+'/jobs', candidateId:c.id, jobId });
    const jd = state.db.jobDiscovery[c.id] || (state.db.jobDiscovery[c.id] = {status:'not_started'});
    jd.status = 'recommendations_ready'; jd.lastRunAt = nowISO();
    c.lastMatchedAt = nowISO();
    created++;
  });
  state.db.activity.unshift({ id:uid('act'), op:'Job matching', actor:'System (auto)', target:`${job.title} — ${created} ${T('candidates matched')}`, status:'succeeded', at: nowISO() });
  if(directionPool.length===0){
    toast(T('No candidates in the resume library match this job’s direction yet — try Team/title wording, or search the library directly.'), 'default');
  } else {
    toast(`${created} / ${directionPool.length} ${T('candidates in this direction matched')} (${T('of')} ${libraryCandidates.length} ${T('in library')})`, 'success');
  }
  renderRoute();
};
