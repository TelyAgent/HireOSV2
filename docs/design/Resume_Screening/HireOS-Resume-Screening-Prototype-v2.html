  const dimFor = kind => (kind==='skill' ? find(/skill|technical/i) : kind==='experience' ? find(/experience/i) : ['location','compensation'].includes(kind) ? find(/compensation|location/i) : null) || dims[0];
  const CAT = { experience:'experience', skill:'skill', location:'work_arrangement', education:'education', compensation:'compensation', language:'skill', certification:'certification', exclude_title:'experience', custom:'skill', other:'context' };
  const reqs = [];
  const push = (id,kind,label,it,group)=>{
    const dimOk = it.dim && dims.some(x=>x.id===it.dim), fb = dimFor(kind);
    const r = { id:it.rid||id, label, kind, category:it.cat||CAT[kind]||'context', priority:it.priority, evaluationType:cpEv(it.priority), hard:cpSt(it)==='hard',
      dimension: dimOk ? it.dim : '', criterionWeight:it.weight, evidenceStandard:it.evidence||'', dataStatus:it.dataStatus||'known',
      origin:it.origin||'user', reviewed:!!it.reviewed };
    if(it.reqId) r.jdRequirementId = it.reqId;
    if(it.sens) r.sens = it.sens;
    if(group) r.panelGroup = group;
    reqs.push(r);
  };
  CP_FIELDS.forEach(f=>{ const it=P.basic[f.key]; if(it.on) push('req-'+f.key, f.kind, cpLabel(f.key,it,'en'), it); });
  ['core','important','bonus'].forEach(g=>P.skills[g].forEach(s=>push('req-'+s.id, s.free?'other':'skill', s.label||s.name, s, g==='important'?'core':g)));
  P.custom.filter(c=>c.on).forEach(c=>push('req-'+c.id,'custom',c.text,c));
  job.requirements = reqs;
  job.panelSig = cpSig(job);
}
function cpSig(job){ return JSON.stringify((job.requirements||[]).map(r=>[r.id,r.label,r.priority,r.hard,r.kind,r.panelGroup||''])); }
function cpEnsureModel(job){
  if(!job.panel || job.panelSig!==cpSig(job)){ job.panel = cpFromRequirements(job); job.panelSig = cpSig(job); }
  return job.panel;
}
function cpCriteria(P){

  ['core','important','bonus'].forEach(g=>P.skills[g].forEach(s=>out.push({key:s.id,tab:'skills',label:TD(s.label||s.name),strength:cpSt(s),priority:s.priority})));

function cpUnreviewed(P,tab){

/* ---------- evaluation (simulated, from library profile data) ---------- */
function cpText(c){
  return [(c.skills||[]).join(' '), (c.employment||[]).map(e=>[e.title,e.company,(e.achievements||[]).join(' ')].join(' ')).join(' '), (c.education||[]).map(e=>e.statement).join(' '), (c.tags||[]).join(' ')].join(' ').toLowerCase();
}
function cpYearsOf(c){
  const es=(c.employment||[]).filter(e=>e.start); if(!es.length) return null;
  let ms=0; es.forEach(e=>{ const s=new Date(e.start+'-01'), en=(!e.end||/present/i.test(e.end))?new Date():new Date(e.end+'-01'); if(!isNaN(s)&&!isNaN(en)) ms+=Math.max(0,en-s); });
  return ms/31557600000;
}
function cpWorst(list){
  if(list.some(x=>x==='not_met')) return 'not_met';

  if(list.some(x=>x==='partial')) return 'partial';
  return 'met';
}
function cpEvalField(key, it, c, job){

    if(it.identity==='fresh') rs.push(y<1?'met':'not_met'); if(it.identity==='exp') rs.push(y>=1?'met':'not_met');

  }

    const val=String(loc.value).toLowerCase(), toks=CP_COUNTRY_TOKENS[it.country]||[String(it.country||'').toLowerCase()];
    const inCountry = !it.country || toks.some(t=>new RegExp('(^|[^a-z])'+t+'([^a-z]|$)').test(val));
    if(!inCountry) return {s:'not_met',n:loc.value};
    const cities=(it.regions||[]).map(r=>String(r.name||'').toLowerCase()).filter(Boolean);
    if(!cities.length || cities.some(cn=>val.includes(cn))) return {s:'met',n:loc.value};
    return {s:it.modes&&it.modes.remote?'partial':'not_met',n:loc.value};
  }

    const eds=(c.education||[]).map(e=>e.statement||''); if(!eds.length) return {s:'unknown',n:cpL('Not provided','未提供')};
    const lv = eds.some(e=>/ph\.?d|doctor|博士/i.test(e))?3:eds.some(e=>/m\.?s\.?|m\.?a\.?|master|mba|硕士/i.test(e))?2:eds.some(e=>/b\.?s\.?|b\.?a\.?|bachelor|本科/i.test(e))?1:0;
    const need={any:0,bachelor:1,master:2,phd:3}[it.level]; const rs=[lv>=need?'met':'not_met'];
    if((it.majors||[]).length && !it.majors.some(m=>eds.join(' ').toLowerCase().includes(String(m).toLowerCase()))) rs.push('partial');
    return {s:cpWorst(rs), n:eds[0]};

    const RATE={USD:1,SGD:0.74,CNY:0.14,VND:0.00004};
    const annual=(v,cur,per,basis)=> v*(RATE[cur]||1)*(per==='month'?12:1)*(basis==='net'?1.25:1);
    const lo = it.min!=='' ? annual(+it.min,it.currency,it.period,it.basis) : null, hi = it.max!=='' ? annual(+it.max,it.currency,it.period,it.basis) : null;
    const cmin = annual(ce.min,ce.currency,ce.period,ce.basis), cmax = annual(ce.max,ce.currency,ce.period,ce.basis);
    const sym=ce.currency==='USD'?'$':ce.currency+' ', note = ce.min===ce.max ? sym+ce.min.toLocaleString('en-US') : `${sym}${ce.min.toLocaleString('en-US')}–${ce.max.toLocaleString('en-US')}`;

function cpEvalTerms(c, terms, soft){

function cpEvaluate(job, P){

  const out = {};
  const add = (key, fn)=>{
    const rows = pool.map(c=>{ const r=fn(c); return {cand:c,status:r.s,note:r.n}; });
    out[key] = { rows, hit:rows.filter(x=>x.status==='met'||x.status==='partial').length, unknown:rows.filter(x=>x.status==='unknown').length, not:rows.filter(x=>x.status==='not_met').length };
  };
  CP_FIELDS.forEach(f=>{ const it=P.basic[f.key]; if(it.on) add(f.key, c=>cpEvalField(f.key,it,c,job)); });
  ['core','important','bonus'].forEach(g=>P.skills[g].forEach(s=>{
    if(s.free){ const kws = cpParseCustom(s.name).keywords; add(s.id, c=>kws.length?cpEvalTerms(c,kws,true):{s:'unknown',n:'—'}); return; }
    const terms = String(s.name).split('|').flatMap(x=>[x.trim(),...(s.aliases||[])]).map(x=>String(x).toLowerCase().trim()).filter(Boolean);
    add(s.id, c=>cpEvalTerms(c, terms));
  }));
  P.custom.filter(c=>c.on).forEach(cc=>{ const kws=(cc.rule&&cc.rule.keywords)||cpParseCustom(cc.text).keywords; add(cc.id, c=>kws.length?cpEvalTerms(c,kws,true):{s:'unknown',n:'—'}); });
  return out;
}
function cpCandStates(job, P){
  const ev = cpEvaluate(job,P), hard = {};

  ['core','important','bonus'].forEach(g=>P.skills[g].forEach(s=>{ if(cpSt(s)==='hard') hard[s.id]=1; }));
  P.custom.forEach(c=>{ if(c.on && cpSt(c)==='hard') hard[c.id]=1; });
  const st = {};
  Object.keys(hard).forEach(k=>{ (ev[k]?ev[k].rows:[]).forEach(r=>{ const cur=st[r.cand.id]||'ok'; const s=r.status==='not_met'?'fail':r.status==='unknown'?'verify':'ok'; st[r.cand.id]=(cur==='fail'||s==='fail')?'fail':(cur==='verify'||s==='verify')?'verify':'ok'; }); });

function cpPersistDims(job){ job.dimensions = cpClone(CP.dims); job.compRange = (CP.comp.min===''&&CP.comp.max==='') ? null : { min:CP.comp.min===''?null:+CP.comp.min, max:CP.comp.max===''?null:+CP.comp.max, currency:CP.comp.currency, period:CP.comp.period, basis:CP.comp.basis }; if(CP.dimsTouched || CP.dirty) job.criteriaTouched = true; }
function cpDimsStatus(){
  const sum = CP.dims.reduce((s,d)=>s+d.weight,0), n = CP.dims.length;
  return { sum, n, weightOk:Math.abs(sum-1)<0.001, countOk:n>=3 && n<=8 };
}
function cpDimsInvalid(){ const s=cpDimsStatus(); return !(s.weightOk && s.countOk); }
function cpDimSel(kind,key,cur,editable){
  const name = id => ((CP.dims.find(d=>d.id===id))||{}).name || '—';
  if(!editable) return cur ? `<span class="tiny muted cp-dim">${cpL('Dimension','维度')}: ${esc(TD(name(cur)))}</span>` : '';
  const sel = CP.dims.some(d=>d.id===cur) ? cur : '';
  return `<select class="cp-sel cp-dim" aria-label="${cpL('Scored dimension','评分维度')}" onchange="A.cpSetDim('${kind}','${key}',this.value)">${sel?'':`<option value="" selected>${cpL('Auto','自动')}</option>`}${CP.dims.map(d=>`<option value="${esc(d.id)}" ${d.id===sel?'selected':''}>${esc(TD(d.name))}</option>`).join('')}</select>`;
}
function cpScoringHtml(editable){
  const st = cpDimsStatus(), job = getJob(CP.jobId), dims = CP.dims;
  const used = new Set(dims.map(d=>d.name)), pool = DIMENSION_POOL.filter(n=>!used.has(n));
  const untouched = editable && !job.criteriaTouched && !CP.dimsTouched && !job.criteriaVersion;
  const rows = dims.map(d=> editable ? `<div class="cp-dim-row">
      <div class="cp-dim-main"><div class="cp-dim-name">${esc(TD(d.name))}</div><input type="text" class="cp-input" value="${esc(d.rubric)}" aria-label="${cpL('Scoring standard','评分标准')}" onchange="A.cpDimRubric('${d.id}',this.value)"></div>
      <div class="cp-dim-w"><input type="number" min="0" max="100" class="cp-num" value="${Math.round(d.weight*100)}" aria-label="${cpL('Weight','权重')}" onchange="A.cpDimWeight('${d.id}',this.value)"><span class="tiny">%</span></div>
      <button type="button" class="cp-x" ${dims.length<=3?'disabled':''} aria-label="${cpL('Remove','移除')}" onclick="A.cpDimDel('${d.id}')">×</button>
    </div>` : `<div class="cp-dim-row"><div class="cp-dim-main"><div class="cp-dim-name">${esc(TD(d.name))}</div><div class="tiny muted">${esc(TD(d.rubric))}</div></div><div class="cp-dim-bar"><div class="bar-track"><div class="bar-fill" style="width:${Math.round(d.weight*100)}%"></div></div></div><div class="cp-dim-pct">${Math.round(d.weight*100)}%</div></div>`).join('');
  return (untouched?`<div class="cp-banner"><span class="material-icons-o">info</span><span>${T('These are the system’s neutral default dimensions — they have not been adjusted for this role yet. Review and edit before confirming.')}</span></div>`:'')
  + `<section class="cp-card"><div class="cp-card-head"><div class="cp-title">${cpL('Scoring dimensions','评分维度')}</div><span class="tiny ${st.weightOk?'muted':'cp-bad'}">${T('Weights total')} ${Math.round(st.sum*100)}%</span></div>
    <div class="cp-card-body">${rows||`<p class="tiny">${T('No scoring dimensions defined yet.')}</p>`}

      ${editable?`<div class="cp-row" style="margin-top:12px;"><select class="cp-sel" id="cp-dim-picker" ${pool.length?'':'disabled'}>${pool.length?pool.map(n=>`<option value="${esc(n)}">${esc(TD(n))}</option>`).join(''):`<option>${T('All pool dimensions in use')}</option>`}</select><button type="button" class="btn btn-sm btn-secondary" ${dims.length>=8||!pool.length?'disabled':''} onclick="A.cpDimAdd(document.getElementById('cp-dim-picker').value)">＋ ${T('Add dimension')}</button><span class="cp-sp"></span><button type="button" class="btn btn-sm btn-secondary" onclick="A.cpDimEven()">${T('Distribute evenly')}</button></div>`:''}
    </div></section>
    <section class="cp-card"><div class="cp-card-body" style="margin-top:0;">${renderScoringMethodologyNote()}</div></section>`;
}

/* Evidence-standard hint (derived, not a manual status): a scored / eligibility condition with no evidence standard, or a vague statement, is hard for AI to verify. */
const CP_VAGUE = /^(must have\s+)?(strong|good|excellent|solid|great|proven|deep|solid)\s+[a-z ]{0,30}(skills?|ability|abilities|background|understanding|knowledge)\.?$/i;
function cpIsVague(text){ return CP_VAGUE.test(String(text||'').trim()); }
function cpEvGap(it, text){ return !!it && (!String(it.evidence||'').trim() || cpIsVague(text)) ; }
function cpEvidenceGaps(P){
  const out = [];
  CP_FIELDS.forEach(f=>{ const it=P.basic[f.key]; if(it.on && cpEvGap(it,cpLabel(f.key,it,'en'))) out.push(f.key); });
  ['core','important','bonus'].forEach(g=>P.skills[g].forEach(s=>{ if(cpEvGap(s,s.label||s.name)) out.push(s.id); }));
  P.custom.filter(c=>c.on).forEach(c=>{ if(cpEvGap(c,c.text)) out.push(c.id); });

}
function cpEvBadge(it, text, onclick){

function cpPosition(){

      <div class="cp-modal-grid">
        <div class="field"><label>${cpL('Category','分类')}</label><select id="cp-ed-cat">${cpOpts(CP_CATEGORY.map(([v,l])=>[v,cpL(l[0],l[1])]),s.cat||'skill')}</select></div>
        <div class="field"><label>${cpL('Priority','优先级')}</label><select id="cp-ed-prio">${cpOpts(CP_PRIORITY.map(([v,l])=>[v,cpL(l[0],l[1])]),s.priority)}</select></div>
        <div class="field"><label>${cpL('Scored dimension','评分维度')}</label><select id="cp-ed-dim"><option value="">${cpL('Auto','自动')}</option>${CP.dims.map(d=>`<option value="${esc(d.id)}" ${d.id===s.dim?'selected':''}>${esc(TD(d.name))}</option>`).join('')}</select></div>
        <div class="field"><label>${cpL('Criterion weight','条件权重')} (0–1)</label><input type="number" id="cp-ed-weight" min="0" max="1" step="0.1" value="${s.weight==null?1:s.weight}"></div>
      </div>
      <div class="field"><label>${cpL('Evidence standard','证据标准')}</label><input type="text" id="cp-ed-evidence" value="${esc(s.evidence||'')}" placeholder="${esc(cpL('What proves this on a resume?','简历上用什么证明？'))}"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="A.closeModal()">${cpL('Cancel','取消')}</button><button class="btn btn-primary" onclick="A.cpSkillSave('${id}')">${cpL('Save','保存')}</button></div>`);
};
A.cpSkillSave = function(id){
  const f = cpFindSkill(id); if(!f) return; const s = f.s, $ = x=>document.getElementById(x);
  const name = $('cp-ed-name').value.trim(); if(!name){ toast(cpL('Statement is required','条件表述为必填项'),'error'); return; }
  s.name = name; if($('cp-ed-label')){ const l=$('cp-ed-label').value.trim(); if(l) s.label=l; else delete s.label; } else if(s.free) s.label = name;
  if($('cp-ed-alias')) s.aliases = $('cp-ed-alias').value.split(',').map(x=>x.trim()).filter(Boolean);
  s.cat = $('cp-ed-cat').value; s.priority = $('cp-ed-prio').value; s.evalType = cpEv(s.priority); s.dim = $('cp-ed-dim').value;
  const w = parseFloat($('cp-ed-weight').value); s.weight = isNaN(w) ? 1 : Math.min(1,Math.max(0,w)); s.evidence = $('cp-ed-evidence').value.trim(); s.reviewed = true;
  const g = s.priority==='preferred' ? 'bonus' : 'core';
  if(g!==f.g){ CP.draft.skills[f.g].splice(f.i,1); CP.draft.skills[g].push(s); }
  cpDirty(); closeModal(); cpRender();
};
/* custom */
A.cpCustomSet = function(id,prop,val){ const c=CP.draft.custom.find(x=>x.id===id); if(c){ if(prop==='weight') val = val===''?1:Number(val); c[prop]=val; if(prop==='priority') c.evalType = cpEv(val); cpDirty(); cpRender(); } };
A.cpCustomDel = function(id){ CP.draft.custom = CP.draft.custom.filter(c=>c.id!==id); cpDirty(); cpRender(); };
A.cpCustomPreview = function(){
  const N = CP.newCustom, t = (document.getElementById('cp-new-text')||{}).value||N.text; N.text = t; N.preview = null; N.error = '';
  if(!t.trim()){ N.error = cpL('Please describe the requirement first.','请先描述要求。'); }
  else if(CP_PROTECTED.test(t)){ N.error = cpL('This kind of condition isn’t supported as a screening condition. To limit seniority use the “Years of experience” range; to limit region use “Work location”; otherwise rewrite it as a job-related requirement that can be verified from the resume.','这类条件不支持作为筛选条件。想限定资历，请用「工作年限」区间；想限定区域，请用「工作地点」；其他要求请改写成与岗位相关、可在简历中验证的内容。'); }
  else {
    const rule = cpParseCustom(t);
    if(!rule.keywords.length) N.error = cpL('Too vague to evaluate: describe facts that can be verified in a resume.','过于笼统，无法评估：请描述可在简历中验证的事实。');
    else N.preview = rule;
  }
  cpRender();
};
A.cpCustomCancel = function(){ CP.newCustom = { text:'', priority:'preferred', evalType:'scored', preview:null, error:'' }; cpRender(); };
A.cpCustomCommit = function(){
  const N = CP.newCustom; if(!N.preview) return;
  if(CP.draft.custom.filter(c=>c.on).length>=10){ toast(cpL('At most 10 custom conditions — turn one off first','自定义条件最多 10 条，请先停用一条'),'error'); return; }
  const add = ()=>{ CP.draft.custom.push({id:uid('cc'),text:N.text.trim(),priority:N.priority,evalType:cpEv(N.priority),cat:'skill',dim:'',weight:1,evidence:'',on:true,origin:'user',reviewed:true,by:state.currentUser,at:nowISO(),rule:N.preview}); CP.newCustom={text:'',priority:'preferred',evalType:'scored',preview:null,error:''}; cpDirty(); cpRender(); };
  if(cpSt(N)==='hard'){ confirmModal({ title:cpL('Make this a hard condition?','设为硬性条件？'), body:cpL('Hard conditions decide Eligibility. Candidates who don’t meet it are flagged, never removed.','硬性条件将决定 Eligibility。不满足的候选人只会被标记，不会被删除。'), confirmLabel:cpL('Add as hard','设为硬性并添加'), onConfirm:add }); }
  else add();
};
/* confirm / versions */
A.cpConfirm = function(){
  const job = getJob(CP.jobId), P = CP.draft;
  if(cpDimsInvalid()){ toast(cpL('Scoring weights must total 100% with 3–8 dimensions before confirming','确认前评分维度权重需合计 100%，且维度数为 3–8 个'),'error'); CP.tab='scoring'; cpRender(); return; }
  const unrev = cpUnreviewed(P), first = !job.criteriaVersion, snapP = job.panelSnapshot || (job.criteriaVersion ? job.panel : null), hasSnap = !!snapP;
  let summary = '';
  if(hasSnap){
    const a = cpCandStates(job, snapP), b = cpCandStates(job, P), rank = {ok:0,verify:1,fail:2};
    let up=0, down=0, unk=0; const ids = new Set([...Object.keys(a),...Object.keys(b)]);
    ids.forEach(id=>{ const x=a[id]||'ok', y=b[id]||'ok'; if(x===y) return; if(y==='verify') unk++; else if(rank[y]<rank[x]) up++; else down++; });
    summary = `<p style="font-size:var(--fs-sm)">${cpL(`Estimated impact on candidates in this job’s pool: <b>${up}</b> may move up, <b>${down}</b> may move down, <b>${unk}</b> may become “Unknown”.`,`预计对本岗位候选人池的影响：<b>${up}</b> 人结论可能上升，<b>${down}</b> 人可能下降，<b>${unk}</b> 人可能变为"未知"。`)}</p><p class="tiny muted">${cpL('Estimate only — the re-evaluation result is what counts. Existing evaluations will be marked stale, not rewritten.','仅为估算，以重新评估结果为准；已有评估会标记为过期，不会被改写。')}</p>`;
  } else summary = `<p style="font-size:var(--fs-sm)">${cpL('First confirmation: matching will run against the resume library for this job’s direction.','首次确认：将按该岗位方向对简历库自动匹配。')}</p>`;
  openModal(`<div class="modal-header"><h3 class="modal-title">${cpL('Confirm these criteria?','确认这些条件？')}</h3><button class="close-x" onclick="A.closeModal()"><span class="material-icons-o">close</span></button></div>
    <div class="modal-body">${summary}${cpEvidenceGaps(P).length?`<div class="cp-banner" style="margin-top:8px;"><span class="material-icons-o">rule</span><span>${cpL(`${cpEvidenceGaps(P).length} condition(s) have no evidence standard or are too vague — AI may mark many candidates “Unknown”. You can still confirm.`,`有 ${cpEvidenceGaps(P).length} 条条件没写证据标准或表述太笼统，AI 评估时可能有很多候选人落在“未知”。仍可继续确认。`)}</span></div>`:''}${(first && !job.criteriaTouched && !CP.dimsTouched && !CP.dirty)?`<div class="cp-banner" style="margin-top:8px;"><span class="material-icons-o">info</span><span>${T('These dimensions and weights have not been adjusted for this role yet — they’re the system’s neutral default, not a reviewed rubric. Confirm anyway?')}</span></div>`:''}${unrev?`<div class="cp-banner" style="margin-top:8px;"><span class="material-icons-o">auto_awesome</span><span>${cpL(`${unrev} AI-extracted condition(s) haven’t been reviewed — you can still continue.`,`仍有 ${unrev} 条 AI 提取的条件未审阅，可以继续确认。`)}</span></div>`:''}</div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="A.closeModal()">${cpL('Cancel','取消')}</button><button class="btn btn-primary" onclick="A.cpCommit()">${cpL('Confirm version','确认版本')}</button></div>`);
};
A.cpCommit = function(){
  closeModal();
  const job = getJob(CP.jobId), first = !job.criteriaVersion;
  cpPersistDims(job); job.panel = cpClone(CP.draft); cpCompile(job);
  job.criteriaStatus = 'confirmed'; job.criteriaVersion = (job.criteriaVersion||0)+1; job.confirmedBy = state.currentUser; job.confirmedAt = nowISO(); job.criteriaTouched = true;
  job.panelSnapshot = cpClone(job.panel); CP.dirty = false; CP.draft = cpClone(job.panel);
  if(!first) getApplicationsForJob(job.id).forEach(a=>{ const ev=getEvaluation(a.id); if(ev) ev.freshness='stale'; });
  toast(cpL('Criteria confirmed','条件已确认'),'success');
  cpRender(); renderRoute();
  if(first) setTimeout(()=>A.runJobAutoMatch(job.id), 400);
};
A.cpNewVersion = function(){
  confirmModal({ title:cpL('Edit as new version','以新版本编辑'), body:cpL('This opens a new draft based on the confirmed criteria. The confirmed version stays in effect until you confirm the new one.','将基于已确认的条件开一个新草稿；在你确认新版本之前，已确认的版本继续生效。'), confirmLabel:cpL('Start new draft','开始新草稿'),
    onConfirm:()=>{ const job=getJob(CP.jobId); job.criteriaStatus='draft'; CP.draft=cpClone(job.panel); CP.dims=cpClone(job.dimensions||[]); CP.comp=cpClone(job.compRange||{min:'',max:'',currency:'USD',period:'year',basis:'gross'}); CP.dirty=false; toast(cpL('Draft opened','已开启新草稿'),'default'); cpRender(); renderRoute(); } });
};

/* scoring dimension actions */
A.cpSetDim = function(kind,key,val){
  if(kind==='basic'){ const f=CP.draft.basic[key]; if(f) f.dim=val; } else { const f=cpFindSkill(key); if(f) f.s.dim=val; }
  cpDirty(); cpRender();
};
function cpDimTouch(){ CP.dimsTouched = true; cpDirty(); cpRender(); }
A.cpDimWeight = function(id,v){ const d=CP.dims.find(x=>x.id===id); if(!d) return; const n=parseFloat(v); d.weight = isNaN(n)?0:Math.max(0,n)/100; cpDimTouch(); };
A.cpDimRubric = function(id,t){ const d=CP.dims.find(x=>x.id===id); if(!d) return; d.rubric=t; cpDimTouch(); };
A.cpDimAdd = function(name){
  if(!name || DIMENSION_POOL.indexOf(name)===-1) return;
  if(CP.dims.length>=8){ toast(T('A role can have at most 8 scoring dimensions'),'error'); return; }
  if(CP.dims.some(d=>d.name===name)){ toast(T('This dimension is already added'),'error'); return; }
  CP.dims.push({ id:uid('dim'), name, weight:0, rubric:T('Describe how this dimension should be evaluated for this role.') }); cpDimTouch();
};
A.cpDimDel = function(id){
  if(CP.dims.length<=3){ toast(T('A role needs at least 3 scoring dimensions'),'error'); return; }
  CP.dims = CP.dims.filter(d=>d.id!==id); cpDimTouch();
};
A.cpDimEven = function(){
  const n=CP.dims.length; if(!n) return; const even=Math.floor((1/n)*1000)/1000;
  CP.dims.forEach((d,i)=>{ d.weight = i===n-1 ? round2(1-even*(n-1)) : even; }); toast(T('Weights distributed evenly'),'default'); cpDimTouch();
};
{ const _tl = A.toggleLang; A.toggleLang = function(){ _tl.apply(this,arguments); if(CP.open) cpRender(); }; }
window.addEventListener('resize', cpPosition);
window.addEventListener('hashchange', ()=>{ if(CP.open) cpHide(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && CP.open && !state.modal) A.cpClose(); });
</script>
