<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Resume Screening</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%230d9488%22/><path d=%22M18 16h8v12h12V16h8v32h-8V36H26v12h-8z%22 fill=%22white%22/></svg>">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   HireOS Command — Resume Screening — Design System
   Google Workspace-inspired, light/dark/deep themes, 3 text sizes
   =================================================================== */

:root{
  --font: "Google Sans Text","Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --font-mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* accent (blue default) */
  --accent-50:#e8f0fe; --accent-100:#d2e3fc; --accent-300:#8ab4f8;
  --accent-500:#1a73e8; --accent-600:#1967d2; --accent-700:#185abc;

  /* neutrals - light theme */
  --bg:#f6f8fc; --surface:#ffffff; --surface-alt:#f1f3f4;
  --border:#dadce0; --border-strong:#c4c7cc;
  --text:#202124; --text-secondary:#5f6368; --text-tertiary:#80868b;
  --text-on-accent:#ffffff;

  --success-bg:#e6f4ea; --success-text:#137333; --success-border:#a8dab5;
  --warning-bg:#fef7e0; --warning-text:#b06000; --warning-border:#fdd663;
  --danger-bg:#fce8e6; --danger-text:#c5221f; --danger-border:#f6aea9;
  --info-bg:#e8f0fe; --info-text:#1967d2; --info-border:#aecbfa;
  --neutral-bg:#f1f3f4; --neutral-text:#5f6368; --neutral-border:#dadce0;

  --shadow-1: 0 1px 2px 0 rgba(60,64,67,.30), 0 1px 3px 1px rgba(60,64,67,.15);
  --shadow-2: 0 1px 3px 0 rgba(60,64,67,.30), 0 4px 8px 3px rgba(60,64,67,.15);
  --shadow-3: 0 4px 8px 3px rgba(60,64,67,.15), 0 1px 3px rgba(60,64,67,.3);

  --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px;

  --fs-body:16px; --fs-sm:13px; --fs-xs:11px; --fs-lg:18px; --fs-xl:22px; --fs-h1:26px;
  --scale:1;
}

[data-text="small"]{ --fs-body:14px; --fs-sm:12px; --fs-xs:10px; --fs-lg:16px; --fs-xl:19px; --fs-h1:22px; }
[data-text="large"]{ --fs-body:18px; --fs-sm:15px; --fs-xs:13px; --fs-lg:21px; --fs-xl:25px; --fs-h1:30px; }

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="deep"]){
    --bg:#202124; --surface:#292a2d; --surface-alt:#303134;
    --border:#3c4043; --border-strong:#5f6368;
    --text:#e8eaed; --text-secondary:#bdc1c6; --text-tertiary:#9aa0a6;
    --accent-50:#1a2733; --accent-100:#1e3a5f;
    --success-bg:#0f2d1c; --success-text:#81c995; --success-border:#1e4d2b;
    --warning-bg:#332701; --warning-text:#fdd663; --warning-border:#5c4813;
    --danger-bg:#3a1714; --danger-text:#f28b82; --danger-border:#5c2b26;
    --info-bg:#122236; --info-text:#8ab4f8; --info-border:#1e3a5f;
    --neutral-bg:#303134; --neutral-text:#bdc1c6; --neutral-border:#3c4043;
    --shadow-1: 0 1px 2px 0 rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.4);
    --shadow-2: 0 1px 3px 0 rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.4);
  }
}
[data-theme="dark"]{
  --bg:#202124; --surface:#292a2d; --surface-alt:#303134;
  --border:#3c4043; --border-strong:#5f6368;
  --text:#e8eaed; --text-secondary:#bdc1c6; --text-tertiary:#9aa0a6;
  --accent-50:#1a2733; --accent-100:#1e3a5f;
  --success-bg:#0f2d1c; --success-text:#81c995; --success-border:#1e4d2b;
  --warning-bg:#332701; --warning-text:#fdd663; --warning-border:#5c4813;
  --danger-bg:#3a1714; --danger-text:#f28b82; --danger-border:#5c2b26;
  --info-bg:#122236; --info-text:#8ab4f8; --info-border:#1e3a5f;
  --neutral-bg:#303134; --neutral-text:#bdc1c6; --neutral-border:#3c4043;
  --shadow-1: 0 1px 2px 0 rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.4);
  --shadow-2: 0 1px 3px 0 rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.4);
}

[data-theme="deep"]{
  --bg:#0d1b2a; --surface:#132a3e; --surface-alt:#17334a;
  --border:#274156; --border-strong:#3a5a73;
  --text:#e8eef4; --text-secondary:#b7c6d4; --text-tertiary:#8ba0b3;
  --accent-50:#122a41; --accent-100:#173a58;
  --success-bg:#0e2b25; --success-text:#7fd8b8; --success-border:#1c4a3d;
  --warning-bg:#332405; --warning-text:#f2c14e; --warning-border:#5c4413;
  --danger-bg:#361a1f; --danger-text:#f3948f; --danger-border:#5c2b30;
  --info-bg:#102944; --info-text:#8fc0ff; --info-border:#1e4a70;
  --neutral-bg:#17334a; --neutral-text:#b7c6d4; --neutral-border:#274156;
  --shadow-1: 0 1px 2px 0 rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.4);
  --shadow-2: 0 1px 3px 0 rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.4);
}

[data-accent="teal"]{ --accent-50:#e4f5f3; --accent-100:#c2e8e4; --accent-300:#5cb8ae; --accent-500:#00897b; --accent-600:#00786b; --accent-700:#00695c; }
[data-theme="dark"][data-accent="teal"],[data-theme="deep"][data-accent="teal"]{ --accent-50:#0f2b28; --accent-100:#123f39; }
[data-accent="violet"]{ --accent-50:#f0e9fb; --accent-100:#dccbf5; --accent-300:#af86e0; --accent-500:#7c4dcf; --accent-600:#6a3fb8; --accent-700:#5a349e; }
[data-theme="dark"][data-accent="violet"],[data-theme="deep"][data-accent="violet"]{ --accent-50:#241a35; --accent-100:#2f2247; }

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--text);
  font-size:var(--fs-body); line-height:1.5; -webkit-font-smoothing:antialiased;
}
a{ color:var(--accent-600); text-decoration:none; }
a:hover{ text-decoration:underline; }
button{ font-family:inherit; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

.material-icons-o{ font-family:'Material Icons Outlined'; font-weight:normal; font-style:normal; font-size:20px; line-height:1; letter-spacing:normal; text-transform:none; display:inline-block; white-space:nowrap; word-wrap:normal; direction:ltr; -webkit-font-smoothing:antialiased; }

/* ---------- App shell ---------- */
#app{ display:flex; flex-direction:column; height:100vh; min-width:960px; }

.topbar{
  height:56px; flex:0 0 auto; display:flex; align-items:center; gap:14px;
  padding:0 16px; background:var(--surface); border-bottom:1px solid var(--border);
  position:relative; z-index:40;
}
.brand{ display:flex; align-items:center; gap:10px; font-size:var(--fs-lg); font-weight:500; color:var(--text); min-width:230px; }
.brand .logo{ width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,var(--accent-500),var(--accent-700)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:15px; }
.brand small{ display:block; font-size:var(--fs-xs); color:var(--text-tertiary); font-weight:400; }

.topbar-search{ flex:1; max-width:560px; display:flex; align-items:center; gap:8px; background:var(--surface-alt); border:1px solid transparent; border-radius:24px; padding:8px 16px; color:var(--text-secondary); font-size:var(--fs-sm); }
.topbar-search input{ border:0; background:transparent; outline:none; flex:1; color:var(--text); font-size:var(--fs-sm); font-family:inherit; }
.topbar-search:focus-within{ background:var(--surface); border-color:var(--accent-300); box-shadow:var(--shadow-1); }

.topbar-actions{ display:flex; align-items:center; gap:8px; margin-left:auto; }

.icon-btn{ width:36px; height:36px; border-radius:50%; border:none; background:transparent; color:var(--text-secondary); display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; overflow:hidden; font-size:0; flex:0 0 auto; }
.icon-btn .material-icons-o{ font-size:20px; }
.icon-btn:hover{ background:var(--surface-alt); }
.icon-btn .dot{ position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--danger-text); border:2px solid var(--surface); }

.role-pill{ display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:20px; padding:5px 12px 5px 6px; cursor:pointer; background:var(--surface); font-size:var(--fs-sm); color:var(--text); }
.role-pill:hover{ background:var(--surface-alt); }
.avatar{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:#fff; }
.role-pill .demo-tag{ font-size:var(--fs-xs); background:var(--warning-bg); color:var(--warning-text); border:1px solid var(--warning-border); padding:1px 6px; border-radius:8px; font-weight:600; letter-spacing:.02em; }

.shell{ flex:1; display:flex; min-height:0; }

.sidenav{ width:236px; flex:0 0 auto; display:flex; flex-direction:column; background:var(--surface); border-right:1px solid var(--border); padding:12px 8px; overflow-y:auto; }
.sidenav-section{ margin-bottom:18px; }
.sidenav-section:last-child{ margin-top:auto; }
.sidenav-label{ font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.06em; color:var(--text-tertiary); padding:6px 12px; font-weight:600; }
.nav-item{ display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:12px; color:var(--text); font-size:var(--fs-sm); cursor:pointer; position:relative; margin-bottom:2px; }
.nav-item:hover{ background:var(--surface-alt); text-decoration:none; }
.nav-item.active{ background:var(--accent-100); color:var(--accent-700); font-weight:600; }
.nav-item .material-icons-o{ font-size:19px; color:inherit; opacity:.85; }
.nav-item .badge-count{ margin-left:auto; background:var(--neutral-bg); color:var(--neutral-text); font-size:var(--fs-xs); padding:1px 7px; border-radius:10px; font-weight:600; }
.nav-item.active .badge-count{ background:var(--accent-600); color:var(--text-on-accent); }

.main{ flex:1; overflow-y:auto; position:relative; background:var(--bg); }
.main-inner{ max-width:1320px; margin:0 auto; padding:24px 28px 64px; }
.main-inner.wide{ max-width:none; }

/* ---------- Typography helpers ---------- */
.page-title{ font-size:var(--fs-h1); font-weight:400; margin:0 0 4px; color:var(--text); text-wrap:balance; }
.page-subtitle{ font-size:var(--fs-sm); color:var(--text-secondary); margin:0 0 20px; }
.section-title{ font-size:var(--fs-lg); font-weight:500; margin:0 0 12px; color:var(--text); text-wrap:balance; }
.eyebrow{ font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.07em; color:var(--text-tertiary); font-weight:600; }
.muted{ color:var(--text-secondary); }
.tiny{ font-size:var(--fs-xs); color:var(--text-tertiary); }
.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

.breadcrumbs{ display:flex; align-items:center; gap:6px; font-size:var(--fs-sm); color:var(--text-secondary); margin-bottom:10px; flex-wrap:wrap; }
.breadcrumbs a{ color:var(--text-secondary); }
.breadcrumbs .sep{ color:var(--text-tertiary); }
.breadcrumbs .current{ color:var(--text); font-weight:500; }
.breadcrumb-back{ display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; padding:0; margin-right:2px; border:1px solid var(--border); border-radius:7px; background:var(--surface); color:var(--text-secondary); cursor:pointer; transition:background .12s,border-color .12s,color .12s; }
.breadcrumb-back:hover{ background:var(--surface-alt); border-color:var(--border-strong); color:var(--text); }
.breadcrumb-back .material-icons-o{ font-size:18px; }

.page-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
.page-header .actions{ display:flex; gap:8px; flex-wrap:wrap; }
.screening-toolbar{ display:flex; align-items:center; gap:14px; margin-bottom:11px; flex-wrap:wrap; }
.screening-toolbar-title{ font-size:var(--fs-2xl); line-height:1.2; margin:0; }
.screening-toolbar-title.jobs-list-title{ font-size:var(--fs-h1); font-weight:700; letter-spacing:-.025em; }
.screening-toolbar-actions{ margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.job-detail-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:9px; flex-wrap:wrap; }
.job-detail-header .page-subtitle{ margin-bottom:9px; }
.job-detail-header h2{ margin:0 0 5px; font-size:var(--fs-h1); line-height:1.2; }
.job-title-line{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:5px; }
.job-title-line h2{ margin:0; }
.job-detail-header .actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.table-head-filter{ width:auto; min-width:96px; padding:0 20px 0 0; border:0; border-radius:0; background-color:transparent; color:inherit; font:inherit; font-weight:inherit; text-transform:inherit; letter-spacing:inherit; cursor:pointer; box-shadow:none; }
.table-head-filter:focus{ outline:none; color:var(--accent-700); }
.candidate-section-heading{ min-height:38px; display:flex; align-items:center; gap:4px; padding:9px 2px; margin-bottom:9px; color:var(--text); font-size:var(--fs-sm); font-weight:500; }
.candidate-section-heading.suggested-heading{ padding-top:4px; padding-bottom:4px; transform:translateY(5px); }
.candidate-section-heading.compact{ margin-bottom:0; }
.candidate-section-heading .cnt{ color:var(--text-tertiary); font-weight:400; }
.candidate-section-heading .heading-action{ margin-left:auto; }
.candidate-list-header{ margin-bottom:9px; transform:translateY(5px); }
@media (max-width:860px){ .screening-toolbar-actions{ width:100%; margin-left:0; } }

/* ---------- Buttons ---------- */
.btn{ display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-sm); font-weight:500; padding:8px 18px; border-radius:6px; border:1px solid transparent; cursor:pointer; white-space:nowrap; line-height:1.2; transition:background .12s; }
.btn .material-icons-o{ font-size:18px; }
.btn-primary{ background:var(--accent-600); color:#fff; }
.btn-primary:hover{ background:var(--accent-700); }
.btn-primary:disabled{ background:var(--neutral-bg); color:var(--text-tertiary); cursor:not-allowed; }
.btn-secondary{ background:transparent; color:var(--accent-600); border-color:var(--border-strong); }
.btn-secondary:hover{ background:var(--accent-50); }
.btn-text{ background:transparent; color:var(--accent-600); padding:8px 10px; }
.btn-text:hover{ background:var(--accent-50); }
.btn-danger{ background:transparent; color:var(--danger-text); border-color:var(--danger-border); }
.btn-danger:hover{ background:var(--danger-bg); }
.btn-danger-solid{ background:var(--danger-text); color:#fff; }
.btn-danger-solid:hover{ opacity:.9; }
.btn-sm{ padding:5px 12px; font-size:var(--fs-xs); border-radius:5px; }
.btn-icon{ padding:7px; border-radius:6px; background:transparent; border:1px solid var(--border); color:var(--text-secondary); }
.btn-icon:hover{ background:var(--surface-alt); }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }

/* ---------- Cards / surfaces ---------- */
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); overflow-x:auto; }
.card-pad{ padding:18px 20px; }
.upload-dropzone{ transition:border-color .12s ease, background-color .12s ease; }
.upload-dropzone.drag-over{ border-color:var(--accent-500)!important; background:var(--accent-50); }
.upload-file-list{ text-align:left; margin-top:14px; }
.upload-file-list .list-row{ padding:8px 4px; }
.upload-strip{ display:flex; align-items:center; gap:12px 16px; flex-wrap:wrap; padding:10px 14px; margin-bottom:14px; background:var(--surface); border:1px solid var(--border); border-radius:12px; }
.upload-strip-label{ display:flex; align-items:center; gap:10px; min-width:0; margin-right:auto; }
.upload-strip-label .us-icon{ width:32px; height:32px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:9px; background:var(--accent-50); color:var(--accent-600); }
.upload-strip-label .us-icon .material-icons-o{ font-size:19px; }
.upload-strip-label .us-title{ display:block; font-size:var(--fs-sm); font-weight:600; line-height:1.25; }
.upload-strip-label .us-sub{ display:block; font-size:var(--fs-xs); color:var(--text-tertiary); line-height:1.3; }
.upload-strip-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.upload-strip-actions .btn .material-icons-o{ font-size:16px; }
.card-hover:hover{ box-shadow:var(--shadow-1); }
.stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:20px; }
.stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 16px; cursor:pointer; }
.stat-card:hover{ border-color:var(--accent-300); box-shadow:var(--shadow-1); }
.stat-card .num{ font-size:26px; font-weight:600; color:var(--text); font-variant-numeric:tabular-nums; }
.stat-card .num.zero{ color:var(--text-tertiary); }
.stat-card .lbl{ font-size:var(--fs-xs); color:var(--text-secondary); margin-top:2px; }
.stat-card.unavailable .num{ font-size:var(--fs-sm); color:var(--danger-text); }

.section-block{ margin-bottom:28px; }
.collapse-toggle{ display:flex; align-items:center; gap:6px; background:none; border:none; color:var(--accent-600); font-size:var(--fs-sm); font-weight:500; cursor:pointer; padding:6px 0; }

/* ---------- Tables / lists ---------- */
table.data-table{ width:100%; border-collapse:collapse; font-size:var(--fs-sm); font-variant-numeric:tabular-nums; }
.data-table th{ text-align:left; font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.04em; color:var(--text-tertiary); font-weight:600; padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap; }
.data-table td{ padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
.data-table tr:last-child td{ border-bottom:none; }
.linked-candidates-table th:nth-child(2), .linked-candidates-table td:nth-child(2){ width:120px; min-width:120px; }
.linked-candidates-table th:first-child, .linked-candidates-table td:first-child{ padding-right:4px; }
.linked-candidates-table th:nth-child(2), .linked-candidates-table td:nth-child(2){ padding-left:4px; }
.ai-suggested-table th:first-child, .ai-suggested-table td:first-child{ width:44px; min-width:44px; max-width:44px; padding-right:4px; }
.ai-suggested-table th:nth-child(2), .ai-suggested-table td:nth-child(2){ padding-left:4px; }
.ai-suggested-table .suggestion-copy{ color:var(--text); }
.data-table tr.clickable:hover{ background:var(--surface-alt); cursor:pointer; }
.data-table tr.selected{ background:var(--accent-50); }
.task-table th:first-child,.task-table td:first-child{ width:28%; }
.task-table th:nth-child(2),.task-table td:nth-child(2){ width:32%; }
.task-table th:nth-child(3),.task-table td:nth-child(3){ width:180px; }
.task-table th:nth-child(4),.task-table td:nth-child(4){ width:180px; }
.task-table th:nth-child(5),.task-table td:nth-child(5){ width:96px; }
.task-subject-stack{ display:flex; flex-direction:column; align-items:flex-start; gap:3px; min-width:0; }
.task-candidate{ font-weight:600; color:var(--text); }
.task-job{ font-size:var(--fs-xs); color:var(--text-secondary); }
.task-job a{ color:var(--text-secondary); }
.task-job a:hover{ color:var(--accent-600); }

.list-row{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--border); }
.list-row:last-child{ border-bottom:none; }
.list-row:hover{ background:var(--surface-alt); }

/* ---------- Badges / chips ---------- */
.badge{ display:inline-flex; align-items:center; gap:4px; font-size:var(--fs-xs); font-weight:600; padding:2px 9px; border-radius:10px; border:1px solid; white-space:nowrap; line-height:1.6; }
.badge-success{ background:var(--success-bg); color:var(--success-text); border-color:var(--success-border); }
.badge-warning{ background:var(--warning-bg); color:var(--warning-text); border-color:var(--warning-border); }
.badge-danger{ background:var(--danger-bg); color:var(--danger-text); border-color:var(--danger-border); }
.badge-info{ background:var(--info-bg); color:var(--info-text); border-color:var(--info-border); }
.badge-neutral{ background:var(--neutral-bg); color:var(--neutral-text); border-color:var(--neutral-border); }
.badge-outline{ background:transparent; color:var(--text-secondary); border-color:var(--border-strong); }
.badge .material-icons-o{ font-size:13px; }
.dot-indicator{ width:7px; height:7px; border-radius:50%; display:inline-block; }

.tag{ display:inline-flex; align-items:center; gap:4px; font-size:var(--fs-xs); padding:3px 9px; border-radius:5px; background:var(--surface-alt); color:var(--text-secondary); border:1px solid var(--border); }

.pill-tabs{ display:flex; gap:4px; background:var(--surface-alt); border-radius:20px; padding:3px; width:fit-content; }
.pill-tab{ padding:6px 16px; border-radius:16px; font-size:var(--fs-sm); font-weight:500; color:var(--text-secondary); cursor:pointer; border:none; background:transparent; }
.pill-tab.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-1); }

.underline-tabs{ display:flex; gap:22px; border-bottom:1px solid var(--border); margin-bottom:18px; }
.u-tab{ padding:11px 2px; font-size:var(--fs-sm); font-weight:500; color:var(--text-secondary); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-1px; }
.u-tab.active{ color:var(--accent-600); border-color:var(--accent-600); }
.u-tab .cnt{ color:var(--text-tertiary); font-weight:400; }

/* ---------- Forms ---------- */
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:var(--fs-xs); font-weight:600; color:var(--text-secondary); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em; }
.field input[type=text], .field input[type=search], .field input[type=email], .field input[type=number], .field select, .field textarea{
  width:100%; padding:9px 12px; border:1px solid var(--border-strong); border-radius:6px; background:var(--surface); color:var(--text); font-size:var(--fs-sm); font-family:inherit;
}
.field textarea{ resize:vertical; min-height:80px; }
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--accent-300); outline-offset:0; border-color:var(--accent-500); }
.field .hint{ font-size:var(--fs-xs); color:var(--text-tertiary); margin-top:4px; }
.checkbox-row{ display:flex; align-items:center; gap:8px; font-size:var(--fs-sm); }
.checkbox-row input{ width:16px; height:16px; }
.radio-card{ border:1px solid var(--border); border-radius:8px; padding:10px 14px; display:flex; gap:10px; align-items:flex-start; cursor:pointer; }
.radio-card.selected{ border-color:var(--accent-500); background:var(--accent-50); }

/* ---------- Score / eligibility visuals ---------- */
.score-badge{ display:inline-flex; align-items:center; gap:6px; font-weight:600; font-variant-numeric:tabular-nums; }
.score-ring{ width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff; flex:0 0 auto; font-variant-numeric:tabular-nums; }
.score-ring.unk{ background:var(--neutral-bg); color:var(--text-tertiary); border:2px dashed var(--border-strong); }
.bar-track{ height:6px; background:var(--surface-alt); border-radius:4px; overflow:hidden; flex:1; }
.bar-fill{ height:100%; background:var(--accent-500); border-radius:4px; }
.bar-fill.unknown{ background:repeating-linear-gradient(45deg,var(--border-strong),var(--border-strong) 4px,transparent 4px,transparent 8px); }

.elig-eligible{ color:var(--success-text); }
.elig-likely_eligible{ color:var(--success-text); }
.elig-needs_verification{ color:var(--warning-text); }
.elig-not_eligible{ color:var(--danger-text); }

/* ---------- Drawer / modal ---------- */
.overlay{ position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:100; display:flex; }
.drawer{ margin-left:auto; width:520px; max-width:92vw; background:var(--surface); height:100%; box-shadow:var(--shadow-3); display:flex; flex-direction:column; animation:slidein .18s ease-out; }
@keyframes slidein{ from{ transform:translateX(24px); opacity:0;} to{transform:translateX(0); opacity:1;} }
.drawer-header{ padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.drawer-body{ padding:18px 20px; overflow-y:auto; flex:1; }
.drawer-footer{ padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }

.modal-wrap{ margin:auto; background:var(--surface); border-radius:var(--radius-lg); width:520px; max-width:92vw; max-height:88vh; display:flex; flex-direction:column; box-shadow:var(--shadow-3); animation:popin .14s ease-out; }
.modal-wrap.wide{ width:760px; }
@keyframes popin{ from{ transform:scale(.97); opacity:0;} to{transform:scale(1); opacity:1;} }
.modal-header{ padding:18px 22px 4px; display:flex; align-items:flex-start; justify-content:space-between; }
.modal-title{ font-size:var(--fs-lg); font-weight:500; margin:0; text-wrap:balance; }
.modal-body{ padding:14px 22px 6px; overflow-y:auto; }
.modal-footer{ padding:16px 22px 20px; display:flex; justify-content:flex-end; gap:10px; }
.close-x{ background:none; border:none; color:var(--text-tertiary); cursor:pointer; padding:4px; border-radius:50%; }
.close-x:hover{ background:var(--surface-alt); }

/* ---------- Toasts ---------- */
.toast-stack{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; }
.toast{ background:#323639; color:#fff; padding:12px 18px; border-radius:8px; font-size:var(--fs-sm); box-shadow:var(--shadow-2); display:flex; align-items:center; gap:14px; min-width:280px; }
[data-theme="dark"] .toast, [data-theme="deep"] .toast{ background:#484c50; }
.toast.success{ background:#137333; }
.toast.error{ background:#c5221f; }
.toast .toast-action{ color:var(--accent-300); font-weight:600; cursor:pointer; background:none; border:none; font-size:var(--fs-sm); }

/* ---------- Empty / error states ---------- */
.empty-state{ text-align:center; padding:56px 24px; color:var(--text-secondary); }
.empty-state .material-icons-o{ font-size:44px; color:var(--text-tertiary); margin-bottom:10px; }
.empty-state h3{ font-size:var(--fs-lg); font-weight:500; color:var(--text); margin:0 0 6px; }
.empty-state p{ font-size:var(--fs-sm); max-width:440px; margin:0 auto 16px; }
.empty-state .actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

.error-inline{ display:flex; align-items:center; gap:8px; color:var(--danger-text); font-size:var(--fs-sm); background:var(--danger-bg); border:1px solid var(--danger-border); padding:10px 14px; border-radius:6px; }
.skeleton{ background:linear-gradient(90deg,var(--surface-alt) 25%,var(--border) 37%,var(--surface-alt) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:6px; }
@keyframes shimmer{ 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }

/* ---------- Misc ---------- */
.divider{ height:1px; background:var(--border); margin:16px 0; border:none; }
.flex{ display:flex; }
.flex-col{ display:flex; flex-direction:column; }
.gap-4{gap:4px;} .gap-6{gap:6px;} .gap-8{gap:8px;} .gap-10{gap:10px;} .gap-12{gap:12px;} .gap-16{gap:16px;} .gap-20{gap:20px;}
.items-center{align-items:center;} .justify-between{justify-content:space-between;} .flex-wrap{flex-wrap:wrap;}
.w-full{width:100%;}
.text-right{text-align:right;}
.avatar-sm{ width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:600; color:#fff; flex:0 0 auto;}
.avatar-md{ width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; color:#fff; flex:0 0 auto;}

.kbd-focus:focus-visible{ outline:2px solid var(--accent-500); outline-offset:2px; border-radius:4px; }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible{ outline:2px solid var(--accent-500); outline-offset:1px; }

.hoverable-row:hover .row-actions{ opacity:1; }
.row-actions{ opacity:0; transition:opacity .1s; }
@media(min-width:0px){ .row-actions{ opacity:1; } } /* keep visible for click affordance in prototype */

.link-btn{ background:none;border:none;color:var(--accent-600);cursor:pointer;font-size:inherit;padding:0;font-family:inherit; }
.link-btn:hover{ text-decoration:underline; }

.progress-track{ height:8px; border-radius:4px; background:var(--surface-alt); overflow:hidden; }
.progress-fill{ height:100%; background:var(--accent-500); }

.two-col{ display:grid; grid-template-columns:340px 1fr; gap:20px; align-items:start; }
.two-col .col-list{ position:sticky; top:0; max-height:calc(100vh - 140px); overflow-y:auto; }

@media (max-width: 1280px){
  .two-col{ grid-template-columns:280px 1fr; }
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:0.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.001ms !important;
    scroll-behavior:auto !important;
  }
}

}

body{ letter-spacing:-.006em; }
.material-icons-o{ font-family:"Material Symbols Rounded"; font-size:18px; }

/* ---------- small helpers ---------- */
let __seq = 1000;
function uid(prefix){ return prefix + '-' + (__seq++).toString(36); }
function nowISO(offsetMin){ const d = new Date(Date.now() + (offsetMin||0)*60000); return d.toISOString(); }
function daysAgo(n, hh){ const d = new Date(); d.setDate(d.getDate()-n); if(hh!=null) d.setHours(hh,0,0,0); return d.toISOString(); }
function daysFromNow(n, hh){ const d = new Date(); d.setDate(d.getDate()+n); if(hh!=null) d.setHours(hh,0,0,0); return d.toISOString(); }
function hoursAgo(n){ const d = new Date(Date.now()-n*3600000); return d.toISOString(); }

/* Deterministic score aggregation per Interface Spec §5.2:
   - dims: [{id,name,weight,status:'evaluated'|'unknown'|'not_evaluated'|'not_applicable', score:number|null, ...}]
   - A = applicable dims, E = evaluated subset
   - coverage = sum(E weight)/sum(A weight); overall = sum(E weight*score)/sum(E weight) if coverage>=minCoverage else null
*/
function computeAggregate(dims, minCoverage){
  minCoverage = minCoverage==null ? 0.70 : minCoverage;
  const applicable = dims.filter(d=>d.status!=='not_applicable');
  const totalW = applicable.reduce((s,d)=>s+d.weight,0) || 1;
  const evaluated = applicable.filter(d=>d.status==='evaluated' && typeof d.score==='number');
  const evalW = evaluated.reduce((s,d)=>s+d.weight,0);
  const coverage = totalW ? evalW/totalW : 0;
  let overall = null;
  if(coverage >= minCoverage && evalW>0){
    overall = evaluated.reduce((s,d)=>s+d.weight*d.score,0)/evalW;
  }
  return { coverage: round2(coverage), overall: overall==null?null:round1(overall) };
}
function round1(n){ return Math.round(n*10)/10; }
function round2(n){ return Math.round(n*100)/100; }

function aggregateEligibility(results){
  if(results.some(r=>r.status==='not_met')) return 'not_eligible';
  if(results.some(r=>r.status==='unknown' || r.status==='conflicting')) return 'needs_verification';
  if(results.some(r=>r.status==='provisionally_met')) return 'likely_eligible';
  return 'eligible';
}

/* Confidence display per Patch 1 rule: reuse the overall/coverage engine, no percentages, coverage-gated buckets. */
function confidenceLabel(r){
  if(r.eligibility==='not_eligible') return T('Not eligible — confidence not shown');
  if(r.proposalSource==='manual') return T('Manually added — no AI confidence score');
  if(r.confidence==null) return T('Insufficient evidence to estimate confidence');
  const p = Math.round(r.confidence*100);
  if(p>=70) return T('Strong match signal');
  if(p>=40) return T('Some match signal');
  return T('Limited match signal');
}

/* Deterministic pseudo-random generator (same candidate+job always yields the same simulated result). */
function seededRandom(seedStr){
  let h = 0;
  for(let i=0;i<seedStr.length;i++){ h = (h*31 + seedStr.charCodeAt(i)) | 0; }
  return function(){ h = (h*1103515245 + 12345) & 0x7fffffff; return h / 0x7fffffff; };
}
const DIRECTION_STOPWORDS = new Set(['and','the','of','for','with','team','engineer','engineering','manager','lead','senior','junior','staff','remote','unassigned']);
function extractKeywords(text){
  return (text||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2 && !DIRECTION_STOPWORDS.has(w));
}
/* Direction pre-filter (Patch discussion item 5): coarse keyword overlap between job team/title and candidate tags,
   used to avoid running full multidimensional matching against every job in the library. */
function candidateMatchesDirection(candidate, job){
  const jobWords = new Set([...extractKeywords(job.team), ...extractKeywords(job.title)]);
  if(jobWords.size===0) return true; // job has no usable direction signal — don't silently exclude everyone
  for(const tag of (candidate.tags||[])){
    for(const w of extractKeywords(tag)){ if(jobWords.has(w)) return true; }
  }
  return false;
}
/* Lightweight eligibility simulation — only checks the one hard-requirement type this prototype can reason about
   (location) without real resume parsing. Everything else defaults to eligible. */
function quickEligibilityCheck(candidate, job){
  const hardLocReq = (job.requirements||[]).some(r=>r.hard && r.kind==='location');
  const loc = candidate.contact && candidate.contact.location;
  if(hardLocReq && (!loc || loc.status==='unknown')) return 'needs_verification';
  return 'eligible';
}

function makeEval(id, applicationId, dims, elig, opts){
  opts = opts || {};
  const agg = computeAggregate(dims);
  const evaluationStatus = agg.overall==null ? 'insufficient_evidence' : 'evaluated';
  return Object.assign({
    id, applicationId, status:'completed', evaluationMode:'ai_assisted', aiStatus:'available',
    eligibilityStatus: aggregateEligibility(elig),
    eligibilityResults: elig,
    overall: agg.overall, coverage: agg.coverage,
    confidence: opts.confidence!=null?opts.confidence:0.7,
    evaluationStatus,
    dimensionScores: dims,
    modelVersion:'screen-eval-v2.3.1 (sample)',
    completedAt: opts.completedAt || daysAgo(2),
    freshness: opts.freshness || 'current',
  }, opts.extra||{});
}

/* ---------------------------------------------------------------
   Formatting helpers
   --------------------------------------------------------------- */
function esc(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); const loc=state.lang==='zh'?'zh-CN':'en-US'; return d.toLocaleDateString(loc,{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); const loc=state.lang==='zh'?'zh-CN':'en-US'; return d.toLocaleDateString(loc,{month:'short',day:'numeric',year:'numeric'}) + ', ' + d.toLocaleTimeString(loc,{hour:'numeric',minute:'2-digit'}); }
function relTime(iso){
  if(!iso) return '—';
  const diffMs = new Date(iso).getTime() - Date.now();
  const abs = Math.abs(diffMs);
  const min=60000,hr=3600000,day=86400000;
  let val,unit;
  if(abs<hr){ val=Math.round(abs/min); unit='minute'; }
  else if(abs<day){ val=Math.round(abs/hr); unit='hour'; }
  else { val=Math.round(abs/day); unit='day'; }
  if(state.lang==='zh'){
    const unitZh = unit==='minute'?'分钟':unit==='hour'?'小时':'天';
    if(val===0) return '刚刚';
    return diffMs<0 ? `${val} ${unitZh}前` : `${val} ${unitZh}后`;
  }
  if(val===0) return 'just now';
  const plural = val===1?unit:unit+'s';
  return diffMs<0 ? `${val} ${plural} ago` : `in ${val} ${plural}`;
}
function fmtMoney(range){
  if(!range || (range.min==null && range.max==null)) return T('Not provided');
  const cur = range.currency==='USD'?'$':(range.currency||'')+' ';
  const fmt = n => n==null? '?' : cur + n.toLocaleString('en-US');
  const zh = state.lang==='zh';
  const per = range.period==='year'?(zh?'/年':'/yr'):range.period==='month'?(zh?'/月':'/mo'):range.period==='hour'?(zh?'/小时':'/hr'):'';
  const basisZh = { gross:'税前', net:'税后' };
  const basis = range.basis && range.basis!=='unknown' ? (zh ? `（${basisZh[range.basis]||range.basis}）` : ` (${range.basis})`) : '';
  if(range.min===range.max) return `${fmt(range.min)}${per}${basis}`;
  return `${fmt(range.min)}–${fmt(range.max)}${per}${basis}`;
}
function pct(n){ return n==null? '—' : Math.round(n*100)+'%'; }
function scoreDisplay(n){ return n==null ? null : Math.round(n); }
function initialsOf(name){ return (name||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function avatarHtml(personIdOrObj, size){
  const p = typeof personIdOrObj==='string' ? getPerson(personIdOrObj) : personIdOrObj;
  const cls = size==='md' ? 'avatar-md' : (size==='sm'?'avatar-sm':'avatar');
  if(!p) return `<span class="${cls}" style="background:var(--border-strong)">?</span>`;
  return `<span class="${cls}" style="background:${p.color}" title="${esc(p.name)}">${esc(p.initials||initialsOf(p.name))}</span>`;
}

  const colors=['#1a73e8','#188038','#8430ce','#d93025','#e37400','#12805c','#b31412','#3949ab'];
  let h=0; for(const c of (cand.id||'')) h = (h*31 + c.charCodeAt(0))>>>0;

  const cls = size==='md' ? 'avatar-md' : (size==='sm'?'avatar-sm':'avatar');
  return `<span class="${cls}" style="background:${color}">${esc(initialsOf(cand.displayName))}</span>`;
}

/* ---------------------------------------------------------------
   Router
   --------------------------------------------------------------- */
const ROUTES = []; // {re, keys, handler}
function registerRoute(pattern, handler){
  const keys = [];
  const re = new RegExp('^'+pattern.replace(/:[a-zA-Z]+/g, m=>{ keys.push(m.slice(1)); return '([^/]+)'; })+'$');
  ROUTES.push({ re, keys, handler });
}
function parseHash(){
  let h = location.hash || '#/tasks';
  h = h.split('?')[0];
  return h;
}
function matchRoute(hash){
  for(const r of ROUTES){
    const m = hash.match(r.re);
    if(m){
      const params = {};
      r.keys.forEach((k,i)=> params[k]=decodeURIComponent(m[i+1]));
      return { handler:r.handler, params };
    }
  }
  return null;
}
function navigate(hash){ if(location.hash===hash){ renderRoute(); } else { location.hash = hash; } }
function renderRoute(){
  const hash = parseHash();
  state.route = hash;
  const match = matchRoute(hash);
  const main = document.getElementById('main-content');
  renderNav();
  if(!match){
    main.innerHTML = emptyState({ icon:'search_off', title:T('Page not found'), body:T('This route does not exist in the prototype.'), actions:`<button class="btn btn-primary" onclick="A.nav('#/tasks')">${T('Go to My Tasks')}</button>` });
    return;
  }
  try{
    main.innerHTML = match.handler(match.params) || '';
    window.scrollTo(0,0);
    main.scrollTop = 0;
  }catch(err){
    console.error(err);
    main.innerHTML = emptyState({ icon:'error_outline', title:T('Something went wrong rendering this page'), body: esc(err.message), actions:`<button class="btn btn-primary" onclick="A.nav('#/tasks')">${T('Go to My Tasks')}</button>` });
  }
}
window.addEventListener('hashchange', renderRoute);

function breadcrumbs(items){

    const isLast = i===items.length-1;
    if(isLast) return `<span class="current">${esc(it.label)}</span>`;
    return `<a href="${it.href}">${esc(it.label)}</a><span class="sep">/</span>`;
  }).join('') + `</div>`;
}

    { route:'#/tasks', icon:'checklist', label:'Overview', countFn:()=> myTasks().filter(t=>t.status==='open'||t.status==='in_progress'||t.status==='waiting').length },
  ]},
  { section:'Workspace', items:[
    { route:'#/library', icon:'folder_shared', label:'Resume Library' },
    { route:'#/files', icon:'cloud_upload', label:'Files & Integrations' },
    { route:'#/settings/preferences', icon:'tune', label:'Settings' },
  ]},
];
function isActiveRoute(route){
  const cur = state.route;
  if(route==='#/tasks') return cur.startsWith('#/tasks');
  if(route==='#/library') return cur.startsWith('#/library') || cur.startsWith('#/imports') || cur.startsWith('#/duplicates') || cur.startsWith('#/candidates');
  if(route==='#/jobs') return cur.startsWith('#/jobs') || cur.startsWith('#/applications') || cur.startsWith('#/deliveries');
  if(route.startsWith('#/comparisons')) return cur.startsWith('#/comparisons');
  if(route==='#/files') return cur.startsWith('#/files');
  if(route==='#/settings/preferences') return cur.startsWith('#/settings');
  return cur===route;
}
function renderNav(){
  const navEl = document.getElementById('sidenav');
  if(!navEl) return;
  navEl.innerHTML = NAV_ITEMS.map(sec=>`
    <div class="sidenav-section">
      ${sec.section?`<div class="sidenav-label">${T(sec.section)}</div>`:''}
      ${sec.items.map(it=>{
        const active = isActiveRoute(it.route);
        const count = it.countFn ? it.countFn() : null;
        const href = it.hrefFn ? it.hrefFn() : it.route;
        return `<a class="nav-item ${active?'active':''}" href="${href}" aria-label="${esc(T(it.label))}" title="${esc(T(it.label))}" ${active?'aria-current="page"':''}>
          <span class="material-icons-o">${it.icon}</span>${T(it.label)}
          ${count!=null && count>0 ? `<span class="badge-count">${count}</span>`:''}
        </a>`;
      }).join('')}
    </div>`).join('');
  // topbar role active state
  const roleName = document.getElementById('role-name');
  if(roleName){
    const p = getPerson(state.currentUser);
    roleName.textContent = p.name;
  }
}

function renderTopbar(){
  const el = document.getElementById('topbar-right');
  const p = getPerson(state.currentUser);
  const langLabel = state.lang==='en' ? '中 / EN' : 'EN / 中';
  el.innerHTML = `
    <button class="icon-btn" title="${T('Notifications')}" aria-label="${T('Notifications')}" onclick="A.nav('#/tasks')"><span class="material-icons-o">notifications_none</span><span class="dot"></span></button>
    <button class="btn btn-secondary btn-sm" style="border-radius:20px;" onclick="A.toggleLang()">${langLabel}</button>
    <button class="icon-btn" title="${T('Appearance')}" aria-label="${T('Appearance')}" onclick="A.openAppearance()"><span class="material-icons-o">palette</span></button>
    <div class="role-pill" onclick="A.openRoleSwitcher()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();A.openRoleSwitcher()}" tabindex="0" role="button" aria-label="${T('Switch demo role')}">
      ${avatarHtml(p)}
      <span id="role-name">${esc(p.name)}</span>
      <span class="demo-tag">${T('Demo role')}</span>
    </div>`;
  const noteEl = document.getElementById('workspace-note');
  if(noteEl) noteEl.textContent = T('Prototype data only · External sends, real emails, and model calls are simulated.');
  const stateEl = document.getElementById('workspace-state');
  if(stateEl) stateEl.textContent = T('Resume Screening');
  const brandEl = document.getElementById('brand-context');
  if(brandEl) brandEl.textContent = T('Resume Screening');
}

/* ---------------------------------------------------------------
   Actions registry (exposed globally as `A`)
   --------------------------------------------------------------- */
const A = {
  nav(route){ navigate(route); },
  closeModal(){ closeModal(); },
  closeDrawer(){ closeDrawer(); },
  runPendingConfirm(){ const fn = window.__pendingConfirm; closeModal(); if(fn) fn(); },
  toastAction(id){ const t = state.toasts.find(x=>x.id===id); if(t && t.actionFn) t.actionFn(); state.toasts = state.toasts.filter(x=>x.id!==id); renderToasts(); },

  toggleLang(){ state.lang = state.lang==='en' ? 'zh' : 'en'; renderTopbar(); renderNav(); renderRoute(); },

  openAppearance(){
    openModal(`
      <div class="modal-header"><h3 class="modal-title">${T('Appearance')}</h3>
        <button class="close-x" onclick="A.closeModal()"><span class="material-icons-o">close</span></button></div>
      <div class="modal-body">
        <div class="field"><label>${T('Theme')}</label>
          <div class="flex gap-8 flex-wrap">
            ${['light','dark','deep','system'].map(t=>`<button class="btn btn-sm ${state.theme===t?'btn-primary':'btn-secondary'}" onclick="A.setTheme('${t}')">${T(cap(t))}</button>`).join('')}
          </div>
        </div>
        <div class="field"><label>${T('Accent color')}</label>
          <div class="flex gap-8 flex-wrap">
            ${['blue','teal','violet'].map(c=>`<button class="btn btn-sm ${state.accent===c?'btn-primary':'btn-secondary'}" onclick="A.setAccent('${c}')">${T(cap(c))}</button>`).join('')}
          </div>
        </div>
        <div class="field"><label>${T('Text size')}</label>
          <div class="flex gap-8 flex-wrap">
            ${['small','medium','large'].map(s=>`<button class="btn btn-sm ${state.textSize===s?'btn-primary':'btn-secondary'}" onclick="A.setTextSize('${s}')">${T(cap(s))}</button>`).join('')}
          </div>
        </div>
        <p class="tiny">${T('Preferences are saved for this session and this demo role. Production HireOS syncs Appearance to your account across devices.')}</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-text" onclick="A.resetAppearance()">${T('Reset to defaults')}</button>
        <button class="btn btn-primary" onclick="A.closeModal()">${T('Done')}</button>
      </div>`);
  },
  setTheme(t){ state.theme=t; applyAppearance(); A.openAppearance(); },
  setAccent(c){ state.accent=c; applyAppearance(); A.openAppearance(); },
  setTextSize(s){ state.textSize=s; applyAppearance(); A.openAppearance(); },
  resetAppearance(){ state.theme='light'; state.accent='teal'; state.textSize='medium'; applyAppearance(); A.openAppearance(); toast(T('Appearance reset to defaults')); },

  openRoleSwitcher(){
    openModal(`
      <div class="modal-header"><h3 class="modal-title">${T('Switch demo role')}</h3>
        <button class="close-x" onclick="A.closeModal()"><span class="material-icons-o">close</span></button></div>
      <div class="modal-body">
        <p class="tiny" style="margin-bottom:14px;">${T('This switches which person\'s "My Tasks" and permissions the prototype shows. It does not represent real authentication.')}</p>
        ${Object.values(state.db.people).map(p=>`
          <div class="radio-card ${state.currentUser===p.id?'selected':''}" style="margin-bottom:8px;" onclick="A.setRole('${p.id}')">
            ${avatarHtml(p,'md')}
            <div><div style="font-weight:500;">${esc(p.name)}</div><div class="tiny">${esc(p.title)} · ${esc(p.role)}</div></div>
          </div>`).join('')}
      </div>
      <div class="modal-footer"><button class="btn btn-secondary" onclick="A.closeModal()">${T('Close')}</button></div>`);
  },
  setRole(id){ state.currentUser=id; closeModal(); renderTopbar(); renderRoute(); toast(`${T('Switched to')} ${getPerson(id).name} (${T('Demo role')})`); },
};

function applyAppearance(){
  const root = document.documentElement;
  if(state.theme==='system'){ root.removeAttribute('data-theme'); }
  else { root.setAttribute('data-theme', state.theme); }
  root.setAttribute('data-accent', state.accent);
  root.setAttribute('data-text', state.textSize);
  const navEl = document.getElementById('sidenav');
  if(navEl) navEl.classList.toggle('collapsed', !!state.sidenavCollapsed);
}
A.toggleSidenav = function(){
  state.sidenavCollapsed = !state.sidenavCollapsed;
  applyAppearance();
};

/* ---------------------------------------------------------------
   Boot
   --------------------------------------------------------------- */
function boot(){
  applyAppearance();
  renderTopbar();
  renderNav();
  renderRoute();
  if(!location.hash) navigate('#/tasks');
}
document.addEventListener('DOMContentLoaded', boot);

/* === PAGES REGISTRY START === */

</script>

<script>
/* ---- page_tasks.js ---- */
/* ===================================================================
   PAGE: My Tasks  (#/tasks)
   =================================================================== */
const TASK_TYPE_LABEL = {
  duplicate_review:'Duplicate / identity review', link_confirmation:'Job link confirmation', screening_review:'Screening review',
  next_step:'Next-step decision', comparison_review:'Comparison review', delivery_exception:'Delivery exception', ownership_assignment:'Needs owner',
};
const TASK_TYPE_ICON = {
  duplicate_review:'content_copy', link_confirmation:'link', screening_review:'fact_check', next_step:'call_split',
  comparison_review:'compare_arrows', delivery_exception:'report_problem', ownership_assignment:'person_add',
};

function taskCandidateHtml(t){
  const cand = t.candidateId ? getCandidate(t.candidateId) : null;
  const candidateContent = cand
    ? `<a href="#/candidates/${cand.id}">${esc(cand.displayName)}</a>`
    : (t.candidateLabel ? esc(t.candidateLabel) : `<span class="muted">—</span>`);
  return `<div class="task-subject-stack"><div class="task-candidate">${candidateContent}</div></div>`;
}
function taskJobHtml(t){
  const job = t.jobId ? getJob(t.jobId) : null;
  const jobContent = job
    ? `<a href="#/jobs/${job.id}/screening">${esc(job.title)}</a>`
    : (t.jobLabel ? esc(t.jobLabel) : `<span class="muted">${T('No job linked')}</span>`);
  return `<div class="task-subject-stack"><div class="task-job">${jobContent}</div></div>`;
}
function taskNextActionLabel(t){
  return T('Open', 'Open (action)');
}

function taskStatsFor(list){
  const open = list.filter(t=>t.status==='open'||t.status==='in_progress');
  const waiting = list.filter(t=>t.status==='waiting');
  const overdue = list.filter(t=> t.dueAt && new Date(t.dueAt).getTime()<Date.now() && (t.status==='open'||t.status==='in_progress'));
  const dueToday = list.filter(t=> t.dueAt && sameDay(t.dueAt, new Date()) && (t.status==='open'||t.status==='in_progress'));
  const completed = list.filter(t=>t.status==='completed');
  return { unfinished: open.length+waiting.length, open:open.length, waiting:waiting.length, overdue:overdue.length, dueToday:dueToday.length, completed:completed.length };
}
function sameDay(iso,d2){ const d1=new Date(iso); return d1.getFullYear()===d2.getFullYear() && d1.getMonth()===d2.getMonth() && d1.getDate()===d2.getDate(); }
let overviewFilters = { days:7, jobId:'all' };
function overviewMetrics(){
  const cutoff = Date.now() - overviewFilters.days*86400000;
  const jobId = overviewFilters.jobId;
  const jobMatch = item => jobId==='all' || item.jobId===jobId;
  const scopedApps = state.db.applications.filter(jobMatch);
  const scopedRecs = state.db.recommendations.filter(jobMatch);
  const candidateIds = new Set(scopedApps.map(a=>a.candidateId));
  scopedRecs.forEach(r=>candidateIds.add(r.candidateId));
  if(jobId==='all') Object.keys(state.db.candidates).forEach(id=>candidateIds.add(id));
  const versions = Object.values(RESUME_VERSIONS).flat().filter(v=>v.uploadedAt && new Date(v.uploadedAt).getTime()>=cutoff && candidateIds.has(Object.keys(RESUME_VERSIONS).find(id=>(RESUME_VERSIONS[id]||[]).some(x=>x.id===v.id))));
  const sourceCounts = { manual:0, email:0, folder:0, api:0 };
  versions.forEach(v=>{ const source=(v.source||'').toLowerCase(); if(source.includes('manual')) sourceCounts.manual++; else if(source.includes('email')) sourceCounts.email++; else if(source.includes('folder')) sourceCounts.folder++; else if(source.includes('api')) sourceCounts.api++; });
  const evaluations = scopedApps.map(a=>state.db.evaluations[a.id]).filter(ev=>ev && ev.completedAt && new Date(ev.completedAt).getTime()>=cutoff);
  const passed = evaluations.filter(ev=>ev.eligibilityStatus==='eligible' && ev.evaluationStatus!=='insufficient_evidence' && ev.overall>=65).length;
  const scopedTasks = state.db.tasks.filter(t=>jobMatch(t) && (!t.createdAt || new Date(t.createdAt).getTime()>=cutoff));
  const openCount = scopedTasks.filter(t=>t.assignee===state.currentUser && (t.status==='open'||t.status==='in_progress')).length;
  const pending = scopedRecs.filter(r=>r.status==='proposed' && r.createdAt && new Date(r.createdAt).getTime()>=cutoff).length;
  return { resumeAdditions:versions.length, sourceCounts, screenedCount:evaluations.length, passRate:evaluations.length?Math.round(passed/evaluations.length*100):0, pendingResumeConfirmations:pending, openCount };
}

function renderTaskRow(t, opts){
  opts = opts||{};
  const assigneeCell = t.assignee ? esc(getPerson(t.assignee).name) : (t.queue ? `<span class="tag"><span class="material-icons-o" style="font-size:13px;">groups</span>${esc(T(t.queue))}</span>` : `<span class="badge badge-warning">${T('Unassigned')}</span>`);
  return `<tr class="hoverable-row">
    <td>${taskCandidateHtml(t)}</td>
    <td>${taskJobHtml(t)}</td>
    <td>${taskStatusBadge(t)}</td>
    <td>${assigneeCell}</td>
    <td class="text-right">
      <a class="btn btn-sm btn-secondary" href="${t.linkRoute||'#'}">${taskNextActionLabel(t)}</a>
    </td>
  </tr>`;
}

function renderTasksPage(){
  const all = state.db.tasks;
  const mine = all.filter(t=>t.assignee===state.currentUser);
  const claimable = all.filter(t=>!t.assignee && t.status==='open');
  const followed = all.filter(t=>t.createdOrFollowed || (t.assignee!==state.currentUser && t.assignee));
  const completed = all.filter(t=>t.status==='completed');
  const tab = (new URLSearchParams(location.hash.split('?')[1]||'')).get('tab') || 'all';

  const stats = taskStatsFor(mine);
  const overview = overviewMetrics();
  const source = overview.sourceCounts;

  const tabsDef = [
    { id:'all', label:'All tasks', count: all.filter(t=>t.status!=='cancelled').length },
    { id:'mine', label:'My tasks', count: mine.filter(t=>t.status!=='cancelled').length },
    { id:'advancement', label:'Pending advancement', count: all.filter(t=>taskBucket(t)==='advancement').length },
    { id:'confirmation', label:'Pending confirmation', count: all.filter(t=>taskBucket(t)==='confirmation').length },
    { id:'completed', label:'Completed', count: completed.length },
  ];

  let listHtml;
  const cols = `<tr><th>${T('Candidate')}</th><th>${T('Job')}</th><th>${T('Status')}</th><th>${T('Assignee')}</th><th>${T('Open', 'Open (action)')}</th></tr>`;
  if(tab==='all'){
    const rows = all.filter(t=>t.status!=='cancelled');
    listHtml = rows.length ? `<table class="data-table task-table"><thead>${cols}</thead><tbody>${rows.map(t=>renderTaskRow(t)).join('')}</tbody></table>`
      : emptyState({icon:'task_alt', title:T('No tasks yet'), body:''});
  } else if(tab==='mine'){
    const rows = mine.filter(t=>t.status!=='cancelled');
    listHtml = rows.length ? `<table class="data-table task-table"><thead>${cols}</thead><tbody>${rows.map(t=>renderTaskRow(t)).join('')}</tbody></table>`
      : emptyState({icon:'task_alt', title:T('Nothing assigned to you right now'), body:T('Check All tasks, or come back after new material is imported.')});
  } else if(tab==='advancement' || tab==='confirmation'){
    const rows = all.filter(t=>taskBucket(t)===tab);
    listHtml = rows.length ? `<table class="data-table task-table"><thead>${cols}</thead><tbody>${rows.map(t=>renderTaskRow(t)).join('')}</tbody></table>`
      : emptyState({icon:'inbox', title:T('No tasks in this status'), body:''});
  } else {
    listHtml = completed.length ? `<table class="data-table task-table"><thead>${cols}</thead><tbody>${completed.map(t=>renderTaskRow(t)).join('')}</tbody></table>`
      : emptyState({icon:'done_all', title:T('Nothing completed yet'), body:''});
  }

  return `
  ${pageHeader('Overview', '', `
    <a class="btn btn-primary" href="#/imports/new"><span class="material-icons-o">upload</span>${T('Upload resumes')}</a>
  `)}
  <section class="task-metric-section" aria-labelledby="my-work-heading">
    <div class="task-metric-head"><div class="task-metric-kicker" id="my-work-heading">${T('Workspace overview')}</div><div class="overview-filters"><select aria-label="${T('Time range')}" onchange="A.setOverviewDays(this.value)"><option value="1" ${overviewFilters.days===1?'selected':''}>${T('1 day')}</option><option value="7" ${overviewFilters.days===7?'selected':''}>${T('7 days')}</option><option value="30" ${overviewFilters.days===30?'selected':''}>${T('30 days')}</option></select><select aria-label="${T('Job filter')}" onchange="A.setOverviewJob(this.value)"><option value="all">${T('All jobs')}</option>${Object.values(state.db.jobs).map(job=>`<option value="${job.id}" ${overviewFilters.jobId===job.id?'selected':''}>${esc(job.title)}</option>`).join('')}</select></div></div>
    <div class="task-metric-grid workspace">
      <button class="task-metric-card" onclick="A.setTaskTab('mine')">
        <span class="task-metric-icon"><span class="material-icons-o">pending_actions</span></span>
        <span class="task-metric-number">${overview.openCount}</span><span class="task-metric-label">${T('Open / in progress')}</span><span class="task-metric-meta">${T('assigned workload')}</span>
      </button>
      <button class="task-metric-card" onclick="A.nav('#/library')">
        <span class="task-metric-icon"><span class="material-icons-o">note_add</span></span>
        <span class="task-metric-number">${overview.resumeAdditions}</span><span class="task-metric-label">${T('Resume additions')}</span><span class="task-metric-meta">${T('Local upload')} ${source.manual} · ${T('Email')} ${source.email}<br>${T('Folder')} ${source.folder} · ${T('API')} ${source.api}</span>
      </button>
      <button class="task-metric-card" onclick="A.nav('#/jobs')">
        <span class="task-metric-icon"><span class="material-icons-o">fact_check</span></span>
        <span class="task-metric-number">${overview.screenedCount}</span><span class="task-metric-label">${T('Completed screenings')}</span><span class="task-metric-meta">${T('screening evaluation runs')}</span>
      </button>
      <button class="task-metric-card" onclick="A.nav('#/jobs')">
        <span class="task-metric-icon"><span class="material-icons-o">trending_up</span></span>
        <span class="task-metric-number">${overview.passRate}%</span><span class="task-metric-label">${T('Pass rate')}</span><span class="task-metric-meta">${T('advanced after screening')}</span>
      </button>
      <button class="task-metric-card" onclick="A.setTaskTab('mine')">
        <span class="task-metric-icon"><span class="material-icons-o">rule</span></span>
        <span class="task-metric-number">${overview.pendingResumeConfirmations}</span><span class="task-metric-label">${T('Resumes to confirm')}</span><span class="task-metric-meta">${T('identity or version review')}</span>
      </button>
    </div>
  </section>

  <div class="task-filter-tabs" role="tablist" aria-label="Task filters">
    ${tabsDef.map(td=>`<button class="task-filter-tab ${tab===td.id?'active':''}" role="tab" aria-selected="${tab===td.id}" onclick="A.setTaskTab('${td.id}')">${T(td.label)} <span class="cnt">(${td.count})</span></button>`).join('')}
  </div>
  <div class="card">${listHtml}</div>

  </div>`;
}

A.setTaskTab = function(tab){
  location.hash = '#/tasks?tab='+tab;
  renderRoute();
};
A.setOverviewDays = function(days){ overviewFilters.days = Number(days)||7; renderRoute(); };
A.setOverviewJob = function(jobId){ overviewFilters.jobId = jobId||'all'; renderRoute(); };
A.claimTask = function(taskId){
  const t = state.db.tasks.find(x=>x.id===taskId);
  if(!t) return;
  t.assignee = state.currentUser; t.queue=null; t.status='in_progress';
  toast(`${T('Claimed:')} ${t.title}`, 'success');
  renderRoute();
};
A.reassignTask = function(taskId, personId){
  const t = state.db.tasks.find(x=>x.id===taskId);
  if(!t) return;
  t.assignee = personId; t.status = t.status==='open'?'open':t.status;
  toast(`${T('Reassigned to')} ${getPerson(personId).name}`, 'success');
  renderRoute();
};
A.deferTask = function(taskId){
  const t = state.db.tasks.find(x=>x.id===taskId);
  if(!t) return;
  openModal(`
    <div class="modal-header"><h3 class="modal-title">${T('Defer task')}</h3><button class="close-x" onclick="A.closeModal()"><span class="material-icons-o">close</span></button></div>
    <div class="modal-body">
      <p class="tiny" style="margin-bottom:10px;">${T('Deferring requires a reason and a resume time. This does not count as completed.')}</p>
      <div class="field"><label>${T('Reason')}</label><textarea id="defer-reason" placeholder="${T('e.g. Waiting on candidate response')}">${esc(t.waitingReason||'')}</textarea></div>
      <div class="field"><label>${T('Resume in')}</label>
        <select id="defer-days"><option value="1">${T('1 day')}</option><option value="3" selected>${T('3 days')}</option><option value="7">${T('7 days')}</option></select>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="A.closeModal()">${T('Cancel')}</button><button class="btn btn-primary" onclick="A.confirmDefer('${taskId}')">${T('Defer task')}</button></div>`);
};
A.confirmDefer = function(taskId){
  const t = state.db.tasks.find(x=>x.id===taskId);
  const reason = document.getElementById('defer-reason').value || T('Deferred by user');
  const days = parseInt(document.getElementById('defer-days').value,10);
  t.status='waiting'; t.waitingReason=reason; t.resumeAt = daysFromNow(days);
  closeModal(); toast(T('Task deferred'), 'success'); renderRoute();
};

registerRoute('#/tasks', renderTasksPage);

</script>

<script>
/* ---- page_library.js ---- */
/* ===================================================================
   PAGES: Resume Library, Import, Duplicate Review
   =================================================================== */

/* ---------- Resume Library ---------- */
let libraryFilter = { q:'', status:'all' };

function candidateJobSummary(cid){
  const recs = getRecsForCandidate(cid);
  const apps = getApplicationsForCandidate(cid);
  const confirmedCount = apps.length;
  const pendingCount = recs.filter(r=>r.status==='proposed').length;
  return { confirmedCount, pendingCount, recs, apps };
}

function renderLibraryPage(){
  const cands = Object.values(state.db.candidates);
  const q = libraryFilter.q.toLowerCase();
  const filtered = cands.filter(c=>{
    if(q && !(c.displayName.toLowerCase().includes(q) || (c.tags||[]).join(' ').toLowerCase().includes(q) || c.contact.email.toLowerCase().includes(q))) return false;
    return true;
  });

  const rows = filtered.map(c=>{
    const jd = state.db.jobDiscovery[c.id] || {};
    const sum = candidateJobSummary(c.id);
    let statusBadge;
    if(sum.confirmedCount>0) statusBadge = `<span class="badge badge-success">${sum.confirmedCount} ${T('linked role')}${sum.confirmedCount>1?(state.lang==='zh'?'':'s'):''}</span>`;
    else if(sum.pendingCount>0) statusBadge = `<span class="badge badge-info">${sum.pendingCount} ${T('pending recommendation')}${sum.pendingCount>1?(state.lang==='zh'?'':'s'):''}</span>`;
    else if(jd.status==='no_match') statusBadge = `<span class="badge badge-neutral">${T('No matching roles')}</span>`;
    else if(jd.status==='no_open_jobs') statusBadge = `<span class="badge badge-neutral">${T('No open jobs')}</span>`;
    else if(jd.status==='failed') statusBadge = `<span class="badge badge-danger">${T('Matching failed')}</span>`;

A.runJobDiscovery = function(cid){
  const jd = state.db.jobDiscovery[cid] || (state.db.jobDiscovery[cid] = { status:'not_started' });
  jd.status = 'running';
  renderRoute();
  toast(T('Searching open, accessible roles for a match…'));
  setTimeout(()=>{
    const openJobs = Object.values(state.db.jobs).filter(j=>j.status==='open');
    const existingRecJobIds = getRecsForCandidate(cid).map(r=>r.jobId);
    const candidatesForNewRec = openJobs.filter(j=>!existingRecJobIds.includes(j.id));
    if(candidatesForNewRec.length===0){
      jd.status = getRecsForCandidate(cid).length ? 'recommendations_ready' : 'no_match';
      jd.reason = jd.reason || 'No new open roles found beyond existing recommendations.';
    } else {
      jd.status = 'no_match';
      jd.reason = 'Re-ran against the current open job set — no additional matches found this time.';
    }
    jd.lastRunAt = nowISO();
    getCandidate(cid).lastMatchedAt = nowISO();
    toast(T('Job matching finished'), 'success');
    renderRoute();
  }, 700);
};

/* ----- lightweight client-side classification (stands in for real parsing/AI in this prototype) ----- */
function guessNameFromFilename(fileName){
  let base = fileName.replace(/\.[a-z0-9]+$/i,'');
  base = base.replace(/[_\-.]+/g,' ');
  base = base.replace(/\b(resume|cv|profile|application|scan|scanned|final|updated|latest|copy|draft)\b/gi,' ');
  base = base.replace(/\bv\d+\b/gi,' ').replace(/\b\d+\b/g,' ');
  base = base.replace(/\s+/g,' ').trim();
  if(!base) return null;
  return base.split(' ').filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');
}
function levenshtein(a,b){
  a=(a||'').toLowerCase(); b=(b||'').toLowerCase();
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  const dp=[]; for(let i=0;i<=m;i++) dp.push([i]);
  for(let j=1;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
  return dp[m][n];
}
function candidateIdFromLinkedLabel(linked){
  if(!linked) return null;
  const bare = linked.replace(/\s*\([^)]*\)\s*$/,'');
  let cand = Object.values(state.db.candidates).find(c=>c.displayName===bare);
  if(linked.includes('Finance')) cand = Object.values(state.db.candidates).find(c=>c.displayName===bare && (c.tags||[]).includes('Finance')) || cand;
  return cand ? cand.id : null;
}
function classifyUploadedFile(fileName, sizeBytes){
  const sizeKB = Math.max(1, Math.round(sizeBytes/1024));
  if(sizeBytes > 25*1024*1024) return { kind:'too_large', sizeKB };
  const ext = (fileName.match(/\.([a-z0-9]+)$/i)||[,''])[1].toLowerCase();
  if(!['pdf','docx','txt'].includes(ext)) return { kind:'unsupported_type', sizeKB };
  const lower = fileName.toLowerCase();
  if(/locked|encrypted|protected/.test(lower)) return { kind:'quarantined', sizeKB };
  if(/scan/.test(lower) && ext==='pdf') return { kind:'parse_failed', sizeKB };

  const existingFile = state.db.files.find(f=>f.name.toLowerCase()===lower);
  if(existingFile) return { kind:'exact_file', sizeKB, matchCandidate: candidateIdFromLinkedLabel(existingFile.linked) };

  const guessedName = guessNameFromFilename(fileName);
  const candidates = Object.values(state.db.candidates);
  if(guessedName){
    const exact = candidates.find(c=>c.displayName.toLowerCase()===guessedName.toLowerCase());
    if(exact) return { kind:'new_resume_version', sizeKB, matchCandidate: exact.id, guessedName };
    const firstToken = guessedName.split(' ')[0].toLowerCase();
    const fuzzy = candidates.find(c=>{
      const d = levenshtein(c.displayName, guessedName);
      return (d>0 && d<=2) || (firstToken.length>2 && c.displayName.toLowerCase().startsWith(firstToken+' '));
    });
    if(fuzzy) return { kind:'possible_same_person', sizeKB, matchCandidate: fuzzy.id, guessedName };
  }
  return { kind:'new_candidate', sizeKB, name: guessedName || fileName.replace(/\.[a-z0-9]+$/i,'') };
}
function fileTypeLabel(fileName){ return ((fileName.match(/\.([a-z0-9]+)$/i)||[,''])[1]||'FILE').toUpperCase(); }
function registerImportedFile(it, linkedLabel, opts){
  opts = opts||{};
  state.db.files.push({ id:uid('file'), name:it.file, type:fileTypeLabel(it.file), sizeKB: it.sizeKB||120,
    source: it.demo ? ('Manual upload (demo batch)') : 'Manual upload', uploadedAt: nowISO(),
    readStatus: opts.readStatus || 'available', extraction: opts.extraction || 'complete',
    security: opts.security || 'passed', linked: linkedLabel || T('Unassigned') });
}
function ensureDuplicateTask(it, title, subjectLabel, candidateId){
  state.db.tasks.push({ id:'task-live-'+it.id, type:'duplicate_review', title, subjectLabel, module:'Resume Library',
    assignee: state.currentUser, priority:'normal', status:'open', createdAt: nowISO(), linkRoute:'#/duplicates/'+it.id, candidateId });
}

function applyImportOutcome(it){
  if(it.kind==='exact_file'){
    const cand = it.matchCandidate ? getCandidate(it.matchCandidate) : null;
    it.detail = cand ? `Identical to an existing file on ${esc(cand.displayName)} — content reused, this upload logged as a new source.`
      : `Identical to a file already on record — content reused, this upload logged as a new source.`;
    registerImportedFile(it, cand ? cand.displayName : T('Unassigned'));
  }
  else if(it.kind==='new_resume_version'){
    const cand = getCandidate(it.matchCandidate);
    const latest = (RESUME_VERSIONS[it.matchCandidate]||[])[0];
    it.detail = `Same contact details as ${esc(cand.displayName)}, newer content — needs confirmation.`;
    state.db.duplicateReviews[it.id] = { id:it.id, kind:'new_resume_version', status:'open',
      uploaded:{ fileName:it.file, uploadedAt: nowISO(), source:'Manual upload', uploadedBy: state.currentUser, name:cand.displayName, email: it.live ? null : cand.contact.email },
      existing:{ candidateId: it.matchCandidate, fileName: latest?latest.fileName:'—', uploadedAt: latest?latest.uploadedAt:null, source:'Manual upload' },
      basis: it.live ? ['File name matches an existing candidate in the library','Contact details were not extracted from this file yet — confirm before treating it as the same person']
                     : ['Same name, email and phone as existing candidate','Content differs — new achievements added','More recent upload date'],
      changeSummary: it.live ? '' : 'Adds a recent project and updated scope of ownership.', liveItemRef:it.id };
    registerImportedFile(it, cand.displayName);
    ensureDuplicateTask(it, `New resume version available: ${cand.displayName}`, it.file, it.matchCandidate);
  }
  else if(it.kind==='possible_same_person'){
    const cand = getCandidate(it.matchCandidate);
    const latest = (RESUME_VERSIONS[it.matchCandidate]||[])[0];
    it.detail = `Name matches ${esc(cand.displayName)}, contact details differ — identity unclear.`;
    state.db.duplicateReviews[it.id] = { id:it.id, kind:'possible_same_person', status:'open',
      uploaded: it.live
        ? { fileName:it.file, uploadedAt: nowISO(), source:'Manual upload', uploadedBy: state.currentUser, name: it.guessedName||cand.displayName, email:null, phone:null, location:null }
        : { fileName:it.file, uploadedAt: nowISO(), source:'Manual upload', uploadedBy: state.currentUser, name:'Alex Morgan', email:'alex.morgan.recruiting@example.com', phone:'+84 90 555 0177', location:'Hanoi, VN' },
      existing:{ candidateId: it.matchCandidate, fileName: latest?latest.fileName:'—', uploadedAt: latest?latest.uploadedAt:null, source: (cand.tags||[]).includes('Finance') ? 'Email import':'Manual upload',
        name:cand.displayName, email:cand.contact.email, phone:cand.contact.phone, location:cand.contact.location.value },
      basis: it.live ? ['Candidate name in the file name is similar to an existing record','Contact details were not extracted from this file — comparison is name-only until confirmed']
                     : ['Same display name','Different email and phone on file'], liveItemRef:it.id };
    registerImportedFile(it, cand.displayName);
    ensureDuplicateTask(it, `Possible duplicate candidate: ${it.guessedName||cand.displayName}`, 'Uploaded file vs. existing candidate', it.matchCandidate);
  }
  else if(it.kind==='new_candidate'){
    const cid = 'cand-live-'+it.id;
    const name = it.name || 'Unnamed candidate';
    state.db.candidates[cid] = { id:cid, displayName: name, identityStatus: it.demo ? 'confirmed' : 'provisional',
      contact:{ email: it.demo ? 'nina.torres.demo@example.com' : 'not-provided@example.com', phone: it.demo ? '+84 90 555 0190' : '', location:{value: it.demo?'Ho Chi Minh City, VN':'Not provided', status: it.demo?'known':'unknown'} },
      workAuth:{ value: it.demo?'Vietnamese citizen':'Not provided', status: it.demo?'known':'unknown' }, tags: it.demo ? ['Backend'] : ['Manual upload'], owner: state.currentUser, createdAt: nowISO(), lastMatchedAt: null,
      retention:'standard-24mo', libraryStatus:'available', compensationExpectation:null, missingFields: it.demo ? ['compensation_expectation'] : ['compensation_expectation','work_authorization','email','phone'],
      employment: it.demo ? [{ company:'Vantage Systems', title:'Backend Engineer', start:'2020-01', end:'Present', achievements:['Maintains service-level backend APIs for a mid-size fintech product'] }] : [],
      skills: it.demo ? ['Python','Django','PostgreSQL'] : [], education: it.demo ? [{ statement:'B.S. Computer Science, San Jose State University', period:'2015–2019' }] : [] };
    RESUME_VERSIONS[cid] = [{ id:'rv-'+cid, version:1, fileName: it.file, uploadedAt: nowISO(), source:'Manual upload', parseStatus:'succeeded', isLatest:true }];
    state.db.jobDiscovery[cid] = { status:'not_started' };
    it.newCandidateId = cid;
    it.detail = it.demo ? 'New candidate, no conflicts — added to the Resume Library. No job selected.' : `${name} — new candidate, no conflicts — added to the Resume Library. No job selected.`;
    state.db.tasks.push({ id:'task-live-'+it.id, type:'ownership_assignment', title:`New library entry needs an owner: ${name}`, subjectLabel:'Imported via Upload, unassigned', module:'Resume Library',
      assignee:null, queue:'Resume Library queue', priority:'normal', status:'open', createdAt: nowISO(), linkRoute:'#/candidates/'+cid, candidateId:cid });
    registerImportedFile(it, name);
    setTimeout(()=>{ A.runJobDiscovery(cid); }, 900);
  }
  else if(it.kind==='quarantined'){
    it.detail = 'File appears password-protected. Isolated for security review — not sent to parsing or AI.';
    registerImportedFile(it, T('Unassigned'), { extraction:'blocked', security:'quarantined' });
  }
  else if(it.kind==='parse_failed'){
    it.detail = 'Could not extract readable text from this scan. Duplicate check could not run — this is shown as incomplete, not “no duplicates found.”';
    registerImportedFile(it, T('Unassigned'), { extraction:'failed' });
  }
  else if(it.kind==='too_large'){
    it.detail = `File is ${(it.sizeKB/1024).toFixed(1)} MB — exceeds the 25 MB limit. Not uploaded.`;
  }
  else if(it.kind==='unsupported_type'){
    it.detail = 'Unsupported file type. Only PDF, DOCX and TXT are accepted. Not uploaded.';
  }
}
A.retryImportItem = function(itemId){
  const batch = state.importBatches.find(b=>b.items.some(x=>x.id===itemId));
  const it = batch && batch.items.find(x=>x.id===itemId);
  if(!it) return;
  it.status='processing'; renderRoute();
  setTimeout(()=>{ it.status='done'; it.detail=T('Retried — file is still unreadable. Try re-scanning at a higher quality or upload a text-based PDF.'); renderRoute(); }, 900);

/* Heuristic extraction of name / email / location from pasted profile text (stands in for real parsing). */
function extractProfileFields(text){
  const out = { name:'', email:'', location:'' };
  const t = (text||'').replace(/\r/g,'');
  const clean = v => (v||'').trim().replace(/^[\s:：\-–—|·•]+|[\s,，;；.。|·•]+$/g,'').slice(0,60);
  const em = t.match(/[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/);
  if(em) out.email = em[0];

  let m = t.match(/(?:姓名|名字|Full\s*name|Name)\s*[:：]\s*([^\n,，;；|]+)/i);
  if(m) out.name = clean(m[1]);
  if(!out.name){ m = t.match(/(?:我叫|我是)\s*([\u4e00-\u9fa5·]{2,4})/); if(m) out.name = clean(m[1]); }
  if(!out.name){ m = t.match(/(?:my name is|this is|i['’]m|i am)\s+([A-Z][A-Za-z'’.\-]+(?:\s+[A-Z][A-Za-z'’.\-]+){1,3})/); if(m) out.name = clean(m[1]); }
  if(!out.name){
    const first = t.split('\n').map(l=>l.trim()).find(l=>l.length>0) || '';
    const stripped = first.replace(/^(?:#+\s*|resume\s*[-–—:]\s*|cv\s*[-–—:]\s*)/i,'');
    if(/^[A-Z][A-Za-z'’.\-]+(?:\s+[A-Z][A-Za-z'’.\-]+){1,3}$/.test(stripped) || /^[\u4e00-\u9fa5·]{2,4}$/.test(stripped)) out.name = clean(stripped);
  }

  const cutLoc = v => clean((v||'').split(/[.!?]\s|[。！？]|\s{2,}|\s+(?:and|or|but|you|email|e-mail)\b|[，,]\s*(?:邮箱|电话|手机|做过|有)|[，,]\s*(?:and|but|you)\b|\s+(?:邮箱|电话|手机)/i)[0]);
  m = t.match(/(?:所在地|现居(?:地)?|居住地|地点|位置|Location|Based\s+in|Located\s+in|Living\s+in|Lives\s+in)\s*[:：]?\s*([^\n|；;·•]+)/i);
  if(m) out.location = cutLoc(m[1]);
  if(!out.location){ m = t.match(/\b([A-Z][A-Za-z.'’\- ]{1,30},\s*(?:[A-Z]{2}|[A-Z][A-Za-z .]{2,20})(?:,\s*(?:US|USA|UK|CA|CN|[A-Z][A-Za-z ]{2,20}))?)\b/); if(m && !/@/.test(m[1])) out.location = clean(m[1]); }
  if(!out.location){ m = t.match(/(北京|上海|深圳|广州|杭州|成都|南京|武汉|西安|苏州|天津|重庆|长沙|郑州|青岛|厦门|宁波|合肥)/); if(m) out.location = m[1]; }
  return out;
}
A.autoFillFromNotes = function(){
  const notes = document.getElementById('pp-notes');

  const found = extractProfileFields(notes.value);
  const map = [['pp-name','name','Full name'],['pp-email','email','Email'],['pp-loc','location','Location']];
  const filled = [];
  map.forEach(([id,key,label])=>{
    const el = document.getElementById(id);
    if(!el || !found[key]) return;
    if(el.value && el.dataset.auto!=='1') return;
    if(el.value===found[key]) return;
    el.value = found[key]; el.dataset.auto = '1';
    el.classList.add('autofilled'); filled.push(T(label));
    setTimeout(()=>el.classList.remove('autofilled'), 3000);
  });
  const hint = document.getElementById('pp-hint');
  if(hint && filled.length){
    hint.innerHTML = `<span class="material-icons-o" style="font-size:14px;vertical-align:-3px;color:var(--accent-600);">auto_awesome</span> ${T('Filled in from the pasted text — please check:')} <b>${filled.join(' · ')}</b>`;
  }
};

A.addMailbox = function(){
  const id = document.getElementById('mb-id').value, email = (document.getElementById('mb-email').value||'').trim().toLowerCase(), nm = (document.getElementById('mb-name').value||'').trim(), scope = document.getElementById('mb-scope').value, err = document.getElementById('mb-err');
  const auto = document.getElementById('mb-auto').checked, freq = document.getElementById('mb-freq').value;
  const fail = m=>{ err.textContent = m; };
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return fail(cpL('Enter a valid email address.','请输入有效的邮箱地址。'));
  if(state.db.connections.some(c=>c.kind==='email' && c.id!==id && String(c.account).toLowerCase()===email)) return fail(cpL('This mailbox is already connected.','该邮箱已经连接。'));
  const defName = cpL('Mailbox','邮箱')+' · '+email.split('@')[0];
  if(id){
    const c = state.db.connections.find(x=>x.id===id); if(!c) return;
    const changedAddr = String(c.account).toLowerCase()!==email;
    c.account = email; c.name = nm || defName; c.scope = scope; c.autoRead = auto; c.frequency = freq;
    if(changedAddr) c.status = 'authorization_required';
    state.db.activity.unshift({ id:uid('act'), op:'Mailbox edited', actor:state.currentUser, target:c.name+' — '+email, status:'succeeded', at: nowISO() });

  }
  const c = { id:uid('conn'), kind:'email', name: nm || defName, account:email, status:'connected', lastRead:nowISO(), scope, autoRead:auto, frequency:freq };
  state.db.connections.push(c);
  state.db.activity.unshift({ id:uid('act'), op:'Mailbox added', actor:state.currentUser, target:c.name+' — '+email, status:'succeeded', at: nowISO() });
  closeModal(); toast(cpL('Mailbox connected','邮箱已连接')+': '+c.name,'success'); renderRoute();
};
