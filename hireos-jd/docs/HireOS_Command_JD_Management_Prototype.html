<!doctype html>
<html lang="en">
<head>
<title>JD Management</title>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Material+Symbols+Rounded&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   HireOS Command — JD Management — Design System
   Shared token set with Resume Screening / Interview / Assessment.
   Google Workspace-inspired, light/dark/deep themes, 3 text sizes
   =================================================================== */

:root{
  --font: "Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Brand accent — Teal is the default direction (HireOS Command UI Guidelines §4.5) */
  --accent-50:#f0fdfa; --accent-100:#ccfbf1; --accent-300:#5eead4;
  --accent-500:#0d9488; --accent-600:#0f766e; --accent-700:#115e59;

  --bg:#eef2f6; --surface:#ffffff; --surface-alt:#f1f5f9;
  --border:#e5e7eb; --border-strong:#d1d5db;
  --text:#111827; --text-secondary:#4b5563; --text-tertiary:#9ca3af;
  --text-on-accent:#ffffff;

  --success-bg:#d1fae5; --success-text:#059669; --success-border:#a7f3d0; --success-ink:#ffffff;
  --warning-bg:#fef3c7; --warning-text:#b45309; --warning-border:#fde68a;
  --danger-bg:#fee2e2; --danger-text:#dc2626; --danger-border:#fecaca; --danger-ink:#ffffff;
  --info-bg:var(--accent-50); --info-text:var(--accent-700); --info-border:var(--accent-100);
  --neutral-bg:var(--surface-alt); --neutral-text:var(--text-secondary); --neutral-border:var(--border);
  --ai-bg:#f3e8ff; --ai-text:#7c3aed; --ai-border:#e9d5ff;

  --shadow-1: 0 1px 2px 0 rgba(17,24,39,.08), 0 1px 3px 1px rgba(17,24,39,.06);
  --shadow-2: 0 1px 3px 0 rgba(17,24,39,.10), 0 4px 8px 3px rgba(17,24,39,.08);
  --shadow-3: 0 4px 8px 3px rgba(17,24,39,.12), 0 1px 3px rgba(17,24,39,.12);

  --radius-sm:9px; --radius-md:14px; --radius-lg:18px; --radius-xl:20px;

  --fs-body:16px; --fs-sm:13px; --fs-xs:11px; --fs-lg:18px; --fs-xl:22px; --fs-h1:26px;
  --scale:1;
}

[data-text="small"]{ --fs-body:14px; --fs-sm:12px; --fs-xs:10px; --fs-lg:16px; --fs-xl:19px; --fs-h1:22px; }
[data-text="large"]{ --fs-body:18px; --fs-sm:15px; --fs-xs:13px; --fs-lg:21px; --fs-xl:25px; --fs-h1:30px; }

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="deep"]){
    --bg:#0f172a; --surface:#1e293b; --surface-alt:#334155;
    --border:#334155; --border-strong:#475569;
    --text:#f8fafc; --text-secondary:#d6deea; --text-tertiary:#aab8ca;
    --accent-50:rgba(45,212,191,.12); --accent-100:rgba(45,212,191,.20);
    --success-bg:rgba(16,185,129,.18); --success-text:#6ee7b7; --success-border:rgba(16,185,129,.35); --success-ink:#052e1f;
    --warning-bg:rgba(245,158,11,.18); --warning-text:#fcd34d; --warning-border:rgba(245,158,11,.35);
    --danger-bg:rgba(244,63,94,.18); --danger-text:#fda4af; --danger-border:rgba(244,63,94,.35); --danger-ink:#4c0519;
    --info-bg:var(--accent-50); --info-text:var(--accent-300); --info-border:var(--accent-100);
    --neutral-bg:var(--surface-alt); --neutral-text:var(--text-secondary); --neutral-border:var(--border);
    --ai-bg:rgba(167,139,250,.18); --ai-text:#c4b5fd; --ai-border:rgba(167,139,250,.35);
    --shadow-1: 0 1px 2px 0 rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.4);
    --shadow-2: 0 1px 3px 0 rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.4);
  }
}
[data-theme="dark"]{
  --bg:#0f172a; --surface:#1e293b; --surface-alt:#334155;
  --border:#334155; --border-strong:#475569;
  --text:#f8fafc; --text-secondary:#d6deea; --text-tertiary:#aab8ca;
  --accent-50:rgba(45,212,191,.12); --accent-100:rgba(45,212,191,.20);
  --success-bg:rgba(16,185,129,.18); --success-text:#6ee7b7; --success-border:rgba(16,185,129,.35); --success-ink:#052e1f;
  --warning-bg:rgba(245,158,11,.18); --warning-text:#fcd34d; --warning-border:rgba(245,158,11,.35);
  --danger-bg:rgba(244,63,94,.18); --danger-text:#fda4af; --danger-border:rgba(244,63,94,.35); --danger-ink:#4c0519;
  --info-bg:var(--accent-50); --info-text:var(--accent-300); --info-border:var(--accent-100);
  --neutral-bg:var(--surface-alt); --neutral-text:var(--text-secondary); --neutral-border:var(--border);
  --ai-bg:rgba(167,139,250,.18); --ai-text:#c4b5fd; --ai-border:rgba(167,139,250,.35);
  --shadow-1: 0 1px 2px 0 rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.4);
  --shadow-2: 0 1px 3px 0 rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.4);
}

[data-theme="deep"]{
  --bg:#0a0f1f; --surface:#16213a; --surface-alt:#1f2d4d;
  --border:#334155; --border-strong:#475569;
  --text:#f8fafc; --text-secondary:#d6deea; --text-tertiary:#aab8ca;
  --accent-50:rgba(45,212,191,.12); --accent-100:rgba(45,212,191,.20);
  --success-bg:rgba(16,185,129,.18); --success-text:#6ee7b7; --success-border:rgba(16,185,129,.35); --success-ink:#052e1f;
  --warning-bg:rgba(245,158,11,.18); --warning-text:#fcd34d; --warning-border:rgba(245,158,11,.35);
  --danger-bg:rgba(244,63,94,.18); --danger-text:#fda4af; --danger-border:rgba(244,63,94,.35); --danger-ink:#4c0519;
  --info-bg:var(--accent-50); --info-text:var(--accent-300); --info-border:var(--accent-100);
  --neutral-bg:var(--surface-alt); --neutral-text:var(--text-secondary); --neutral-border:var(--border);
  --ai-bg:rgba(167,139,250,.18); --ai-text:#c4b5fd; --ai-border:rgba(167,139,250,.35);
  --shadow-1: 0 1px 2px 0 rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.4);
  --shadow-2: 0 1px 3px 0 rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.4);
}

/* Accent themes — Teal (default), Blue, Violet (HireOS Command UI Guidelines §4.5) */
[data-accent="teal"]{ --accent-50:#f0fdfa; --accent-100:#ccfbf1; --accent-300:#5eead4; --accent-500:#0d9488; --accent-600:#0f766e; --accent-700:#115e59; }
[data-accent="blue"]{ --accent-50:#eff6ff; --accent-100:#dbeafe; --accent-300:#93c5fd; --accent-500:#2563eb; --accent-600:#1d4ed8; --accent-700:#1e40af; }
[data-accent="violet"]{ --accent-50:#f5f3ff; --accent-100:#ede9fe; --accent-300:#c4b5fd; --accent-500:#7c3aed; --accent-600:#6d28d9; --accent-700:#5b21b6; }
[data-theme="dark"][data-accent="teal"],[data-theme="deep"][data-accent="teal"]{ --accent-50:rgba(45,212,191,.12); --accent-100:rgba(45,212,191,.20); --accent-300:#5eead4; --accent-500:#5eead4; --accent-600:#2dd4bf; --accent-700:#99f6e4; --text-on-accent:#062a2a; }
[data-theme="dark"][data-accent="blue"],[data-theme="deep"][data-accent="blue"]{ --accent-50:rgba(96,165,250,.12); --accent-100:rgba(96,165,250,.20); --accent-300:#93c5fd; --accent-500:#93c5fd; --accent-600:#60a5fa; --accent-700:#bfdbfe; --text-on-accent:#0b1c33; }
[data-theme="dark"][data-accent="violet"],[data-theme="deep"][data-accent="violet"]{ --accent-50:rgba(167,139,250,.12); --accent-100:rgba(167,139,250,.20); --accent-300:#c4b5fd; --accent-500:#c4b5fd; --accent-600:#a78bfa; --accent-700:#ddd6fe; --text-on-accent:#1e1b33; }

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--text);
  font-size:var(--fs-body); line-height:1.5; -webkit-font-smoothing:antialiased;
}
a{ color:var(--accent-600); text-decoration:none; }
a:hover{ text-decoration:underline; }
button{ font-family:inherit; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

.material-icons-o{ font-family:'Material Symbols Rounded'; font-weight:normal; font-style:normal; font-size:18px; line-height:1; letter-spacing:normal; text-transform:none; display:inline-block; white-space:nowrap; word-wrap:normal; direction:ltr; -webkit-font-smoothing:antialiased; overflow:hidden; }

/* ---------- App shell ---------- */
#app{ display:flex; flex-direction:column; height:100vh; min-width:960px; }

.topbar{
  height:56px; flex:0 0 auto; display:flex; align-items:center; gap:14px;
  padding:0 16px; background:var(--surface); border-bottom:1px solid var(--border);
  position:relative; z-index:40;
}
.brand{ display:flex; align-items:center; gap:10px; font-size:var(--fs-lg); font-weight:500; color:var(--text); min-width:230px; cursor:pointer; }
.brand .logo{ width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,var(--accent-500),var(--accent-700)); display:flex; align-items:center; justify-content:center; color:var(--text-on-accent); font-weight:700; font-size:15px; flex:0 0 auto; }
.brand small{ display:block; font-size:var(--fs-xs); color:var(--text-tertiary); font-weight:400; }

.topbar-search{ flex:1; max-width:560px; display:flex; align-items:center; gap:8px; background:var(--surface-alt); border:1px solid transparent; border-radius:10px; padding:8px 16px; color:var(--text-secondary); font-size:var(--fs-sm); }
.topbar-search input{ border:0; background:transparent; outline:none; flex:1; color:var(--text); font-size:var(--fs-sm); font-family:inherit; }
.topbar-search:focus-within{ background:var(--surface); border-color:var(--accent-300); box-shadow:var(--shadow-1); }

.topbar-actions{ display:flex; align-items:center; gap:8px; margin-left:auto; }

.icon-btn{ width:36px; height:36px; border-radius:50%; border:none; background:transparent; color:var(--text-secondary); display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; overflow:hidden; font-size:0; flex:0 0 auto; }
.icon-btn .material-icons-o{ font-size:20px; }
.icon-btn:hover{ background:var(--surface-alt); }
.icon-btn .dot{ position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--danger-text); border:2px solid var(--surface); }

.role-pill{ display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:20px; padding:5px 12px 5px 6px; cursor:pointer; background:var(--surface); font-size:var(--fs-sm); color:var(--text); }
.role-pill:hover{ background:var(--surface-alt); }
.avatar{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:#fff; flex:0 0 auto; }
.role-pill .demo-tag{ font-size:var(--fs-xs); background:var(--warning-bg); color:var(--warning-text); border:1px solid var(--warning-border); padding:1px 6px; border-radius:8px; font-weight:600; letter-spacing:.02em; }

.shell{ flex:1; display:flex; min-height:0; }

.sidenav{ width:220px; flex:0 0 auto; background:var(--surface); border-right:1px solid var(--border); padding:12px 8px; overflow-x:hidden; overflow-y:auto; display:flex; flex-direction:column; transition:width .18s ease; }
.sidenav.collapsed{ width:52px; }
.sidenav-section{ margin-bottom:18px; }
.sidenav.collapsed .sidenav-section{ margin-bottom:10px; }
.sidenav-label{ font-family:var(--font-mono); font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.06em; color:var(--text-tertiary); padding:6px 12px; font-weight:600; }
.sidenav.collapsed .sidenav-label{ display:none; }
.sidenav.collapsed .sidenav-standalone-note{ display:none; }
.nav-item{ display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:8px; color:var(--text); font-size:var(--fs-sm); cursor:pointer; position:relative; margin-bottom:2px; }
.nav-item:hover{ background:var(--surface-alt); text-decoration:none; }
.nav-item.active{ background:var(--accent-100); color:var(--accent-700); font-weight:600; }
.nav-item .material-icons-o{ font-size:19px; color:inherit; opacity:.85; flex:0 0 auto; }
.nav-item .badge-count{ margin-left:auto; background:var(--neutral-bg); color:var(--neutral-text); font-size:var(--fs-xs); padding:1px 7px; border-radius:10px; font-weight:600; }
.nav-item.active .badge-count{ background:var(--accent-600); color:var(--text-on-accent); }
.sidenav.collapsed .nav-item{ justify-content:center; padding:9px; }
.sidenav.collapsed .nav-item .nav-label{ display:none; }
.sidenav.collapsed .nav-item .badge-count{ position:absolute; top:2px; right:2px; min-width:8px; width:8px; height:8px; padding:0; border-radius:50%; font-size:0; }
.sidenav-toggle{ display:flex; align-items:center; gap:12px; width:100%; margin-top:auto; padding:9px 12px; border:0; border-top:1px solid var(--border); border-radius:0; background:none; color:var(--text-secondary); font-size:var(--fs-sm); font-family:inherit; cursor:pointer; }
.sidenav-toggle:hover{ background:var(--surface-alt); }
.sidenav-toggle .material-icons-o{ font-size:19px; flex:0 0 auto; }
.sidenav.collapsed .sidenav-toggle{ justify-content:center; padding:9px; }
.sidenav.collapsed .sidenav-toggle .toggle-label{ display:none; }

.main{ flex:1; overflow-y:auto; position:relative; background:var(--bg); }
.main-inner{ max-width:1320px; margin:0 auto; padding:26px 32px 60px; }
.main-inner.wide{ max-width:none; }
.main-inner.flush{ max-width:none; padding:0; height:100%; }

/* ---------- Typography helpers ---------- */
.page-title{ font-size:var(--fs-h1); font-weight:400; margin:0 0 4px; color:var(--text); text-wrap:balance; }
.page-subtitle{ font-size:var(--fs-sm); color:var(--text-secondary); margin:0 0 20px; }
.section-title{ font-size:var(--fs-lg); font-weight:500; margin:0 0 12px; color:var(--text); text-wrap:balance; }
.eyebrow{ font-family:var(--font-mono); font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.07em; color:var(--text-tertiary); font-weight:600; }
.muted{ color:var(--text-secondary); }
.tiny{ font-size:var(--fs-xs); color:var(--text-tertiary); }
.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

.breadcrumbs{ display:flex; align-items:center; gap:6px; font-size:var(--fs-sm); color:var(--text-secondary); margin-bottom:10px; flex-wrap:wrap; }
.breadcrumbs a{ color:var(--text-secondary); }
.breadcrumbs .sep{ color:var(--text-tertiary); }
.breadcrumbs .current{ color:var(--text); font-weight:500; }

.page-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
.page-header .actions{ display:flex; gap:8px; flex-wrap:wrap; }

/* ---------- Buttons ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; font-size:var(--fs-sm); font-weight:500; padding:0 18px; height:34px; border-radius:10px; border:1px solid transparent; cursor:pointer; white-space:nowrap; line-height:1.2; transition:background .12s; }
.btn .material-icons-o{ font-size:18px; }
.btn-primary{ background:var(--accent-500); border-color:var(--accent-500); color:var(--text-on-accent); font-weight:700; }
.btn-primary:hover{ background:var(--accent-600); border-color:var(--accent-600); }
.btn-primary:disabled{ background:var(--neutral-bg); border-color:var(--neutral-bg); color:var(--text-tertiary); cursor:not-allowed; }
.btn-secondary{ background:var(--surface); color:var(--text-secondary); border-color:var(--border); height:32px; border-radius:9px; }
.btn-secondary:hover{ background:var(--surface-alt); }
.btn-text{ background:transparent; color:var(--text-secondary); padding:0 10px; height:32px; border-radius:9px; }
.btn-text:hover{ background:var(--surface-alt); }
.btn-danger{ background:transparent; color:var(--danger-text); border-color:var(--danger-border); height:32px; border-radius:9px; }
.btn-danger:hover{ background:var(--danger-bg); }
.btn-danger-solid{ background:var(--danger-text); border-color:var(--danger-text); color:var(--danger-ink); font-weight:700; }
.btn-danger-solid:hover{ opacity:.9; }
.btn-sm{ padding:0 12px; height:30px; font-size:var(--fs-xs); border-radius:9px; }
.btn-icon{ width:32px; height:32px; padding:0; border-radius:9px; background:transparent; border:1px solid var(--border); color:var(--text-secondary); }
.btn-icon:hover{ background:var(--surface-alt); }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }

/* ---------- Cards / surfaces ---------- */
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); overflow-x:auto; }
.card-pad{ padding:16px 18px; }
.card-hover:hover{ box-shadow:var(--shadow-1); }
.stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:20px; }
.stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 16px; cursor:pointer; }
.stat-card:hover{ border-color:var(--accent-300); box-shadow:var(--shadow-1); }
.stat-card .num{ font-size:26px; font-weight:600; color:var(--text); font-variant-numeric:tabular-nums; }
.stat-card .num.zero{ color:var(--text-tertiary); }
.stat-card .lbl{ font-size:var(--fs-xs); color:var(--text-secondary); margin-top:2px; }
.stat-card.unavailable .num{ font-size:var(--fs-sm); color:var(--danger-text); }

.section-block{ margin-bottom:28px; }
.collapse-toggle{ display:flex; align-items:center; gap:6px; background:none; border:none; color:var(--accent-600); font-size:var(--fs-sm); font-weight:500; cursor:pointer; padding:6px 0; }

/* ---------- Tables / lists ---------- */
table.data-table{ width:100%; border-collapse:collapse; font-size:var(--fs-sm); font-variant-numeric:tabular-nums; }
.data-table th{ text-align:left; font-family:var(--font-mono); font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.04em; color:var(--text-tertiary); font-weight:600; padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap; }
.data-table td{ padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
.data-table tr:last-child td{ border-bottom:none; }
.data-table tr.clickable:hover{ background:var(--surface-alt); cursor:pointer; }
.data-table tr.selected{ background:var(--accent-50); }

.list-row{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--border); }
.list-row:last-child{ border-bottom:none; }
.list-row:hover{ background:var(--surface-alt); }

/* ---------- Badges / chips ---------- */
.badge{ display:inline-flex; align-items:center; gap:4px; height:22px; font-size:11px; font-weight:600; padding:0 8px; border-radius:6px; border:1px solid; white-space:nowrap; }
.badge-success{ background:var(--success-bg); color:var(--success-text); border-color:var(--success-border); }
.badge-warning{ background:var(--warning-bg); color:var(--warning-text); border-color:var(--warning-border); }
.badge-danger{ background:var(--danger-bg); color:var(--danger-text); border-color:var(--danger-border); }
.badge-info{ background:var(--info-bg); color:var(--info-text); border-color:var(--info-border); }
.badge-neutral{ background:var(--neutral-bg); color:var(--neutral-text); border-color:var(--neutral-border); }
.badge-ai{ background:var(--ai-bg); color:var(--ai-text); border-color:var(--ai-border); }
.badge-outline{ background:transparent; color:var(--text-secondary); border-color:var(--border-strong); }
.badge .material-icons-o{ font-size:13px; }
.dot-indicator{ width:7px; height:7px; border-radius:50%; display:inline-block; }

.tag{ display:inline-flex; align-items:center; gap:4px; font-size:var(--fs-xs); padding:4px 11px; border-radius:9px; background:var(--surface-alt); color:var(--text-secondary); border:1px solid var(--border); }

.pill-tabs{ display:flex; gap:4px; background:var(--surface-alt); border-radius:20px; padding:3px; width:fit-content; }
.pill-tab{ padding:6px 16px; border-radius:16px; font-size:var(--fs-sm); font-weight:500; color:var(--text-secondary); cursor:pointer; border:none; background:transparent; }
.pill-tab.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-1); }

.underline-tabs{ display:flex; gap:22px; border-bottom:1px solid var(--border); margin-bottom:18px; flex-wrap:wrap; }
.u-tab{ padding:11px 2px; font-size:var(--fs-sm); font-weight:500; color:var(--text-secondary); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
.u-tab.active{ color:var(--accent-600); border-color:var(--accent-600); }
.u-tab .cnt{ color:var(--text-tertiary); font-weight:400; }

/* ---------- Forms ---------- */
.field{ margin-bottom:16px; }
.field label{ display:block; font-family:var(--font-mono); font-size:var(--fs-xs); font-weight:600; color:var(--text-secondary); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em; }

function fmtRelative(iso){
  if(!iso) return '—';

  return fmtDate(iso);
}

/* =====================================================================
   TOAST / MODAL / DRAWER (shared UI primitives)
   ===================================================================== */
function toast(msg, type, actionLabel, actionFn){
  const stack = document.getElementById('toast-stack');
  const el = document.createElement('div');
  el.className = 'toast'+(type?(' '+type):'');
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if(actionLabel){
    const btn = document.createElement('button');
    btn.className='toast-action'; btn.textContent=actionLabel;
    btn.onclick = ()=>{ actionFn&&actionFn(); el.remove(); };
    el.appendChild(btn);
  }
  stack.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3800);
}
let __modalStack = [];
function openModal(html, opts){
  opts = opts||{};
  const root = document.getElementById('overlay-root');
  const overlay = document.createElement('div');
  overlay.className='overlay'; overlay.tabIndex=-1;
  overlay.innerHTML = `<div class="modal-wrap${opts.wide?' wide':''}${opts.xwide?' xwide':''}">${html}</div>`;
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) closeModal(); });
  root.appendChild(overlay);
  document.addEventListener('keydown', escHandler);
  __modalStack.push(overlay);
  setTimeout(()=>{ const f=overlay.querySelector('[autofocus]')||overlay.querySelector('button,input,textarea,select'); f&&f.focus(); },10);
  return overlay;
}
function closeModal(){
  const overlay = __modalStack.pop();
  if(overlay) overlay.remove();
  if(!__modalStack.length) document.removeEventListener('keydown', escHandler);
}
function escHandler(e){ if(e.key==='Escape'){ closeModal(); } }
function openDrawer(html, opts){
  opts = opts||{};
  const root = document.getElementById('overlay-root');
  const overlay = document.createElement('div');
  overlay.className='overlay'+(opts.overlayClass?' '+opts.overlayClass:'');
  overlay.innerHTML = `<div class="drawer${opts.wide?' wide':''}${opts.drawerClass?' '+opts.drawerClass:''}">${html}</div>`;
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) closeModal(); });
  root.appendChild(overlay);
  document.addEventListener('keydown', escHandler);
  __modalStack.push(overlay);
  if(opts.drawerClass==='gemini-drawer-shell') setupGeminiResize(overlay);
  return overlay;
}

/* =====================================================================
   ROUTER
   ===================================================================== */
const ROUTES = [];
function route(pattern, handler){
  const keys = [];
  const re = new RegExp('^'+pattern.replace(/:[^/]+/g, m=>{ keys.push(m.slice(1)); return '([^/]+)'; })+'(?:\\?.*)?$');
  ROUTES.push({re, keys, handler});
}
function currentQuery(){
  const q = location.hash.split('?')[1] || '';
  const params = {};
  q.split('&').forEach(p=>{ if(!p) return; const [k,v]=p.split('='); params[decodeURIComponent(k)]=decodeURIComponent(v||''); });
  return params;
}
function go(hash){ location.hash = hash; }
window.addEventListener('hashchange', renderRoute);
function renderRoute(){
  let hash = location.hash.replace(/^#/,'') || '/home';
  const path = hash.split('?')[0];
  for(const r of ROUTES){
    const m = path.match(r.re) || hash.match(r.re);
    if(m){
      const params = {};
      r.keys.forEach((k,i)=>params[k]=m[i+1]);
      try{ r.handler(params, currentQuery()); }
      catch(e){ console.error(e); document.getElementById('main-content').innerHTML = errorState('Something went wrong', e.message); }
      renderSidenav(); renderTopbar();
      window.scrollTo(0,0);
      document.getElementById('main-root').scrollTop = 0;
      return;
    }
  }
  document.getElementById('main-content').innerHTML = emptyState('search_off','Page not found','This route does not exist in the prototype.', [{label:'Go to Home', onclick:"A.go('#/home')"}]);
}
function setMain(html, wide){
  document.getElementById('main-content').innerHTML = html;
  document.getElementById('main-content').className = 'main-inner'+(wide?' '+wide:'');
}

function pageHeader(title, subtitle, actionsHtml, crumbs){
  let bc = '';
  if(crumbs && crumbs.length){
    bc = '<div class="breadcrumbs">'+crumbs.map((c,i)=>{
      const isLast = i===crumbs.length-1;
      const sep = i>0 ? '<span class="sep material-icons-o" style="font-size:14px;">chevron_right</span>' : '';
      return sep + (isLast||!c.href ? `<span class="${isLast?'current':''}">${esc(c.label)}</span>` : `<a href="${c.href}">${esc(c.label)}</a>`);
    }).join('') + '</div>';
  }
  return `${bc}<div class="page-header"><div><h1 class="page-title">${esc(title)}</h1>${subtitle?`<p class="page-subtitle">${subtitle}</p>`:''}</div>${actionsHtml?`<div class="actions">${actionsHtml}</div>`:''}</div>`;
}
function emptyState(icon, title, body, actions){
  return `<div class="empty-state"><span class="material-icons-o">${icon}</span><h3>${esc(title)}</h3><p>${body}</p>
    ${actions?`<div class="actions">${actions.map(a=>`<button class="btn ${a.primary?'btn-primary':'btn-secondary'}" onclick="${a.onclick}">${esc(a.label)}</button>`).join('')}</div>`:''}</div>`;

    <div class="modal-header"><h3 class="modal-title">${esc(t.title)}</h3><button class="close-x" onclick="closeModal()"><span class="material-icons-o">close</span></button></div>

      <div class="field"><label>Assignee</label><div>${t.assignee?personChip(t.assignee):(t.queue?'<span class="tiny">Queue: '+esc(t.queue)+'</span>':'<span class="tiny">Unassigned</span>')}</div></div>

    </div>
    <div class="modal-footer" style="justify-content:space-between;">
      <div class="flex gap-8">
        ${canClaim?`<button class="btn btn-secondary" onclick="A.claimTask('${t.id}')">Claim</button>`:''}
        ${isMine && t.status==='open'?`<button class="btn btn-secondary" onclick="A.startTask('${t.id}')">Start</button>`:''}
        ${isMine && ['open','in_progress'].includes(t.status)?`<button class="btn btn-text" onclick="A.deferTask('${t.id}')">Defer</button>`:''}
        ${isMine && t.status==='waiting'?`<button class="btn btn-secondary" onclick="A.resumeTask('${t.id}')">Resume</button>`:''}
        ${isMine && t.status!=='completed'?`<button class="btn btn-text" onclick="A.reassignTask('${t.id}')">Reassign</button>`:''}

        <button class="btn btn-secondary" onclick="closeModal()">Close</button>

};

function jobsForSavedView(view){
  const all = Object.values(state.jobs);
  const u = state.currentUserId;
  switch(view){
    case 'My Jobs': return all.filter(j=>j.owner===u||j.hiringManager===u||j.recruiter===u);
    case 'Hiring Now': return all.filter(j=>j.hiringStatus==='open');
    case 'Needs My Attention': return all.filter(j=> (j.approvalStatus==='pending' && (state.approvals[j.id]||{}).steps && (state.approvals[j.id].steps.find(s=>s.status==='active')||{}).assignee===u) || (j.hiringManager===u && j.collaborationStatus==='in_collaboration'));
    case 'Drafts': return all.filter(j=>j.hiringStatus==='draft');
    case 'Pending Approval': return all.filter(j=>j.approvalStatus==='pending');
    case 'Recently Updated': return all.slice().sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
    case 'Paused': return all.filter(j=>j.hiringStatus==='paused');
    case 'Closed': return all.filter(j=>j.hiringStatus==='closed');
    case 'Archived': return all.filter(j=>j.hiringStatus==='archived');
    default: return all;
  }
}

function docKey(jobId, audience){ return jobId+':'+audience; }
function getDraft(jobId, audience){
  const key = docKey(jobId,audience);
  if(!state.drafts[key]) state.drafts[key] = buildDefaultDraft(jobId, audience);
  return state.drafts[key];
}
function buildDefaultDraft(jobId, audience){
  const j = state.jobs[jobId];
  const rv = j.activeRoleVersionRef ? ROLE_VERSIONS[j.activeRoleVersionRef] : null;
  const reqs = state.requirements[jobId] || [];
  const must = reqs.filter(r=>r.priority==='must_have').map(r=>r.statement);
  const pref = reqs.filter(r=>r.priority==='preferred').map(r=>r.statement);
  const blocks = [];
  let n = 1; const bid = ()=>'d'+jobId.slice(-3)+'-'+(n++);
  blocks.push(mkBlock(bid(),'h2', j.title + (audience==='external' ? '' : ' — '+j.department)));
  blocks.push(mkBlock(bid(),'p', rv ? rv.roleSummary : (j.hiringStatus==='draft' ? 'This job has no confirmed requirements yet. Start a conversation with Copilot, or upload source material, to draft this document.' : 'No role summary on file.')));
  if(rv && rv.responsibilities && rv.responsibilities.length){
    blocks.push(mkBlock(bid(),'h2', audience==='external' ? 'What you’ll do' : 'Responsibilities'));
    blocks.push(mkBlock(bid(),'ul', rv.responsibilities));
  }
  if(must.length){
    blocks.push(mkBlock(bid(),'h2', audience==='external' ? 'What we’re looking for' : 'Requirements — Must-have'));
    blocks.push(mkBlock(bid(),'ul', must));
  }
  if(audience==='internal' && pref.length){
    blocks.push(mkBlock(bid(),'h2', 'Preferred'));
    blocks.push(mkBlock(bid(),'ul', pref));
  }
  blocks.push(mkBlock(bid(),'h2', 'Compensation'));
  blocks.push(mkBlock(bid(),'p', money(rv ? rv.publicCompensation : null) + (audience==='internal' ? ' public. Internal ceiling is restricted — see Requirements → Compensation.' : ', plus benefits.')));
  return { id:'doc-'+jobId+'-'+audience, jobId, audience, language:'en', revision:1, saveState:'saved', blocks };
}
function getSuggestions(jobId, audience){ return state.suggestions[docKey(jobId,audience)] || (state.suggestions[docKey(jobId,audience)]=[]); }
function getThreads(jobId, audience){ return state.comments[docKey(jobId,audience)] || (state.comments[docKey(jobId,audience)]=[]); }
function pendingSuggestionsFor(jobId, audience, blockId){
  return getSuggestions(jobId, audience).filter(s=>s.status==='proposed' && (!blockId || s.anchorBlock===blockId));
}

function renderDocBlock(jobId, audience, b){
  const suggestions = pendingSuggestionsFor(jobId, audience, b.id);
  const threads = getThreads(jobId, audience).filter(t=>t.anchorBlock===b.id);
  const openThreadCount = threads.filter(t=>t.status==='open').length;
  let inner = '';
  const req = b.requirementRefs && b.requirementRefs[0] ? (REQUIREMENTS[jobId]||[]).find(r=>r.id===b.requirementRefs[0]) : null;

  function withMarks(text, forListItem){
    let html = esc(text);
    const activeSug = suggestions.find(s=> s.oldText && text.indexOf(s.oldText)>=0);
    if(activeSug){
      html = esc(text).replace(esc(activeSug.oldText), `<span class="del">${esc(activeSug.oldText)}</span><span class="ins">${esc(activeSug.newText)}</span><span class="mark-badge ${activeSug.author==='ai'?'ai':'human'}">${activeSug.author==='ai'?'AI':'Maya'}</span>`);
    }
    return html;
  }

  if(b.kind==='h2') inner = `<h2 class="docH">${withMarks(b.text)}</h2>`;
  else if(b.kind==='h3') inner = `<h3 class="docH3">${withMarks(b.text)}</h3>`;
  else if(b.kind==='p') inner = `<p class="docP${b.role==='requirement'?'':' presentation-only'}">${withMarks(b.text)}</p>`;
  else if(b.kind==='ul') inner = `<ul class="docList">${b.text.map(t=>`<li>${withMarks(t)}</li>`).join('')}</ul>`;

  return `<div class="doc-block${openThreadCount>0?' has-comment':''}" data-block-id="${b.id}" data-job="${jobId}">
    ${inner}
    ${openThreadCount>0?`<span class="comment-anchor" title="${openThreadCount} comment(s)" onclick="A.openCommentsFor('${b.id}')">${openThreadCount}</span>`:''}
    ${suggestions.some(s=>s.status==='stale')?`<span class="stale-flag"><span class="material-icons-o" style="font-size:11px;">restore</span>Needs refresh</span>`:''}
  </div>`;
}
function renderSidePanel(jobId, audience){
  const tabs = [{key:'copilot',label:'Copilot'},{key:'comments',label:'Comments'},{key:'changes',label:'Changes'}];
  const activeTab = state.wsSideTab || 'copilot';
  return `<div class="jw-side">
    <div class="jw-side-tabs" id="jw-side-tabs">${tabs.map(t=>{
      let count = '';
      if(t.key==='comments') count = ' ('+getThreads(jobId,audience).filter(x=>x.status==='open').length+')';
      if(t.key==='changes') count = ' ('+getSuggestions(jobId,audience).filter(x=>x.status==='proposed'||x.status==='stale').length+')';
      return `<div class="jw-side-tab${activeTab===t.key?' active':''}" onclick="A.setSideTab('${t.key}')">${t.label}${count}</div>`;
    }).join('')}</div>
    <div class="jw-side-body" id="jw-side-body">${renderSideTabBody(jobId, audience, activeTab)}</div>
  </div>`;
}
function renderSideTabBody(jobId, audience, tabKey){

  return `<div class="copilot-msg"><div class="who"><span class="material-icons-o" style="font-size:15px;">auto_awesome</span>Copilot</div><div class="bubble">${esc(m.text)}</div></div>`;

/* ---------------- Selection handling & floating toolbar ---------------- */
function bindSelectionHandlers(jobId){
  const docEl = document.getElementById('jw-doc');
  if(!docEl) return;
  docEl.addEventListener('mouseup', ()=>{
    setTimeout(()=>{
      const sel = window.getSelection();
      const txt = sel && sel.toString().trim();
      const slot = document.getElementById('sel-toolbar-slot');
      if(slot) slot.innerHTML='';
      if(!txt || txt.length<2 || state.wsMode==='viewing') return;
      if(!sel.anchorNode || !docEl.contains(sel.anchorNode)) return;
      const range = sel.getRangeAt(0);
      const rect = range.getBoundingClientRect();
      const wrapRect = document.getElementById('doc-wrap').getBoundingClientRect();
      const blockEl = sel.anchorNode.parentElement ? sel.anchorNode.parentElement.closest('.doc-block') : null;
      const blockId = blockEl ? blockEl.getAttribute('data-block-id') : null;
      showSelToolbar(rect, wrapRect, txt, blockId, jobId);
    }, 5);
  });
}
function showSelToolbar(rect, wrapRect, text, blockId, jobId){
  const slot = document.getElementById('sel-toolbar-slot');
  if(!slot) return;
  const top = rect.top - wrapRect.top - 44 + document.getElementById('doc-wrap').scrollTop;
  const left = Math.max(0, rect.left - wrapRect.left);
  slot.innerHTML = `<div class="sel-toolbar" style="position:absolute;top:${Math.max(4,top)}px;left:${left}px;">
    <button onclick="A.askCopilotFromSelection('${blockId}')"><span class="material-icons-o">auto_awesome</span>Ask Copilot</button>
    <button onclick="A.quickAction('${blockId}','rewrite')"><span class="material-icons-o">edit</span>Rewrite</button>
    <button onclick="A.quickAction('${blockId}','shorten')"><span class="material-icons-o">short_text</span>Shorten</button>
    <button onclick="A.quickAction('${blockId}','clarify')"><span class="material-icons-o">lightbulb</span>Clarify</button>
    <button onclick="A.addCommentFromSelection('${blockId}')"><span class="material-icons-o">add_comment</span>Comment</button>
  </div>`;
  // reposition wrapper relative
  document.getElementById('doc-wrap').style.position='relative';
  state.__pendingSelText = text; state.__pendingSelBlock = blockId;
}

/* =====================================================================
   ASK COPILOT — Gemini-in-Docs-style panel (voice-first, additive)
   A separate, parallel entry point to the selection-toolbar Copilot above.
   Does not replace or alter any of the existing suggestion/comment/changes
   mechanics — it is a new persistent chat+voice surface for (a) drafting a
   brand-new job from a spoken/typed description, and (b) generating content
   to insert into an existing job's document.
   ===================================================================== */
let __geminiChats = {};
let __geminiCtx = null;
let __geminiListening = false;

function geminiKey(){ return __geminiCtx.mode==='create' ? 'new' : (__geminiCtx.jobId+':'+__geminiCtx.audience); }

A.openGeminiPanel = function(mode, jobId){
  const audience = state.wsAudience || 'internal';
  let selText = null;
  if(mode==='edit'){
    const sel = window.getSelection();
    const txt = sel && sel.toString().trim();
    if(txt && txt.length>1) selText = txt;
  }
  __geminiCtx = { mode, jobId, audience, selText };
  const key = geminiKey();
  if(!__geminiChats[key]) __geminiChats[key] = [];
  openDrawer(renderGeminiPanel(), {drawerClass:'gemini-drawer-shell', overlayClass:'gemini-overlay'});
  setTimeout(()=>{ const ta=document.getElementById('gm-input'); ta&&ta.focus(); },60);
};

function setupGeminiResize(overlay){
  const drawer = overlay.querySelector('.gemini-drawer-shell');
  const handle = overlay.querySelector('.gemini-resize-handle');
  if(!drawer || !handle) return;
  const saved = Number(localStorage.getItem('hireos-gemini-width'));
  if(saved) drawer.style.setProperty('--gemini-width', Math.max(360, Math.min(saved, Math.round(window.innerWidth*.85)))+'px');
  let dragging = false;
  const onMove = e => {
    if(!dragging) return;
    const max = Math.min(900, Math.round(window.innerWidth*.85));
    const width = Math.max(360, Math.min(max, window.innerWidth - e.clientX));
    drawer.style.setProperty('--gemini-width', width+'px');
  };
  const onUp = () => {
    if(!dragging) return;
    dragging = false;
    handle.classList.remove('is-dragging');
    localStorage.setItem('hireos-gemini-width', parseInt(getComputedStyle(drawer).width,10));
    document.body.style.cursor='';
    document.body.style.userSelect='';
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  };
  handle.addEventListener('pointerdown', e => {
    e.preventDefault();
    dragging = true;
    handle.classList.add('is-dragging');
    document.body.style.cursor='ew-resize';
    document.body.style.userSelect='none';
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp, {once:true});
  });
}

function renderGeminiPanel(){
  const key = geminiKey();
  const msgs = __geminiChats[key]||[];
  const mode = __geminiCtx.mode;
  const title = mode==='create' ? 'Ask Copilot — Create a job' : 'Ask Copilot';
  const sub = mode==='create'
    ? 'Describe the role out loud or in writing — Copilot drafts a structured job for you to review.'
    : (__geminiCtx.selText ? `Working with the selected text: “${esc(trunc(__geminiCtx.selText,90))}”` : 'Ask for a rewrite, a new section, or anything else — Copilot drafts it here first, nothing changes in the document until you insert it.');
  const chips = mode==='create'
    ? ['We need a Growth Lead who can build our marketing function from zero, based in Ho Chi Minh City','Senior backend engineer, strong on distributed systems, hybrid role in Hanoi','HR Lead to set up recruiting and HR infrastructure for a brand-new business unit']
    : (__geminiCtx.selText ? ['Make this more concise','Rewrite in a friendlier, less corporate tone','Add a note about remote-work flexibility'] : ['Add a short section about team culture','Summarize the compensation philosophy in one sentence','Add a note about visa/relocation support']);
  return `
    <div class="gemini-resize-handle" id="gemini-resize-handle" role="separator" aria-label="Resize Copilot sidebar" title="Drag to resize"></div>
    <div class="gemini-panel">
      <div class="gemini-panel-header">
        <span class="gp-icon material-icons-o">auto_awesome</span>
        <div class="gp-title">${esc(title)}</div>
        <div style="flex:1"></div>
        <button class="close-x" onclick="closeModal()"><span class="material-icons-o">close</span></button>
      </div>
      <div class="gemini-panel-sub">${esc(sub)}</div>
      <div class="gemini-messages" id="gemini-messages">
        ${msgs.length===0 ? `
          <div class="gm-empty">
            <span class="material-icons-o" style="font-size:34px;">auto_awesome</span>
            <div style="margin-top:6px;">Tap the microphone and describe what you need, or type below.</div>
            <div class="gm-chip-row">${chips.map(c=>`<div class="gm-chip" onclick='A.geminiChipClick(${JSON.stringify(c)})'>${esc(c)}</div>`).join('')}</div>
          </div>` : msgs.map((m,i)=>renderGeminiMessage(m,i)).join('')}
      </div>
      <div class="gemini-input-wrap">
        <div class="gm-listening-row" id="gm-listening-row"></div>
        <div class="gemini-input-row">
          <button class="gm-mic-btn" id="gm-mic" onclick="A.geminiMicClick()" title="Speak"><span class="material-icons-o">mic</span></button>
          <div class="gemini-text-col">
            <textarea id="gm-input" rows="1" placeholder="Or type instead…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();A.geminiSend();}"></textarea>
          </div>
          <button class="gm-send-btn" id="gm-send" onclick="A.geminiSend()"><span class="material-icons-o">send</span></button>
        </div>
        <div class="gemini-hint">Voice input is simulated in this prototype — a real build would use on-device or streaming speech-to-text.</div>
      </div>
    </div>`;
}
function trunc(s,n){ s=String(s); return s.length>n ? s.slice(0,n)+'…' : s; }
function renderGeminiMessage(m, idx){
  if(m.role==='user') return `<div class="gm-bubble user">${esc(m.text)}</div>`;
  if(m.role==='thinking') return `<div class="gm-bubble ai"><div class="gm-thinking"><span></span><span></span><span></span></div></div>`;
  if(m.draft){
    const d = m.draft;
    return `<div class="gm-bubble ai">
      <div class="gm-draft-title">${esc(d.title)}</div>
      <div class="tiny">${esc(d.department)}</div>
      <div style="font-weight:500;margin-top:8px;">Responsibilities</div>
      <ul>${d.responsibilities.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
      <div style="font-weight:500;margin-top:4px;">Requirements — must-have</div>
      <ul>${d.must.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
      ${d.pref&&d.pref.length?`<div style="font-weight:500;margin-top:4px;">Preferred</div><ul>${d.pref.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:''}
      <div class="gm-actions">
        <button class="btn btn-primary btn-sm" onclick="A.geminiCreateJobFromDraft(${idx})"><span class="material-icons-o">add_circle</span>Create job from this draft</button>
        <button class="btn btn-secondary btn-sm" onclick="A.geminiRefine()">Refine</button>
      </div>
    </div>`;
  }
  return `<div class="gm-bubble ai">
    <div>${esc(m.text)}</div>
    <div class="gm-actions">
      <button class="btn btn-primary btn-sm" onclick="A.geminiInsert(${idx},'append')"><span class="material-icons-o">add</span>Insert into document</button>
      ${m.canReplace?`<button class="btn btn-secondary btn-sm" onclick="A.geminiInsert(${idx},'replace')"><span class="material-icons-o">find_replace</span>Replace selected text</button>`:''}
    </div>
  </div>`;
}
function geminiRerender(){
  const el = document.getElementById('gemini-messages');
  if(!el) return;
  const key = geminiKey();
  const msgs = __geminiChats[key]||[];
  if(msgs.length===0){ /* leave empty-state chips in place */ return; }
  el.innerHTML = msgs.map((m,i)=>renderGeminiMessage(m,i)).join('');
  el.scrollTop = el.scrollHeight;
}
A.geminiChipClick = function(text){ A.geminiSend(text); };
A.geminiSend = function(overrideText){
  const key = geminiKey();
  const inputEl = document.getElementById('gm-input');
  const text = (overrideText!=null ? overrideText : (inputEl?inputEl.value:'')).trim();
  if(!text) return;
  __geminiChats[key].push({role:'user', text});
  if(inputEl) inputEl.value='';
  geminiRerender();
  const thinkingIdx = __geminiChats[key].length;
  __geminiChats[key].push({role:'thinking'});
  geminiRerender();
  const ctx = Object.assign({}, __geminiCtx);
  setTimeout(()=>{
    if(geminiKey()!==key) return; // panel context changed/closed
    __geminiChats[key].splice(thinkingIdx,1);
    if(ctx.mode==='create'){
      __geminiChats[key].push({role:'ai', draft: geminiGenerateCreateDraft(text)});
    } else {
      __geminiChats[key].push({role:'ai', text: geminiGenerateEditResponse(text, ctx), canReplace: !!ctx.selText});
    }
    geminiRerender();
  }, 900);
};
A.geminiMicClick = function(){
  if(__geminiListening) return;
  const ctx = __geminiCtx;
  const micBtn = document.getElementById('gm-mic');
  const listenRow = document.getElementById('gm-listening-row');
  const inputEl = document.getElementById('gm-input');
  if(!micBtn) return;
  __geminiListening = true;
  micBtn.classList.add('listening');
  if(listenRow) listenRow.innerHTML = '<span class="gm-dot"></span>Listening…';
  const transcript = geminiSampleTranscript(ctx);
  setTimeout(()=>{
    if(!__geminiListening) return;
    if(listenRow) listenRow.innerHTML = '<span class="gm-dot"></span>Transcribing…';
    let i = 0;
    const step = Math.max(1, Math.round(transcript.length/40));
    const iv = setInterval(()=>{
      i += step;
      if(inputEl) inputEl.value = transcript.slice(0, i);
      if(i>=transcript.length){
        clearInterval(iv);
        if(inputEl) inputEl.value = transcript;
        micBtn.classList.remove('listening');
        if(listenRow) listenRow.innerHTML='';
        __geminiListening = false;
        setTimeout(()=>A.geminiSend(), 200);
      }
    }, 32);
  }, 650);
};
function geminiSampleTranscript(ctx){
  if(ctx.mode==='create'){
    const samples = [
      'We need a Growth Lead who can build our marketing function from zero, comfortable with ambiguity, based in Ho Chi Minh City.',
      'Looking for a senior backend engineer, strong on distributed systems, hybrid role in Hanoi.',
      'We need an HR Lead to set up recruiting and HR infrastructure for a brand new business unit in Vietnam.',
    ];
    return samples[Math.floor(Math.random()*samples.length)];
  }
  const samples = ctx.selText
    ? ['Make this more concise and easier to scan.','Rewrite this in a friendlier, less corporate tone.','Add a note about remote-work flexibility.']
    : ['Add a short section about our team culture.','Summarize the compensation philosophy in one sentence.'];
  return samples[Math.floor(Math.random()*samples.length)];
}
function geminiGenerateCreateDraft(prompt){
  const p = prompt.toLowerCase();
  const KB = [
    { test:/growth/, title:'Growth Lead', department:'Growth',
      responsibilities:['Translate business goals into concrete growth execution plans','Build growth infrastructure (SEO, analytics, KOL/affiliate network) from zero','Partner with product/engineering to turn features into growth mechanisms'],
      must:['Track record building growth operations from 0 to 1','Comfortable setting up analytics, attribution and reporting from scratch'],
      pref:['Experience building a KOL/creator or affiliate network'] },
    { test:/backend|distributed|platform|engineer/, title:'Senior Backend Engineer', department:'Engineering',
      responsibilities:['Own core backend services and their reliability at scale','Design for distributed-systems tradeoffs (consistency, availability, latency)','Partner with product to scope and ship 0→1 initiatives'],
      must:['5+ years of backend engineering experience','Experience with distributed systems at meaningful scale'],
      pref:['Track record of owning a project from ambiguity to launch'] },
    { test:/financ|cpa|accounting/, title:'Finance Manager', department:'Finance',
      responsibilities:['Own monthly close and management reporting','Partner with department heads on budget and forecasting','Maintain audit-ready controls documentation'],
      must:['5+ years of finance management experience','Professional accounting qualification or equivalent'],
      pref:['Experience with multi-entity or cross-border finance'] },
    { test:/\bhr\b|recruit|people/, title:'HR Lead', department:'People',
      responsibilities:['Own full-cycle recruiting from JD to offer','Build HR infrastructure (onboarding, policy, compliance) from scratch','Partner directly with leadership on hiring decisions'],
      must:['Real 0-to-1 experience building a team or function from nothing','Strong written and spoken English'],
      pref:['Experience at a recruiting agency or executive search firm'] },
    { test:/design|ux|ui\b/, title:'Product Designer', department:'Design',
      responsibilities:['Lead end-to-end design for core product flows','Partner with PM and engineering on discovery and delivery','Maintain and extend the design system'],
      must:['5+ years of product design experience','Portfolio with shipped work at comparable scope'],
      pref:['Experience partnering closely with engineering'] },
  ];
  const match = KB.find(k=>k.test.test(p));
  const summary = `Drafted from: “${prompt}”.`;
  if(match) return Object.assign({summary}, match);
  const cleaned = prompt.replace(/^(we need|we're looking for|looking for|hiring)\s+(an?|the)?\s*/i,'').trim();
  const title = trunc(cleaned.charAt(0).toUpperCase()+cleaned.slice(1), 60).replace(/[.,;:!?…]+$/,'');
  return {
    title: title || 'New Role', department:'General', summary,
    responsibilities:['Own the scope described in your request end-to-end','Partner cross-functionally to turn this into a working process','Report progress and results on a regular cadence'],
    must:['Relevant prior experience matching this description','Strong communication skills'],
    pref:['Comfortable operating with ambiguity'],
  };
}
function geminiGenerateEditResponse(prompt, ctx){
  const p = prompt.toLowerCase();
  if(ctx.selText){
    if(/concise|shorter|short/.test(p)) return shortenText(ctx.selText);
    if(/friendl|casual|less corporate|warm/.test(p)) return friendlyRewrite(ctx.selText);
    if(/remote/.test(p)) return ctx.selText.replace(/\.?$/,'') + '. Open to remote candidates, with flexibility on working-hours overlap.';
    return 'Here’s a revised version based on “'+prompt+'”:\n\n' + friendlyRewrite(ctx.selText);
  }
  return 'Added a new section based on your request: “'+prompt+'”. Review it below and insert it wherever fits — it’s appended to the end of the document by default.';
}
function shortenText(t){
  const words = t.split(/\s+/);
  if(words.length<=8) return t;
  return words.slice(0, Math.max(6, Math.round(words.length*0.6))).join(' ').replace(/[,;:]+$/,'') + '.';
}
function friendlyRewrite(t){
  return t
    .replace(/\bMust have\b/i, 'You should have')
    .replace(/\bmust have\b/gi, 'should have')
    .replace(/\bis required\b/gi, 'would be great to have')
    .replace(/\bshall\b/gi, 'will') + ' (we care more about what you can do than a checklist match).';
}
A.geminiRefine = function(){
  const inputEl = document.getElementById('gm-input');
  if(inputEl){ inputEl.placeholder = 'What would you like to change?'; inputEl.focus(); }
};
A.geminiInsert = function(idx, mode){
  const key = geminiKey();
  const m = (__geminiChats[key]||[])[idx];
  const ctx = __geminiCtx;
  if(!m || !ctx || ctx.mode!=='edit') return;
  const draft = getDraft(ctx.jobId, ctx.audience);
  let applied = false;
  if(mode==='replace' && ctx.selText){
    draft.blocks.forEach(b=>{
      if(applied) return;
      if(typeof b.text==='string' && b.text.indexOf(ctx.selText)>=0){
        b.text = b.text.replace(ctx.selText, m.text); applied = true;
      } else if(Array.isArray(b.text)){
        const li = b.text.findIndex(t=>t.indexOf(ctx.selText)>=0);
        if(li>=0){ b.text[li] = b.text[li].replace(ctx.selText, m.text); applied = true; }
      }
    });
  }
  if(!applied){ draft.blocks.push(mkBlock(uid('gb'),'p', m.text)); }
  draft.revision = (draft.revision||1) + 1;
  draft.saveState = 'saved';
  (state.activity[ctx.jobId]=state.activity[ctx.jobId]||[]).unshift({at:nowISO(), actor: state.currentUserId, text:'Inserted Copilot-generated text via Ask Copilot.', tag:'AI'});
  closeModal();
  toast(applied ? 'Replaced the selected text' : 'Inserted into the document');
  renderRoute();
};
A.geminiCreateJobFromDraft = function(idx){
  const key = geminiKey();
  const m = (__geminiChats[key]||[])[idx];
  if(!m || !m.draft) return;
  const d = m.draft;
  const newId = uid('job-gen');
  state.jobs[newId] = {
    id:newId, title:d.title, department:d.department, team:d.department, location:'Ho Chi Minh City, VN',
    employmentType:'Full-time', workplaceType:'Hybrid', level:'Mid', priority:'normal', headcount:1,
    hiringManager: state.currentUserId, recruiter: state.currentUserId, owner: state.currentUserId,
    hiringStatus:'draft', activeRoleVersionRef:null,
    collaborationStatus:'ready', draftRevision:1,
    createdAt: nowISO(), updatedAt: nowISO(),
    approvalStatus:'not_submitted', activationStatus:'not_requested', publicationStatus:'not_published',
    story:'Created live via the Ask Copilot voice/chat flow (Gemini-style creation panel).',
  };
  state.requirements[newId] = [
    ...d.must.map((s,i)=>({ id:newId+'-must-'+i, statement:s, category:'experience', priority:'must_have', evaluationType:'scored', dimensionId:null, evidenceStandard:'Not specified — Copilot-drafted; confirm evidence standard before approval.', dataStatus:'disputed' })),
    ...(d.pref||[]).map((s,i)=>({ id:newId+'-pref-'+i, statement:s, category:'experience', priority:'preferred', evaluationType:'scored', dimensionId:null, evidenceStandard:'Not specified — Copilot-drafted; confirm evidence standard before approval.', dataStatus:'disputed' })),
  ];
  let n=1; const bid=()=>'g'+newId.slice(-4)+'-'+(n++);

function canonicalSuggestion(jobId, audience, blockId, selText, instruction){
  // Flagship demo: "Must have strong communication skills." -> specific, verifiable requirement (PRD/Brief §17.4)
  if(/strong communication skills/i.test(selText)){
    return {
      newText:'Can explain technical trade-offs clearly to non-technical stakeholders, supported by an example from a previous project.',
      explain:'I rewrote this as a requirement that can actually be verified in an interview or work sample, and kept it must-have. Whether it applies to this specific role is still yours to confirm.',
      reason:'Evidence expectation changes from unspecified to a concrete example; priority (must-have) is unchanged. This updates the linked requirement draft (req-102-comm) alongside the document text.',
      requirementRef:'req-102-comm',
    };
  }
  if(/b2b saas/i.test(selText)){
    return {
      newText:'2+ years building B2B SaaS platforms, with a named product and your specific contribution.',
      explain:'I made this easier to screen against a resume by asking for a named product and a specific contribution, while keeping it must-have as Maya requested.',
      reason:'Adds a verifiable evidence bar; does not change priority. Linked to req-102-b2b.',
      requirementRef:'req-102-b2b',
    };
  }
  if(/shorten/i.test(instruction||'')){
    const short = selText.split(' ').slice(0, Math.max(4, Math.ceil(selText.split(' ').length*0.6))).join(' ');
    return { newText: short + (short.endsWith('.')?'':'.'), explain:'Shortened while keeping the core requirement.', reason:'Wording simplified; no change to must-have/preferred or evaluation dimension.' };
  }
  if(/clarify/i.test(instruction||'')){
    return { newText: selText.replace(/\.$/,'') + ', with a specific example as evidence.', explain:'Added a concrete evidence expectation to reduce ambiguity.', reason:'Evidence standard clarified; priority unchanged.' };
  }
  return { newText: selText.replace(/\.$/,'') + ' (rewritten for clarity).', explain:'Here’s a clearer version of the selected text.', reason:'Wording clarified; no change to must-have/preferred or evaluation dimension.' };
}

function generateSuggestion(jobId, audience, blockId, selText, instruction){
  const c = canonicalSuggestion(jobId, audience, blockId, selText, instruction);
  const s = {
    id: uid('sug'), anchorBlock: blockId, status:'proposed', author:'ai', initiatedBy: state.currentUserId,
    createdAt: nowISO(), instruction: instruction||'Rewrite', oldText: selText, newText: c.newText, reason: c.reason, requirementRef: c.requirementRef||null,
  };
  getSuggestions(jobId, audience).push(s);
  return {s, explain:c.explain};
}

A.sendCopilot = function(jobId, audience){
  const input = document.getElementById('copilot-input');
  const instruction = input.value.trim();
  if(!instruction) return;
  state.wsCopilotThread = state.wsCopilotThread || [];
  state.wsCopilotThread.push({kind:'user', text: instruction});
  const sel = state.wsSelection;
  if(!sel){
    state.wsCopilotThread.push({kind:'text', text:'I don’t have a selection to work from yet — select a sentence, list item or paragraph in the document first, or tell me "whole document" to widen the scope.'});
    renderRoute(); return;
  }
  const {s, explain} = generateSuggestion(jobId, audience, sel.blockId, sel.text, instruction);
  state.wsCopilotThread.push({kind:'suggestion', suggestion:s, explain});
  state.wsSelection = null;
  renderRoute();
  setTimeout(()=>{ const el=document.getElementById('copilot-thread'); if(el) el.scrollTop = el.scrollHeight; }, 30);
};

  const s = getSuggestions(jobId,audience).find(x=>x.id===suggestionId);
  openModal(`<div class="modal-header"><h3 class="modal-title">Refine suggestion</h3><button class="close-x" onclick="closeModal()"><span class="material-icons-o">close</span></button></div>

A.submitRefine = function(suggestionId){
  const jobId=state.wsCurrentJob, audience=state.wsAudience;
  const old = getSuggestions(jobId,audience).find(x=>x.id===suggestionId);
  old.status = 'rejected';
  const note = document.getElementById('refine-input').value.trim();
  const s = { id: uid('sug'), anchorBlock: old.anchorBlock, status:'proposed', author:'ai', initiatedBy: state.currentUserId,
    createdAt: nowISO(), instruction:'Refine', oldText: old.oldText, newText: old.newText.replace(/\.$/,'') + (note? ' ('+note+')':' (refined)'), reason: 'Refined based on: '+(note||'follow-up context')+'. Supersedes the previous proposal.', supersedes: old.id };
  getSuggestions(jobId,audience).push(s);
  closeModal();
  state.wsCopilotThread = state.wsCopilotThread || [];
  state.wsCopilotThread.push({kind:'suggestion', suggestion:s, explain:'Here’s a refined version based on your note. The previous proposal is kept in history as superseded.'});
  renderRoute();

A.acceptSuggestion = function(suggestionId){
  const jobId=state.wsCurrentJob, audience=state.wsAudience;
  const s = getSuggestions(jobId,audience).find(x=>x.id===suggestionId);
  if(!s) return;
  if(s.status==='stale'){ toast('This suggestion needs a refresh before it can be accepted.', 'error'); return; }
  if(s.status!=='proposed'){ toast('This suggestion was already '+s.status+'.'); return; }
  const block = findBlock(jobId, audience, s.anchorBlock);
  if(Array.isArray(block.text)){ block.text = block.text.map(t=> t===s.oldText ? s.newText : t); }
  else if(block.text===s.oldText){ block.text = s.newText; }
  s.status='accepted';
  const draft = getDraft(jobId,audience); draft.revision++; draft.saveState='saving';
  if(s.requirementRef){
    const req = (state.requirements[jobId]||[]).find(r=>r.id===s.requirementRef);
    if(req){ req.statement = s.newText; req.dataStatus='known'; req.flagVague=false; }
  }
  (state.activity[jobId]=state.activity[jobId]||[]).unshift({at:nowISO(), actor:state.currentUserId, text:'Accepted a document suggestion — text and requirement draft updated together.'});
  toast('Suggestion accepted — working draft updated (not yet approved)');
  setTimeout(()=>{ draft.saveState='saved'; renderRoute(); }, 500);
  renderRoute();
};
A.rejectSuggestion = function(suggestionId){
  const s = getSuggestions(state.wsCurrentJob, state.wsAudience).find(x=>x.id===suggestionId);
  if(!s || s.status!=='proposed'){ toast('Nothing to reject.'); return; }
  s.status='rejected';
  toast('Suggestion rejected');
  renderRoute();
};

      ${groups.map(g=>g.items.length?`<div class="blueprint-group"><h4>${g.label}</h4>${g.items.map(it=>`<div class="req-row"><div class="rr-stmt">${esc(it.stmt)}</div></div>`).join('')}</div>`:'').join('')}

    state.approvals[jobId].status='pending';
    (state.activity[jobId]=state.activity[jobId]||[]).unshift({at:nowISO(), actor:state.currentUserId, text:'Submitted working draft for approval.'});
    toast('Submitted for approval'); go('#/jobs/'+jobId+'/approval');

A.decideApproval = function(jobId, action){
  const appr = state.approvals[jobId];
  const stepIdx = appr.steps.findIndex(s=>s.status==='active');
  const step = appr.steps[stepIdx];
  const doDecide = (reason)=>{
    if(action==='approve'){
      step.status='approved'; step.decidedAt=nowISO();
      const next = appr.steps[stepIdx+1];
      if(next){ next.status='active'; }
      else { appr.status='approved'; state.jobs[jobId].approvalStatus='approved'; }
    } else if(action==='request_changes'){
      step.status='changes_requested'; step.decidedAt=nowISO(); appr.status='changes_requested'; state.jobs[jobId].approvalStatus='changes_requested'; step.reason=reason;
    } else {
      step.status='rejected'; step.decidedAt=nowISO(); appr.status='rejected'; state.jobs[jobId].approvalStatus='rejected'; step.reason=reason;
    }
    (state.activity[jobId]=state.activity[jobId]||[]).unshift({at:nowISO(), actor:state.currentUserId, text:(action==='approve'?'Approved':action==='request_changes'?'Requested changes on':'Rejected')+' step '+step.order+' ('+step.role+').'});
    renderRoute(); toast(action==='approve'?'Approved':action==='request_changes'?'Changes requested':'Rejected');
  };
  if(action==='approve'){ confirmDialog('Approve '+step.role+' step', 'This approves the exact candidate version above (revision '+appr.candidateRevision+'). Approving does not activate or publish it automatically.', 'Approve', ()=>doDecide()); }
  else {
    openModal(`<div class="modal-header"><h3 class="modal-title">${action==='reject'?'Reject':'Request changes'}</h3><button class="close-x" onclick="closeModal()"><span class="material-icons-o">close</span></button></div>
    <div class="modal-body"><div class="field"><label>Reason</label><textarea id="decision-reason" placeholder="Explain what needs to change"></textarea></div></div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn ${action==='reject'?'btn-danger-solid':'btn-primary'}" onclick="closeModal();doDecideWrapper()">Confirm</button></div>`);
    window.doDecideWrapper = ()=>{ doDecide(document.getElementById('decision-reason')?document.getElementById('decision-reason').value:''); };
  }
};
A.activateVersion = function(jobId){
  const j = state.jobs[jobId];
  confirmDialog('Activate approved version', 'This will make the approved candidate the new active requirement standard for this job. New evaluations will use it; anything already started keeps its old snapshot.', 'Activate', ()=>{

function renderFileActivitySubtab(){
  return `<div class="card">${state.opActivity.map(op=>`

          ${op.type==='download'?'Download ready: '+esc((state.files.find(f=>f.id===op.file)||{}).name||''):''}

A.retryOp = function(id){
  toast('Retrying failed items…');
  setTimeout(()=>{ const op = state.opActivity.find(x=>x.id===id); if(op.counts){ op.counts.failed=0; op.status='succeeded'; } else { op.status='succeeded'; } pageFiles({}, currentQuery()); toast('Retry succeeded', 'success'); }, 700);
};

function pageAIModels(params, q){

    {key:'compare', label:'Compare & evaluate'},
    {key:'usage', label:'Usage & cost'},
    {key:'activity', label:'Activity & versions'},

  let body = '';

    `<div class="settings-nav">${SETTINGS_NAV.map(g=>`<div class="settings-nav-group"><div class="snlabel">${g.group}</div>${g.items.map(it=>`<div class="settings-nav-item${it.key==='ai-models'?' active':''}" onclick="A.go('#/settings/${it.key}')">${it.label}</div>`).join('')}</div>`).join('')}</div>`+

      <h2 class="section-title">AI Models<span class="scope-tag">Model admin • quality lead</span></h2>
