# Production entry point: one nginx on :80, path-prefix routed to each
# subsystem's frontend (its own nginx container, serving Vite's flat `dist/`
# output at its own root -- see hireos-*/*-front/nginx.conf) and backend
# container. Mirrors the routes already validated by the local dev gateway
# (see PORTS.md "本地统一网关"), collapsed from two ports into one since
# there's no dev-server/HMR layer to keep separate in production.
#
# Convention: only the leading subsystem segment (`/interview`, `/jd`, ...)
# is stripped before forwarding -- backends still expect the caller to
# include their own `/api` (or Core Record's `/api/v1`) after that; frontend
# containers serve flat (no subdirectory), so they need the same strip.
#
# `set $upstream ...` + `proxy_pass http://$upstream;` (host as a variable,
# no URI suffix) does two things at once, both required:
#   1. Dynamic DNS via `resolver` -- without this, nginx resolves each
#      upstream hostname once at worker start and caches it; if only some
#      services get recreated by a later partial `docker compose up`,
#      gateway keeps proxying to whatever container now happens to hold
#      that stale IP. 127.0.0.11 is Docker's embedded DNS.
#   2. It also means nginx does NOT auto-splice the location prefix into
#      the forwarded path the way a literal `proxy_pass http://host/path;`
#      would -- hence the explicit `rewrite ^/prefix(/.*)$ $1 break;` above
#      each proxy_pass, which strips exactly the subsystem segment and
#      nothing else. Skipping this silently forwards the full unstripped
#      path, which 404s upstream and gets masked as a 200 by the frontend's
#      own SPA fallback (serving index.html's *HTML* where a .js file was
#      expected) -- a real bug hit and fixed in this exact file once already.
server {
    listen 80;
    client_max_body_size 20m;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s;

    location = / {
    }

    location /interview/api/ {
        set $upstream interview-backend:3001;
        rewrite ^/interview(/.*)$ $1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /interview/ {
        set $upstream interview-frontend;
        rewrite ^/interview(/.*)$ $1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
    }

    location /screening/api/ {
        set $upstream screening-backend:3002;
        rewrite ^/screening(/.*)$ $1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /screening/ {
        set $upstream screening-frontend;
        rewrite ^/screening(/.*)$ $1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
    }

    location /jd/ws/voice-stream {
        set $upstream jd-backend:3005;
        rewrite ^/jd(/.*)$ $1 break;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /jd/api/ {
        set $upstream jd-backend:3005;
        rewrite ^/jd(/.*)$ $1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /jd/ {
        set $upstream jd-frontend;
        rewrite ^/jd(/.*)$ $1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
    }

    location /written/api/ {
        set $upstream written-backend:3008;
        rewrite ^/written(/.*)$ $1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /written/ {
        set $upstream written-frontend;
        rewrite ^/written(/.*)$ $1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
    }

    # Core Record has no frontend of its own; caller includes its /api/v1
    # prefix themselves, e.g. /core-record/api/v1/jobs.
    location /core-record/ {
        set $upstream core-record:3004;
        rewrite ^/core-record(/.*)$ $1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
