# Production entry point: one nginx on :80, path-prefix routed to each
# subsystem's frontend (its own nginx container, already serving under
# /<prefix>/ thanks to Vite `base`) and backend container. Mirrors the routes
# already validated by the local dev gateway (see PORTS.md "本地统一网关"),
# collapsed from two ports into one since there's no dev-server/HMR layer to
# keep separate in production.
#
# Convention carried over unchanged from the local gateway: only the leading
# subsystem segment is stripped before forwarding to a backend -- callers
# still include the backend's own prefix themselves (`/interview/api/...`,
# `/core-record/api/v1/...`). Do not bake `/api` or `/api/v1` into proxy_pass
# here, or the effective path sent upstream will be wrong.
server {
    listen 80;
    client_max_body_size 20m;

    location = / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /interview/api/ {
        proxy_pass http://interview-backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /interview/ {
        proxy_pass http://interview-frontend/interview/;
        proxy_set_header Host $host;
    }

    location /screening/api/ {
        proxy_pass http://screening-backend:3002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /screening/ {
        proxy_pass http://screening-frontend/screening/;
        proxy_set_header Host $host;
    }

    location /jd/ws/voice-stream {
        proxy_pass http://jd-backend:3005/ws/voice-stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /jd/api/ {
        proxy_pass http://jd-backend:3005/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /jd/ {
        proxy_pass http://jd-frontend/jd/;
        proxy_set_header Host $host;
    }

    location /written/api/ {
        proxy_pass http://written-backend:3008/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /written/ {
        proxy_pass http://written-frontend/written/;
        proxy_set_header Host $host;
    }

    # Core Record has no frontend of its own; caller includes its /api/v1
    # prefix themselves, e.g. /core-record/api/v1/jobs.
    location /core-record/ {
        proxy_pass http://core-record:3004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
