    ? `请基于已确认的岗位信息，围绕以下重点形成一份可执行的工作样本：${brief}。\n\n请在同一交付场景中体现判断与产出能力；信息不足处可提出假设，但须标明假设及其验证方式。`
    : `Based on the confirmed role information, design an executable work sample focused on: ${brief}.\n\nDemonstrate judgment and deliverable quality within a single delivery scenario; where information is insufficient, state assumptions explicitly along with how they'd be verified.`;
  openDrawer((close)=>{
    const d = el(`<div class="flex-col" style="height:100%"></div>`);
    d.appendChild(el(`<div class="overlay-head"><h3>${esc(t("Edit question"))}</h3><div class="icon-btn"><span class="material-icons-o">close</span></div></div>`));
    qs(".icon-btn",d).onclick = close;
    const body = el(`<div class="overlay-body flex-col gap-4"></div>`);
    const modeRow = el(`<div class="segmented-control"><button class="btn sm primary" id="editModeBank"><span class="material-icons-o" style="font-size:16px">list_alt</span> ${esc(t("From Question Bank"))}</button><button class="btn sm ghost ai-toggle" id="editModeAi"><span class="material-icons-o" style="font-size:16px">auto_awesome</span> ${esc(t("AI-generated"))}</button></div>`);
    body.appendChild(modeRow);
    const modeBody = el(`<div></div>`); body.appendChild(modeBody);
    const field = el(`<div class="field"></div>`);
    field.appendChild(el(`<label>${esc(t("Question content"))}</label>`));
    const textarea = el(`<textarea class="input" rows="18" placeholder="${esc(t("Select a preset question, or generate one with AI, to see its content here."))}"></textarea>`);
    textarea.value = contentDraft;
    textarea.oninput = e=>{ contentDraft=e.target.value; };
    field.appendChild(textarea); body.appendChild(field);
    function drawModeBody(){
      modeBody.innerHTML = "";
      if(mode === "bank"){
        const bankSel = el(`<select class="input"></select>`);
        bankSel.appendChild(el(`<option value="">${esc(t("— Select a preset question —"))}</option>`));
        Object.values(DB.questions).filter(x=>x.status==="published" && (!job || x.roles.includes(job.title))).forEach(x=>{
          const opt = el(`<option value="${x.id}" ${selectedQuestionId===x.id?"selected":""}>${esc(x.code)} · ${esc(x.title)}</option>`);
          bankSel.appendChild(opt);
        });
        bankSel.onchange = ()=>{ selectedQuestionId=bankSel.value; if(selectedQuestionId){ contentDraft=DB.questions[selectedQuestionId].prompt; textarea.value=contentDraft; } };
        modeBody.appendChild(bankSel);
        modeBody.appendChild(el(`<div class="tiny" style="margin-top:8px;color:var(--text-tertiary)">${esc(t("Approved v1; edits below only apply to this candidate's draft and never change the role preset."))}</div>`));
      } else {
        const aiPanel = el(`<div class="ai-panel flex-col gap-3"></div>`);
        const focusField = el(`<div class="field"></div>`);
        focusField.appendChild(el(`<label>${esc(t("Test focus"))}</label>`));
        const focusInput = el(`<textarea class="input" rows="2" placeholder="${esc(t("Tell me which capability you'd like to focus on testing."))}">${esc(focusBrief)}</textarea>`);
        focusInput.oninput = e=>{ focusBrief=e.target.value; contentDraft=focusBrief.trim()?buildGenerated(focusBrief.trim()):contentDraft; textarea.value=contentDraft; };
        focusField.appendChild(focusInput); aiPanel.appendChild(focusField);
        aiPanel.appendChild(el(`<div class="tiny" style="font-weight:600;color:var(--accent-700)">${esc(t("Based on this role's requirements, consider focusing on:"))}</div>`));
        const chipsWrap = el(`<div></div>`);
        suggestions.forEach(s=>{ const chip=el(`<button type="button" class="ai-suggest-chip">${esc(s)}</button>`); chip.onclick=()=>{ focusBrief=s; focusInput.value=s; contentDraft=buildGenerated(s); textarea.value=contentDraft; }; chipsWrap.appendChild(chip); });
        aiPanel.appendChild(chipsWrap); modeBody.appendChild(aiPanel);
      }
    }
    drawModeBody();
    qs("#editModeBank",modeRow).onclick=()=>{ mode="bank"; qs("#editModeBank",modeRow).classList.add("primary"); qs("#editModeAi",modeRow).classList.remove("primary"); drawModeBody(); };
    qs("#editModeAi",modeRow).onclick=()=>{ mode="ai"; qs("#editModeAi",modeRow).classList.add("primary"); qs("#editModeBank",modeRow).classList.remove("primary"); drawModeBody(); };
    d.appendChild(body);
    const foot = el(`<div class="overlay-foot flex gap-2 justify-end"></div>`);
    const cancelBtn = el(`<button class="btn ghost">${esc(t("Cancel"))}</button>`); cancelBtn.onclick = close;
    const saveBtn = el(`<button class="btn primary">${esc(t("Save changes"))}</button>`);
    saveBtn.onclick = ()=>{
      const value = textarea.value.trim();
      if(!value){ toast(t("Question content"),"warning"); return; }
      if(mode === "bank" && selectedQuestionId) pi.questionId = selectedQuestionId;
      pi.customPrompt = value;
      saveDB(); toast(t("Question updated."),"success");
      close(); if(onDone) onDone();
    };
    foot.appendChild(cancelBtn); foot.appendChild(saveBtn); d.appendChild(foot);
    return d;
  },{wide:true});
}

function openQuestionGenerateDrawer(caseId, roundId, onDone){
  const c = DB.cases[caseId];
  const round = roundsForCase(caseId).find(r=>r.id===roundId);
  const app = c.applicationId && DB.core.applications[c.applicationId];
  const job = (app && DB.core.jobs[app.jobId]) || DB.core.jobs[DB.project.jobId];
  let mode = "bank";
  let selectedQuestionId = "";
  let focusBrief = "";
  let contentDraft = "";
  let generatedCompetencies = null;

  const roleCompetencyNames = Array.from(new Set(Object.values(DB.questions).filter(q=>q.roles.includes(job.title)).flatMap(q=>q.competencies.map(cc=>cc.name))));
  const suggestions = (roleCompetencyNames.length ? roleCompetencyNames.slice(0,3) : [
    DB.settings.lang==="zh"?"任务理解与方案设计":"Problem framing and solution design",
    DB.settings.lang==="zh"?"方法论正确性与严谨性":"Methodological rigor and correctness",
    DB.settings.lang==="zh"?"结果呈现与沟通表达":"Deliverable clarity and communication"
  ]).map(name=> ({
    value: name,
    label: DB.settings.lang==="zh" ? `重点测试候选人在「${name}」方面的实际判断与产出能力` : `Focus on the candidate's real-world judgment and output quality in "${name}"`
  }));

  let generatedDeliverables = null;
  function buildGenerated(brief){
    generatedCompetencies = [{name:brief.slice(0,24),fraction:0.5},{name:DB.settings.lang==="zh"?"方案落地与产出质量":"Delivery execution and output quality",fraction:0.3},{name:DB.settings.lang==="zh"?"沟通表达与文档产出":"Communication and documentation",fraction:0.2}];
    const workspace = DB.identity.workspace.name;
    if(DB.settings.lang==="zh"){
      generatedDeliverables = ["分析结论文档 (analysis.md)","关键假设与验证方式清单 (assumptions.md)","支撑数据与处理过程 (working_data.md)"];
      return `以 ${workspace} 正在招聘的「${job.title}」岗位为背景，设计一份约 2 小时可完成的实操工作样本，围绕以下重点考察候选人：${brief}。\n\n背景材料：候选人会收到一份包含近 3 个月业务数据的资料包（合成数据，不涉及真实客户或员工信息），需要在规定时间内独立完成分析与产出，不能仅凭经验空谈。\n\n任务要求：\n1. 结合材料，针对"${brief}"给出具体、可执行、有依据的判断或方案，避免停留在原则性描述。\n2. 明确列出每个关键结论所依据的证据来源（材料中的具体页码/行号/字段），不得凭空断言。\n3. 对信息不足或存在歧义之处提出合理假设，并说明将如何验证该假设。\n4. 产出一份结构清晰、可直接交给业务方或候选人未来上级审阅的文档，而非零散笔记。\n5. 用不超过 300 字总结本次任务的核心结论与下一步建议。\n\n交付物：\n- ${generatedDeliverables.join("\n- ")}\n\n评分将重点关注"${brief}"这一维度的实际判断质量，格式和篇幅不作为主要评分依据。`;
    }
    generatedDeliverables = ["Analysis findings (analysis.md)","Assumptions & verification plan (assumptions.md)","Supporting data & workings (working_data.md)"];
    return `Set against ${workspace}'s open "${job.title}" role, design an executable, roughly 2-hour work sample that focuses on: ${brief}.\n\nBackground materials: the candidate receives a data package covering roughly the last 3 months of activity (synthetic data, no real customer or employee information), to be analyzed and turned into a deliverable independently within the time limit — not answered from general experience alone.\n\nTask requirements:\n1. Using the materials, give a concrete, executable, evidence-based judgment or plan on "${brief}" — avoid staying at the level of general principles.\n2. Explicitly cite the evidence behind each key conclusion (the specific page/row/field in the materials) — no unsupported claims.\n3. Where information is missing or ambiguous, state a reasonable assumption and how it would be verified.\n4. Produce a clearly structured document suitable to hand directly to the business owner or the candidate's future manager, not scattered notes.\n5. Summarize the core conclusion and next steps in 300 words or fewer.\n\nDeliverables:\n- ${generatedDeliverables.join("\n- ")}\n\nScoring will focus on the quality of judgment on "${brief}"; format and length are not primary scoring factors.`;
  }
  function rubricLinesFor(competencies){
    return (competencies||[]).map(cc=> `${esc(cc.name)} — ${Math.round(cc.fraction*100)}%`);
  }

  openDrawer((close)=>{
    const d = el(`<div class="flex-col" style="height:100%"></div>`);
    d.appendChild(el(`<div class="overlay-head"><h3>${esc(t("Generate assessment question"))}</h3><div class="icon-btn"><span class="material-icons-o">close</span></div></div>`));
    qs(".icon-btn",d).onclick = close;
    const body = el(`<div class="overlay-body flex-col gap-4"></div>`);

    const modeRow = el(`<div class="segmented-control"><button class="btn sm primary" id="genModeBank"><span class="material-icons-o" style="font-size:16px">list_alt</span> ${esc(t("From Question Bank"))}</button><button class="btn sm ghost ai-toggle" id="genModeAi"><span class="material-icons-o" style="font-size:16px">auto_awesome</span> ${esc(t("AI-generated"))}</button></div>`);
    body.appendChild(modeRow);

    const modeBody = el(`<div></div>`);
    body.appendChild(modeBody);

    const contentField = el(`<div class="field"></div>`);
    contentField.appendChild(el(`<label>${esc(t("Question content"))}</label>`));
    const contentTextarea = el(`<textarea class="input" rows="14" placeholder="${esc(t("Select a preset question, or generate one with AI, to see its content here."))}"></textarea>`);
    contentTextarea.oninput = (e)=>{ contentDraft = e.target.value; };
    contentField.appendChild(contentTextarea);
    body.appendChild(contentField);

    const rubricField = el(`<div class="field" hidden></div>`);
    rubricField.appendChild(el(`<label>${esc(t("Scoring rubric"))}</label>`));
    const rubricDisplay = el(`<div class="card card-pad tiny" style="color:var(--text-secondary);line-height:1.8"></div>`);
    rubricField.appendChild(rubricDisplay);
    body.appendChild(rubricField);
    function refreshRubricDisplay(){
      if(generatedCompetencies && generatedCompetencies.length){
        rubricField.hidden = false;
        rubricDisplay.innerHTML = rubricLinesFor(generatedCompetencies).map(l=>`<div>${l}</div>`).join("");
      } else {
        rubricField.hidden = true;
      }
    }

    function drawModeBody(){
      modeBody.innerHTML = "";
      if(mode==="bank"){
        const roleQuestions = Object.values(DB.questions).filter(q=>q.status==="published" && q.roles.includes(job.title));
        const bankSel = el(`<select class="input"></select>`);
        bankSel.appendChild(el(`<option value="">${esc(t("— Select a preset question —"))}</option>`));
        roleQuestions.forEach(q=>{
          const opt = el(`<option value="${q.id}" ${selectedQuestionId===q.id?"selected":""}>${esc(q.code)} · ${esc(q.title)}</option>`);
          bankSel.appendChild(opt);
        });
        bankSel.onchange = ()=>{
          selectedQuestionId = bankSel.value;
          generatedCompetencies = null; generatedDeliverables = null;
          if(selectedQuestionId){ contentDraft = DB.questions[selectedQuestionId].prompt; contentTextarea.value = contentDraft; }
          refreshRubricDisplay();
        };
        modeBody.appendChild(bankSel);
        modeBody.appendChild(el(`<div class="tiny" style="margin-top:8px;color:var(--text-tertiary)">${esc(t("Approved v1; edits below only apply to this candidate's draft and never change the role preset."))}</div>`));
      } else {
        const aiPanel = el(`<div class="ai-panel flex-col gap-3"></div>`);
        const focusField = el(`<div class="field"></div>`);
        focusField.appendChild(el(`<label>${esc(t("Test focus"))}</label>`));
        const focusInput = el(`<textarea class="input" rows="2" placeholder="${esc(t("Tell me which capability you'd like to focus on testing."))}">${esc(focusBrief)}</textarea>`);
        focusInput.oninput = (e)=>{ focusBrief = e.target.value; if(!focusBrief.trim()){ generatedCompetencies = null; generatedDeliverables = null; } contentDraft = focusBrief.trim() ? buildGenerated(focusBrief.trim()) : ""; contentTextarea.value = contentDraft; refreshRubricDisplay(); };
        focusField.appendChild(focusInput);
        aiPanel.appendChild(focusField);
        aiPanel.appendChild(el(`<div class="tiny" style="font-weight:600;color:var(--accent-700)">${esc(t("Based on this role's requirements, consider focusing on:"))}</div>`));
        const chipsWrap = el(`<div></div>`);
        suggestions.forEach(s=>{
          const chip = el(`<button type="button" class="ai-suggest-chip">${esc(s.label)}</button>`);
          chip.onclick = ()=>{ focusBrief = s.value; focusInput.value = s.value; contentDraft = buildGenerated(s.value); contentTextarea.value = contentDraft; refreshRubricDisplay(); };
          chipsWrap.appendChild(chip);
        });
        aiPanel.appendChild(chipsWrap);
        modeBody.appendChild(aiPanel);
      }
    }
    drawModeBody();
    qs("#genModeBank",modeRow).onclick = ()=>{ mode="bank"; generatedCompetencies=null; generatedDeliverables=null; contentDraft=""; contentTextarea.value=""; refreshRubricDisplay(); qs("#genModeBank",modeRow).classList.add("primary"); qs("#genModeAi",modeRow).classList.remove("primary"); drawModeBody(); };
    qs("#genModeAi",modeRow).onclick = ()=>{ mode="ai"; generatedCompetencies=null; generatedDeliverables=null; contentDraft=""; contentTextarea.value=""; refreshRubricDisplay(); qs("#genModeAi",modeRow).classList.add("primary"); qs("#genModeBank",modeRow).classList.remove("primary"); drawModeBody(); };

    d.appendChild(body);
    const foot = el(`<div class="overlay-foot flex gap-2 justify-end"></div>`);
    const cancelBtn = el(`<button class="btn ghost">${esc(t("Cancel"))}</button>`); cancelBtn.onclick = close;
    const confirmBtn = el(`<button class="btn primary">${esc(t("Confirm generate"))}</button>`);
    confirmBtn.onclick = ()=>{
      if(!contentDraft.trim()){ toast(mode==="bank" ? t("Select a preset question first.") : t("Enter a test focus first."),"warning"); return; }
      let qId = selectedQuestionId;
      if(mode==="ai"){
        qId = "q_ai_"+caseId+"_"+Date.now();
        DB.questions[qId] = { id:qId, code:"AI-"+qId.slice(-4).toUpperCase(), title:(DB.settings.lang==="zh"?"AI 生成 · ":"AI-generated · ")+focusBrief.trim().slice(0,24), type:"Written + File", roles:[job.title], competencies: generatedCompetencies || [{name:focusBrief.trim().slice(0,20)||"Custom focus", fraction:1}], difficulty:"Medium", estMinutes:120, language:DB.settings.lang==="zh"?"中文":"English", version:1, status:"published", author:DB.settings.currentUser, favorite:false, deliverables: generatedDeliverables || [DB.settings.lang==="zh"?"工作样本产出 (deliverable.md)":"Work sample deliverable (deliverable.md)"], materials:[], usageCount:0, seenByCount:0, prompt:contentDraft };
      }
      if(!qId){ toast(t("Select a preset question first."),"warning"); return; }
      const items = planItemsForCase(caseId, round.id);
      const piId = "pi_"+caseId+"_"+round.id+"_"+(items.length+1);
      const customPrompt = contentDraft!==DB.questions[qId].prompt ? contentDraft : null;
      DB.plans[piId] = { id:piId, caseId, questionId:qId, kind: items.length===0?"required":"supplemental", status:"planned", customPrompt };
      c.planItems.push(piId); round.planItemIds.push(piId);
      const existingResult = Object.values(DB.results).find(r=>r.caseId===caseId);
      if(c.status === "released" || (existingResult && ["published","final_not_released"].includes(existingResult.status))){
        c.supplementalPending = true;
        const relatedTask = Object.values(DB.tasks).find(t=>t.sourceRef===caseId);
        if(relatedTask) relatedTask.status = "open";
      }
      saveDB(); toast(mode==="ai" ? t("Written test question and scoring rubric generated.") : t("Assessment question generated."),"success");
      close(); if(onDone) onDone();
    };
    foot.appendChild(cancelBtn); foot.appendChild(confirmBtn);
    d.appendChild(foot);
    return d;
  },{wide:true});
}

function openSendToCandidateDrawer(caseId, round, onSent){
  const c = DB.cases[caseId];
  const cand = candidateOf(caseId);
  const items = planItemsForCase(caseId, round.id);
  let mode = "timed";
  let durationMin = 90;
  let deadline = round.deadlineAt ? round.deadlineAt.slice(0,16) : "";
  let disclosure = "score_and_summary";

  openDrawer((close)=>{
    const d = el(`<div class="flex-col" style="height:100%"></div>`);
    d.appendChild(el(`<div class="overlay-head"><div><h3>${esc(t("Send to candidate"))}</h3><div class="tiny">${esc(cand.name)} · ${esc(cand.email)}</div></div><div class="icon-btn"><span class="material-icons-o">close</span></div></div>`));
    qs(".icon-btn",d).onclick = close;
    const body = el(`<div class="overlay-body flex-col gap-3"></div>`);

    const qCard = el(`<div class="card card-pad"></div>`);
    qCard.innerHTML = `<h4 style="margin-bottom:8px">${esc(t("Assessment questions"))}</h4>` + items.map(pi=>`<div class="tiny" style="padding:4px 0">${esc(DB.questions[pi.questionId].code)} · ${esc(DB.questions[pi.questionId].title)}</div>`).join("");
    body.appendChild(qCard);

    const modeField = el(`<div class="field"></div>`);
    modeField.appendChild(el(`<label>${esc(t("Mode"))}</label>`));
    const modeRow = el(`<div class="flex gap-2"><button class="btn sm primary" id="sendModeTimed">${esc(t("Timed"))}</button><button class="btn sm ghost" id="sendModeDeadline">${esc(t("Deadline only"))}</button></div>`);
    modeField.appendChild(modeRow);
    body.appendChild(modeField);

    const durationField = el(`<div class="field"></div>`);
    durationField.appendChild(el(`<label>${esc(t("Duration once started (minutes)"))}</label>`));
    const durationInput = el(`<input class="input" type="number" value="${durationMin}" style="max-width:160px">`);
    durationInput.oninput = (e)=>{ durationMin = parseInt(e.target.value)||90; };
    durationField.appendChild(durationInput);
    body.appendChild(durationField);

    const deadlineField = el(`<div class="field"></div>`);
    deadlineField.appendChild(el(`<label>${esc(t("Deadline"))}</label>`));
    const deadlineInput = el(`<input class="input" type="datetime-local" value="${deadline}">`);
    deadlineInput.oninput = (e)=>{ deadline = e.target.value; };
    deadlineField.appendChild(deadlineInput);
    body.appendChild(deadlineField);

    qs("#sendModeTimed",modeRow).onclick = ()=>{ mode="timed"; qs("#sendModeTimed",modeRow).classList.add("primary"); qs("#sendModeDeadline",modeRow).classList.remove("primary"); durationField.hidden=false; };
    qs("#sendModeDeadline",modeRow).onclick = ()=>{ mode="deadline_only"; qs("#sendModeDeadline",modeRow).classList.add("primary"); qs("#sendModeTimed",modeRow).classList.remove("primary"); durationField.hidden=true; };

    const discField = el(`<div class="field"></div>`);
    discField.appendChild(el(`<label>${esc(t("Result disclosure"))}</label>`));
    [["score_and_summary",t("Score + summary")],["summary_only",t("Summary only (no numeric score)")]].forEach(([val,label])=>{
      const row = el(`<label class="checkbox-row" style="margin-bottom:6px;cursor:pointer"><input type="radio" name="sendDisc" ${disclosure===val?"checked":""}> ${esc(label)}</label>`);
      qs("input",row).onchange = ()=> disclosure = val;
      discField.appendChild(row);
    });
    body.appendChild(discField);

    body.appendChild(el(`<div class="banner info tiny">${esc(t("From / Reply-To:"))} hr@sendinglabs.com ${esc(t("(simulated)"))}</div>`));

    d.appendChild(body);
    const foot = el(`<div class="overlay-foot flex gap-2 justify-end"></div>`);
    const cancelBtn = el(`<button class="btn ghost">${esc(t("Cancel"))}</button>`); cancelBtn.onclick = close;
    const confirmBtn = el(`<button class="btn primary">${esc(t("Confirm send"))}</button>`);
    confirmBtn.onclick = ()=>{
      if(!deadline){ toast(t("Set a deadline first."),"warning"); return; }
      const invId = "inv_"+caseId+"_"+round.id;
      DB.invitations[invId] = { id:invId, caseId, roundId:round.id, questionIds:items.map(pi=>pi.questionId), mode, durationMin: mode==="timed"?durationMin:null, deadline:new Date(deadline+":00Z").toISOString(), status:"sent", acceptedAt:null, startedAt:null, disclosurePolicy:disclosure };
      c.status = "awaiting_acceptance";
      round.status = "invited";
      saveDB(); toast(t("Invitation sent to candidate."),"success");
      close(); if(onSent) onSent();
    };
    foot.appendChild(cancelBtn); foot.appendChild(confirmBtn);
    d.appendChild(foot);
    return d;
  },{wide:true});
}
</script>
<script>
/* ============================================================
   PAGE: Invitation Composer (multi-step, batch, partial failure)
   ============================================================ */
route("/invitations/new", ()=> pageInvitationComposer());

let inviteWizard = null;
function freshWizardFromHash(){
  const q = (location.hash.split("?")[1]||"");
  const params = new URLSearchParams(q);
  const caseIds = (params.get("cases")||"").split(",").filter(Boolean);
  const roundId = params.get("round") || null;
  return {
    step:0,
    roundId,
    recipients: caseIds.map(cid=>({ caseId:cid, roundId, name:DB.core.candidates[DB.cases[cid].candidateId].name, email:DB.core.candidates[DB.cases[cid].candidateId].email, isNew:false })),
    mode:"timed", durationMin:90, deadline:"2026-09-25T23:59:00Z",
    disclosure:"score_and_summary",
    aiRules:"Open-book. AI assistance may be used but sources must be cited.",
    delivery:null
  };
}

function pageInvitationComposer(){
  const q = location.hash.split("?")[1];
  if(q && q.includes("cases=")){ inviteWizard = freshWizardFromHash(); }
  else if(!inviteWizard){ inviteWizard = freshWizardFromHash(); }
  const w = inviteWizard;
  const wrap = el(`<div></div>`);
  wrap.appendChild(crumbs([{label:t("Assessments"),href:"#/assessments"},{label:t("Invite candidates")}]));
  wrap.appendChild(el(`<h1 style="margin-bottom:16px">${esc(t("Invite candidates"))}</h1>`));

  const steps = [t("Recipients"),t("Tests & materials"),t("Timing & submission"),t("Result disclosure"),t("Review & send")];
  const stepBar = el(`<div class="flex gap-2 wrap" style="margin-bottom:20px"></div>`);
  steps.forEach((s,i)=>{
    const pill = el(`<div class="chip" style="${i===w.step?'background:var(--selected-surface);color:var(--accent);border-color:transparent':''}">${i+1}. ${esc(s)}</div>`);
    stepBar.appendChild(pill);
  });
  wrap.appendChild(stepBar);

  if(w.delivery){ wrap.appendChild(renderDeliveryTracking(w)); return wrap; }

  const body = el(`<div class="card card-pad" style="max-width:720px"></div>`);
  if(w.step===0) body.appendChild(stepRecipients(w));
  else if(w.step===1) body.appendChild(stepTests(w));
  else if(w.step===2) body.appendChild(stepTiming(w));
  else if(w.step===3) body.appendChild(stepDisclosure(w));
  else body.appendChild(stepReview(w));
  wrap.appendChild(body);

  const nav = el(`<div class="flex gap-2" style="margin-top:16px;max-width:720px"></div>`);
  if(w.step>0){ const back = el(`<button class="btn">${esc(t("Back"))}</button>`); back.onclick=()=>{ w.step--; navigate("#/invitations/new"); }; nav.appendChild(back); }
  if(w.step<4){ const next = el(`<button class="btn primary">${esc(t("Continue"))}</button>`); next.onclick=()=>{ if(w.recipients.length===0 && w.step===0){ toast("Add at least one recipient.","warning"); return;} w.step++; navigate("#/invitations/new"); }; nav.appendChild(next); }
  const saveExit = el(`<button class="btn ghost">${esc(t("Save draft & exit"))}</button>`);
  saveExit.onclick = ()=>{ toast("Draft invitation saved. You can resume later.","info"); navigate("#/assessments/"+DB.project.id); };
  nav.appendChild(saveExit);
  wrap.appendChild(nav);
  return wrap;
}

function stepRecipients(w){
  const d = el(`<div></div>`);
  d.appendChild(el(`<h3 style="margin-bottom:12px">${esc(t("Recipients"))}</h3>`));
  const list = el(`<div class="flex-col gap-2" style="margin-bottom:12px"></div>`);
  function draw(){
    list.innerHTML = "";
    w.recipients.forEach((r,i)=>{
      const row = el(`<div class="flex items-center justify-between" style="padding:8px 0;border-bottom:1px solid var(--border)">
        <div><b>${esc(r.name)}</b><div class="tiny">${esc(r.email)}${r.isNew?' · '+esc(t("newly added to this batch")):''}</div></div>
        <button class="btn sm ghost">${esc(t("Remove"))}</button></div>`);
      qs(".btn",row).onclick = ()=>{ w.recipients.splice(i,1); draw(); };
      list.appendChild(row);
    });
    if(w.recipients.length===0) list.appendChild(el(`<div class="tiny">${esc(t("No recipients yet."))}</div>`));
  }
  draw();
  d.appendChild(list);
  const addBtn = el(`<button class="btn sm">${esc(t("+ Add Priya Kapoor (demo, new candidate)"))}</button>`);
  addBtn.onclick = ()=>{
    if(!DB.core.candidates.core_candidate_priya){
      DB.core.candidates.core_candidate_priya = { id:"core_candidate_priya", name:"Priya Kapoor", email:"priya.kapoor@example.com", userId:"user_candidate_priya", profileVersion:"v1" };
      DB.identity.participants.user_candidate_priya = { id:"user_candidate_priya", candidateId:"core_candidate_priya", verified:false };
      DB.core.applications.application_priya = { id:"application_priya", candidateId:"core_candidate_priya", jobId:DB.project.jobId, cycleId:"cycle_fin_01", status:"active" };
      DB.cases.case_priya = { id:"case_priya", candidateId:"core_candidate_priya", applicationId:"application_priya", label:"Priya Kapoor — Finance Operations Analyst", planItems:[], status:"linked" };
      saveDB();
    }
    if(w.recipients.some(r=>r.caseId==="case_priya")){ toast("Priya Kapoor is already in this batch.","info"); return; }
    w.recipients.push({ caseId:"case_priya", name:"Priya Kapoor", email:"priya.kapoor@example.com", isNew:true });
    draw();
  };
  d.appendChild(addBtn);
  d.appendChild(el(`<div class="tiny" style="margin-top:10px">${esc(t("Each recipient must already have a confirmed role link (Core Application) before they can appear here."))}</div>`));
  return d;
}
function stepTests(w){
  const d = el(`<div></div>`);
  d.appendChild(el(`<h3 style="margin-bottom:12px">${esc(t("Tests & materials"))}</h3>`));
  const allItems = w.recipients.flatMap(r=>planItemsForCase(r.caseId, r.roundId));
  if(allItems.length===0){ d.appendChild(el(`<div class="banner warning">${esc(t("No plan items found for these recipients — add a test from the Question Bank on their plan page first."))}</div>`)); return d; }
  const seen = new Set();
  allItems.forEach(pi=>{
    if(seen.has(pi.questionId)) return; seen.add(pi.questionId);
    const q = DB.questions[pi.questionId];
    d.appendChild(el(`<div class="card card-pad" style="margin-bottom:8px"><b>${esc(q.code)}</b> — ${esc(q.title)} <span class="chip">v${q.version}</span><div class="tiny">${esc(t("Est."))} ${q.estMinutes} min · ${esc(t("Materials:"))} ${(q.materials||[]).join(", ")||esc(t("none"))}</div></div>`));
  });
  d.appendChild(el(`<div class="tiny">${esc(t("Estimated candidate workload shown per test; total varies by which tests each recipient's plan includes."))}</div>`));
  return d;
}
function stepTiming(w){
  const d = el(`<div></div>`);
  d.appendChild(el(`<h3 style="margin-bottom:12px">${esc(t("Timing & submission"))}</h3>`));
  d.appendChild(el(`<div class="field" style="margin-bottom:12px"><label>${esc(t("Mode"))}</label>
    <div class="flex gap-2">
      <button class="btn sm ${w.mode==='timed'?'primary':''}" id="mTimed">${esc(t("Timed"))}</button>
      <button class="btn sm ${w.mode==='deadline_only'?'primary':''}" id="mDeadline">${esc(t("Deadline only"))}</button>
    </div></div>`));
  qs("#mTimed",d).onclick = ()=>{ w.mode="timed"; navigate("#/invitations/new"); };
  qs("#mDeadline",d).onclick = ()=>{ w.mode="deadline_only"; navigate("#/invitations/new"); };
  if(w.mode==="timed") d.appendChild(el(`<div class="field" style="margin-bottom:12px"><label>${esc(t("Duration once started (minutes)"))}</label><input class="input" type="number" value="${w.durationMin}" id="durInput" style="max-width:160px"></div>`));
  d.appendChild(el(`<div class="field" style="margin-bottom:12px"><label>${esc(t("Deadline"))}</label><input class="input" type="datetime-local" id="deadlineInput" value="2026-09-25T23:59"></div>`));
  d.appendChild(el(`<div class="field"><label>${esc(t("Submission channel"))}</label>
    <div class="tiny">${esc(t("Portal upload (draft until Submit)"))} <b>${esc(t("and"))}</b> ${esc(t("email reply from the verified address to the unified inbox. Complete answers sent from the verified email in the correct thread can be submitted automatically:"))} <span class="mono">hr@sendinglabs.com</span> ${esc(t("(From/Reply-To — simulated only, no real mail is sent)."))}</div></div>`));
  if(w.mode==="timed"){ const di = qs("#durInput",d); if(di) di.oninput=(e)=>w.durationMin=parseInt(e.target.value)||90; }
  return d;
}
function stepDisclosure(w){
  const d = el(`<div></div>`);
  d.appendChild(el(`<h3 style="margin-bottom:12px">${esc(t("Result disclosure"))}</h3>`));
  [["score_and_summary",t("Score + summary")],["summary_only",t("Summary only (no numeric score)")]].forEach(([val,label])=>{
    const row = el(`<label class="checkbox-row" style="margin-bottom:8px;cursor:pointer"><input type="radio" name="disc" ${w.disclosure===val?"checked":""}> ${esc(label)}</label>`);
    qs("input",row).onchange = ()=> w.disclosure = val;
    d.appendChild(row);
  });
  d.appendChild(el(`<div class="tiny" style="margin-top:8px">${esc(t("Never includes internal ranking, reviewer notes, or the internal answer key."))}</div>`));
  return d;
}
function stepReview(w){
  const d = el(`<div></div>`);
  d.appendChild(el(`<h3 style="margin-bottom:12px">${esc(t("Review & send"))}</h3>`));
  d.appendChild(el(`<div class="banner info" style="margin-bottom:12px">${esc(t("Preview shown per recipient: template, question package version, estimated workload, timezone"))} (${TZ}) ${esc(t("and Reply-To."))}</div>`));
  w.recipients.forEach(r=>{
    d.appendChild(el(`<div class="card card-pad" style="margin-bottom:8px">
      <b>${esc(r.name)}</b> · ${esc(r.email)}<div class="tiny">${w.mode==='timed'?w.durationMin+' '+esc(t("min timed")):esc(t("Deadline only"))} · ${esc(t("Deadline"))} ${esc(fmtDateShort(w.deadline))} · ${esc(t("Disclosure:"))} ${w.disclosure==='score_and_summary'?esc(t("Score + summary")):esc(t("Summary only"))}</div>
      <div class="tiny">${esc(t("From / Reply-To:"))} hr@sendinglabs.com ${esc(t("(simulated)"))}</div></div>`));
  });
  const sendBtn = el(`<button class="btn primary" style="margin-top:8px">${esc(t("Send invitations (demo)"))}</button>`);
  sendBtn.onclick = ()=> sendInvitationsDemo(w);
  d.appendChild(sendBtn);
  return d;
}

function sendInvitationsDemo(w){
  const delivery = w.recipients.map((r,i)=>({ ...r, status: r.isNew ? "bounced" : "sent" }));
  w.delivery = delivery;
  delivery.forEach(r=>{
    if(r.status==="sent"){
      const invId = r.roundId ? "inv_"+r.caseId+"_"+r.roundId : "inv_"+r.caseId;
      if(!DB.invitations[invId]){
        DB.invitations[invId] = { id:invId, caseId:r.caseId, roundId:r.roundId||null, questionIds:planItemsForCase(r.caseId, r.roundId).map(pi=>pi.questionId), mode:w.mode, durationMin:w.durationMin, deadline:w.deadline, status:"sent", acceptedAt:null, startedAt:null, disclosurePolicy:w.disclosure };
        DB.cases[r.caseId].status = "awaiting_acceptance";
        if(r.roundId){ const rd = roundsForCase(r.caseId).find(x=>x.id===r.roundId); if(rd) rd.status = "invited"; }
        saveDB();
      }
    }
  });
  saveDB();
  toast("Invitations processed: "+delivery.filter(x=>x.status==='sent').length+" sent, "+delivery.filter(x=>x.status==='bounced').length+" bounced.","info");
  navigate("#/invitations/new");
}

function renderDeliveryTracking(w){
  const d = el(`<div class="card card-pad" style="max-width:720px"></div>`);
  d.appendChild(el(`<h3 style="margin-bottom:12px">${esc(t("Delivery"))}</h3>`));
  w.delivery.forEach(r=>{
    const row = el(`<div class="flex items-center justify-between" style="padding:10px 0;border-bottom:1px solid var(--border)"></div>`);
    row.innerHTML = `<div><b>${esc(r.name)}</b><div class="tiny">${esc(r.email)}</div></div>
      ${r.status==='sent' ? `<span class="badge success"><span class="dot"></span>${esc(t("Sent"))}</span>` : `<span class="badge danger"><span class="dot"></span>${esc(t("Simulated bounce"))}</span>`}`;
    if(r.status==="bounced"){
      const retry = el(`<button class="btn sm">${esc(t("Retry"))}</button>`);
      retry.onclick = ()=>{
        r.status = "sent";
        const invId = r.roundId ? "inv_"+r.caseId+"_"+r.roundId : "inv_"+r.caseId;
        if(!DB.invitations[invId]){
          DB.invitations[invId] = { id:invId, caseId:r.caseId, roundId:r.roundId||null, questionIds:planItemsForCase(r.caseId, r.roundId).map(pi=>pi.questionId), mode:w.mode, durationMin:w.durationMin, deadline:w.deadline, status:"sent", acceptedAt:null, startedAt:null, disclosurePolicy:w.disclosure };
          DB.cases[r.caseId].status = "awaiting_acceptance";
          if(r.roundId){ const rd = roundsForCase(r.caseId).find(x=>x.id===r.roundId); if(rd) rd.status = "invited"; }
        }
        saveDB(); toast(`Retried ${r.name} only — no duplicate candidate created.`,"success");
        navigate("#/invitations/new");
      };
      row.appendChild(retry);
    }
    d.appendChild(row);
  });
  const finishBtn = el(`<button class="btn primary" style="margin-top:16px">Done</button>`);
  finishBtn.onclick = ()=>{ inviteWizard=null; navigate("#/assessments/"+DB.project.id); };
  d.appendChild(finishBtn);
  return d;
}
</script>
<script>
/* ============================================================
   CANDIDATE PORTAL SHELL + PAGES
   ============================================================ */
function allCandidateCaseOptions(){
  return Object.values(DB.cases).filter(Boolean).map(c=>({ id:c.id, name:DB.core.candidates[c.candidateId].name }));
}
function currentCandidateCaseId(){
  if(!DB.settings.candidateViewCaseId || !DB.cases[DB.settings.candidateViewCaseId]) DB.settings.candidateViewCaseId = "case_a";
  return DB.settings.candidateViewCaseId;
}

function renderCandidateShell(path){
  const shell = el(`<div class="cand-shell"></div>`);
  const head = el(`<div class="cand-head"></div>`);
  head.innerHTML = `<div class="flex items-center gap-2 grow"><div class="logo" style="width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-contrast);display:flex;align-items:center;justify-content:center;font-weight:800">H</div><b>HireOS</b><span class="tiny">Candidate Portal</span></div>`;
  const switcherWrap = el(`<div style="position:relative"></div>`);
  const swBtn = el(`<button class="btn sm ghost">Viewing as: ${esc(DB.core.candidates[DB.cases[currentCandidateCaseId()].candidateId].name)} <span class="material-icons-o" style="font-size:16px">expand_more</span></button>`);
  swBtn.onclick = ()=>{ _demoPopoverOpen = !_demoPopoverOpen; render(); };
  switcherWrap.appendChild(swBtn);
  if(_demoPopoverOpen){
    const pop = el(`<div class="demo-popover" style="right:0;top:44px"></div>`);
    pop.innerHTML = `<h4>Demo: switch candidate</h4><div class="tiny" style="margin-bottom:8px">Simulates different candidates opening their own unified-identity portal.</div>`;
    allCandidateCaseOptions().forEach(o=>{
      const b = el(`<div class="nav-item ${o.id===currentCandidateCaseId()?'active':''}">${esc(o.name)}</div>`);
      b.onclick = ()=>{ DB.settings.candidateViewCaseId = o.id; _demoPopoverOpen=false; navigate("#/candidate"); };
      pop.appendChild(b);
    });
    const backBtn = el(`<div class="nav-item" style="margin-top:8px;color:var(--accent)"><span class="material-icons-o" style="font-size:18px">arrow_back</span> Back to employer workspace</div>`);
    backBtn.onclick = ()=>{ _demoPopoverOpen=false; navigate("#/tasks"); };
    pop.appendChild(backBtn);
    switcherWrap.appendChild(pop);
  }
  head.appendChild(switcherWrap);
  shell.appendChild(head);

  const main = el(`<div class="cand-main"></div>`);
  if(path==="/candidate") main.appendChild(pageCandidateHome());
  else {
    const m1 = path.match(/^\/candidate\/invitations\/([^/]+)$/);
    const m2 = path.match(/^\/candidate\/attempts\/([^/]+)$/);
    const m3 = path.match(/^\/candidate\/results\/([^/]+)$/);
    if(m1) main.appendChild(pageCandidateAccept(m1[1]));
    else if(m2) main.appendChild(pageCandidateWork(m2[1]));
    else if(m3) main.appendChild(pageCandidateResult(m3[1]));
    else main.appendChild(pageCandidateHome());
  }
  shell.appendChild(main);
  return shell;
}

function pageCandidateHome(){
  const caseId=currentCandidateCaseId(); const c=DB.cases[caseId]; const cand=DB.core.candidates[c.candidateId];
  const invs=invitationsForCase(caseId); const release=Object.values(DB.releases).find(r=>r.caseId===caseId);
  const wrap=el(`<div></div>`);
  wrap.appendChild(el(`<h1 style="margin-bottom:4px">Hi, ${esc(cand.name.split(" ")[0])}</h1>`));
  wrap.appendChild(el(`<div class="muted" style="margin-bottom:20px">${esc(cand.email)} · verified via unified HireOS identity</div>`));
  if(!invs.length){ wrap.appendChild(el(`<div class="card card-pad"><div class="empty"><div class="big material-icons-o">inbox</div>No assessments yet.</div></div>`)); return wrap; }
  const list=el(`<div class="flex-col gap-3"></div>`);
  invs.forEach(inv=>{
    const round=inv.roundId ? roundsForCase(caseId).find(r=>r.id===inv.roundId) : null;
    const items=planItemsForCase(caseId,inv.roundId);
    const card=el(`<div class="card card-pad"></div>`);
    const title=round ? round.title : 'Round 1';
    card.innerHTML=`<div class="flex items-center justify-between gap-2"><h3>${esc(title)}</h3>${statusBadge(inv.status)}</div><p class="muted" style="margin:8px 0 12px">${items.map(pi=>DB.questions[pi.questionId].code).join(', ')} · Deadline ${esc(fmtDate(inv.deadline))}</p>`;
    const btn=el(`<button class="btn ${['sent','awaiting_acceptance'].includes(inv.status)?'primary':''}">${['sent','awaiting_acceptance'].includes(inv.status)?'Review invitation →':(['accepted','started'].includes(inv.status)?'Continue →':'View status →')}</button>`);
    btn.onclick=()=>{ if(['sent','awaiting_acceptance'].includes(inv.status)) navigate('#/candidate/invitations/'+inv.id); else if(['accepted','started'].includes(inv.status)) navigate('#/candidate/attempts/draft_'+caseId+'__'+inv.id); else navigate('#/candidate/results/'+caseId); };
    card.appendChild(btn); list.appendChild(card);
  });
  if(release && !invs.some(i=>i.status==='submitted')){ const card=el(`<div class="card card-pad"><h3>Result available</h3><button class="btn primary" style="margin-top:8px">View result →</button></div>`); qs('button',card).onclick=()=>navigate('#/candidate/results/'+caseId); list.appendChild(card); }
  wrap.appendChild(list); return wrap;
}

function pageCandidateAccept(invId){
  const inv = DB.invitations[invId];
  const wrap = el(`<div></div>`);
  if(!inv){ wrap.appendChild(el(`<div class="banner danger">Invitation not found.</div>`)); return wrap; }
  const c = DB.cases[inv.caseId]; const cand = DB.core.candidates[c.candidateId];
  const verified = DB.identity.participants[cand.userId] && DB.identity.participants[cand.userId].verified;

  wrap.appendChild(el(`<h1 style="margin-bottom:8px">${esc(DB.core.jobs[DB.project.jobId].title)}</h1>`));
  const q0 = DB.questions[planItemsForCase(inv.caseId)[0].questionId];
  wrap.appendChild(el(`<div class="card card-pad" style="margin-bottom:16px">
    <div class="tiny" style="margin-bottom:6px">Aurora Studio</div>
    <div style="font-weight:700;margin-bottom:8px">${planItemsForCase(inv.caseId).map(pi=>DB.questions[pi.questionId].code).join(", ")}</div>
    <div class="grid-2">
      <div><div class="tiny">Estimated workload</div><div>${planItemsForCase(inv.caseId).reduce((a,pi)=>a+(DB.questions[pi.questionId].estMinutes||0),0)} minutes</div></div>
      <div><div class="tiny">${inv.mode==='timed'?'Time limit once started':'Deadline'}</div><div>${inv.mode==='timed'?inv.durationMin+' minutes':'—'}</div></div>
      <div><div class="tiny">Deadline</div><div>${esc(fmtDate(inv.deadline))} (${TZ})</div></div>
      <div><div class="tiny">AI use policy</div><div>Open-book; cite sources</div></div>
    </div></div>`));

  if(!verified){
    const vcard = el(`<div class="card card-pad" style="margin-bottom:16px"></div>`);
    vcard.innerHTML = `<h3 style="margin-bottom:8px">Verify your email</h3><p class="muted" style="margin-bottom:12px">Confirm control of ${esc(cand.email)} via your unified HireOS identity. This does not create an employer account.</p>
      <div class="field" style="max-width:220px;margin-bottom:12px"><label>Demo code</label><input class="input" id="otpInput" placeholder="Sent to ${esc(cand.email)} (demo: 482913)"></div>`;
    const vbtn = el(`<button class="btn primary">Verify</button>`);
    vbtn.onclick = ()=>{ DB.identity.participants[cand.userId].verified = true; saveDB(); toast("Email verified.","success"); navigate("#/candidate/invitations/"+invId); };
    vcard.appendChild(vbtn);
    wrap.appendChild(vcard);
    return wrap;
  }

  if(inv.status==="accepted" || inv.status==="started"){
    wrap.appendChild(el(`<div class="banner success" style="margin-bottom:16px">Invitation accepted.</div>`));
  }
  const actions = el(`<div class="flex gap-3"></div>`);
  if(inv.status==="sent" || inv.status==="awaiting_acceptance"){
    const accept = el(`<button class="btn primary">Accept</button>`);
    accept.onclick = ()=>{ inv.status="accepted"; inv.acceptedAt = nowISO(); c.status="accepted"; saveDB(); toast("Invitation accepted.","success"); navigate("#/candidate/invitations/"+invId); };
    const decline = el(`<button class="btn ghost">Decline</button>`);
    decline.onclick = ()=> confirmModal({ title:"Decline invitation?", bodyHtml:"<p>You can't undo this from the portal. HR will be notified.</p>", danger:true, confirmLabel:"Decline", onConfirm:()=>{ inv.status="declined"; saveDB(); toast("Invitation declined.","info"); navigate("#/candidate"); } });
    actions.appendChild(accept); actions.appendChild(decline);
  } else if(inv.mode==="timed"){
    const start = el(`<button class="btn primary">Start test</button>`);
    start.disabled = inv.status==="started";
    start.onclick = ()=>{ inv.status="started"; inv.startedAt = nowISO(); c.status="started"; saveDB(); toast("Timer started — "+inv.durationMin+" minutes.","warning"); navigate("#/candidate/attempts/draft_"+inv.caseId); };
    actions.appendChild(start);
    if(inv.status==="started"){ const cont = el(`<button class="btn">Continue →</button>`); cont.onclick=()=>navigate("#/candidate/attempts/draft_"+inv.caseId); actions.appendChild(cont); }
  } else {
    const open = el(`<button class="btn primary">Open assignment</button>`);
    open.onclick = ()=>{ if(inv.status!=="started"){ inv.status="started"; c.status="started"; saveDB(); } navigate("#/candidate/attempts/draft_"+inv.caseId); };
    actions.appendChild(open);
  }
  wrap.appendChild(actions);
  return wrap;
}

function notifyOwnership(caseId, message){
  // PRD §19.3: HR owner and Hiring manager both get an in-app (+ simulated email) notification;
  // same person in both roles is de-duplicated to a single notice. Recorded in the shared Activity feed.
  const c = DB.cases[caseId];
  const recipients = new Set();
  if(c.ownership){ if(c.ownership.hrOwner) recipients.add(c.ownership.hrOwner); if(c.ownership.hiringManager) recipients.add(c.ownership.hiringManager); }
  const names = Array.from(recipients).map(id=>DB.identity.users[id]).filter(Boolean).map(u=>u.name);
  DB.activity.unshift({ at: nowISO(), text: message + (names.length ? " Notified: "+names.join(" and ")+"." : " No HR owner/Hiring manager set — notice held for the plan initiator.") });
  return names;
}

function draftUploadsFor(caseId){
  if(!window._draftUploads) window._draftUploads = {};
  if(!window._draftUploads[caseId]) window._draftUploads[caseId] = {};
  return window._draftUploads[caseId];
}

function pageCandidateWork(attemptOrDraftId){
  const wrap = el(`<div></div>`);
  const isDraft = attemptOrDraftId.startsWith("draft_");
  const draftParts = isDraft ? attemptOrDraftId.replace("draft_","").split("__") : [];
  const caseId = isDraft ? draftParts[0] : DB.attempts[attemptOrDraftId]?.caseId;
  const explicitInvId = draftParts[1] || null;
  const c = DB.cases[caseId];
  if(!c){ wrap.appendChild(el(`<div class="banner danger">Attempt not found.</div>`)); return wrap; }
  const inv = explicitInvId ? DB.invitations[explicitInvId] : activeInvitationForCase(caseId);
  const pi = planItemsForCase(caseId, inv && inv.roundId)[0] || planItemsForCase(caseId)[0];
  const q = DB.questions[pi.questionId];
  const existingAttempt = Object.values(DB.attempts).find(a=>a.caseId===caseId);

  wrap.appendChild(el(`<div class="flex items-center justify-between" style="margin-bottom:8px"><h1>${esc(q.code)} — ${esc(inv && inv.roundId ? ((roundsForCase(caseId).find(r=>r.id===inv.roundId)||{}).title||"Round") : "Round 1")}</h1>${inv.mode==='timed'?'<span class="badge warning"><span class="dot"></span>Timer running</span>':''}</div>`));
  wrap.appendChild(el(`<div class="muted" style="margin-bottom:20px">Deadline ${esc(fmtDate(inv.deadline))} (${TZ})</div>`));

  if(existingAttempt && existingAttempt.status==="submitted"){
    wrap.appendChild(el(`<div class="banner success">Your answers are submitted for this round. Further edits aren't possible on a locked round.</div>`));
    const btn = el(`<button class="btn" style="margin-top:12px">View result status →</button>`); btn.onclick=()=>navigate("#/candidate/results/"+caseId);
    wrap.appendChild(btn);
    return wrap;
  }

  wrap.appendChild(el(`<div class="card card-pad" style="margin-bottom:16px"><h4 style="margin-bottom:8px">Materials</h4>
    <ul style="margin:0;padding-left:20px;list-style:none">${(q.materials||[]).map(m=>`<li style="margin-bottom:4px"><span class="material-icons-o" style="font-size:15px;vertical-align:text-bottom;color:var(--text-tertiary)">attach_file</span> ${esc(m)} <a style="margin-left:8px;cursor:pointer">Download</a></li>`).join("")}</ul></div>`));

  wrap.appendChild(el(`<div class="card card-pad" style="margin-bottom:16px"><h4 style="margin-bottom:8px">Required deliverables</h4>
    <ul style="margin:0;padding-left:20px">${(q.deliverables||[]).map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>`));

  const uploads = draftUploadsFor(caseId);
  const uploadCard = el(`<div class="card card-pad" style="margin-bottom:16px"></div>`);
  uploadCard.appendChild(el(`<h4 style="margin-bottom:8px">Your answers</h4>`));
  const fileRow = el(`<div></div>`);
  function drawFiles(){
    fileRow.innerHTML = "";
    (q.deliverables||[]).forEach(d=>{
      const st = uploads[d] || "missing";
      const row = el(`<div class="flex items-center justify-between" style="padding:8px 0;border-bottom:1px solid var(--border)">
        <div class="truncate" style="max-width:60%">${esc(d)}</div>
        ${st==='missing' ? '<span class="badge neutral">Missing</span>' : st==='scanning' ? '<span class="badge warning"><span class="dot"></span>Scanning</span>' : st==='ready' ? '<span class="badge success"><span class="dot"></span>Uploaded draft — Ready</span>' : ''}
      </div>`);
      if(st==="missing"){
        const btn = el(`<button class="btn sm">Upload</button>`);
        btn.onclick = ()=>{ uploads[d]="scanning"; drawFiles(); setTimeout(()=>{
          uploads[d]="ready"; drawFiles(); toast("File scanned and ready.","success");
          const allReady = (q.deliverables||[]).length>0 && (q.deliverables||[]).every(x=>uploads[x]==="ready");
          if(allReady && !c.draftAnswersAvailable){
            c.draftAnswersAvailable = true;
            notifyOwnership(caseId, `${DB.core.candidates[c.candidateId].name}'s answers are uploaded and ready — awaiting candidate submission. Attempt is still in progress; scoring has not started.`);
            saveDB();
          }
        },700); };
        row.appendChild(btn);
      }
      fileRow.appendChild(row);
    });
  }
  drawFiles();
  uploadCard.appendChild(fileRow);
  uploadCard.appendChild(el(`<div class="tiny" style="margin-top:8px">Uploads are drafts until you submit. You can leave and come back.</div>`));
  wrap.appendChild(uploadCard);

  wrap.appendChild(el(`<div class="card card-pad"><h4 style="margin-bottom:8px">Email option</h4><div class="tiny">Reply from ${esc(DB.core.candidates[c.candidateId].email)} to <span class="mono">hr@sendinglabs.com</span>, same thread as your invitation, with all required files attached. A complete, verified, correctly-threaded reply can submit automatically before the deadline.</div></div>`));

  const bottomBar = el(`<div class="cand-bottom-bar"></div>`);
  const submitBtn = el(`<button class="btn primary">Submit answers</button>`);
  submitBtn.onclick = ()=> openSubmitConfirm(caseId, q);
  bottomBar.appendChild(submitBtn);
  document.title = document.title; // no-op
  wrap.appendChild(bottomBar);
  return wrap;
}

function openSubmitConfirm(caseId, q){
  const uploads = draftUploadsFor(caseId);
  const missing = (q.deliverables||[]).filter(d=>uploads[d]!=="ready");
  confirmModal({
    title:"Submit answers",
    bodyHtml: missing.length
      ? `<div class="banner warning">Missing: ${missing.map(esc).join(", ")}. You can still submit, but this round will be marked incomplete.</div>`
      : `<div class="banner info">Final checklist — ${(q.deliverables||[]).length} deliverable(s) ready. This locks round 1; you won't be able to edit after submitting.</div>`,
    confirmLabel:"Submit answers",
    onConfirm: ()=>{
      const attId = "att_"+caseId;
      const complete = missing.length===0;
      DB.attempts[attId] = { id:attId, caseId, questionId:q.id, round:1, status: complete?"submitted":"incomplete", submittedAt: complete?nowISO():null, receivedAt:nowISO(), missing: complete?[]:missing };
      const inv = Object.values(DB.invitations).find(i=>i.caseId===caseId);
      inv.status = complete ? "submitted" : "started";
      DB.cases[caseId].status = complete ? "review_pending" : "issue_open";
      DB.cases[caseId].draftAnswersAvailable = false; // superseded by the formal submission
      const candName = DB.core.candidates[DB.cases[caseId].candidateId].name;
      if(complete){
        generateSyntheticEvaluation(caseId, attId);
        notifyOwnership(caseId, `${candName}'s answers were formally submitted — ready for review.`);
      } else {
        notifyOwnership(caseId, `${candName}'s submission is incomplete — missing: ${missing.join(", ")}.`);
      }
      saveDB();
      toast(complete ? "Your answers are submitted." : "Submitted with missing items — HR will follow up.", complete?"success":"warning");
      navigate("#/candidate/results/"+caseId);
    }
  });
}

function generateSyntheticEvaluation(caseId, attId){
  const pi = planItemsForCase(caseId)[0]; const q = DB.questions[pi.questionId];
  const evalId = "eval_"+caseId;
  const criteria = q.competencies.map(c=>{
    const max = Math.round(c.fraction*100);
    const ai = Math.max(0, Math.round(max * 0.78));
    return { name:c.name, max, ai, human:null, confidence:"Medium", coverage:"Full", evidence:`"…candidate response addresses ${c.name.toLowerCase()} requirements with supporting detail…"`, source:"Submitted memo" };
  });
  DB.evaluations[evalId] = { id:evalId, attemptId:attId, status:"ai_draft", finalizedBy:null, finalizedAt:null, criteria };
  const taskId = "t_review_"+caseId;
  const own = DB.cases[caseId].ownership || {};
  const reviewAssignee = own.reviewAssignee || own.hiringManager || own.hrOwner || "user_daniel";
  DB.tasks[taskId] = { id:taskId, title:"Review "+DB.core.candidates[DB.cases[caseId].candidateId].name+"'s AI draft evaluation", type:"evaluation_review", assignee:reviewAssignee, status:"open", dueAt: nowISO(), link:"#/attempts/"+attId+"/review", sourceRef:caseId };
}

function pageCandidateResult(caseId){
  const wrap = el(`<div></div>`);
  const c = DB.cases[caseId];
  if(!c){ wrap.appendChild(el(`<div class="banner danger">Not found.</div>`)); return wrap; }
  const release = Object.values(DB.releases).find(r=>r.caseId===caseId);
  const att = Object.values(DB.attempts).find(a=>a.caseId===caseId);

  wrap.appendChild(el(`<h1 style="margin-bottom:16px">Your result</h1>`));
  if(!release){
    wrap.appendChild(el(`<div class="card card-pad"><h3 style="margin-bottom:8px">Under review</h3><p class="muted">Your submission is being reviewed. We'll email you once it's ready — this is not your final result yet.</p>${att&&att.status==='incomplete'?'<div class="banner warning" style="margin-top:12px">We received your submission but it is missing: '+esc((att.missing||[]).join(", "))+'. Please send the remaining file to continue.</div>':''}</div>`));
    return wrap;
  }
  wrap.appendChild(el(`<div class="card card-pad" style="margin-bottom:16px">
    <h3 style="margin-bottom:8px">Outcome</h3>
    <p style="margin-bottom:8px">${esc(release.outcomeText)}</p>
    ${release.showScore ? `<div class="tiny">Score: ${release.overall}</div>` : ""}
    <div class="divider" style="margin:12px 0"></div>
    <h4 style="margin-bottom:6px">Feedback</h4>
    <p class="muted">${esc(release.feedbackText)}</p>
    <div class="divider" style="margin:12px 0"></div>
    <h4 style="margin-bottom:6px">Next step</h4>
    <p>${esc(release.nextStepText)}</p></div>`));

  if(release.nextAction==="revision" && release.revisionRound===1){
    const rcard = el(`<div class="card card-pad"></div>`);
    rcard.innerHTML = `<h3 style="margin-bottom:8px">Revision round 1</h3><p class="muted" style="margin-bottom:12px">${esc(release.revisionHint||"HR would like you to revisit one section based on the feedback above.")} New deadline: ${esc(fmtDate(release.revisionDeadline))}.</p>`;
    const accept = el(`<button class="btn primary">Accept revision</button>`);
    accept.onclick = ()=>{
      const revId=caseId+"_r1"; const rev=DB.revisions[revId]||{id:revId,caseId,round:1};
      let round=roundsForCase(caseId).find(r=>r.id===rev.roundId);
      if(!round){ round=ensureFollowupRound(caseId,'Revision round 1',release.revisionDeadline); const base=planItemsForCase(caseId)[0]; const piId='pi_'+caseId+'_revision1_'+(base?base.questionId:''); if(base&&!DB.plans[piId]){ DB.plans[piId]={id:piId,caseId,questionId:base.questionId,kind:'revision',status:'awaiting_submission'}; DB.cases[caseId].planItems.push(piId); round.planItemIds.push(piId); } rev.roundId=round.id; }
      const invId='inv_'+caseId+'_revision1'; DB.invitations[invId]=DB.invitations[invId]||{id:invId,caseId,roundId:round.id,questionIds:round.planItemIds.map(id=>DB.plans[id].questionId),mode:'deadline_only',durationMin:null,deadline:release.revisionDeadline,status:'accepted',acceptedAt:nowISO(),startedAt:null,disclosurePolicy:'score_and_summary',threadRef:'thread_'+invId};
      rev.status='accepted'; rev.acceptedAt=nowISO(); DB.revisions[revId]=rev; c.status='revision_in_progress'; saveDB(); toast('Revision round accepted.','success'); navigate('#/candidate/attempts/draft_'+caseId+'__'+invId);
    };
    rcard.appendChild(accept);
    const rev = DB.revisions[caseId+"_r1"];
    if(rev && rev.status==="accepted" && rev.emailedAt==null){
      const emailBtn = el(`<button class="btn" style="margin-left:8px">Email revised answers (demo)</button>`);
      emailBtn.onclick = ()=>{
        rev.emailedAt = nowISO(); rev.status="submitted";
        DB.mail["mail_rev_"+caseId] = { id:"mail_rev_"+caseId, from:DB.core.candidates[c.candidateId].email, subject:"Re: FIN-002 — Revision round 1", receivedAt:nowISO(), authStatus:"aligned_pass", threadStatus:"Matched by reply thread — Round 1 revision", matchReason:"Matched by reply thread", classification:"submitted", caseId, attachments:["revised_memo.pdf"] };
        DB.evaluations["eval_"+caseId].revisedCriteria = DB.evaluations["eval_"+caseId].criteria.map(cr=>({ ...cr, ai: Math.min(cr.max, cr.ai+Math.round(cr.max*0.12)) }));
        c.status = "revision_submitted";
        saveDB(); toast("Revised answers received (simulated email).","success");
        navigate("#/candidate/results/"+caseId);
      };
      rcard.appendChild(emailBtn);
    } else if(rev && rev.status==="submitted"){
      rcard.appendChild(el(`<div class="banner success" style="margin-top:12px">Revised answers submitted — HR has been notified.</div>`));
    }
    wrap.appendChild(rcard);
  }
  return wrap;
}
</script>
<script>
/* ============================================================
   PAGE: Submission Inbox + Submission detail
   ============================================================ */
route("/submissions", ()=> pageSubmissionInbox());
route("/attempts/:id/submission", (p)=> pageSubmissionDetail(p.id));

function pageSubmissionInbox(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<h1 style="margin-bottom:4px">${esc(t("Submission Inbox"))}</h1>`));
  wrap.appendChild(el(`<div class="muted" style="margin-bottom:16px">${esc(t("Task and status match first; email plumbing (Message-ID, DKIM/SPF, hash) lives in Details for Operations."))}</div>`));

  const mails = Object.values(DB.mail);
  const groups = ["submitted","incomplete","needs_confirmation","quarantined","duplicate"];
  groups.forEach(g=>{
    const items = mails.filter(m=>m.classification===g);
    if(items.length===0) return;
    wrap.appendChild(el(`<h4 style="margin:16px 0 8px">${esc(t(groupLabel(g)))} (${items.length})</h4>`));
    const card = el(`<div class="card"></div>`);
    items.forEach(m=>{
      const cand = m.caseId ? DB.core.candidates[DB.cases[m.caseId].candidateId] : null;
      const row = el(`<div class="task-row" style="cursor:pointer"></div>`);
      row.onclick = ()=> openMailDrawer(m);
      row.innerHTML = `<div class="task-main">
          <div class="task-title">${cand?esc(cand.name):esc(t("Unknown sender"))} <span class="tiny mono">${esc(m.from)}</span></div>
          <div class="task-sub">${esc(m.subject)} · ${esc(timeAgo(m.receivedAt))} · ${esc(m.matchReason)}</div>
        </div>${statusBadge(m.classification)}`;
      card.appendChild(row);
    });
    wrap.appendChild(card);
  });
  return wrap;
}
function groupLabel(g){ return { submitted:"Submitted", incomplete:"Incomplete", needs_confirmation:"Needs confirmation", quarantined:"Quarantined", duplicate:"Duplicate" }[g]||g; }

function openMailDrawer(m){
  openDrawer((close)=>{
    const d = el(`<div class="flex-col" style="height:100%"></div>`);
    d.appendChild(el(`<div class="overlay-head"><h3>${esc(m.subject)}</h3><div class="icon-btn"><span class="material-icons-o">close</span></div></div>`));
    qs(".icon-btn",d).onclick = close;
    const body = el(`<div class="overlay-body flex-col gap-3"></div>`);
    body.appendChild(el(`<div class="card card-pad"><div><b>${esc(t("From"))}</b> ${esc(m.from)}</div><div><b>${esc(t("Received"))}</b> ${esc(fmtDate(m.receivedAt))} ${esc(t("(trusted receipt time)"))}</div><div><b>${esc(t("Match"))}</b> ${esc(m.matchReason)}</div></div>`));
    body.appendChild(el(`<div class="card card-pad"><h4 style="margin-bottom:8px">${esc(t("Attachments"))}</h4>${(m.attachments||[]).map(a=>`<div style="margin-bottom:4px"><span class="material-icons-o" style="font-size:15px;vertical-align:text-bottom;color:var(--text-tertiary)">attach_file</span> ${esc(a)}</div>`).join("")||`<div class="muted">${esc(t("None"))}</div>`}</div>`));
    if(m.classification==="incomplete"){
      body.appendChild(el(`<div class="banner warning">${esc(t("Missing:"))} ${esc((m.missing||[]).join(", "))}</div>`));
      const btn = el(`<button class="btn">${esc(t("Request missing files"))}</button>`);
      btn.onclick = ()=>{ toast("Request sent to candidate (demo) — Task remains waiting until resolved.","info"); close(); };
      body.appendChild(btn);
    }
    if(m.classification==="needs_confirmation"){
      body.appendChild(el(`<div class="banner warning">${esc(m.matchReason)} — ${esc(t("do not auto-confirm on subject/name alone."))}</div>`));
      const btn = el(`<button class="btn primary">${esc(t("Confirm assignment"))}</button>`);
      btn.onclick = ()=>{ m.classification="submitted"; m.threadStatus="Confirmed by reviewer"; saveDB(); toast("Assignment confirmed by reviewer.","success"); close(); navigate("#/submissions"); };
      const rej = el(`<button class="btn ghost" style="margin-left:8px">${esc(t("Not a match"))}</button>`);
      rej.onclick = ()=>{ toast("Marked as not matching any open case.","info"); close(); };
      body.appendChild(btn); body.appendChild(rej);
    }
    if(m.classification==="quarantined"){
      body.appendChild(el(`<div class="banner danger">${esc(t("Sender authentication failed and attachment type is restricted (macro-enabled). Held for Operations review — not auto-processed."))}</div>`));
    }
    body.appendChild(el(`<details class="tiny" style="margin-top:8px"><summary style="cursor:pointer">${esc(t("Technical details"))}</summary>
      <div class="mono" style="margin-top:6px">mail_id: ${esc(m.id)}<br>auth_status: ${esc(m.authStatus)}<br>thread_ref: thr_${esc(m.id)}</div></details>`));
    d.appendChild(body);
    return d;
  });
}

function pageSubmissionDetail(attId, opts={}){
  const att = DB.attempts[attId];
