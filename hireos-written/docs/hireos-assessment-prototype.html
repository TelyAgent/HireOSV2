/* ---- Builder: rubric editor + publish gate ---- */
function pageBuilder(id){
  const q = DB.questions[id];
  const wrap = el(`<div></div>`);
  if(!q){ wrap.appendChild(el(`<div class="banner danger">${esc(t("Question not found."))}</div>`)); return wrap; }
  wrap.appendChild(crumbs([{label:t("Question Bank"),href:"#/question-bank"},{label:q.code,href:"#/questions/"+q.id},{label:t("Builder")}]));
  wrap.appendChild(el(`<h1 style="margin-bottom:4px">${esc(t("Builder —"))} ${esc(q.title)}</h1>`));
  wrap.appendChild(el(`<div class="muted" style="margin-bottom:16px">${esc(t("Editing creates a new derived version. Sent invitations always keep the exact version they were sent with."))}</div>`));

  if(q.status==="concept"){
    wrap.appendChild(el(`<div class="banner warning" style="margin-bottom:16px">${esc(t("Draft the assessment before inviting candidates. Prompt, materials and rubric are not yet defined for this concept."))}</div>`));
  }

  const cols = el(`<div class="two-col"></div>`);
  const left = el(`<div class="flex-col gap-3"></div>`);
  left.appendChild(el(`<div class="card card-pad"><h4 style="margin-bottom:8px">${esc(t("Sections"))}</h4>
    <div class="nav-item active"><span class="ic">1</span>${esc(t("Prompt & materials"))}</div>
    <div class="nav-item"><span class="ic">2</span>${esc(t("Deliverables"))}</div>
    <div class="nav-item"><span class="ic">3</span>${esc(t("Competency allocation"))}</div>
    <div class="nav-item"><span class="ic">4</span>${esc(t("Quality review"))}</div></div>`));
  const aiCard = el(`<div class="card card-pad"></div>`);
  aiCard.innerHTML = `<h4 style="margin-bottom:8px">${esc(t("AI generate"))}</h4><div class="tiny" style="margin-bottom:8px">${esc(t("Requirement → competency → evidence needed → blueprint → question → rubric."))}</div>`;
  const aiBtn = el(`<button class="btn sm" style="width:100%">${esc(t("Generate draft rubric"))}</button>`);
  const aiStatus = el(`<div class="tiny" style="margin-top:8px"></div>`);
  let aiTries = 0;
  aiBtn.onclick = ()=>{
    aiStatus.textContent = t("Generating… (demo latency)");
    aiBtn.disabled = true;
    setTimeout(()=>{
      aiTries++;
      if(aiTries===1){ aiStatus.innerHTML = `<span style="color:var(--danger)">${esc(t("Generation failed (simulated timeout)."))}</span> <a id="retryAi" style="cursor:pointer">${esc(t("Retry"))}</a>`; qs("#retryAi",aiCard).onclick=()=>aiBtn.onclick(); aiBtn.disabled=false; }
      else{ aiStatus.innerHTML = `<span style="color:var(--success)">${DB.settings.lang==="zh"?"草稿已生成 — <b>标记为草稿</b>，发布前需要人工编辑。":"Draft ready — <b>marked Draft</b>, human edit required before publish."}</span>`; aiBtn.disabled=false; }
    }, 900);
  };
  aiCard.appendChild(aiBtn); aiCard.appendChild(aiStatus);
  left.appendChild(aiCard);
  cols.appendChild(left);

  const right = el(`<div class="flex-col gap-4"></div>`);
  const promptCard = el(`<div class="card card-pad"></div>`);
  promptCard.innerHTML = `<h4 style="margin-bottom:8px">${esc(t("Prompt"))}</h4><div class="field"><textarea class="input" rows="4" id="promptText">${esc(q.prompt)}</textarea></div>`;
  right.appendChild(promptCard);

  const rubricCard = el(`<div class="card card-pad"></div>`);
  rubricCard.innerHTML = `<h4 style="margin-bottom:8px">${esc(t("Competency allocation (criterion fraction)"))}</h4><div class="tiny" style="margin-bottom:12px">${esc(t("Multi-competency questions split credit by criterion. Fractions must sum to exactly 100% — no double-scoring."))}</div>`;
  const rows = el(`<div></div>`);
  let comps = JSON.parse(JSON.stringify(q.competencies));
  function renderRows(){
    rows.innerHTML = "";
    comps.forEach((c,i)=>{
      const row = el(`<div class="crit-row"></div>`);
      row.innerHTML = `<div style="flex:1"><span class="chip">${esc(c.name)}</span></div>
        <input class="input" style="width:90px;height:36px" type="number" min="0" max="100" step="5" value="${Math.round(c.fraction*100)}">
        <span class="tiny">%</span>
        <button class="btn sm ghost" title="${esc(t("Remove"))}"><span class="material-icons-o" style="font-size:16px">close</span></button>`;
      const numInput = qs("input",row);
      numInput.oninput = (e)=>{ comps[i].fraction = (parseFloat(e.target.value)||0)/100; updateSum(); };
      qs(".btn",row).onclick = ()=>{ comps.splice(i,1); renderRows(); updateSum(); };
      rows.appendChild(row);
    });
  }
  const sumLine = el(`<div class="banner" style="margin-top:12px"></div>`);
  function updateSum(){
    const sum = comps.reduce((a,c)=>a+c.fraction,0);
    const ok = Math.abs(sum-1) < 0.001;
    sumLine.className = "banner " + (ok ? "success" : "danger");
    sumLine.innerHTML = ok ? `<span class="material-icons-o" style="font-size:16px;vertical-align:text-bottom">check</span> ${esc(t("Fractions sum to 100%. Ready to publish."))}` : (DB.settings.lang==="zh" ? `各项占比之和为 ${Math.round(sum*100)}% —— 发布前必须恰好等于 100%。请调整上方的行。` : `Fractions sum to ${Math.round(sum*100)}% — must equal exactly 100% before publish. Adjust the row(s) above.`);
    publishBtn.disabled = !ok || q.status==="concept";
  }
  renderRows();
  rubricCard.appendChild(rows);
  const addCompBtn = el(`<button class="btn sm ghost" style="margin-top:8px">${esc(t("+ Add competency"))}</button>`);
  addCompBtn.onclick = ()=>{ comps.push({name:t("New competency"),fraction:0}); renderRows(); updateSum(); };
  rubricCard.appendChild(addCompBtn);
  rubricCard.appendChild(sumLine);
  right.appendChild(rubricCard);

  const publishCard = el(`<div class="card card-pad"></div>`);
  publishCard.innerHTML = `<h4 style="margin-bottom:8px">${esc(t("Publish preview"))}</h4>
    <div class="tiny" style="margin-bottom:8px">${DB.settings.lang==="zh" ? `内容包：题目 · ${(q.materials||[]).length} 份材料 · ${(q.deliverables||[]).length} 项交付物 · ${comps.length} 项能力。` : `Package: prompt · ${(q.materials||[]).length} material(s) · ${(q.deliverables||[]).length} deliverable(s) · ${comps.length} competenc${comps.length===1?"y":"ies"}.`}</div>
    ${q.pendingFractionIssue ? `<div class="tiny" style="margin-bottom:8px">${esc(t("Quality review flagged: competency weights need redistribution before this can publish cleanly."))}</div>` : ''}`;
  const publishBtn = el(`<button class="btn primary">${esc(t("Save & publish new version"))}</button>`);
  publishBtn.onclick = ()=>{
    q.competencies = comps.filter(c=>c.fraction>0);
    q.prompt = qs("#promptText",wrap).value;
    q.version += 1;
    q.status = "published";
    q.pendingFractionIssue = false;
    saveDB();
    toast(`${q.code} published as v${q.version}. Existing sent invitations are unaffected.`, "success");
    navigate("#/questions/"+q.id);
  };
  publishCard.appendChild(publishBtn);
  const saveDraftBtn = el(`<button class="btn ghost" style="margin-left:8px">${esc(t("Save draft (not published)"))}</button>`);
  saveDraftBtn.onclick = ()=>{ toast("Draft saved. Saving is not the same as publishing.","info"); };
  publishCard.appendChild(saveDraftBtn);
  right.appendChild(publishCard);
  updateSum();

  cols.appendChild(right);
  wrap.appendChild(cols);
  return wrap;
}
</script>
<script>
/* ============================================================
   PAGE: Assessments (Projects) / Project detail / Plan
   ============================================================ */
route("/assessments", ()=> pageAssessmentsList());

// Fast path for the common HR action: choose candidates, tests, and send one invite.
function openQuickAssessmentWizard(){
  const candidateCases = Object.values(DB.cases).filter(Boolean).filter(c=>c.applicationId);
  const publishedQuestions = Object.values(DB.questions).filter(q=>q.status === "published");
  const state = { step:0, caseIds:candidateCases.slice(0,1).map(c=>c.id), questionId:publishedQuestions[0] && publishedQuestions[0].id, mode:"timed", duration:90, deadline:"2026-09-25T23:59:00Z" };
  openDrawer((close)=>{
    const d = el(`<div class="flex-col" style="height:100%"></div>`);
    const head = el(`<div class="overlay-head"><div><h3>${esc(t("Create assessment"))}</h3><div class="tiny">${esc(t("Choose candidates, tests and delivery settings in one flow"))}</div></div><div class="icon-btn"><span class="material-icons-o">close</span></div></div>`);
    qs(".icon-btn",head).onclick = close; d.appendChild(head);
    const body = el(`<div class="overlay-body flex-col gap-3"></div>`); d.appendChild(body);
    const foot = el(`<div class="overlay-foot flex items-center justify-between"><button class="btn ghost" id="quickCancel">${esc(t("Cancel"))}</button><div class="flex gap-2"><button class="btn" id="quickBack">${esc(t("Back"))}</button><button class="btn primary" id="quickNext">${esc(t("Continue"))}</button></div></div>`); d.appendChild(foot);
    qs("#quickCancel",foot).onclick=close;
    const render = ()=>{
      body.innerHTML = `<div class="flex gap-2 wrap" style="margin-bottom:4px">${[t("Candidates"),t("Tests"),t("Timing & submission"),t("Review & send")].map((s,i)=>`<span class="chip" style="${i===state.step?'background:var(--selected-surface);color:var(--accent);border-color:transparent':''}">${i+1}. ${esc(s)}</span>`).join("")}</div>`;
      if(state.step===0){
        body.appendChild(el(`<div class="muted">${esc(t("Select one or more candidates for this assessment."))}</div>`));
        candidateCases.forEach(c=>{ const cand=DB.core.candidates[c.candidateId]; const row=el(`<label class="card card-pad flex items-center gap-3" style="cursor:pointer"><input type="checkbox" ${state.caseIds.includes(c.id)?"checked":""}><div><b>${esc(cand.name)}</b><div class="tiny">${esc(cand.email)} · ${esc(DB.core.jobs[DB.project.jobId].title)}</div></div></label>`); qs("input",row).onchange=e=>{ if(e.target.checked) state.caseIds.push(c.id); else state.caseIds=state.caseIds.filter(id=>id!==c.id); }; body.appendChild(row); });
      } else if(state.step===1){
        body.appendChild(el(`<div class="muted">${esc(t("Choose the question pack for this round."))}</div>`));
        const sel=el(`<select class="input"></select>`); publishedQuestions.forEach(q=>{ const o=el(`<option value="${q.id}">${esc(q.code)} — ${esc(q.title)}</option>`); if(q.id===state.questionId)o.selected=true; sel.appendChild(o); }); sel.onchange=()=>state.questionId=sel.value; body.appendChild(sel);
        body.appendChild(el(`<div class="banner info">${esc(t("The selected test will be added to each candidate's first round."))}</div>`));
      } else if(state.step===2){
        body.appendChild(el(`<div class="field"><label>${esc(t("Submission mode"))}</label><select class="input" id="quickMode"><option value="timed">${esc(t("Timed test"))}</option><option value="deadline_only">${esc(t("Deadline only"))}</option></select></div>`));
        body.appendChild(el(`<div class="field"><label>${esc(t("Deadline"))}</label><input class="input" id="quickDeadline" type="datetime-local" value="${state.deadline.replace('Z','')}" /></div>`));
        const mode=qs("#quickMode",body); mode.value=state.mode; mode.onchange=()=>state.mode=mode.value; qs("#quickDeadline",body).onchange=e=>state.deadline=e.target.value;
      } else {
        const q=DB.questions[state.questionId]; body.appendChild(el(`<div class="card card-pad"><b>${esc(t("Assessment summary"))}</b><div class="tiny" style="margin-top:8px">${esc(t("Candidates"))}: ${state.caseIds.length} · ${esc(t("Test"))}: ${q?esc(q.code):"—"} · ${esc(t("Mode"))}: ${state.mode==='timed'?esc(t("Timed")):esc(t("Deadline only"))}</div></div>`));
        body.appendChild(el(`<div class="banner success">${esc(t("Review the details, then send invitations. Each candidate receives an independent invitation and round."))}</div>`));
      }
      qs("#quickBack",foot).disabled=state.step===0; qs("#quickNext",foot).textContent=state.step===3?t("Send invitations"):t("Continue");
    };
    qs("#quickBack",foot).onclick=()=>{if(state.step>0){state.step--;render();}};
    qs("#quickNext",foot).onclick=()=>{
      if(state.step===0 && state.caseIds.length===0){toast(t("Select at least one candidate first."),"warning");return;}
      if(state.step===1 && !state.questionId){toast(t("Select a test first."),"warning");return;}
      if(state.step<3){state.step++;render();return;}
      state.caseIds.forEach(caseId=>{ const c=DB.cases[caseId]; const round=(c.rounds&&c.rounds[0])||{id:"round_"+caseId+"_1",position:1,title:"Round 1",planItemIds:[],status:"planned"}; c.rounds=c.rounds||[round]; if(!c.rounds.includes(round))c.rounds[0]=round; const piId="pi_"+caseId+"_quick_"+state.questionId; if(!DB.plans[piId]){DB.plans[piId]={id:piId,caseId,questionId:state.questionId,kind:"required",status:"awaiting_submission"}; c.planItems.push(piId); round.planItemIds=round.planItemIds||[]; round.planItemIds.push(piId);} const invId="inv_"+caseId+"_quick_"+Date.now(); DB.invitations[invId]={id:invId,caseId,roundId:round.id,questionIds:[state.questionId],mode:state.mode,durationMin:state.mode==='timed'?state.duration:null,deadline:state.deadline,status:"sent",acceptedAt:null,startedAt:null,disclosurePolicy:"score_and_summary",threadRef:"thread_"+invId}; round.status="invited"; c.status="invited"; }); saveDB(); close(); toast(t("Invitations sent and assessment rounds created."),"success"); navigate("#/assessments/"+DB.project.id);
    };
    render(); return d;
  },{wide:true});
}

function openScreeningSelectionDrawer(){
  // ScreeningSelectionContext (Interface Spec §13.2): John/HM check candidates Screening already
  // matched and scored for this role, then Create assessment plan — reusing the same Core
  // Candidate/Application rather than re-confirming a role link candidate-by-candidate.
  openDrawer((close)=>{
    const d = el(`<div class="flex-col" style="height:100%"></div>`);
    d.appendChild(el(`<div class="overlay-head"><h3>${esc(t("Select from screened candidates"))}</h3><div class="icon-btn"><span class="material-icons-o">close</span></div></div>`));
    qs(".icon-btn",d).onclick = close;
    const body = el(`<div class="overlay-body flex-col gap-2"></div>`);
    body.appendChild(el(`<div class="banner info" style="margin-bottom:8px">${esc(t("These candidates already have a Screening result for"))} ${esc(DB.core.jobs[DB.project.jobId].title)}${esc(t(". Picking one reuses that shared record and result — no résumé re-upload or repeated role confirmation."))}</div>`));
    const pool = DB.screeningPool.filter(p=>p.jobId===DB.project.jobId);
    if(pool.length===0){ body.appendChild(el(`<div class="empty"><div class="big material-icons-o">fact_check</div>${esc(t("No unassigned screened candidates for this role right now."))}</div>`)); }
    const checked = new Set();
    pool.forEach(p=>{
      const row = el(`<div class="card card-pad flex items-center gap-3" style="cursor:pointer"></div>`);
      const chk = el(`<input type="checkbox">`);
      chk.onclick = (e)=>{ e.stopPropagation(); if(chk.checked) checked.add(p.candidateId); else checked.delete(p.candidateId); };
      row.onclick = (e)=>{ if(e.target!==chk){ chk.checked=!chk.checked; chk.onclick(e); } };
      row.appendChild(chk);
      const info = el(`<div style="flex:1"></div>`);
      info.innerHTML = `<b>${esc(p.name)}</b> <span class="tiny">${esc(p.email)}</span><div class="tiny">${esc(t("Screening:"))} ${esc(p.recommendation)} (${p.screeningScore}/100) · ${esc(t("screened"))} ${esc(fmtDateShort(p.screenedAt))}</div>`;
      row.appendChild(info);
      body.appendChild(row);
    });
    if(pool.length>0){
      const createBtn = el(`<button class="btn primary" style="margin-top:8px">${esc(t("Create assessment plan"))}</button>`);
      createBtn.onclick = ()=>{
        if(checked.size===0){ toast(t("Select at least one candidate first."),"warning"); return; }
        const newCaseIds = [];
        checked.forEach(candidateId=>{
          const p = DB.screeningPool.find(x=>x.candidateId===candidateId);
          const coreId = "core_candidate_"+p.candidateId;
          const caseId = "case_"+p.candidateId;
          DB.core.candidates[coreId] = { id:coreId, name:p.name, email:p.email, userId:"user_"+p.candidateId, profileVersion:"v1" };
          const appId = "application_"+p.candidateId;
          DB.core.applications[appId] = { id:appId, candidateId:coreId, jobId:p.jobId, cycleId:"cycle_fin_01", status:"active" };
          DB.cases[caseId] = { id:caseId, candidateId:coreId, applicationId:appId, label:p.name+" — "+DB.core.jobs[p.jobId].title, planItems:[], status:"linked",
            ownership:{ hrOwner:DB.settings.currentUser, hiringManager:"user_daniel", reviewAssignee:null }, roundMode:"single",
            screeningSelection:{ screeningResultRef:p.screeningResultRef, screeningArtifactRef:p.screeningArtifactRef, selectionSource:"screening_handoff", selectedBy:DB.settings.currentUser, selectedAt:nowISO() },
            rounds:[{ id:"round_"+caseId+"_1", position:1, title:"Round 1", planItemIds:[], releaseCondition:"manual", deadlineAt:null, status:"planned" }] };
          DB.screeningPool = DB.screeningPool.filter(x=>x.candidateId!==candidateId);
          newCaseIds.push(caseId);
        });
        DB.activity.unshift({ at: nowISO(), text: `${currentUser().name} selected ${newCaseIds.length} candidate(s) from Screening and created assessment plan draft(s); no invitations sent yet.` });
        saveDB();
        close();
        if(newCaseIds.length===1){ toast("Plan draft created — reused the Screening result, add tests to continue.","success"); navigate("#/cases/"+newCaseIds[0]+"/plan"); }
        else { toast(newCaseIds.length+" plan drafts created from Screening. Nothing sent yet.","success"); navigate("#/assessments/"+DB.project.id); }
      };
      body.appendChild(createBtn);
    }
    d.appendChild(body);
    return d;
  });
}

let planPageSelectedRound = {};
let planPageSelectedTab = {};
function roundReleaseReady(caseId, roundId){
  const rounds = roundsForCase(caseId);
  const round = rounds.find(r=>r.id===roundId);
  if(!round) return { ready:false, reason:"Round not found." };
  if(round.releaseCondition==="manual" || round.position===1) return { ready:true };
  const prevIds = round.dependsOnRoundIds && round.dependsOnRoundIds.length ? round.dependsOnRoundIds : [rounds[round.position-2] && rounds[round.position-2].id].filter(Boolean);
  const prevRounds = prevIds.map(id=>rounds.find(r=>r.id===id)).filter(Boolean);
  if(prevRounds.length===0) return { ready:true };
  if(round.releaseCondition==="after_previous_submission"){
    const ok = prevRounds.every(r=>["submitted","review_pending","completed"].includes(r.status));
    return { ready:ok, reason: ok?null:"Previous round hasn't been submitted yet." };
  }
  if(round.releaseCondition==="after_previous_review"){
    const ok = prevRounds.every(r=>r.status==="completed");
    return { ready:ok, reason: ok?null:"Previous round hasn't finished human review yet." };
  }
  return { ready:true };
}

function pagePlan(caseId){
  const wrap = el(`<div></div>`);
  const c = DB.cases[caseId];
  if(!c){ wrap.appendChild(el(`<div class="banner danger">${esc(t("Case not found."))}</div>`)); return wrap; }
  const cand = DB.core.candidates[c.candidateId];
  wrap.appendChild(crumbs([{label:t("My Tasks"),href:"#/tasks"},{label:t("Candidate detail")}]));
  wrap.appendChild(el(`<h1 style="margin-bottom:4px">${esc(cand.name)}${esc(t("'s plan"))}</h1>`));
  wrap.appendChild(el(`<div class="muted" style="margin-bottom:16px">${esc(cand.email)} · ${statusBadge(c.status)}</div>`));
  let detailPanels = {};
  const detailTabs = tabsBar([
    {key:"plan", label:t("Assessment plan")},
    {key:"submission", label:t("Submission")},
    {key:"evaluation", label:t("Comprehensive evaluation")},
    {key:"result", label:t("Evaluation result")}
  ], planPageSelectedTab[caseId]||"plan", key=>{
    planPageSelectedTab[caseId] = key;
    Object.entries(detailPanels).forEach(([name,panel])=>{ panel.hidden = name!==key; });
    qsa(".tab",detailTabs).forEach((tab,index)=>tab.classList.toggle("active", ["plan","submission","evaluation","result"][index]===key));
  });
  detailTabs.style.marginBottom="16px";
  wrap.appendChild(detailTabs);

  if(!c.applicationId){
    wrap.appendChild(el(`<div class="banner warning" style="margin-bottom:16px">${esc(t("Confirm the candidate's role link first — invitations for a formal role assessment require a confirmed Application."))}</div>`));
  }
  if(c.draftAnswersAvailable){
    wrap.appendChild(el(`<div class="banner info" style="margin-bottom:16px">${esc(t("Answers uploaded — awaiting candidate submission. The attempt is still in progress and has not been scored; HR owner and Hiring manager were notified."))}</div>`));
  }

  const rounds = roundsForCase(caseId);
  const round = rounds[0];
  const items = planItemsForCase(caseId, round.id);
  const primaryItem = items[0] || null;
  const app = c.applicationId && DB.core.applications[c.applicationId];
  const job = (app && DB.core.jobs[app.jobId]) || DB.core.jobs[DB.project.jobId];

  // --- Verification goal (derived, read-only) ---
  const goalCard = el(`<div class="card card-pad" style="margin-bottom:16px"></div>`);
  const goalQuestion = primaryItem ? DB.questions[primaryItem.questionId] : null;
  const goalCompetencies = goalQuestion ? goalQuestion.competencies.map(cc=>cc.name).join("、") : "";
  const goalText = goalCompetencies
    ? `${esc(t("Verify whether the candidate can demonstrate, through this role assessment:"))} ${esc(job.title)} ${esc(t("role capability —"))} ${esc(goalCompetencies)}。`
    : `${esc(t("Verify whether the candidate can demonstrate, through this role assessment:"))} ${esc(job.title)} ${esc(t("role's core capability and delivery level."))}`;
  goalCard.innerHTML = `<h4 style="margin-bottom:8px">${esc(t("Verification goal"))}</h4><div class="tiny" style="color:var(--text-secondary);line-height:1.6">${goalText}</div>`;
  wrap.appendChild(goalCard);

  // --- Owner + submission deadline ---
  const ownerRow = el(`<div class="grid-2" style="gap:16px;margin-bottom:16px"></div>`);
  const ownerField = el(`<div class="field"></div>`);
  ownerField.appendChild(el(`<label>${esc(t("Owner"))}</label>`));
  const ownerSel = el(`<select class="input"></select>`);
  ownerSel.appendChild(el(`<option value="">${esc(t("— Not set (defaults to initiator) —"))}</option>`));
  Object.values(DB.identity.users).forEach(u=>{
    const opt = el(`<option value="${u.id}">${esc(u.name)} · ${esc(u.role)}</option>`);
    if(c.ownership && c.ownership.hrOwner===u.id) opt.selected=true;
    ownerSel.appendChild(opt);
  });
  ownerSel.onchange = ()=>{ c.ownership = c.ownership || {}; c.ownership.hrOwner = ownerSel.value || null; saveDB(); toast("Owner updated.","success"); };
  ownerField.appendChild(ownerSel);
  ownerRow.appendChild(ownerField);
  const deadlineField = el(`<div class="field"></div>`);
  deadlineField.appendChild(el(`<label>${esc(t("Submission deadline"))}</label>`));
  const deadlineInput = el(`<input class="input" type="datetime-local" value="${round.deadlineAt ? round.deadlineAt.slice(0,16) : ''}">`);
  deadlineInput.onchange = ()=>{ round.deadlineAt = deadlineInput.value ? new Date(deadlineInput.value+":00Z").toISOString() : null; saveDB(); toast("Deadline updated.","success"); };
  deadlineField.appendChild(deadlineInput);
  ownerRow.appendChild(deadlineField);
  wrap.appendChild(ownerRow);

  // --- Assessment questions: a list of cards, each created via the "Add assessment question" drawer ---
  wrap.appendChild(el(`<div class="flex items-center justify-between wrap gap-2" style="margin-bottom:2px"><h4 style="margin:0">${esc(t("Assessment questions"))}</h4></div>`));
  wrap.appendChild(el(`<div class="tiny" style="color:var(--text-tertiary);margin-bottom:12px">${esc(t("Confirming freezes this into a pending-send version; it is not sent to the candidate immediately."))}</div>`));

  const questionListCard = el(`<div style="margin-bottom:12px"></div>`);
  function renderQuestionList(){
    questionListCard.innerHTML = "";
    const currentItems = planItemsForCase(caseId, round.id);
    if(currentItems.length===0){
      questionListCard.appendChild(el(`<div class="empty card card-pad">${esc(t("No assessment questions yet. Click \"Add assessment question\" to get started."))}</div>`));
      return;
    }
    const existingInv = Object.values(DB.invitations).filter(i=>i.caseId===caseId);
    currentItems.forEach(pi=>{
      const q = DB.questions[pi.questionId];
      const sentInvite = existingInv.find(inv=>(inv.questionIds||[]).includes(pi.questionId) && (!inv.roundId ? round.position===1 : inv.roundId===round.id));
      const alreadySent = !!sentInvite;
      const cardEl = el(`<div class="card card-pad" style="margin-bottom:12px"></div>`);
      const bodyText = pi.customPrompt!=null ? pi.customPrompt : q.prompt;
      cardEl.innerHTML = `<div class="flex items-center justify-between wrap gap-2" style="margin-bottom:8px"><div><b>${esc(q.code)} · ${esc(q.title)}</b><div class="tiny" style="margin-top:2px">${esc(t("adjustable for this candidate only"))}</div></div>${statusBadge(pi.status)}</div>
        <div class="tiny" style="color:var(--text-secondary);line-height:1.6;white-space:pre-wrap;max-height:90px;overflow:auto;margin-bottom:10px">${esc(bodyText)}</div>`;
      const canSend = c.applicationId && !alreadySent;
      const sendBtn = el(`<button class="btn ${alreadySent?'':'primary'} sm" ${canSend?"":"disabled"}>${alreadySent?esc(t("Sent")):esc(t("Send to candidate"))}</button>`);
      sendBtn.title = !c.applicationId ? t("Confirm the candidate's role link first") : (alreadySent ? t("Already sent to this candidate.") : "");
      if(canSend) sendBtn.onclick = ()=> openSendToCandidateDrawer(caseId, round, renderQuestionList);
      const actions = el(`<div class="flex items-center gap-2" style="margin-top:10px"></div>`);
      actions.appendChild(sendBtn);
      if(alreadySent){
        const inv = sentInvite;
        const statusText = inv ? `${inv.mode==='timed'?inv.durationMin+' '+t("min timed"):t("Deadline only")} · ${t("deadline")} ${fmtDateShort(inv.deadline)}` : "";
        if(statusText) actions.appendChild(el(`<span class="tiny" style="color:var(--text-tertiary)">${esc(statusText)}</span>`));
        actions.appendChild(el(`<div class="grow"></div>`));
        const viewSubmissionBtn = el(`<button class="btn sm ghost">${esc(t("View submission →"))}</button>`);
        viewSubmissionBtn.onclick = ()=>{ const att = Object.values(DB.attempts).find(a=>a.caseId===caseId && a.questionId===pi.questionId); if(att) qsa(".tab",detailTabs)[1].click(); else toast("No submission received yet.","info"); };
        actions.appendChild(viewSubmissionBtn);
      } else {
        const editBtn = el(`<button class="btn sm ghost">${esc(t("Edit question"))}</button>`);
        editBtn.onclick = ()=> openQuestionEditDrawer(caseId, round.id, pi.id, renderQuestionList);
        actions.appendChild(editBtn);
        const deleteBtn = el(`<button class="btn sm danger">${esc(t("Delete question"))}</button>`);
        deleteBtn.onclick = ()=> confirmModal({
          title:t("Delete question"),
          bodyHtml:`<div class="tiny">${esc(q.code)} · ${esc(q.title)}</div>`,
          confirmLabel:t("Delete question"),
          danger:true,
          onConfirm:()=>{
            c.planItems = (c.planItems||[]).filter(id=>id!==pi.id);
            round.planItemIds = (round.planItemIds||[]).filter(id=>id!==pi.id);
            delete DB.plans[pi.id];
            saveDB(); toast(t("Question deleted."),"success"); renderQuestionList();
          }
        });
        actions.appendChild(deleteBtn);
      }
      cardEl.appendChild(actions);
      questionListCard.appendChild(cardEl);
    });
  }
  renderQuestionList();
  wrap.appendChild(questionListCard);

  const addQuestionBtn = el(`<button class="btn" style="margin-bottom:16px"><span class="material-icons-o" style="font-size:16px;vertical-align:text-bottom">add</span> ${esc(t("Add assessment question"))}</button>`);
  addQuestionBtn.onclick = ()=>{
    const targetRound = round;
    openQuestionGenerateDrawer(caseId, targetRound.id, ()=>{ renderQuestionList(); });
  };
  wrap.appendChild(addQuestionBtn);


  const planPanel = el(`<div></div>`);
  while(wrap.children.length>4) planPanel.appendChild(wrap.children[4]);
  const submissionPanel = el(`<div hidden></div>`);
  const attempts = Object.values(DB.attempts).filter(a=>a.caseId===caseId);
  if(attempts.length) submissionPanel.appendChild(pageSubmissionDetail(attempts[0].id,{inline:true, onGoToEvaluation: ()=> qsa(".tab",detailTabs)[2].click()}));
  else submissionPanel.appendChild(el(`<div class="empty card card-pad">${esc(t("No submission received yet."))}</div>`));
  const evaluationPanel = el(`<div hidden></div>`);
  if(attempts.length) evaluationPanel.appendChild(pageEvaluationReview(attempts[0].id,{inline:true, onViewFinalResult: ()=> qsa(".tab",detailTabs)[3].click()}));
  else evaluationPanel.appendChild(el(`<div class="empty card card-pad">${esc(t("Waiting for result"))}</div>`));
  const resultPanel = el(`<div hidden></div>`);
  resultPanel.appendChild(pageRelease(caseId,{inline:true}));
  detailPanels={plan:planPanel,submission:submissionPanel,evaluation:evaluationPanel,result:resultPanel};
  const activeDetailTab = planPageSelectedTab[caseId]||"plan";
  Object.entries(detailPanels).forEach(([name,panel])=>{ panel.hidden = name!==activeDetailTab; });
  wrap.appendChild(planPanel); wrap.appendChild(submissionPanel); wrap.appendChild(evaluationPanel); wrap.appendChild(resultPanel);
  return wrap;
}

function openQuestionPickerDrawer(caseId, roundId){
  openDrawer((close)=>{
    const d = el(`<div class="flex-col" style="height:100%"></div>`);
    d.appendChild(el(`<div class="overlay-head"><h3>${esc(t("Add from Question Bank"))}</h3><div class="icon-btn"><span class="material-icons-o">close</span></div></div>`));
    qs(".icon-btn",d).onclick = close;
    const body = el(`<div class="overlay-body flex-col gap-2"></div>`);
    Object.values(DB.questions).filter(q=>["published","draft_review"].includes(q.status)).forEach(q=>{
      const row = el(`<div class="card card-pad flex items-center justify-between" style="cursor:pointer"></div>`);
      row.innerHTML = `<div><b>${esc(q.code)}</b> — ${esc(q.title)}<div class="tiny">${q.roles.join(", ")}</div></div>${statusBadge(q.status)}`;
      row.onclick = ()=>{
        const rounds = roundsForCase(caseId);
        let targetRound = roundId ? rounds.find(r=>r.id===roundId) : null;
        if(!targetRound){
          targetRound = ensureFollowupRound(caseId, 'Round '+(rounds.length+1)+' — Supplemental', null);
        }
        const kind = planItemsForCase(caseId, targetRound && targetRound.id).length===0 ? "required" : "supplemental";
        const piId = "pi_"+caseId+"_"+(targetRound?targetRound.id.replace("round_"+caseId+"_",""):"")+"_"+q.id;
        DB.plans[piId] = { id:piId, caseId, questionId:q.id, kind, status:"awaiting_submission" };
        DB.cases[caseId].planItems.push(piId);
        if(targetRound) targetRound.planItemIds.push(piId);
        DB.cases[caseId].supplementalPending = true;
        const relatedTask = Object.values(DB.tasks).find(t=>t.sourceRef===caseId);
        if(relatedTask) relatedTask.status = "open";
        if(!roundId){ const invId='inv_'+caseId+'_round'+targetRound.position; DB.invitations[invId]=DB.invitations[invId]||{id:invId,caseId,roundId:targetRound.id,questionIds:[q.id],mode:'deadline_only',durationMin:null,deadline:null,status:'sent',acceptedAt:null,startedAt:null,disclosurePolicy:'score_and_summary',threadRef:'thread_'+invId}; targetRound.status='invited'; }
        saveDB(); toast(`${q.code} added to ${targetRound?targetRound.title:"the plan"} as a new plan item with a new invitation.` ,"success");
        close(); navigate("#/cases/"+caseId+"/plan");
      };
      body.appendChild(row);
    });
    d.appendChild(body);
    return d;
  });
}

function openQuestionEditDrawer(caseId, roundId, planId, onDone){
  const pi = DB.plans[planId];

  if(!pi || !q){ toast(t("Question not found."),"warning"); return; }
  const c = DB.cases[caseId];
  const app = c && c.applicationId && DB.core.applications[c.applicationId];
  const job = (app && DB.core.jobs[app.jobId]) || DB.core.jobs[DB.project.jobId];
  let mode = "bank";
  let selectedQuestionId = q.id;

  const suggestions = (roleCompetencyNames.length ? roleCompetencyNames.slice(0,3) : [DB.settings.lang==="zh"?"任务理解与方案设计":"Problem framing and solution design",DB.settings.lang==="zh"?"方法论正确性与严谨性":"Methodological rigor and correctness",DB.settings.lang==="zh"?"结果呈现与沟通表达":"Deliverable clarity and communication"]).map(name=>DB.settings.lang==="zh"?`重点测试候选人在「${name}」方面的实际判断与产出能力`:`Focus on the candidate's real-world judgment and output quality in "${name}"`);
