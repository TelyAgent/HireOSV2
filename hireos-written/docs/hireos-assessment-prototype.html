<!DOCTYPE html>
<meta charset="UTF-8">
<title>HireOS Command · Written Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=swap" rel="stylesheet">
<style>
/* ============================================================
   HireOS Command — Assessment / Written Test
   High-fidelity clickable prototype — design tokens
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

:root{
  /* HireOS Command Interview shared design tokens */
  --font-sans: "Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono: "IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --text-base: 13px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px;
  --radius-card: 14px; --radius-modal: 18px; --radius-sm: 10px; --radius-pill: 999px;
  --control-h: 34px; --row-h: 48px;
  --appbar-h: 56px; --banner-h: 34px; --sidebar-w: 52px; --sidebar-w-collapsed: 52px;

  --canvas: #eef2f6; --surface: #ffffff; --surface-raised: #ffffff; --surface-alt: #f8fafc; --surface-2: var(--surface-alt);
  --text-primary: #111827; --text-secondary: #4b5563; --text-tertiary: #9ca3af; --muted: var(--text-secondary); --ink:#111827;
  --border: #e5e7eb; --border-strong: #d1d5db;
  --accent-50:#ccfbf1; --accent-100:#99f6e4; --accent-300:#5eead4; --accent-500:#0d9488; --accent-600:#0d9488; --accent-700:#0f766e;
  --accent: var(--accent-600); --accent-contrast: #ffffff; --accent-hover: var(--accent-700); --selected-surface: #ccfbf1;
  --success: #059669; --success-bg: #d1fae5; --success-border:#a7f3d0;
  --warning: #b45309; --warning-bg: #fef3c7; --warning-border:#fcd34d;
  --danger: #dc2626; --danger-bg: #fee2e2; --danger-border:#fecaca;
  --info-bg:#e0f2fe;
  --shadow-1: 0 1px 2px rgba(15,23,42,.08), 0 1px 3px rgba(15,23,42,.06);
  --shadow-2: 0 12px 28px rgba(15,23,42,.16);
  --focus-ring: 0 0 0 2px var(--surface), 0 0 0 4px rgba(13,148,136,.38);
  --scrim: rgba(0,0,0,.35);
}

html[data-app-theme="dark"]{
  --canvas:#0f172a; --surface:#1e293b; --surface-raised:#1e293b; --surface-alt:#0f172a;
  --text-primary:#f8fafc; --text-secondary:#d6deea; --text-tertiary:#aab8ca; --muted:var(--text-secondary); --ink:#020617; --selected-surface:#123f39;
  --border:#334155; --border-strong:#475569;
  --accent-50:#123f39; --accent-100:#155e57;
  --success:#6ee7b7; --success-bg:rgba(16,185,129,.18); --success-border:#14532d;
  --warning:#fcd34d; --warning-bg:rgba(245,158,11,.18); --warning-border:#92400e;
  --danger:#fda4af; --danger-bg:rgba(244,63,94,.18); --danger-border:#881337;
  --info-bg:#172554;
  --shadow-1: 0 1px 2px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.22);
  --shadow-2: 0 12px 28px rgba(0,0,0,.34);
  --focus-ring: 0 0 0 2px var(--surface), 0 0 0 4px rgba(94,234,212,.5);
  --scrim: rgba(0,0,0,.5);
}
html[data-app-theme="deep"]{
  --canvas:#0a0f1f; --surface:#16213a; --surface-raised:#16213a; --surface-alt:#0b1526;
  --text-primary:#f8fafc; --text-secondary:#d6deea; --text-tertiary:#aab8ca; --muted:var(--text-secondary); --ink:#020617; --selected-surface:#123f39;
  --border:#334155; --border-strong:#475569;
  --accent-50:#123f39; --accent-100:#155e57;
  --success:#6ee7b7; --success-bg:rgba(16,185,129,.18); --success-border:#14532d;
  --warning:#fcd34d; --warning-bg:rgba(245,158,11,.18); --warning-border:#92400e;
  --danger:#fda4af; --danger-bg:rgba(244,63,94,.18); --danger-border:#881337;
  --info-bg:#172554;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.25);
  --shadow-2: 0 12px 28px rgba(0,0,0,.42);
  --focus-ring: 0 0 0 2px var(--surface), 0 0 0 4px rgba(94,234,212,.5);
  --scrim: rgba(0,0,0,.6);
}
html[data-app-theme="dark"], html[data-app-theme="deep"]{ color-scheme:dark; }

/* Accent options — success/warning/danger never overridden by accent.
   Note: --accent/--accent-hover/--selected-surface (declared once, above)
   resolve dynamically off --accent-600/700/50, so they follow these overrides. */
html[data-accent="teal"]{ --accent-50:#ccfbf1; --accent-100:#99f6e4; --accent-300:#5eead4; --accent-500:#0d9488; --accent-600:#0d9488; --accent-700:#0f766e; --selected-surface:#ccfbf1; }
html[data-accent="teal"][data-app-theme="dark"],
html[data-accent="teal"][data-app-theme="deep"]{ --accent-50:#0F2B28; --accent-100:#123F39; --accent-700:#99f6e4; --selected-surface:#0F2B28; }
html[data-accent="violet"]{ --accent-50:#F0E9FB; --accent-100:#DCCBF5; --accent-300:#AF86E0; --accent-500:#7C4DCF; --accent-600:#6A3FB8; --accent-700:#5A349E; }
html[data-accent="violet"][data-app-theme="dark"],
html[data-accent="violet"][data-app-theme="deep"]{ --accent-50:#241A35; --accent-100:#2F2247; --accent-700:#DCCBF5; --selected-surface:#241A35; }

/* Text size — Small/Medium/Large */
html[data-text-size="small"]{ --text-base:12px; }
html[data-text-size="medium"]{ --text-base:13px; }
html[data-text-size="large"]{ --text-base:15px; --row-h:56px; }

.material-icons-o{ font-family:'Material Symbols Rounded'; font-weight:500; font-style:normal; font-size:20px; line-height:1; letter-spacing:normal; text-transform:none; display:inline-block; white-space:nowrap; word-wrap:normal; direction:ltr; -webkit-font-smoothing:antialiased; vertical-align:middle; font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24; }

body{
  margin:0; background:var(--canvas); color:var(--text-primary);
  font-family: var(--font-sans); font-size: var(--text-base); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{ margin:0; font-weight:600; text-wrap:balance; letter-spacing:-.01em; }
h1{ font-size:24px; line-height:1.25; }
h2{ font-size:18px; line-height:1.3; }
h3{ font-size:16px; line-height:1.35; }
h4{ font-size:15px; line-height:1.4; }
p{ margin:0; }
a{ color:var(--accent); }
button{ font-family:inherit; }
::selection{ background:var(--selected-surface); }
:focus-visible{ outline:none; box-shadow:var(--focus-ring); border-radius:var(--radius-sm); }
[hidden]{ display:none !important; }

.mono{ font-family:var(--font-mono); font-size:.85em; }
.muted{ color:var(--text-secondary); }
.tiny{ font-size:calc(var(--text-base) * .8); color:var(--text-secondary); }
.nowrap{ white-space:nowrap; }
.truncate{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.flex{ display:flex; }
.flex-col{ display:flex; flex-direction:column; }
.grow{ flex:1 1 auto; min-width:0; }
.gap-1{gap:var(--space-1)} .gap-2{gap:var(--space-2)} .gap-3{gap:var(--space-3)} .gap-4{gap:var(--space-4)} .gap-6{gap:var(--space-6)}
.items-center{ align-items:center; }
.justify-between{ justify-content:space-between; }
.wrap{ flex-wrap:wrap; }

/* Buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2);
  height:var(--control-h); padding:0 14px; border-radius:10px;
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text-primary);
  font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap;
  transition: background .12s ease, border-color .12s ease, box-shadow .12s ease;
}
.btn:hover{ background:var(--surface-alt); }
.btn:active{ transform: translateY(0.5px); }
.btn.primary{ background:var(--accent); color:var(--accent-contrast); border-color:transparent; }
.btn.primary:hover{ background:var(--accent-hover); }
.btn.danger{ background:transparent; color:var(--danger); border-color:var(--danger-border); }
.btn.danger:hover{ background:var(--danger-bg); }
.btn.ghost{ background:transparent; border-color:transparent; color:var(--accent); }
.btn.ghost:hover{ background:var(--selected-surface); }
.btn.sm{ height:30px; padding:0 10px; font-size:11.5px; border-radius:9px; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.icon-btn{
  width:36px; height:36px; border-radius:50%; border:1px solid transparent; background:transparent;
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-secondary); font-size:16px; position:relative;
  overflow:hidden; flex:none;
}
.icon-btn:hover{ background:var(--surface-alt); color:var(--text-primary); }
.icon-btn .dot{ position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--danger); border:2px solid var(--surface); }

/* Inputs */
.field{ display:flex; flex-direction:column; gap:var(--space-1); }
.field label{ font-size:calc(var(--text-base) * .82); font-weight:600; color:var(--text-secondary); }
.input, select.input, textarea.input{
  height:var(--control-h); border:1px solid var(--border); border-radius:9px;
  padding:0 var(--space-3); background:var(--surface); color:var(--text-primary); font-size:var(--text-base); font-family:inherit;
  width:100%;
}
textarea.input{ height:auto; padding:var(--space-3); resize:vertical; }
.input:focus{ border-color:var(--accent); }
.input::placeholder{ color:var(--text-tertiary); opacity:1; }
select.input option{ background:var(--surface); color:var(--text-primary); }
html[data-app-theme="dark"] .input,
html[data-app-theme="dark"] select.input,
html[data-app-theme="dark"] textarea.input{ background:#162338; border-color:#526581; }
html[data-app-theme="deep"] .input,
html[data-app-theme="deep"] select.input,
html[data-app-theme="deep"] textarea.input{ background:#111d34; border-color:#526581; }
html[data-app-theme="dark"] .input:focus,
html[data-app-theme="deep"] .input:focus{ border-color:var(--accent-300); }
html[data-app-theme="dark"] .ai-panel{ background:#253248; border-color:#526581; }
html[data-app-theme="deep"] .ai-panel{ background:#202d43; border-color:#526581; }
html[data-app-theme="dark"] select.input,
html[data-app-theme="deep"] select.input,
html[data-app-theme="dark"] input,
html[data-app-theme="deep"] input,
html[data-app-theme="dark"] textarea,
html[data-app-theme="deep"] textarea{ color-scheme:dark; }
.checkbox-row{ display:flex; align-items:center; gap:var(--space-2); }

.segmented-control{ display:inline-flex; gap:2px; padding:3px; background:var(--surface-alt); border:1px solid var(--border); border-radius:12px; }
.segmented-control .btn{ border:none; background:transparent; color:var(--text-secondary); border-radius:9px; box-shadow:none; }
.segmented-control .btn:hover{ background:var(--surface); color:var(--text-primary); }
.segmented-control .btn.primary{ background:var(--surface); color:var(--text-primary); box-shadow:var(--shadow-1); }
.segmented-control .btn.ai-toggle{ color:var(--accent-700); }
.segmented-control .btn.ai-toggle.primary{ background:linear-gradient(135deg,var(--accent-500),var(--accent-700)); color:var(--accent-contrast); }
.ai-panel{ background:var(--surface-alt); border:1px solid var(--border-strong); border-radius:var(--radius-card); padding:16px; }
.ai-suggest-chip{ display:block; width:100%; text-align:left; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--surface); cursor:pointer; font-size:12.5px; line-height:1.5; color:var(--text-primary); margin-bottom:8px; transition:border-color .12s ease, background .12s ease; }
.ai-suggest-chip:hover{ border-color:var(--accent); background:var(--selected-surface); }
.ai-suggest-chip:last-child{ margin-bottom:0; }

/* Surfaces */
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); }
.card-pad{ padding:16px 18px; }
.divider{ height:1px; background:var(--border); border:none; margin:0; }

/* Badges */
.badge{ display:inline-flex; align-items:center; gap:6px; min-height:22px; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:600; border:1px solid transparent; white-space:nowrap; }
.badge .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
.badge.neutral{ background:var(--canvas); color:var(--text-secondary); border-color:var(--border); }
.badge.info{ background:var(--info-bg); color:var(--accent); }
.badge.success{ background:var(--success-bg); color:var(--success); border-color:var(--success-border); }
.badge.warning{ background:var(--warning-bg); color:var(--warning); border-color:var(--warning-border); }
.badge.danger{ background:var(--danger-bg); color:var(--danger); border-color:var(--danger-border); }

/* App shell — shared with HireOS Command Interview */
#app{ min-height:100vh; }
.appshell{ display:block; min-height:100vh; }
.sidebar{
  width:220px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; transition:width .15s ease; overflow:visible; z-index:30;
  position:fixed; left:0; top:var(--appbar-h); bottom:0; height:calc(100vh - var(--appbar-h));
}
.sidebar.collapsed{ width:var(--sidebar-w-collapsed); }
.brand{ display:none; }
.brand .logo{ width:30px; height:30px; border-radius:9px; background:var(--accent); color:var(--accent-contrast); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex:none; }
.brand .name{ display:block; font-weight:700; font-size:13px; white-space:nowrap; }
.sidebar.collapsed .brand{ justify-content:center; padding:0 8px; }
.sidebar.collapsed .brand .name{ display:none; }
.nav-scroll{ overflow:visible; padding:10px 8px; flex:1; }
.nav-section-label{ display:block; font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-tertiary); padding:14px 10px 6px; white-space:nowrap; }
.sidebar.collapsed .nav-section-label{ display:none; }
.nav-item{
  width:100%; height:40px; display:flex; align-items:center; justify-content:flex-start; gap:12px; padding:0 12px; border-radius:11px;
  color:var(--text-secondary); text-decoration:none; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap;
  margin:0 0 4px; position:relative;
}
.nav-item .ic{ width:20px; text-align:center; flex:none; opacity:.88; overflow:hidden; display:inline-block; white-space:nowrap; }
.nav-item .ic.material-icons-o{ font-size:20px; }
.nav-item .grow{ display:block; min-width:0; }
.nav-item .count{ display:inline-flex; margin-left:auto; font-size:10px; color:var(--text-secondary); background:var(--canvas); border-radius:var(--radius-pill); padding:1px 7px; }
.nav-item.active .count{ background:var(--accent-600); color:#fff; }
html[data-app-theme="dark"] .nav-item.active .count, html[data-app-theme="deep"] .nav-item.active .count{ background:#5eead4; color:#042f2e; }
.sidebar.collapsed .nav-item{ width:40px; padding:0; justify-content:center; margin:0 auto 4px; }
.sidebar.collapsed .nav-item .grow,.sidebar.collapsed .nav-item .count{ display:none; }
.nav-item:hover{ background:var(--surface-alt); color:var(--text-primary); }
.nav-item.active{ background:var(--accent-100); color:var(--accent-700); font-weight:700; }
.nav-item.active .ic{ opacity:1; }
.sidebar:not(.collapsed) .nav-item[title]::after{ display:none; }
.nav-item[title]::after{ content:attr(title); position:absolute; left:calc(100% + 10px); top:50%; transform:translateY(-50%); background:var(--ink, #111827); color:#fff; padding:6px 8px; border-radius:7px; font-size:11px; font-weight:600; opacity:0; pointer-events:none; white-space:nowrap; box-shadow:var(--shadow-2); transition:opacity .12s ease; z-index:80; }
.nav-item[title]:hover::after{ opacity:1; }

.main-col{ flex:1; min-width:0; display:flex; flex-direction:column; }
.main-col{ margin-left:var(--sidebar-w-collapsed); padding-top:var(--appbar-h); min-width:0; display:flex; flex-direction:column; }
.sidebar:not(.collapsed) ~ .main-col{ margin-left:220px; }
.appbar{
  height:var(--appbar-h); flex:none; display:flex; align-items:center; gap:var(--space-3); padding:0 16px 0 12px;
  border-bottom:1px solid var(--border); background:var(--surface); color:var(--text-primary); position:fixed; left:0; right:0; top:0; z-index:50;
}
.workspace-banner{ display:none; }
.workspace-banner .banner-dot{ width:6px; height:6px; border-radius:50%; background:#5eead4; flex:none; }
.topbar-logo{ width:32px; height:32px; border-radius:9px; background:#5eead4; color:#0f172a; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; flex:none; }
.appbar .search{ max-width:420px; }
.appbar-product{ display:flex; align-items:center; gap:8px; white-space:nowrap; }
.appbar-product-name{ font-weight:700; font-size:15px; letter-spacing:-.01em; color:var(--text-primary); }
.appbar-product-sep{ color:var(--text-tertiary); }
.appbar-product-module{ color:var(--text-secondary); font-size:13px; font-weight:600; }
.appbar-context{ display:none; }
.appbar .icon-btn{ color:var(--text-secondary); }
.appbar .icon-btn:hover{ background:var(--surface-alt); color:var(--text-primary); }
.topbar-search{ height:32px; width:220px; display:flex; align-items:center; gap:8px; padding:0 10px; border:1px solid var(--border-strong); border-radius:8px; background:var(--surface-alt); color:var(--text-tertiary); font-size:12px; white-space:nowrap; }
.topbar-search .material-icons-o{ font-size:18px; }
.avatar{ width:32px; height:32px; border-radius:50%; background:var(--selected-surface); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:none; }
.role-pill{ display:flex; align-items:center; gap:8px; border:1px solid var(--border-strong); border-radius:20px; padding:5px 12px 5px 6px; cursor:pointer; background:var(--surface); font-size:calc(var(--text-base)*.85); color:var(--text-primary); white-space:nowrap; }
.role-pill:hover{ background:var(--surface-alt); }
.lang-switch{ display:flex; align-items:center; gap:2px; height:32px; padding:3px; border:1px solid var(--border-strong); border-radius:8px; background:var(--surface-alt); cursor:pointer; flex:none; }
.lang-switch span{ padding:3px 9px; border-radius:6px; font-size:11px; font-weight:700; letter-spacing:.01em; color:var(--text-tertiary); }
.lang-switch span.on{ background:var(--accent); color:var(--accent-contrast); }
.lang-switch:hover span:not(.on){ color:var(--text-secondary); }
html[data-app-theme="dark"] .appbar-product-sep, html[data-app-theme="deep"] .appbar-product-sep{ color:#94a3b8; }
html[data-app-theme="dark"] .appbar-product-module, html[data-app-theme="deep"] .appbar-product-module{ color:#e2e8f0; }
html[data-app-theme="dark"] .topbar-search, html[data-app-theme="deep"] .topbar-search{ color:#94a3b8; }
html[data-app-theme="dark"] .role-pill:hover, html[data-app-theme="deep"] .role-pill:hover{ background:#334155; }
.role-pill .demo-tag{ font-size:calc(var(--text-base)*.7); background:var(--warning-bg); color:var(--warning); border:1px solid var(--warning-border); padding:1px 6px; border-radius:8px; font-weight:600; letter-spacing:.02em; }
.content{ padding:24px 32px 60px; max-width:none; width:100%; }
.content.wide{ max-width:none; }

/* Breadcrumb */
.crumbs{ display:flex; align-items:center; gap:6px; font-size:calc(var(--text-base)*.85); color:var(--text-secondary); margin-bottom:var(--space-4); flex-wrap:wrap; }
.crumbs a{ color:var(--text-secondary); text-decoration:none; cursor:pointer; }
.crumbs a:hover{ color:var(--accent); text-decoration:underline; }
.crumbs .sep{ opacity:.6; }
.crumbs .current{ color:var(--text-primary); font-weight:600; }

/* Tabs */
.tabs{ display:flex; gap:18px; border-bottom:1px solid var(--border); margin-bottom:18px; flex-wrap:nowrap; overflow-x:auto; }
.tab{ padding:10px 2px 9px; margin-right:0; font-size:13px; font-weight:600; color:var(--text-secondary); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
.tab:hover{ color:var(--text-primary); }
.tab.active{ color:var(--accent); border-color:var(--accent); }

/* Tables */
.table{ width:100%; border-collapse:collapse; background:var(--surface); }
.table th{ text-align:left; font-size:calc(var(--text-base)*.78); color:var(--text-secondary); font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:0 var(--space-4); height:40px; border-bottom:1px solid var(--border); white-space:nowrap; }
.table td{ padding:0 var(--space-4); height:var(--row-h); border-bottom:1px solid var(--border); font-size:calc(var(--text-base)*.94); vertical-align:middle; }
.table tr.clickable{ cursor:pointer; }
.table tr.clickable:hover td{ background:var(--canvas); }
.table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-card); }
.table-wrap .table{ border:none; }
.table-wrap .table th:first-child, .table-wrap .table td:first-child{ padding-left:var(--space-4); }

/* Grid helpers */
.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-4); }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-4); }
.grid-4{ display:grid; grid-template-columns:repeat(4,1fr); gap:var(--space-4); }

        prompt:"Reporting period end is 30 June 2026 for a Singapore investment entity (functional/reporting currency SGD); information is available through 15 July 2026. All funds and portfolio companies in this case are fictional. This is the SIA-lite variant: HR has waived Task 4 (the SFRS(I) accounting/regulatory memo), and dimension weights need to be rebalanced before this version can be published. (1) Roll forward period-end NAV for five funds: prior NAV + paid-in calls − distributions + valuation changes, watching for stale reports, token exposure, down rounds and exit double-counting. (2) Analyse four direct investments — distress and subsequent events, up-round versus rights differences, SAFE conversion, and liquidation recovery — and output base/low/high valuations with evidence and sensitivity; where a key input is missing, give a conditional formula rather than a fabricated number. (3) Build a portfolio master covering cost, calls, commitment, unfunded commitment, opening/closing value, distributions, realised/unrealised movement, FX, sourcing and your confidence level — keep investment-only value clearly separate from entity NAV that includes cash. (4) Prepare an audit evidence matrix identifying what supports each valuation and what is still missing. (5) Output a two-page-maximum Founder/Board Summary covering the key movements, evidence gaps and next steps.",

      q_fin010:{ id:"q_fin010", code:"FIN-010", title:"AI-Enabled Finance & Back Office Automation Case", type:"Written + File", roles:["Finance Operations Analyst","Finance Operations Lead"], competencies:[{name:"Process redesign",fraction:0.20},{name:"Agent and data design",fraction:0.20},{name:"Controls and failure handling",fraction:0.25},{name:"Dry-run and testing",fraction:0.20},{name:"Roadmap and economics",fraction:0.15}], difficulty:"Hard", estMinutes:180, language:"English", version:1, status:"published", author:"user_daniel", favorite:false,
        prompt:"Today the team manually processes roughly 300 invoices, 100 reimbursements, a 20-person payroll and 600 bank lines a month; everything arrives by email or shared drive, and month-end close takes 8 business days. Use the small attached sample to do a full walkthrough — no real accounts are involved. (1) Diagram the current and proposed process (input → extract → validate → match → approve → execute → archive), covering at least invoices, reimbursements and bank reconciliation, and explain how payroll, entity reminders and investor reporting could reuse the same design. (2) Define the input/output schema, data access, deterministic calculations, human-approval points, failure retries, idempotency keys and audit log for the automation agent, and state which judgments must stay with a human. (3) Dry-run all 8 sample events individually, recording allow/hold/review, your reasoning and the evidence — including a suspicious document, duplicate sends, the wrong entity, a missing receipt, payroll access and network retries. (4) Give a 30/60/90-day rollout roadmap with acceptance tests, a cost-benefit case, go-live/pause conditions and a rollback plan. (5) Deliver a design memo, the workflow diagram, a run log and a test matrix; a prototype or code sample is optional, but a tool list alone is not sufficient. No real payments, real emails or real credentials may be used.",

        prompt:"This case reconstructs an internal review note about a Northstar fund model submission from the original hiring conversation; the original brief and files were never recovered, so this is an independently rebuilt variant and should not be treated as the original candidate's exact question or answer. You are modelling a mock USD fund: opening investment cost USD 12m, opening cash USD 3m, no other assets or liabilities. From the start of Q2 through period end, work through every event in the attachments, with all expenses paid in the period. Two LPs hold a fixed 60%/40% split throughout, and all capital calls, distributions, gains/losses and NAV are allocated on that split — there is no carry, equalisation, tax or accrued liability in scope. (1) Build a schedule of investment cost, opening carrying value, purchases/sales, closing valuation and the realised/unrealised movement. (2) Process the SAFE conversion, the secondary sale and the wind-down/liquidation event, rolling cash, investments and NAV forward separately. (3) Build LP capital accounts (paid-in, unfunded commitment, DPI/RVPI/TVPI), the quarterly journal entries and an audit checklist. (4) Output an accounting memo and Board Summary — if the historical dated cash-flow series isn't provided, do not calculate or invent an IRR; state what's missing instead. Investments are measured at attachment-stated period-end fair value with the movement through P&L for this exercise only — real-world reporting-framework applicability is a separate, dated research question and should not be assumed.",

// Bump the demo storage namespace when the seed shape changes so an older
// browser session cannot hide newly added candidate task states.
const STORAGE_KEY = "hireos_assessment_prototype_v11";
let DB = null;
try{
  const raw = localStorage.getItem(STORAGE_KEY);
  DB = raw ? JSON.parse(raw) : freshSeed();
  if(!DB || DB.meta?.version !== freshSeed().meta.version) DB = freshSeed();
}catch(e){ DB = freshSeed(); }

function saveDB(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){ /* demo-only, best effort */ } }
function resetSeed(){ DB = freshSeed(); saveDB(); toast("Demo seed reset.", "success"); navigate("#/tasks"); }

/* ---------------- Demo clock ---------------- */
function nowISO(){
  const base = new Date(DEMO_CLOCK_BASE).getTime() + (DB.meta.clockOffsetMin||0)*60000;
  return new Date(base).toISOString();
}
function advanceClock(hours){ DB.meta.clockOffsetMin = (DB.meta.clockOffsetMin||0) + hours*60; saveDB(); toast(`Demo clock advanced ${hours}h.`,"info"); render(); }
function fmtDate(iso, opts){
  if(!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString("en-US", Object.assign({ month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit", timeZone:TZ }, opts||{}));
}
function fmtDateShort(iso){ return fmtDate(iso, { hour:undefined, minute:undefined }); }
function timeAgo(iso){
  if(!iso) return "—";
  const diff = new Date(nowISO()).getTime() - new Date(iso).getTime();
  const mins = Math.round(diff/60000);
  if(mins < 1) return "just now";
  if(mins < 60) return mins+"m ago";
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs+"h ago";
  return Math.round(hrs/24)+"d ago";
}

/* ---------------- Toast ---------------- */
function toast(msg, kind){
  const host = document.getElementById("toastHost");
  const el = document.createElement("div");
  const cls = kind==="success" ? "success" : kind==="danger" ? "danger" : "";
  el.className = "toast " + cls;
  el.innerHTML = `<span>${esc(msg)}</span>`;
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .2s"; setTimeout(()=>el.remove(),200); }, 3400);
}

/* ---------------- Utils ---------------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function qs(sel,root){ return (root||document).querySelector(sel); }
function qsa(sel,root){ return Array.from((root||document).querySelectorAll(sel)); }
function currentUser(){ return DB.identity.users[DB.settings.currentUser]; }
function initials(name){ return name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function byId(obj,id){ return obj && obj[id]; }
function candidateOf(caseId){ const c = DB.cases[caseId]; return c ? DB.core.candidates[c.candidateId] : null; }
function questionOf(id){ return DB.questions[id]; }
function planItemsForCase(caseId, roundId){
  const c = DB.cases[caseId];
  if(!c) return [];
  if(!roundId) return c.planItems.map(id=>DB.plans[id]).filter(Boolean);
  const round = roundsForCase(caseId).find(r=>r.id===roundId);
  return round ? round.planItemIds.map(id=>DB.plans[id]).filter(Boolean) : [];
}
function roundsForCase(caseId){
  const c = DB.cases[caseId];
  if(!c) return [];
  if(!c.rounds){
    // Backward-compatible default (AssessmentOwnership/PlanRound, Interface Spec §13): wrap any
    // case created before the multi-round model into a single Round 1 holding its existing items.
    c.rounds = [{ id:"round_"+caseId+"_1", position:1, title:"Round 1", planItemIds:[...c.planItems], releaseCondition:"manual", deadlineAt:null, status: c.status==="evaluated"?"completed":"planned" }];
    c.roundMode = c.roundMode || "single";
    c.ownership = c.ownership || { hrOwner:DB.settings.currentUser, hiringManager:"user_daniel", reviewAssignee:null };
  }
  return c.rounds;
}
function invitationsForCase(caseId){
  return Object.values(DB.invitations).filter(i=>i && i.caseId===caseId).sort((a,b)=>{
    const rank={sent:0,awaiting_acceptance:0,accepted:1,started:2,submitted:3,declined:4};
    return (rank[a.status]??9)-(rank[b.status]??9);
  });
}
function activeInvitationForCase(caseId, roundId){
  const list=invitationsForCase(caseId);
  return (roundId && list.find(i=>i.roundId===roundId)) || list.find(i=>['sent','awaiting_acceptance','accepted','started'].includes(i.status)) || list[0];
}
function ensureFollowupRound(caseId, title, deadlineAt){
  const c=DB.cases[caseId]; const rounds=roundsForCase(caseId);
  const next=(rounds.reduce((m,r)=>Math.max(m,r.position||0),0)||0)+1;
  const round={id:'round_'+caseId+'_'+next,position:next,title:title||('Round '+next),planItemIds:[],releaseCondition:'manual',deadlineAt:deadlineAt||null,status:'planned'};
  rounds.push(round); c.roundMode='multiple'; return round;
}
function currentRoundId(caseId){
  const rounds = roundsForCase(caseId);
  const notDone = rounds.find(r=>!["completed","cancelled"].includes(r.status));
  return (notDone || rounds[rounds.length-1]).id;
}
function taskCountsFor(userId){
  const all = writtenTestTasks().filter(t=>t.assignee===userId);
  const open = all.filter(t=>["open","in_progress","waiting"].includes(t.status)).length;
  return { open, total: all.length };
}
function isWrittenTestTask(task){
  // Written Test tasks always resolve to a candidate Case. Workspace-only tasks
  // such as plan drafts, question publishing and interview handoff are excluded.
  return !!(task && task.sourceRef && DB.cases[task.sourceRef]);
}
function writtenTestTasks(){ return Object.values(DB.tasks).filter(isWrittenTestTask); }
function writtenTaskStatus(task){
  const c = task && task.sourceRef ? DB.cases[task.sourceRef] : null;
  const invitations = c ? Object.values(DB.invitations).filter(i=>i.caseId===c.id) : [];
  const latestInvite = invitations[invitations.length-1];
  const result = c ? Object.values(DB.results).find(r=>r.caseId===c.id) : null;
  const submitted = !!(latestInvite && latestInvite.status==="submitted") || !!(c && c.rounds && c.rounds.some(r=>r.status==="submitted")) || !!(c && c.status==="submitted");
  if(c && c.supplementalPending) return "pending_submission";
  if(task.status === "completed" || (c && ["completed","released"].includes(c.status))) return "written_completed";
  if(task.type === "evaluation_review" || task.type === "result_release" || (c && ["review_pending","evaluated"].includes(c.status))) return "pending_result_review";
  if(submitted && !result) return "waiting_result";
  if((latestInvite && ["accepted","started"].includes(latestInvite.status)) || (c && ["awaiting_submission","started"].includes(c.status))) return "pending_submission";
  if((latestInvite && ["sent","opened"].includes(latestInvite.status)) || (c && c.status === "invited")) return "test_sent";
  return "pending_test";
}
function openCandidateResume(candidate, job){
  openDrawer((close)=>{
    const d=el(`<div class="flex-col" style="height:100%"></div>`);
    d.appendChild(el(`<div class="overlay-head"><div><h3>${esc(t("Candidate resume"))}</h3><div class="tiny">${esc(candidate.name)}</div></div><div class="icon-btn"><span class="material-icons-o">close</span></div></div>`));
    qs(".icon-btn",d).onclick=close;
    const body=el(`<div class="overlay-body flex-col gap-3"></div>`);
    body.appendChild(el(`<div class="card card-pad"><div class="flex items-center gap-3"><div class="avatar" style="width:48px;height:48px">${esc(candidate.name.split(/\s+/).map(x=>x[0]).join("").slice(0,2))}</div><div><h3>${esc(candidate.name)}</h3><div class="muted">${esc(candidate.email)}</div></div></div></div>`));
    body.appendChild(el(`<div class="card card-pad"><div class="tiny">${esc(t("Target role"))}</div><b>${esc(job.title)}</b><div class="tiny" style="margin-top:8px">Profile ${esc(candidate.profileVersion||"v1")}</div></div>`));
    const resumeSections = [
      {title:"Professional summary", body:`${candidate.name} is being assessed for the ${job.title} role. The structured profile is ready for recruiter and reviewer use.`},
      {title:"Experience", body:`Relevant experience aligned to ${job.title}; verify detailed employment dates and achievements against the source resume before making a decision.`},
      {title:"Core skills", body:"Written communication · Problem solving · Role-specific analysis · Stakeholder collaboration"},
      {title:"Education", body:"Education history is available in the candidate profile record."}
    ];
    resumeSections.forEach(section=>body.appendChild(el(`<div class="card card-pad"><h4 style="margin-bottom:6px">${esc(t(section.title))}</h4><div class="muted" style="line-height:1.55">${esc(section.body)}</div></div>`)));
    const caseEntry=Object.values(DB.cases).find(c=>c.candidateId===candidate.id);
    const result=caseEntry && Object.values(DB.results).find(r=>r.caseId===caseEntry.id);
    body.appendChild(el(`<div class="card card-pad"><div class="tiny">${esc(t("Assessment result"))}</div><div style="font-size:28px;font-weight:700;margin-top:6px">${result && result.overall!=null ? esc(result.overall)+" / 100" : esc(t("Waiting for result"))}</div><div class="tiny" style="margin-top:6px">${result ? esc(result.status) : esc(t("No result has been returned yet."))}</div></div>`));
    if(candidate.profileNote) body.appendChild(el(`<div class="banner info">${esc(candidate.profileNote)}</div>`));
    body.appendChild(el(`<div class="banner info">${esc(t("Resume preview is linked to the shared candidate record."))}</div>`));
    d.appendChild(body); return d;
  },{wide:true});
}
function overallLabel(score){ return score==null ? "Unknown" : score; }

<script>
/* ============================================================
   ROUTER + APP SHELL
   ============================================================ */
const ROUTES = [];
function route(pattern, fn){ ROUTES.push({ re: new RegExp("^"+pattern.replace(/:[^/]+/g,"([^/]+)")+"$"), keys:(pattern.match(/:[^/]+/g)||[]).map(k=>k.slice(1)), fn }); }
function navigate(hash){ if(location.hash===hash){ render(); } else { location.hash = hash; } }
function currentPath(){ return (location.hash||"#/tasks").slice(1) || "/tasks"; }

function matchRoute(path){
  for(const r of ROUTES){
    const m = path.match(r.re);
    if(m){ const params={}; r.keys.forEach((k,i)=>params[k]=decodeURIComponent(m[i+1])); return { fn:r.fn, params }; }
  }
  return null;
}

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", boot);

function applyThemeAttrs(){
  const html = document.documentElement;
  const s = DB.settings;
  let mode = s.theme;
  if(mode==="system"){ mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
  if(mode==="light") html.removeAttribute("data-app-theme"); else html.setAttribute("data-app-theme", mode);
  if(s.accent==="blue") html.removeAttribute("data-accent"); else html.setAttribute("data-accent", s.accent);
  html.setAttribute("data-text-size", s.textSize);
}

function boot(){
  applyThemeAttrs();
  if(!location.hash) location.hash = "#/tasks";
  render();
}

let _demoPopoverOpen = false;
let _drawerStack = [];

function render(){
  applyThemeAttrs();
  const app = document.getElementById("app");
  const path = currentPath();

  if(path.startsWith("/candidate")){
    app.innerHTML = "";
    app.appendChild(renderCandidateShell(path));
    saveDB();
    return;
  }

  app.innerHTML = "";
  app.appendChild(renderEmployerShell(path));
  saveDB();
}

/* ---------------- Employer Shell ---------------- */

function pageTitleFor(path){
  const map = [
    [/^\/tasks/,"My Tasks"],[/^\/assessments\/[^/]+\/builder/,"Builder"],[/^\/assessments\/[^/]+$/,"Project"],[/^\/assessments$/,"Assessments"],
    [/^\/question-bank$/,"Question Bank"],[/^\/questions\//,"Question"],[/^\/cases\/[^/]+\/plan/,"Plan"],
    [/^\/invitations\/new/,"Invite Candidates"],[/^\/submissions$/,"Submission Inbox"],[/^\/attempts\/[^/]+\/submission/,"Submission"],
    [/^\/attempts\/[^/]+\/review/,"Evaluation"],[/^\/results\//,"Release"],[/^\/cases\/[^/]+\/revisions/,"Revision"],
    [/^\/comparisons/,"Compare"],[/^\/deliveries/,"Handoff"],[/^\/files/,"Files & Integrations"],[/^\/ai-models/,"AI Models"],[/^\/settings/,"Settings"]
  ];
  for(const [re,label] of map) if(re.test(path)) return label;
  return "Assessment";
}

    row.onclick = ()=>{ DB.settings.currentUser = u.id; overlay.remove(); saveDB(); render(); toast(`Switched to ${u.name} (Demo role)`,"info"); };
    body.appendChild(row);
  });
  modal.appendChild(body);
  const foot = el(`<div class="overlay-foot"></div>`);
  const closeBtn = el(`<button class="btn ghost">Close</button>`); closeBtn.onclick = ()=> overlay.remove();
  foot.appendChild(closeBtn);
  modal.appendChild(foot);
  overlay.appendChild(modal);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  document.addEventListener("keydown", function esc1(e){ if(e.key==="Escape"){ overlay.remove(); document.removeEventListener("keydown",esc1); } });
  document.body.appendChild(overlay);
}

/* ---------------- Shared small components ---------------- */
function crumbs(items){
  const wrap = el(`<div class="crumbs"></div>`);
  items.forEach((it,i)=>{
    if(i>0) wrap.appendChild(el(`<span class="sep">/</span>`));
    if(it.href){ const a = el(`<a>${esc(it.label)}</a>`); a.onclick=()=>navigate(it.href); wrap.appendChild(a); }
    else wrap.appendChild(el(`<span class="current">${esc(it.label)}</span>`));
  });
  return wrap;
}
function tabsBar(tabs, activeKey, onSelect){
  const wrap = el(`<div class="tabs"></div>`);
  tabs.forEach(t=>{
    const tab = el(`<div class="tab ${t.key===activeKey?'active':''}">${esc(t.label)}</div>`);
    tab.onclick = ()=> onSelect(t.key);
    wrap.appendChild(tab);
  });
  return wrap;
}
function statusBadge(status){
  const map = {
    open:["neutral","Open"], in_progress:["info","In progress"], waiting:["warning","Waiting"], completed:["success","Completed"], cancelled:["neutral","Cancelled"],
    accepted:["info","Accepted"], started:["info","Started"], submitted:["success","Submitted"], incomplete:["warning","Incomplete"],
    needs_confirmation:["warning","Needs confirmation"], quarantined:["danger","Quarantined"], duplicate:["neutral","Duplicate"],
    final:["success","Final"], ai_draft:["warning","AI draft — not final"], published:["success","Published"], draft:["neutral","Draft"],
    active:["info","Active"], evaluated:["info","Evaluated"], review_pending:["warning","Review pending"], issue_open:["danger","Issue open"],
    awaiting_submission:["neutral","Awaiting submission"], concept:["neutral","Concept"], draft_review:["warning","In review"],
    internal_only:["neutral","Internal only"], final_not_released:["warning","Final — not released"], awaiting_ack:["warning","Awaiting confirmation"],
    released:["success","Released"], linked:["neutral","Linked — no plan yet"],
    planned:["neutral","Planned"], ready_to_release:["info","Ready to release"], invited:["info","Invited"],
    written_completed:["success","Written completed"], pending_test:["info","Pending test"], pending_submission:["warning","Pending submission"], test_sent:["info","Test sent"], pending_result_review:["danger","Pending result review"], waiting_result:["neutral","Waiting for result"]
  };
  const [kind,label] = map[status] || ["neutral", status];
  return `<span class="badge ${kind}"><span class="dot"></span>${esc(t(label))}</span>`;
}
function unknownOr(v, suffix){ return v==null ? `<span class="badge neutral">Unknown</span>` : (v + (suffix||"")); }
function confirmModal(opts){
  const overlay = el(`<div class="overlay center"></div>`);
  const modal = el(`<div class="modal"></div>`);
  modal.appendChild(el(`<div class="overlay-head"><h3>${esc(opts.title)}</h3><div class="icon-btn"><span class="material-icons-o">close</span></div></div>`));
  qs(".icon-btn", modal).onclick = ()=> overlay.remove();
  const body = el(`<div class="overlay-body"></div>`); body.innerHTML = opts.bodyHtml || "";
  modal.appendChild(body);
  const foot = el(`<div class="overlay-foot"></div>`);
  const cancel = el(`<button class="btn ghost">Cancel</button>`); cancel.onclick=()=>overlay.remove();
  const confirm = el(`<button class="btn ${opts.danger?'danger':'primary'}">${esc(opts.confirmLabel||"Confirm")}</button>`);
  confirm.onclick = ()=>{ opts.onConfirm && opts.onConfirm(); overlay.remove(); };
  foot.appendChild(cancel); foot.appendChild(confirm);
  modal.appendChild(foot);
  overlay.appendChild(modal);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  document.addEventListener("keydown", function esc1(e){ if(e.key==="Escape"){ overlay.remove(); document.removeEventListener("keydown",esc1); } });
  document.body.appendChild(overlay);
  return overlay;
}
function openDrawer(renderFn, opts){
  const overlay = el(`<div class="overlay"></div>`);
  const drawer = el(`<div class="drawer ${opts&&opts.wide?'wide':''}"></div>`);
  drawer.appendChild(renderFn(()=>overlay.remove()));
  overlay.appendChild(drawer);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  document.addEventListener("keydown", function esc1(e){ if(e.key==="Escape"){ overlay.remove(); document.removeEventListener("keydown",esc1); } });
  document.body.appendChild(overlay);
  return overlay;
}
</script>
<script>
/* ============================================================
   PAGE: My Tasks / Home
   ============================================================ */
route("/tasks", ()=> pageMyTasks());

function myWorkCards(){
  const uid = DB.settings.currentUser;
  const mine = Object.values(DB.tasks).filter(t=>t.assignee===uid && t.status!=="completed" && t.status!=="cancelled");
  mine.sort((a,b)=> new Date(a.dueAt)-new Date(b.dueAt));
  return mine.slice(0,4);
}

function pageMyTasks(){
  const wrap = el(`<div></div>`);
  const uid = DB.settings.currentUser;
  const user = currentUser();

  wrap.appendChild(el(`<h1 style="margin-bottom:4px">${esc(t("My Tasks"))}</h1>`));
  wrap.appendChild(el(`<div class="muted" style="margin-bottom:16px">${esc(t("Signed in as"))} ${esc(user.name)} · ${esc(user.role)} · ${esc(DB.identity.workspace.name)}</div>`));

  // Workspace overview
  const metrics = computeWorkspaceMetrics(uid);
  const metricGrid = el(`<div class="grid-4" style="margin-bottom:8px"></div>`);
  metrics.primary.forEach(m=> metricGrid.appendChild(metricCard(m)));
  wrap.appendChild(metricGrid);

  const moreWrap = el(`<div style="margin-bottom:24px"></div>`);
  const moreToggle = el(`<button class="btn ghost sm" style="padding-left:0"><span class="material-icons-o" style="font-size:16px">expand_more</span> ${esc(t("More statistics"))}</button>`);
  const moreGrid = el(`<div class="grid-4" style="margin-top:8px" hidden></div>`);
  metrics.more.forEach(m=> moreGrid.appendChild(metricCard(m)));
  let expanded=false;
  moreToggle.onclick = ()=>{ expanded=!expanded; moreGrid.hidden=!expanded; moreToggle.innerHTML = `<span class="material-icons-o" style="font-size:16px">${expanded?"expand_less":"expand_more"}</span> ${esc(t("More statistics"))}`; };
  moreWrap.appendChild(moreToggle); moreWrap.appendChild(moreGrid);
  wrap.appendChild(moreWrap);

  // Status filters and table-style task list. The filters describe task state rather than ownership.
  const listHost = el(`<div></div>`);
  let activeFilter = "all";
  let activeView = "list";
  const filterBar = el(`<div class="flex items-center justify-between wrap gap-3" style="margin-bottom:12px"></div>`);
  const filters = el(`<div class="flex gap-2 wrap"></div>`);
  const filterDefs = [
    {key:"all", label:"All tasks"},
    {key:"written_completed", label:"Written completed"},
    {key:"pending_test", label:"Pending test"},
    {key:"pending_submission", label:"Pending submission"},
    {key:"pending_result_review", label:"Pending result review"}
  ];
  filterDefs.forEach(def=>{
    const writtenTasks = writtenTestTasks();
    const count = def.key==="all" ? writtenTasks.length : writtenTasks.filter(x=>writtenTaskStatus(x)===def.key).length;
    const b = el(`<button class="btn sm ${def.key===activeFilter?'primary':''}" data-filter="${def.key}">${esc(t(def.label))} (${count})</button>`);
    b.onclick=()=>{ activeFilter=def.key; qsa("button[data-filter]",filters).forEach(x=>x.classList.toggle("primary",x===b)); listHost.innerHTML=""; listHost.appendChild(taskListForTab(def.key, activeView)); };
    filters.appendChild(b);
  });
  const viewToggle = el(`<div class="segmented-control"><button class="btn sm primary" data-view="list">${esc(t("Task list"))}</button><button class="btn sm ghost" data-view="cluster">${esc(t("Cluster by JD"))}</button></div>`);
  qsa("button[data-view]",viewToggle).forEach(b=>b.onclick=()=>{ activeView=b.dataset.view; qsa("button[data-view]",viewToggle).forEach(x=>x.classList.toggle("primary",x===b)); listHost.innerHTML=""; listHost.appendChild(taskListForTab(activeFilter,activeView)); });
  filterBar.appendChild(filters); filterBar.appendChild(viewToggle); wrap.appendChild(filterBar);
  listHost.appendChild(taskListForTab(activeFilter,activeView)); wrap.appendChild(listHost);

  return wrap;
}

function computeWorkspaceMetrics(uid){
  const scoped = currentUser().scope === "restricted";
  const activeProjects = Object.values(DB.project ? [DB.project] : []).filter(p=>p.status==="active").length;
  const invitesAwaitingAcceptance = Object.values(DB.invitations).filter(i=>["sent","opened"].includes(i.status)).length;
  const invitesAwaitingSubmission = Object.values(DB.invitations).filter(i=>["accepted","started"].includes(i.status)).length;
  const submissionIssues = new Set(Object.values(DB.mail).filter(m=>["incomplete","needs_confirmation","quarantined"].includes(m.classification)).map(m=>m.caseId||m.id)).size;
  const resultsToRelease = Object.values(DB.results).filter(r=>r.status==="final_not_released").length;
  const writtenTasks = writtenTestTasks();
  const counts = taskCountsFor(uid);
  const primary = [
    { label:"My open tasks", value: scoped ? 0 : counts.open, tooltip:"Unique task_id, open/in_progress/waiting", link:"#/tasks" },
    { label:"Reviews awaiting me", value: scoped?0:writtenTasks.filter(t=>t.assignee===uid && ["evaluation_review","result_release"].includes(t.type) && t.status!=="completed").length, link:"#/tasks" },
    { label:"Due today", value: scoped?0:Object.values(DB.tasks).filter(t=>t.assignee===uid && isDueToday(t.dueAt)).length, link:"#/tasks" },
    { label:"In progress", value: writtenTasks.filter(t=>t.assignee===uid && t.status==="in_progress").length, link:"#/tasks" }
  ];
  const more = [
    { label:"Active projects", value: scoped?0:activeProjects, link:"#/assessments" },
    { label:"Awaiting acceptance", value: scoped?0:invitesAwaitingAcceptance, link:"#/assessments" },
    { label:"Awaiting submission", value: scoped?0:invitesAwaitingSubmission, link:"#/assessments" },
    { label:"Submission issues", value: scoped?0:submissionIssues, link:"#/submissions" },
    { label:"Results to release", value: scoped?0:resultsToRelease, link:"#/assessments" },
    { label:"Delivery issues", value: scoped?"Unavailable":0, link:"#/files" }
  ];
  return { primary, more };
}
function isDueToday(iso){
  if(!iso) return false;
  const d = new Date(iso), n = new Date(nowISO());
  return d.getUTCFullYear()===n.getUTCFullYear() && d.getUTCMonth()===n.getUTCMonth() && d.getUTCDate()===n.getUTCDate();
}

function metricCard(m){
  const c = el(`<div class="metric" style="cursor:${m.link?'pointer':'default'}"></div>`);
  c.innerHTML = `<div class="label">${esc(t(m.label))}</div><div class="value">${typeof m.value==="number"?m.value:esc(t(m.value))}</div><div class="sub">${m.tooltip?esc(t(m.tooltip)):esc(t("Same filter as list view"))}</div>`;
  if(m.link) c.onclick = ()=> navigate(m.link);
  return c;
}

function actionTaskCard(tk){
  const cand = tk.sourceRef && DB.cases[tk.sourceRef] ? candidateOf(tk.sourceRef) : null;
  const card = el(`<div class="card card-pad flex-col gap-2" style="cursor:pointer"></div>`);
  card.onclick = ()=> navigate(tk.link);
  card.innerHTML = `
    <div class="flex items-center justify-between">${statusBadge(tk.status)}<span class="tiny">${esc(t("Due"))} ${esc(fmtDateShort(tk.dueAt))}</span></div>
    <div class="task-title">${esc(tk.title)}</div>
    <div class="task-sub">${cand?esc(cand.name)+" · ":""}${esc(taskTypeLabel(tk.type))}</div>
    <div class="tiny">${tk.status==="waiting" ? esc(t("Waiting:"))+" "+esc(tk.waitingReason||"") : esc(t("Source:"))+" "+esc(tk.sourceRef||"—")}</div>
  `;
  return card;
}
function taskTypeLabel(type){
  const label = { result_release:"Result release", evaluation_review:"Evaluation review", submission_issue:"Submission issue", reviewer_queue:"Reviewer queue", plan_review:"Plan review", delivery_recovery:"Delivery recovery", invite_pending:"Invite pending" }[type] || type;
  return t(label);
}

function recordTeamAction(t, uid){
  // Startup Team Access (PRD §14/§20): any valid employee may act directly on a colleague's
  // task without claiming or reassigning it. Records performed_by and notifies the original
  // assignee; the assignee field itself never changes.
  if(t.assignee && t.assignee!==uid && DB.identity.users[t.assignee] && DB.identity.users[uid]){
    t.performedBy = uid;
    const actor = DB.identity.users[uid], owner = DB.identity.users[t.assignee];
    DB.activity.unshift({ at: nowISO(), text: `${actor.name} handled "${t.title}" on behalf of ${owner.name} via Team Tasks; ${owner.name} was notified. Task stays assigned to ${owner.name}.` });
    return owner;
  }
  return null;
}

function writtenTaskJob(task){
  const c = task.sourceRef && DB.cases[task.sourceRef];
  const app = c && c.applicationId && DB.core.applications[c.applicationId];
  const job = app && DB.core.jobs[app.jobId] ? DB.core.jobs[app.jobId] : DB.core.jobs[DB.project.jobId];
  return job || {id:"written-test",title:t("Written Test"),createdAt:null};
}
function appendWrittenTaskRow(card, tk, uid, clusterMode=false){
  const cand = tk.sourceRef && DB.cases[tk.sourceRef] ? candidateOf(tk.sourceRef) : null;
  const candidateStatus = writtenTaskStatus(tk);
  const grid = clusterMode ? "minmax(260px,2.2fr) minmax(170px,1.2fr) 180px minmax(130px,1fr)" : "minmax(260px,2.2fr) minmax(190px,1.4fr) 130px 130px minmax(130px,1fr)";
  const row = el(`<div style="display:grid;grid-template-columns:${grid};gap:16px;align-items:center;padding:16px;${clusterMode?'padding-left:48px;':''}border-bottom:1px solid var(--border);min-height:72px"></div>`);
  const job = writtenTaskJob(tk);
  const identity = cand ? `<div class="flex items-center gap-3"><div class="avatar" style="width:36px;height:36px">${esc(cand.name.split(/\s+/).map(x=>x[0]).join("").slice(0,2))}</div><div><div class="task-title">${esc(cand.name)}</div><div class="task-sub">${esc(job.title)}</div></div></div>` : `<div><div class="task-title">${esc(tk.title)}</div><div class="task-sub">${esc(taskTypeLabel(tk.type))}</div></div>`;
  const round = cand && DB.cases[tk.sourceRef] ? (roundsForCase(tk.sourceRef).find(r=>r.status!=="completed") || roundsForCase(tk.sourceRef)[0]) : null;
  const deadline = candidateStatus === "pending_test" ? "" : (tk.dueAt ? fmtDateShort(tk.dueAt) : "");
  row.innerHTML = `${identity}<div>${statusBadge(candidateStatus)}</div><div class="task-sub" style="font-size:14px">${clusterMode && round ? esc(round.title) : esc(fmtDateShort(tk.createdAt||tk.dueAt))}</div>${clusterMode ? "" : `<div class="task-sub" style="font-size:14px">${esc(deadline)}</div>`}<div></div>`;
  if(cand){ const resume=el(`<button class="btn sm ghost">${esc(t("View resume"))}</button>`); resume.onclick=e=>{e.stopPropagation();openCandidateResume(cand,job)}; row.lastElementChild.appendChild(resume); }
  row.onclick=()=>navigate(cand ? "#/cases/"+tk.sourceRef+"/plan" : tk.link); row.style.cursor="pointer"; card.appendChild(row);
}
function taskListForTab(key, view="list"){
  const uid = DB.settings.currentUser;
  let tasks = writtenTestTasks();
  if(key!=="all") tasks = tasks.filter(tk=>writtenTaskStatus(tk)===key);
  tasks.sort((a,b)=>new Date(a.dueAt||0)-new Date(b.dueAt||0));
  const card = el(`<div class="card" style="overflow:hidden"></div>`);
  if(tasks.length===0){ card.appendChild(el(`<div class="empty"><div class="big material-icons-o">checklist</div>${esc(t("Nothing here."))}</div>`)); return card; }
  if(view!=="cluster"){
    card.appendChild(el(`<div style="display:grid;grid-template-columns:minmax(260px,2.2fr) minmax(190px,1.4fr) 130px 130px minmax(130px,1fr);gap:16px;padding:12px 16px;border-bottom:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em"><span>${esc(t("Candidate"))}</span><span>${esc(t("Status"))}</span><span>${esc(t("Created"))}</span><span>${esc(t("Deadline"))}</span><span>${esc(t("Resume"))}</span></div>`));
    tasks.forEach(tk=>appendWrittenTaskRow(card,tk,uid,false));
    return card;
  }
  const groups = new Map();
  tasks.forEach(tk=>{ const job=writtenTaskJob(tk); if(!groups.has(job.id)) groups.set(job.id,{job,tasks:[]}); groups.get(job.id).tasks.push(tk); });
  card.appendChild(el(`<div style="display:grid;grid-template-columns:1fr;gap:16px;padding:12px 32px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em"><span>${esc(t("Role & project"))}</span></div>`));
  groups.forEach(({job,tasks:groupTasks},index)=>{
    const section=el(`<div></div>`); const expanded=index===0; const body=el(`<div ${expanded?'':'hidden'}></div>`);
    const heading=el(`<div style="display:grid;grid-template-columns:36px 1fr 1fr auto;gap:16px;align-items:center;padding:14px 32px;background:var(--surface-2);border-top:1px solid var(--border);border-bottom:1px solid var(--border)"></div>`);
    const toggle=el(`<button class="btn ghost sm" style="padding:0;width:24px"><span class="material-icons-o">${expanded?'expand_more':'chevron_right'}</span></button>`);
    const initials=job.title.split(/\s+/).map(x=>x[0]).join("").slice(0,2); heading.appendChild(toggle); heading.appendChild(el(`<div class="flex items-center gap-3"><div class="avatar" style="width:40px;height:40px">${esc(initials)}</div><div><div class="task-title">${esc(job.title)}</div></div></div>`));
    heading.appendChild(el(`<div style="font-size:15px">${groupTasks.length} ${esc(t("candidates"))}</div>`));
    const actionsWrap=el(`<div class="flex gap-2" style="flex:none;white-space:nowrap"></div>`);
    const compare=el(`<button class="btn sm ghost">${esc(t("Compare candidates"))}</button>`);
    compare.onclick=e=>{
      e.stopPropagation();
      const scoredCaseIds = groupTasks.map(tk=>tk.sourceRef).filter(Boolean).filter(cid=>{ const cells=comparableCells(cid); return !!(cells.result || cells.evaluation); });
      if(scoredCaseIds.length===0){ toast(t("No scored candidates to compare yet."),"warning"); return; }
      const cmpId="cmp_job_"+job.id; DB.comparisons[cmpId]={id:cmpId,caseIds:scoredCaseIds,mode:"current_summary",createdAt:nowISO(),note:"Comparison created from the written test role cluster."}; saveDB(); navigate("#/comparisons/"+cmpId);
    };
    const link=el(`<button class="btn sm ghost">${esc(t("Link candidate"))}</button>`); link.onclick=e=>{e.stopPropagation();openAddCandidateFlow()};
    actionsWrap.appendChild(compare); actionsWrap.appendChild(link);
    heading.appendChild(actionsWrap);
    toggle.onclick=()=>{ body.hidden=!body.hidden; qs(".material-icons-o",toggle).textContent=body.hidden?'chevron_right':'expand_more'; };
    heading.onclick=e=>{if(!actionsWrap.contains(e.target) && e.target!==toggle && !toggle.contains(e.target)) toggle.click();};
    section.appendChild(heading); body.appendChild(el(`<div style="display:grid;grid-template-columns:minmax(260px,2.2fr) minmax(170px,1.2fr) 180px minmax(130px,1fr);gap:16px;padding:10px 48px;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em"><span>${esc(t("Candidate"))}</span><span>${esc(t("Status"))}</span><span>${esc(t("Round"))}</span><span>${esc(t("Resume"))}</span></div>`)); groupTasks.forEach(tk=>appendWrittenTaskRow(body,tk,uid,true)); section.appendChild(body); card.appendChild(section);
  });
  return card;
}
function openWaitModal(t){
  confirmModal({
    title:"Mark task as waiting",
    bodyHtml:`<div class="field"><label>Reason (required)</label><textarea class="input" id="waitReason" rows="3" placeholder="e.g. Waiting on candidate to resend missing file"></textarea></div>
      <div class="field" style="margin-top:12px"><label>Expected resume date</label><input class="input" type="date" id="waitDate"></div>`,
    confirmLabel:"Set waiting",
    onConfirm: ()=>{
      const reason = qs("#waitReason").value.trim() || "Waiting on external input";
      const date = qs("#waitDate").value;
      t.status="waiting"; t.waitingReason=reason; t.waitingUntil = date ? new Date(date).toISOString() : t.dueAt;
      const owner = recordTeamAction(t, DB.settings.currentUser);
      saveDB(); toast(owner?`Marked waiting on behalf of ${owner.name}; they've been notified.`:"Task marked waiting.","info"); navigate("#/tasks");
    }
  });
}
</script>
<script>
/* ============================================================
   PAGE: Question Bank / Question detail / Builder
   ============================================================ */
route("/question-bank", ()=> pageQuestionBank());
route("/questions/:id", (p)=> pageQuestionDetail(p.id));
route("/builder/:id", (p)=> pageBuilder(p.id));

let qbFilters = { role:"all", competency:"all", q:"", view:"list" };

function pageQuestionBank(){

  wrap.appendChild(el(`<div class="muted" style="margin-bottom:16px">${esc(t("Reusable questions, mapped to multiple roles and competencies. Publishing a case does not send it — invitations are a separate step."))}</div>`));

  const toolbar = el(`<div class="flex items-center justify-between wrap gap-3" style="margin-bottom:12px"></div>`);
  const left = el(`<div class="flex gap-2"></div>`);

  left.appendChild(roleSel);

  compSel.innerHTML = comps.map(c=>`<option value="${c}" ${qbFilters.competency===c?"selected":""}>${c==="all"?esc(t("All competencies")):esc(c)}</option>`).join("");
  compSel.onchange = (e)=>{ qbFilters.competency = e.target.value; navigate("#/question-bank"); };
  left.appendChild(compSel);
  toolbar.appendChild(left);
  const right = el(`<div class="flex gap-2"></div>`);
  const importBtn = el(`<button class="btn sm">${esc(t("Import ZIP"))}</button>`);
  importBtn.onclick = ()=> openImportZipModal();
  const createBtn = el(`<button class="btn sm primary">${esc(t("Create question"))}</button>`);
  createBtn.onclick = ()=> toast("Demo: opens blank question editor (not wired in this prototype pass).","info");
  right.appendChild(importBtn); right.appendChild(createBtn);
  toolbar.appendChild(right);
  wrap.appendChild(toolbar);

  let list = Object.values(DB.questions);
  if(qbFilters.role!=="all") list = list.filter(q=>q.roles.includes(qbFilters.role));
  if(qbFilters.competency!=="all") list = list.filter(q=>q.competencies.some(c=>c.name===qbFilters.competency));
  if(qbFilters.q) list = list.filter(q=> (q.title+" "+q.code).toLowerCase().includes(qbFilters.q.toLowerCase()));

  const tableWrap = el(`<div class="table-wrap"></div>`);
  const table = el(`<table class="table"><thead><tr>
      <th></th><th>${esc(t("Code"))}</th><th>${esc(t("Title"))}</th><th>${esc(t("Role tags"))}</th><th>${esc(t("Competencies"))}</th><th>${esc(t("Type"))}</th><th>${esc(t("Difficulty"))}</th><th>${esc(t("Version"))}</th><th>${esc(t("Status"))}</th>
    </tr></thead><tbody></tbody></table>`);
  const tbody = qs("tbody",table);
  if(list.length===0){ tbody.appendChild(el(`<tr><td colspan="9"><div class="empty">${esc(t("No questions match these filters."))}</div></td></tr>`)); }
  list.forEach(q=>{
    const tr = el(`<tr class="clickable"></tr>`);
    tr.onclick = ()=> navigate("#/questions/"+q.id);
    tr.innerHTML = `
      <td>${q.favorite?'<span class="material-icons-o" style="font-size:17px;color:#F2B400">star</span>':'<span class="muted material-icons-o" style="font-size:17px">star_outline</span>'}</td>
      <td class="mono">${esc(q.code)}</td>
      <td>${esc(q.title)}</td>
      <td>${q.roles.map(r=>`<span class="chip">${esc(r.replace(" Analyst","").replace(" Associate",""))}</span>`).join(" ")}</td>
      <td>${q.competencies.map(c=>`<span class="chip">${esc(c.name)} ${Math.round(c.fraction*100)}%</span>`).join(" ")||"—"}</td>
      <td>${esc(q.type)}</td>
      <td>${esc(q.difficulty)}</td>
      <td>v${q.version}</td>
      <td>${statusBadge(q.status)}</td>
    `;
    tbody.appendChild(tr);
  });
  tableWrap.appendChild(table);
  wrap.appendChild(tableWrap);

  wrap.appendChild(el(`<div class="tiny" style="margin-top:12px">FIN-003 is an internal follow-up guide (not sendable). FIN-009/010 are concepts — drafting is required before they can be used in an invitation.</div>`));
  return wrap;
}

function pageQuestionDetail(id){
  const q = DB.questions[id];
  const wrap = el(`<div></div>`);
  if(!q){ wrap.appendChild(el(`<div class="banner danger">${esc(t("Question not found."))}</div>`)); return wrap; }
  wrap.appendChild(crumbs([{label:t("Question Bank"),href:"#/question-bank"},{label:q.code}]));
  wrap.appendChild(el(`<div class="flex items-center justify-between wrap gap-3" style="margin-bottom:4px">
      <h1>${esc(q.title)}</h1>
      <div class="flex gap-2">
        <button class="btn sm" id="btnPreview">${esc(t("Preview candidate view"))}</button>
        <button class="btn sm primary" id="btnEdit">${esc(t("Edit / Builder"))}</button>
      </div>
    </div>`));
  wrap.appendChild(el(`<div class="flex gap-2 items-center" style="margin-bottom:16px">${statusBadge(q.status)}<span class="tiny">v${q.version} · ${esc(q.type)} · ${esc(q.language)} · ~${q.estMinutes||"—"} min · ${DB.settings.lang==="zh"?`已使用 ${q.usageCount} 次 · ${q.seenByCount} 位候选人见过此版本`:`Used ${q.usageCount} times · ${q.seenByCount} candidates have seen this exact version`}</span></div>`));
  qs("#btnEdit",wrap).onclick = ()=> navigate("#/builder/"+q.id);
  qs("#btnPreview",wrap).onclick = ()=> openCandidatePreview(q);

  const tabKeys = ["prompt","materials","rubric","usage","versions"];
  const labels = {prompt:t("Prompt"),materials:t("Materials"),rubric:t("Rubric"),usage:t("Usage"),versions:t("Versions")};
  const body = el(`<div></div>`);
  function show(key){
    body.innerHTML = "";
    if(key==="prompt"){
      body.appendChild(el(`<div class="card card-pad"><h4 style="margin-bottom:8px">${esc(t("Prompt"))}</h4><p>${esc(q.prompt)}</p>
        <div class="divider" style="margin:16px 0"></div>
        <h4 style="margin-bottom:8px">${esc(t("Required deliverables"))}</h4>
        <ul style="margin:0;padding-left:20px">${(q.deliverables||[]).map(d=>`<li>${esc(d)}</li>`).join("") || `<li class='muted'>${esc(t("None specified"))}</li>`}</ul></div>`));
    } else if(key==="materials"){
      const card = el(`<div class="card card-pad"></div>`);
      if((q.materials||[]).length===0){ card.innerHTML = `<div class="empty">${esc(t("No materials attached."))}</div>`; }
      else{
        card.innerHTML = `<h4 style="margin-bottom:8px">${esc(t("Candidate-visible materials"))}</h4>`;
        q.materials.forEach(m=> card.appendChild(el(`<div class="flex items-center justify-between" style="padding:8px 0;border-bottom:1px solid var(--border)"><span class="flex items-center gap-2"><span class="material-icons-o" style="font-size:16px;color:var(--text-tertiary)">attach_file</span>${esc(m)}</span><button class="btn sm ghost">${esc(t("Preview"))}</button></div>`)));
      }
      body.appendChild(card);
    } else if(key==="rubric"){
      const card = el(`<div class="card card-pad"></div>`);
      card.appendChild(el(`<div class="banner warning" style="margin-bottom:12px">${esc(t("Reviewer only — never shown to candidates."))}</div>`));
      (q.competencies||[]).forEach(c=>{
        const row = el(`<div class="crit-row"></div>`);
        row.innerHTML = `<div style="flex:1"><b>${esc(c.name)}</b></div><div class="chip">${Math.round(c.fraction*100)}% ${esc(t("of overall"))}</div>`;
        card.appendChild(row);
      });
      const sum = (q.competencies||[]).reduce((a,c)=>a+c.fraction,0);
      card.appendChild(el(`<div class="tiny" style="margin-top:8px">${DB.settings.lang==="zh"?`各项占比之和必须为 100%（不可重复计分）。当前总和：${Math.round(sum*100)}%${Math.abs(sum-1)>0.001?" —— 将阻止发布。":" —— 无误。"}`:`Fractions must sum to 100% (no double-counting). Current sum: ${Math.round(sum*100)}%${Math.abs(sum-1)>0.001?" — will block publish.":" — OK."}`}</div>`));
      card.appendChild(el(`<div class="divider" style="margin:16px 0"></div>`));
      card.appendChild(el(`<div class="tiny"><b>${esc(t("Internal answer key"))}</b> ${esc(t("(Reviewer only):"))} ${esc(q.rubricNote)}</div>`));
      body.appendChild(card);
    } else if(key==="usage"){
      const card = el(`<div class="card card-pad"></div>`);
      card.innerHTML = `<div class="grid-3">
        <div class="metric"><div class="label">${esc(t("Used in cases"))}</div><div class="value">${q.usageCount}</div></div>
        <div class="metric"><div class="label">${esc(t("Candidates who have seen this version"))}</div><div class="value">${q.seenByCount}</div></div>
        <div class="metric"><div class="label">${esc(t("Role mappings"))}</div><div class="value">${q.roles.length}</div></div>
      </div>
      <div class="tiny" style="margin-top:12px">${esc(t("Mapped roles:"))} ${q.roles.map(r=>`<span class="chip">${esc(r)}</span>`).join(" ")}</div>`;
      body.appendChild(card);
    } else if(key==="versions"){
      const card = el(`<div class="card card-pad"></div>`);
      const rows = [];
      for(let v=q.version; v>=1; v--) rows.push(v);
      rows.forEach(v=>{
        card.appendChild(el(`<div class="flex items-center justify-between" style="padding:8px 0;border-bottom:1px solid var(--border)">
          <div><b>v${v}</b> ${v===q.version?`<span class="badge info" style="margin-left:6px">${esc(t("Current"))}</span>`:''}</div>
          <div class="tiny">${v===q.version?esc(q.author?DB.identity.users[q.author].name:"—"):esc(t("Earlier revision"))} · ${v===q.version?esc(t("Published")):esc(t("Superseded"))}</div>
        </div>`));
      });
      body.appendChild(card);
    }
  }
  wrap.appendChild(tabsBar(tabKeys.map(k=>({key:k,label:labels[k]})), "prompt", (key)=>{ qsa(".tab",wrap).forEach((t,i)=>t.classList.toggle("active", tabKeys[i]===key)); show(key); }));
  show("prompt");
  wrap.appendChild(body);
  return wrap;
}

function openCandidatePreview(q){

    const d = el(`<div class="flex-col" style="height:100%"></div>`);
    d.appendChild(el(`<div class="overlay-head"><h3>${esc(t("Candidate preview —"))} ${esc(q.code)}</h3><div class="icon-btn"><span class="material-icons-o">close</span></div></div>`));

      <h4 style="margin-bottom:8px">${esc(q.title)}</h4>
      <p style="margin-bottom:16px">${esc(q.prompt)}</p>
      <h4 style="margin-bottom:8px">${esc(t("Materials"))}</h4>

      <h4 style="margin-bottom:8px">${esc(t("What to submit"))}</h4>
