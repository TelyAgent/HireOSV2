  if(!att){ wrap.appendChild(el(`<div class="banner danger">${esc(t("Attempt not found."))}</div>`)); return wrap; }
  const c = DB.cases[att.caseId]; const cand = DB.core.candidates[c.candidateId];
  const q = DB.questions[att.questionId];
  if(!opts.inline){
    wrap.appendChild(crumbs([{label:t("Submission Inbox"),href:"#/submissions"},{label:cand.name}]));
    wrap.appendChild(el(`<h1 style="margin-bottom:4px">${esc(cand.name)} — ${esc(q.code)} ${DB.settings.lang==="zh"?`第 ${att.round} 轮`:`round ${att.round}`}</h1>`));
  }
  wrap.appendChild(el(`<div class="flex items-center gap-3" style="margin-bottom:16px">${statusBadge(att.status)}<span class="tiny">${esc(t("Received"))} ${esc(fmtDate(att.receivedAt))} · ${esc(t("Processed"))} ${esc(fmtDate(att.processedAt))}</span></div>`));

  const archiveCard = el(`<div class="card card-pad" style="margin-bottom:16px"></div>`);
  const file = DB.core.files[att.fileRef];
  archiveCard.innerHTML = `<div class="flex items-center justify-between wrap gap-2" style="margin-bottom:2px"><h4 style="margin:0">${esc(t("Original archive"))}</h4>${file?`<button class="btn sm ghost" id="btnDownloadArchive"><span class="material-icons-o" style="font-size:16px">download</span> ${esc(t("Download"))}</button>`:""}</div>
    <div class="mono tiny" style="color:var(--text-secondary)">${esc(file?file.name:"—")} · v${file?file.versions[0].ver:1} · ${file?file.versions[0].size:""} · ${file?file.versions[0].checksum:""}</div>`;
  wrap.appendChild(archiveCard);
  if(file){ qs("#btnDownloadArchive",archiveCard).onclick = ()=> toast("Download simulated (demo) — "+file.name,"info"); }

  const filesCard = el(`<div class="card" style="margin-bottom:16px;overflow:hidden"></div>`);
  filesCard.appendChild(el(`<div class="card-pad" style="padding-bottom:8px"><h4 style="margin:0">${esc(t("Deliverable files"))}</h4></div>`));
  const fileGridCols = "minmax(180px,1fr) 100px 110px minmax(150px,auto)";
  (q.deliverables||[]).forEach(d=>{
    const match = d.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
    const label = match ? match[1] : d;
    const filename = match ? match[2] : null;
    const missing = !!(att.missing && att.missing.includes(d));
    const row = el(`<div style="display:grid;grid-template-columns:${fileGridCols};gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--border)"></div>`);
    row.innerHTML = `<div class="flex items-center gap-3" style="min-width:0">
        <span class="material-icons-o" style="font-size:20px;color:${missing?'var(--text-tertiary)':'var(--accent)'}">${missing?'insert_drive_file':'description'}</span>
        <div style="min-width:0"><div class="task-title truncate">${esc(filename||label)}</div><div class="tiny truncate">${esc(label)}</div></div>
      </div>
      <div class="tiny">${missing?"—":esc(fmtDateShort(att.receivedAt))}</div>
      <div>${missing?`<span class="badge warning">${esc(t("Missing"))}</span>`:`<span class="badge success">${esc(t("Received"))}</span>`}</div>`;
    const actions = el(`<div class="flex gap-2"></div>`);
    if(!missing){
      const previewBtn = el(`<button class="btn sm ghost">${esc(t("Preview"))}</button>`); previewBtn.onclick = ()=> toast("Preview simulated (demo) — "+(filename||label),"info");
      const downloadBtn = el(`<button class="btn sm ghost">${esc(t("Download"))}</button>`); downloadBtn.onclick = ()=> toast("Download simulated (demo) — "+(filename||label),"info");
      actions.appendChild(previewBtn); actions.appendChild(downloadBtn);
    }
    row.appendChild(actions);
    filesCard.appendChild(row);
  });
  wrap.appendChild(filesCard);

  const infoCard = el(`<div class="card card-pad" style="margin-bottom:16px"></div>`);
  infoCard.innerHTML = `<h4 style="margin-bottom:8px">${esc(t("Identity & round match"))}</h4>
    <div class="tiny">${esc(t("Candidate:"))} ${esc(cand.name)} (${esc(cand.email)})</div>
    <div class="tiny">${esc(t("Round:"))} ${att.round} · ${esc(t("Task binding: confirmed"))}</div>`;
  wrap.appendChild(infoCard);

  if(att.status==="incomplete"){
    const issueCard = el(`<div class="card card-pad"></div>`);
    issueCard.innerHTML = `<div class="banner warning" style="margin-bottom:8px">${esc(t("Missing"))} ${esc((att.missing||[]).join(", "))}</div>`;
    const btn = el(`<button class="btn">${esc(t("Request missing files"))}</button>`); btn.onclick=()=>toast("Requested missing files from candidate (demo).","info");
    issueCard.appendChild(btn);
    wrap.appendChild(issueCard);
  } else {
    const goBtn = el(`<button class="btn primary">${esc(t("Go to evaluation →"))}</button>`);
    goBtn.onclick = opts.onGoToEvaluation ? opts.onGoToEvaluation : (()=> navigate("#/attempts/"+att.id+"/review"));
    wrap.appendChild(goBtn);
  }
  return wrap;
}
</script>
<script>
/* ============================================================
   PAGE: Evaluation / Review
   ============================================================ */
route("/attempts/:id/review", (p)=> pageEvaluationReview(p.id));

function computeOverall(criteria, key){
  if(criteria.some(c=>c[key]==null)) return null;
  return Math.round(criteria.reduce((sum,c)=> sum + (c[key]/c.max)*(c.max), 0));
}

function pageEvaluationReview(attId, opts={}){
  const att = DB.attempts[attId];
  const wrap = el(`<div></div>`);
  if(!att){ wrap.appendChild(el(`<div class="banner danger">${esc(t("Attempt not found."))}</div>`)); return wrap; }
  const caseId = att.caseId; const cand = candidateOf(caseId); const q = DB.questions[att.questionId];
  const evaluation = DB.evaluations["eval_"+caseId];
  wrap.appendChild(crumbs([{label:t("Submission Inbox"),href:"#/submissions"},{label:cand.name}]));
  if(!evaluation){
    wrap.appendChild(el(`<div class="banner warning">${esc(t("No evaluation yet for"))} ${esc(cand.name)}. ${att.status==='incomplete' ? esc(t("This submission is incomplete — resolve the missing deliverable before scoring.")) : esc(t("Evidence has not finished processing."))}</div>`));
    const back = el(`<button class="btn" style="margin-top:12px">${esc(t("Back to Submission Inbox"))}</button>`); back.onclick = ()=> navigate("#/submissions");
    wrap.appendChild(back);
    return wrap;
  }

  const overallAI = computeOverall(evaluation.criteria, "ai");
  const overallHuman = computeOverall(evaluation.criteria, "human");
  wrap.appendChild(el(`<div class="flex items-center justify-between wrap gap-3" style="margin-bottom:4px"><h1>${esc(cand.name)} — ${esc(q.code)} ${esc(t("evaluation"))}</h1>${statusBadge(evaluation.status)}</div>`));
  wrap.appendChild(el(`<div class="card card-pad" style="margin-bottom:16px">
      <div class="grid-3">
        <div class="metric"><div class="label">${esc(t("Overall (human)"))}</div><div class="value">${unknownOr(overallHuman)}</div><div class="sub">${esc(t("Any missing required criterion → Unknown"))}</div></div>
        <div class="metric"><div class="label">${esc(t("Overall (AI)"))}</div><div class="value">${overallAI==null?"—":overallAI}</div><div class="sub">${esc(t("Draft only, not a hiring probability"))}</div></div>
        <div class="metric"><div class="label">${esc(t("Coverage / Confidence"))}</div><div class="value">${esc(t("Full"))}</div><div class="sub">${esc(t("Shown separately from score"))}</div></div>
      </div></div>`));

  const critCard = el(`<div class="card card-pad" style="margin-bottom:16px"></div>`);
  critCard.appendChild(el(`<h4 style="margin-bottom:8px">${esc(t("Criteria"))}</h4>`));
  evaluation.criteria.forEach((c,i)=>{
    const row = el(`<div class="crit-row flex-col" style="align-items:stretch"></div>`);
    row.innerHTML = `
      <div class="flex items-center justify-between wrap gap-2">
        <div><b>${esc(c.name)}</b> <span class="tiny">${esc(t("max"))} ${c.max}</span></div>
        <div class="flex gap-2 items-center">
          <span class="chip">AI ${c.ai}</span>
          <input class="input" style="width:80px;height:32px" type="number" min="0" max="${c.max}" value="${c.human==null?'':c.human}" placeholder="${esc(t("Human"))}">
          <span class="badge ${c.confidence==='High'?'success':'info'}">${esc(t("Confidence:"))} ${esc(t(c.confidence))}</span>
          <span class="badge neutral">${esc(t("Coverage:"))} ${esc(t(c.coverage))}</span>
        </div>
      </div>
      <div class="scorebar" style="margin:8px 0"><div style="width:${Math.round((c.human??c.ai)/c.max*100)}%"></div></div>
      <details><summary style="cursor:pointer;color:var(--accent);font-size:calc(var(--text-base)*.85)">${esc(t("View evidence"))}</summary>
        <div class="evidence-excerpt" style="margin-top:8px">${esc(c.evidence)}<div class="tiny" style="margin-top:4px">${esc(t("Source:"))} ${esc(c.source)}</div></div>
      </details>
      <div class="override-wrap" style="margin-top:8px"></div>
    `;
    const humanInput = qs("input",row);
    const overrideWrap = qs(".override-wrap",row);
    function drawOverride(){
      overrideWrap.innerHTML = "";
      const hv = humanInput.value===""?null:parseInt(humanInput.value);
      if(hv!=null && hv!==c.ai){
        overrideWrap.appendChild(el(`<textarea class="input" rows="2" placeholder="${esc(t("Override reason (required — old AI value stays visible in history)"))}">${esc(c.overrideReason||"")}</textarea>`));
        qs("textarea",overrideWrap).oninput = (e)=>{ c.overrideReason = e.target.value; };
      }
    }
    humanInput.oninput = (e)=>{ c.human = e.target.value===""?null:parseInt(e.target.value); c.overridden = c.human!=null && c.human!==c.ai; drawOverride(); };
    drawOverride();
    critCard.appendChild(row);
  });
  wrap.appendChild(critCard);

  const commitFinalize = (closeDrawer=null)=>{
    if(evaluation.criteria.some(c=>c.human==null)){ toast("Set a human score for every criterion before finalizing.","warning"); return; }
    if(evaluation.criteria.some(c=>c.overridden && !c.overrideReason)){ toast("Add an override reason for every changed score.","warning"); return; }
    evaluation.status = "final"; evaluation.finalizedBy = DB.settings.currentUser; evaluation.finalizedAt = nowISO();
    const overall = computeOverall(evaluation.criteria,"human");
    DB.results["result_"+caseId] = { id:"result_"+caseId, caseId, evaluationId:evaluation.id, overall, status:"final_not_released", releaseId:null };
    const relatedTask = Object.values(DB.tasks).find(t=>t.sourceRef===caseId && t.type==="evaluation_review");
    if(relatedTask) relatedTask.status = "completed";
    const releaseTaskId = "t_release_"+caseId;
    DB.tasks[releaseTaskId] = { id:releaseTaskId, title:"Publish "+cand.name+"'s result", type:"result_release", assignee:"user_john", status:"open", dueAt:nowISO(), link:"#/results/"+caseId+"/release", sourceRef:caseId };
    saveDB();
    if(closeDrawer){ closeDrawer(); toast("Evaluation finalized. Overall: "+overall,"success"); render(); }
    else { toast("Evaluation finalized. Overall: "+overall,"success"); navigate("#/results/"+caseId+"/release"); }
  };
  const actions = el(`<div class="flex gap-2 wrap"></div>`);
  const acceptAllBtn = el(`<button class="btn">${esc(t("Accept all AI scores"))}</button>`);
  acceptAllBtn.onclick = ()=>{ evaluation.criteria.forEach(c=>{ c.human=c.ai; c.overridden=false; }); saveDB(); toast("All AI scores accepted.","success"); render(); };
  actions.appendChild(acceptAllBtn);
  const retryAiBtn = el(`<button class="btn ghost">${esc(t("Re-run AI (demo)"))}</button>`);
  retryAiBtn.onclick = ()=>{
    if(evaluation.status==="final"){ toast("Already finalized — AI re-run is disabled.","info"); return; }
    evaluation.criteria.forEach(c=>{ const delta = Math.round((Math.random()*6)-3); c.ai = Math.max(0, Math.min(c.max, c.ai+delta)); });
    saveDB(); toast("AI re-run complete — AI scores refreshed.","success"); render();
  };
  actions.appendChild(retryAiBtn);
  const openReleaseDrawer = ()=>openDrawer((close)=>{
    const d=el(`<div class="flex-col" style="height:100%"></div>`);
    d.appendChild(el(`<div class="overlay-head"><div><h3>${esc(t("Final result"))}</h3><div class="tiny">${esc(cand.name)} · ${esc(q.code)}</div></div><div class="icon-btn"><span class="material-icons-o">close</span></div></div>`));
    qs(".icon-btn",d).onclick=close;
    const body=el(`<div class="overlay-body"></div>`); body.appendChild(pageRelease(caseId)); d.appendChild(body);
    return d;
  },{wide:true});
  const isFinalized = evaluation.status === "final" || !!Object.values(DB.results).find(r=>r.caseId===caseId && ["final_not_released","published"].includes(r.status));
  const finalizeBtn = el(`<button class="btn primary">${esc(t(isFinalized ? "View final result" : "Finalize evaluation"))}</button>`);
  finalizeBtn.onclick = ()=>{
    if(isFinalized){ if(opts.onViewFinalResult){ opts.onViewFinalResult(); } else { openReleaseDrawer(); } return; }
    if(!opts.inline){ commitFinalize(); return; }
    openDrawer((close)=>{
      const d=el(`<div class="flex-col" style="height:100%"></div>`);
      d.appendChild(el(`<div class="overlay-head"><div><h3>${esc(t("Finalize evaluation"))}</h3><div class="tiny">${esc(cand.name)} · ${esc(q.code)}</div></div><div class="icon-btn"><span class="material-icons-o">close</span></div></div>`));
      qs(".icon-btn",d).onclick=close;
      const body=el(`<div class="overlay-body"></div>`);
      body.appendChild(pageRelease(caseId));
      d.appendChild(body);
      const foot=el(`<div class="overlay-foot flex gap-2 justify-end"><button class="btn ghost" id="cancelFinalize">${esc(t("Cancel"))}</button><button class="btn primary" id="confirmFinalize">${esc(t("Confirm finalize"))}</button></div>`);
      qs("#cancelFinalize",foot).onclick=close; qs("#confirmFinalize",foot).onclick=()=>commitFinalize(close); d.appendChild(foot); return d;
    },{wide:true});
  };
  if(!opts.hideFinalize) actions.appendChild(finalizeBtn);
  wrap.appendChild(actions);
  return wrap;
}
</script>
<script>
/* ============================================================
   PAGE: Release + Revision + Handoff
   ============================================================ */
route("/results/:id/release", (p)=> pageRelease(p.id));
route("/cases/:id/revisions/:round", (p)=> pageRevision(p.id, p.round));
route("/deliveries/:id", (p)=> pageDelivery(p.id));

function pageRelease(caseId, opts={}){
  const wrap = el(`<div></div>`);
  const c = DB.cases[caseId]; const cand = candidateOf(caseId);
  const result = Object.values(DB.results).find(r=>r.caseId===caseId);
  if(!c || !result){ wrap.appendChild(el(`<div class="empty card card-pad">${esc(t("No finalized result for this case yet."))}</div>`)); return wrap; }
  const evaluation = DB.evaluations[result.evaluationId];
  const release = Object.values(DB.releases).find(r=>r.caseId===caseId);
  const inv = Object.values(DB.invitations).find(i=>i.caseId===caseId);

  if(!opts.inline){
    wrap.appendChild(crumbs([{label:t("Assessments"),href:"#/assessments"},{label:cand.name}]));
    wrap.appendChild(el(`<h1 style="margin-bottom:16px">${esc(cand.name)} — ${esc(t("Release"))}</h1>`));
  }

  const cols = el(`<div class="two-col"></div>`);
  const left = el(`<div class="card card-pad"></div>`);
  left.innerHTML = `<h4 style="margin-bottom:8px">${esc(t("Internal reference"))}</h4>
    <div class="tiny" style="margin-bottom:8px">${esc(t("Overall (human)"))}: <b>${unknownOr(result.overall)}</b></div>
    ${evaluation.criteria.map(c=>`<div class="flex items-center justify-between" style="padding:6px 0;border-bottom:1px solid var(--border)"><span>${esc(c.name)}</span><span>${c.human}/${c.max}${c.overridden?' <span class="tiny">('+esc(t("overridden"))+')</span>':''}</span></div>`).join("")}
    <div class="tiny" style="margin-top:8px">${esc(t("Finalized by"))} ${esc(DB.identity.users[evaluation.finalizedBy].name)} · ${esc(fmtDate(evaluation.finalizedAt))}</div>`;
  cols.appendChild(left);

  const right = el(`<div class="card card-pad"></div>`);
  const disclosure = inv ? inv.disclosurePolicy : "score_and_summary";
  right.innerHTML = `<h4 style="margin-bottom:8px">${esc(t("Candidate preview"))}</h4>
    <div class="tiny" style="margin-bottom:8px">${esc(t("Disclosure policy:"))} ${disclosure==='score_and_summary'?esc(t("Score + summary")):esc(t("Summary only"))}</div>
    <div class="card card-pad" style="background:var(--canvas)">
      <b>${esc(t("Outcome:"))}</b> ${result.overall>=65?esc(t("Strong performance on this assessment.")):esc(t("Below the bar for this role on this assessment."))}<br>
      ${disclosure==='score_and_summary'?`<b>${esc(t("Score:"))}</b> ${result.overall}<br>`:""}
      <b>${esc(t("Feedback:"))}</b> ${esc(t("Clear structure; accounting treatment mostly correct with one gap in variance analysis."))}<br>
      <b>${esc(t("Next step:"))}</b> ${esc(t("HR will follow up with next steps."))}
    </div>
    <div class="tiny" style="margin-top:8px">${esc(t("Never includes: internal ranking, reviewer notes, or the internal answer key."))}</div>`;
  cols.appendChild(right);
  wrap.appendChild(cols);

  if(!release){
    const approveCard = el(`<div class="card card-pad" style="margin-top:16px"></div>`);
    approveCard.innerHTML = `<h4 style="margin-bottom:8px">${esc(t("Approve & publish"))}</h4>`;
    const chk1 = el(`<label class="checkbox-row" style="margin-bottom:6px"><input type="checkbox" id="chk1"> ${esc(t("Internal review complete"))}</label>`);
    const chk2 = el(`<label class="checkbox-row" style="margin-bottom:12px"><input type="checkbox" id="chk2"> ${esc(t("Disclosure content approved for release"))}</label>`);
    approveCard.appendChild(chk1); approveCard.appendChild(chk2);
    const btn = el(`<button class="btn primary">${esc(t("Finalize & publish result"))}</button>`);
    btn.onclick = ()=>{
      if(!qs("#chk1",approveCard).checked || !qs("#chk2",approveCard).checked){ toast("Both review and disclosure approval are required to publish.","warning"); return; }
      const relId = "rel_"+caseId;
      DB.releases[relId] = { id:relId, caseId, overall:result.overall, showScore: disclosure==='score_and_summary',
        outcomeText: result.overall>=65 ? "Strong performance on this assessment." : "This assessment did not meet the bar for this role.",
        feedbackText: "Clear structure; accounting treatment mostly correct with one gap in variance analysis.",
        nextStepText: "HR will follow up with next steps.", nextAction:null, publishedAt: nowISO() };
      result.status = "published"; result.releaseId = relId;
      const relatedTask = Object.values(DB.tasks).find(t=>t.sourceRef===caseId && t.type==="result_release");
      if(relatedTask) relatedTask.status = "completed";
      c.status = "released";
      saveDB(); toast("Result finalized and published. Candidate portal and notification queued.","success");
      navigate("#/results/"+caseId+"/release");
    };
    approveCard.appendChild(btn);
    wrap.appendChild(approveCard);
  } else {
    wrap.appendChild(el(`<div class="banner success" style="margin-top:16px">${esc(t("Published"))} ${esc(fmtDate(release.publishedAt))}. ${esc(t("Delivery does not guarantee delivery — a bounce would still leave the result visible internally."))}</div>`));

    const nextCard = el(`<div class="card card-pad" style="margin-top:16px"></div>`);
    nextCard.innerHTML = `<h4 style="margin-bottom:8px">${esc(t("Next action"))}</h4><div class="tiny" style="margin-bottom:12px">${esc(t("A proposal is prepared first; sending only happens after approval — sorting or comparing candidates never triggers a send."))}</div>`;
    const btnRow = el(`<div class="flex gap-2 wrap"></div>`);
    const revBtn = el(`<button class="btn ${release.nextAction==='revision'?'':''}">${esc(t("Request revision"))}</button>`);
    revBtn.disabled = !!release.nextAction;
    revBtn.onclick = ()=> openRevisionRequestModal(caseId, release);
    const suppBtn = el(`<button class="btn">${esc(t("Add supplemental test"))}</button>`); suppBtn.onclick = ()=>{ planPageSelectedTab[caseId]="plan"; saveDB(); navigate("#/cases/"+caseId+"/plan"); };
    const interviewBtn = el(`<button class="btn">${esc(t("Prepare Interview handoff"))}</button>`); interviewBtn.onclick = ()=> openHandoffPrep(caseId);
    const holdBtn = el(`<button class="btn ghost">${esc(t("Hold"))}</button>`); holdBtn.onclick = ()=> toast("Case placed on hold (demo).","info");
    const closeBtn = el(`<button class="btn ghost">${esc(t("Close testing"))}</button>`); closeBtn.onclick = ()=> toast("Testing closed for this case (demo).","info");
    [revBtn,suppBtn,interviewBtn,holdBtn,closeBtn].forEach(b=>btnRow.appendChild(b));
    nextCard.appendChild(btnRow);
    if(release.nextAction==="revision") nextCard.appendChild(el(`<div class="banner info" style="margin-top:12px">${esc(t("Revision round"))} ${release.revisionRound} ${esc(t("requested — candidate has been notified."))} <a style="cursor:pointer" id="goRev">${esc(t("Open revision workspace →"))}</a></div>`));
    wrap.appendChild(nextCard);
    if(release.nextAction==="revision") qs("#goRev",nextCard).onclick = ()=> navigate("#/cases/"+caseId+"/revisions/"+release.revisionRound);
  }
  return wrap;
}

function openRevisionRequestModal(caseId, release){
  confirmModal({
    title:t("Request revision"),
    bodyHtml:`<div class="field" style="margin-bottom:12px"><label>${esc(t("Feedback shown to candidate"))}</label><textarea class="input" rows="3" id="hint">Please revisit the variance analysis section with more detail on the root cause.</textarea></div>
      <div class="field"><label>${esc(t("New deadline"))}</label><input class="input" type="datetime-local" id="revDeadline" value="2026-09-20T23:59"></div>
      <div class="tiny" style="margin-top:8px">${esc(t("The prior round stays locked and visible; this creates a new round with its own invitation and thread."))}</div>`,
    confirmLabel:t("Send revision request (demo)"),
    onConfirm: ()=>{
      release.nextAction = "revision"; release.revisionRound = 1;
      release.revisionHint = qs("#hint").value;
      release.revisionDeadline = new Date(qs("#revDeadline").value).toISOString();
      const round=ensureFollowupRound(caseId,'Revision round 1',release.revisionDeadline);
      const base=planItemsForCase(caseId)[0];
      if(base){ const piId='pi_'+caseId+'_revision1_'+base.questionId; if(!DB.plans[piId]){ DB.plans[piId]={id:piId,caseId,questionId:base.questionId,kind:'revision',status:'awaiting_submission'}; DB.cases[caseId].planItems.push(piId); round.planItemIds.push(piId); } }
      DB.revisions[caseId+'_r1']={id:caseId+'_r1',caseId,round:1,roundId:round.id,status:'requested',acceptedAt:null};
      const invId='inv_'+caseId+'_revision1'; DB.invitations[invId]={id:invId,caseId,roundId:round.id,questionIds:round.planItemIds.map(id=>DB.plans[id].questionId),mode:'deadline_only',durationMin:null,deadline:release.revisionDeadline,status:'sent',acceptedAt:null,startedAt:null,disclosurePolicy:'score_and_summary',threadRef:'thread_'+invId};
      saveDB(); toast("Revision round 1 created with a new invitation and candidate thread.","success");
      navigate("#/results/"+caseId+"/release");
    }
  });
}

function pageRevision(caseId, round){
  const wrap = el(`<div></div>`);
  const c = DB.cases[caseId]; const cand = candidateOf(caseId);
  const rev = DB.revisions[caseId+"_r"+round];
  const evaluation = DB.evaluations["eval_"+caseId];
  wrap.appendChild(crumbs([{label:t("Assessments"),href:"#/assessments"},{label:cand.name,href:"#/results/"+caseId+"/release"},{label:t("Revision")+" "+round}]));
  wrap.appendChild(el(`<h1 style="margin-bottom:4px">${esc(cand.name)} — ${esc(t("Revision round"))} ${round}</h1>`));
  wrap.appendChild(el(`<div class="muted" style="margin-bottom:16px">${rev?statusBadge(rev.status):esc(t("Not yet accepted by candidate"))}</div>`));

  if(!evaluation.revisedCriteria){
    wrap.appendChild(el(`<div class="banner info">${esc(t("Not comparable yet — no revised answers received. Original stays available below."))}</div>`));
  }
  const tabKeys = ["original","feedback","revised"];
  const body = el(`<div></div>`);
  function show(key){
    body.innerHTML = "";
    if(key==="original"){
      const card = el(`<div class="card card-pad"></div>`);
      evaluation.criteria.forEach(c=> card.appendChild(el(`<div class="flex items-center justify-between" style="padding:6px 0;border-bottom:1px solid var(--border)"><span>${esc(c.name)}</span><span>${c.human}/${c.max}</span></div>`)));
      body.appendChild(card);
    } else if(key==="feedback"){
      const release = Object.values(DB.releases).find(r=>r.caseId===caseId);
      body.appendChild(el(`<div class="card card-pad">${esc(release ? release.revisionHint : "—")}</div>`));
    } else {
      const card = el(`<div class="card card-pad"></div>`);
      if(!evaluation.revisedCriteria){ card.innerHTML = `<div class="empty">${esc(t("Not comparable — awaiting revised submission."))}</div>`; }
      else{
        evaluation.revisedCriteria.forEach((c,i)=>{
          const orig = evaluation.criteria[i];
          const delta = c.ai - orig.human;
          card.appendChild(el(`<div class="flex items-center justify-between" style="padding:6px 0;border-bottom:1px solid var(--border)">
            <span>${esc(c.name)}</span><span>${orig.human} → ${c.ai}/${c.max} <span class="badge ${delta>0?'success':'neutral'}">${delta>0?esc(t('Improved')):esc(t('No change'))}</span></span></div>`));
        });
      }
      body.appendChild(card);
    }
  }
  wrap.appendChild(tabsBar([{key:"original",label:t("Original")},{key:"feedback",label:t("Feedback")},{key:"revised",label:t("Revised")}], "original", (key)=>{ qsa(".tab",wrap).forEach((t,i)=>t.classList.toggle("active", tabKeys[i]===key)); show(key); }));
  show("original");
  wrap.appendChild(body);

  if(evaluation.revisedCriteria){
    const approveBtn = el(`<button class="btn primary" style="margin-top:16px">${esc(t("Approve revised scores"))}</button>`);
    approveBtn.onclick = ()=>{
      evaluation.criteria = evaluation.revisedCriteria.map(c=>({ ...c, human:c.ai, overridden:false }));
      delete evaluation.revisedCriteria;
      const result = Object.values(DB.results).find(r=>r.caseId===caseId);
      result.overall = computeOverall(evaluation.criteria,"human");
      saveDB(); toast("Revised scores approved. Result updated for next release.","success");
      navigate("#/results/"+caseId+"/release");
    };
    wrap.appendChild(approveBtn);
  }
  return wrap;
}

function openHandoffPrep(caseId){
  const cand = candidateOf(caseId);
  const delId = "del_"+caseId;
  if(!DB.deliveries[delId]){
    DB.deliveries[delId] = { id:delId, caseId, target:"Interview", status:"in_progress", timeline:[
      {label:"Result finalized", state:"done", at:nowISO()},
      {label:"Preparing shared artifact", state:"done", at:nowISO()},
      {label:"File ready", state:"pending", at:null},
      {label:"Event queued", state:"pending", at:null},
      {label:"Published", state:"pending", at:null},
      {label:"Intake received", state:"pending", at:null},
      {label:"Imported", state:"pending", at:null}
    ] };
    saveDB();
  }
  openDrawer((close)=>{
    const drawer = el(`<div class="flex-col" style="height:100%"></div>`);
    drawer.appendChild(el(`<div class="overlay-head"><div><h3>${esc(t("Prepare Interview handoff"))}</h3><div class="tiny">${esc(cand.name)}</div></div><div class="icon-btn"><span class="material-icons-o">close</span></div></div>`));
    qs(".icon-btn",drawer).onclick = close;
    const body = el(`<div class="overlay-body"></div>`);
    body.appendChild(pageDelivery(delId,{inDrawer:true}));
    drawer.appendChild(body);
    return drawer;
  },{wide:true});
  toast("Interview handoff package prepared for "+cand.name+".","success");
}

function pageDelivery(delId){
  const wrap = el(`<div></div>`);
  const d = DB.deliveries[delId];
  if(!d){ wrap.appendChild(el(`<div class="banner danger">${esc(t("Delivery not found."))}</div>`)); return wrap; }
  const cand = candidateOf(d.caseId);
  wrap.appendChild(crumbs([{label:t("Assessments"),href:"#/assessments"},{label:cand.name},{label:t("Handoff")}]));
  wrap.appendChild(el(`<h1 style="margin-bottom:4px">${esc(t("Handoff to"))} ${esc(d.target)}</h1>`));
  wrap.appendChild(el(`<div class="muted" style="margin-bottom:16px">${esc(t("Interview not enabled in this workspace — export still works; nothing here is a real cross-service call."))}</div>`));

  const card = el(`<div class="card card-pad timeline"></div>`);
  d.timeline.forEach((step,i)=>{
    const item = el(`<div class="tl-item"></div>`);
    item.innerHTML = `<div class="tl-dot ${step.state}"></div><div class="tl-line"></div>
      <div><b>${esc(t(step.label))}</b><div class="tiny">${step.at?esc(fmtDate(step.at)):(step.state==='pending'?esc(t('Awaiting confirmation')):'—')}</div></div>`;
    card.appendChild(item);
  });
  wrap.appendChild(card);

  const actions = el(`<div class="flex gap-2" style="margin-top:16px"></div>`);
  const advanceBtn = el(`<button class="btn">${esc(t("Advance next step (demo)"))}</button>`);
  advanceBtn.onclick = ()=>{
    const nextIdx = d.timeline.findIndex(t=>t.state==="pending");
    if(nextIdx===-1){ toast("Handoff complete.","success"); return; }
    d.timeline[nextIdx].state="done"; d.timeline[nextIdx].at=nowISO();
    if(d.timeline[nextIdx].label==="Intake received") d.status="awaiting_ack";
    if(d.timeline[nextIdx].label==="Imported") d.status="imported";
    saveDB(); navigate("#/deliveries/"+delId);
  };
  actions.appendChild(advanceBtn);
  const exportBtn = el(`<button class="btn">${esc(t("Export report-only package"))}</button>`);
  exportBtn.onclick = ()=> toast("Report-only package export simulated — no vendor call made.","info");
  actions.appendChild(exportBtn);
  wrap.appendChild(actions);
  return wrap;
}
</script>
<script>
/* ============================================================
   PAGE: Compare
   ============================================================ */
route("/comparisons", ()=> pageComparisonsList());
route("/comparisons/:id", (p)=> pageComparisonDetail(p.id));

function pageComparisonsList(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<h1 style="margin-bottom:16px">${esc(t("Comparisons"))}</h1>`));
  Object.values(DB.comparisons).forEach(cmp=>{
    const card = el(`<div class="card card-pad" style="cursor:pointer;margin-bottom:8px"></div>`);
    card.onclick = ()=> navigate("#/comparisons/"+cmp.id);
    card.innerHTML = `<b>${cmp.caseIds.map(id=>candidateOf(id).name).join(" vs ")}</b><div class="tiny">${esc(fmtDate(cmp.createdAt))} · ${esc(cmp.note||"")}</div>`;
    wrap.appendChild(card);
  });
  const newBtn = el(`<button class="btn primary" style="margin-top:8px">${esc(t("New comparison"))}</button>`);
  newBtn.onclick = ()=> navigate("#/comparisons/cmp_1");
  wrap.appendChild(newBtn);
  return wrap;
}

function comparableCells(caseId){
  const result = Object.values(DB.results).find(r=>r.caseId===caseId);
  const evaluation = (result ? DB.evaluations[result.evaluationId] : null) || DB.evaluations["eval_"+caseId] || null;
  return { result, evaluation, isFinal: !!(evaluation && evaluation.status==="final") };
}

function pageComparisonDetail(id){
  const cmp = DB.comparisons[id];
  const wrap = el(`<div></div>`);
  if(!cmp){ wrap.appendChild(el(`<div class="banner danger">${esc(t("Comparison not found."))}</div>`)); return wrap; }
  wrap.appendChild(crumbs([{label:t("My Tasks"),href:"#/tasks"},{label:t("Compare")}]));
  wrap.appendChild(el(`<div class="flex items-center justify-between wrap gap-3" style="margin-bottom:4px"><h1>${esc(t("Compare"))}</h1>
    <div class="flex gap-2"><button class="btn sm" id="btnRefresh">${esc(t("Refresh"))}</button><button class="btn sm" id="btnExport">${esc(t("Export"))}</button></div></div>`));
  qs("#btnRefresh",wrap).onclick = ()=>{ cmp.createdAt = nowISO(); saveDB(); toast("New snapshot created; previous version retained.","info"); navigate("#/comparisons/"+id); };
  qs("#btnExport",wrap).onclick = ()=> toast("Single-page export simulated (light theme, "+cmp.caseIds.length+" of "+cmp.caseIds.length+" shown — no sending occurs).","info");

  const modeBar = el(`<div class="flex gap-2" style="margin-bottom:16px"></div>`);
  ["current_summary","same_stage","round_changes"].forEach(m=>{
    const label = t({current_summary:"Current summary", same_stage:"Same stage", round_changes:"Changes since last round"}[m]);
    const b = el(`<button class="btn sm ${cmp.mode===m||(!cmp.mode&&m==='current_summary')?'primary':''}">${label}</button>`);
    b.onclick = ()=>{ cmp.mode=m; navigate("#/comparisons/"+id); };
    modeBar.appendChild(b);
  });
  const diffBar=el(`<div class="flex items-center gap-2" style="margin-bottom:16px"><label class="checkbox-row"><input type="checkbox" id="onlyDiff"> ${esc(t('Only show differences'))}</label><button class="btn sm ghost" id="addCompareNote">${esc(t('Add comment'))}</button></div>`);
  qs('#onlyDiff',diffBar).onchange=()=>{ diffBar.querySelector('input').checked=diffBar.querySelector('input').checked; toast(diffBar.querySelector('input').checked?'Showing only differing competency rows.':'Showing all competency rows.','info'); };
  qs('#addCompareNote',diffBar).onclick=()=>toast('Comparison comment saved to this view (demo).','success');
  wrap.appendChild(modeBar); wrap.appendChild(diffBar);

  const cells = cmp.caseIds.map(cid=>({ caseId:cid, cand:candidateOf(cid), ...comparableCells(cid) }));
  const bothFinal = cells.every(c=>c.isFinal);
  const scores = cells.map(c=>c.isFinal?c.result.overall: (c.evaluation?computeOverall(c.evaluation.criteria,"ai"):null));
  wrap.appendChild(el(`<div class="banner ${bothFinal?'info':'warning'}" style="margin-bottom:16px">${bothFinal ? esc(t("Both results are final and directly comparable.")) : esc(t("One or more results are AI-draft, not final — shown for reference only. No clear overall leader can be claimed across different evaluation stages."))}</div>`));

  const kd = el(`<div class="card card-pad" style="margin-bottom:16px"></div>`);
  kd.innerHTML = `<h4 style="margin-bottom:8px">${esc(t("Key differences"))}</h4>`;
  const allCompNames = Array.from(new Set(cells.flatMap(c=>c.evaluation?c.evaluation.criteria.map(x=>x.name):[])));
  allCompNames.forEach(name=>{
    const vals = cells.map(c=>{ const cr = c.evaluation && c.evaluation.criteria.find(x=>x.name===name); return cr ? (c.isFinal?cr.human:cr.ai) : null; });
    if(vals.every(v=>v==null)) return;
    const max = Math.max(...vals.filter(v=>v!=null));
    const min = Math.min(...vals.filter(v=>v!=null));
    if(max-min<5) return;
    kd.appendChild(el(`<div class="tiny" style="padding:4px 0">${esc(name)}: ${cells.map((c,i)=>esc(c.cand.name)+" "+(vals[i]==null?esc(t("Unknown")):vals[i])).join(" vs ")}</div>`));
  });
  wrap.appendChild(kd);

  const matrixWrap = el(`<div class="cmatrix"></div>`);
  const table = el(`<table><thead><tr><th>${esc(t("Dimension"))}</th>${cells.map(c=>`<th>${esc(c.cand.name)}</th>`).join("")}</tr></thead><tbody></tbody></table>`);
  const tbody = qs("tbody",table);
  tbody.appendChild(el(`<tr><td>${esc(t("Overall"))}</td>${cells.map((c,i)=>`<td>${scores[i]==null?`<span class="badge neutral">${esc(t("Unknown"))}</span>`:scores[i]}${!c.isFinal?` <span class="badge warning">${esc(t("AI draft"))}</span>`:''}</td>`).join("")}</tr>`));
  allCompNames.forEach(name=>{
    tbody.appendChild(el(`<tr><td>${esc(name)}</td>${cells.map(c=>{ const cr = c.evaluation && c.evaluation.criteria.find(x=>x.name===name); if(!cr) return `<td><span class="badge neutral">${esc(t("Not provided"))}</span></td>`; const v = c.isFinal?cr.human:cr.ai; return `<td>${v}/${cr.max}</td>`; }).join("")}</tr>`));
  });
  tbody.appendChild(el(`<tr><td>${esc(t("Next action"))}</td>${cells.map(c=>`<td><button class="btn sm ghost">${esc(t("Open →"))}</button></td>`).join("")}</tr>`));
  qsa("tr:last-child button", tbody).forEach((b,i)=> b.onclick = ()=> navigate("#/results/"+cells[i].caseId+"/release"));
  matrixWrap.appendChild(table);
  wrap.appendChild(matrixWrap);
  return wrap;
}
</script>
<script>
/* ============================================================
   PAGE: Files & Integrations / Settings / AI Models / Activity
   ============================================================ */
route("/files", ()=> pageFiles());
route("/settings", ()=> pageSettings());
route("/ai-models", ()=> pageAIModels());

function pageFiles(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<h1 style="margin-bottom:16px">${esc(t("Files & Integrations"))}</h1>`));
  const tabKeys = ["files","connections","activity"];
  const body = el(`<div></div>`);
  function show(key){
    body.innerHTML = "";
    if(key==="files"){
      const dz = el(`<div class="card card-pad" style="border-style:dashed;text-align:center;margin-bottom:16px;color:var(--text-secondary)">${esc(t("Drag files here, or"))} <a style="cursor:pointer;color:var(--accent)">${esc(t("browse"))}</a> ${esc(t("— registers a FileVersion, not a per-module copy."))}</div>`);
      body.appendChild(dz);
      const tableWrap = el(`<div class="table-wrap"></div>`);
      const table = el(`<table class="table"><thead><tr><th>${esc(t("File"))}</th><th>${esc(t("Version"))}</th><th>${esc(t("Size"))}</th><th>${esc(t("Status"))}</th><th>${esc(t("Used by"))}</th><th></th></tr></thead><tbody></tbody></table>`);
      DB.files.list.forEach(fid=>{
        const f = DB.core.files[fid]; const v = f.versions[0];
        const usedBy = Object.values(DB.attempts).find(a=>a.fileRef===fid) ? t("Attempt") : (fid.startsWith("core_file_q") ? t("Question material") : t("Unassigned"));
        const tr = el(`<tr></tr>`);
        tr.innerHTML = `<td>${esc(f.name)}</td><td>v${v.ver}</td><td>${esc(v.size)}</td><td>${statusBadge(v.status)}</td><td>${esc(usedBy)}</td>
          <td><button class="btn sm ghost">${esc(t("Preview"))}</button> <button class="btn sm ghost">${esc(t("Download"))}</button></td>`;
        qs("tbody",table).appendChild(tr);
      });
      tableWrap.appendChild(table);
      body.appendChild(tableWrap);
    } else if(key==="connections"){
      DB.files.connections.forEach(c=>{
        const card = el(`<div class="card card-pad flex items-center justify-between" style="margin-bottom:8px"></div>`);
        card.innerHTML = `<div><b>${esc(c.name)}</b><div class="tiny">${esc(c.kind)} · ${esc(c.scope)} · ${esc(t("last sync"))} ${esc(timeAgo(c.lastSync))}</div></div>`;
        const actions = el(`<div class="flex gap-2"></div>`);
        if(c.status==="auth_required"){
          const b = el(`<button class="btn sm primary">${esc(t("Reauthorize"))}</button>`); b.onclick=()=>{ c.status="connected"; c.lastSync=nowISO(); saveDB(); toast("Reauthorized.","success"); navigate("#/files"); };
          actions.appendChild(b); actions.appendChild(el(`<span class="badge warning">${esc(t("Auth required"))}</span>`));
        } else {
          const readBtn = el(`<button class="btn sm">${esc(t("Read now"))}</button>`); readBtn.onclick=()=>{ c.lastSync=nowISO(); saveDB(); toast("Checked for new items — 0 new.","info"); navigate("#/files"); };
          const pauseBtn = el(`<button class="btn sm ghost">${esc(t("Pause"))}</button>`); pauseBtn.onclick=()=>toast("Connection paused (demo).","info");
          actions.appendChild(readBtn); actions.appendChild(pauseBtn); actions.appendChild(el(`<span class="badge success">${esc(t("Connected"))}</span>`));
        }
        card.appendChild(actions);
        body.appendChild(card);
      });
    } else {
      const card = el(`<div class="card"></div>`);
      DB.activity.forEach(a=> card.appendChild(el(`<div class="task-row"><div class="task-main"><div class="task-sub">${esc(fmtDate(a.at))}</div><div>${esc(a.text)}</div></div></div>`)));
      body.appendChild(card);
    }
  }
  wrap.appendChild(tabsBar([{key:"files",label:t("Files")},{key:"connections",label:t("Connections")},{key:"activity",label:t("Activity")}], "files", (key)=>{ qsa(".tab",wrap).forEach((t,i)=>t.classList.toggle("active", tabKeys[i]===key)); show(key); }));
  show("files");
  wrap.appendChild(body);
  return wrap;
}

/* ---- Global Appearance quick-access (topbar icon → modal, like Resume Screening) ---- */
function appearanceFieldRow(label, options, current, onPick){
  const wrap = el(`<div class="field" style="margin-bottom:12px"></div>`);
  wrap.appendChild(el(`<label>${esc(label)}</label>`));
  const row = el(`<div class="flex gap-2 wrap"></div>`);
  options.forEach(o=>{
    const optLabel = t(o[0].toUpperCase()+o.slice(1));
    const b = el(`<button class="btn sm ${o===current?'primary':''}">${optLabel}</button>`);
    b.onclick = ()=> onPick(o);
    row.appendChild(b);
  });
  wrap.appendChild(row);
  return wrap;
}
function openAppearanceModal(){
  let overlay;
  function draw(){
    if(overlay) overlay.remove();
    const s = DB.settings;
    overlay = el(`<div class="overlay center"></div>`);
    const modal = el(`<div class="modal"></div>`);
    modal.appendChild(el(`<div class="overlay-head"><h3>${esc(t("Appearance"))}</h3><div class="icon-btn"><span class="material-icons-o">close</span></div></div>`));
    qs(".icon-btn",modal).onclick = ()=> overlay.remove();
    const body = el(`<div class="overlay-body"></div>`);
    body.appendChild(appearanceFieldRow(t("Theme"), ["light","dark","deep","system"], s.theme, (v)=>{ s.theme=v; saveDB(); render(); draw(); }));
    body.appendChild(appearanceFieldRow(t("Accent"), ["blue","teal","violet"], s.accent, (v)=>{ s.accent=v; saveDB(); render(); draw(); }));
    body.appendChild(appearanceFieldRow(t("Text size"), ["small","medium","large"], s.textSize, (v)=>{ s.textSize=v; saveDB(); render(); draw(); }));
    body.appendChild(el(`<div class="tiny">${esc(t("Applies instantly across tables, menus, evidence highlights and overlays. Saved for this account"))} (${esc(currentUser().name)}) ${esc(t("— demo uses local storage, not real cloud sync across devices."))}</div>`));
    modal.appendChild(body);
    const foot = el(`<div class="overlay-foot"></div>`);
    const resetBtn = el(`<button class="btn ghost">${esc(t("Reset to defaults"))}</button>`);
    resetBtn.onclick = ()=>{ s.theme="light"; s.accent="blue"; s.textSize="medium"; saveDB(); toast("Appearance reset to defaults.","info"); render(); draw(); };
    const doneBtn = el(`<button class="btn primary">${esc(t("Done"))}</button>`);
    doneBtn.onclick = ()=> overlay.remove();
    foot.appendChild(resetBtn); foot.appendChild(doneBtn);
    modal.appendChild(foot);
    overlay.appendChild(modal);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    document.addEventListener("keydown", function esc1(e){ if(e.key==="Escape"){ overlay.remove(); document.removeEventListener("keydown",esc1); } });
    document.body.appendChild(overlay);
  }
  draw();
}

/* ---- Settings: Preferences (calibration governance, per PRD §11/§13) ----
   Appearance itself lives only in the global 🎨 topbar icon (like Resume Screening) —
   this page is the Preferences-equivalent: layered rubric governance, not display settings. ---- */
function pageSettings(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(crumbs([{label:t("Settings"),href:"#/settings"},{label:t("Preferences")}]));
  const header = el(`<div class="flex items-center justify-between wrap gap-2" style="margin-bottom:4px"></div>`);
  header.appendChild(el(`<h1>${esc(t("Preferences"))}</h1>`));
  const aiLink = el(`<a class="btn sm" href="#/ai-models"><span class="material-icons-o" style="font-size:16px">smart_toy</span>${esc(t("AI Models"))}</a>`);
  header.appendChild(aiLink);
  wrap.appendChild(header);
  wrap.appendChild(el(`<div class="muted" style="margin-bottom:16px">${esc(t("Organization and Team layers govern official scoring. Personal views never change team results. Appearance (theme, accent, text size) lives in the"))} <span class="material-icons-o" style="font-size:15px;vertical-align:text-bottom">palette</span> ${esc(t("icon in the top bar."))}</div>`));
  wrap.appendChild(el(`<div class="card card-pad" style="margin-bottom:20px">
    <div class="flex items-center justify-between" style="margin-bottom:6px"><b>${esc(t("Team access policy — Startup Team Access"))}</b><span class="badge info"><span class="dot"></span>startup_open / 1.0</span></div>
    <div class="tiny">${esc(t("Any valid, active employee of this workspace can create/edit/publish questions, plan, invite, score/override, finalize/release, revise, supplement, hand off, export and resolve exceptions — HR, Hiring Manager, owner and reviewer fields route notifications and default follow-ups, but they are not access-control gates. There is no approval queue and no dual sign-off; sending or publishing is the acting employee's own confirmation, recorded as performed_by. Base limits still apply: valid company login, candidates see only their own tasks and published results, companies stay isolated, and deactivated accounts cannot act. See Team Tasks on"))} <a href="#/tasks">${esc(t("My Tasks"))}</a> ${esc(t("to act directly on a colleague's open work."))}</div>
  </div>`));
  const policyCard=el(`<div class="card card-pad" style="margin-bottom:20px"><div class="flex items-center justify-between"><h3>${esc(t('Policies'))}</h3><span class="badge info">Editable</span></div><div class="grid-2" style="margin-top:12px"><label class="checkbox-row"><input type="checkbox" checked> Portal upload enabled</label><label class="checkbox-row"><input type="checkbox" checked> Email reply enabled</label><label class="checkbox-row"><input type="checkbox" checked> Candidate sees released summary</label><label class="checkbox-row"><input type="checkbox"> Require manual round acceptance</label></div><button class="btn sm primary" style="margin-top:12px" id="savePolicies">Save policies</button></div>`);
  qs('#savePolicies',policyCard).onclick=()=>{ saveDB(); toast('Assessment policies saved.','success'); };
  wrap.appendChild(policyCard);
  wrap.appendChild(settingsCalibrationTab());
  return wrap;
}

function settingsCalibrationTab(){
  const wrap = el(`<div></div>`);
  const C = DB.calibration;
  const isAdmin = DB.settings.currentUser === "user_morgan";

  wrap.appendChild(el(`<div class="grid-2" style="margin-bottom:20px"></div>`));
  const grid = qs(".grid-2",wrap);
  [C.layers.organization, C.layers.team, C.layers.role, C.layers.personal].forEach(layer=>{
    const card = el(`<div class="card card-pad"></div>`);
    card.innerHTML = `<div class="flex items-center justify-between"><b>${esc(layer.scope)}</b>${statusBadge(layer.status)}</div>`;
    if(layer.pointerOnly){ card.appendChild(el(`<div class="tiny" style="margin-top:8px">${esc(layer.note)}</div>`)); }
    else{
      const list = el(`<ul style="margin:8px 0 0;padding-left:18px;font-size:calc(var(--text-base)*.88)"></ul>`);
      layer.rules.forEach(r=> list.appendChild(el(`<li>${esc(r.feature)} — ${esc(r.detail)}${r.locked?` <span class="badge neutral">${esc(t("Locked"))}</span>`:''}</li>`)));
      card.appendChild(list);
    }
    grid.appendChild(card);
  });

  wrap.appendChild(el(`<h4 style="margin:8px 0 8px">${esc(t("Feedback signals"))} <span class="tiny" style="font-weight:400">(${esc(t("from Interview outcomes and human overrides"))})</span></h4>`));
  const sigWrap = el(`<div class="table-wrap" style="margin-bottom:20px"></div>`);
  const sigTable = el(`<table class="table"><thead><tr><th>${esc(t("Feature"))}</th><th>${esc(t("Direction"))}</th><th>${esc(t("Strength"))}</th><th>${esc(t("Source"))}</th><th>${esc(t("Eligibility"))}</th></tr></thead><tbody></tbody></table>`);
  C.signals.forEach(s=>{
    const tr = el(`<tr></tr>`);
    tr.innerHTML = `<td>${esc(s.feature)}</td><td>${s.direction==='n/a'?'—':esc(t(s.direction))}</td><td>${s.strength?Math.round(s.strength*100)+'%':'—'}</td><td class="tiny">${esc(s.source)}</td>
      <td>${s.eligibility==='eligible' ? `<span class="badge success">${esc(t("Eligible"))}</span>` : `<span class="badge danger">${esc(t("Prohibited — excluded"))}</span>`}</td>`;
    qs("tbody",sigTable).appendChild(tr);
  });
  sigWrap.appendChild(sigTable);
  wrap.appendChild(sigWrap);

  wrap.appendChild(el(`<h4 style="margin-bottom:8px">${esc(t("Proposed shared preferences"))} <span class="tiny" style="font-weight:400">(${esc(t("pending review — never auto-applied"))})</span></h4>`));
  const propCard = el(`<div class="card" style="margin-bottom:20px"></div>`);
  if(C.proposals.length===0){ propCard.appendChild(el(`<div class="empty">${esc(t("No proposals pending."))}</div>`)); }
  C.proposals.forEach(p=>{
    const row = el(`<div class="task-row flex-col" style="align-items:stretch;gap:8px"></div>`);
    row.innerHTML = `<div class="flex items-center justify-between wrap gap-2">
        <div class="task-main"><div class="task-title">${esc(p.title)}</div><div class="task-sub">${esc(t("Basis:"))} ${esc(p.basis)}</div><div class="tiny">${esc(t("Sample size"))} ${p.sampleSize} · ${esc(p.window)}</div></div>
      </div>`;
    const actions = el(`<div class="flex gap-2"></div>`);
    if(isAdmin){
      const rejectBtn = el(`<button class="btn sm ghost">${esc(t("Reject"))}</button>`);
      rejectBtn.onclick = ()=>{ C.proposals = C.proposals.filter(x=>x.id!==p.id); saveDB(); toast("Proposal rejected — no change to active preferences.","info"); navigate("#/settings"); };
      const activateBtn = el(`<button class="btn sm primary">${esc(t("Activate new version"))}</button>`);
      activateBtn.onclick = ()=>{
        const q = DB.questions[p.questionId];
        q.competencies = p.newWeights.slice();
        q.version += 1;
        C.versions.unshift({ id:"v"+(C.versions.length+1), label:"v"+(C.versions.length+1)+" (current)", activatedAt: nowISO(), activatedBy: DB.settings.currentUser });
        C.versions.forEach((v,i)=>{ if(i>0) v.label = v.label.replace(" (current)",""); });
        C.layers.team.rules.push({ feature: p.title.replace("Proposed: ",""), detail:"Activated from calibration proposal", locked:true });
        C.proposals = C.proposals.filter(x=>x.id!==p.id);
        saveDB();
        toast(`New shared rubric version activated for ${q.code}. Already-scored evaluations are unchanged.`,"success");
        navigate("#/settings");
      };
      actions.appendChild(rejectBtn); actions.appendChild(activateBtn);
    } else {
      actions.appendChild(el(`<span class="badge info">${esc(t("Awaiting Admin review"))}</span>`));
    }
    row.appendChild(actions);
    propCard.appendChild(row);
  });
  wrap.appendChild(propCard);

  wrap.appendChild(el(`<h4 style="margin-bottom:8px">${esc(t("Version history"))}</h4>`));
  const verWrap = el(`<div class="table-wrap"></div>`);
  const verTable = el(`<table class="table"><thead><tr><th>${esc(t("Version"))}</th><th>${esc(t("Activated"))}</th><th>${esc(t("By"))}</th><th></th></tr></thead><tbody></tbody></table>`);
  C.versions.forEach(v=>{
    const tr = el(`<tr></tr>`);
    const isCurrent = v.label.includes("current");
    tr.innerHTML = `<td>${esc(v.label)}</td><td class="tiny">${esc(fmtDateShort(v.activatedAt))}</td><td class="tiny">${esc(DB.identity.users[v.activatedBy].name)}</td>
      <td class="text-right"></td>`;
    if(!isCurrent){
      const rb = el(`<button class="btn sm ghost">${esc(t("Roll back to this"))}</button>`);
      rb.onclick = ()=>{ toast("Rolled back — a new version was created pointing at the prior configuration.","success"); };
      qs("td:last-child",tr).appendChild(rb);
    }
    qs("tbody",verTable).appendChild(tr);
  });
  verWrap.appendChild(verTable);
  wrap.appendChild(verWrap);
  return wrap;
}

function pageAIModels(){
  const wrap=el(`<div></div>`); wrap.appendChild(crumbs([{label:t('Settings'),href:'#/settings'},{label:t('AI Models')}])); wrap.appendChild(el(`<h1 style="margin-bottom:4px">${esc(t('AI Models'))}</h1>`)); wrap.appendChild(el(`<div class="muted" style="margin-bottom:16px">Catalog, task policies, evaluation, usage and version controls for safe fallback.</div>`));
  const body=el(`<div></div>`);
  const tabs=[['catalog','Catalog'],['policies','Task policies'],['compare','Compare & evaluate'],['usage','Usage & cost'],['activity','Activity & versions']];
  function show(key){ body.innerHTML=''; if(key==='catalog'){ DB.aiModels.tasks.forEach(mt=>{ const c=el(`<div class="card card-pad flex items-center justify-between" style="margin-bottom:8px"><div><b>${esc(mt.primary)}</b><div class="tiny">${esc(mt.task)} · fallback ${esc(mt.fallback)}</div></div><span class="badge ${mt.status==='ok'?'success':'warning'}">${mt.status==='ok'?'Published':'Fallback active'}</span></div>`); body.appendChild(c); }); } else if(key==='policies'){ const c=el(`<div class="card card-pad"><h3>Eligibility policy</h3><p class="muted">Hard constraints → quality → cost/latency → published preference.</p><div class="banner warning">No eligible model: fallback is triggered when a required capability or budget ceiling is unavailable.</div><button class="btn primary" id="triggerFallback">Simulate safe fallback</button></div>`); qs('#triggerFallback',c).onclick=()=>{ toast('Fallback triggered, budget reservation released, and event recorded.','warning'); }; body.appendChild(c); } else if(key==='compare'){ const c=el(`<div class="card card-pad"><h3>Compare & evaluate</h3><p class="muted">Review quality, latency and cost before publishing a version.</p><button class="btn" id="publishModel">Publish selected version</button> <button class="btn ghost" id="rollbackModel">Rollback</button></div>`); qs('#publishModel',c).onclick=()=>toast('Model policy version published.','success'); qs('#rollbackModel',c).onclick=()=>toast('Previous model policy restored.','info'); body.appendChild(c); } else if(key==='usage'){ body.appendChild(el(`<div class="card card-pad"><h3>Usage & cost</h3><div class="grid-2"><div><div class="tiny">Monthly budget</div><b>$420 / $500</b></div><div><div class="tiny">Reserved for active runs</div><b>$38</b></div></div><div class="banner info" style="margin-top:12px">Budget reservation is checked before each run.</div></div>`)); } else { body.appendChild(el(`<div class="card card-pad"><h3>Activity & versions</h3><div class="task-row">v3 · Published today · by Morgan</div><div class="task-row">v2 · Rolled back yesterday · by Daniel</div></div>`)); } }
  wrap.appendChild(tabsBar(tabs.map(x=>({key:x[0],label:x[1]})),'catalog',(key)=>{ qsa('.tab',wrap).forEach((t,i)=>t.classList.toggle('active',tabs[i][0]===key)); show(key); })); show('catalog'); wrap.appendChild(body); return wrap;
}
