        : `<p class="tiny">${T('No human overrides recorded. AI scores above are shown as generated.')}</p>`}
    </div>
  </div>
  `;
}

function renderDimensionRow(job, ev, d){
  const evList = (d.supporting||[]).concat(d.counter||[]);
  return `<div class="card-pad" style="border-bottom:1px solid var(--border);">
    <div class="flex items-center gap-16 flex-wrap">
      ${d.status==='evaluated' ? scoreRing(d.score,'sm') : `<span class="score-ring unk" style="width:30px;height:30px;font-size:11px;">${d.status==='not_evaluated'?'N/E':'?'}</span>`}
      <div style="flex:1;min-width:220px;">
        <div style="font-weight:500;font-size:var(--fs-sm);">${esc(d.name)} <span class="tiny muted">${T('weight')} ${Math.round(d.weight*100)}%</span></div>
        <div class="tiny">${esc(d.reason||'')}</div>
      </div>
      <div style="width:120px;">${d.status==='evaluated'?`<span class="tiny">${T('Confidence')} ${pct(d.confidence)}</span>`:`<span class="badge badge-outline">${d.status==='unknown'?T('Unknown'):T(cap(d.status))}</span>`}</div>
      <button class="btn btn-sm btn-secondary" ${evList.length?'':'disabled'} onclick="A.openDimensionEvidence('${ev.applicationId}','${d.id}')">${T('Evidence')} (${evList.length})</button>
    </div>
  </div>`;
}
A.openDimensionEvidence = function(appId, dimId){
  const ev = getEvaluation(appId);
  const d = (ev.dimensionScores||[]).find(x=>x.id===dimId);
  const items = (d.supporting||[]).map(id=>({id,rel:'Supports'})).concat((d.counter||[]).map(id=>({id,rel:'Contradicts'})));
  openDrawer(`
    <div class="drawer-header"><h3 class="modal-title">${esc(d.name)} — ${T('evidence')}</h3><button class="close-x" onclick="A.closeDrawer()"><span class="material-icons-o">close</span></button></div>
    <div class="drawer-body">
      <p class="tiny" style="margin-bottom:14px;">${T('Requirement → rubric → rationale → evidence → source excerpt.')}</p>
      <div class="card card-pad" style="margin-bottom:14px;background:var(--surface-alt);">
        <div class="tiny" style="font-weight:600;">${T('Rationale')}</div><p style="font-size:var(--fs-sm);margin:4px 0 0;">${esc(d.reason)}</p>
      </div>
      ${items.length ? items.map(it=>renderEvidenceCard(it.id, it.rel)).join('') : `<p class="tiny">${T('No linked evidence — Unknown is shown rather than a fabricated citation.')}</p>`}
    </div>
    <div class="drawer-footer"><button class="btn btn-secondary" onclick="A.closeDrawer()">${T('Close')}</button></div>`);
};
function renderEvidenceCard(evidenceId, relationship){
  const e = getEvidenceById(evidenceId);
  if(!e) return '';
  const restricted = e.availability==='restricted' && !['emma','daniel'].includes(state.currentUser);
  return `<div class="card card-pad" style="margin-bottom:10px;">
    <div class="flex items-center justify-between" style="margin-bottom:6px;">
      <span class="badge ${relationship==='Contradicts'?'badge-danger':'badge-info'}">${T(relationship)}</span>
      <span class="badge ${e.verification==='verified'?'badge-success':'badge-outline'}">${T(cap(e.verification))}</span>
    </div>
    ${restricted ? `<p style="font-size:var(--fs-sm);color:var(--text-tertiary);font-style:italic;">${T('Restricted — visible to authorized HR/HM roles only.')}</p>`
      : `<p style="font-size:var(--fs-sm);">“${esc(e.statement)}”</p>`}
    <div class="tiny" style="margin-top:6px;">${esc(e.sourceLabel)} · ${e.locator.type==='pdf'?`${T('page')} ${e.locator.page}`:e.locator.section||e.locator.noteId||''} · ${T('kind:')} ${T(cap(e.kind.replace(/_/g,' ')))} · ${T('confidence')} ${pct(e.confidence)}</div>
  </div>`;
}

function renderConcernRow(app, c){
  const sevClass = c.severity==='blocker'?'badge-danger':c.severity==='high'?'badge-danger':c.severity==='medium'?'badge-warning':'badge-outline';
  const restricted = c.restricted && !['emma','daniel'].includes(state.currentUser);
  return `<div class="card-pad" style="border-bottom:1px solid var(--border);">
    <div class="flex items-center justify-between flex-wrap gap-8">
      <div>
        <div style="font-weight:500;font-size:var(--fs-sm);">${restricted?T('Restricted concern — visible to authorized HR/HM roles only'):esc(c.title)} <span class="badge ${sevClass}" style="margin-left:6px;">${T(cap(c.severity))}</span></div>
        <div class="tiny">${T(cap(c.type.replace(/_/g,' ')))} · ${T('basis:')} ${T(cap(c.basis.replace(/_/g,' ')))} · ${T('status:')} ${T(cap(c.status.replace(/_/g,' ')))}</div>
      </div>
      ${c.status==='open' && !restricted ? `<div class="flex gap-6">
        <button class="btn btn-sm btn-secondary" onclick="A.resolveConcern('${app.id}','${c.id}','dismissed')">${T('Dismiss')}</button>
        <button class="btn btn-sm btn-secondary" onclick="A.resolveConcern('${app.id}','${c.id}','confirmed')">${T('Confirm')}</button>
        ${c.severity==='blocker'?`<button class="btn btn-sm btn-secondary" onclick="A.resolveConcern('${app.id}','${c.id}','accepted_risk')">${T('Accept risk (needs approval)')}</button>`:''}
      </div>` : (c.status!=='open'?`<span class="badge badge-outline">${T(cap(c.status.replace(/_/g,' ')))}</span>`:'')}
    </div>
  </div>`;
}
A.resolveConcern = function(appId, concernId, outcome){
  const c = getConcerns(appId).find(x=>x.id===concernId);
  if(outcome==='accepted_risk'){
    confirmModal({ title:T('Accept risk — requires HR + HM approval'), body:T('This blocker requires approval from both an HR and a Hiring Manager approver before it can be accepted. In this demo, confirming records both approvals.'),
      confirmLabel:T('Record HR + HM approval'), onConfirm:()=>{
        c.status='accepted_risk'; c.resolution={outcome:'accepted_risk', approvedBy:['emma','daniel'], at:nowISO()};
        state.db.audit.unshift({ id:uid('aud'), at:nowISO(), actor:state.currentUser, action:'Accepted risk exception (HR+HM approved)', object:c.title });
        toast(T('Risk accepted — original evidence and status are kept, not overwritten'), 'success'); renderRoute();
      }});
    return;
  }
  c.status = outcome; c.resolution = { outcome, by: state.currentUser, at: nowISO() };
  toast(`${T('Concern marked')} ${T(cap(outcome.replace(/_/g,' ')))}`, 'success');
  renderRoute();
};
function renderVerificationRow(v){
  return `<div class="card-pad" style="border-bottom:1px solid var(--border);">
    <div class="flex items-center justify-between flex-wrap gap-8">
      <div><div style="font-weight:500;font-size:var(--fs-sm);">${esc(v.question)}</div>
        <div class="tiny">${T('Method:')} ${T(cap(v.method.replace(/_/g,' ')))} · ${T('Target:')} ${T(cap(v.targetStage))} · ${T('Priority:')} ${T(cap(v.priority))} ${v.owner?'· '+T('Owner:')+' '+esc(getPerson(v.owner).name):''}</div></div>
      <div class="flex gap-6 items-center">
        <span class="badge ${v.status==='resolved'?'badge-success':v.status==='open'?'badge-info':'badge-outline'}">${T(cap(v.status.replace(/_/g,' ')))}</span>
        ${v.status==='open' ? `<button class="btn btn-sm btn-secondary" onclick="A.assignVerification('${v.id}')">${T('Assign to me')}</button>
          <button class="btn btn-sm btn-secondary" onclick="A.resolveVerification('${v.id}','met')">${T('Mark met')}</button>
          <button class="btn btn-sm btn-secondary" onclick="A.resolveVerification('${v.id}','not_met')">${T('Mark not met')}</button>` : ''}
      </div>
    </div>
  </div>`;
}
A.assignVerification = function(id){ const v = state.db.verificationItems[id]; v.owner = state.currentUser; v.status='assigned'; toast(T('Assigned to you')); renderRoute(); };
A.resolveVerification = function(id, outcome){
  const v = state.db.verificationItems[id];
  v.status='resolved'; v.outcome=outcome; v.resolvedBy=state.currentUser; v.resolvedAt=nowISO();
  toast(`${T('Verification item resolved —')} ${T(cap(outcome.replace(/_/g,' ')))}`, 'success');
  renderRoute();
};

A.openOverride = function(appId){
  const ev = getEvaluation(appId);
  openModal(`
    <div class="modal-header"><h3 class="modal-title">${T('Override a score')}</h3><button class="close-x" onclick="A.closeModal()"><span class="material-icons-o">close</span></button></div>
    <div class="modal-body">
      <p class="tiny" style="margin-bottom:12px;">${T('This records your assessment as a separate human judgment. The AI score is kept unchanged for audit and comparison.')}</p>
      <div class="field"><label>${T('Dimension')}</label><select id="ov-dim">${ev.dimensionScores.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div>
      <div class="field"><label>${T('Your score (0–100)')}</label><input type="text" id="ov-score" placeholder="e.g. 85"></div>
      <div class="field"><label>${T('Reason')}</label><textarea id="ov-reason" placeholder="${T('Why does your assessment differ from the AI score?')}"></textarea></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="A.closeModal()">${T('Cancel')}</button><button class="btn btn-primary" onclick="A.saveOverride('${appId}')">${T('Save override')}</button></div>`);
};
A.saveOverride = function(appId){
  const dimId = document.getElementById('ov-dim').value;
  const score = parseInt(document.getElementById('ov-score').value,10);
  const reason = document.getElementById('ov-reason').value.trim();
  if(isNaN(score) || score<0 || score>100){ toast(T('Enter a score between 0 and 100'), 'error'); return; }
  if(!reason){ toast(T('A reason is required'), 'error'); return; }
  const ev = getEvaluation(appId);
  const dim = ev.dimensionScores.find(d=>d.id===dimId);
  if(!state.db.humanAssessments) state.db.humanAssessments = {};
  state.db.humanAssessments[appId] = { dimensionId:dimId, dimensionName:dim.name, score, reason, by:state.currentUser, at:nowISO() };
  state.db.audit.unshift({ id:uid('aud'), at:nowISO(), actor:state.currentUser, action:'Recorded human score override', object:`${dim.name} → ${score}` });
  closeModal(); toast(T('Human override saved — AI score unchanged'), 'success');
  renderRoute();
};

A.runScreening = function(appId){
  toast(T('Running AI-assisted screening…'));
  const app = getApplication(appId);
  const job = getJob(app.jobId);
  setTimeout(()=>{
    const dims = job.dimensions.map(d=>({ id:d.id, name:d.name, weight:d.weight, status:'evaluated', score: 55+Math.round(Math.random()*30), confidence:0.6, reason:'Generated from available resume and profile content for this demo run.', supporting:[], counter:[] }));
    const evalObj = makeEval('eval-'+appId, appId, dims, [], { confidence:0.6, completedAt: nowISO() });
    state.db.evaluations[appId] = evalObj;
    state.db.concerns[appId] = state.db.concerns[appId] || [];
    app.screeningStatus = 'review_pending';
    toast(T('Screening complete'), 'success');
    renderRoute();
  }, 900);
};

A.refreshEvaluation = function(appId){
  const ev = getEvaluation(appId);
  toast(T('Refreshing evaluation with latest inputs…'));
  setTimeout(()=>{
    // demo-specific: bump the technical dimension using the newly available resume evidence
    const techDim = ev.dimensionScores.find(d=>d.id==='dim-tech');
    if(techDim && techDim.status==='evaluated'){ techDim.score = Math.min(100, techDim.score + 6); techDim.reason += ' Updated resume adds further detail on the service-migration ownership.'; }
    const agg = computeAggregate(ev.dimensionScores);
    ev.overall = agg.overall; ev.coverage = agg.coverage;
    ev.evaluationStatus = agg.overall==null ? 'insufficient_evidence' : 'evaluated';
    ev.freshness = 'current'; ev.completedAt = nowISO();
    toast(T('Evaluation refreshed — new snapshot created, prior result kept in history'), 'success');
    renderRoute();
  }, 800);
};

registerRoute('#/applications/:id', renderScreeningDetailPage);

</script>

<script>
/* ---- page_compare.js ---- */
/* ===================================================================
   PAGE: Candidate Comparison  (#/comparisons/:id)
   =================================================================== */

let compareUi = { mode:'current_summary', diffOnly:false, snapIdx: null, nextStepDraft:{} };

function renderComparePage(params){
  const cmp = state.db.comparisons[params.id];
  if(!cmp) return emptyState({icon:'compare_arrows', title:T('Comparison not found')});
  const job = getJob(cmp.jobId);
  if(compareUi.snapIdx==null) compareUi.snapIdx = cmp.snapshots.length-1;
  const snap = cmp.snapshots[compareUi.snapIdx];
  const members = cmp.memberIds.map(id=>{ const app=getApplication(id); return { app, cand:getCandidate(app.candidateId), ev:getEvaluation(id) }; });

  const otherJobAApps = getApplicationsForJob(job.id).filter(a=>!cmp.memberIds.includes(a.id));

  return `
  ${pageHeader(T('Compare candidates'), `${esc(job.title)} · ${esc(cmp.purpose)}`, `
    <button class="btn btn-secondary" onclick="A.openAddToCompare('${cmp.id}')"><span class="material-icons-o">person_add</span>${T('Add candidate')}</button>
    <button class="btn btn-secondary" onclick="A.refreshComparison('${cmp.id}')"><span class="material-icons-o">refresh</span>${T('Refresh')}</button>
    <button class="btn btn-primary" onclick="A.openExportCompare('${cmp.id}')"><span class="material-icons-o">ios_share</span>${T('Export')}</button>
  `, [{label:T('Jobs'),href:'#/jobs'},{label:job.title,href:'#/jobs/'+job.id+'/screening'},{label:T('Compare')}])}

  <div class="flex items-center justify-between flex-wrap gap-12" style="margin-bottom:16px;">
    <div class="pill-tabs">
      <button class="pill-tab ${compareUi.mode==='same_stage'?'active':''}" onclick="A.setCompareMode('same_stage')">${T('Same stage')}</button>
      <button class="pill-tab ${compareUi.mode==='current_summary'?'active':''}" onclick="A.setCompareMode('current_summary')">${T('Current summary')}</button>
      <button class="pill-tab ${compareUi.mode==='round_changes'?'active':''}" onclick="A.setCompareMode('round_changes')">${T('Changes since last round')}</button>
    </div>
    <div class="flex items-center gap-12">
      <label class="checkbox-row"><input type="checkbox" ${compareUi.diffOnly?'checked':''} onchange="A.toggleDiffOnly(this.checked)"> ${T('Show differences only')}</label>
      <select onchange="A.setSnapIdx(this.value)">${cmp.snapshots.map((s,i)=>`<option value="${i}" ${i===compareUi.snapIdx?'selected':''}>${T('Snapshot')} v${s.version} — ${fmtDate(s.generatedAt)}</option>`).join('')}</select>
      ${freshnessBadge(snap.freshness)}
    </div>
  </div>

  ${compareUi.mode==='round_changes' ? renderRoundChanges(cmp, snap) : renderKeyDifferences(job, members)}

  <div class="card" style="overflow-x:auto;margin-top:18px;">
    ${renderCompareMatrix(job, members)}
  </div>

  <div class="section-block" style="margin-top:24px;">
    <div class="section-title">${T('Annotations')}</div>
    <div class="card card-pad">
      ${(cmp.annotations||[]).map(a=>`<div style="margin-bottom:10px;"><span style="font-weight:500;font-size:var(--fs-sm);">${esc(getPerson(a.author).name)}</span> <span class="tiny">${relTime(a.createdAt)}</span><p style="font-size:var(--fs-sm);margin:2px 0 0;">${esc(a.body)}</p></div>`).join('') || `<p class="tiny">${T('No annotations yet.')}</p>`}
      <div class="flex gap-8" style="margin-top:8px;">
        <input type="text" id="new-annotation" placeholder="${T('Add a note for the team...')}" style="flex:1;padding:8px 12px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);color:var(--text);font-size:var(--fs-sm);">
        <button class="btn btn-secondary" onclick="A.addAnnotation('${cmp.id}')">${T('Add')}</button>
      </div>
    </div>
  </div>

  <div class="section-block">
    <div class="flex items-center justify-between"><div class="section-title" style="margin-bottom:6px;">${T('Next steps')}</div>
      <div class="flex gap-8 items-center">
        <span class="tiny">${T('Apply to all:')}</span>
        <select onchange="A.applyAllNextStep('${cmp.id}', this.value)">
          <option value="">${T('Choose…')}</option>
          <option value="assessment">${T('Send Assessment')}</option>
          <option value="hold">${T('Hold')}</option>
        </select>
      </div>
    </div>
    <div class="card card-pad">
      <table class="data-table">
        <thead><tr><th>${T('Candidate')}</th><th>${T('Current status')}</th><th>${T('Next step')}</th></tr></thead>
        <tbody>${members.map(m=>{
          const decided = state.db.decisions[m.app.id];
          return `<tr><td>${candAvatar(m.cand)} ${esc(m.cand.displayName)}</td>
          <td>${decided?`<span class="badge badge-success">${T('Decided —')} ${T(REC_LABEL[decided.outcome]||cap(decided.outcome))}</span>`:`<span class="badge badge-info">${T('Pending')}</span>`}</td>
          <td>${decided? `<span class="tiny muted">${T('Already decided')}</span>` : `
            <select id="ns-${m.app.id}" onchange="compareUi.nextStepDraft['${m.app.id}']=this.value">
              <option value="">${T('Choose…')}</option>
              <option value="assessment">${T('Send Assessment')}</option>
              <option value="interview">${T('Move to Interview')}</option>
              <option value="request_information">${T('Request Information')}</option>
              <option value="hold">${T('Hold')}</option>
              <option value="do_not_advance">${T('Do Not Advance')}</option>
            </select>`}</td></tr>`;
        }).join('')}</tbody>
      </table>
      <button class="btn btn-primary" style="margin-top:12px;" onclick="A.openSubmitNextSteps('${cmp.id}')">${T('Submit selected next steps')}</button>
      <p class="tiny" style="margin-top:6px;">${T('Generating this comparison or selecting values above does not notify anyone. Nothing is sent until you submit and confirm.')}</p>
    </div>
  </div>`;
}

function computeKeyDifferences(job, members){
  const diffs = [];
  (job.dimensions||[]).forEach(d=>{
    const vals = members.map(m=>{
      const ds = m.ev && (m.ev.dimensionScores||[]).find(x=>x.id===d.id);
      return { cand:m.cand, score: ds&&ds.status==='evaluated'?ds.score:null };
    }).filter(v=>v.score!=null);
    if(vals.length<2) return;
    const max = vals.reduce((a,b)=>b.score>a.score?b:a);
    const min = vals.reduce((a,b)=>b.score<a.score?b:a);
    if(max.score - min.score >= 15){
      diffs.push(`On <strong>${esc(d.name)}</strong>, ${esc(max.cand.displayName)} shows stronger evidence (${max.score}) than ${esc(min.cand.displayName)} (${min.score}). If this dimension matters most for the role, that favors ${esc(max.cand.displayName)} — but confirm via the linked evidence before treating it as decisive.`);
    }
  });
  const insufficient = members.filter(m=>m.ev && m.ev.evaluationStatus==='insufficient_evidence');
  if(insufficient.length) diffs.push(`${insufficient.map(m=>esc(m.cand.displayName)).join(', ')} ${insufficient.length>1?'have':'has'} insufficient evidence for an overall score — this reflects coverage, not a low score.`);
  const notEvaluated = members.filter(m=>{ const a=state.db.assessments[m.app.id]; return !a || a.status!=='completed'; });
  if(notEvaluated.length) diffs.push(`${notEvaluated.map(m=>esc(m.cand.displayName)).join(', ')} ${notEvaluated.length>1?'have':'has'} not yet taken the technical assessment — this is “not evaluated,” not evidence of lower ability.`);
  if(!diffs.length) diffs.push('No clear overall leader based on current evidence — differences are within a normal range for this stage.');
  return diffs;
}
function renderKeyDifferences(job, members){
  const diffs = computeKeyDifferences(job, members);
  return `<div class="card card-pad" style="background:var(--info-bg);border-color:var(--info-border);">
    <div class="flex items-center gap-8" style="color:var(--info-text);font-weight:600;font-size:var(--fs-sm);margin-bottom:8px;"><span class="material-icons-o" style="font-size:18px;">insights</span>${T('Key differences')}</div>
    <ul style="margin:0;padding-left:18px;font-size:var(--fs-sm);">${diffs.map(d=>`<li style="margin-bottom:6px;">${d}</li>`).join('')}</ul>
    <p class="tiny" style="margin-top:8px;">${T('Generated for this comparison snapshot — phrased conditionally, not as a forced ranking. Not a hiring recommendation.')}</p>
  </div>`;
}
function renderRoundChanges(cmp, snap){
  return `<div class="card card-pad" style="background:var(--info-bg);border-color:var(--info-border);">
    <div class="flex items-center gap-8" style="color:var(--info-text);font-weight:600;font-size:var(--fs-sm);margin-bottom:8px;"><span class="material-icons-o" style="font-size:18px;">history</span>${T('Changes since last round')}</div>
    ${snap.changesSinceLast ? `<ul style="margin:0;padding-left:18px;font-size:var(--fs-sm);">${snap.changesSinceLast.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>` : `<p class="tiny">${T('This is the first snapshot for this comparison set.')}</p>`}
    <p class="tiny" style="margin-top:8px;">${esc(snap.note||'')}</p>
  </div>`;
}

function renderCompareMatrix(job, members){
  const dims = job.dimensions;
  const rows = [];
  rows.push({label:T('Overall / Eligibility'), render:m=>`<div class="flex items-center gap-8">${scoreRing(m.ev?m.ev.overall:null,'sm')}${m.ev?eligBadge(m.ev.eligibilityStatus):'—'}</div>`});
  dims.forEach(d=> rows.push({ label:d.name, dimId:d.id, render:m=>{
    const ds = m.ev && (m.ev.dimensionScores||[]).find(x=>x.id===d.id);
    if(!ds || ds.status!=='evaluated') return `<span class="badge badge-outline">${ds&&ds.status==='not_evaluated'?T('Not evaluated'):T('Unknown')}</span>`;
    return `<button class="link-btn" style="font-weight:600;" onclick="A.openDimensionEvidence('${m.app.id}','${d.id}')">${ds.score}</button>`;
  }}));
  rows.push({label:T('Technical assessment (same stage)'), render:m=>{ const a=state.db.assessments[m.app.id]; if(!a||a.status!=='completed') return `<span class="badge badge-outline">${T('Not evaluated')}</span>`; return `<span class="badge badge-success">${a.score}/100</span>`; }});
  rows.push({label:T('Compensation & location'), render:m=>{ const c=m.cand.compensationExpectation; return c?fmtMoney(c):`<span class="badge badge-outline">${T('Not provided')}</span>`; }});
  rows.push({label:T('Evidence status'), render:m=>{ const cons=getConcerns(m.app.id).filter(c=>c.status==='open'); return cons.length?`<span class="badge badge-warning">${cons.length} ${T('open')}</span>`:`<span class="badge badge-success">${T('Clear')}</span>`; }});

  const filteredRows = compareUi.diffOnly ? rows.filter((r,i)=>{
    if(i===0) return true;
    const vals = members.map(m=>r.render(m));
    return new Set(vals).size>1;
  }) : rows;

  return `<table class="data-table" style="min-width:${360+members.length*180}px;">
    <thead><tr><th style="position:sticky;left:0;background:var(--surface);">${T('Dimension')}</th>${members.map(m=>`<th><div class="flex items-center gap-8">${candAvatar(m.cand,'sm')}${esc(m.cand.displayName)}</div></th>`).join('')}</tr></thead>
    <tbody>
      ${filteredRows.map(r=>`<tr><td style="position:sticky;left:0;background:var(--surface);font-weight:500;">${esc(r.label)}</td>${members.map(m=>`<td>${r.render(m)}</td>`).join('')}</tr>`).join('')}
    </tbody>
  </table>`;
}

A.setCompareMode = function(m){ compareUi.mode=m; renderRoute(); };
A.toggleDiffOnly = function(v){ compareUi.diffOnly=v; renderRoute(); };
A.setSnapIdx = function(v){ compareUi.snapIdx=parseInt(v,10); renderRoute(); };
A.refreshComparison = function(cmpId){
  const cmp = state.db.comparisons[cmpId];
  toast(T('Refreshing comparison with latest inputs…'));
  setTimeout(()=>{
    const v = (cmp.snapshots[cmp.snapshots.length-1].version)+1;
    cmp.snapshots.push({ id:uid('snap'), version:v, generatedAt: nowISO(), mode:'current_summary', freshness:'current', note:'Refreshed snapshot.', changesSinceLast:['Refreshed against current evaluation results.'] });
    compareUi.snapIdx = cmp.snapshots.length-1;
    toast(T('Comparison refreshed — new snapshot created, prior snapshots kept'), 'success');
    renderRoute();
  }, 700);
};
A.addAnnotation = function(cmpId){
  const el = document.getElementById('new-annotation');
  const body = el.value.trim();
  if(!body) return;
  const cmp = state.db.comparisons[cmpId];
  cmp.annotations.push({ id:uid('ann'), author:state.currentUser, targetId:null, body, createdAt: nowISO() });
  renderRoute();
};
A.openAddToCompare = function(cmpId){
  const cmp = state.db.comparisons[cmpId];
  const others = getApplicationsForJob(cmp.jobId).filter(a=>!cmp.memberIds.includes(a.id));
  openModal(`
    <div class="modal-header"><h3 class="modal-title">${T('Add candidate to comparison')}</h3><button class="close-x" onclick="A.closeModal()"><span class="material-icons-o">close</span></button></div>
    <div class="modal-body">
      ${others.length ? others.map(a=>{ const c=getCandidate(a.candidateId); return `<div class="radio-card" style="margin-bottom:8px;" onclick="A.addToCompare('${cmpId}','${a.id}')">${candAvatar(c)}<div><div style="font-weight:500;">${esc(c.displayName)}</div></div></div>`; }).join('')
        : `<p class="tiny">${T('Every linked candidate for this job is already in the comparison.')}</p>`}
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="A.closeModal()">${T('Close')}</button></div>`);
};
A.addToCompare = function(cmpId, appId){
  const cmp = state.db.comparisons[cmpId];
  cmp.memberIds.push(appId);
  const v = cmp.snapshots[cmp.snapshots.length-1].version+1;
  cmp.snapshots.push({ id:uid('snap'), version:v, generatedAt:nowISO(), mode:'current_summary', freshness:'current', note:'Added a candidate to the set.', changesSinceLast:[`${getCandidate(getApplication(appId).candidateId).displayName} added to the comparison.`] });
  compareUi.snapIdx = cmp.snapshots.length-1;
  closeModal(); toast(T('Added to comparison'), 'success');
  renderRoute();
};
A.openExportCompare = function(cmpId){
  const cmp = state.db.comparisons[cmpId];
  const members = cmp.memberIds.map(id=>getCandidate(getApplication(id).candidateId));
  const needsSubset = members.length>4;
  openModal(`
    <div class="modal-header"><h3 class="modal-title">${T('Export comparison')}</h3><button class="close-x" onclick="A.closeModal()"><span class="material-icons-o">close</span></button></div>
    <div class="modal-body">
      <div class="field"><label>${T('Format')}</label>
        <div class="flex gap-8"><button class="btn btn-sm btn-primary" id="exp-fmt-png" onclick="A.setExportFmt('png')">${T('One-page PNG')}</button><button class="btn btn-sm btn-secondary" id="exp-fmt-pdf" onclick="A.setExportFmt('pdf')">${T('Full report PDF')}</button></div>
      </div>
      ${needsSubset ? `<div class="field"><label>${T('{n} members — choose a subset for the one-page export, or use the full report for everyone').replace('{n}',members.length)}</label>
        ${members.map((c,i)=>`<label class="checkbox-row" style="margin-bottom:6px;"><input type="checkbox" class="exp-member" value="${i}" ${i<4?'checked':''}> ${esc(c.displayName)}</label>`).join('')}
      </div>` : ''}
      <p class="tiny">${T('Export is scoped to your current permissions. Restricted evidence and contact details are excluded automatically.')}</p>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="A.closeModal()">${T('Cancel')}</button><button class="btn btn-primary" onclick="A.runExportCompare('${cmpId}')">${T('Export')}</button></div>`);
};
let exportFmt = 'png';
A.setExportFmt = function(f){ exportFmt=f; document.getElementById('exp-fmt-png').className='btn btn-sm '+(f==='png'?'btn-primary':'btn-secondary'); document.getElementById('exp-fmt-pdf').className='btn btn-sm '+(f==='pdf'?'btn-primary':'btn-secondary'); };
A.runExportCompare = function(cmpId){
  const checked = document.querySelectorAll('.exp-member:checked');
  if(exportFmt==='png' && checked.length && checked.length<document.querySelectorAll('.exp-member').length){
    toast(T('Exported one-page PNG for {n} selected candidates').replace('{n}',checked.length), 'success');
  } else {
    toast(T('Full comparison report exported (paginated)'), 'success');
  }
  state.db.activity.unshift({ id:uid('act'), op:'Download', actor:state.currentUser, target:'Comparison export ('+exportFmt.toUpperCase()+')', status:'succeeded', at: nowISO() });
  closeModal();
};

A.applyAllNextStep = function(cmpId, value){
  if(!value) return;
  const cmp = state.db.comparisons[cmpId];
  cmp.memberIds.forEach(appId=>{
    if(state.db.decisions[appId]) return;
    const sel = document.getElementById('ns-'+appId);
    if(sel){ sel.value = value; compareUi.nextStepDraft[appId]=value; }
  });
};
A.openSubmitNextSteps = function(cmpId){
  const cmp = state.db.comparisons[cmpId];
  const entries = Object.entries(compareUi.nextStepDraft).filter(([appId,v])=> v && cmp.memberIds.includes(appId) && !state.db.decisions[appId]);
  if(!entries.length){ toast(T('Choose at least one next step first'), 'error'); return; }
  const labelMap = { assessment:T('Send Assessment'), interview:T('Move to Interview'), request_information:T('Request Information'), hold:T('Hold'), do_not_advance:T('Do Not Advance') };
  openModal(`
    <div class="modal-header"><h3 class="modal-title">${T('Confirm next steps')}</h3><button class="close-x" onclick="A.closeModal()"><span class="material-icons-o">close</span></button></div>
    <div class="modal-body">
      <p class="tiny" style="margin-bottom:10px;">${T('Review the exact list before submitting. Each candidate is handled independently — a failure for one does not affect the others.')}</p>
      <table class="data-table"><thead><tr><th>${T('Candidate')}</th><th>${T('Action')}</th></tr></thead><tbody>
        ${entries.map(([appId,v])=>`<tr><td>${esc(getCandidate(getApplication(appId).candidateId).displayName)}</td><td>${labelMap[v]}</td></tr>`).join('')}
      </tbody></table>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="A.closeModal()">${T('Cancel')}</button><button class="btn btn-primary" onclick="A.confirmSubmitNextSteps('${cmpId}')">${T('Submit')}</button></div>`);
};
A.confirmSubmitNextSteps = function(cmpId){
  const cmp = state.db.comparisons[cmpId];
  const entries = Object.entries(compareUi.nextStepDraft).filter(([appId,v])=> v && cmp.memberIds.includes(appId) && !state.db.decisions[appId]);
  let assessmentCount=0, otherCount=0;
  entries.forEach(([appId,v])=>{
    const reasonMap = { assessment:'Selected via candidate comparison — proceeding to assessment.', interview:'Selected via candidate comparison — proceeding directly to interview.', request_information:'Selected via candidate comparison — requesting more information.', hold:'Selected via candidate comparison — holding for now.', do_not_advance:'Selected via candidate comparison — not advancing at this time.' };
    const outcome = v==='assessment'?'advance': v==='interview'?'advance': v==='request_information'?'request_information': v==='hold'?'hold':'do_not_advance';
    recordDecisionCore(appId, outcome, v==='assessment'?'assessment':v==='interview'?'interview':null, reasonMap[v]);
    if(v==='assessment'||v==='interview') assessmentCount++; else otherCount++;
  });
  compareUi.nextStepDraft = {};
  closeModal();
  toast(T('Submitted {n} next-step decision(s)').replace('{n}',entries.length), 'success');
  renderRoute();
};

registerRoute('#/comparisons/:id', renderComparePage);

</script>

<script>
/* ---- page_decision.js ---- */
/* ===================================================================
   PAGES: Decision & Next Steps, Packages & Delivery
   =================================================================== */

const OUTCOME_META = {
  strong_advance:{ label:'Strong Advance', needsTarget:true },
  advance:{ label:'Advance', needsTarget:true },
  hold:{ label:'Hold', needsTarget:false },
  do_not_advance:{ label:'Do Not Advance', needsTarget:false },
  request_information:{ label:'Request Information', needsTarget:false },
};

function renderDecisionPage(params){
  const app = getApplication(params.id);
  if(!app) return emptyState({icon:'search_off', title:T('Application not found')});
  const cand = getCandidate(app.candidateId);
  const job = getJob(app.jobId);
  const ev = getEvaluation(app.id);
  const decision = state.db.decisions[app.id];
  const assessment = state.db.assessments[app.id] || {status:'not_administered'};
  const delivery = state.db.deliveries.find(d=>d.applicationId===app.id);

  const crumbs = [{label:T('Jobs'),href:'#/jobs'},{label:job.title,href:'#/jobs/'+job.id+'/screening'},{label:cand.displayName,href:'#/applications/'+app.id},{label:T('Decision')}];

  if(decision){
    return `${pageHeader(T('Decision —')+' '+cand.displayName, job.title, `<a class="btn btn-secondary" href="#/applications/${app.id}">${T('Back to screening')}</a>`, crumbs)}
    <div class="card card-pad" style="margin-bottom:16px;">
      <div class="flex items-center gap-10" style="margin-bottom:8px;">${recBadge(decision.outcome)} ${decision.overrideAi?`<span class="badge badge-warning">${T('Overrides AI recommendation')}</span>`:''}</div>
      <p style="font-size:var(--fs-sm);"><strong>${T('Reason:')}</strong> ${esc(decision.reason)}</p>
      <p class="tiny">${T('Decided by')} ${esc(getPerson(decision.decidedBy).name)} · ${fmtDateTime(decision.decidedAt)} · ${T('Status:')} ${T(cap(decision.status.replace(/_/g,' ')))}</p>
      ${decision.exceptionRef ? `<p class="tiny" style="color:var(--warning-text);">${T('Exception approved by HR + HM to route around the required-assessment policy.')}</p>`:''}
    </div>
    ${delivery ? `<div class="card card-pad">
        <div class="section-title">${T('Package & delivery')}</div>
        <p style="font-size:var(--fs-sm);">${deliveryKindLabel(delivery.kind)} · <span class="badge ${deliveryStatusBadgeClass(delivery.status)}">${deliveryStatusLabel(delivery.status)}</span></p>
        <a class="btn btn-primary" href="#/deliveries/${delivery.id}">${T('Open package')}</a>
      </div>` : (decision.outcome==='do_not_advance'||decision.outcome==='hold') ? `
      <div class="card card-pad">
        <div class="section-title">${T('Report')}</div>
        <p class="tiny" style="margin-bottom:10px;">${T('You can still generate a review-only report, or send a decline notice to the candidate as a separate, explicit action.')}</p>
        <button class="btn btn-secondary" onclick="A.generateReviewOnlyPackage('${app.id}')">${T('Generate report (review only)')}</button>
        ${decision.outcome==='do_not_advance'?`<button class="btn btn-secondary" onclick="A.sendDeclineNotice('${app.id}')">${T('Send candidate decline notice')}</button>`:''}
      </div>` : `<div class="card card-pad"><p class="tiny">${T('Decision recorded without a downstream handoff yet. A task remains until a next step is either sent or explicitly closed as “no next step.”')}</p></div>`}
    `;
  }

  const aiRec = ev ? (ev.evaluationStatus==='insufficient_evidence'?'review':inferRecommendation(ev)) : null;

  return `${pageHeader(T('Decision & next steps —')+' '+cand.displayName, `${job.title} · ${T('This candidate’s decision only — Comparison and other candidates are unaffected.')}`, `<a class="btn btn-secondary" href="#/applications/${app.id}">${T('Back to screening')}</a>`, crumbs)}

  <div class="two-col" style="grid-template-columns:340px 1fr;">
    <div class="card card-pad">
      <div class="eyebrow" style="margin-bottom:8px;">${T('Snapshot')}</div>
      <div class="flex items-center gap-10" style="margin-bottom:8px;">${scoreRing(ev?ev.overall:null,'sm')}<div><div class="tiny">${T('Overall')}</div><div style="font-weight:600;">${ev&&scoreDisplay(ev.overall)!=null?scoreDisplay(ev.overall):T('Insufficient evidence')}</div></div></div>
      <p class="tiny">${T('Eligibility:')} ${ev?T(ELIG_LABEL[ev.eligibilityStatus]):'—'}</p>
      <p class="tiny">${T('AI recommendation:')} ${aiRec?T(REC_LABEL[aiRec]):'—'}</p>
      <p class="tiny">${T('Assessment:')} ${assessment.status==='completed'?T('Completed ({n}/100)').replace('{n}',assessment.score):T('Not administered')}</p>
      <p class="tiny">${T('Open concerns:')} ${getConcerns(app.id).filter(c=>c.status==='open').length}</p>
    </div>
    <div class="card card-pad">
      <div class="eyebrow" style="margin-bottom:10px;">${T('Choose an outcome')}</div>
      <div class="flex gap-8 flex-wrap" id="outcome-picker" style="margin-bottom:16px;">
        ${Object.entries(OUTCOME_META).map(([k,m])=>`<button class="btn btn-secondary" id="oc-${k}" onclick="A.pickOutcome('${app.id}','${k}')">${T(m.label)}</button>`).join('')}
      </div>
      <div id="decision-form-body"></div>
    </div>
  </div>`;
}

let decisionDraft = {};
A.pickOutcome = function(appId, outcome){
  decisionDraft = { outcome, target:null, exceptionRequested:false };
  Object.keys(OUTCOME_META).forEach(k=>{
    const btn = document.getElementById('oc-'+k);
    if(btn) btn.className = 'btn ' + (k===outcome?'btn-primary':'btn-secondary');
  });
  renderDecisionForm(appId);
};
function renderDecisionForm(appId){
  const app = getApplication(appId); const job = getJob(app.jobId); const assessment = state.db.assessments[appId]||{status:'not_administered'};
  const el = document.getElementById('decision-form-body');
  if(!decisionDraft.outcome){ el.innerHTML=''; return; }
  const meta = OUTCOME_META[decisionDraft.outcome];
  const requiredAssessment = job.workflowPolicy && job.workflowPolicy.assessmentDisposition==='required';
  const assessmentMissing = assessment.status!=='completed';

  el.innerHTML = `
    ${meta.needsTarget ? `
    <div class="field"><label>${T('Next-step target')}</label>
      <div class="flex gap-8 flex-wrap">
        <button class="btn btn-sm ${decisionDraft.target==='none'?'btn-primary':'btn-secondary'}" onclick="A.pickTarget('${appId}','none')">${T('Record only (no handoff yet)')}</button>
        <button class="btn btn-sm ${decisionDraft.target==='assessment'?'btn-primary':'btn-secondary'}" onclick="A.pickTarget('${appId}','assessment')">${T('Send Assessment')}</button>
        <button class="btn btn-sm ${decisionDraft.target==='interview'?'btn-primary':'btn-secondary'}" onclick="A.pickTarget('${appId}','interview')">${T('Move to Interview')}</button>
      </div>
    </div>
    ${decisionDraft.target==='interview' && requiredAssessment && assessmentMissing ? `
      <div class="error-inline" style="margin-bottom:14px;">
        <span class="material-icons-o">block</span>
        <div>${T('This job requires a completed Assessment before Interview.')} <label class="checkbox-row" style="margin-top:6px;"><input type="checkbox" onchange="decisionDraft.exceptionRequested=this.checked"> ${T('Request an exception (requires HR + HM approval)')}</label></div>
      </div>` : ''}
    ` : ''}
    <div class="field"><label>${T('Reason')}</label><textarea id="dec-reason" placeholder="${T('Required — explain the basis for this decision')}"></textarea></div>
    <button class="btn btn-primary" onclick="A.submitDecision('${appId}')">${T('Submit decision')}</button>
  `;
}
A.pickTarget = function(appId, target){ decisionDraft.target = target; renderDecisionForm(appId); };

A.submitDecision = function(appId){
  const app = getApplication(appId); const job = getJob(app.jobId); const ev = getEvaluation(appId);
  const reason = document.getElementById('dec-reason').value.trim();
  if(!reason){ toast(T('A reason is required'), 'error'); return; }
  const meta = OUTCOME_META[decisionDraft.outcome];
  if(meta.needsTarget && !decisionDraft.target){ toast(T('Choose a next-step target'), 'error'); return; }
  const requiredAssessment = job.workflowPolicy && job.workflowPolicy.assessmentDisposition==='required';
  const assessment = state.db.assessments[appId]||{status:'not_administered'};
  if(decisionDraft.target==='interview' && requiredAssessment && assessment.status!=='completed' && !decisionDraft.exceptionRequested){
    toast(T('Required assessment is missing — request an exception to proceed'), 'error'); return;
  }
  const aiRec = ev ? (ev.evaluationStatus==='insufficient_evidence'?'review':inferRecommendation(ev)) : null;
  const overrideAi = aiRec && aiRec!==decisionDraft.outcome && !(aiRec==='strong_advance'&&decisionDraft.outcome==='advance');

  const finalize = (exceptionRef)=>{
    const decision = { id:uid('dec'), applicationId:appId, outcome:decisionDraft.outcome, reason, decidedBy:state.currentUser, decidedAt:nowISO(), status:'approved', overrideAi:!!overrideAi, exceptionRef };
    state.db.decisions[appId] = decision;
    app.screeningStatus = 'decided';
    // complete next-step task
    const t = state.db.tasks.find(t=>t.candidateId===app.candidateId && t.jobId===app.jobId && (t.type==='next_step'||t.type==='screening_review') && t.status!=='completed');
    if(t){ t.status='completed'; t.completedAt=nowISO(); }
    state.db.audit.unshift({ id:uid('aud'), at:nowISO(), actor:state.currentUser, action:'Recorded decision — '+OUTCOME_META[decision.outcome].label, object:getCandidate(app.candidateId).displayName+' → '+job.title });

    if(decisionDraft.target==='assessment' || decisionDraft.target==='interview'){
      const delivId = uid('deliv');
      const kind = decisionDraft.target==='assessment' ? 'create_assessment' : 'create_interview';
      state.db.deliveries.push({ id:delivId, applicationId:appId, kind, transport:'email',
        targetLabel: decisionDraft.target==='assessment' ? 'assessments-intake@partner-vendor.demo' : 'interviews@partner-agency.demo',
        status:'prepared', createdAt: nowISO(), history:[{at:nowISO(), state:'Package ready'}] });
      toast(T('Decision recorded — package prepared for delivery'), 'success');
      navigate('#/deliveries/'+delivId);
    } else {
      toast(T('Decision recorded'), 'success');
      renderRoute();
    }
  };

  if(decisionDraft.exceptionRequested){
    confirmModal({ title:T('Approve exception — requires HR + HM'), body:T('Moving to Interview without a completed Assessment requires approval from both an HR and a Hiring Manager approver. In this demo, confirming records both approvals under this decision.'),
      confirmLabel:T('Approve exception & submit'), onConfirm:()=>{
        const excId = uid('exc');
        state.db.audit.unshift({ id:uid('aud'), at:nowISO(), actor:state.currentUser, action:'Approved required-assessment exception (HR+HM)', object:getCandidate(app.candidateId).displayName });
        finalize(excId);
      }});
    return;
  }
  finalize(null);
};

A.generateReviewOnlyPackage = function(appId){
  const id = uid('deliv');
  state.db.deliveries.push({ id, applicationId:appId, kind:'review_only', targetLabel:'Report on file (not routed — review only)', reviewStatus:'human_reviewed', status:'prepared', createdAt:nowISO(), history:[{at:nowISO(),state:'Package ready'}] });
  toast(T('Review-only report generated'), 'success');
  navigate('#/deliveries/'+id);
};
A.sendDeclineNotice = function(appId){
  confirmModal({ title:T('Send candidate decline notice'), body:T('This is a separate, explicit communication to the candidate. It does not change the recorded decision or any report already generated.'),
    confirmLabel:T('Send notice'), onConfirm:()=>{
      toast(T('Decline notice sent (demo) — logged independently of the decision'), 'success');
      state.db.audit.unshift({ id:uid('aud'), at:nowISO(), actor:state.currentUser, action:'Sent candidate decline notice', object:getCandidate(getApplication(appId).candidateId).displayName });
      renderRoute();
    }});
};

/* Shared quick-decision entry used from Compare page */
A.quickNextStep = function(appId, outcome, target){
  decisionDraft = { outcome, target: target||'none', exceptionRequested:false };
  navigate('#/applications/'+appId+'/decision');
};

/* Reusable decision recorder — used by Compare's batch next-step submission.
   Skips the required-assessment exception UI; batch actions from Compare are
   only offered for targets that don't need it (assessment / hold / etc). */
function recordDecisionCore(appId, outcome, target, reason){
  const app = getApplication(appId); const job = getJob(app.jobId);
  const decision = { id:uid('dec'), applicationId:appId, outcome, reason, decidedBy:state.currentUser, decidedAt:nowISO(), status:'approved', overrideAi:false };
  state.db.decisions[appId] = decision;
  app.screeningStatus = 'decided';
  const t = state.db.tasks.find(t=>t.candidateId===app.candidateId && t.jobId===app.jobId && (t.type==='next_step'||t.type==='screening_review') && t.status!=='completed');
  if(t){ t.status='completed'; t.completedAt=nowISO(); }
  state.db.audit.unshift({ id:uid('aud'), at:nowISO(), actor:state.currentUser, action:'Recorded decision — '+OUTCOME_META[outcome].label, object:getCandidate(app.candidateId).displayName+' → '+job.title });
  let delivId = null;
  if(target==='assessment' || target==='interview'){
    delivId = uid('deliv');
    state.db.deliveries.push({ id:delivId, applicationId:appId, kind: target==='assessment'?'create_assessment':'create_interview', transport:'email',
      targetLabel: target==='assessment' ? 'assessments-intake@partner-vendor.demo' : 'interviews@partner-agency.demo',
      status:'prepared', createdAt: nowISO(), history:[{at:nowISO(), state:'Package ready'}] });
  }
  return { decision, delivId };
}

/* ---------- Packages & Delivery ---------- */
function deliveryKindLabel(k){ return T({create_assessment:'Send Assessment', create_interview:'Move to Interview', review_only:'Review-only report'}[k]||k); }
function deliveryStatusLabel(s){ return T({prepared:'Package ready',queued:'Queued',submitted:'Submitted',delivered:'Delivered',awaiting_confirmation:'Delivered — awaiting confirmation',failed:'Failed',received:'Received / Imported'}[s]||cap(s)); }
function deliveryStatusBadgeClass(s){ return {prepared:'badge-outline',queued:'badge-info',submitted:'badge-info',delivered:'badge-success',awaiting_confirmation:'badge-warning',failed:'badge-danger',received:'badge-success'}[s]||'badge-outline'; }

function renderDeliveriesListPage(){
  const all = state.db.deliveries.slice().sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  return `${pageHeader(T('Packages & Delivery'), T('Every prepared, sent, delivered and received package — including reports that were never routed anywhere.'), '', [{label:T('Jobs'),href:'#/jobs'},{label:T('Deliveries')}])}
  <div class="card"><table class="data-table">
    <thead><tr><th>${T('Candidate')}</th><th>${T('Job')}</th><th>${T('Kind')}</th><th>${T('Transport')}</th><th>${T('Status')}</th><th>${T('Created')}</th><th></th></tr></thead>
    <tbody>${all.map(d=>{
      const cand = d.historical? {displayName:d.candidateLabel} : getCandidate(getApplication(d.applicationId).candidateId);
      const job = d.historical? {title:d.jobLabel} : getJob(getApplication(d.applicationId).jobId);
      return `<tr class="clickable" onclick="A.nav('#/deliveries/${d.id}')">
        <td>${esc(cand.displayName)}</td><td class="tiny">${esc(job.title)}</td><td>${deliveryKindLabel(d.kind)}</td><td class="tiny">${esc(d.transport||'—')}</td>
        <td><span class="badge ${deliveryStatusBadgeClass(d.status)}">${deliveryStatusLabel(d.status)}</span></td><td class="tiny">${fmtDate(d.createdAt)}</td>
        <td class="text-right"><a class="btn btn-sm btn-secondary" href="#/deliveries/${d.id}" onclick="event.stopPropagation()">${T('Open', 'Open (action)')}</a></td></tr>`;
    }).join('')}</tbody></table></div>`;
}

function renderDeliveryDetailPage(params){
  const d = state.db.deliveries.find(x=>x.id===params.id);
  if(!d) return emptyState({icon:'search_off', title:T('Delivery not found')});
  const cand = d.historical? {displayName:d.candidateLabel, id:null} : getCandidate(getApplication(d.applicationId).candidateId);
  const job = d.historical? {title:d.jobLabel} : getJob(getApplication(d.applicationId).jobId);
  const app = d.historical? null : getApplication(d.applicationId);
  const ev = app ? getEvaluation(app.id) : null;

  return `${pageHeader(T('Package —')+' '+cand.displayName, job.title, `<a class="btn btn-secondary" href="#/deliveries">${T('All deliveries')}</a>${cand.id?` <a class="btn btn-secondary" href="#/applications/${app.id}">${T('Open screening')}</a>`:''}`, [{label:T('Deliveries'),href:'#/deliveries'},{label:cand.displayName}])}

  <div class="two-col" style="grid-template-columns:1fr 320px;">
    <div class="card card-pad">
      <div class="eyebrow" style="margin-bottom:10px;">${T('Package preview')}</div>
      <p style="font-size:var(--fs-sm);"><strong>${T('Requested action:')}</strong> ${deliveryKindLabel(d.kind)}</p>
      <p style="font-size:var(--fs-sm);"><strong>${T('Target:', 'Target: (delivery)')}</strong> ${esc(d.targetLabel)}</p>
      ${ev ? `<p style="font-size:var(--fs-sm);"><strong>${T('Evaluation snapshot:')}</strong> ${T('Overall')} ${scoreDisplay(ev.overall)==null?T('Insufficient evidence'):scoreDisplay(ev.overall)}, ${T('coverage')} ${pct(ev.coverage)}, ${T('eligibility')} ${T(ELIG_LABEL[ev.eligibilityStatus])}</p>`:''}
      <p style="font-size:var(--fs-sm);"><strong>${T('Access limitations:')}</strong> ${T('Contact details and internal ranking are excluded from candidate-facing content; restricted evidence is redacted for recipients without HR/HM access.')}</p>
      ${d.reviewStatus ? `<p style="font-size:var(--fs-sm);"><strong>${T('Review status:')}</strong> ${T(cap(d.reviewStatus.replace(/_/g,' ')))}</p>`:''}
      <div class="divider"></div>
      <div class="tiny" style="font-weight:600;margin-bottom:6px;">${T('Manifest')}</div>
      <ul style="margin:0;padding-left:18px;font-size:var(--fs-sm);"><li>manifest.json</li><li>payload.json</li><li>report.md (${T('independently readable summary')})</li>${d.kind!=='review_only'?'<li>verification_items.json</li>':''}</ul>
    </div>
    <div class="card card-pad">
      <div class="eyebrow" style="margin-bottom:10px;">${T('Timeline')}</div>
      <div class="flex-col gap-10">
        ${d.history.map(h=>`<div class="flex items-center gap-8"><span class="dot-indicator" style="background:var(--accent-500);"></span><div><div style="font-size:var(--fs-sm);">${T(h.state)}</div><div class="tiny">${fmtDateTime(h.at)}</div></div></div>`).join('')}
      </div>
      <div class="divider"></div>
      ${renderDeliveryActions(d)}
    </div>
  </div>`;
}
function renderDeliveryActions(d){
  if(d.kind==='review_only'){
    return `<button class="btn btn-secondary w-full" onclick="A.downloadPackage('${d.id}')"><span class="material-icons-o">download</span>${T('Download report')}</button>`;
  }
  if(d.status==='prepared'){
    return `<button class="btn btn-primary w-full" onclick="A.sendDelivery('${d.id}')"><span class="material-icons-o">send</span>${T('Send (demo)')}</button>
      <button class="btn btn-secondary w-full" style="margin-top:8px;" onclick="A.downloadPackage('${d.id}')"><span class="material-icons-o">download</span>${T('Download instead')}</button>`;
  }
  if(d.status==='failed'){
    return `<div class="error-inline" style="margin-bottom:10px;"><span class="material-icons-o">error_outline</span>${T('Delivery failed — mailbox not found.')}</div><button class="btn btn-primary w-full" onclick="A.retryDelivery('${d.id}')">${T('Retry delivery')}</button>`;
  }
  if(d.status==='awaiting_confirmation'){
    return `<p class="tiny" style="margin-bottom:10px;">${T('Delivered — no receipt yet. This is shown as “awaiting confirmation,” not as received.')}</p><button class="btn btn-secondary w-full" onclick="A.retryDelivery('${d.id}')">${T('Resend')}</button>`;
  }
  if(d.status==='delivered' || d.status==='received'){
    return `<p class="tiny">${T('This delivery has completed. Failed items can be retried without re-running the evaluation, link, or invitation.')}</p>`;
  }
  return `<p class="tiny">${T('In progress…')}</p>`;
}
A.sendDelivery = function(id){
  const d = state.db.deliveries.find(x=>x.id===id);
  d.status='queued'; d.history.push({at:nowISO(), state:'Queued'});
  toast(T('Queued for delivery'));
  renderRoute();
  setTimeout(()=>{ d.status='submitted'; d.history.push({at:nowISO(), state:'Submitted'}); if(location.hash.includes(id)) renderRoute(); }, 700);
  setTimeout(()=>{ d.status='awaiting_confirmation'; d.history.push({at:nowISO(), state:'Delivered — awaiting confirmation'}); if(location.hash.includes(id)) renderRoute(); toast(T('Delivered — awaiting confirmation'), 'success'); }, 1500);
};
A.retryDelivery = function(id){
  const d = state.db.deliveries.find(x=>x.id===id);
  d.status='queued'; d.history.push({at:nowISO(), state:'Retry — Queued'});
  renderRoute();
  setTimeout(()=>{ d.status='delivered'; d.history.push({at:nowISO(), state:'Delivered'}); if(location.hash.includes(id)) renderRoute(); toast(T('Delivered'), 'success'); }, 900);
};
A.downloadPackage = function(id){
  toast(T('Preparing download…'));
  state.db.activity.unshift({ id:uid('act'), op:'Download', actor:state.currentUser, target:'Screening package', status:'succeeded', at: nowISO() });
  setTimeout(()=> toast(T('File sent to your browser (demo — no real file transferred)'), 'success'), 600);
};

registerRoute('#/applications/:id/decision', renderDecisionPage);
registerRoute('#/deliveries', renderDeliveriesListPage);
registerRoute('#/deliveries/:id', renderDeliveryDetailPage);

</script>

<script>
/* ---- page_files_settings.js ---- */
/* ===================================================================
   PAGES: Files & Integrations, Preferences, AI Models
   =================================================================== */

let filesTab = 'files';
function renderFilesPage(){
  const tabs = [{id:'files',label:'Files'},{id:'connections',label:'Connections'},{id:'activity',label:'Activity'}];
  return `${pageHeader(T('Files & Integrations'), T('Where material comes from, whether it was read successfully, and what happened to it — independent of any one candidate or job.'), '', [{label:T('Files & Integrations')}])}
  <div class="underline-tabs">${tabs.map(t=>`<div class="u-tab ${filesTab===t.id?'active':''}" onclick="A.setFilesTab('${t.id}')">${T(t.label)}</div>`).join('')}</div>
  ${filesTab==='files'?renderFilesTab():filesTab==='connections'?renderConnectionsTab():renderActivityTab()}`;
}
A.setFilesTab = function(t){ filesTab=t; renderRoute(); };

function renderFilesTab(){
  const files = state.db.files.slice().sort((a,b)=>new Date(b.uploadedAt)-new Date(a.uploadedAt));
  return `
  <div class="flex items-center justify-between" style="margin-bottom:12px;">
    <span class="tiny muted">${files.length} ${T('files')}</span>
    <a class="btn btn-primary" href="#/imports/new"><span class="material-icons-o">upload</span>${T('Upload')}</a>
  </div>
  <div class="card"><table class="data-table">
    <thead><tr><th>${T('Name', 'Name (file)')}</th><th>${T('Type')}</th><th>${T('Source')}</th><th>${T('Uploaded')}</th><th>${T('Read')}</th><th>${T('Extraction')}</th><th>${T('Security')}</th><th>${T('Linked to')}</th><th></th></tr></thead>
    <tbody>${files.map(f=>`<tr>
      <td><div class="flex items-center gap-8"><span class="material-icons-o" style="font-size:18px;color:var(--text-tertiary);">description</span>${esc(f.name)}</div></td>
      <td class="tiny">${esc(f.type)}</td><td class="tiny">${esc(f.source)}</td><td class="tiny">${fmtDate(f.uploadedAt)}</td>
      <td>${f.readStatus==='available'?`<span class="badge badge-success">${T('Available')}</span>`:'<span class="badge badge-outline">'+T(cap(f.readStatus))+'</span>'}</td>
      <td>${f.extraction==='complete'?`<span class="badge badge-success">${T('Complete')}</span>`:'<span class="badge badge-warning">'+T(cap(f.extraction))+'</span>'}</td>
      <td>${f.security==='passed'?`<span class="badge badge-success">${T('Passed')}</span>`:'<span class="badge badge-danger">'+T(cap(f.security))+'</span>'}</td>
      <td class="tiny">${esc(T(f.linked))}</td>
      <td class="text-right"><button class="btn btn-sm btn-secondary" onclick="A.previewFile('${f.id}')">${T('Preview')}</button> <button class="btn btn-sm btn-secondary" onclick="A.downloadFile('${f.id}')">${T('Download')}</button></td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}
A.previewFile = function(id){
  const f = state.db.files.find(x=>x.id===id);
  const linkedName = f.linked.replace(/\s*\([^)]*\)\s*$/,'');
  let candidate = Object.values(state.db.candidates).find(c=>c.displayName===linkedName);
  if(f.linked.includes('Finance')) candidate = Object.values(state.db.candidates).find(c=>c.displayName===linkedName && c.tags.includes('Finance')) || candidate;
  const extractedContent = candidate ? `
    <div class="card card-pad" style="background:var(--surface-2);">
      <div class="eyebrow">${T('Extracted resume content')}</div>
      <h2 style="margin:6px 0 2px;font-size:20px;">${esc(candidate.displayName)}</h2>
      <div class="tiny">${esc(candidate.contact.email)} · ${esc(candidate.contact.phone)} · ${esc(candidate.contact.location.value)}</div>
      <div class="divider"></div>
      <h3 class="section-title">${T('Experience')}</h3>
      ${candidate.employment.map(job=>`<section style="margin-bottom:16px;">
        <div style="font-weight:700;">${esc(job.title)} · ${esc(job.company)}</div>
        <div class="tiny mono" style="margin:2px 0 6px;">${esc(job.start)} — ${esc(job.end)}</div>
        <ul style="margin:0;padding-left:18px;">${job.achievements.map(item=>`<li style="margin-bottom:4px;">${esc(item)}</li>`).join('')}</ul>
      </section>`).join('')}
      <h3 class="section-title">${T('Skills')}</h3>
      <div class="flex gap-6 flex-wrap">${candidate.skills.map(skill=>`<span class="tag">${esc(skill)}</span>`).join('')}</div>
      <div class="divider"></div>
      <h3 class="section-title">${T('Education')}</h3>
      ${candidate.education.map(item=>`<div><div>${esc(item.statement)}</div><div class="tiny mono">${esc(item.period)}</div></div>`).join('')}
    </div>` : `<div class="card card-pad" style="text-align:center;padding:44px 20px;background:var(--surface-2);">
      <span class="material-icons-o" style="font-size:44px;color:var(--text-tertiary);">description</span>
      <p class="tiny" style="margin-top:10px;">${T('Structured source preview is not available for this file type in the prototype.')}</p>
    </div>`;
  openDrawer(`<div class="drawer-header"><h3 class="modal-title">${esc(f.name)}</h3><button class="close-x" onclick="A.closeDrawer()"><span class="material-icons-o">close</span></button></div>
  <div class="drawer-body">${extractedContent}
  <table class="data-table" style="margin-top:14px;"><tbody><tr><td class="tiny">${T('Type')}</td><td>${esc(f.type)}</td></tr><tr><td class="tiny">${T('Size')}</td><td>${f.sizeKB} KB</td></tr><tr><td class="tiny">${T('Source')}</td><td>${esc(f.source)}</td></tr><tr><td class="tiny">${T('Read')}</td><td>${esc(T(cap(f.readStatus)))}</td></tr><tr><td class="tiny">${T('Extraction')}</td><td>${esc(T(cap(f.extraction)))}</td></tr><tr><td class="tiny">${T('Linked to')}</td><td>${esc(T(f.linked))}</td></tr></tbody></table></div>
  <div class="drawer-footer"><button class="btn btn-secondary" onclick="A.closeDrawer()">${T('Close')}</button><button class="btn btn-primary" onclick="A.downloadFile('${f.id}')">${T('Download')}</button></div>`);
  state.db.activity.unshift({ id:uid('act'), op:'Preview', actor:state.currentUser, target:f.name, status:'succeeded', at: nowISO() });
};
A.downloadFile = function(id){
  const f = state.db.files.find(x=>x.id===id);
  toast(T('Preparing download…'));
  state.db.activity.unshift({ id:uid('act'), op:'Download', actor:state.currentUser, target:f.name, status:'succeeded', at: nowISO() });
  setTimeout(()=> toast(T('File sent to your browser (demo)'), 'success'), 500);
};

function renderConnectionsTab(){
  const kindIcon = { email:'mail_outline', folder:'folder_open', api:'api' };
  return `<div class="card">${state.db.connections.map(c=>`
    <div class="list-row" style="padding:14px 16px;">
      <span class="material-icons-o">${kindIcon[c.kind]}</span>
      <div style="flex:1;"><div style="font-weight:500;">${esc(c.name)}</div><div class="tiny">${esc(c.account)} · ${esc(c.scope)} · ${T('Last read')} ${relTime(c.lastRead)}</div></div>
      ${connStatusBadge(c.status)}
      ${c.status==='authorization_required' ? `<button class="btn btn-sm btn-secondary" onclick="A.reauthConn('${c.id}')">${T('Reconnect')}</button>`
        : `<button class="btn btn-sm btn-secondary" onclick="A.readNow('${c.id}')">${T('Read now')}</button><button class="btn btn-sm btn-secondary" onclick="A.pauseConn('${c.id}')">${c.status==='paused'?T('Resume'):T('Pause')}</button>`}
    </div>`).join('')}</div>`;
}
function connStatusBadge(s){
  if(s==='connected'||s==='watching') return `<span class="badge badge-success">${T(cap(s))}</span>`;
  if(s==='authorization_required') return `<span class="badge badge-danger">${T('Authorization required')}</span>`;
  if(s==='paused') return `<span class="badge badge-warning">${T('Paused')}</span>`;
  return `<span class="badge badge-outline">${T(cap(s))}</span>`;
}
function renderActivityTab(){
  const rows = state.db.activity.slice().sort((a,b)=>new Date(b.at)-new Date(a.at));
  return `<div class="card"><table class="data-table">
    <thead><tr><th>${T('Operation')}</th><th>${T('Actor')}</th><th>${T('Target')}</th><th>${T('Status')}</th><th>${T('When')}</th></tr></thead>
    <tbody>${rows.map(a=>`<tr><td>${esc(a.op)}</td><td class="tiny">${typeof a.actor==='string' && state.db.people[a.actor] ? esc(getPerson(a.actor).name) : esc(a.actor)}</td><td class="tiny">${esc(a.target)}</td>
      <td>${a.status==='succeeded'?`<span class="badge badge-success">${T('Succeeded')}</span>`:a.status==='partial'?`<span class="badge badge-warning">${T('Partially succeeded')}</span>`:`<span class="badge badge-danger">${T('Failed')}</span>`}${a.detail?' <span class="tiny">('+esc(a.detail)+')</span>':''}</td>
      <td class="tiny">${relTime(a.at)}</td></tr>`).join('')}</tbody>
  </table></div>`;
}

/* ---------- Preferences ---------- */
function renderPreferencesPage(){
  const P = state.db.preferences;
  return `${pageHeader(T('Preferences'), T('Organization and Team layers govern official scoring. Personal views never change team results.'), '', [{label:T('Settings'),href:'#/settings/preferences'},{label:T('Preferences')}])}
  <div class="two-col" style="grid-template-columns:1fr 1fr;">
    ${renderPrefLayer(P.organization)}
    ${renderPrefLayer(P.team)}
    ${renderPrefLayer(P.role)}
    ${renderPrefLayer(P.user)}
  </div>

  <div class="section-block" style="margin-top:24px;">
    <div class="section-title">${T('Feedback signals')} <span class="tiny" style="font-weight:400;">${T('(from shortlist/advance/override actions)')}</span></div>
    <div class="card"><table class="data-table"><thead><tr><th>${T('Feature')}</th><th>${T('Direction')}</th><th>${T('Strength')}</th><th>${T('Source')}</th><th>${T('Eligibility')}</th></tr></thead>
      <tbody>${P.signals.map(s=>`<tr><td>${esc(s.feature)}</td><td class="tiny">${T(cap(s.direction))}</td><td>${pct(s.strength)}</td><td class="tiny">${esc(s.source)}</td>
        <td>${s.eligibility==='eligible'?`<span class="badge badge-success">${T('Eligible')}</span>`:`<span class="badge badge-danger">${T('Prohibited — excluded')}</span>`}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>

  <div class="section-block">
    <div class="section-title">${T('Proposed shared preferences')} <span class="tiny" style="font-weight:400;">${T('(pending review)')}</span></div>
    <div class="card">${P.proposed.length ? P.proposed.map(pr=>`
      <div class="card-pad" style="border-bottom:1px solid var(--border);">
        <div class="flex items-center justify-between flex-wrap gap-8">
          <div><div style="font-weight:500;font-size:var(--fs-sm);">${esc(pr.title)}</div>
            <div class="tiny">${T('Basis:')} ${esc(pr.basis)} · ${T('Sample size')} ${pr.sampleSize} · ${esc(pr.window)}</div></div>
          <div class="flex gap-6">
            ${state.currentUser==='morgan' ? `<button class="btn btn-sm btn-secondary" onclick="A.reviewProposal('${pr.id}','rejected')">${T('Reject')}</button><button class="btn btn-sm btn-primary" onclick="A.reviewProposal('${pr.id}','activated')">${T('Activate new version')}</button>`
              : `<span class="badge badge-info">${T('Awaiting Admin review')}</span>`}
          </div>
        </div>
      </div>`).join('') : `<div class="card-pad tiny">${T('No proposals pending.')}</div>`}</div>
  </div>

  <div class="section-block">
    <div class="section-title">${T('Version history')}</div>
    <div class="card"><table class="data-table"><thead><tr><th>${T('Version')}</th><th>${T('Activated')}</th><th>${T('By')}</th><th></th></tr></thead>
      <tbody>${P.versions.map(v=>`<tr><td>${esc(v.label)}</td><td class="tiny">${fmtDate(v.activatedAt)}</td><td class="tiny">${esc(getPerson(v.activatedBy).name)}</td>
        <td class="text-right">${v.label.includes('current')?'':'<button class=\"btn btn-sm btn-secondary\" onclick=\"A.rollbackPref()\">'+T('Roll back to this')+'</button>'}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}
function renderPrefLayer(layer){
  return `<div class="card card-pad">
    <div class="flex items-center justify-between"><div style="font-weight:600;font-size:var(--fs-sm);">${esc(layer.scope)}</div><span class="badge badge-success">${T(cap(layer.status))}</span></div>
    ${layer.pointerOnly ? `<p class="tiny" style="margin-top:8px;">${T('Points to the job’s confirmed rubric — see')} <a href="#/jobs/job-a/criteria">${T('Requirements & rubric')}</a>.</p>`
      : `<ul style="margin:8px 0 0;padding-left:18px;font-size:var(--fs-sm);">${(layer.rules||[]).map(r=>`<li>${esc(r.feature)}${r.weightAdjustment?' — '+esc(r.weightAdjustment):''}${r.locked?` <span class="badge badge-outline">${T('Locked')}</span>`:''}</li>`).join('')}</ul>`}
  </div>`;
}
A.reviewProposal = function(id, outcome){
  const P = state.db.preferences;
  const idx = P.proposed.findIndex(p=>p.id===id);
  const pr = P.proposed[idx];
  if(outcome==='activated'){
    const newVer = 'v'+(P.versions.length+1);
    P.versions.unshift({ id:uid('v'), label:newVer+' (current)', activatedAt:nowISO(), activatedBy:state.currentUser });
    P.versions.forEach((v,i)=>{ if(i>0) v.label = v.label.replace(' (current)',''); });
    P.team.rules.push({ feature: pr.title.replace('Proposed: ',''), weightAdjustment:'Activated from proposal' });
    toast(T('New shared preference version activated'), 'success');
  } else {
    toast(T('Proposal rejected — no change to active preferences'), 'default');
  }
  P.proposed.splice(idx,1);
  renderRoute();
};
A.rollbackPref = function(){ toast(T('Rolled back — a new version was created pointing at the prior configuration'), 'success'); renderRoute(); };

/* ---------- AI Models ---------- */
let aiTab = 'catalog';
function renderAiModelsPage(){
  const M = state.db.aiModels;
  const tabs = [{id:'catalog',label:'Catalog'},{id:'policies',label:'Task policies'},{id:'usage',label:'Usage'},{id:'activity',label:'Activity'}];
  return `${pageHeader(T('AI Models'), T('Model routing, budgets and quality gates for every AI-assisted task in Screening.'), '', [{label:T('Settings'),href:'#/settings/preferences'},{label:T('AI Models')}])}
  <div class="underline-tabs">${tabs.map(t=>`<div class="u-tab ${aiTab===t.id?'active':''}" onclick="A.setAiTab('${t.id}')">${T(t.label)}</div>`).join('')}</div>
  ${aiTab==='catalog'?renderAiCatalog(M):aiTab==='policies'?renderAiPolicies(M):aiTab==='usage'?renderAiUsage(M):renderAiActivity(M)}`;
}
A.setAiTab = function(t){ aiTab=t; renderRoute(); };
function renderAiCatalog(M){
  return `<div class="card"><table class="data-table"><thead><tr><th>${T('Provider')}</th><th>${T('Model')}</th><th>${T('Status')}</th><th>${T('Region')}</th><th>${T('Data class')}</th></tr></thead>
    <tbody>${M.catalog.map(m=>`<tr><td class="tiny">${esc(m.provider)}</td><td>${esc(m.model)}</td>
      <td>${m.status==='active'?`<span class="badge badge-success">${T('Active')}</span>`:`<span class="badge badge-outline">${T('Not evaluated')}</span>`}</td>
      <td class="tiny">${m.region.toUpperCase()}</td><td class="tiny">${T(cap(m.dataClass))}</td></tr>`).join('')}</tbody>
  </table></div>
  <p class="tiny" style="margin-top:10px;">${T('All pricing, latency and quality figures in this section are sample data for the prototype.')}</p>`;
}
function renderAiPolicies(M){
  return `<div class="card"><table class="data-table"><thead><tr><th>${T('Task type')}</th><th>${T('Primary model')}</th><th>${T('Fallback')}</th><th>${T('Monthly budget')}</th><th>${T('Quality gate')}</th></tr></thead>
    <tbody>${M.taskPolicies.map(p=>`<tr><td>${esc(p.taskType)}</td><td class="tiny">${esc((M.catalog.find(m=>m.id===p.primary)||{}).model||'—')}</td>
      <td class="tiny">${p.fallback? esc((M.catalog.find(m=>m.id===p.fallback)||{}).model) : '—'}</td><td>$${p.budgetMonthly}</td>
      <td>${p.qualityGate==='passed'?`<span class="badge badge-success">${T('Passed')}</span>`:`<span class="badge badge-warning">${T('Needs review')}</span>`}</td></tr>`).join('')}</tbody>
  </table></div>`;
}
function renderAiUsage(M){
  return `<div class="card"><table class="data-table"><thead><tr><th>${T('Task type')}</th><th>${T('Calls (30d, sample)')}</th><th>${T('P95 latency')}</th><th>${T('Cost (sample)')}</th></tr></thead>
    <tbody>${M.usage.map(u=>`<tr><td>${esc(u.taskType)}</td><td>${u.calls30d}</td><td>${u.p95LatencyMs} ms</td><td>$${u.costUsd.toFixed(2)}</td></tr>`).join('')}</tbody>
  </table></div>`;
}
function renderAiActivity(M){
  const iconMap={fallback:'swap_horiz',budget:'account_balance_wallet',region_blocked:'block',quality:'fact_check'};
  return `<div class="card">${M.events.map(e=>`<div class="list-row" style="padding:12px 16px;"><span class="material-icons-o">${iconMap[e.type]||'info'}</span><div style="flex:1;font-size:var(--fs-sm);">${esc(e.detail)}</div><span class="tiny">${relTime(e.at)}</span></div>`).join('')}</div>`;
}
