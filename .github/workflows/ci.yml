name: CI
run-name: 'Review before merge · PR #${{ github.event.pull_request.number }} · ${{ github.event.pull_request.head.sha || github.sha }}'

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Select changed projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test .github/scripts/automation.test.cjs .github/scripts/post-merge.test.cjs .github/scripts/issue-contract.test.cjs .github/scripts/qa-environment.test.cjs
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # Push to main and manual runs check every project; PRs check only touched ones.
        run: node .github/scripts/projects.cjs $BASE $HEAD

  projects:
    name: ${{ matrix.name }}
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    services:
      postgres:
        # An empty image skips the service, so only projects with "database": true get one.
        image: ${{ matrix.database && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hireos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ${{ matrix.dir }}
      - if: matrix.prisma
        run: npx prisma generate
        working-directory: ${{ matrix.dir }}
      - name: Build, lint, typecheck, test
        env:
          DIR: ${{ matrix.dir }}
          CHECKS: ${{ toJSON(matrix.checks) }}
          KNOWN: ${{ toJSON(matrix.known_failing) }}
          DATABASE: ${{ matrix.database }}
        # Every check runs even after a failure so one run reports all of them.
        run: |
          mkdir -p evidence
          # Integration tests create their own schema per run inside this throwaway database.
          if [ "$DATABASE" = true ]; then export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/hireos_test; fi
          failed=0
          for check in $(jq -r '.[]' <<<"$CHECKS"); do
            known=$(jq --arg c "$check" 'index($c) != null' <<<"$KNOWN")
            echo "::group::$check (known_failing=$known)"
            .github/scripts/run-check.sh "$DIR" "$check" "$known" > "evidence/$check.log" 2>&1 || failed=1
            cat "evidence/$check.log"
            echo "::endgroup::"
          done
          exit $failed
      - name: Preserve project evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ matrix.name }}
          path: |
            evidence/
            ${{ matrix.dir }}/coverage/
            ${{ matrix.dir }}/test-results/
            ${{ matrix.dir }}/playwright-report/
          if-no-files-found: ignore
          retention-days: 30

  checks:
    name: Base checks
    needs: [detect, projects]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require applicable project checks
        env:
          DETECT: ${{ needs.detect.result }}
          ANY: ${{ needs.detect.outputs.any }}
          PROJECTS: ${{ needs.projects.result }}
        run: |
          test "$DETECT" = success
          if [ "$ANY" = true ]; then test "$PROJECTS" = success; else test "$PROJECTS" = skipped; fi

  classify:
    name: Issue contract and PR classification
    runs-on: ubuntu-latest
    outputs:
      evidence: ${{ steps.scope.outputs.evidence }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load trusted classification and context rules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted
          persist-credentials: false
          sparse-checkout: /.github/
          sparse-checkout-cone-mode: false
      - id: scope
        uses: actions/github-script@v7
        with:
          script: |
            let evidence = false;
            if (context.eventName === 'pull_request') {
              evidence = await require('./.trusted/.github/scripts/evidence-pr.cjs')({ github, repo: context.repo, pr: context.payload.pull_request });
              if (!evidence) await require('./.trusted/.github/scripts/context.cjs')({ github, context });
            }
            core.setOutput('evidence', String(evidence));
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && steps.scope.outputs.evidence == 'false'
        with:
          name: contract-context
          path: evidence/context.json
          retention-days: 30

  review:
    needs: [checks, classify]
    if: github.event_name == 'pull_request' && needs.classify.outputs.evidence == 'false'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/codex-review.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  gate:
    name: Merge gate
    if: always()
    needs: [checks, classify, review]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Require every applicable stage to pass
        env:
          CHECKS: ${{ needs.checks.result }}
          CLASSIFICATION: ${{ needs.classify.result }}
          EVIDENCE: ${{ needs.classify.outputs.evidence }}
          REVIEW: ${{ needs.review.result }}
          EVENT: ${{ github.event_name }}
        run: node .github/scripts/merge-gate.cjs
