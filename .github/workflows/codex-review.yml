name: Codex Review

on:
  workflow_call:
    secrets:
      OPENAI_API_KEY:
        required: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  review:
    name: Codex Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require supported PR and credentials
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          test "$SAME_REPO" = true || { echo '::error::Use a supervised same-repository branch for Codex checks'; exit 1; }
          test -n "$API_KEY" || { echo '::error::Configure OPENAI_API_KEY'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Load trusted review rules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted
          persist-credentials: false
          sparse-checkout: /.github/
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: contract-context
          path: evidence/
      - name: Run Codex Review
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .trusted/.github/prompts/review.md
          output-file: evidence/review.json
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-args: '["--output-schema", ".trusted/.github/schemas/review.json"]'
      - name: Validate report and enforce verdict
        run: node .trusted/.github/scripts/report.cjs review evidence/review.json evidence/context.json
      - name: Preserve report and raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-review
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
