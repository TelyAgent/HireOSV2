name: Codex QA
run-name: 'QA after merge · PR #${{ github.event.number }} · ${{ github.event.pull_request.merge_commit_sha }}'

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: post-merge-qa-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  target:
    name: Resolve merged QA target
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.target.outputs.eligible }}
      commit: ${{ steps.target.outputs.commit }}
    steps:
      # Resolve scope with the trusted default-branch scripts before executing the target.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: target
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/post-merge.cjs').prepareTarget({ github, context, core });

  qa:
    name: Codex QA
    needs: target
    if: needs.target.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require credentials
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$API_KEY" || { echo '::error::Configure OPENAI_API_KEY'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load merged Issue contract and PR changes
        uses: actions/github-script@v7
        env:
          QA_COMMIT: ${{ needs.target.outputs.commit }}
        with:
          script: |
            await require('./.github/scripts/context.cjs')({ github, context, phase: 'qa', commit: process.env.QA_COMMIT });
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Run Codex QA
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/prompts/qa.md
          output-file: evidence/qa.json
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--output-schema", ".github/schemas/qa.json"]'
      - name: Validate report and enforce verdict
        run: node .github/scripts/report.cjs qa evidence/qa.json evidence/context.json
      - name: Preserve report and raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-qa
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
