name: Legacy Claude QA

# Batch QA for one Issue (#39): runs after merge, against the merge commit of the PR that closed
# the Issue, and posts the result on the Issue. Called by qa-batch.yml; no longer part of PR CI.
on:
  workflow_call:
    inputs:
      issue:
        description: Issue number to verify
        required: true
        type: number
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: read

env:
  QA_MODEL: claude-opus-5-5

jobs:
  prepare:
    name: 'Issue #${{ inputs.issue }} context'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      commit: ${{ steps.context.outputs.commit }}
      base: ${{ steps.context.outputs.base }}
    steps:
      # Scripts come from the default branch, never from the code under test.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: /.github/
          sparse-checkout-cone-mode: false
      - name: Find the merged PR and check the Issue contract
        id: context
        uses: actions/github-script@v7
        env:
          ISSUE: ${{ inputs.issue }}
        with:
          script: |
            await require('./.github/scripts/batch-context.cjs')({ github, context, core, issueNumber: process.env.ISSUE });
      - uses: actions/upload-artifact@v4
        with:
          name: qa-context-${{ inputs.issue }}
          path: evidence/context.json
          retention-days: 30

  qa:
    name: 'Claude QA #${{ inputs.issue }}'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hireos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Require credentials
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: test -n "$API_KEY$OAUTH" || { echo '::error::Configure ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # QA rules come from the default branch so the code under test cannot loosen its own acceptance.
      - name: Check out trusted QA rules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted
          persist-credentials: false
          sparse-checkout: /.github/
          sparse-checkout-cone-mode: false
      - id: rules
        run: |
          dir=.trusted/.github
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "schema=$(jq -c . "$dir/schemas/qa.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: qa-context-${{ inputs.issue }}
          path: evidence
      - name: Record touched projects
        env:
          BASE: ${{ needs.prepare.outputs.base }}
          HEAD: ${{ needs.prepare.outputs.commit }}
        # Same selection as PR CI, applied to the merged PR's diff.
        run: |
          node -e '
            const { loadProjects, selectProjects } = require("./.trusted/.github/scripts/projects.cjs");
            const { execFileSync } = require("node:child_process");
            const files = execFileSync("git", ["diff", "--name-only", `${process.env.BASE}...${process.env.HEAD}`], { encoding: "utf8" }).split("\n").filter(Boolean);
            const registry = require("node:path").resolve(".github/ci/projects.json");
            process.stdout.write(JSON.stringify(selectProjects(loadProjects(registry), files)));
          ' > evidence/projects.json
          cat evidence/projects.json
      - name: Run Claude QA
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hireos_test
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Follow ${{ steps.rules.outputs.dir }}/prompts/qa.md exactly; it overrides any other
            copy in the repository. Context is in evidence/context.json and evidence/projects.json.
            Ignore everything else under .trusted/; it is not part of the PR.
          # Can run npm/node and write tests, but has no git push, network fetch or gh tools.
          claude_args: |
            --model ${{ env.QA_MODEL }}
            --max-turns 120
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(cd:*),Bash(ls:*),Bash(mkdir:*),Bash(npm --prefix:*),Bash(npx --prefix:*),Bash(node --test:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*)"
            --json-schema '${{ steps.rules.outputs.schema }}'
      - name: Save structured report
        if: always()
        env:
          REPORT: ${{ steps.claude.outputs.structured_output }}
        run: |
          test -n "$REPORT" || { echo '::error::Claude produced no structured output'; exit 1; }
          printf '%s' "$REPORT" > evidence/qa.json
      - name: Keep temporary tests as evidence and refuse product-code edits
        if: always()
        run: |
          git add -N -- . ':!evidence' ':!.trusted' 2>/dev/null || true
          git diff -- . ':!evidence' ':!.trusted' > evidence/qa-workspace.patch || true
          changed=$(git diff --name-only -- . ':!evidence' ':!.trusted' | grep -vE '(^|/)test/' || true)
          if [ -n "$changed" ]; then echo "::error::QA modified product files:"; echo "$changed"; exit 1; fi
      - name: Validate report and enforce verdict
        run: node ${{ steps.rules.outputs.dir }}/scripts/report.cjs qa evidence/qa.json evidence/context.json
      - name: Preserve report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-qa-${{ inputs.issue }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: 'Publish QA on #${{ inputs.issue }}'
    needs: [prepare, qa]
    # A failed contract/lookup has no context to validate against; the prepare job's error says why.
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: /.github/
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: qa-context-${{ inputs.issue }}
          path: evidence/context
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: claude-qa-${{ inputs.issue }}
          path: evidence/qa
      - uses: actions/github-script@v7
        env:
          ISSUE: ${{ inputs.issue }}
        with:
          script: |
            const publish = require('./.github/scripts/publish-review.cjs');
            await publish({ github, context, core, kind: 'qa', target: Number(process.env.ISSUE),
              contextPath: 'evidence/context/context.json', reportPath: 'evidence/qa/qa.json' });
