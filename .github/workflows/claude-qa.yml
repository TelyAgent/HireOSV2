name: Claude QA

on:
  workflow_call:
    inputs:
      projects:
        description: JSON matrix of the subprojects this PR touches (from detect)
        required: true
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: read

env:
  QA_MODEL: claude-opus-5-5

jobs:
  qa:
    name: Claude QA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hireos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Require supported PR and credentials
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          test "$SAME_REPO" = true || { echo '::error::Use a supervised same-repository branch for AI checks'; exit 1; }
          test -n "$API_KEY$OAUTH" || { echo '::error::Configure ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # QA rules come from the default branch so a PR cannot loosen its own acceptance.
      - name: Check out trusted QA rules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted
          persist-credentials: false
          sparse-checkout: /.github/
          sparse-checkout-cone-mode: false
      - id: rules
        # Bootstrap only: before QA exists on the default branch, fall back to the PR's copy.
        run: |
          if [ -f .trusted/.github/prompts/qa.md ]; then dir=.trusted/.github; else
            dir=.github; echo '::warning::QA rules not on the default branch yet; using this PR'"'"'s copy (bootstrap).'; fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "schema=$(jq -c . "$dir/schemas/qa.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: contract-context
          path: evidence
      - name: Record touched projects
        env:
          PROJECTS: ${{ inputs.projects }}
        run: jq '.include' <<<"$PROJECTS" > evidence/projects.json
      - name: Run Claude QA
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hireos_test
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Follow ${{ steps.rules.outputs.dir }}/prompts/qa.md exactly; it overrides any other
            copy in the repository. Context is in evidence/context.json and evidence/projects.json.
            Ignore everything else under .trusted/; it is not part of the PR.
          # Can run npm/node and write tests, but has no git push, network fetch or gh tools.
          claude_args: |
            --model ${{ env.QA_MODEL }}
            --max-turns 120
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(cd:*),Bash(ls:*),Bash(mkdir:*),Bash(npm --prefix:*),Bash(npx --prefix:*),Bash(node --test:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*)"
            --json-schema '${{ steps.rules.outputs.schema }}'
      - name: Save structured report
        if: always()
        env:
          REPORT: ${{ steps.claude.outputs.structured_output }}
        run: |
          test -n "$REPORT" || { echo '::error::Claude produced no structured output'; exit 1; }
          printf '%s' "$REPORT" > evidence/qa.json
      - name: Keep temporary tests as evidence and refuse product-code edits
        if: always()
        run: |
          git add -N -- . ':!evidence' ':!.trusted' 2>/dev/null || true
          git diff -- . ':!evidence' ':!.trusted' > evidence/qa-workspace.patch || true
          changed=$(git diff --name-only -- . ':!evidence' ':!.trusted' | grep -vE '(^|/)test/' || true)
          if [ -n "$changed" ]; then echo "::error::QA modified product files:"; echo "$changed"; exit 1; fi
      - name: Validate report and enforce verdict
        run: node ${{ steps.rules.outputs.dir }}/scripts/report.cjs qa evidence/qa.json evidence/context.json
      - name: Preserve report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-qa
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
